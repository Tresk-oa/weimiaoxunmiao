        sfx('swipe');
        for (let i = 0; i < 10; i++) {
          const a2 = ang + rnd(-.65, .65);
          addParticle({
            x: e.x + Math.cos(a2) * rnd(30, range), y: e.y + Math.sin(a2) * rnd(30, range),
            vx: Math.cos(a2) * rnd(80, 180), vy: Math.sin(a2) * rnd(80, 180),
            life: rnd(.15, .3), max: .3, size: rnd(3, 7), color: C.lavender, type: 'spark',
            rot: a2, vr: 6, drag: .8,
          });
        }
      }
      if (e.actionT <= 0) { e.action = 'idle'; e.attackTimer = 1.8; e.didWhipHit = false; }
      return;
    }
    if (d > 300) enemyMoveChase(e, dt, .8, .1);
    else if (d < 170) {
      const a2 = toP + Math.PI;
      moveWorld(e, Math.cos(a2) * e.speed * enemySlowMul(e) * dt, Math.sin(a2) * e.speed * enemySlowMul(e) * dt);
    } else {
      moveWorld(e, Math.cos(toP + e.wobbleSign * Math.PI / 2) * e.speed * .5 * enemySlowMul(e) * dt,
        Math.sin(toP + e.wobbleSign * Math.PI / 2) * e.speed * .5 * enemySlowMul(e) * dt);
    }
    if (e.attackTimer <= 0 && d < 300) {
      e.action = 'whip'; e.actionT = .55; e.didWhipHit = false;
      showToast(e.name + ' 伸出了触手！', C.lavender, .8);
    }
    return;
  }

  enemyMoveChase(e, dt, 1, .1);
}

function updateBossAI(e, dt) {
  e.attackTimer -= dt;
  e.patternTimer -= dt;
  const toP = Math.atan2(player.y - e.y, player.x - e.x);

  if (e.action === 'windBarrage') {
    e.actionT -= dt;
    if (e.actionT <= 0) {
      e.action = 'idle';
      e.attackTimer = e.enraged ? 1.7 : 2.5;
      fireBossBarrage(e);
    }
    return;
  }
  if (e.action === 'windMissiles') {
    e.actionT -= dt;
    if (e.actionT <= 0) {
      e.action = 'idle';
      e.attackTimer = e.enraged ? 1.6 : 2.2;
      fireBossMissiles(e);
    }
    return;
  }
  if (e.action === 'windCharge') {
    e.actionT -= dt;
    e.chargeAngle = toP;
    if (e.actionT <= 0) {
      e.action = 'charge'; e.actionT = e.enraged ? .62 : .52;
      sfx('boss');
    }
    return;
  }
  if (e.action === 'charge') {
    e.actionT -= dt;
    const blocked = moveWorld(e, Math.cos(e.chargeAngle) * 500 * dt, Math.sin(e.chargeAngle) * 500 * dt);
    if (blocked || e.actionT <= 0) {
      e.action = blocked ? 'stun' : 'idle';
      e.actionT = blocked ? .9 : 0;
      e.attackTimer = 1.6;
      if (blocked) { shake = Math.max(shake, 12); sfx('stomp'); }
    }
    return;
  }
  if (e.action === 'stun') {
    e.actionT -= dt;
    if (e.actionT <= 0) e.action = 'idle';
    return;
  }
  if (e.action === 'roar') {
    e.actionT -= dt;
    if (e.actionT <= 0) { e.action = 'idle'; e.attackTimer = 1.4; }
    return;
  }
  if (e.action === 'teleport') {
    e.actionT -= dt;
    if (e.actionT <= 0.12) {
      const a = rnd(0, TAU);
      e.x = player.x + Math.cos(a) * rnd(180, 330);
      e.y = player.y + Math.sin(a) * rnd(150, 300);
      e.x = clamp(e.x, INNER.x + e.r, INNER.right - e.r);
      e.y = clamp(e.y, INNER.y + e.r, INNER.bottom - e.r);
      rings.push({ x: e.x, y: e.y, r0: 10, r1: 120, life: 0, max: .5, color: withAlpha(C.lavender, .65), width: 10, ink: true });
      sfx('evolve', .8);
      e.action = 'idle'; e.attackTimer = 1.2;
    }
    return;
  }

  enemyMoveChase(e, dt, e.enraged ? 1.16 : 1, .04);

  if (e.hp < e.maxHp * .5 && !e.enraged) {
    e.enraged = true;
    e.action = 'roar'; e.actionT = .9;
    shake = 20; flash = .25; flashColor = C.coral;
    showToast(`${e.name} 发怒了！`, C.coral, 2.3);
    sfx('boss');
    rings.push({ x: e.x, y: e.y, r0: 30, r1: 300, life: 0, max: .9, color: withAlpha(C.coral, .65), width: 14, ink: true });
    shockwaves.push({ x: e.x, y: e.y, radius: 30, maxRadius: 260, life: 0, max: .5, friendly: false, damage: e.damage * .8, color: C.coral });
    // 每章 Boss 发怒时召唤本章小怪，保持章节整体风格一致。
    const module = moduleForStage(run.stage);
    for (let i = 0; i < 2; i++) {
      const sp = findSpawnPoint(true);
      spawnEnemy(module.mobs[(i + e.skillIndex) % module.mobs.length], sp.x, sp.y, 1.0 + i * .3);
    }
    return;
  }

  if (e.attackTimer <= 0) {
    e.skillIndex++;
    if (e.ai === 'bossPudding') {
      if (e.skillIndex % 2 === 1) {
        e.action = 'windBarrage'; e.actionT = e.enraged ? .45 : .62;
        showToast('巨型布丁猫 在搅拌焦糖…', C.gold, .9);
      } else {
        e.action = 'windCharge'; e.actionT = e.enraged ? .5 : .7;
        showToast('巨型布丁猫 朝你滑过来了！', C.coral, .95);
      }
    } else if (e.ai === 'bossMech') {
      if (e.skillIndex % 2 === 1) {
        e.action = 'windMissiles'; e.actionT = e.enraged ? .45 : .6;
        showToast('机械猫王 装填了猫爪导弹！', C.gold, .95);
      } else {
        e.action = 'windBarrage'; e.actionT = e.enraged ? .45 : .6;
        showToast('机械猫王 撒出了一圈齿轮！', C.gold, .95);
      }
    } else {
      if (e.skillIndex % 2 === 1) {
        e.action = 'windBarrage'; e.actionT = e.enraged ? .4 : .55;
        showToast('万眼猫神 睁开了更多眼睛…', C.lavender, .95);
      } else {
        e.action = 'teleport'; e.actionT = .45;
      }
    }
  }
}

function fireBossBarrage(e) {
  const baseA = Math.atan2(player.y - e.y, player.x - e.x);
  const kind = e.projectile;
  const count = e.ai === 'bossEye' ? (e.enraged ? 18 : 14) : (e.enraged ? 14 : 10);
  for (let i = 0; i < count; i++) {
    const a = baseA + (i / count) * TAU;
    enemyShoot(e, a, {
      speed: e.enraged ? 245 : 210,
      radius: kind === 'gear' ? 12 : 11,
      damage: Math.round(e.damage * .55),
      kind,
      life: 5.2,
      color: projectileColorFor(e),
      offset: e.r * .9,
    });
  }
  for (let i = -1; i <= 1; i++) {
    enemyShoot(e, baseA + i * .14, {
      speed: 300, radius: 11, damage: Math.round(e.damage * .5),
      kind, life: 4.4, color: C.coral,
    });
  }
  sfx('shoot');
  shake = Math.max(shake, 8);
  rings.push({ x: e.x, y: e.y, r0: 20, r1: 150, life: 0, max: .45, color: withAlpha(C.gold, .65), width: 8, ink: false });
  for (let i = 0; i < 20; i++) addParticle({
    x: e.x, y: e.y, vx: rnd(-220, 220), vy: rnd(-150, 150), life: rnd(.2, .5),
    max: .5, size: rnd(3, 9), color: rndPick([C.gold, C.coral, C.cream]), type: 'spark',
    rot: rnd(0, TAU), vr: rnd(-5, 5), drag: .8,
  });
}

function fireBossMissiles(e) {
  const baseA = Math.atan2(player.y - e.y, player.x - e.x);
  const count = e.enraged ? 5 : 3;
  for (let i = 0; i < count; i++) {
    const a = baseA + (i - (count - 1) / 2) * .2;
    enemyShoot(e, a, {
      speed: 330, radius: 14, damage: Math.round(e.damage * .75),
      kind: 'shell', life: 3.8, color: '#ffb347', offset: e.r,
    });
  }
  sfx('shoot');
  shake = Math.max(shake, 7);
  rings.push({ x: e.x, y: e.y, r0: 16, r1: 110, life: 0, max: .38, color: withAlpha(C.gold, .6), width: 7, ink: false });
}

function addProjectile(opts) {
  projectiles.push({
    x: opts.x, y: opts.y,
    vx: Math.cos(opts.angle) * opts.speed,
    vy: Math.sin(opts.angle) * opts.speed,
    angle: opts.angle, speed: opts.speed,
    radius: opts.radius || 9,
    damage: opts.damage || 1,
    friendly: !!opts.friendly,
    kind: opts.kind || 'bone',
    life: opts.life || 3,
    pierce: opts.pierce === undefined ? 1 : opts.pierce,
    hits: 0,
    hitIds: new Set(),
    color: opts.color || C.pink,
    spin: opts.kind === 'fish' ? 1.4 : 8,
    rot: opts.angle,
    maxLife: opts.life || 3,
  });
}

function updateProjectiles(dt) {
  const alive = [];
  for (const pr of projectiles) {
    pr.life -= dt;
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    pr.rot += dt * pr.spin;
    if (pr.life <= 0 || pr.x < INNER.x - 40 || pr.x > INNER.right + 40 || pr.y < INNER.y - 40 || pr.y > INNER.bottom + 40) continue;
    if (room && room.obstacles.some(o => dist2(pr.x, pr.y, o.x, o.y) < (o.r + pr.radius * .5) ** 2)) {
      addProjectileImpact(pr, true);
      continue;
    }
    if (pr.friendly) {
      let removed = false;
      for (const e of enemies) {
        if (e.dead || e.spawnTimer > 0 || pr.hitIds.has(e.uid)) continue;
        if (dist2(pr.x, pr.y, e.x, e.y) < (e.r + pr.radius) ** 2) {
          pr.hitIds.add(e.uid);
          pr.hits++;
          damageEnemy(e, pr.damage, { fromX: pr.x - pr.vx * .02, fromY: pr.y - pr.vy * .02, kb: 130, kind: 'projectile' });
          addProjectileImpact(pr, false);
          if (pr.hits >= pr.pierce) { removed = true; break; }
        }
      }
      if (removed) continue;
    } else {
      if (player && !player.dead && dist2(pr.x, pr.y, player.x, player.y) < (player.r + pr.radius) ** 2) {
        if (player.invuln <= 0) hurtPlayer(pr.damage, pr.x, pr.y, 'projectile');
        continue;
      }
    }
    alive.push(pr);
  }
  projectiles = alive;
}

function addProjectileImpact(pr, wall) {
  const n = wall ? 5 : 7;
  for (let i = 0; i < n; i++) addParticle({
    x: pr.x, y: pr.y, vx: rnd(-110, 110), vy: rnd(-110, 60),
    life: rnd(.1, .3), max: .3, size: rnd(2, 6),
    color: rndPick([pr.color, C.cream, C.white]), type: 'spark',
    rot: rnd(0, TAU), vr: rnd(-4, 4), drag: .8,
  });
}

function updatePickups(dt) {
  const alive = [];
  for (const pk of pickups) {
    pk.age += dt;
    const d = dist(player, pk);
    if (pk.age > .22 && (d < player.magnetRadius || pk.attracted)) {
      pk.attracted = true;
      const a = Math.atan2(player.y - pk.y, player.x - pk.x);
      const sp = 210 + (player.magnetRadius - Math.min(player.magnetRadius, d)) * 2.2 + pk.age * 18;
      pk.vx = lerp(pk.vx, Math.cos(a) * sp, .12);
      pk.vy = lerp(pk.vy, Math.sin(a) * sp, .12);
    } else {
      pk.vx *= Math.pow(.22, dt);
      pk.vy *= Math.pow(.22, dt);
    }
    pk.x += pk.vx * dt;
    pk.y += pk.vy * dt;
    if (pk.x < INNER.x + 8) pk.x = INNER.x + 8;
    if (pk.x > INNER.right - 8) pk.x = INNER.right - 8;
    if (pk.y < INNER.y + 8) pk.y = INNER.y + 8;
    if (pk.y > INNER.bottom - 8) pk.y = INNER.bottom - 8;
    if (player && !player.dead && dist2(pk.x, pk.y, player.x, player.y) < (player.r + 13) ** 2) {
      collectPickup(pk);
      continue;
    }
    alive.push(pk);
  }
  pickups = alive;
}

function collectPickup(pk) {
  if (pk.dead) return;
  pk.dead = true;
  const xp = pk.value * (player.xpMul || 1);
  const pxp = pk.value;
  player.xp += xp;
  run.scorePickups += pxp;
  run.score += pxp;
  sfx(pk.type === 'coin' ? 'coin' : 'pickup', pk.type === 'fish' ? 1.12 : 1);
  addFloater(pk.x, pk.y - 12, pk.type === 'coin' ? `+${pxp} XP  金币!` : `+${pxp} XP`, pk.type === 'coin' ? C.gold : C.mint, pk.type === 'coin' ? 13 : 11);
  for (let i = 0; i < (pk.type === 'coin' ? 10 : 5); i++) addParticle({
    x: pk.x, y: pk.y, vx: rnd(-80, 80), vy: rnd(-110, 10),
    life: rnd(.16, .4), max: .4, size: rnd(2, 6),
    color: rndPick([C.gold, C.mint, C.cream]), type: 'spark', rot: rnd(0, TAU), vr: rnd(-4, 4), drag: .8,
  });
  checkLevelUp();
}

function checkLevelUp() {
  const p = player;
  let gained = 0;
  while (p.xp >= p.xpNeed) {
    p.xp -= p.xpNeed;
    p.level++;
    p.xpNeed = BALANCE.xpCurve(p.level);
    run.pendingLevelUps++;
    gained++;
    p.upgradeFx = 1;
    addBurst(p.x, p.y, C.gold, 34, 260);
    rings.push({ x: p.x, y: p.y, r0: 20, r1: 210, life: 0, max: .7, color: withAlpha(C.gold, .7), width: 10, ink: true });
    shake = Math.max(shake, 9);
    flash = Math.max(flash, .16);
    flashColor = C.gold;
    sfx('level');
    evolveIfNeeded();
  }
  if (gained > 0) {
    showBanner(`LEVEL UP!`, `猫猫等级 ${p.level} · 选择新的怪招`, C.gold, 1.8);
    if (state === 'playing') openUpgrade();
  }
}

function evolveIfNeeded() {
  const p = player;
  let target = p.form || 0;
  // 配置可在线追加进化阶：从最高阶往下找第一个达到解锁等级的阶段。
  for (let i = FORMS.length - 1; i >= 0; i--) {
    if (p.level >= FORMS[i].unlockLevel) { target = i; break; }
  }
  if (target <= p.form) return;
  const fromB = FORMS[p.form].bonus;
  const toB = FORMS[target].bonus;
  const dh = toB.hp - fromB.hp;
  const dd = toB.damage - fromB.damage;
  const ds = toB.speed - fromB.speed;
  const dr = toB.range - fromB.range;
  const da = toB.arc - fromB.arc;
  const dc = toB.crit - fromB.crit;
  p.form = target;
  p.r = FORMS[target].radius;
  p.maxHp += dh;
  p.hp = Math.min(p.maxHp, p.hp + dh + Math.round(p.maxHp * .22));
  p.attackDamage += dd;
  p.moveSpeed += ds;
  p.attackRange += dr;
  p.attackArc += da;
  p.critChance += dc;
  p.evolved = true;
  run.pendingEvolution = true;
  addBurst(p.x, p.y, FORMS[target].trim, 54, 340);
  addBurst(p.x, p.y, FORMS[target].accent, 32, 250);
  for (let i = 0; i < 3; i++) rings.push({
    x: p.x, y: p.y, r0: 16 + i * 24, r1: 160 + i * 50,
    life: 0, max: .9 + i * .15, color: withAlpha(FORMS[target].trim, .7), width: 9, ink: false,
  });
  flash = Math.max(flash, .32);
  flashColor = FORMS[target].trim;
  shake = Math.max(shake, 14);
  sfx('evolve');
}

function upgradeWeight(u) {
  if (u.rarity === 'rare') return 1.05;
  if (u.rarity === 'uncommon') return 1.8;
  return 2.55;
}

function makeUpgradeCards() {
  const choices = [];
  const curLevel = id => run.upgradeStacks[id] || 0;

  // 合成卡：两技能均达到配方等级、且配方未做过时，优先保证出现一张。
  const recipes = SKILL_RECIPES.filter(recipe => {
    if (run.recipesDone[recipe.id]) return false;
    if (curLevel(recipe.a) < recipe.need || curLevel(recipe.b) < recipe.need) return false;
    if (curLevel(recipe.result) > 0) return false;
    return true;
  });
  if (recipes.length && choices.length < 3) {
    const recipe = rndPick(recipes);
    choices.push({
      kind: 'recipe', id: recipe.id, recipe,
      name: recipe.name, icon: recipe.icon, rarity: 'rare', color: recipe.color,
      desc: recipe.desc, level: 0, maxLevel: 1,
    });
  }

  // 普通技能池：满级（已质变）的技能一律不再出现。
  // 衍生技在合成获得后也进入普通池，才能继续升到 4 级触发质变。
  const available = SKILLS.filter(u => curLevel(u.id) < 4 && (!u.derived || curLevel(u.id) > 0));
  const pool = available.slice();
  while (choices.length < 3 && pool.length) {
    let total = pool.reduce((s, u) => s + upgradeWeight(u), 0);
    let r = rnd(0, total);
    let idx = 0;
    for (let i = 0; i < pool.length; i++) {
      r -= upgradeWeight(pool[i]);
      if (r <= 0) { idx = i; break; }
      idx = i;
    }
    const skill = pool.splice(idx, 1)[0];
    const lv = curLevel(skill.id);
    choices.push({
      kind: 'skill', id: skill.id, skill,
      name: lv >= 3 ? skill.mutateName : skill.name,
      icon: skill.icon, rarity: skill.rarity, color: skill.color,
      desc: lv >= 3 ? skill.mutateDesc : `Lv.${lv} → Lv.${lv + 1}：${skill.desc}`,
      level: lv, maxLevel: 4, mutate: lv >= 3,
    });
  }
  // 极端情况下所有技能都满级，提供一次性的小鱼干选项。
  while (choices.length < 3) {
    const heal = 28 + choices.length * 8;
    choices.push({
      kind: 'snack', id: `snack_${choices.length}`, name: '应急小鱼干', icon: 'vamp', rarity: 'common',
      color: C.coral, desc: `立即回复 ${heal} 点生命与少量分数。`,
      level: 0, maxLevel: 1, temporary: true,
      apply(p2) { p2.hp = Math.min(p2.maxHp, p2.hp + heal); run.score += 50; },
    });
  }
  return choices;
}

function openUpgrade() {
  if (!player || player.dead || run.pendingLevelUps <= 0) return;
  state = 'upgrade';
  // §14.1：升级界面弹出的一瞬间就彻底清掉震屏/闪白/受击暗角。
  // draw() 在 upgrade 状态下只绘制菜单层，主世界不再渲染，避免双重抖动。
  shake = 0;
  flash = 0;
  hitVignette = 0;
  upgradeCards = makeUpgradeCards();
  modalOpenTime = 0;
  modalHover = -1;
  sfx('level');
  player.invuln = Math.max(player.invuln, .3);
}

let modalHover = -1;

function applySkillLevel(skill, level) {
  skill.apply(player, level);
  run.upgradeStacks[skill.id] = level;
  if (skill.id === 'shadow_cat') syncClones();
  if (player.form < FORMS.length - 1 && player.level >= (player.form + 1) * 4) {
    // 进化阈值由 grantXP 管理；这里保持外观与属性同步。
    player.r = FORMS[player.form].radius;
  }
}

function selectUpgrade(index) {
  if (state !== 'upgrade') return;
  const u = upgradeCards[index];
  if (!u) return;
  let title = u.name;
  let mutated = false;
  if (u.kind === 'skill') {
    const skill = u.skill;
    const next = (run.upgradeStacks[skill.id] || 0) + 1;
    applySkillLevel(skill, next);
    mutated = next === 4;
    if (mutated) title = skill.mutateName;
  } else if (u.kind === 'recipe') {
    run.recipesDone[u.recipe.id] = true;
    const result = SKILL_BY_ID[u.recipe.result];
    if (result && (run.upgradeStacks[result.id] || 0) < 4) {
      applySkillLevel(result, 1);
      buildFloater(`合成：${result.name}`, u.color);
    }
    title = u.recipe.name;
  } else {
    u.apply(player);
  }
  run.pendingLevelUps = Math.max(0, run.pendingLevelUps - 1);
  addBurst(player.x, player.y, u.color, mutated ? 42 : 26, mutated ? 320 : 220);
  addFloater(player.x, player.y - 52, title, u.color, mutated ? 22 : 16);
  if (mutated) {
    showBanner('满级质变！', title + ' · ' + SKILL_BY_ID[u.id].mutateDesc, u.color, 2.6);
    shake = Math.max(shake, 8);
    flash = Math.max(flash, .18);
    flashColor = u.color;
  }
  showToast(mutated ? `质变：${title}` : (u.kind === 'recipe' ? `合成成功：${title}` : `获得技能：${title}`), u.color, 1.9);
  sfx(mutated ? 'evolve' : 'evolve', 1);
  if (run.pendingLevelUps > 0) {
    openUpgrade();
  } else {
    state = 'playing';
    if (run.pendingEvolution) {
      run.pendingEvolution = false;
      const f = FORMS[player.form];
      showBanner(`进化 · ${f.name}`, f.tip, f.trim, 2.7);
      sfx('evolve');
    }
    clickCooldown = .18;
  }
}

function buildFloater(text, color) {
  addFloater(player.x, player.y - 80, text, color, 15);
}

let clickCooldown = 0;

function syncClones() {
  while (clones.length < player.cloneLevel) {
    clones.push({
      id: clones.length, x: player.x, y: player.y, angle: rnd(0, TAU),
      attackTimer: .7, attackAnim: 0, aim: 0, dead: false, playerForm: player.form,
    });
  }
  while (clones.length > player.cloneLevel) clones.pop();
}

function updateClones(dt) {
  if (!player || player.dead) return;
  const p = player;
  for (const c of clones) {
    c.playerForm = p.form;
    c.angle += dt * .65;
    const slant = c.angle + c.id * Math.PI;
    const tx = p.x + Math.cos(slant) * (44 + p.r * .5) - Math.cos(p.aim) * 10;
    const ty = p.y + Math.sin(slant) * (28 + p.r * .25) + p.r * .15;
    c.x = lerp(c.x, tx, 1 - Math.pow(.002, dt));
    c.y = lerp(c.y, ty, 1 - Math.pow(.002, dt));
    c.attackTimer -= dt;
    c.attackAnim = Math.max(0, c.attackAnim - dt);
    if (c.attackTimer <= 0) {
      let target = null;
      let best = 180;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = dist(c, e);
        if (d < best) { best = d; target = e; }
      }
      if (target) {
        c.attackTimer = .95 + rnd(0, .25);
        c.attackAnim = .2;
        c.aim = Math.atan2(target.y - c.y, target.x - c.x);
        damageEnemy(target, p.attackDamage * .5, { fromX: c.x, fromY: c.y, kb: 70, noCrit: false });
        rings.push({ x: c.x, y: c.y, r0: 6, r1: 60, life: 0, max: .28, color: withAlpha(C.lavender, .6), width: 4, ink: false });
      } else {
        c.attackTimer = .25;
      }
    }
  }
}

function updateShockwaves(dt) {
  const alive = [];
  for (const sw of shockwaves) {
    sw.life += dt;
    sw.radius = lerp(24, sw.maxRadius, easeOut(sw.life / sw.max));
    if (sw.friendly) {
      for (const e of enemies) {
        if (e.dead || sw.hitIds.has(e.uid)) continue;
        if (dist2(sw.x, sw.y, e.x, e.y) < (sw.radius + e.r) ** 2) {
          sw.hitIds.add(e.uid);
          damageEnemy(e, sw.damage, { fromX: sw.x, fromY: sw.y, kb: 170, kind: 'thorn' });
        }
      }
    } else if (!sw.hitPlayer && player && !player.dead && dist2(sw.x, sw.y, player.x, player.y) < (sw.radius + player.r * .75) ** 2) {
      sw.hitPlayer = true;
      hurtPlayer(sw.damage, sw.x, sw.y, 'shockwave');
    }
    if (sw.life < sw.max) alive.push(sw);
  }
  shockwaves = alive;
}

function addParticle(o) {
  // §12 手机自动降特效：触摸端保留更少粒子，稳定 60FPS。
  if (particles.length > (touchActive ? 210 : 340)) particles.shift();
  particles.push(Object.assign({
    life: .4, max: .4, size: 5, color: C.cream, type: 'circle',
    rot: 0, vr: 0, gravity: 0, drag: .85, alpha: 1,
  }, o));
}

function addBurst(x, y, color, count = 18, power = 220) {
  if (touchActive) count = Math.max(6, Math.round(count * .6));
  for (let i = 0; i < count; i++) {
    const a = rnd(0, TAU);
    const sp = rnd(power * .2, power);
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rnd(.25, .85), max: .85, size: rnd(2, 10), color,
      type: rndPick(['star', 'spark', 'circle', 'heart']), rot: rnd(0, TAU),
      vr: rnd(-7, 7), gravity: 20, drag: .8,
    });
  }
}

function addFloater(x, y, text, color = C.white, size = 14) {
  floaters.push({ x, y, text, color, size, life: .8, max: .8, vy: -58, vx: rnd(-14, 14), stroke: true });
  if (floaters.length > 80) floaters.shift();
}

function updateEffects(dt) {
  const aliveParticles = [];
  for (const p of particles) {
    p.life -= dt;
    if (p.life <= 0) continue;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.gravity || 0) * dt;
    const drag = p.drag === undefined ? .85 : p.drag;
    p.vx *= Math.pow(drag, dt);
    p.vy *= Math.pow(drag, dt);
    p.rot += (p.vr || 0) * dt;
    aliveParticles.push(p);
  }
  particles = aliveParticles;

  for (const f of floaters) {
    f.life -= dt;
    f.y += f.vy * dt;
    f.x += f.vx * dt;
    f.vy *= Math.pow(.35, dt);
  }
  floaters = floaters.filter(f => f.life > 0);

  for (const r of rings) { r.life += dt; r.r = lerp(r.r0, r.r1, easeOut(r.life / r.max)); }
  rings = rings.filter(r => r.life < r.max);

  if (banner) {
    if (!['transition', 'upgrade', 'paused'].includes(state)) banner.elapsed += dt;
    banner.t += dt;
    if (banner.elapsed >= banner.duration) banner = null;
  }
  if (toast) {
    if (!['transition', 'upgrade', 'paused'].includes(state)) toast.elapsed += dt;
    if (toast.elapsed >= toast.duration) toast = null;
  }
  shake = Math.max(0, shake - dt * 38);
  flash = Math.max(0, flash - dt);
  hitVignette = Math.max(0, hitVignette - dt);
  clickCooldown = Math.max(0, clickCooldown - dt);
}

function updateGameplay(dt) {
  if (!player || !room) return;
  updatePlayer(dt);
  if (player.dead || state === 'dead') return;
  updateClones(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateShockwaves(dt);
  updateRoomFlow(dt);
}

/*__GAME_LOGIC_END__*/


/* ------------------------------------------------------------------
   06A. 场景背景 / 障碍 / 门 / 资源与特效绘制
   ------------------------------------------------------------------ */
function buildRoomBackground(room) {
  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  const g = bg.getContext('2d');
  const th = room.theme;
  const vr = seeded(hashSeed(roomRngSeed(room), 555, room.stage * 13 + room.number));
  g.lineJoin = 'round';

  // 场外深色背景 + 涂鸦纹样
  g.fillStyle = th.bg;
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 44; i++) {
    const x = vr() * W, y = vr() * H, s = 4 + vr() * 13;
    g.globalAlpha = .12 + vr() * .15;
    if (i % 3 === 0) drawPaw(g, x, y, s, C.cream);
    else if (i % 3 === 1) drawStar(g, x, y, s, s * .46, 5, C.cream, null, 0, vr() * TAU);
    else drawFish(g, x, y, s, C.cream, null, 0, vr() * TAU);
  }
  g.globalAlpha = 1;

  // 竞技场外框（奶糖色墙面）
  fillRound(g, ARENA.x - 6, ARENA.y - 6, ARENA.w + 12, ARENA.h + 12, 24, C.ink);
  fillRound(g, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 20, th.wall);
  strokeRound(g, ARENA.x + 8, ARENA.y + 8, ARENA.w - 16, ARENA.h - 16, 16, withAlpha(th.ink, .32), 3);

  // 墙面糖砖花纹
  for (let x = ARENA.x + 62; x < ARENA.right - 38; x += 92) {
    fillRound(g, x, ARENA.y + 6, 46, 12, 6, th.wallAlt);
    fillRound(g, x + 28, ARENA.bottom - 19, 46, 12, 6, th.wallAlt);
  }
  for (let y = ARENA.y + 72; y < ARENA.bottom - 40; y += 92) {
    fillRound(g, ARENA.x + 6, y, 12, 46, 6, th.wallAlt);
    fillRound(g, ARENA.right - 19, y + 24, 12, 46, 6, th.wallAlt);
  }

  // 地板
  const tile = 64;
  g.fillStyle = th.floorA;
  g.fillRect(INNER.x, INNER.y, INNER.w, INNER.h);
  for (let row = 0; row * tile < INNER.h; row++) {
    for (let col = 0; col * tile < INNER.w; col++) {
      const x = INNER.x + col * tile, y = INNER.y + row * tile;
      const alt = (row + col) % 2 === 0;
      g.fillStyle = alt ? th.floorA : th.floorB;
      g.fillRect(x, y, Math.min(tile, INNER.right - x), Math.min(tile, INNER.bottom - y));
      g.strokeStyle = withAlpha(th.line, .48);
      g.lineWidth = 1;
      g.strokeRect(x + .5, y + .5, Math.min(tile - 1, INNER.right - x), Math.min(tile - 1, INNER.bottom - y));
      // 偶尔的小地板贴纸
      if (vr() < .09) {
        g.globalAlpha = .24;
        if (vr() < .5) drawPaw(g, x + tile * .55, y + tile * .5, 9 + vr() * 4, th.decor);
        else drawStar(g, x + tile * .5, y + tile * .5, 9, 4, 5, th.decor, null, 0, vr() * TAU);
        g.globalAlpha = 1;
      }
    }
  }

  // §9：章节背景不只换色，还换材质语言。
  if (th.style === 'candy') {
    // 软糖世界：糖纸斜纹 + 撒糖粒 + 马卡龙圆点
    for (let i = 0; i < 90; i++) {
      const x = INNER.x + vr() * INNER.w, y = INNER.y + vr() * INNER.h;
      g.globalAlpha = .18 + vr() * .18;
      g.fillStyle = vr() < .5 ? th.decor : C.cream;
      g.beginPath(); g.arc(x, y, 2 + vr() * 5, 0, TAU); g.fill();
    }
    g.globalAlpha = .16;
    g.strokeStyle = th.accent; g.lineWidth = 5;
    for (let x = INNER.x - 60; x < INNER.right + 60; x += 118) {
      g.beginPath(); g.moveTo(x, INNER.y); g.lineTo(x + 160, INNER.bottom); g.stroke();
    }
    for (let i = 0; i < 5; i++) {
      g.globalAlpha = .22; g.fillStyle = th.accent;
      g.beginPath(); g.arc(INNER.x + 60 + i * 240, INNER.y + 70 + (i % 2) * 34, 16, 0, TAU); g.fill();
    }
  } else if (th.style === 'mech') {
    // 机械世界：铆钉金属板 + 警示条 + 齿轮印记
    for (let x = INNER.x + 96; x < INNER.right; x += 192) {
      g.globalAlpha = .55; g.strokeStyle = withAlpha(th.ink, .35); g.lineWidth = 2;
      g.beginPath(); g.moveTo(x, INNER.y); g.lineTo(x, INNER.bottom); g.stroke();
      for (let y = INNER.y + 70; y < INNER.bottom; y += 70) {
        g.fillStyle = withAlpha(th.accent, .35);
        g.beginPath(); g.arc(x - 10, y, 4, 0, TAU); g.fill();
        g.beginPath(); g.arc(x + 10, y, 4, 0, TAU); g.fill();
      }
    }
    g.globalAlpha = .22; g.fillStyle = C.gold;
    for (let x = INNER.x; x < INNER.right; x += 56) {
      g.save(); g.translate(x, INNER.bottom - 14); g.rotate(-.4);
      g.fillRect(0, 0, 26, 8); g.restore();
    }
    g.globalAlpha = .3;
    for (let i = 0; i < 5; i++) {
      g.save(); g.translate(INNER.x + 110 + i * 250, INNER.y + 80 + (i % 2) * 120);
      drawGearShape(g, 26, 7, th.decor, vr() * TAU);
      g.restore();
    }
  } else {
    // 邪神世界：发光裂纹 + 盯人的眼睛 + 触手影子
    g.globalAlpha = .5; g.strokeStyle = th.glow; g.lineWidth = 2.5;
    for (let i = 0; i < 16; i++) {
      let x = INNER.x + vr() * INNER.w, y = INNER.y + vr() * INNER.h;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += (vr() - .5) * 90; y += (vr() - .5) * 70; g.lineTo(x, y); }
      g.stroke();
    }
    for (let i = 0; i < 7; i++) {
      g.globalAlpha = .2 + vr() * .2;
      const x = INNER.x + 90 + vr() * (INNER.w - 180), y = INNER.y + 60 + vr() * (INNER.h - 120);
      ellipse(g, x, y, 12 + vr() * 10, 7 + vr() * 5, withAlpha(th.glow, .6), C.ink, 2);
      circle(g, x + 2, y, 3, C.ink, null, 0);
    }
    g.globalAlpha = .2; g.strokeStyle = th.decor; g.lineWidth = 6;
    for (let i = 0; i < 4; i++) {
      const x = INNER.x + 140 + i * 300;
      g.beginPath(); g.moveTo(x, INNER.bottom - 20);
      g.quadraticCurveTo(x + 30, INNER.bottom - 90, x - 10, INNER.bottom - 150); g.stroke();
    }
  }
  g.globalAlpha = 1;

  // 场景装饰（纯装饰，不影响碰撞）
  for (const d of room.decor) {
    g.save(); g.globalAlpha = d.alpha; g.translate(d.x, d.y); g.rotate(d.rot);
    g.fillStyle = th.decor; g.strokeStyle = th.decor;
    if (d.type === 'paw') drawPaw(g, 0, 0, d.size, th.decor);
    else if (d.type === 'star') drawStar(g, 0, 0, d.size, d.size * .45, 5, th.decor, null, 0, 0);
    else if (d.type === 'fishbone') {
      drawFish(g, 0, 0, d.size, null, th.decor, 1.5, 0);
      g.beginPath(); g.moveTo(-d.size * .25, -d.size * .35); g.lineTo(-d.size * .25, d.size * .35); g.stroke();
    } else if (d.type === 'scribble') {
      g.lineWidth = 2; g.beginPath();
      for (let i = 0; i < 4; i++) g.lineTo(Math.cos(i * 1.7) * d.size, Math.sin(i * 1.7) * d.size);
      g.stroke();
    } else if (d.type === 'flower') {
      for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(Math.cos(i / 5 * TAU) * d.size * .55, Math.sin(i / 5 * TAU) * d.size * .55, d.size * .35, 0, TAU); g.fill(); }
      g.fillStyle = C.cream; g.beginPath(); g.arc(0, 0, d.size * .3, 0, TAU); g.fill();
    } else {
      g.beginPath(); g.arc(0, 0, d.size * .7, 0, TAU); g.lineWidth = 2.5; g.stroke();
      g.beginPath(); g.arc(0, 0, d.size * .35, 0, TAU); g.stroke();
    }
    g.restore();
  }

  // 中央淡淡猫猫水印
  g.save(); g.globalAlpha = .10;
  drawPaw(g, W / 2, INNER.y + INNER.h * .53, 84, th.decor);
  g.restore();

  // 内墙描边和边缘阴影，增强“房间”感
  const edge = g.createLinearGradient(0, INNER.y, 0, INNER.y + 40);
  edge.addColorStop(0, 'rgba(36,26,46,.28)'); edge.addColorStop(1, 'rgba(36,26,46,0)');
  g.fillStyle = edge; g.fillRect(INNER.x, INNER.y, INNER.w, 40);
  g.strokeStyle = C.ink; g.lineWidth = 7;
  g.strokeRect(INNER.x - 2, INNER.y - 2, INNER.w + 4, INNER.h + 4);
  g.strokeStyle = withAlpha(C.cream, .28); g.lineWidth = 2;
  g.strokeRect(INNER.x + 5, INNER.y + 5, INNER.w - 10, INNER.h - 10);
  g.strokeStyle = C.ink; g.lineWidth = 4;
  g.strokeRect(ARENA.x + 2, ARENA.y + 2, ARENA.w - 4, ARENA.h - 4);

  // 四角猫耳墙贴
  drawWallEar(g, ARENA.x + 24, ARENA.y + 17, -.35, th);
  drawWallEar(g, ARENA.right - 24, ARENA.y + 17, .35, th);
  drawWallEar(g, ARENA.x + 24, ARENA.bottom - 17, -2.75, th);
  drawWallEar(g, ARENA.right - 24, ARENA.bottom - 17, 2.75, th);
  return bg;
}

function roomRngSeed(room) {
  return hashSeed(run.seed, (room.stage || 1) * 131, (room.number || 1) * 89);
}

function drawWallEar(g, x, y, rot, th) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = th.wallAlt; g.strokeStyle = C.ink; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-9, 6); g.lineTo(-2, -10); g.lineTo(5, 6); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(6, 6); g.lineTo(13, -7); g.lineTo(18, 6); g.closePath(); g.fill(); g.stroke();
  g.restore();
}

/* 障碍物：圆碰撞体，画成更可爱的 2.5D 小物。 */
function drawObstacle(g, o) {
  g.save();
  g.translate(o.x, o.y);
  g.rotate(o.rot);
  ellipse(g, 4, o.r * .72, o.r * 1.05, o.r * .38, withAlpha(C.ink, .22), null, 0);
  if (o.kind === 'crate') {
    const r = o.r;
    g.lineWidth = 5; g.strokeStyle = C.ink;
    fillRound(g, -r * .88, -r * .7, r * 1.76, r * 1.55, 8, '#efa960');
    strokeRound(g, -r * .88, -r * .7, r * 1.76, r * 1.55, 8, C.ink, 5);
    g.fillStyle = '#d88b4c';
    g.fillRect(-r * .82, -r * .14, r * 1.64, r * .17);
    g.fillRect(-r * .82, r * .32, r * 1.64, r * .17);
    g.fillStyle = C.cream;
    drawPaw(g, 0, -r * .25, r * .34, C.cream);
    g.fillStyle = C.ink;
    g.beginPath(); g.arc(-r * .5, -r * .5, 2.5, 0, TAU); g.fill();
    g.beginPath(); g.arc(r * .5, -r * .5, 2.5, 0, TAU); g.fill();
    drawFish(g, 0, r * .42, r * .28, '#5bcbb1', C.ink, 2, -.1);
  } else if (o.kind === 'pudding') {
    const r = o.r;
    g.fillStyle = '#ffe5a9'; g.strokeStyle = C.ink; g.lineWidth = 5;
    g.beginPath(); g.moveTo(-r * .9, r * .3); g.quadraticCurveTo(-r, -r * .6, 0, -r * .7); g.quadraticCurveTo(r, -r * .6, r * .85, r * .3); g.quadraticCurveTo(r * .5, r * .78, 0, r * .7); g.quadraticCurveTo(-r * .55, r * .78, -r * .9, r * .3); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#c9834d';
    g.beginPath(); g.moveTo(-r * .75, -r * .32); g.quadraticCurveTo(0, -r * .85, r * .75, -r * .32); g.quadraticCurveTo(0, -r * .18, -r * .75, -r * .32); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#fffbeb';
    g.beginPath(); g.ellipse(0, -r * .48, r * .22, r * .09, 0, 0, TAU); g.fill();
    g.fillStyle = C.coral;
    circle(g, 6, -r * .64, r * .22, C.coral, C.ink, 2.5);
    g.fillStyle = '#5dbf78'; circle(g, 10, -r * .92, 3, '#5dbf78', C.ink, 1.5);
    g.fillStyle = C.ink;
    g.beginPath(); g.arc(-r * .3, r * .08, 2, 0, TAU); g.fill();
    g.beginPath(); g.arc(r * .2, r * .08, 2, 0, TAU); g.fill();
  } else {
    const r = o.r;
    g.fillStyle = '#ffe2aa'; g.strokeStyle = C.ink; g.lineWidth = 5;
    g.beginPath(); g.ellipse(0, r * .45, r * .92, r * .3, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#85d3bd';
    roundRectPath(g, -r * .54, -r * .86, r * 1.08, r * 1.26, 13); g.fill(); g.stroke();
    g.strokeStyle = '#4aa88f'; g.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      g.beginPath(); g.moveTo(-r * .35 + i * r * .23, -r * .5); g.lineTo(-r * .23 + i * r * .18, -r * .1); g.stroke();
    }
    g.fillStyle = C.gold; circle(g, 0, -r * .9, r * .3, C.gold, C.ink, 3);
    g.fillStyle = C.coral;
    g.beginPath(); g.moveTo(-r * .22, -r * .55); g.lineTo(0, -r * .15); g.lineTo(r * .3, -r * .55); g.closePath(); g.fill(); g.stroke();
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(-r * .2, -r * .55); g.lineTo(-r * .28, -r * .8); g.stroke();
  }
  g.restore();
}

/* 猫门：清空前是锁住的；清空后成为会呼吸的传送门。 */
function drawDoor(g, t) {
  if (!room) return;
  const open = room.doorOpen;
  const ox = DOOR.x, oy = DOOR.y;
  g.save(); g.translate(ox, oy);
  if (open) {
    g.save();
    g.globalAlpha = .35 + Math.sin(t * 4) * .08;
    const glow = g.createRadialGradient(0, 0, 8, 0, 0, 116);
    glow.addColorStop(0, withAlpha(C.cream, .8));
    glow.addColorStop(.55, withAlpha(C.mint, .3));
    glow.addColorStop(1, withAlpha(C.mint, 0));
    g.fillStyle = glow; g.beginPath(); g.arc(0, 0, 116, 0, TAU); g.fill();
    g.restore();
  }
  // 门框猫耳拱门
  g.fillStyle = open ? C.gold : '#6f5e7b';
  g.strokeStyle = C.ink; g.lineWidth = 6;
  g.beginPath();
  g.moveTo(-61, 46); g.lineTo(-61, -20);
  g.quadraticCurveTo(-46, -48, -30, -20);
  g.lineTo(-25, -44); g.lineTo(-10, -23);
  g.quadraticCurveTo(0, -56, 10, -23);
  g.lineTo(25, -44); g.lineTo(30, -20);
  g.quadraticCurveTo(46, -48, 61, -20);
  g.lineTo(61, 46); g.closePath(); g.fill(); g.stroke();
  // 门内
  if (open) {
    const grad = g.createRadialGradient(0, 0, 3, 0, 8, 55);
    grad.addColorStop(0, '#fff6cf');
    grad.addColorStop(.35, '#ffd0da');
    grad.addColorStop(.72, '#9c89ff');
    grad.addColorStop(1, '#312549');
    g.fillStyle = grad;
    g.beginPath(); g.ellipse(0, 8, 43, 46, 0, 0, TAU); g.fill();
    g.strokeStyle = C.ink; g.lineWidth = 5; g.stroke();
    g.save();
    g.translate(0, 8); g.rotate(t * .8);
    for (let i = 0; i < 13; i++) {
      const a = i / 13 * TAU, rr = 16 + (i % 3) * 10;
      g.globalAlpha = .4 + (i % 3) * .2;
      drawFish(g, Math.cos(a) * rr, Math.sin(a) * rr, 5, i % 2 ? C.gold : C.mint, null, 0, a + 1.57);
    }
    g.restore();
    g.save(); g.translate(0, 8); g.rotate(-t * .55);
    g.strokeStyle = withAlpha(C.cream, .8); g.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.arc(0, 0, 12 + i * 10, i * 2.1, i * 2.1 + 2.6); g.stroke();
    }
    g.restore();
    // 小小提示
    drawText(g, '进入', 0, 3, 18, C.cream, { align: 'center', line: 5 });
  } else {
    g.fillStyle = '#49374f';
    g.beginPath(); g.ellipse(0, 8, 43, 46, 0, 0, TAU); g.fill();
    g.strokeStyle = C.ink; g.lineWidth = 5; g.stroke();
    g.strokeStyle = withAlpha(C.cream, .16); g.lineWidth = 2;
    for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(i * 11, -22); g.lineTo(i * 11, 42); g.stroke(); }
    g.fillStyle = C.gold; drawHeart(g, 0, 2, 18, C.gold, C.ink, 3);
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.arc(0, -15, 7, 0, TAU); g.stroke();
    drawText(g, '清空开启', 0, 70, 13, C.cream, { align: 'center', line: 4 });
  }
  if (open) {
    g.save();
    g.globalAlpha = .75 + Math.sin(t * 5) * .22;
    drawStar(g, 48, -35, 9, 4, 5, C.gold, C.ink, 2.5, t * 1.5);
    drawStar(g, -52, 20, 6, 3, 5, C.mint, C.ink, 2, -t * 2);
    g.restore();
  }
  g.restore();
}

function drawPickup(g, pk, t) {
  const bob = Math.sin(t * 5 + pk.phase) * 4;
  const y = pk.y + bob;
  g.save();
  g.globalAlpha = .55 + Math.sin(t * 4.5 + pk.phase) * .15;
  const glow = g.createRadialGradient(pk.x, y, 1, pk.x, y, 23);
  glow.addColorStop(0, pk.type === 'coin' ? withAlpha(C.gold, .85) : withAlpha(C.cream, .8));
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(pk.x, y, 23, 0, TAU); g.fill();
  g.restore();
  g.save(); g.translate(pk.x, y);
  g.rotate(Math.sin(t * 3 + pk.phase) * .12);
  if (pk.type === 'fish') {
    drawFish(g, 0, 0, 10, '#6edfc2', C.ink, 2.5, .15);
    drawStar(g, -10, -8, 3, 1.4, 5, C.cream, null, 0);
  } else if (pk.type === 'coin') {
    circle(g, 0, 0, 10, C.gold, C.ink, 2.8);
    g.fillStyle = C.goldDeep; g.beginPath(); g.arc(0, 0, 6.5, 0, TAU); g.fill();
    g.fillStyle = C.ink; g.beginPath(); g.arc(-2.5, -1, 1.4, 0, TAU); g.fill(); g.beginPath(); g.arc(2.5, -1, 1.4, 0, TAU); g.fill();
    g.strokeStyle = C.ink; g.lineWidth = 1.2; g.beginPath(); g.arc(0, 1, 3, .2, Math.PI - .2); g.stroke();
  } else {
    roundRectPath(g, -8, -8, 16, 15, 5); g.fillStyle = '#e8a55d'; g.fill();
    g.strokeStyle = C.ink; g.lineWidth = 2.5; g.stroke();
    drawPaw(g, 0, 0, 7, C.cream, .95);
  }
  g.restore();
}

function drawProjectile(g, pr) {
  g.save(); g.translate(pr.x, pr.y);
  if (pr.friendly) {
    g.globalAlpha = .55;
    const col = pr.kind === 'fish' ? C.mint : C.gold;
    g.fillStyle = withAlpha(col, .28);
    g.beginPath(); g.arc(-pr.vx * .025, -pr.vy * .025, pr.radius * 1.5, 0, TAU); g.fill();
    g.globalAlpha = 1;
    g.rotate(pr.kind === 'fish' ? pr.angle : pr.rot);
    if (pr.kind === 'fish') drawFish(g, 0, 0, pr.radius * 1.25, '#6edfc2', C.ink, 3, 0);
    else drawStar(g, 0, 0, pr.radius * 1.2, pr.radius * .45, 5, C.gold, C.ink, 2.5, 0);
  } else {
    g.rotate(pr.rot);
    g.globalAlpha = .3;
    g.fillStyle = withAlpha(pr.color, .4);
    g.beginPath(); g.arc(-8, 0, pr.radius * 1.2, 0, TAU); g.fill();
    g.globalAlpha = 1;
    const r = pr.radius;
    if (pr.kind === 'gear') {
      // 机械章节：旋转齿轮弹
      g.save(); g.rotate(pr.life * 7);
      drawGearShape(g, r, 5, pr.color, 0);
      circle(g, 0, 0, r * .42, C.ink, null, 0);
      g.restore();
    } else if (pr.kind === 'shell') {
      // 炮筒猫的猫爪炮弹
      g.fillStyle = pr.color; g.strokeStyle = C.ink; g.lineWidth = 3;
      g.beginPath(); g.ellipse(0, 0, r * 1.15, r * .8, 0, 0, TAU); g.fill(); g.stroke();
      drawPaw(g, 0, 0, r * .7, C.cream, .95);
      g.strokeStyle = withAlpha(C.cream, .65); g.lineWidth = 2;
      g.beginPath(); g.moveTo(-r * 1.5, 0); g.lineTo(-r * .75, 0); g.stroke();
    } else if (pr.kind === 'eye') {
      // 眼球弹：虹膜会盯着猫
      circle(g, 0, 0, r, C.white, C.ink, 3);
      circle(g, r * .12, 0, r * .52, pr.color, C.ink, 2);
      circle(g, r * .2, -r * .1, r * .16, C.cream, null, 0);
      g.strokeStyle = C.ink; g.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = -0.7 + i * .7;
        g.beginPath(); g.moveTo(-r * .9, Math.sin(a) * r * .6); g.lineTo(-r * 1.25, Math.sin(a) * r * .8); g.stroke();
      }
    } else if (pr.kind === 'spore') {
      // 荧光孢子：伞盖 + 孢子尾迹
      g.fillStyle = withAlpha(pr.color, .35);
      g.beginPath(); g.arc(-r * .9, r * .3, r * .8, 0, TAU); g.fill();
      g.fillStyle = pr.color; g.strokeStyle = C.ink; g.lineWidth = 2.6;
      g.beginPath(); g.arc(0, 0, r, Math.PI, TAU); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(0, r * .18, r * .35, r * .5, 0, 0, TAU); g.fillStyle = C.cream; g.fill(); g.stroke();
      circle(g, -r * .35, -r * .36, r * .18, C.white, null, 0);
      circle(g, r * .28, -r * .5, r * .14, C.white, null, 0);
    } else if (pr.kind === 'caramel') {
      // 布丁 Boss 的焦糖团
      g.fillStyle = pr.color; g.strokeStyle = C.ink; g.lineWidth = 3;
      g.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * TAU;
        const rr = r * (i % 2 ? .82 : 1.12);
        i === 0 ? g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = withAlpha(C.cream, .6);
      g.beginPath(); g.arc(-r * .25, -r * .25, r * .22, 0, TAU); g.fill();
    } else if (pr.kind === 'candy') {
      // 软糖 / 棒棒糖章节：糖果包装弹
      g.fillStyle = pr.color; g.strokeStyle = C.ink; g.lineWidth = 3;
      g.beginPath(); g.ellipse(0, 0, r * .9, r * .72, 0, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = C.cream;
      g.beginPath(); g.moveTo(-r * .9, 0); g.lineTo(-r * 1.5, -r * .5); g.lineTo(-r * 1.35, 0); g.lineTo(-r * 1.5, r * .5); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(r * .9, 0); g.lineTo(r * 1.5, -r * .5); g.lineTo(r * 1.35, 0); g.lineTo(r * 1.5, r * .5); g.closePath(); g.fill(); g.stroke();
    } else {
      // 兜底：鱼骨飞弹（保留给旧数据和调试）
      g.strokeStyle = C.ink; g.lineWidth = 3.5;
      g.fillStyle = C.cream;
      g.beginPath(); g.moveTo(-13, 0); g.quadraticCurveTo(-3, -7, 10, 0); g.quadraticCurveTo(-3, 7, -13, 0); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(-10, 0); g.lineTo(-18, -8); g.lineTo(-16, 0); g.lineTo(-18, 8); g.closePath(); g.fill(); g.stroke();
      g.strokeStyle = pr.color; g.lineWidth = 2;
      for (let i = -5; i < 6; i += 4) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 4, -4); g.stroke(); }
      g.fillStyle = C.ink; g.beginPath(); g.arc(5, -1.5, 1.6, 0, TAU); g.fill();
    }
  }
  g.restore();
}

function drawParticle(g, p) {
  const a = clamp(p.life / p.max, 0, 1);
  g.save();
  g.globalAlpha = a * (p.alpha || 1);
  g.translate(p.x, p.y); g.rotate(p.rot);
  if (p.type === 'star') {
    drawStar(g, 0, 0, p.size * (1 + (1 - a) * .2), p.size * .44, 5, p.color, null, 0, 0);
  } else if (p.type === 'spark') {
    g.strokeStyle = p.color; g.lineWidth = Math.max(1, p.size * .35);
    g.beginPath(); g.moveTo(-p.size * 1.3, 0); g.lineTo(p.size * 1.3, 0); g.stroke();
    g.beginPath(); g.moveTo(0, -p.size * .9); g.lineTo(0, p.size * .9); g.stroke();
  } else if (p.type === 'puff') {
    circle(g, 0, 0, p.size * (1.25 - a * .25), p.color, null, 0);
    circle(g, p.size * .7, -p.size * .3, p.size * .6, p.color, null, 0);
    circle(g, -p.size * .6, p.size * .15, p.size * .55, p.color, null, 0);
  } else if (p.type === 'heart') {
    drawHeart(g, 0, 0, p.size, p.color, null, 0);
  } else if (p.type === 'fish') {
    drawFish(g, 0, 0, p.size, p.color, null, 0, 0);
  } else if (p.type === 'ghost') {
    g.globalAlpha *= .35;
    ellipse(g, 0, 0, p.size * .8, p.size, p.color, null, 0);
    circle(g, -p.size * .25, -p.size * .2, 2, withAlpha(C.cream, .5), null, 0);
    circle(g, p.size * .25, -p.size * .2, 2, withAlpha(C.cream, .5), null, 0);
  } else {
    circle(g, 0, 0, Math.max(1, p.size * a), p.color, null, 0);
  }
  g.restore();
}

function drawRing(g, r) {
  const a = clamp(1 - r.life / r.max, 0, 1);
  g.save();
  g.globalAlpha = a * .9;
  g.strokeStyle = r.ink ? C.ink : r.color; g.lineWidth = r.width + (r.ink ? 3 : 0);
  g.beginPath(); g.arc(r.x, r.y, r.r, 0, TAU); g.stroke();
  g.strokeStyle = r.color; g.lineWidth = r.width;
  g.beginPath(); g.arc(r.x, r.y, r.r, 0, TAU); g.stroke();
  g.restore();
}

function drawFloaters(g) {
  for (const f of floaters) {
    const a = clamp(f.life / f.max, 0, 1);
    drawText(g, f.text, f.x, f.y, f.size, f.color, { align: 'center', line: 3, alpha: .35 + a * .65 });
  }
}

/* ------------------------------------------------------------------
   06B. 猫猫玩家 / 分身 / 挥爪特效
   ------------------------------------------------------------------ */
// line 可传：小尺寸角色（第 1 阶）用细一点的描边，避免奶油猫被粗线糊成黑团。
function catEar(g, x, y, w, h, rot, fill, inner, line = 4) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.beginPath();
  g.moveTo(-w, h * .42); g.quadraticCurveTo(-w * .5, -h * .9, 0, -h);
  g.quadraticCurveTo(w * .5, -h * .9, w, h * .42);
  g.quadraticCurveTo(0, h * .65, -w, h * .42);
  g.closePath();
  g.fillStyle = fill; g.fill();
  g.strokeStyle = C.ink; g.lineWidth = line; g.stroke();
  g.beginPath();
  g.moveTo(-w * .55, h * .1); g.quadraticCurveTo(-w * .25, -h * .45, 0, -h * .48);
  g.quadraticCurveTo(w * .25, -h * .45, w * .55, h * .1);
  g.quadraticCurveTo(0, h * .25, -w * .55, h * .1);
  g.closePath();
  g.fillStyle = inner; g.fill();
  g.restore();
}

/* 三套独立造型函数：不是同一个 draw() 改数值，而是每阶各自构图。
   设计只参考 Battle Cats 的“基础猫 / 狂乱猫 / 传说神龙猫”气质，全部原创 Canvas 绘制。 */
const FORM_ART = {
  basic: drawFormBasic,
  frenzy: drawFormFrenzy,
  divine: drawFormDivine,
};
const FORM_HEAD_ART = {
  basic: drawHeadBasic,
  frenzy: drawHeadFrenzy,
  divine: drawHeadDivine,
};

// 战斗角色统一入口：只处理影子、位移、受击闪烁、死亡姿态等共用状态，
// 真正的造型由每个形态自己的函数负责，因此形态切换是“换了一只猫”。
function drawPlayerSprite(g, p, t, opts = {}) {
  const form = FORMS[p.form || 0] || FORMS[0];
  const r = p.r || 20;
  const isDead = p.dead || opts.dead;
  const moving = p.moving && !isDead;
  const bob = isDead ? 0 : Math.sin(t * (moving ? 12 : 4.8) + (opts.phase || 0)) * (moving ? 2.2 : 1.4);
  const squish = isDead ? .22 : (moving ? 1 + Math.sin(t * 12 + (opts.phase || 0)) * .035 : 1);
  const blink = !isDead && ((t * 1.55 + (opts.blinkOffset || 0)) % 4.3 > 4.1);
  const low = p.hp !== undefined && p.hp > 0 && p.hp / p.maxHp < .3;

  // 地面影子 + 冲刺冷却环
  g.save();
  g.globalAlpha = .28;
  g.fillStyle = C.ink;
  g.beginPath(); g.ellipse(p.x, p.y + r * 1.02, r * 1.25, r * .38, 0, 0, TAU); g.fill();
  if (!isDead && p.dashCd > 0) {
    const charge = 1 - p.dashCd / p.dashCooldown;
    g.strokeStyle = withAlpha(C.mint, .45); g.lineWidth = 2;
    g.beginPath(); g.arc(p.x, p.y + r * 1.02, r * 1.32, Math.PI * .12, Math.PI * .88); g.stroke();
    g.strokeStyle = withAlpha(C.cream, .75); g.lineWidth = 3;
    g.beginPath(); g.arc(p.x, p.y + r * 1.02, r * 1.32, Math.PI * .12, Math.PI * .12 + Math.PI * .76 * charge); g.stroke();
  }
  if ((p.form || 0) === 1 && !isDead) {
    g.globalAlpha = .16 + Math.sin(t * 6) * .06;
    g.fillStyle = C.coral;
    g.beginPath(); g.ellipse(p.x, p.y + r * 1.02, r * 1.6, r * .5, 0, 0, TAU); g.fill();
  }
  if ((p.form || 0) === 2 && !isDead) {
    g.globalAlpha = .28;
    g.strokeStyle = withAlpha(C.gold, .75); g.lineWidth = 2;
    g.beginPath(); g.ellipse(p.x, p.y + r * 1.05, r * 1.45, r * .42, 0, 0, TAU); g.stroke();
  }
  g.restore();

  g.save();
  g.translate(p.x, p.y + bob);
  if (isDead) {
    const dt = Math.min(1, (p.deathT || 0) * 2.2);
    g.rotate(1.15 * dt);
    g.scale(1.08, .46 + .54 * (1 - dt));
    g.translate(0, 14 * dt);
  }
  if (!isDead && p.invuln > 0 && p.hurtFlash > 0 && Math.floor(t * 28) % 2 === 0 && !opts.alwaysVisible) {
    g.globalAlpha = .48;
  }
  g.scale(1, squish);

  const drawForm = FORM_ART[form.art] || FORM_ART.basic;
  drawForm(g, p, r, t, moving, blink, isDead);

  // 通用成长反馈（不影响造型差异）
  if (p.upgradeFx > 0 && !isDead) {
    for (let i = 0; i < 5; i++) {
      const a = t * 2 + i * TAU / 5;
      drawStar(g, Math.cos(a) * r * 1.3, -r * .5 + Math.sin(a) * r * 1.2, 4, 1.8, 5, C.gold, null, 0, t);
    }
  }
  if (low && !isDead) {
    g.fillStyle = C.blue; g.strokeStyle = C.ink; g.lineWidth = 2;
    g.beginPath(); g.moveTo(r * .88, -r * .9); g.quadraticCurveTo(r * 1.12, -r * .55, r * .88, -r * .48); g.quadraticCurveTo(r * .65, -r * .6, r * .88, -r * .9); g.fill(); g.stroke();
  }
  if (isDead) {
    for (let i = 0; i < 3; i++) {
      const a = t * 1.3 + i * TAU / 3;
      drawStar(g, Math.cos(a) * r * 1.3, -r * 1.2 + Math.sin(a) * r * .25, 5, 2.2, 5, C.gold, C.ink, 1.5);
    }
  }
  g.restore();
}

/* ---------- 第 1 阶：奶油团子（最朴素、短腿、大头路人猫） ---------- */
function drawFormBasic(g, p, r, t, moving, blink, isDead) {
  const f = FORMS[0];
  const wag = Math.sin(t * (moving ? 11 : 3.2)) * r * .2;
  // 短尾巴
  g.save(); g.lineCap = 'round';
  g.strokeStyle = C.ink; g.lineWidth = r * .24;
  g.beginPath(); g.moveTo(r * .6, r * .35);
  g.quadraticCurveTo(r * 1.22, r * .3 + wag, r * 1.22, -r * .12 + wag); g.stroke();
  g.strokeStyle = f.body; g.lineWidth = r * .13;
  g.beginPath(); g.moveTo(r * .6, r * .35);
  g.quadraticCurveTo(r * 1.22, r * .3 + wag, r * 1.22, -r * .12 + wag); g.stroke();
  g.restore();

  // 短粗后腿
  for (const sx of [-1, 1]) {
    ellipse(g, sx * r * .43, r * .86, r * .28, r * .2, f.body, C.ink, 2.8);
    g.strokeStyle = withAlpha(C.ink, .35); g.lineWidth = 1.3;
    for (let i = -1; i <= 1; i++) {
      g.beginPath(); g.moveTo(sx * r * .43 + i * r * .09, r * .83); g.lineTo(sx * r * .43 + i * r * .1, r * .94); g.stroke();
    }
  }

  // 小圆肚子
  ellipse(g, 0, r * .2, r * .8, r * .68, f.body, C.ink, 3.2);
  ellipse(g, 0, r * .3, r * .45, r * .38, f.belly, null, 0);

  // 大脑袋（头身比刻意更“路人猫”）
  g.save(); g.translate(0, -r * .45);
  catEar(g, -r * .66, -r * .55, r * .32, r * .46, -.28, f.body, f.accent, 3);
  catEar(g, r * .66, -r * .55, r * .32, r * .46, .28, f.body, f.accent, 3);
  ellipse(g, 0, 0, r * .93, r * .85, f.body, C.ink, 3.4);
  ellipse(g, 0, r * .28, r * .46, r * .31, f.belly, null, 0);
  // 头顶三根呆毛
  g.strokeStyle = C.ink; g.lineWidth = 2.3; g.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    g.beginPath(); g.moveTo(i * r * .16, -r * .68); g.quadraticCurveTo(i * r * .18, -r * .96, i * r * .28, -r * 1.0); g.stroke();
  }

  // 表情：大眼、呆、偶尔眨眼
  const lx = Math.cos(p.aim || 0) * r * .07;
  const ly = Math.sin(p.aim || 0) * r * .06;
  if (blink || isDead) {
    g.strokeStyle = C.ink; g.lineWidth = 2.5;
    for (const sx of [-1, 1]) {
      g.beginPath(); g.moveTo(sx * r * .45, -r * .1); g.quadraticCurveTo(sx * r * .32, r * .01, sx * r * .19, -r * .1); g.stroke();
    }
  } else if (p.hurtFlash > 0) {
    g.strokeStyle = C.ink; g.lineWidth = 2.4;
    for (const sx of [-1, 1]) {
      g.beginPath(); g.moveTo(sx * r * .48, -r * .18); g.lineTo(sx * r * .17, -r * .02); g.stroke();
      g.beginPath(); g.moveTo(sx * r * .17, -r * .18); g.lineTo(sx * r * .48, -r * .02); g.stroke();
    }
  } else {
    ellipse(g, -r * .33 + lx, -r * .1, r * .23, r * .26, C.white, C.ink, 2.5);
    ellipse(g, r * .33 + lx, -r * .1, r * .23, r * .26, C.white, C.ink, 2.5);
    circle(g, -r * .33 + lx * 2, -r * .08 + ly, r * .11, f.eye, null, 0);
    circle(g, r * .33 + lx * 2, -r * .08 + ly, r * .11, f.eye, null, 0);
    circle(g, -r * .37 + lx * 2, -r * .13 + ly, r * .044, C.white, null, 0);
    circle(g, r * .29 + lx * 2, -r * .13 + ly, r * .044, C.white, null, 0);
  }
  g.fillStyle = C.coral;
  g.beginPath(); g.moveTo(-r * .09, r * .16); g.lineTo(0, r * .24); g.lineTo(r * .09, r * .16); g.closePath(); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 1.8;
  g.beginPath(); g.moveTo(-r * .18, r * .36); g.quadraticCurveTo(0, r * .5, r * .18, r * .36); g.stroke();
  // 腮红
  ellipse(g, -r * .64, r * .08, r * .13, r * .07, withAlpha(C.coral, .48), null, 0);
  ellipse(g, r * .64, r * .08, r * .13, r * .07, withAlpha(C.coral, .48), null, 0);
  // 铃铛项圈
  g.strokeStyle = C.ink; g.lineWidth = r * .12;
  g.beginPath(); g.moveTo(-r * .72, r * .64); g.quadraticCurveTo(0, r * .82, r * .72, r * .64); g.stroke();
  g.strokeStyle = f.accent; g.lineWidth = r * .065;
  g.beginPath(); g.moveTo(-r * .72, r * .64); g.quadraticCurveTo(0, r * .82, r * .72, r * .64); g.stroke();
  circle(g, 0, r * .78, r * .13, C.gold, C.ink, 2.2);
  g.restore();

  // 前爪：挥爪时伸向 aim 方向，平时短手贴身
  const swing = p.attackAnim > 0 ? Math.sin((1 - p.attackAnim / p.attackAnimMax) * Math.PI) : 0;
  for (const sx of [-1, 1]) {
    g.save();
    const aa = (p.aim || 0);
    const extend = swing * r * .52;
    g.translate(sx * r * .4 + (sx > 0 ? Math.cos(aa) * extend : 0), r * .55 + (sx > 0 ? Math.sin(aa) * extend : 0));
    ellipse(g, 0, 0, r * .27, r * .3, f.body, C.ink, 2.6);
    g.strokeStyle = withAlpha(C.ink, .32); g.lineWidth = 1.2;
    for (let i = -1; i <= 1; i++) {
      g.beginPath(); g.moveTo(i * r * .08, r * .05); g.lineTo(i * r * .1, r * .21); g.stroke();
    }
    g.restore();
  }
}

/* ---------- 第 2 阶：炸毛狂乱喵（变壮、凶狠、钢爪、狂气） ---------- */
function drawFormFrenzy(g, p, r, t, moving, blink, isDead) {
  const f = FORMS[1];
  const wag = Math.sin(t * (moving ? 12 : 5.2)) * r * .28;
  // 狂气蒸汽
  g.save(); g.globalAlpha = .2 + Math.sin(t * 4) * .06;
  g.fillStyle = C.coral;
  for (let i = 0; i < 3; i++) {
    const a = t * 1.1 + i * 2.1;
    ellipse(g, Math.cos(a) * r * 1.2, -r * .3 + Math.sin(a) * r * .25, r * .2, r * .06, C.coral, null, 0);
  }
  g.restore();

  // 战带飘尾
  g.save(); g.lineCap = 'round';
  g.strokeStyle = C.ink; g.lineWidth = r * .24;
  g.beginPath(); g.moveTo(-r * .65, r * .2); g.quadraticCurveTo(-r * 1.4, r * .1 + wag, -r * 1.55, r * .7 + wag); g.stroke();
  g.strokeStyle = C.coralDeep; g.lineWidth = r * .13;
  g.beginPath(); g.moveTo(-r * .65, r * .2); g.quadraticCurveTo(-r * 1.4, r * .1 + wag, -r * 1.55, r * .7 + wag); g.stroke();
  g.restore();

  // 粗壮尾巴，带钢环
  g.save(); g.lineCap = 'round';
  g.strokeStyle = C.ink; g.lineWidth = r * .34;
  g.beginPath(); g.moveTo(r * .72, r * .35); g.quadraticCurveTo(r * 1.55, r * .5 + wag, r * 1.65, -r * .5 + wag);
  g.quadraticCurveTo(r * 1.8, -r * .9, r * 1.25, -r * .95 + wag); g.stroke();
  g.strokeStyle = f.body; g.lineWidth = r * .22;
  g.beginPath(); g.moveTo(r * .72, r * .35); g.quadraticCurveTo(r * 1.55, r * .5 + wag, r * 1.65, -r * .5 + wag);
  g.quadraticCurveTo(r * 1.8, -r * .9, r * 1.25, -r * .95 + wag); g.stroke();
  g.strokeStyle = C.gold; g.lineWidth = r * .09;
  for (let i = 0; i < 3; i++) {
    g.beginPath(); g.arc(r * 1.38, r * .25 + wag * .4 - i * r * .28, r * .2, -.75, .75); g.stroke();
  }
  g.restore();

  // 宽厚的腿与脚爪
  for (const sx of [-1, 1]) {
    g.save(); g.translate(sx * r * .52, r * .85);
    ellipse(g, 0, 0, r * .4, r * .26, f.body, C.ink, 4);
    g.fillStyle = C.ink;
    for (let i = -1; i <= 1; i++) {
      g.beginPath(); g.moveTo(i * r * .16 - r * .04, r * .1); g.lineTo(i * r * .16, r * .25); g.lineTo(i * r * .16 + r * .04, r * .1); g.fill();
    }
    g.restore();
  }

  // 更宽的身体与厚肩
  ellipse(g, 0, r * .1, r * 1.14, r * .9, f.body, C.ink, 4.8);
  ellipse(g, 0, r * .22, r * .7, r * .53, f.belly, null, 0);
  // 虎纹
  g.save(); g.strokeStyle = f.trim; g.lineWidth = r * .1; g.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    g.beginPath(); g.moveTo(-r * .9 + i * r * .17, -r * .4 + i * r * .16); g.lineTo(-r * .55 + i * r * .17, -r * .22 + i * r * .16); g.stroke();
  }
  g.restore();
  // 金色战带 + 铆钉
  g.strokeStyle = C.ink; g.lineWidth = r * .18;
  g.beginPath(); g.moveTo(-r * 1.02, -r * .53); g.quadraticCurveTo(0, -r * .27, r * 1.02, -r * .53); g.stroke();
  g.strokeStyle = C.gold; g.lineWidth = r * .1;
  g.beginPath(); g.moveTo(-r * 1.02, -r * .53); g.quadraticCurveTo(0, -r * .27, r * 1.02, -r * .53); g.stroke();
  for (let i = -2; i <= 2; i++) circle(g, i * r * .33, -r * .35 + Math.abs(i) * r * .045, r * .045, C.cream, null, 0);

  // 肩部炸毛与肌肉臂
  g.save();
  for (const sx of [-1, 1]) {
    for (let i = -1; i <= 1; i++) {
      const a = sx * (Math.PI * .5 + i * .38);
      g.fillStyle = f.body; g.strokeStyle = C.ink; g.lineWidth = 3.4;
      g.beginPath();
      g.moveTo(sx * r * 1.05, r * .02);
      g.lineTo(sx * (r * 1.2 + Math.abs(i) * .04 * r) + Math.cos(a) * r * .25, Math.sin(a) * r * .34 - r * .06);
      g.lineTo(sx * r * .94, r * .3);
      g.closePath(); g.fill(); g.stroke();
    }
  }
  g.restore();

  // 金属爪套：挥爪时朝鼠标方向砸出去
  const aa = p.aim || 0;
  const swing = p.attackAnim > 0 ? Math.sin((1 - p.attackAnim / p.attackAnimMax) * Math.PI) : 0;
  for (const sx of [-1, 1]) {
    g.save();
    const isFront = sx > 0;
    const ex = isFront ? Math.cos(aa) * swing * r * .9 : -r * .15;
    const ey = isFront ? Math.sin(aa) * swing * r * .9 : r * .18;
    g.translate(sx * r * .95 + ex, r * .35 + ey);
    g.rotate(isFront ? aa * .2 : sx * .12);
    ellipse(g, 0, 0, r * .38, r * .34, '#b9b3c8', C.ink, 4);
    g.fillStyle = C.ink;
    for (let k = -1; k <= 1; k++) {
      g.beginPath();
      g.moveTo(k * r * .13 - r * .045, r * .12); g.lineTo(k * r * .13, r * .36); g.lineTo(k * r * .13 + r * .045, r * .12);
      g.fill();
    }
    // 指虎尖刺
    for (let k = -1; k <= 1; k++) {
      g.fillStyle = C.gold;
      g.beginPath(); g.moveTo(k * r * .13 - r * .05, -r * .13); g.lineTo(k * r * .13, -r * .32); g.lineTo(k * r * .13 + r * .05, -r * .13); g.closePath(); g.fill();
      g.strokeStyle = C.ink; g.lineWidth = 2; g.stroke();
    }
    g.restore();
  }

  // 较小但更凶的头
  g.save(); g.translate(0, -r * .72);
  // 爆炸狮子鬃毛
  for (let i = 0; i < 13; i++) {
    const a = Math.PI * .16 + i * (Math.PI * .68 / 12) + Math.PI * .1;
    const len = (i % 2 ? r * .23 : r * .31);
    g.fillStyle = i % 2 ? f.trim : f.body; g.strokeStyle = C.ink; g.lineWidth = 2.6;
    g.beginPath();
    g.moveTo(Math.cos(a - .15) * r * .62, Math.sin(a - .15) * r * .56);
    g.lineTo(Math.cos(a) * (r * .62 + len), Math.sin(a) * (r * .56 + len * .7));
    g.lineTo(Math.cos(a + .15) * r * .62, Math.sin(a + .15) * r * .56);
    g.closePath(); g.fill(); g.stroke();
  }
  // 缺角耳朵
  catEar(g, -r * .67, -r * .5, r * .33, r * .5, -.35, f.body, C.coralDeep);
  catEar(g, r * .67, -r * .5, r * .31, r * .46, .34, f.body, C.coralDeep);
  g.save(); g.fillStyle = C.ink;
  g.beginPath(); g.moveTo(r * .58, -r * .84); g.lineTo(r * .73, -r * .72); g.lineTo(r * .6, -r * .62); g.fill();
  g.restore();
  ellipse(g, 0, 0, r * .82, r * .75, f.body, C.ink, 4.6);
  ellipse(g, 0, r * .25, r * .43, r * .3, f.belly, null, 0);

  // 倒竖眉毛 + 发光眼
  if (blink || isDead) {
    g.strokeStyle = C.ink; g.lineWidth = 2.6;
    for (const sx of [-1, 1]) {
      g.beginPath(); g.moveTo(sx * r * .42, -r * .06); g.lineTo(sx * r * .2, -r * .06); g.stroke();
    }
  } else {
    for (const sx of [-1, 1]) {
      ellipse(g, sx * r * .31, -r * .08, r * .22, r * .24, f.eye, C.ink, 2.8);
      g.fillStyle = C.ink;
      g.save(); g.beginPath(); g.ellipse(sx * r * .31, -r * .06, r * .075, r * .2, sx * .18, 0, TAU); g.fill(); g.restore();
      circle(g, sx * r * .26, -r * .13, r * .03, C.white, null, 0);
      // 怒眉
      g.strokeStyle = C.ink; g.lineWidth = r * .1; g.lineCap = 'round';
      g.beginPath(); g.moveTo(sx * r * .18, -r * .4); g.lineTo(sx * r * .54, -r * .23); g.stroke();
    }
  }
  // 小鼻 + 獠牙 + 咧笑
  g.fillStyle = C.ink;
  g.beginPath(); g.moveTo(-r * .07, r * .11); g.lineTo(0, r * .18); g.lineTo(r * .07, r * .11); g.closePath(); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(-r * .26, r * .25); g.quadraticCurveTo(0, r * .5, r * .26, r * .25); g.stroke();
  for (const sx of [-1, 1]) {
    g.fillStyle = C.white; g.strokeStyle = C.ink; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(sx * r * .2, r * .26); g.lineTo(sx * r * .26, r * .41); g.lineTo(sx * r * .11, r * .3); g.closePath(); g.fill(); g.stroke();
  }
  // 旧伤疤
  g.strokeStyle = withAlpha(C.ink, .65); g.lineWidth = 2;
  g.beginPath(); g.moveTo(r * .42, -r * .4); g.lineTo(r * .56, -r * .02); g.stroke();
  for (let i = -1; i <= 1; i++) {
    g.beginPath(); g.moveTo(r * .47 + i * r * .02, -r * .26 + i * r * .12); g.lineTo(r * .56 + i * r * .02, -r * .24 + i * r * .12); g.stroke();
  }
  g.restore();
}

/* ---------- 第 3 阶：星辉龙神喵（龙角、星环、披风、第三只眼、气场拉满） ---------- */
function drawFormDivine(g, p, r, t, moving, blink, isDead) {
  const f = FORMS[2];
  const bobFloat = Math.sin(t * 2.3) * r * .1;
  // 大范围光晕
  g.save(); g.globalAlpha = isDead ? .16 : .3 + Math.sin(t * 3) * .06;
  const aura = g.createRadialGradient(0, -r * .25, r * .25, 0, -r * .25, r * 2.4);
  aura.addColorStop(0, withAlpha(C.gold, .5));
  aura.addColorStop(.52, withAlpha(f.accent, .24));
  aura.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = aura; g.beginPath(); g.arc(0, -r * .25, r * 2.4, 0, TAU); g.fill();
  g.restore();

  // 环绕星屑
  for (let i = 0; i < 5; i++) {
    const a = t * .85 + i * TAU / 5;
    const rr = r * (1.45 + (i % 2) * .22);
    g.save(); g.globalAlpha = .62 + Math.sin(t * 2.5 + i) * .18;
    drawStar(g, Math.cos(a) * rr, -r * .5 + Math.sin(a) * rr * .48, r * .13, r * .055, 5, i % 2 ? C.gold : C.cream, null, 0, a);
    g.restore();
  }

  // 披风：扬起的紫色长披风
  g.save(); g.translate(-r * .1, r * .15); g.rotate(Math.sin(t * 1.7) * .035);
  g.fillStyle = '#9b82ec'; g.strokeStyle = C.ink; g.lineWidth = 4.5;
  g.beginPath();
  g.moveTo(-r * .7, -r * .35);
  g.quadraticCurveTo(-r * 1.65, r * .25, -r * 1.45, r * 1.2);
  g.lineTo(-r * .6, r * .9); g.lineTo(-r * .15, r * 1.05); g.lineTo(r * .45, r * .82);
  g.quadraticCurveTo(r * .15, r * .3, r * .62, -r * .32);
  g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = withAlpha(C.gold, .8); g.lineWidth = 2;
  g.beginPath(); g.moveTo(-r * .55, -r * .23); g.quadraticCurveTo(-r * 1.35, r * .34, -r * 1.18, r * 1.02); g.stroke();
  g.restore();

  // 云纹下摆 / 星尾
  g.save(); g.lineCap = 'round';
  g.strokeStyle = C.ink; g.lineWidth = r * .25;
  g.beginPath(); g.moveTo(r * .62, r * .42);
  g.bezierCurveTo(r * 1.55, r * .55, r * 1.75, -r * .45, r * 1.35, -r * .85);
  g.quadraticCurveTo(r * 1.1, -r * 1.15, r * 1.42, -r * 1.32);
  g.stroke();
  g.strokeStyle = f.body; g.lineWidth = r * .14;
  g.beginPath(); g.moveTo(r * .62, r * .42);
  g.bezierCurveTo(r * 1.55, r * .55, r * 1.75, -r * .45, r * 1.35, -r * .85);
  g.quadraticCurveTo(r * 1.1, -r * 1.15, r * 1.42, -r * 1.32);
  g.stroke();
  drawStar(g, r * 1.4, -r * 1.35, r * .26, r * .11, 5, C.gold, C.ink, 2.2, t);
  g.restore();

  // 云朵脚座：不再是普通短腿
  g.save(); g.globalAlpha = .9;
  for (let i = -2; i <= 2; i++) {
    const cx = i * r * .28, cy = r * .85 + Math.sin(t * 2 + i) * r * .04;
    ellipse(g, cx, cy, r * .3, r * .17, '#f8efff', withAlpha(C.ink, .55), 2.5);
  }
  for (let i = 0; i < 4; i++) {
    const a = t * .65 + i * 1.7;
    ellipse(g, Math.cos(a) * r * 1.0, r * .93 + Math.sin(a) * r * .16, r * .24, r * .08, C.lavender, null, 0);
  }
  g.restore();

  // 身体：更修长，头身比与基础猫完全不同
  g.save(); g.translate(0, bobFloat);
  ellipse(g, 0, r * .08, r * .78, r * .92, f.body, C.ink, 4.6);
  ellipse(g, 0, r * .27, r * .48, r * .5, f.belly, null, 0);
  // 胸口星核
  g.save(); g.globalAlpha = .9;
  drawStar(g, 0, r * .16, r * .22, r * .09, 5, C.gold, C.ink, 2, t * .8);
  g.restore();
  // 龙纹鳞片
  g.strokeStyle = withAlpha(f.accent, .65); g.lineWidth = 1.8;
  for (let i = 0; i < 3; i++) {
    g.beginPath(); g.arc(-r * .28 + i * r * .28, r * .43, r * .16, .2, Math.PI - .2); g.stroke();
  }
  // 侧翼龙鳍
  for (const sx of [-1, 1]) {
    g.save();
    g.fillStyle = '#bca8ff'; g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(sx * r * .6, -r * .1);
    g.quadraticCurveTo(sx * r * 1.32, -r * .6, sx * r * 1.24, r * .35);
    g.quadraticCurveTo(sx * r * .95, r * .2, sx * r * .55, r * .42);
    g.closePath(); g.fill(); g.stroke();
    g.restore();
  }
  // 双手合十式小爪，带星镯
  for (const sx of [-1, 1]) {
    g.save(); g.translate(sx * r * .64, r * .25);
    ellipse(g, 0, 0, r * .24, r * .29, f.body, C.ink, 3);
    g.strokeStyle = C.gold; g.lineWidth = 2.2;
    g.beginPath(); g.arc(0, r * .13, r * .18, .2, Math.PI - .2); g.stroke();
    g.restore();
  }

  // 头部：龙角、第三只眼、星环王冠
  g.save(); g.translate(0, -r * .88);
  // 龙角
  for (const sx of [-1, 1]) {
    g.save();
    g.fillStyle = C.gold; g.strokeStyle = C.ink; g.lineWidth = 3.3;
    g.beginPath();
    g.moveTo(sx * r * .3, -r * .68);
    g.quadraticCurveTo(sx * r * .55, -r * 1.14, sx * r * .8, -r * 1.28);
    g.quadraticCurveTo(sx * r * .7, -r * .92, sx * r * .56, -r * .5);
    g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = withAlpha(C.cream, .7); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(sx * r * .39, -r * .69); g.quadraticCurveTo(sx * r * .55, -r * 1.03, sx * r * .73, -r * 1.19); g.stroke();
    g.restore();
  }
  // 耳鳍
  catEar(g, -r * .6, -r * .35, r * .25, r * .38, -.4, f.body, '#ffd9e2');
  catEar(g, r * .6, -r * .35, r * .25, r * .38, .4, f.body, '#ffd9e2');
  ellipse(g, 0, 0, r * .78, r * .73, f.body, C.ink, 4.4);
  ellipse(g, 0, r * .25, r * .4, r * .28, f.belly, null, 0);

  // 第三只眼
  g.save(); g.globalAlpha = .92;
  ellipse(g, 0, -r * .44, r * .17, r * .12, '#ffeaa1', C.ink, 2);
  circle(g, 0, -r * .44, r * .055, f.eye, null, 0);
  g.restore();
  // 双眼：温柔但神性
  const lx = Math.cos(p.aim || 0) * r * .045;
  if (blink || isDead) {
    g.strokeStyle = C.ink; g.lineWidth = 2.4;
    for (const sx of [-1, 1]) {
      g.beginPath(); g.moveTo(sx * r * .44, -r * .1); g.quadraticCurveTo(sx * r * .3, r * .01, sx * r * .17, -r * .1); g.stroke();
    }
  } else {
    for (const sx of [-1, 1]) {
      g.save(); g.translate(sx * r * .3 + lx, -r * .08); g.rotate(sx * -.12);
      ellipse(g, 0, 0, r * .18, r * .22, C.white, C.ink, 2.4);
      ellipse(g, 0, r * .02, r * .07, r * .17, C.gold, null, 0);
      ellipse(g, 0, r * .04, r * .028, r * .13, C.ink, null, 0);
      g.restore();
    }
  }
  g.fillStyle = C.coral;
  g.beginPath(); g.moveTo(-r * .08, r * .13); g.lineTo(0, r * .2); g.lineTo(r * .08, r * .13); g.closePath(); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 1.8;
  g.beginPath(); g.moveTo(-r * .2, r * .3); g.quadraticCurveTo(0, r * .42, r * .2, r * .3); g.stroke();
  // 额头星印
  drawStar(g, 0, -r * .6, r * .11, r * .045, 5, C.gold, null, 0, t * .5);

  // 王冠光环
  g.save(); g.translate(0, -r * .95); g.scale(1, .3); g.rotate(t * .7);
  g.strokeStyle = C.gold; g.lineWidth = 5;
  g.beginPath(); g.arc(0, 0, r * .78, 0, TAU); g.stroke();
  g.strokeStyle = withAlpha(C.cream, .8); g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, r * .9, 0, TAU); g.stroke();
  for (let i = 0; i < 4; i++) {
    const a = t * .7 + TAU * i / 4;
    g.save(); g.rotate(a); g.translate(r * .78, 0); g.rotate(-a);
    drawStar(g, 0, 0, r * .11, r * .045, 5, C.gold, null, 0);
    g.restore();
  }
  g.restore();
  g.restore();
  g.restore();

  // 大挥爪：星辉拖尾
  if (p.attackAnim > 0) {
    const aa = p.swingAim || 0;
    for (let i = 0; i < 4; i++) {
      const a = aa - .5 + i * .28;
      drawStar(g, Math.cos(a) * r * 1.4, Math.sin(a) * r * 1.4, r * .11, r * .04, 5, C.gold, null, 0, t);
    }
  }
}

/* ---------- 独立头像造型（HUD / 暂停 / 剧情 / 死亡页复用） ---------- */

function drawHeadFrenzy(g, size, t) {

  }
  catEar(g, -size * .64, -size * .42, size * .28, size * .45, -.34, f.body, C.coralDeep);
  catEar(g, size * .64, -size * .42, size * .28, size * .42, .34, f.body, C.coralDeep);
  g.fillStyle = C.ink;
  g.beginPath(); g.moveTo(size * .56, -size * .77); g.lineTo(size * .7, -size * .63); g.lineTo(size * .57, -size * .54); g.fill();
  ellipse(g, 0, 0, size * .88, size * .8, f.body, C.ink, 3.4);
  ellipse(g, 0, size * .3, size * .42, size * .27, f.belly, null, 0);
  for (const sx of [-1, 1]) {

    g.strokeStyle = C.ink; g.lineWidth = size * .1; g.lineCap = 'round';
    g.beginPath(); g.moveTo(sx * size * .18, -size * .4); g.lineTo(sx * size * .55, -size * .23); g.stroke();
  }
  g.fillStyle = C.ink;
  g.beginPath(); g.moveTo(-size * .07, size * .13); g.lineTo(0, size * .2); g.lineTo(size * .07, size * .13); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-size * .25, size * .26); g.quadraticCurveTo(0, size * .48, size * .25, size * .26); g.stroke();
  g.strokeStyle = withAlpha(C.ink, .6); g.lineWidth = 1.8;

function drawHeadDivine(g, size, t) {
