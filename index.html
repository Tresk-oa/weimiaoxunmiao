  g.quadraticCurveTo(x, y + h, x, y + h - radius);
  g.lineTo(x, y + radius);
  g.quadraticCurveTo(x, y, x + radius, y);

}

  for (let i = 0; i < points * 2; i++) {

    const a = rot + i * Math.PI / points;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;

  g.closePath();

  g.save(); g.font = font;

    mobs: ['eyeball', 'tentaclecat', 'mouthcat', 'spore'],
    boss: 'eyebeast',
  },
];

function chapterIndexForStage(stage) {
  return Math.floor((Math.max(1, stage) - 1) / CHAPTER_STAGES) % ENEMY_MODULES.length;
}
function moduleForStage(stage) {
  return ENEMY_MODULES[chapterIndexForStage(stage)];
}
function stageLabel(stage, mode) {
  if (mode === 'story') {
    const ch = Math.floor((stage - 1) / CHAPTER_STAGES) + 1;
    const lv = ((stage - 1) % CHAPTER_STAGES) + 1;
    return `${ch}-${lv}`;
  }
  return `STAGE ${String(stage).padStart(2, '0')}`;
}
function stageChapterLabel(stage, mode) {
  if (mode === 'story') {
    const ch = Math.floor((stage - 1) / CHAPTER_STAGES) + 1;
    return `第 ${ch} 章 · 第 ${((stage - 1) % CHAPTER_STAGES) + 1} 关`;
  }
  return moduleForStage(stage).title;
}

// 无限模式的动态成长：同一张难度表思想，按层数算倍率。
function modeStatMul(modeId, kind, stage) {
  if (modeId === 'infinite') {
    const s = Math.max(0, (stage || 1) - 1);
    if (kind === 'hpMul') return 1 + s * .18;
    if (kind === 'dmgMul') return 1 + s * .10;
    if (kind === 'countMul') return Math.min(1.9, 1 + s * .035);
    if (kind === 'dropMul') return 1;
  }
  const m = MODES[modeId] || MODES.easy;
  return m[kind] === undefined ? 1 : m[kind];
}

/* ==================================================================
   §5 存档系统：9 个槽位，每个槽 = 一份包含五模式进度的 Profile。
   ------------------------------------------------------------------
   数据结构（单槽）：
   {
     version, createdAt, updatedAt,
     stats: { kills, runs, bestScore, storyCleared },
     modes: {
       easy / hard / hell / story / infinite: {
         checkpoint,      // 进入当前关时的快照；不保存战斗中实时数值
         bestStage, clearedStage, unlockedStage,
         level, form, skillStacks, totalKills,
         seen,            // 仅剧情模式使用：已看过的剧情章节
       }
     }
   }
   checkpoint = { stage, seed, at, player: {...进入关卡时的角色数值...} }
   死亡时按肉鸽规则结束本局，并从该关的 checkpoint 重开，不保留死亡瞬间状态。
   ================================================================== */
function blankModeProgress(modeId) {
  return {
    checkpoint: null,
    bestStage: 0,
    clearedStage: 0,
    unlockedStage: 1,
    level: 1,
    form: 0,
    skillStacks: {},
    totalKills: 0,
    seen: {},
    unlocked: modeId === 'infinite' ? false : true,
  };
}

function createProfile() {
  const now = Date.now();
  const modes = {};
  for (const id of MODE_IDS) modes[id] = blankModeProgress(id);
  return {
    version: SAVE_VERSION,
    createdAt: now,
    updatedAt: now,
    stats: { kills: 0, runs: 0, bestScore: 0, storyCleared: false },
    modes,
  };
}

function normalizeProfile(raw, slot) {
  if (!raw || typeof raw !== 'object') return null;
  const base = createProfile();
  base.createdAt = Math.max(0, Number(raw.createdAt) || base.createdAt);
  base.updatedAt = Math.max(0, Number(raw.updatedAt) || base.updatedAt);
  const rs = raw.stats && typeof raw.stats === 'object' ? raw.stats : {};
  base.stats.kills = Math.max(0, Number(rs.kills) || 0);
  base.stats.runs = Math.max(0, Number(rs.runs) || 0);
  base.stats.bestScore = Math.max(0, Number(rs.bestScore) || 0);
  base.stats.storyCleared = !!rs.storyCleared;
  const rm = raw.modes && typeof raw.modes === 'object' ? raw.modes : {};
  for (const id of MODE_IDS) {
    const src = rm[id] && typeof rm[id] === 'object' ? rm[id] : {};
    const dst = base.modes[id];
    dst.bestStage = Math.max(0, Number(src.bestStage) || 0);
    dst.clearedStage = Math.max(0, Number(src.clearedStage) || 0);
    dst.unlockedStage = clamp(Math.floor(Number(src.unlockedStage) || 1), 1, STAGE_CFG.storyStageCount);
    dst.level = Math.max(1, Math.floor(Number(src.level) || 1));
    dst.form = clamp(Math.floor(Number(src.form) || 0), 0, FORMS.length - 1);
    dst.totalKills = Math.max(0, Number(src.totalKills) || 0);
    dst.unlocked = id === 'infinite' ? !!src.unlocked : true;
    if (src.skillStacks && typeof src.skillStacks === 'object') {
      for (const [k, v] of Object.entries(src.skillStacks)) {
        if (SKILL_BY_ID && SKILL_BY_ID[k]) dst.skillStacks[k] = clamp(Math.floor(Number(v) || 0), 0, 4);
      }
    }
    if (src.seen && typeof src.seen === 'object') {
      for (const [k, v] of Object.entries(src.seen)) if (v) dst.seen[k] = true;
    }
    if (src.checkpoint && typeof src.checkpoint === 'object') {
      const cp = src.checkpoint;
      dst.checkpoint = {
        stage: clamp(Math.floor(Number(cp.stage) || 1), 1, 9999),
        seed: (Number(cp.seed) >>> 0) || 0,
        at: Math.max(0, Number(cp.at) || 0),
        player: cp.player && typeof cp.player === 'object' ? cp.player : null,
        skillStacks: cp.skillStacks && typeof cp.skillStacks === 'object' ? cp.skillStacks : {},
        recipesDone: cp.recipesDone && typeof cp.recipesDone === 'object' ? cp.recipesDone : {},
        kills: Math.max(0, Number(cp.kills) || 0),
        score: Math.max(0, Number(cp.score) || 0),
      };
    }
  }
  if (base.modes.story.clearedStage >= STAGE_CFG.storyStageCount) {
    base.stats.storyCleared = true;
    base.modes.infinite.unlocked = true;
  }
  base.version = SAVE_VERSION;
  base.__slot = slot;
  return base;
}

function readSlot(slot) {
  try {
    const key = SAVE_PREFIX + slot;
    const raw = localStorage.getItem(key);
    if (!raw) return { ok: true, empty: true, profile: null };
    const parsed = JSON.parse(raw);
    const profileOut = normalizeProfile(parsed, slot);
    if (!profileOut) return { ok: false, error: '存档数据损坏（无法识别 JSON 结构）', empty: false };
    return { ok: true, empty: false, profile: profileOut };
  } catch (e) {
    return { ok: false, error: '读档失败：' + ((e && e.name) || '未知错误'), empty: false };
  }
}

function writeSlot(slot, prof) {
  try {
    const key = SAVE_PREFIX + slot;
    prof.updatedAt = Date.now();
    const json = JSON.stringify(prof);
    // 单槽档案正常远小于 1MB；超限通常意味着存储异常或数据被污染。
    if (json.length > 3.5 * 1024 * 1024) return { ok: false, error: '存档过大，浏览器存储空间不足' };
    localStorage.setItem(key, json);
    return { ok: true, bytes: json.length };
  } catch (e) {
    const name = (e && e.name) || '';
    if (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED') {
      return { ok: false, error: '存储空间已满（存档满），请删除不需要的存档位' };
    }
    return { ok: false, error: '写入失败：' + (name || '浏览器禁止本地存储') };
  }
}

function deleteSlot(slot) {
  try { localStorage.removeItem(SAVE_PREFIX + slot); return { ok: true }; }
  catch (e) { return { ok: false, error: '删除失败：' + ((e && e.name) || '未知错误') }; }
}

function loadSettings() {
  const out = Object.assign({}, DEFAULT_SETTINGS);
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const scale = Number(parsed.scale);
      const fps = Number(parsed.fps);
      out.scale = [.75, 1, 1.25, 1.5].includes(scale) ? scale : DEFAULT_SETTINGS.scale;
      out.fps = [30, 60, 120, 0].includes(fps) ? fps : DEFAULT_SETTINGS.fps;
      out.masterVolume = clamp(Number(parsed.masterVolume), 0, 1);
      if (!Number.isFinite(out.masterVolume)) out.masterVolume = DEFAULT_SETTINGS.masterVolume;
      out.sfxVolume = clamp(Number(parsed.sfxVolume), 0, 1);
      if (!Number.isFinite(out.sfxVolume)) out.sfxVolume = DEFAULT_SETTINGS.sfxVolume;
      out.muted = !!parsed.muted;
    }
  } catch (e) { /* 无效存档就使用默认设置 */ }
  return out;
}
function persistSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    return { ok: true };
  } catch (e) {
    const name = (e && e.name) || '';
    if (name === 'QuotaExceededError') return { ok: false, error: '存储空间已满' };
    return { ok: false, error: '浏览器禁止本地存储：' + (name || '未知错误') };
  }
}

let slotCache = new Array(SAVE_SLOTS + 1).fill(null); // 主页摘要缓存，index 1..9
let storyProgress = { seen: {} };
let slotMenu = null;         // { slot } 存档位操作弹窗
let homeModeRects = [];
let saveSlotRects = [];
let storyStageRects = [];
let betweenRects = [];
let exitRects = [];
let bestiaryRects = [];
let confirmAction = null;    // 覆盖 / 删除确认
let settingsNotice = null;   // 设置页“保存成功/失败”提示
let bestiaryReturn = 'settings';

const touchState = {
  joyId: null, joyBaseX: 0, joyBaseY: 0, joyX: 0, joyY: 0,
  attackId: null, dashId: null,

function refreshSlotCache() {
  for (let i = 1; i <= SAVE_SLOTS; i++) {
    const res = readSlot(i);
    slotCache[i] = res.ok && !res.empty ? res.profile : null;
  }
}

function syncMetaFromProfile() {
  if (!profile) return;
  // 只在切换档案时读到磁盘数据；同一档案内 meta.kills 是累计击杀，不能因为一次检查点回写而变少。
  meta.kills = Math.max(meta.kills || 0, profile.stats.kills || 0);
  meta.bestStage = 0;
  meta.bestScore = Math.max(meta.bestScore || 0, profile.stats.bestScore || 0);
  meta.runs = Math.max(meta.runs || 0, profile.stats.runs || 0);
  for (const id of MODE_IDS) {
    meta.bestStage = Math.max(meta.bestStage, profile.modes[id].bestStage || 0);
  }
}

function syncProfileStats() {
  if (!profile) return;
  profile.stats.kills = Math.max(0, meta.kills);
  profile.stats.bestScore = Math.max(profile.stats.bestScore, meta.bestScore);
  profile.stats.runs = Math.max(profile.stats.runs, meta.runs);
  profile.stats.storyCleared = profile.modes.story.clearedStage >= STAGE_CFG.storyStageCount;
  if (profile.stats.storyCleared) profile.modes.infinite.unlocked = true;
  storyProgress.seen = Object.assign({}, profile.modes.story.seen || {});
}

function saveMeta() {
  // 内存级同步；真正落盘由检查点 / 手动存档 / 每 3 关提示触发，避免频繁写坏档。
  syncProfileStats();
}

function persistProfile(message) {
  if (!profile || !activeSlot) {
    if (message) showToast('还没选中存档位 · 请先在主页选择或新建一个存档', C.coral, 2.8);
    return false;
  }
  syncProfileStats();
  const res = writeSlot(activeSlot, profile);
  refreshSlotCache();
  if (!res.ok) {
    showToast('保存失败：' + res.error, C.coral, 3.4);
    return false;
  }
  rememberLastSlot(activeSlot);
  if (message) showToast('保存成功 · 已写入存档位 ' + activeSlot, C.mint, 2.2);
  return true;
}

function rememberLastSlot(slot) {
  try { localStorage.setItem(LAST_SLOT_KEY, String(slot)); } catch (e) { /* 忽略 */ }
}
function lastSlotHint() {
  try {
    const n = Number(localStorage.getItem(LAST_SLOT_KEY));
    return n >= 1 && n <= SAVE_SLOTS ? n : 0;
  } catch (e) { return 0; }
}

function activateProfile(slot, silent) {
  const res = readSlot(slot);
  if (!res.ok) { if (!silent) showToast(res.error, C.coral, 3.2); return false; }
  if (res.empty) { if (!silent) showToast(`存档位 ${slot} 还是空的`, C.lavender, 2.2); return false; }
  activeSlot = slot;
  profile = res.profile;
  meta = { kills: 0, bestStage: 0, bestScore: 0, runs: 0 };
  syncMetaFromProfile();
  storyProgress = { seen: Object.assign({}, profile.modes.story.seen || {}) };
  rememberLastSlot(slot);
  refreshSlotCache();
  slotMenu = null;
  if (!silent) { sfx('clear'); showToast(`已载入存档位 ${slot}`, C.mint, 2.2); }
  return true;
}

function createProfileAt(slot, overwrite) {
  const existing = readSlot(slot);
  if (!existing.ok) { showToast(existing.error, C.coral, 3.2); return false; }
  if (!existing.empty && !overwrite) { showToast('该存档位已有档案 · 请选择覆盖或换一个槽位', C.coral, 2.6); return false; }
  const prof = createProfile();
  const res = writeSlot(slot, prof);
  if (!res.ok) { showToast('新建失败：' + res.error, C.coral, 3.2); return false; }
  activeSlot = slot;
  profile = prof;
  meta = { kills: 0, bestStage: 0, bestScore: 0, runs: 0 };
  storyProgress = { seen: {} };
  rememberLastSlot(slot);
  refreshSlotCache();
  slotMenu = null;
  confirmAction = null;
  sfx('level');
  showToast(`新建成功 · 存档位 ${slot}`, C.mint, 2.2);
  return true;
}

function overwriteProfileAt(slot) {
  if (!profile) { showToast('当前没有可覆盖的档案 · 请先新建或载入', C.coral, 2.6); return false; }
  if (!activeSlot) { showToast('请先激活一个存档位', C.coral, 2.2); return false; }
  syncProfileStats();
  const copy = normalizeProfile(JSON.parse(JSON.stringify(profile)), slot);
  const res = writeSlot(slot, copy);
  if (!res.ok) { showToast('覆盖失败：' + res.error, C.coral, 3.2); return false; }
  activeSlot = slot;
  profile = copy;
  meta = { kills: 0, bestStage: 0, bestScore: 0, runs: 0 };
  syncMetaFromProfile();
  storyProgress = { seen: Object.assign({}, copy.modes.story.seen || {}) };
  rememberLastSlot(slot);
  refreshSlotCache();
  slotMenu = null;
  confirmAction = null;
  sfx('clear');
  showToast(`已覆盖并切换到存档位 ${slot}`, C.mint, 2.2);
  return true;
}

function deleteProfileAt(slot) {
  const res = deleteSlot(slot);
  if (!res.ok) { showToast(res.error, C.coral, 3.0); return false; }
  if (activeSlot === slot) {
    activeSlot = 0;
    profile = null;
    meta = { kills: 0, bestStage: 0, bestScore: 0, runs: 0 };
    storyProgress = { seen: {} };
  }
  refreshSlotCache();
  slotMenu = null;
  confirmAction = null;
  showToast(`存档位 ${slot} 已删除`, C.lavender, 2.2);
  return true;
}

function saveStoryProgress() {
  if (!profile) return;
  profile.modes.story.seen = Object.assign({}, storyProgress.seen || {});
}

function formatSaveTime(ms) {
  if (!ms) return '从未游玩';
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function modeProgressLabel(modeId, prog) {
  if (!prog) return '--';
  if (modeId === 'story') {
    const cleared = prog.clearedStage || 0;
    if (cleared >= STAGE_CFG.storyStageCount) return '已通关';
    if (cleared > 0) {
      const ch = Math.floor((cleared - 1) / CHAPTER_STAGES) + 1;
      return `${ch}-${((cleared - 1) % CHAPTER_STAGES) + 1}`;
    }
    return '1-1';
  }
  if (modeId === 'infinite') {
    if (!prog.unlocked) return '锁定';
    return `${prog.bestStage || 1} 层`;
  }
  return prog.bestStage ? `STAGE ${prog.bestStage}` : 'STAGE 01';
}

// 网页兜底：按比例缩放 Canvas CSS，并始终把 16:9 画面完整装进视口。
function applyViewScale() {
  // §17：全屏时忽略窗口档位，等比铺满。
  if (document.fullscreenElement) {
    const fit = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = `${Math.floor(W * fit)}px`;
    canvas.style.height = `${Math.floor(H * fit)}px`;
    return;
  }
  if (window.nyanDesktop && window.nyanDesktop.setWindowScale) {
    window.nyanDesktop.setWindowScale(settings.scale).catch(() => {});
    canvas.style.width = '';
    canvas.style.height = '';
    return;
  }
  const stage = document.getElementById('stage');
  if (!stage) return;
  const baseW = W * settings.scale;
  const baseH = H * settings.scale;
  const fit = Math.min(1, window.innerWidth / baseW, window.innerHeight / baseH);
  canvas.style.width = `${Math.floor(baseW * fit)}px`;
  canvas.style.height = `${Math.floor(baseH * fit)}px`;
}
window.addEventListener('resize', () => { if (!window.nyanDesktop || document.fullscreenElement) applyViewScale(); });
document.addEventListener('fullscreenchange', () => {
  applyViewScale();
  if (settingsNotice) settingsNotice = null;
});

function initAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      // 架构：SFX / MUSIC 两条总线 -> 主增益 -> 柔和压缩 -> 输出。
      // 压缩器让提高后的 gain 不炸耳，同时把刺耳高频削掉一点。
      masterGain = audioCtx.createGain();
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 22;
      comp.ratio.value = 3.2;
      comp.attack.value = .012;
      comp.release.value = .22;
      sfxBus = audioCtx.createGain();
      musicBus = audioCtx.createGain();
      const warm = audioCtx.createBiquadFilter();
      warm.type = 'lowpass';
      warm.frequency.value = 5200;
      warm.Q.value = .55;
      sfxBus.connect(warm);
      musicBus.connect(warm);
      warm.connect(masterGain);
      masterGain.connect(comp);
      comp.connect(audioCtx.destination);
      applyAudioSettings();
      // 程序化生成一段噪声，用于挥爪/冲刺的摩擦声。
      const length = Math.floor(audioCtx.sampleRate * 0.5);
      noiseBuffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  } catch (e) { audioCtx = null; }
}

function audioBus(channel) { return channel === 'music' ? musicBus : sfxBus; }

function tone(freq, dur, type, vol, slide = 0, delay = 0, channel = 'sfx', cutoff = 0) {
  if (!audioCtx || muted) return;
  const start = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(30, freq), start);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), start + dur);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), start + .014);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  let node = gain;
  if (cutoff > 0) {
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = .7;
    gain.connect(lp); node = lp;
  }
  const bus = audioBus(channel) || masterGain;
  osc.connect(gain); node.connect(bus);
  osc.start(start); osc.stop(start + dur + .02);
}

function noise(dur, vol, delay = 0, cutoff = 1800, channel = 'sfx') {
  if (!audioCtx || muted || !noiseBuffer) return;
  const start = audioCtx.currentTime + delay;
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  const gain = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = .9;
  gain.gain.setValueAtTime(vol, start);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  src.connect(lp); lp.connect(gain);
  const bus = audioBus(channel) || masterGain;
  gain.connect(bus);
  src.start(start, Math.random() * .12, dur + .02); src.stop(start + dur + .03);
}

// “喵”声合成器：升调起音 -> 稍降 -> 收尾，带一点低频谐波，听感像猫叫而不是电子蜂鸣。
function meow(base = 560, dur = .16, vol = .2, delay = 0, mood = 'fierce', channel = 'sfx') {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + delay;
  const top = mood === 'sad' ? base * 1.08 : base * 1.34;
  const tail = mood === 'sad' ? base * .72 : base * .88;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = .6;
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(base * .88, t0);
  osc.frequency.linearRampToValueAtTime(top, t0 + Math.min(.055, dur * .4));
  osc.frequency.exponentialRampToValueAtTime(tail, t0 + dur);
  gain.gain.setValueAtTime(.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + .035);
  gain.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(gain); lp.connect(audioBus(channel) || masterGain);
  gain.connect(lp);
  osc.start(t0); osc.stop(t0 + dur + .03);
  // 轻微的第二谐波，让声音毛茸茸一点。
  tone(base * 2.06, dur * .55, 'sine', vol * .22, -base * .2, delay + .01, channel, 3600);
}

function applyAudioSettings() {
  muted = !!settings.muted;
  const target = settings.muted ? 0 : clamp(settings.masterVolume, 0, 1);
  if (masterGain && audioCtx) {
    masterGain.gain.setTargetAtTime(target, audioCtx.currentTime, .03);
    if (sfxBus) sfxBus.gain.setTargetAtTime(clamp(settings.sfxVolume, 0, 1), audioCtx.currentTime, .03);
    if (musicBus) musicBus.gain.setTargetAtTime(clamp(settings.sfxVolume, 0, 1) * .58, audioCtx.currentTime, .03);
  }
}

function sfx(name, pitch = 1) {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;
  if (sfxLast[name] && now - sfxLast[name] < .045) return;
  sfxLast[name] = now;
  switch (name) {
    case 'swipe':
      // 挥爪 = 短促“喵嗷” + 风切声
      meow(610 * pitch, .15, .21, 0, 'fierce');
      noise(.11, .16, .01, 1350);
      break;
    case 'hit':
      tone(150 * pitch, .075, 'square', .23, -55, 0, 'sfx', 950);
      noise(.07, .20, .01, 800);
      break;
    case 'kill':
      meow(760 * pitch, .14, .18, 0, 'glee');
      tone(230, .14, 'sine', .20, -130, .02, 'sfx', 1200);
      noise(.10, .08, .02, 1600);
      break;
    case 'pickup':
      tone(650 * pitch, .1, 'sine', .13, 150, 0, 'sfx', 2600);
      tone(980 * pitch, .09, 'triangle', .08, 130, .045, 'sfx', 3200);
      break;
    case 'coin':
      tone(900, .11, 'sine', .18, 180, 0, 'sfx', 3200);
      tone(1320, .14, 'triangle', .12, 170, .06, 'sfx', 3600);
      noise(.06, .05, 0, 2900);
      break;
    case 'dash':
      noise(.2, .24, 0, 1150);
      tone(180, .19, 'triangle', .18, 260, .01, 'sfx', 900);
      meow(520, .15, .12, .08, 'fierce');
      break;
    case 'hurt':
      // 受伤 = 委屈、下拉的猫叫
      meow(430, .3, .3, 0, 'sad');
      tone(150, .22, 'triangle', .15, -30, .02, 'sfx', 700);
      noise(.14, .08, .03, 600);
      break;
    case 'level':
      // 升级 = 滑稽升调 + 弹簧音
      [392, 523, 698, 880].forEach((f, i) => tone(f, .2, 'triangle', .14, 24, i * .075, 'sfx', 2800));
      tone(330, .35, 'sine', .09, -120, .28, 'sfx', 1400);
      noise(.08, .06, 0, 2600);
      break;
    case 'evolve':
      // 进化 = 夸张变形音：上滑 + 抖动 + 毛茸茸的和弦
      [330, 440, 587, 740, 988].forEach((f, i) => tone(f, .3, i % 2 ? 'sine' : 'triangle', .12, 100, i * .07, 'sfx', 3000));
      tone(176, .75, 'triangle', .1, 260, .02, 'sfx', 1200);
      noise(.42, .10, .04, 3200);
      meow(660, .3, .18, .45, 'glee');
      break;
    case 'door':
      [440, 554, 659].forEach((f, i) => tone(f, .28, 'sine', .13, 65, i * .1, 'sfx', 2600));
      noise(.2, .06, .15, 1800);
      break;
    case 'boss':
      tone(82, .65, 'sawtooth', .19, 34, 0, 'sfx', 700);
      tone(120, .55, 'square', .09, 20, .14, 'sfx', 950);
      noise(.5, .08, .1, 450);
      break;
    case 'death':
      [392, 330, 262, 196].forEach((f, i) => meow(f, .26, .16, i * .13, 'sad'));
      noise(.3, .06, .16, 800);
      break;
    case 'clear':
      // 过关 = 欢快开罐头声 + 胜利猫叫
      noise(.18, .16, 0, 3400);
      tone(1046, .22, 'sine', .15, 120, 0, 'sfx', 4200);
      [523, 659, 784, 988].forEach((f, i) => tone(f, .24, 'triangle', .14, 0, .12 + i * .09, 'sfx', 3000));
      meow(700, .25, .16, .42, 'glee');
      break;
    case 'stomp':
      tone(75, .3, 'square', .22, -15, 0, 'sfx', 600);
      noise(.24, .18, .02, 620);
      break;
    case 'shoot':
      tone(320, .1, 'square', .13, -160, 0, 'sfx', 1500);
      noise(.06, .06, 0, 1200);
      break;
    case 'click':
      tone(560, .05, 'triangle', .12, 120, 0, 'sfx', 2600);
      break;
    default: tone(440, .08, 'sine', .1, 80);
  }
}

function updateMusic(dt) {
  if (!audioCtx || muted) return;
  if (!['playing', 'dead'].includes(state)) return;
  musicTimer -= dt;
  if (musicTimer > 0) return;
  musicTimer = .43;
  const notes = [392, 523, 659, 523, 440, 554, 659, 554, 523, 659, 784, 659, 494, 587, 698, 554];
  const base = notes[musicStep % notes.length];
  musicStep++;
  tone(base, .14, 'triangle', .035, 10, 0, 'music', 2200);
  if (musicStep % 4 === 0) tone(base * .5, .2, 'sine', .055, 6, 0, 'music', 1600);
  if (run && run.stage % STAGE_CFG.bossEvery === 0) {
    // Boss 关的音乐低一点、快一点
    musicTimer = .36;
    if (musicStep % 2 === 0) tone(196, .22, 'triangle', .03, -4, 0, 'music', 1200);
  }
}

function setMuted(next, save = true) {
  settings.muted = !!next;
  applyAudioSettings();
  if (!settings.muted) initAudio();
  if (save) persistSettings();
}

function setMasterVolume(v, save = true, unmute = false) {

function setSfxVolume(v, save = true) {

function v11InBattleRuntime() {

/* ------------------------------------------------------------------
   03B. 剧情过场 / 已读存档 / 结局
   剧情状态与战斗完全隔离：state === 'story' 时不更新敌人、波次、弹幕，
   draw() 也只绘制剧情层，因此不会出现战斗残留或双世界渲染。
   ------------------------------------------------------------------ */
function getStoryChapterForStage(stage) {
  const exact = STORY_CHAPTERS.find(c => c.stage === stage);
  if (exact) return exact;
  // 兜底：未来新增关卡没有章节时，沿用最近一章，保证每关都有过场。
  const prior = STORY_CHAPTERS.filter(c => c.stage <= stage).sort((a, b) => b.stage - a.stage)[0];
  return prior || STORY_CHAPTERS[0];
}

function storyFont() { return '800 20px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif'; }
function wrapStoryLine(text) {
  return wrapText(ctx, text, 758, storyFont());
}

function startStory(chapter, onDone) {
  if (!chapter) { if (onDone) onDone(); return; }
  shake = 0; flash = 0; hitVignette = 0;
  transition = null;
  const seen = !!storyProgress.seen[chapter.id];
  story = {
    chapter,
    onDone,
    phase: seen ? 'gate' : 'play',
    seenBefore: seen,
    line: 0,
    reveal: 0,
    t: 0,
    enter: 0,
    bob: 0,
    wrapped: [],
    gateRects: [],
    skipRect: { ...storySkipRect },
  };
  state = 'story';
  if (!seen) {
    story.wrapped = wrapStoryLine(chapter.lines[0].text);
    sfx('door');
  }
}

function beginStoryPlay() {
  if (!story) return;
  story.phase = 'play';
  story.line = 0;
  story.reveal = 0;
  story.t = 0;
  story.wrapped = wrapStoryLine(story.chapter.lines[0].text);
  sfx('click');
}

function markChapterSeen() {
  if (!story) return;
  storyProgress.seen[story.chapter.id] = true;
  saveStoryProgress();
}

function finishStory(skip = false) {
  if (!story) return;
  const callback = story.onDone;
  markChapterSeen();
  story = null;
  shake = 0; flash = 0;
  if (skip) sfx('click');
  if (callback) callback();
  if (state === 'story') state = 'playing';
}

function nextStoryLine() {
  if (!story || story.phase !== 'play') return;
  const current = story.chapter.lines[story.line];
  if (story.reveal < current.text.length) {
    // 第一次点击/回车先“加速”到整句显示；再点才换下一句。
    story.reveal = current.text.length;
    return;
  }
  if (story.line < story.chapter.lines.length - 1) {
    story.line++;
    story.reveal = 0;
    story.wrapped = wrapStoryLine(story.chapter.lines[story.line].text);
    sfx('click');
  } else {
    markChapterSeen();
    const chapter = story.chapter;
    const callback = story.onDone;
    story = null;
    shake = 0; flash = 0;
    if (chapter.final) {
      // 最终章的最后一击交给 ending 画面；callback 会启动“悬案仍未告破”。
      if (callback) callback();
    } else if (callback) callback();
    if (state === 'story') state = 'playing';
    sfx('clear');
  }
}

function updateStory(dt) {
  if (!story) return;
  story.t += dt;
  story.enter = Math.min(1, story.enter + dt * 2.4);
  story.bob += dt;
  if (story.phase === 'gate') return;
  const line = story.chapter.lines[story.line];
  if (!line) return;
  const before = story.reveal;
  story.reveal = Math.min(line.text.length, story.reveal + dt * 33);
  if (Math.floor(before) !== Math.floor(story.reveal) && Math.random() < .25) {
    // 打字机偶尔冒一颗小星，纯装饰，不影响计时。
    addStorySpark(false);
  }
  if (line.portrait === 'star' || story.chapter.final) {
    story.starTimer = (story.starTimer || 0) + dt;
  }
}

function startEnding() {
  const snapshotSource = run ? (run.flashbacks || []) : [];
  const cards = snapshotSource.slice(-4);
  ending = {
    t: 0,
    cards,
    stage: run ? run.stage : 0,
    kills: run ? run.kills : 0,
    score: run ? run.score : 0,
    form: player ? player.form : 0,
    seedHex: run ? run.seedHex : '00000000',
  };
  transition = null;
  story = null;
  shake = 0; flash = 0; hitVignette = 0;
  state = 'ending';
  if (run) {
    if (run.score > meta.bestScore) { meta.bestScore = run.score; }
    if (run.stage > meta.bestStage) { meta.bestStage = run.stage; }
    // 累计击杀在 killEnemy 里已经逐只写入 meta，结局这里不能再加一次 run.kills。
    saveMeta();
  }
  sfx('evolve');
}

function inputVector() {
  let x = 0, y = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) x--;
  if (keys['KeyD'] || keys['ArrowRight']) x++;
  if (keys['KeyW'] || keys['ArrowUp']) y--;
  if (keys['KeyS'] || keys['ArrowDown']) y++;
  let len = Math.hypot(x, y);
  if (len > 0) { x /= len; y /= len; }
  // §12 触摸摇杆与键鼠互不干扰：只要摇杆按住，就用摇杆向量。
  if (touchState.joyId !== null && touchState.vec) {
    x = touchState.vec.x; y = touchState.vec.y;
    len = Math.hypot(x, y);
  }
  return { x, y, len: Math.min(1, len) };
}

function nearestEnemyAngle() {
  if (!player || !enemies.length) return null;
  let best = null, bestD = Infinity;
  for (const e of enemies) {
    if (!e || e.dead || e.spawnTimer > 0) continue;
    const d = dist2(player.x, player.y, e.x, e.y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best ? Math.atan2(best.y - player.y, best.x - player.x) : null;
}

function updateAim() {
  if (!player || player.dead) return;
  if (touchState.usingTouch) {
    const auto = touchState.attackHeld ? nearestEnemyAngle() : null;
    if (auto !== null) { player.aim = auto; return; }
    const mv = inputVector();
    if (mv.len) player.aim = Math.atan2(mv.y, mv.x);
    return;
  }
  if (mouse.inside) {
    const ang = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    if (Number.isFinite(ang)) player.aim = ang;
  } else {
    const mv = inputVector();
    if (mv.len) player.aim = Math.atan2(mv.y, mv.x);
  }
}

/* ------------------------------------------------------------------
   04. 开局 / 房间生成 / 波次
   ------------------------------------------------------------------ */

function rollRoomsForStage(stage) {
  const cfg = STAGE_CFG;
  if (stage % cfg.bossEvery === 0) return cfg.bossRooms;
  return localInt(run.rng, cfg.roomsMin, cfg.roomsMax);
}

/* ------------------------------------------------------------------
   §5 / §16：关卡检查点。只记录“进入关卡时的角色状态”，
   不保存战斗中的实时数值；死亡时按肉鸽规则从本关检查点重开。
   ------------------------------------------------------------------ */
const PLAYER_PERSIST_FIELDS = [
  'hp', 'maxHp', 'level', 'xp', 'xpNeed', 'form',
  'moveSpeed', 'attackDamage', 'attackRate', 'attackRange', 'attackArc', 'attackAnimMax',
  'dashCooldown', 'dashDamageMul', 'dashPierce', 'magnetRadius', 'critChance', 'critMul',
  'lifesteal', 'xpMul', 'thornLevel', 'thornMul',
  'fishBladeLevel', 'fishBladePierce', 'whirlLevel', 'whirlRatio', 'whirlRange',
  'cloneLevel', 'cloneDamageMul', 'roomHealBonus',
  'shield', 'shieldMax', 'shieldRegen', 'flameBurnMul', 'frostSlow',
  'thunderChains', 'thunderRatio', 'stormFrostLevel', 'cycloneDashLevel',
  'fireGuardLevel', 'fireGuardMul', 'bloodWhirlLevel', 'bloodWhirlHeal',
];

function snapshotPlayerState() {
  const out = {};
  for (const key of PLAYER_PERSIST_FIELDS) {
    const value = player && player[key];
    if (typeof value === 'number' && Number.isFinite(value)) out[key] = value;
  }
  return out;
}

function applyPlayerSnapshot(snap) {
  player = createPlayer();
  if (!snap) return;
  for (const key of PLAYER_PERSIST_FIELDS) {
    if (typeof snap[key] === 'number' && Number.isFinite(snap[key])) player[key] = snap[key];
  }
  player.form = clamp(Math.floor(player.form) || 0, 0, FORMS.length - 1);
  player.r = FORMS[player.form].radius;
  player.level = Math.max(1, Math.floor(player.level) || 1);
  player.maxHp = Math.max(1, Math.round(player.maxHp));
  player.hp = clamp(player.hp, 1, player.maxHp);
  player.xpNeed = Math.max(1, player.xpNeed || BALANCE.xpCurve(player.level));
  player.dashHits = new Set();
  player.dashCd = 0;
  player.dashTimer = 0;
  player.attackTimer = .2;
  player.invuln = .9;
  player.dead = false;
  player.deathT = 0;
  player.x = W / 2;
  player.y = INNER.bottom - 62;
}

function makeStageCheckpoint(stage, seed) {
  return {
    stage: Math.max(1, Math.floor(stage) || 1),
    seed: (Number(seed) >>> 0) || makeSeed(),
    at: Date.now(),
    player: snapshotPlayerState(),
    skillStacks: Object.assign({}, run ? run.upgradeStacks : {}),
    recipesDone: Object.assign({}, run ? run.recipesDone : {}),
    kills: run ? run.kills : 0,
    score: run ? run.score : 0,
  };
}

function writeStageCheckpoint(stage, persist) {
  if (!profile || !activeSlot || !run) return;
  const mp = profile.modes[run.mode];
  if (!mp) return;
  mp.checkpoint = makeStageCheckpoint(stage, run.seed);
  mp.bestStage = Math.max(mp.bestStage, stage);
  mp.level = player.level;
  mp.form = player.form;
  mp.skillStacks = Object.assign({}, run.upgradeStacks);
  mp.totalKills = Math.max(mp.totalKills, meta.kills);
  if (persist) persistProfile(false);
}

function modeProgressFor(modeId) {
  return profile && profile.modes ? profile.modes[modeId] : null;
}

function startModeStage(modeId, stage, opts = {}) {
  initAudio();
  const mode = MODES[modeId] || MODES.easy;
  stage = Math.max(1, Math.floor(Number(stage) || 1));
  const mp = modeProgressFor(modeId);
  const cp = opts.checkpoint !== undefined ? opts.checkpoint : (mp ? mp.checkpoint : null);
  const canUseCp = !!cp && !!cp.player && cp.stage === stage && !opts.fresh;
  const seed = (Number(opts.seed) >>> 0) || (canUseCp && cp.seed ? cp.seed : makeSeed());
  if (opts.countRun !== false) {
    meta.runs++;
    saveMeta();
  }
  run = {
    seed,
    seedHex: seedHex(seed),
    rng: seeded(seed),
    mode: modeId,
    modeName: mode.name,
    isStory: mode.story,
    stage,
    roomNumber: 1,
    roomsThisStage: 0,
    theme: THEMES[0],
    module: ENEMY_MODULES[0],
    upgradeStacks: {},
    recipesDone: {},
    pendingLevelUps: 0,
    pendingEvolution: false,
    kills: canUseCp ? (cp.kills || 0) : 0,
    score: canUseCp ? (cp.score || 0) : 0,
    scorePickups: 0,
    totalRooms: 0,
    flashbacks: [],
    checkpointStage: stage,
  };
  applyPlayerSnapshot(canUseCp ? cp.player : null);
  if (canUseCp && cp.skillStacks) {
    for (const [id, lv] of Object.entries(cp.skillStacks)) {
      if (SKILL_BY_ID[id]) run.upgradeStacks[id] = clamp(Math.floor(Number(lv) || 0), 1, 4);
    }
  }
  if (canUseCp && cp.recipesDone) run.recipesDone = Object.assign({}, cp.recipesDone);
  enemies = [];
  projectiles = [];
  pickups = [];
  clones = [];
  particles = [];
  floaters = [];
  rings = [];
  shockwaves = [];
  enemySeq = 0;
  upgradeCards = [];
  transition = null;
  story = null;
  ending = null;
  deathTimer = 0;
  betweenInfo = null;
  state = 'playing';
  mouse.down = false;
  touchState.joyId = null;
  touchState.attackId = null;
  touchState.dashId = null;
  touchState.vec = { x: 0, y: 0 };
  beginStage(stage, true);
  syncClones();
  enterRoom(1, true);
  writeStageCheckpoint(stage, true);
  musicTimer = .75;
  musicStep = 0;
  const label = stageLabel(stage, modeId);
  const moduleName = run.module ? run.module.name : run.theme.name;
  showBanner(label, `${moduleName} · ${room.bossRoom ? 'BOSS 关' : '清理怪潮，找到猫门'}`, mode.story ? C.lavender : C.gold, 2.4);
  if (v11InBattleRuntime()) {
    if (navigator.maxTouchPoints > 0 || touchActive) {
      showToast('左下摇杆移动 · 右下攻击 / 冲刺 · 按住攻击键自动索敌', C.cream, 4.0);
    } else {
      showToast('WASD 移动 · 鼠标瞄准 + 左键/J 挥爪 · SPACE 冲刺斩', C.cream, 4.0);
    }
  }
}

function startNewRun(seedOverride) {
  // 兼容旧调试接口：默认进入简单模式第 1 关。
  startModeStage('easy', 1, {
    seed: seedOverride === undefined || seedOverride === null ? undefined : Number(seedOverride) >>> 0,
    fresh: true,
  });
}

function beginStage(stage, initial = false) {
  const chapterIdx = chapterIndexForStage(stage);
  run.stage = stage;
  run.roomNumber = 1;
  run.roomsThisStage = rollRoomsForStage(stage);
  run.theme = THEMES[chapterIdx] || THEMES[0];
  run.module = ENEMY_MODULES[chapterIdx] || ENEMY_MODULES[0];
  run.stageStartedAt = time;
  const mp = modeProgressFor(run.mode);
  if (mp) {
    mp.bestStage = Math.max(mp.bestStage, stage);
    mp.level = player.level;
    mp.form = player.form;
  }
  if (!initial) {
    player.hp = Math.min(player.maxHp, player.hp + Math.round(player.maxHp * .06));
  }
}

function restartCurrentStage() {
  if (!run) return;
  const stage = run.stage;
  const mp = modeProgressFor(run.mode);
  const cp = mp && mp.checkpoint && mp.checkpoint.stage === stage ? mp.checkpoint : null;
  startModeStage(run.mode, stage, {
    checkpoint: cp,
    fresh: !cp,
    seed: makeSeed(),
    countRun: false,
  });
}

function startModeFromHome(modeId) {
  if (!profile || !activeSlot) {
    showToast('请先在主页右侧选择或新建一个存档位', C.coral, 2.6);
    return;
  }
  const mp = profile.modes[modeId];

  if (modeId === 'infinite' && !mp.unlocked && !profile.stats.storyCleared) {
    showToast('无限模式尚未解锁 · 通关剧情模式后开放', C.coral, 2.8);

    state = 'storySelect';

  }
  const cp = mp.checkpoint;
  startModeStage(modeId, cp ? cp.stage : 1, {
    checkpoint: cp,
    seed: cp ? cp.seed : undefined,
    countRun: true,
  });
}

function returnToHome() {

function resetTransientForRoom() {
  enemies = [];
  projectiles = [];
  pickups = [];
  shockwaves = [];
  rings = [];
  clones.forEach(c => { c.x = player.x; c.y = player.y; c.attackTimer = .4; c.attackAnim = 0; });
}

function enterRoom(roomNumber, initial = false) {
  run.roomNumber = roomNumber;
  const rngSeed = hashSeed(run.seed, run.stage * 97 + roomNumber, run.roomNumber * 43 + (initial ? 7 : 1));
  const roomRng = seeded(rngSeed);
  const bossRoom = (run.stage % STAGE_CFG.bossEvery === 0) && (roomNumber === run.roomsThisStage);
  resetTransientForRoom();
  player.x = W / 2;
  player.y = INNER.bottom - 62;
  player.invuln = Math.max(player.invuln, 1.0);
  player.dashTimer = 0;
  player.dashCd = 0;
  player.attackTimer = Math.max(player.attackTimer, .2);
  player.attackAnim = 0;
  player.dead = false;
  player.hp = Math.max(1, player.hp);

  const obstacles = [];
  const maxObstacles = bossRoom ? 2 : localInt(roomRng, 2, 4);
  for (let tries = 0; tries < 90 && obstacles.length < maxObstacles; tries++) {
    const kind = localPick(roomRng, ['crate', 'pudding', 'post']);
    const rr = kind === 'crate' ? 28 : (kind === 'post' ? 24 : 30);
    const x = localRange(roomRng, INNER.x + rr + 26, INNER.right - rr - 26);
    const y = localRange(roomRng, INNER.y + rr + 32, INNER.bottom - rr - 30);
    if (dist2(x, y, DOOR.x, DOOR.y) < (DOOR.r + rr + 48) ** 2) continue;
    if (bossRoom && dist2(x, y, W / 2, INNER.y + 210) < (160 + rr) ** 2) continue;
    if (dist2(x, y, W / 2, INNER.bottom - 62) < (120 + rr) ** 2) continue;
    if (dist2(x, y, INNER.x + 55, INNER.y + 55) < (rr + 65) ** 2) continue;
    if (obstacles.some(o => dist2(x, y, o.x, o.y) < (rr + o.r + 34) ** 2)) continue;
    obstacles.push({ x, y, r: rr, kind, rot: localRange(roomRng, -0.3, 0.3), phase: localRange(roomRng, 0, TAU) });
  }

  const decor = [];
  const decorTypes = ['paw', 'star', 'fishbone', 'scribble', 'flower', 'yarn'];
  for (let i = 0; i < 18; i++) {
    decor.push({
      x: localRange(roomRng, INNER.x + 45, INNER.right - 45),
      y: localRange(roomRng, INNER.y + 45, INNER.bottom - 30),
      type: localPick(roomRng, decorTypes),
      size: localRange(roomRng, 6, 14),
      rot: localRange(roomRng, 0, TAU),
      alpha: localRange(roomRng, .1, .28),
    });
  }

  const waves = buildWaves(run.stage, roomNumber, run.roomsThisStage, bossRoom, roomRng);
  room = {
    number: roomNumber,
    total: run.roomsThisStage,
    stage: run.stage,
    theme: run.theme,
    bossRoom,
    rng: roomRng,
    obstacles,
    decor,
    waves,
    waveIndex: 0,
    pendingWaveTimer: 0,
    checkingNextWave: false,
    cleared: false,
    doorOpen: false,
    doorOpenDelay: 0,
    clearAnim: 0,
    background: null,
    bossUid: null,
  };
  room.background = buildRoomBackground(room);
  spawnWave(false);

  const isStageStart = roomNumber === 1;
  if (bossRoom) {
    const bossName = ENEMY_DEFS[run.module.boss] ? ENEMY_DEFS[run.module.boss].name : '章节 Boss';
    showBanner('BOSS WARNING', `${bossName} 正在等你送小鱼干`, C.coral, 2.7);
    sfx('boss');
  } else if (isStageStart) {
    showBanner(stageLabel(run.stage, run.mode), `${run.theme.name} · 房间 ${roomNumber}/${room.total}`, run.mode === 'story' ? C.lavender : C.gold, 2.2);
  } else {
    showBanner(`ROOM ${roomNumber}/${room.total}`, `${run.theme.name} · ${run.module.name}`, C.mint, 1.7);
  }
  run.totalRooms++;
}

function buildWaves(stage, roomNumber, roomsTotal, bossRoom, roomRng) {
  const cfg = STAGE_CFG;
  const module = moduleForStage(stage);
  const modeId = run.mode;
  if (bossRoom) {
    // 每个章节有专属 Boss；同一章的小怪会作为 Boss 召唤的杂兵一起出现。
    const entries = [module.boss];
    const adds = Math.min(4, 2 + Math.floor(stage / 9));
    for (let i = 0; i < adds; i++) entries.push(localPick(roomRng, module.mobs));
    return [{ entries, bossWave: true }];
  }

  const waves = [];
  for (let w = 0; w < cfg.normalWaves; w++) {
    let count = cfg.enemyCountBase + Math.floor((stage - 1) * cfg.enemyCountGrowth) + w * cfg.enemyWaveGain + localInt(roomRng, 0, 1);
    count = Math.round(count * modeStatMul(modeId, 'countMul', stage));
    count = clamp(count, 3, cfg.enemyCap + 4);
    const entries = [];
    // 第一阶段第一间房：四种小怪全部登场，直观展示“模型不重样”。
    if (stage === 1 && roomNumber === 1 && w === 0) {
      for (let i = 0; i < Math.max(4, count); i++) entries.push(module.mobs[i % module.mobs.length]);
    } else {
      for (let i = 0; i < count; i++) entries.push(localPick(roomRng, module.mobs));
    }
    waves.push({ entries, bossWave: false });
  }
  return waves;
}

function findSpawnPoint(preferFar = true) {
  const p = player;
  for (let i = 0; i < 40; i++) {
    const side = rndInt(0, 3);
    let x = 0, y = 0;
    const pad = 66;
    if (side === 0) { x = rnd(INNER.x + 120, INNER.right - 120); y = INNER.y + pad; }
    else if (side === 1) { x = INNER.right - pad; y = rnd(INNER.y + 110, INNER.bottom - 90); }
    else if (side === 2) { x = rnd(INNER.x + 100, INNER.right - 100); y = INNER.bottom - 58; }
    else { x = INNER.x + pad; y = rnd(INNER.y + 110, INNER.bottom - 90); }
    if (Math.abs(x - DOOR.x) < 110 && y < INNER.y + 130) continue;
    if (preferFar && dist2(x, y, p.x, p.y) < 210 * 210) continue;
    if (room.obstacles.some(o => dist2(x, y, o.x, o.y) < (o.r + 30) ** 2)) continue;
    return { x, y };
  }
  return { x: INNER.right - 80, y: INNER.y + 120 };
}

function spawnWave(initial = false) {
  if (!room || room.waveIndex >= room.waves.length) return;
  const wave = room.waves[room.waveIndex];
  const isBossWave = !!wave.bossWave;
  let idx = 0;
  for (const type of wave.entries) {
    const def = ENEMY_DEFS[type];
    const isBoss = type === 'boss' || (def && def.boss);
    let pos;
    if (isBoss) {
      pos = { x: W / 2, y: INNER.y + 205 };
      room.bossUid = null;
    } else {
      pos = findSpawnPoint(true);
    }
    const delay = isBoss ? 1.2 : (.6 + idx * .08 + rnd(0, .25));
    const enemy = spawnEnemy(type, pos.x, pos.y, delay);
    if (isBoss && enemy) room.bossUid = enemy.uid;
    idx++;
  }
  room.waveIndex++;
  room.checkingNextWave = false;
  room.pendingWaveTimer = 0;
  if (room.waveIndex > 1 && !isBossWave) {
    showToast(`WAVE ${room.waveIndex}/${room.waves.length} · 怪潮来了！`, C.gold, 1.6);
    sfx('door');
  }
}

function spawnEnemy(type, x, y, delay = .8) {
  const def = ENEMY_DEFS[type];
  if (!def) return null;
  const stage = run.stage;
  const hpScale = 1 + STAGE_CFG.hpGrowthPerStage * (stage - 1);
  const dmgScale = 1 + STAGE_CFG.damageGrowthPerStage * (stage - 1);
  const speedScale = Math.min(STAGE_CFG.speedCap, 1 + STAGE_CFG.speedGrowthPerStage * (stage - 1));
  const hpMul = modeStatMul(run.mode, 'hpMul', stage);
  const dmgMul = modeStatMul(run.mode, 'dmgMul', stage);
  const maxHp = Math.max(1, Math.round(def.hp * hpScale * hpMul));
  const e = {
    uid: ++enemySeq,
    type,
    def,
    name: def.name,
    ai: def.ai,
    projectile: def.projectile || 'candy',
    chapter: def.chapter || 1,
    x, y,
    r: def.radius,
    hp: maxHp, maxHp,
    speed: def.speed * speedScale,
    damage: Math.max(1, Math.round(def.damage * dmgScale * dmgMul)),
    score: def.score,
    boss: !!def.boss,
    knock: def.knock,
    color: def.color,
    spawnTimer: delay,
    spawnDelay: Math.max(.01, delay),
    hitFlash: 0,
    dead: false,
    deathTimer: 0,
    kx: 0, ky: 0,
    action: 'idle',
    actionT: 0,
    attackTimer: (def.ai && def.ai.startsWith('boss') ? 1.5 : .7) + rnd(0, .9),
    chargeAngle: 0,
    phase: rnd(0, TAU),
    wobbleSign: chance(.5) ? 1 : -1,
    orbitDir: chance(.5) ? 1 : -1,
    enraged: false,
    skillIndex: 0,
    healthShown: maxHp,
    slowTimer: 0, burnTimer: 0, burnDps: 0,
    patternTimer: 0,
    teleportTimer: 3.5,
  };
  enemies.push(e);
  rings.push({ x, y, r0: e.r * 1.8, r1: e.r * .4, life: 0, max: .55, color: withAlpha(e.boss ? C.coral : C.mint, .7), width: 6, ink: true });
  return e;
}

function clearRoom() {
  if (!room || room.cleared) return;
  room.cleared = true;
  room.doorOpenDelay = 1.15;
  room.clearAnim = .7;
  const heal = Math.round(player.maxHp * (BALANCE.roomHealRate + player.roomHealBonus));
  player.hp = Math.min(player.maxHp, player.hp + heal);
  run.score += STAGE_CFG.roomClearScore + (room.bossRoom ? STAGE_CFG.bossClearScore : 0);
  shake = Math.max(shake, 7);
  flash = Math.max(flash, .12);
  flashColor = C.gold;
  addFloater(player.x, player.y - 42, `+${heal}`, C.mint, 20);
  for (let i = 0; i < 26; i++) addParticle({
    x: W / 2 + rnd(-220, 220), y: ARENA.y + rnd(80, 180),
    vx: rnd(-120, 120), vy: rnd(-30, 110), life: rnd(.5, 1.2), max: 1.2,
    size: rnd(3, 9), color: rndPick([C.gold, C.mint, C.cream, C.coral]),
    type: rndPick(['star', 'circle']), rot: rnd(0, TAU), vr: rnd(-6, 6), gravity: 20, drag: .7,
  });
  rings.push({ x: DOOR.x, y: DOOR.y, r0: 10, r1: 120, life: 0, max: .8, color: withAlpha(C.gold, .6), width: 9, ink: true });
  showBanner('ROOM CLEAR!', room.bossRoom ? '大王被打包带走了 · 猫门已开启' : '猫门开了，去下一间吧！', C.mint, 1.8);
  showToast(`回复 ${heal} HP · 清空奖励 +${STAGE_CFG.roomClearScore + (room.bossRoom ? STAGE_CFG.bossClearScore : 0)} 分`, C.mint, 2.2);
  sfx('clear');
  // 记录本局一条战斗闪回，最终结局会用 3~4 张“拍立得”回放。
  run.flashbacks.push({
    stage: run.stage,
    room: room.number,
    total: room.total,
    boss: room.bossRoom,
    form: player.form,
    kills: run.kills,
    score: run.score,
    at: time,
  });
  if (run.flashbacks.length > 10) run.flashbacks.shift();
  meta.bestStage = Math.max(meta.bestStage, run.stage);
  saveMeta();
}

function updateRoomFlow(dt) {
  if (!room) return;
  if (room.cleared) {
    if (!room.doorOpen) {
      room.doorOpenDelay -= dt;
      if (room.doorOpenDelay <= 0) {
        room.doorOpen = true;
        sfx('door');
        rings.push({ x: DOOR.x, y: DOOR.y, r0: 6, r1: 160, life: 0, max: .9, color: withAlpha(C.mint, .75), width: 8, ink: true });
      }
    }
    if (room.doorOpen && transition === null && state === 'playing') {
      if (dist2(player.x, player.y, DOOR.x, DOOR.y) < (DOOR.r + player.r * .4) ** 2) {
        beginDoorTransition();
      }
    }
    return;
  }

  if (enemies.some(e => !e.dead)) return;

  if (room.waveIndex < room.waves.length) {
    if (!room.checkingNextWave) {
      room.checkingNextWave = true;
      room.pendingWaveTimer = 1.45;
      if (!room.bossRoom) showToast('下一波正在靠近…', C.pink, 1.3);
    } else {
      room.pendingWaveTimer -= dt;
      if (room.pendingWaveTimer <= 0) spawnWave(false);
    }
  } else {
    clearRoom();
  }
}

function beginDoorTransition() {
  if (state !== 'playing') return;
  const stageCleared = run.roomNumber >= run.roomsThisStage;
  state = 'transition';
  transition = {
    t: 0, dur: 1.15, advanced: false,
    stageClear: stageCleared,
    clearedStage: run.stage,
  };
  sfx('door');
  addBurst(player.x, player.y, C.gold, 14, 180);
}

function updateTransition(dt) {
  if (!transition) { if (state === 'transition') state = 'playing'; return; }
  const tr = transition;
  tr.t += dt;
  if (!tr.advanced && tr.t >= tr.dur * .5) {
    tr.advanced = true;
    if (tr.stageClear) {
      onStageCleared(tr.clearedStage);
      return;
    }
    advanceToNextRoom();
  }
  if (!transition) return;
  if (tr.t >= tr.dur) {
    transition = null;
    state = 'playing';
    player.invuln = Math.max(player.invuln, .9);
  }
}

function prepareStageClear(clearedStage) {
  // 先把通关后的角色状态写进下一关检查点，再放剧情 / 三选一。
  player.hp = Math.min(player.maxHp, player.hp + Math.round(player.maxHp * .1));
  const mp = modeProgressFor(run.mode);
  if (!mp) return;
  mp.clearedStage = Math.max(mp.clearedStage, clearedStage);
  mp.bestStage = Math.max(mp.bestStage, clearedStage);
  mp.level = player.level;
  mp.form = player.form;
  mp.skillStacks = Object.assign({}, run.upgradeStacks);
  mp.totalKills = Math.max(mp.totalKills, meta.kills);
  const isFinal = run.mode === 'story' && clearedStage >= STAGE_CFG.storyStageCount;
  if (run.mode === 'story') {
    mp.unlockedStage = Math.max(mp.unlockedStage, Math.min(STAGE_CFG.storyStageCount, clearedStage + 1));
  }
  if (isFinal) {
    mp.unlockedStage = STAGE_CFG.storyStageCount;
    profile.stats.storyCleared = true;
    profile.modes.infinite.unlocked = true;
    mp.checkpoint = null;
  } else {
    const nextSeed = makeSeed();
    mp.checkpoint = makeStageCheckpoint(clearedStage + 1, nextSeed);
  }
  syncProfileStats();
  persistProfile(false);
  syncMetaFromProfile();
}

function onStageCleared(clearedStage) {
  transition = null;
  prepareStageClear(clearedStage);
  if (!run.mode) return;
  if (run.mode !== 'story') {
    const nextStage = clearedStage + 1;
    const mp = modeProgressFor(run.mode);
    const cp = mp ? mp.checkpoint : null;
    startModeStage(run.mode, nextStage, {
      checkpoint: cp,
      seed: cp ? cp.seed : undefined,
      countRun: false,
    });
    return;
  }
  const chapter = storyChapterForStage(clearedStage, 'story');
  const isFinal = clearedStage >= STAGE_CFG.finalStage;
  const finishGate = () => {
    if (isFinal) { startEnding(); return; }
    if (clearedStage % STAGE_CFG.storyPromptEvery === 0) {
      openBetween(clearedStage);
      return;
    }
    const mp = modeProgressFor('story');
    const cp = mp ? mp.checkpoint : null;
    startModeStage('story', clearedStage + 1, {
      checkpoint: cp,
      seed: cp ? cp.seed : undefined,
      countRun: false,
    });
  };
  if (chapter) startStory(chapter, finishGate);
  else { state = 'playing'; finishGate(); }
}

function openBetween(clearedStage) {
  // §7：每打完 3 关，弹出“继续下一关 / 保存存档 / 退出模式”。
  transition = null;
  shake = 0; flash = 0; hitVignette = 0;
  betweenInfo = {
    clearedStage,
    nextStage: Math.min(STAGE_CFG.storyStageCount, clearedStage + 1),
    mode: run.mode,
    hasNext: clearedStage < STAGE_CFG.storyStageCount,
  };
  state = 'between';
  sfx('clear');
}

function continueBetween() {
  if (!betweenInfo || !run) return;
  const mp = modeProgressFor('story');
  const cp = mp ? mp.checkpoint : null;
  startModeStage('story', betweenInfo.nextStage, {
    checkpoint: cp,
    seed: cp ? cp.seed : undefined,
    countRun: false,
  });
}

function advanceToNextRoom() {
  if (run.roomNumber < run.roomsThisStage) {
    enterRoom(run.roomNumber + 1, false);
  } else {
    onStageCleared(run.stage);
  }
}

function openExitConfirm() {
  exitRects = [];
  state = 'exitConfirm';
  shake = 0; flash = 0;
  sfx('click');
}

function exitCurrentMode(saveFirst) {
  if (saveFirst && profile && activeSlot) {
    const ok = persistProfile(false);
    if (!ok) return; // 保存失败时留在确认页，明确提示，不静默丢档。
  }
  returnToHome();
}

/* ------------------------------------------------------------------
   05. 玩家战斗 / 敌人 AI / 升级 / 特效更新
   ------------------------------------------------------------------ */
function moveWorld(ent, dx, dy) {
  let blocked = false;
  ent.x += dx;
  ent.y += dy;
  if (ent.x - ent.r < INNER.x) { ent.x = INNER.x + ent.r; blocked = true; }
  if (ent.x + ent.r > INNER.right) { ent.x = INNER.right - ent.r; blocked = true; }
  if (ent.y - ent.r < INNER.y) { ent.y = INNER.y + ent.r; blocked = true; }
  if (ent.y + ent.r > INNER.bottom) { ent.y = INNER.bottom - ent.r; blocked = true; }

  if (room) {
    for (const o of room.obstacles) {
      const min = ent.r + o.r;
      const ddx = ent.x - o.x;
      const ddy = ent.y - o.y;
      const d2 = ddx * ddx + ddy * ddy;
      if (d2 < min * min) {
        const d = Math.sqrt(d2) || .001;
        const nx = ddx / d || 1;
        const ny = ddy / d || 0;
        ent.x = o.x + nx * min;
        ent.y = o.y + ny * min;
        blocked = true;
      }
    }
    ent.x = clamp(ent.x, INNER.x + ent.r, INNER.right - ent.r);
    ent.y = clamp(ent.y, INNER.y + ent.r, INNER.bottom - ent.r);
  }
  return blocked;
}

function tryDash() {
  if (!player || player.dead || state !== 'playing') return;
  if (player.dashCd > 0 || player.dashTimer > 0) return;
  const mv = inputVector();
  let dx = 0, dy = 0;
  if (mv.len > 0) { dx = mv.x; dy = mv.y; }
  else { dx = Math.cos(player.aim); dy = Math.sin(player.aim); }
  const len = Math.hypot(dx, dy) || 1;
  player.dashDir.x = dx / len;
  player.dashDir.y = dy / len;
  // §4：剧情模式下技能机动性减弱（冲刺距离 0.78×），基础移动与挥爪判定不变。
  const mobility = (MODES[run.mode] && MODES[run.mode].mobility) || 1;
  player.dashTimer = BALANCE.dashDuration * mobility;
  player.dashCd = player.dashCooldown;
  player.invuln = Math.max(player.invuln, BALANCE.dashDuration + .16);
  player.dashHits.clear();
  player.dashGhostTimer = 0;
  shake = Math.max(shake, 3);
  sfx('dash');
  rings.push({ x: player.x, y: player.y, r0: 12, r1: 48, life: 0, max: .35, color: withAlpha(C.mint, .65), width: 4, ink: false });
}

function performAttack() {
  const p = player;
  p.attackTimer = p.attackRate;
  p.attackAnim = p.attackAnimMax;
  p.swingAim = p.aim;
  sfx('swipe', 1);
  addSmallSlashParticles(p);

  // 主挥爪：扇形范围内全部敌人都会吃伤害，方便猫猫割草。
  for (const e of enemies.slice()) {
    if (e.dead) continue;
    const d = dist(p, e);
    const ang = Math.atan2(e.y - p.y, e.x - p.x);
    const angular = Math.abs(angleDiff(ang, p.swingAim));
    const close = d < p.r + e.r + 9;
    if (d <= p.attackRange + e.r * .55 && (angular <= p.attackArc / 2 + e.r / Math.max(60, d) * .5 || close)) {
      damageEnemy(e, p.attackDamage, { fromX: p.x, fromY: p.y, kb: 150, kind: 'claw' });
    }
  }

  const mob = (MODES[run.mode] && MODES[run.mode].mobility) || 1;

  // 旋风喵：额外一圈 360° 伤害；血旋风会按命中数回血。
  if (p.whirlLevel > 0) {
    const wr = (p.whirlRange || p.attackRange * .82) * mob;
    rings.push({ x: p.x, y: p.y, r0: 20, r1: wr, life: 0, max: .28, color: withAlpha(C.pink, .62), width: 8, ink: false });
    let hits = 0;
    for (const e of enemies.slice()) {
      if (!e.dead && dist(p, e) <= wr + e.r) {
        damageEnemy(e, p.attackDamage * p.whirlRatio, { fromX: p.x, fromY: p.y, kb: 95, kind: 'spin' });
        hits++;
      }
    }
    if (p.bloodWhirlLevel > 0 && hits > 0) {
      const heal = Math.min(6, hits * p.bloodWhirlHeal);
      p.hp = Math.min(p.maxHp, p.hp + heal);
      addFloater(p.x, p.y - 38, `+${heal}`, C.coral, 13);
    }
  }

  // 鱼骨飞爪：发射穿透气刃（满级质变后穿透更多）。
  for (let i = 0; i < p.fishBladeLevel; i++) {
    const spread = (i - (p.fishBladeLevel - 1) / 2) * .16;
    addProjectile({
      x: p.x + Math.cos(p.swingAim + spread) * 30,
      y: p.y + Math.sin(p.swingAim + spread) * 30,
      angle: p.swingAim + spread, speed: 430 * mob, radius: 10,
      damage: p.attackDamage * .5, friendly: true, kind: 'fish',
      life: 1.1, pierce: p.fishBladePierce || 2, color: C.mint,
    });
  }

  // 真进化：挥爪自带星屑。
  if (p.form >= 2) {
    for (let i = -1; i <= 1; i++) {
      addProjectile({
        x: p.x, y: p.y, angle: p.swingAim + i * .18, speed: 360 * mob,
        radius: 9, damage: p.attackDamage * .34, friendly: true, kind: 'star',
        life: 1.15, pierce: 2, color: C.gold,
      });
    }
  }

  // 火猫守卫：每只小猫替身都在挥爪时喷出火环。
  if (p.fireGuardLevel > 0) {
    const radius = (86 + p.fireGuardLevel * 20) * p.fireGuardMul * mob;
    shockwaves.push({
      x: p.x, y: p.y, radius: 24, maxRadius: radius, life: 0, max: .3,
      friendly: true, damage: p.attackDamage * .22 * p.fireGuardMul,
      hitIds: new Set(), color: '#ff8a4d',
    });
    rings.push({ x: p.x, y: p.y, r0: 24, r1: radius, life: 0, max: .3, color: withAlpha('#ff8a4d', .55), width: 6, ink: false });
  }
}

function addSmallSlashParticles(p) {
  for (let i = 0; i < 6; i++) {
    const a = p.swingAim + rnd(-p.attackArc / 2, p.attackArc / 2);
    addParticle({
      x: p.x + Math.cos(a) * rnd(30, p.attackRange * .8),
      y: p.y + Math.sin(a) * rnd(30, p.attackRange * .8),
      vx: Math.cos(a) * rnd(40, 100), vy: Math.sin(a) * rnd(40, 100),
      life: rnd(.12, .28), max: .28, size: rnd(3, 8),
      color: rndPick([C.cream, C.gold, p.form === 2 ? C.lavender : C.coral]),
      type: 'spark', rot: a, vr: rnd(-4, 4), drag: .8,
    });
  }
}

function damageEnemy(e, rawDamage, opts = {}) {
  if (!e || e.dead) return;
  const crit = opts.noCrit ? false : rnd(0, 1) < player.critChance;
  const dmg = Math.max(1, Math.round(rawDamage * (crit ? player.critMul : 1)));
  e.hp -= dmg;
  e.hitFlash = .13;
  const dir = Math.atan2(e.y - (opts.fromY ?? player.y), e.x - (opts.fromX ?? player.x));
  const kb = (opts.kb || 100) * (e.knock ?? 1);
  e.kx += Math.cos(dir) * kb;
  e.ky += Math.sin(dir) * kb * .6;
  e.healthShown = Math.max(0, e.hp);

  // §10 元素类技能：燃烧 / 寒冷 / 雷电连锁 / 霜雷双爪。
  if (player.flameBurnMul > 0) {
    e.burnTimer = 2.4;
    e.burnDps = Math.max(e.burnDps || 0, dmg * .22 * player.flameBurnMul);
    e.burnTick = 0;
  }
  if (player.frostSlow > 0) {
    e.slowTimer = 2.6;
    e.slowMul = Math.min(e.slowMul || 1, player.frostSlow);
  }
  if (player.thunderChains > 0 && !opts.noChain && !opts.silent) {
    const chainTargets = enemies
      .filter(t => t !== e && !t.dead && t.spawnTimer <= 0 && dist(t, e) < 220)
      .slice(0, player.thunderChains);
    for (const t of chainTargets) {
      for (let k = 0; k < 8; k++) {
        const tt = k / 8;
        addParticle({
          x: lerp(e.x, t.x, tt) + rnd(-8, 8), y: lerp(e.y, t.y, tt) + rnd(-8, 8),
          vx: rnd(-40, 40), vy: rnd(-60, 20), life: rnd(.1, .22), max: .22,
          size: rnd(2, 5), color: C.blue, type: 'spark', rot: rnd(0, TAU), vr: 4, drag: .8,
        });
      }
      damageEnemy(t, dmg * player.thunderRatio, { noCrit: true, noChain: true, silent: true, kind: 'thunder' });
    }
  }

  if (!opts.silent) {
    addFloater(e.x + rnd(-8, 8), e.y - e.r - 10, crit ? `${dmg}!` : `${dmg}`, crit ? C.gold : C.white, crit ? 18 : 14);
    if (crit) addFloater(e.x, e.y - e.r - 28, '暴击!', C.gold, 12);
    for (let i = 0; i < (crit ? 12 : 6); i++) addParticle({
      x: e.x + rnd(-e.r * .5, e.r * .5), y: e.y + rnd(-e.r * .5, e.r * .5),
      vx: rnd(-130, 130), vy: rnd(-160, 60), life: rnd(.18, .5), max: .5,
      size: rnd(3, 8), color: rndPick([C.cream, C.gold, C.coral, C.white]),
      type: rndPick(['spark', 'star']), rot: rnd(0, TAU), vr: rnd(-7, 7),
      gravity: 30, drag: .8,
    });
    shake = Math.max(shake, crit ? 5 : 2.5);
    sfx('hit', crit ? 1.25 : 1);
  }
  if (e.hp <= 0) killEnemy(e);
}

function dropLoot(x, y, count, forceCoin = false) {
  for (let i = 0; i < count; i++) {
    const coin = forceCoin && i < Math.ceil(count / 3) ? true : chance(.1);
    const type = coin ? 'coin' : (chance(.5) ? 'fish' : 'kibble');
    const value = coin ? 2 : 1;
    const a = rnd(0, TAU);
    const spd = rnd(55, 155);
    pickups.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      value, type, age: 0, phase: rnd(0, TAU), attracted: false,
      spin: rnd(-2.5, 2.5), dead: false,
    });
  }
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  e.deathTimer = .36;
  e.hp = 0;
  run.kills++;
  meta.kills++;
  run.score += e.score;
  player.lifesteal = player.lifesteal || 0;
  if (player.lifesteal > 0) {
    player.hp = Math.min(player.maxHp, player.hp + player.lifesteal);
    addFloater(player.x, player.y - 34, `+${player.lifesteal}`, C.mint, 13);
  }
  const dropMul = modeStatMul(run.mode, 'dropMul', run.stage);
  const drops = Math.max(1, Math.round(rndInt(e.def.drops[0], e.def.drops[1]) * dropMul));
  dropLoot(e.x, e.y, e.boss ? drops + 4 : drops, e.boss);
  addFloater(e.x, e.y - e.r - (e.boss ? 55 : 12), `+${e.score}`, C.gold, e.boss ? 24 : 13);
  const colors = e.boss ? [C.gold, C.coral, C.cream, C.lavender] : [e.color, C.cream, C.pink, C.gold];
  for (let i = 0; i < (e.boss ? 60 : 18); i++) addParticle({
    x: e.x + rnd(-e.r, e.r), y: e.y + rnd(-e.r, e.r),
    vx: rnd(-240, 240), vy: rnd(-260, 100), life: rnd(.3, 1.0), max: 1,
    size: rnd(3, e.boss ? 15 : 9), color: rndPick(colors),
    type: rndPick(['circle', 'star', 'puff', 'fish']), rot: rnd(0, TAU), vr: rnd(-8, 8),
    gravity: 40, drag: .78,
  });
  rings.push({ x: e.x, y: e.y, r0: e.r * 1.2, r1: e.r * 2.5, life: 0, max: e.boss ? 1.0 : .42, color: withAlpha(e.boss ? C.gold : C.pink, .7), width: e.boss ? 10 : 5, ink: false });
  shake = Math.max(shake, e.boss ? 18 : 5);
  if (e.boss) {
    flash = Math.max(flash, .35);
    flashColor = C.gold;
    sfx('boss');
    showToast(`${e.name} 被打包成猫粮了！`, C.gold, 2.6);
    for (let i = 0; i < 3; i++) {
      rings.push({ x: e.x, y: e.y, r0: 30 + i * 20, r1: 180 + i * 40, life: 0, max: 1.2 + i * .12, color: withAlpha(C.coral, .55), width: 9, ink: true });
    }
  } else sfx('kill', e.ai === 'heavy' ? .8 : 1);
  if (meta.kills % 5 === 0) saveMeta();
}

function hurtPlayer(amount, fromX, fromY, reason = 'touch') {
  const p = player;
  if (!p || p.dead || state === 'dead' || state === 'gameover') return;
  if (p.invuln > 0) return;
  let dmg = Math.max(1, Math.round(amount));
  // §10 防御类：罐头护盾先吸收伤害。
  if (p.shield > 0) {
    const absorbed = Math.min(p.shield, dmg);
    p.shield -= absorbed;
    dmg -= absorbed;
    addFloater(p.x, p.y - 52, `护盾 -${Math.round(absorbed)}`, C.blue, 14);
    rings.push({ x: p.x, y: p.y, r0: p.r, r1: p.r + 30, life: 0, max: .28, color: withAlpha(C.blue, .7), width: 5, ink: false });
  }
  if (dmg <= 0) {
    p.invuln = BALANCE.invulnTime * .55;
    sfx('hit', .8);
    return;
  }
  const totalDmg = dmg;
  p.hp -= dmg;
  p.hurtFlash = .3;
  p.invuln = BALANCE.invulnTime;
  p.attackAnim = 0;
  p.dashTimer = 0;
  const a = Math.atan2(p.y - (fromY ?? p.y - 1), p.x - (fromX ?? p.x));
  p.x += Math.cos(a) * 8; p.y += Math.sin(a) * 8;
  hitVignette = .45;
  shake = Math.max(shake, 10);
  flash = Math.max(flash, .13);
  flashColor = C.coral;
  addFloater(p.x, p.y - 42, `-${totalDmg}`, C.coral, 19);
  for (let i = 0; i < 16; i++) addParticle({
    x: p.x + rnd(-20, 20), y: p.y + rnd(-30, 10),
    vx: rnd(-170, 170), vy: rnd(-190, 20), life: rnd(.22, .55), max: .55,
    size: rnd(3, 9), color: rndPick([C.coral, C.cream, C.white, C.pink]),
    type: rndPick(['spark', 'heart', 'circle']), rot: rnd(0, TAU), vr: rnd(-7, 7),
    gravity: 60, drag: .7,
  });
  sfx('hurt');

  if (p.thornLevel > 0) {
    const radius = 110 + p.thornLevel * 22;
    shockwaves.push({
      x: p.x, y: p.y, radius: 24, maxRadius: radius, life: 0, max: .38,
      friendly: true, damage: p.attackDamage * (.8 + p.thornLevel * .25),
      hitIds: new Set(), color: C.salmon,
    });
    rings.push({ x: p.x, y: p.y, r0: 30, r1: radius, life: 0, max: .38, color: withAlpha(C.salmon, .7), width: 8, ink: true });
  }

  if (p.hp <= 0) {
    p.hp = 0;
    killPlayer();
  }
}

function killPlayer() {
  state = 'dead';
  deathTimer = 0;
  player.dead = true;
  player.deathT = 0;
  player.invuln = 0;
  shake = 20;
  flash = .4;
  flashColor = C.coral;
  sfx('death');
  for (let i = 0; i < 42; i++) addParticle({
    x: player.x + rnd(-26, 26), y: player.y + rnd(-30, 20),
    vx: rnd(-260, 260), vy: rnd(-320, 80), life: rnd(.4, 1.2), max: 1.2,
    size: rnd(3, 11), color: rndPick([C.cream, C.coral, C.white, C.pink]),
    type: rndPick(['heart', 'star', 'puff', 'circle']), rot: rnd(0, TAU), vr: rnd(-8, 8),
    gravity: 80, drag: .75,
  });
  showBanner('喵呜——', '本局结束 · 按 R 从本关检查点重开（全新随机布局）', C.coral, 2.4);
  meta.bestScore = Math.max(meta.bestScore, run.score);
  saveMeta();
  for (const c of clones) c.dead = true;
}

function finishGameOver() {
  if (state !== 'dead') return;
  state = 'gameover';
  meta.bestScore = Math.max(meta.bestScore, run.score);
  saveMeta();
}

function updatePlayer(dt) {
  const p = player;
  if (!p || p.dead) return;
  p.invuln = Math.max(0, p.invuln - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  p.attackTimer = Math.max(0, p.attackTimer - dt);
  p.attackAnim = Math.max(0, p.attackAnim - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.blinkIn -= dt;
  if (p.blinkIn <= 0) p.blinkIn = rnd(2.1, 4.2);
  p.upgradeFx = Math.max(0, p.upgradeFx - dt);
  if (p.shieldMax > 0) {
    p.shieldTick = (p.shieldTick || 0) + dt;
    if (p.shieldTick > .6) p.shield = Math.min(p.shieldMax, p.shield + p.shieldRegen * dt);
    else p.shieldTick = 0;
  }
  updateAim();

  if (p.dashTimer > 0) {
    p.dashTimer -= dt;
    const dx = p.dashDir.x * BALANCE.dashSpeed * dt;
    const dy = p.dashDir.y * BALANCE.dashSpeed * dt;
    const blocked = moveWorld(p, dx, dy);
    p.dashGhostTimer -= dt;
    if (p.dashGhostTimer <= 0) {
      p.dashGhostTimer = .035;
      addParticle({
        x: p.x, y: p.y, vx: -p.dashDir.x * 40, vy: -p.dashDir.y * 40,
        life: .22, max: .22, size: p.r * 1.2, color: withAlpha(C.mint, .28), type: 'ghost', rot: 0, vr: 0, drag: .9,
      });
    }
    // 冲刺斩命中：基础贯穿 2 个敌人，满级质变后 4 个。
    for (const e of enemies) {
      if (e.dead || e.spawnTimer > 0 || p.dashHits.has(e.uid)) continue;
      if (p.dashHits.size >= (p.dashPierce || 2)) break;
      if (dist(p, e) < p.r + e.r + 16) {
        p.dashHits.add(e.uid);
        damageEnemy(e, p.attackDamage * p.dashDamageMul, { fromX: p.x, fromY: p.y, kb: 260, kind: 'dash' });
        rings.push({ x: e.x, y: e.y, r0: 8, r1: e.r * 2, life: 0, max: .25, color: withAlpha(C.mint, .7), width: 5, ink: false });
        // 合成技能「旋风突刺」：冲刺命中处爆出小旋风。
        if (p.cycloneDashLevel > 0) {
          const radius = 66 + p.cycloneDashLevel * 14;
          shockwaves.push({
            x: e.x, y: e.y, radius: 20, maxRadius: radius, life: 0, max: .28,
            friendly: true, damage: p.attackDamage * .28 * p.cycloneDashLevel,
            hitIds: new Set([e.uid]), color: C.pink,
          });
          rings.push({ x: e.x, y: e.y, r0: 16, r1: radius, life: 0, max: .28, color: withAlpha(C.pink, .65), width: 6, ink: false });
        }
      }
    }
    if (blocked) {
      p.dashTimer = 0;
      shake = Math.max(shake, 6);
      sfx('stomp');
      for (let i = 0; i < 10; i++) addParticle({
        x: p.x - p.dashDir.x * p.r, y: p.y - p.dashDir.y * p.r,
        vx: rnd(-100, 100), vy: rnd(-120, 20), life: rnd(.15, .4), max: .4,
        size: rnd(2, 6), color: C.paper, type: 'puff', rot: 0, vr: 0, gravity: 15, drag: .8,
      });
    }
    if (p.dashTimer <= 0) {
      p.dashTimer = 0;
      rings.push({ x: p.x, y: p.y, r0: 16, r1: 54, life: 0, max: .3, color: withAlpha(C.cream, .5), width: 4, ink: false });
    }
  } else {
    const mv = inputVector();
    p.moving = mv.len > 0;
    if (mv.len > 0) {
      moveWorld(p, mv.x * p.moveSpeed * dt, mv.y * p.moveSpeed * dt);
      p.stepPhase += dt * 10;
      p.footDust -= dt;
      if (p.footDust <= 0) {
        p.footDust = .12;
        addParticle({
          x: p.x - mv.x * p.r * .55 + rnd(-5, 5), y: p.y + p.r * .8 + rnd(-3, 3),
          vx: -mv.x * rnd(10, 30), vy: rnd(-15, 3), life: .32, max: .32,
          size: rnd(2, 5), color: withAlpha(C.cream, .38), type: 'puff', rot: 0, vr: 0,
          gravity: -8, drag: .85,
        });
      }
    }
  }

  if (touchState.attackHeld) {
    const auto = nearestEnemyAngle();
    if (auto !== null) p.aim = auto;
    if (p.attackTimer <= 0 && state === 'playing') performAttack();
  } else if ((mouse.down || keys['KeyJ']) && p.attackTimer <= 0) performAttack();
  if (!touchState.usingTouch && mouse.inside) {
    const a = Math.atan2(mouse.y - p.y, mouse.x - p.x);
    if (Number.isFinite(a)) p.aim = a;
  }

  // 收集光点
  updatePickups(dt);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) {
      e.deathTimer -= dt;
      continue;
    }
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    if (e.spawnTimer > 0) {
      e.spawnTimer -= dt;
      continue;
    }

    // 击退惯性
    if (Math.abs(e.kx) + Math.abs(e.ky) > .5) {
      moveWorld(e, e.kx * dt, e.ky * dt);
      e.kx *= Math.pow(.016, dt);
      e.ky *= Math.pow(.016, dt);
    }

    // 元素状态：寒冷减速 + 燃烧 DoT
    if (e.slowTimer > 0) e.slowTimer -= dt;
    if (e.burnTimer > 0 && e.hp > 0) {
      e.burnTimer -= dt;
      e.burnTick = (e.burnTick || 0) + dt;
      if (e.burnTick >= .5) {
        e.burnTick -= .5;
        damageEnemy(e, e.burnDps * .5, { noCrit: true, noChain: true, silent: true, kind: 'burn' });
        if (e.dead) continue;
      }
    }
    if (e.poisonTimer > 0 && e.hp > 0) {
      e.poisonTimer -= dt;
      e.poisonTick = (e.poisonTick || 0) + dt;
      if (e.poisonTick >= .45) {
        e.poisonTick -= .45;
        damageEnemy(e, (e.poisonDps || 1) * .45, { noCrit: true, noChain: true, silent: true, kind: 'poison' });
        if (e.dead) continue;
      }
    }
    if (e.stunTimer > 0) {
      e.stunTimer -= dt;
      if (e.action === 'charge' || e.action === 'drill' || e.action === 'leap') e.action = 'stun';
      e.actionT = Math.max(e.actionT, .1);
    } else if (typeof e.ai === 'string' && e.ai.indexOf('boss') === 0) updateBossAI(e, dt);
    else if (e.ai === 'bomber' || e.ai === 'teleporter' || e.ai === 'sniper' || e.ai === 'roller') updateNewEnemyAI(e, dt);
    else updateEnemyAI(e, dt);

    if (player.dead || state !== 'playing') continue;
    const d = dist(e, player);
    if (d < e.r + player.r * .72 && e.spawnTimer <= 0) {
      const contactMul = e.action === 'charge' ? 1.2 : 1;
      hurtPlayer(e.damage * contactMul, e.x, e.y);
    }
  }

  // 敌人之间轻微分离，避免叠成一团。
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.dead || a.spawnTimer > 0) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.dead || b.spawnTimer > 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const min = (a.r + b.r) * .82;
      const d = Math.hypot(dx, dy) || .01;
      if (d < min) {
        const push = (min - d) * .4;
        const nx = dx / d, ny = dy / d;
        const wa = a.boss ? .05 : (b.boss ? 1 : .5);
        const wb = b.boss ? .05 : (a.boss ? 1 : .5);
        a.x -= nx * push * wa; a.y -= ny * push * wa;
        b.x += nx * push * wb; b.y += ny * push * wb;
      }
    }
    if (a.boss) continue;
    for (const o of room.obstacles) {
      const dx = a.x - o.x, dy = a.y - o.y;
      const min = a.r + o.r;
      const d = Math.hypot(dx, dy) || .01;
      if (d < min) { a.x = o.x + dx / d * min; a.y = o.y + dy / d * min; }
    }
  }

  enemies = enemies.filter(e => !(e.dead && e.deathTimer <= 0));
}

function moveChase(e, dt, speedMul = 1, wobble = 0) {
  if (!player) return false;
  const baseA = Math.atan2(player.y - e.y, player.x - e.x);
  const a = baseA + Math.sin(time * 2.7 + e.phase) * wobble;
  return moveWorld(e, Math.cos(a) * e.speed * speedMul * dt, Math.sin(a) * e.speed * speedMul * dt);
}

/* ------------------------------------------------------------------
   §9 敌人 AI：每种小怪都有独立行为，不允许全部“平移撞人”。
   charger 直冲 / ranged 远程 / lunge 跳扑 / zigzag 蛇形 /
   heavy 重踏 / drill 电钻突进 / orbiter 环绕射击 / whip 触手横扫。
   ------------------------------------------------------------------ */
function enemySlowMul(e) { return e.slowTimer > 0 ? (e.slowMul || .6) : 1; }

function enemyMoveChase(e, dt, speedMul = 1, wobble = .15) {
  moveChase(e, dt, speedMul * enemySlowMul(e), wobble);
}

function projectileColorFor(e) {
  switch (e.projectile) {
    case 'caramel': return '#d9945a';
    case 'candy': return C.pink;
    case 'gear': return '#b8c6d6';
    case 'shell': return '#ffb347';
    case 'eye': return C.lavender;
    case 'spore': return '#b6ff8a';
    default: return C.pink;
  }
}

function enemyShoot(e, angle, opts = {}) {
  addProjectile({
    x: e.x + Math.cos(angle) * (opts.offset || e.r * .8),
    y: e.y + Math.sin(angle) * (opts.offset || e.r * .8),
    angle, speed: opts.speed || 240, radius: opts.radius || 10,
    damage: opts.damage || e.damage, friendly: false,
    kind: opts.kind || e.projectile || 'candy',
    life: opts.life || 4.2, color: opts.color || projectileColorFor(e),
  });
}

function updateEnemyAI(e, dt) {
  e.attackTimer -= dt;
  const d = dist(e, player);
  const toP = Math.atan2(player.y - e.y, player.x - e.x);
  const ai = e.ai;

  // 冲刺型：先蓄力，再锁定方向直线冲撞。
  if (ai === 'charger') {
    if (e.action === 'wind') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        e.action = 'charge';
        e.actionT = .55;
        e.chargeAngle = toP;
        sfx('hurt', .75);
      }
      return;
    }
    if (e.action === 'charge') {
      e.actionT -= dt;
      const blocked = moveWorld(e, Math.cos(e.chargeAngle) * (300 + run.stage * 7) * dt, Math.sin(e.chargeAngle) * (300 + run.stage * 7) * dt);
      if (blocked || e.actionT <= 0) {
        e.action = blocked ? 'stun' : 'idle';
        e.actionT = blocked ? .75 : 0;
        e.attackTimer = 1.5;
        if (blocked) { shake = Math.max(shake, 4); addFloater(e.x, e.y - e.r - 12, '晕!', C.gold, 14); sfx('stomp'); }
      }
      return;
    }
    if (e.action === 'stun') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    enemyMoveChase(e, dt, 1, .2);
    if (e.attackTimer <= 0 && d < 430) {
      e.action = 'wind'; e.actionT = .55;
    }
    return;
  }

  // 远程型：保持距离、侧向绕圈、投掷专属弹幕。
  if (ai === 'ranged') {
    if (e.action === 'wind') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        const lead = .2;
        const a = Math.atan2(player.y + Math.sin(player.aim) * 60 - e.y, player.x + Math.cos(player.aim) * 60 - e.x);
        if (e.projectile === 'shell') {
          enemyShoot(e, a, { speed: 300, radius: 14, damage: Math.round(e.damage * 1.15), life: 3.6 });
        } else {
          enemyShoot(e, a, { speed: 255, radius: 10 });
        }
        e.action = 'shoot'; e.actionT = .2;
        e.attackTimer = 1.9 + rnd(0, .8);
        e.aimAngle = a;
        sfx('shoot');
      }
      return;
    }
    if (e.action === 'shoot') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    let dx = 0, dy = 0;
    if (d < 230) { dx -= Math.cos(toP); dy -= Math.sin(toP); }
    else if (d > 340) { dx += Math.cos(toP); dy += Math.sin(toP); }
    dx += Math.cos(toP + e.wobbleSign * Math.PI / 2) * .55;
    dy += Math.sin(toP + e.wobbleSign * Math.PI / 2) * .55;
    const len = Math.hypot(dx, dy) || 1;
    moveWorld(e, dx / len * e.speed * enemySlowMul(e) * dt, dy / len * e.speed * enemySlowMul(e) * dt);
    if (e.attackTimer <= 0 && d < 620) {
      e.action = 'wind'; e.actionT = .45;
    }
    return;
  }

  // 跳扑型：蹲下蓄力后整只弹射出去，落地有硬直。
  if (ai === 'lunge') {
    if (e.action === 'crouch') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        e.action = 'leap'; e.actionT = .38;
        e.chargeAngle = toP;
        e.leapSpeed = 430 + (e.type === 'mouthcat' ? 130 : 0);
        sfx('swipe', .8);
      }
      return;
    }
    if (e.action === 'leap') {
      e.actionT -= dt;
      const blocked = moveWorld(e, Math.cos(e.chargeAngle) * e.leapSpeed * dt, Math.sin(e.chargeAngle) * e.leapSpeed * dt);
      if (blocked || e.actionT <= 0) {
        e.action = 'idle'; e.actionT = 0;
        e.attackTimer = 1.7;
        // 落地震起一小圈尘土，视觉上区别于平移。
        for (let i = 0; i < 8; i++) addParticle({
          x: e.x + rnd(-e.r, e.r), y: e.y + e.r * .7,
          vx: rnd(-90, 90), vy: rnd(-40, 10), life: rnd(.18, .35), max: .35,
          size: rnd(3, 7), color: withAlpha(C.cream, .5), type: 'puff', rot: 0, vr: 0, gravity: 20, drag: .8,
        });
      }
      return;
    }
    if (e.action === 'stun') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    enemyMoveChase(e, dt, .9, .1);
    if (e.attackTimer <= 0 && d < 300) { e.action = 'crouch'; e.actionT = .5; }
    return;
  }

  // 蛇形型：左右摆动逼近，近身后快速咬一口。
  if (ai === 'zigzag') {
    if (e.action === 'bite') {
      e.actionT -= dt;
      moveWorld(e, Math.cos(e.chargeAngle) * 380 * dt, Math.sin(e.chargeAngle) * 380 * dt);
      if (e.actionT <= 0) { e.action = 'idle'; e.attackTimer = 1.2; }
      return;
    }
    const weave = Math.sin(time * 6 + e.phase) * .85;
    const a = toP + weave * .5;
    moveWorld(e, Math.cos(a) * e.speed * enemySlowMul(e) * dt, Math.sin(a) * e.speed * enemySlowMul(e) * dt);
    if (e.attackTimer <= 0 && d < 190) {
      e.action = 'bite'; e.actionT = .28;
      e.chargeAngle = toP;
      sfx('swipe', .7);
    }
    return;
  }

  // 重型：慢速压迫，靠近后抬身重踏，产生冲击波。
  if (ai === 'heavy') {
    if (e.action === 'stomp') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        e.action = 'idle'; e.attackTimer = 2.6;
        shake = Math.max(shake, 9);
        sfx('stomp');
        rings.push({ x: e.x, y: e.y, r0: 24, r1: 150, life: 0, max: .5, color: withAlpha(C.coral, .7), width: 10, ink: true });
        shockwaves.push({ x: e.x, y: e.y, radius: 28, maxRadius: 150, life: 0, max: .3, friendly: false, damage: e.damage, color: C.coral });
      }
      return;
    }
    if (d < 150 && e.attackTimer <= 0) {
      e.action = 'stomp'; e.actionT = .62;
      showToast(e.name + ' 抬起了铁屁股！', C.coral, .8);
      return;
    }
    enemyMoveChase(e, dt, .85, .05);
    return;
  }

  // 电钻型：钻头加速旋转，然后高速直线突进。
  if (ai === 'drill') {
    if (e.action === 'rev') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        e.action = 'drill'; e.actionT = .5;
        e.chargeAngle = toP;
        sfx('dash', .85);
      }
      return;
    }
    if (e.action === 'drill') {
      e.actionT -= dt;
      const blocked = moveWorld(e, Math.cos(e.chargeAngle) * (520 + run.stage * 6) * dt, Math.sin(e.chargeAngle) * (520 + run.stage * 6) * dt);
      if (blocked || e.actionT <= 0) {
        e.action = 'stun'; e.actionT = .55; e.attackTimer = 1.6;
        if (blocked) { shake = Math.max(shake, 5); sfx('stomp'); }
      }
      return;
    }
    if (e.action === 'stun') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    enemyMoveChase(e, dt, .75, .08);
    if (e.attackTimer <= 0 && d < 480) { e.action = 'rev'; e.actionT = .48; }
    return;
  }

  // 环绕型：围绕玩家转圈，从奇怪的角度射眼球/孢子。
  if (ai === 'orbiter') {
    if (e.action === 'wind') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        enemyShoot(e, toP, { speed: 230, radius: 10, damage: Math.round(e.damage * .9) });
        e.action = 'idle'; e.attackTimer = 1.9 + rnd(0, .9);
        sfx('shoot');
      }
      return;
    }
    const orbitR = e.type === 'spore' ? 190 : 235;
    const a = toP - e.orbitDir * .95;
    const desired = {
      x: player.x + Math.cos(a) * orbitR,
      y: player.y + Math.sin(a) * orbitR,
    };
    const dx = desired.x - e.x, dy = desired.y - e.y;
    const len = Math.hypot(dx, dy) || 1;
    const sp = Math.min(e.speed * enemySlowMul(e) * dt, len);
    moveWorld(e, dx / len * sp, dy / len * sp);
    if (e.attackTimer <= 0 && d < 340) { e.action = 'wind'; e.actionT = .4; }
    return;
  }

  // 触手型：保持中距离，触手横扫一个扇形。
  if (ai === 'whip') {
    if (e.action === 'whip') {
      e.actionT -= dt;
      if (!e.didWhipHit && e.actionT <= .16) {
        e.didWhipHit = true;
        const range = 185;
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        if (dist(e, player) < range + player.r && Math.abs(angleDiff(ang, toP)) < .65) {
          hurtPlayer(e.damage, e.x, e.y, 'whip');
        }
        rings.push({ x: e.x, y: e.y, r0: 20, r1: range, life: 0, max: .32, color: withAlpha(C.lavender, .65), width: 7, ink: true });
        sfx('swipe');
        for (let i = 0; i < 10; i++) {
          const a2 = ang + rnd(-.65, .65);
          addParticle({
            x: e.x + Math.cos(a2) * rnd(30, range), y: e.y + Math.sin(a2) * rnd(30, range),
            vx: Math.cos(a2) * rnd(80, 180), vy: Math.sin(a2) * rnd(80, 180),
            life: rnd(.15, .3), max: .3, size: rnd(3, 7), color: C.lavender, type: 'spark',
            rot: a2, vr: 6, drag: .8,
          });
        }
      }
