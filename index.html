/* ---------------- 主页背景（可替换图片） ----------------
   v1.1.3：
   - 先加载 assets/bg_main.webp（1600×900，~100KB），onerror 回落 bg_main.png；
   - onload 不直接置 ready，先用 img.decode() 预解码，避免主页首帧解码卡顿；
   - ready 后一次性预渲染到 1280×720 离屏单例，drawHomeBackdrop 每帧只 drawImage；
   - 图片缺失/断网/404 时 V11_BG.failed=true，走渐变兜底，不白屏。 */
function v11BgBuildOffscreen() {
  if (V11_BG.offscreen || !V11_BG.ready || !V11_BG.img) return;
  try {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    if (!x) return;
    const img = V11_BG.img;
    const cover = Math.max(W / img.width, H / img.height);
    const dw = img.width * cover, dh = img.height * cover;
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
    V11_BG.offscreen = c;
  } catch (e) { V11_BG.offscreen = null; }
}

function v11BgMarkReady() {
  if (V11_BG.ready) return;
  V11_BG.ready = true;
  V11_BG.failed = false;
  v11BgBuildOffscreen();
}

function v11EnsureBackground() {
  if (V11_BG.img || V11_BG.failed) return V11_BG.img;
  try {
    const img = new Image();
    let usingPng = false;
    img.decoding = 'async';
    img.onload = () => {
      // v1.1.3：onload 不直接置 ready，先 decode() 预解码再置。
      if (typeof img.decode === 'function') img.decode().then(v11BgMarkReady, v11BgMarkReady);
      else v11BgMarkReady();
    };
    img.onerror = () => {
      if (!usingPng) {
        usingPng = true;
        V11_BG.source = 'assets/bg_main.png';
        img.src = 'assets/bg_main.png';
        return;
      }
      V11_BG.failed = true;
      V11_BG.ready = false;
    };
    V11_BG.source = 'assets/bg_main.webp';
    img.src = 'assets/bg_main.webp';
    V11_BG.img = img;
    return img;
  } catch (e) { V11_BG.failed = true; return null; }
}

/* loading 最多等图 1200ms，超时放行；图片已 failed 时立即返回。 */
async function v11BgWait(maxMs) {
  if (V11_BG.ready || V11_BG.failed) return V11_BG.ready;
  v11EnsureBackground();
  if (V11_BG.ready || V11_BG.failed) return V11_BG.ready;
  const limit = maxMs == null ? 1200 : maxMs;
  const t0 = Date.now();
  while (!V11_BG.ready && !V11_BG.failed) {
    if (Date.now() - t0 >= limit) break;
    await new Promise(r => setTimeout(r, 40));
  }
  return V11_BG.ready;
}

v11EnsureBackground();

function v11DrawHomeBackdrop(g, t) {
  // 兜底渐变：图片缺失/失败时也不会白屏。
  if (V11_BG.ready && V11_BG.offscreen) {
    // v1.1.3：ready 后每帧只 drawImage 离屏单例，不再缩放 1600×900 原图。
    g.drawImage(V11_BG.offscreen, 0, 0, W, H);
  } else {
    const fallback = g.createLinearGradient(0, 0, 0, H);
    fallback.addColorStop(0, '#2a1736');
    fallback.addColorStop(.42, '#3d2347');
    fallback.addColorStop(.72, '#2d1c3c');
    fallback.addColorStop(1, '#14101f');
    g.fillStyle = fallback; g.fillRect(0, 0, W, H);
    if (V11_BG.ready && V11_BG.img) {
      const img = V11_BG.img;
      const cover = Math.max(W / img.width, H / img.height);
      const dw = img.width * cover, dh = img.height * cover;
      g.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
    } else {
      // 程序化兜底：大猫头 + 星星 + 毛线球
      g.save(); g.globalAlpha = .5;
      drawCatHead(g, W * .58, 318, 128, 0, t);
      for (let i = 0; i < 12; i++) {
        const a = i * 2.1 + t * .15;
        drawStar(g, 110 + (i * 157) % 1080, 50 + (i * 83) % 600, 5 + i % 4, 2, 5, i % 2 ? C.gold : C.cream, null, 0, a);
      }
      g.restore();
    }
  }
  // 暗角 + 上下渐变，保证标题与按钮可读。
  const vig = g.createRadialGradient(W * .5, H * .5, H * .28, W * .5, H * .5, W * .72);
  vig.addColorStop(0, 'rgba(16,10,26,0)');
  vig.addColorStop(.72, 'rgba(16,10,26,.22)');
  vig.addColorStop(1, 'rgba(10,6,16,.66)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  const top = g.createLinearGradient(0, 0, 0, 240);
  top.addColorStop(0, 'rgba(10,6,16,.6)'); top.addColorStop(1, 'rgba(10,6,16,0)');
  g.fillStyle = top; g.fillRect(0, 0, W, 240);
  const bottom = g.createLinearGradient(0, H - 260, 0, H);
  bottom.addColorStop(0, 'rgba(10,6,16,0)'); bottom.addColorStop(1, 'rgba(10,6,16,.62)');
  g.fillStyle = bottom; g.fillRect(0, H - 260, W, 260);
}

/* ---------------- 更新日志（v1.1.1 排版重构：结构化 + 自适应换行） ---------------- */
let V11_CHANGELOG_LAYOUT = null; // 排版快照，供验收断言 / 调试接口读取

function v11ChangelogRows() {
  const data = V11_CONFIG.changelog;
  if (!data || !Array.isArray(data.versions)) return [];
  const out = [];
  for (let vi = 0; vi < data.versions.length; vi++) {
    const ver = data.versions[vi];
    const current = ver.version === data.current || (vi === 0 && !data.current);
    const open = current || V11_PAGES.changelogOpen === ver.version;
    const sections = [];
    const groups = [
      ['新增', ver.added, C.mint],
      ['优化', ver.improved, C.gold],
      ['修复', ver.fixed, C.coral],
      ['已知问题', ver.known, C.lavender],
    ];
    for (const [tag, arr, color] of groups) {
      if (Array.isArray(arr) && arr.length) sections.push({ tag, color, items: arr.slice() });
    }
    out.push({ version: ver.version, date: ver.date || '', current, open, sections });
  }
  return out;
}

/* 与 drawText 一致的字体公式：测量与最终绘制用同一套字体。 */
function v11Font(size, weight) {
  return `${weight || 600} ${size}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;
}
function v11TextWidth(g, text, size, weight) {
  const fs = (typeof v11gMenuFontSize === 'function') ? v11gMenuFontSize(size) : size;
  g.save();
  g.font = v11Font(fs, weight);
  const w = g.measureText(text).width;
  g.restore();
  return w;
}
/* 逐字换行：长文本不溢出容器。 */
function v11WrapLines(g, text, maxW, size, weight) {
  const fs = (typeof v11gMenuFontSize === 'function') ? v11gMenuFontSize(size) : size;
  g.save();
  g.font = v11Font(fs, weight);
  const chars = Array.from(text);
  const lines = [];
  let line = '';
  for (const ch of chars) {
    if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  g.restore();
  return lines;
}

function v11DrawChangelogScreen(g, t) {
  V11_CHANGELOG_RECTS.length = 0;
  v11ThemeBg(g, t, { variant: 'changelog' });
  const back = v11PageHeader(g, '更新日志', '版本号 + 日期 + 新增 / 优化 / 修复 / 已知问题 · 最新版本置顶', '返回主页');
  V11_CHANGELOG_RECTS.push({ id: 'back', ...back });

  const versions = v11ChangelogRows();
  if (!versions.length) {
    drawText(g, V11_CONFIG.loaded ? '更新日志 JSON 为空' : '更新日志尚未拉取', W / 2, 340, 16, C.cream, { align: 'center', weight: 800 });
    drawBannerAndToast(g, t);
    V11_CHANGELOG_LAYOUT = { totalH: 0, maxScroll: 0, scroll: 0, versions: [], rows: [], area: null, textX: 0, textW: 0 };
    return;
  }

  // —— 尺寸：触屏 / 窄屏按 compact 放大字号与行距，避免错位裁切 ——
  const compact = v11CompactLayout();
  const k = compact ? 1.3 : 1;
  const vSize = Math.round(17 * k), vDateSize = Math.max(compact ? 14 : 11, Math.round(11 * k));
  const gSize = Math.round(13 * k), iSize = Math.max(compact ? 14 : 11, Math.round(11 * k));
  const vH = Math.round(48 * k);                                   // 版本头高
  const gH = Math.round(30 * k);                                   // 分组头高
  const iLH = Math.round(20 * k);                                  // 条目行高（字号 + 行距）
  const gPad = Math.round(9 * k);                                  // 分组底部空隙
  const vGap = Math.round(18 * k);                                 // 版本间空隙（分隔线居中）

  const area = compact ? { x: 28, y: 112, w: 1224, h: 556 } : { x: 56, y: 108, w: 1120, h: 560 };
  const barW = 6, barX = area.x + area.w - 16;                     // 右侧滚动条轨道
  const textX = area.x + 26;
  const textW = area.w - 26 - 26 - barW - 4;                       // 内容宽，与滚动条不冲突

  // —— 第一遍：逐字换行排版，算总高 ——
  const laid = [];
  const verRects = [];
  const dividers = [];
  let y = 0;
  for (let vi = 0; vi < versions.length; vi++) {
    const ver = versions[vi];
    verRects.push({ version: ver.version, open: ver.open, current: ver.current, y, h: vH });
    laid.push({ kind: 'version', version: ver.version, date: ver.date, current: ver.current, y, h: vH });
    y += vH;
    if (!ver.open) {
      laid.push({ kind: 'hint', text: '点击展开这一版的四组条目', y, h: Math.round(22 * k) });
      y += Math.round(22 * k);
    } else {
      for (const sec of ver.sections) {
        laid.push({ kind: 'group', tag: sec.tag, color: sec.color, y, h: gH });
        y += gH;
        for (const item of sec.items) {
          const lines = v11WrapLines(g, '· ' + item, textW, iSize, 600);
          laid.push({ kind: 'item', lines, color: sec.color, y, h: Math.max(1, lines.length) * iLH });
          y += Math.max(1, lines.length) * iLH;
        }
        y += gPad;
      }
    }
    if (vi < versions.length - 1) {
      y += Math.round(vGap * .5);
      dividers.push(y);
      y += Math.round(vGap * .5);
    }
  }
  const totalH = y + 10;
  const maxScroll = Math.max(0, totalH - area.h);
  V11_PAGES.changelogScroll = clamp(V11_PAGES.changelogScroll, 0, maxScroll);
  const off = -V11_PAGES.changelogScroll;

  // 滚动条轨道 / 滑块（固定右侧，内容已为其留白）
  if (maxScroll > 0) {
    fillRound(g, barX, area.y, barW, area.h, 3, withAlpha(C.cream, .14));
    const thumbH = Math.max(36, area.h * area.h / totalH);
    const thumbY = area.y + (area.h - thumbH) * (V11_PAGES.changelogScroll / maxScroll);
    fillRound(g, barX, thumbY, barW, thumbH, 3, withAlpha(C.gold, .68));
  }

  g.save();
  roundRectPath(g, area.x, area.y, area.w, area.h, 14); g.clip();

  for (const row of laid) {
    const yy = area.y + row.y + off;
    if (yy + row.h < area.y - 4 || yy > area.y + area.h + 4) continue;
    if (row.kind === 'version') {
      // 版本头：版本号 + 日期，级差明显；当前版本高亮带。
      const bandH = row.h - 12;
      fillRound(g, area.x + 10, yy + 5, area.w - 60, bandH, 12, withAlpha(row.current ? C.gold : C.cream, row.current ? .17 : .07));
      drawText(g, row.version, textX, yy + row.h / 2 - 3, vSize, row.current ? C.gold : C.cream, { weight: 900 });
      if (row.current) {
        drawText(g, '◆ 当前版本', textX + v11TextWidth(g, row.version, vSize, 900) + 20, yy + row.h / 2 - 3, Math.round(11 * k), C.gold, { weight: 900 });
      }
      drawText(g, row.date, area.x + area.w - 58, yy + row.h / 2 - 3, vDateSize, withAlpha(C.cream, .55), { align: 'right', weight: 700 });
    } else if (row.kind === 'group') {
      // 分组：色标 + 名称，右侧细分隔线。
      fillRound(g, textX + 2, yy + row.h / 2 - 7, 8, 14, 4, row.color);
      drawText(g, row.tag, textX + 20, yy + row.h / 2, gSize, row.color, { weight: 900 });
      const lx = textX + 20 + v11TextWidth(g, row.tag, gSize, 900) + 14;
      g.strokeStyle = withAlpha(row.color, .28); g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(lx, yy + row.h / 2); g.lineTo(textX + textW + 8, yy + row.h / 2); g.stroke();
    } else if (row.kind === 'hint') {
      drawText(g, row.text, textX + 6, yy + row.h / 2, Math.max(compact ? 14 : 10, Math.round(10 * k)), withAlpha(C.cream, .5), { weight: 600 });
    } else {
      for (let li = 0; li < row.lines.length; li++) {
        const ly = yy + iLH * li + iLH / 2;
        if (ly >= area.y - 10 && ly <= area.y + area.h + 10) {
          drawText(g, row.lines[li], textX + 4, ly, iSize, withAlpha(C.cream, .8), { weight: 600 });
        }
      }
    }
  }

  // 版本之间分隔线
  for (const dy of dividers) {
    const dyy = area.y + dy + off;
    if (dyy < area.y + 2 || dyy > area.y + area.h - 2) continue;
    g.strokeStyle = withAlpha(C.cream, .14); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(area.x + 26, dyy); g.lineTo(area.x + area.w - 46, dyy); g.stroke();
  }
  g.restore();

  // 版本头点击展开矩形（绝对坐标，跟 _v11b 的展开/折叠逻辑兼容）。
  for (const vr of verRects) {
    V11_CHANGELOG_RECTS.push({
      id: 'version', version: vr.version,
      x: area.x, y: area.y + vr.y + off, w: area.w - barW, h: vr.h,
    });
  }

  V11_CHANGELOG_LAYOUT = {
    totalH, maxScroll, scroll: V11_PAGES.changelogScroll, k,
    area: { x: area.x, y: area.y, w: area.w, h: area.h },
    bar: { x: barX, w: barW },
    textX, textW,
    versions: verRects.map(v => ({ ...v })),
    dividers: dividers.map(d => area.y + d + off),
    rows: laid.map(r => ({
      kind: r.kind,
      y: area.y + r.y + off,
      h: r.h,
      lineCount: r.lines ? r.lines.length : (r.kind === 'version' || r.kind === 'group' ? 1 : 0),
    })),
  };

  drawText(g, '滚轮 / ↑↓ 翻页 · Esc 返回主页', W / 2, compact ? 684 : 692, compact ? 14 : 10, withAlpha(C.cream, .42), { align: 'center', weight: 700 });
  drawBannerAndToast(g, t);
}

function v11ScrollChangelog(delta) {
  if (state !== 'changelog') return;
  V11_PAGES.changelogScroll = Math.max(0, V11_PAGES.changelogScroll + delta);
}

/* ==================================================================
   v1.1 ONLINE LAYER · B：视图 / 全屏 / 设置 / 图鉴 / 选关 / 输入分发
   ------------------------------------------------------------------
   本层不重写战斗，只把“外围页面 + 画布缩放 + 全屏 + 输入路由”接好。
   - 画布按 devicePixelRatio 提高绘制分辨率，逻辑坐标仍是 1280×720
   - 全屏由点击/按键触发；fullscreenchange 后重算尺寸；iOS 降级伪全屏
   - 设置页新增“更新日志”入口与版本号，保存成功/失败提示
   - 图鉴分页；剧情选关 30 卡 6×5
   - draw/handleDown/update 覆盖，新状态全部分发到这里
   ================================================================== */

const V11_BESTIARY_PAGE_SIZE = 12;
let V11_BESTIARY_PAGE = 0;
let V11_SETTINGS_HOVER = null;

/* ---------------- 画布尺寸 / DPR / 全屏 ---------------- */
function v11IsFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
    V11_FS.pseudo || V11_FS.electronFull);
}

/* v1.1.3 补充项：手机只做横屏，摇杆 / 攻击 / 冲刺只保留横屏一套尺寸。
   热区全部 ≥44（摇杆 152 / 攻击 116 / 冲刺 84 直径）。 */
function v11SyncTouchLayout() {
  TOUCH_JOY.r = 76;
  TOUCH_JOY.knob = 30;
  TOUCH_ATTACK.x = 1168;
  TOUCH_ATTACK.y = 566;
  TOUCH_ATTACK.r = 58;
  TOUCH_DASH.x = 1044;
  TOUCH_DASH.y = 634;
  TOUCH_DASH.r = 42;
  if (touchState.joyId === null) {
    touchState.joyX = TOUCH_JOY.x;
    touchState.joyY = TOUCH_JOY.y;
  }
}

function v11SyncCanvasSize() {
  const dpr = Math.min(2.5, Math.max(1, window.devicePixelRatio || 1));
  const vw = Math.max(240, window.innerWidth || W);
  const vh = Math.max(160, window.innerHeight || H);
  let cssW, cssH;
  if (v11IsFullscreen()) {
    const fit = Math.min(vw / W, vh / H);
    cssW = Math.floor(W * fit); cssH = Math.floor(H * fit);
  } else if (V11_FS.electron && window.nyanDesktop && window.nyanDesktop.setWindowScale) {
    // Electron：窗口本身由主进程按档位缩放，画布只负责填满可用区域。
    const fit = Math.min(1, vw / W, vh / H);
    cssW = Math.floor(W * fit); cssH = Math.floor(H * fit);
    try {
      const p = window.nyanDesktop.setWindowScale(settings.scale);
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* 旧外壳没有该接口时静默 */ }
  } else {
    const baseW = W * settings.scale;
    const baseH = H * settings.scale;
    const fit = Math.min(1, vw / baseW, vh / baseH);
    cssW = Math.max(240, Math.floor(baseW * fit));
    cssH = Math.max(135, Math.floor(baseH * fit));
  }
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  // 绘制分辨率跟随 DPR，最高 2560 宽，避免手机上糊成一片。
  const bw = Math.min(2560, Math.max(640, Math.round(cssW * dpr)));
  const bh = Math.max(1, Math.round(bw * H / W));
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw; canvas.height = bh;
  }
  ctx.setTransform(bw / W, 0, 0, bh / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
  V11_VIEW.cssW = cssW; V11_VIEW.cssH = cssH; V11_VIEW.k = bw / W;
  v11SyncTouchLayout();

  const stage = document.getElementById('stage');
  if (stage) {
    if (V11_FS.pseudo) {
      stage.style.position = 'fixed';
      stage.style.inset = '0';
      stage.style.background = '#0a0710';
    } else {
      stage.style.position = '';
      stage.style.inset = '';
      stage.style.background = '';
    }
  }
}

const V11_LEGACY_APPLY_VIEW_SCALE = applyViewScale;
applyViewScale = function () { v11SyncCanvasSize(); };

function v11EnterPseudoFullscreen() {
  V11_FS.pseudo = true;
  try {
    document.documentElement.classList.add('pseudo-fullscreen');
    document.body.classList.add('pseudo-fullscreen');
  } catch (e) { /* 忽略 */ }
  v11SyncCanvasSize();
  showToast('当前环境不支持真全屏 · 已启用伪全屏（浏览器栏仍在）', C.lavender, 2.8);
}

function v11ExitPseudoFullscreen() {
  V11_FS.pseudo = false;
  try {
    document.documentElement.classList.remove('pseudo-fullscreen');
    document.body.classList.remove('pseudo-fullscreen');
  } catch (e) { /* 忽略 */ }
  v11SyncCanvasSize();
}

function v11SetFullscreen(on) {
  if (V11_FS.electron) {
    if (window.nyanDesktop && window.nyanDesktop.setFullscreen) {
      V11_FS.electronFull = !!on;
      try {
        const p = window.nyanDesktop.setFullscreen(!!on);
        if (p && p.catch) p.catch(() => { V11_FS.electronFull = !on; v11SyncCanvasSize(); });
      } catch (e) { V11_FS.electronFull = !on; }
      setTimeout(v11SyncCanvasSize, 140);
      return;
    }
    showToast('桌面壳版本过低 · 无法切换全屏', C.coral, 2.4);
    return;
  }
  if (on) {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      v11SyncCanvasSize();
      return;
    }
    if (V11_FS.pseudo) { v11SyncCanvasSize(); return; }
    V11_FS.wasFullscreen = true;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen ||
      el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) {
      try {
        const p = req.call(el, { navigationUI: 'hide' });
        if (p && p.catch) p.catch(() => v11EnterPseudoFullscreen());
      } catch (e) {
        v11EnterPseudoFullscreen();
      }
    } else {
      v11EnterPseudoFullscreen();
    }
  } else {
    V11_FS.wasFullscreen = false;
    if (document.fullscreenElement) {
      try {
        const p = document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* 忽略 */ }
    } else if (document.webkitFullscreenElement) {
      try { document.webkitExitFullscreen(); } catch (e) { /* 忽略 */ }
    } else if (V11_FS.pseudo) {
      v11ExitPseudoFullscreen();
    }
  }
  v11SyncCanvasSize();
}

const V11_FS_ONCHANGE = function () {
  const still = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!still && V11_FS.wasFullscreen) {
    V11_FS.wasFullscreen = false;
    // Esc 退出全屏：先退出全屏，再进入暂停，避免与暂停状态打架。
    if (state === 'playing') {
      state = 'paused';
      shake = 0; flash = 0;
      clearInput();
      if (typeof releaseTouchControls === 'function') releaseTouchControls();
      showToast('已退出全屏 · 游戏已暂停', C.gold, 2.2);
    }
  }
  v11SyncCanvasSize();
};
document.addEventListener('fullscreenchange', V11_FS_ONCHANGE);
document.addEventListener('webkitfullscreenchange', V11_FS_ONCHANGE);
window.addEventListener('resize', () => { v11SyncCanvasSize(); });
window.addEventListener('orientationchange', () => { setTimeout(v11SyncCanvasSize, 220); });

const V11_LEGACY_TOGGLE_FULLSCREEN = toggleFullscreen;
toggleFullscreen = function () {
  try {
    sfx('click');
    v11SetFullscreen(!v11IsFullscreen());
    if (settingsNotice) settingsNotice = null;
  } catch (e) {
    showToast('全屏切换失败', C.coral, 2.2);
  }
};

/* v1.1.3 补充项：手机横屏设置面板 · 左设置项 + 右手机操控 + 底部按钮行。

function v11DrawStorySelectScreen(g, t) {
  storyStageRects = [];
  const compact = v11CompactLayout();
  v11ThemeBg(g, t, { variant: 'storySelect' });

  drawText(g, '剧情模式 · 选关', compact ? 28 : 52, compact ? 52 : 46, compact ? 46 : 30, C.cream, { weight: 900, line: 5 });
  const mp = modeProgressFor('story');
  const cleared = mp ? (mp.clearedStage || 0) : 0;
  const total = STAGE_CFG.storyStageCount || 30;
  drawText(g, `${total} 关全部可见 · 顺序解锁 · 每 3 关一次存档提示 · 只有本模式有剧情`,
    compact ? 30 : 54, compact ? 94 : 78, compact ? 14 : 12, withAlpha(C.cream, .66), { weight: 700 });
  drawText(g, `已通关 ${cleared} / ${total}`, compact ? 1056 : 1000, compact ? 50 : 48,
    compact ? 18 : 15, C.gold, { align: 'right', weight: 900 });

  const back = compact ? { x: 1092, y: 24, w: 160, h: 52 } : { x: 1040, y: 32, w: 184, h: 54 };
  const bh = pointRect(mouse, back);
  fillRound(g, back.x, back.y, back.w, back.h, 13, bh ? C.mint : withAlpha(C.mint, .82));
  strokeRound(g, back.x, back.y, back.w, back.h, 13, C.ink, 2.2);
  drawText(g, '← 返回主页', back.x + back.w / 2, back.y + back.h / 2, compact ? 20 : 14,
    C.ink, { align: 'center', weight: 900 });

  const unlocked = storyUnlockedStage();
  const cols = 6;
  const cardW = compact ? 194 : 188, cardH = compact ? 100 : 100;
  const gapX = compact ? 12 : 14, gapY = compact ? 8 : 8;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = compact ? 28 : (W - totalW) / 2, startY = compact ? 124 : 104;
  for (let stage = 1; stage <= total; stage++) {
    const idx = stage - 1;
    const col = idx % cols, row = Math.floor(idx / cols);
    const x = startX + col * (cardW + gapX);
    const y = startY + row * (cardH + gapY);
    const open = stage <= unlocked;
    const done = stage <= cleared;
    const boss = stage % (STAGE_CFG.bossEvery || 3) === 0;
    const chapter = Math.floor(idx / CHAPTER_STAGES);
    const theme = THEMES[chapter] || THEMES[0];
    const accent = open ? theme.accent : withAlpha(C.cream, .25);
    const hover = open && pointRect(mouse, { x, y, w: cardW, h: cardH });
    g.save();
    fillRound(g, x + 4, y + 5, cardW, cardH, 13, withAlpha(C.ink, .35));
    fillRound(g, x, y, cardW, cardH, 13, hover ? withAlpha(theme.accent, .22) : withAlpha('#261835', .94));
    strokeRound(g, x, y, cardW, cardH, 13, hover ? theme.accent : withAlpha(accent, .55), hover ? 3 : 1.8);
    fillRound(g, x, y, cardW, 5, 2.5, accent);
    drawText(g, stageLabel(stage, 'story'), x + 12, y + (compact ? 34 : 32), compact ? 28 : 24,
      open ? C.cream : withAlpha(C.cream, .35), { weight: 900 });
    drawText(g, theme.name, x + 12, y + (compact ? 58 : 54), compact ? 14 : 9,
      withAlpha(C.cream, open ? .68 : .3), { weight: 700 });
    if (boss) {
      fillRound(g, x + cardW - (compact ? 68 : 58), y + (compact ? 12 : 14), compact ? 56 : 46, compact ? 24 : 20, 10,
        withAlpha(C.coral, open ? .8 : .25));
      drawText(g, 'BOSS', x + cardW - (compact ? 40 : 35), y + (compact ? 24 : 24), compact ? 14 : 10,
        open ? C.cream : withAlpha(C.cream, .4), { align: 'center', weight: 900 });
    }
    if (done) {
      drawText(g, '✓ 已通关', x + 12, y + (compact ? 86 : 80), compact ? 14 : 10, C.mint, { weight: 900 });
    } else if (open) {
      drawText(g, stage === Math.max(1, cleared + 1) ? '▶ 当前关卡' : '可挑战',
        x + 12, y + (compact ? 86 : 80), compact ? 14 : 10, accent, { weight: 900 });
    } else {
      drawText(g, '锁定', x + 12, y + (compact ? 86 : 80), compact ? 14 : 10, withAlpha(C.cream, .4), { weight: 800 });
    }
    const storyAt = STORY_CHAPTERS.find(ch => ch.stage === stage);
    if (storyAt) drawText(g, '剧情', x + cardW - 12, y + (compact ? 86 : 80), compact ? 14 : 9,
      C.lavender, { align: 'right', weight: 900 });
    g.restore();
    if (open) storyStageRects.push({ stage, x, y, w: cardW, h: cardH });
  }
  drawText(g, '点击已解锁关卡开始 · 关卡进度自动写入检查点 · Esc 返回主页',
    W / 2, compact ? 684 : 684, compact ? 14 : 10, withAlpha(C.cream, .5), { align: 'center', weight: 700 });
  storyStageRects.push({ stage: 0, id: 'back', ...back });
}

  V11_PAGES.changelogReturn = from || 'title';

}

   复用 returnToHome 的 run/player/实体清理，再把落点从 title 改为 modeSelect。 */
function v11AbandonRunToModeSelect() {
  if (settingsReturn !== 'playing' && settingsReturn !== 'paused') return;
  if (typeof clearToast === 'function') clearToast();
  returnToHome();
  if (typeof releaseTouchControls === 'function') releaseTouchControls();
  clearInput();
  settingsReturn = 'title';
  V11_PAGES.modeFrom = 'home';
  state = 'modeSelect';
  sfx('click');
}

/* 设置面板的第五个按钮只在游戏内（playing / paused 打开设置）显示。 */
function v11SettingsInRun() {
  return settingsReturn === 'playing' || settingsReturn === 'paused';
}

/* 存档页 / 模式页的确认弹窗：旧代码只在 title 状态下处理 confirm，这里补一份。 */
function v11HandleConfirmClick() {
  if (!confirmAction) return false;
  if (confirmRects[0] && pointRect(mouse, confirmRects[0])) {
    const act = confirmAction;
    confirmAction = null;
    act.run();
  } else if (confirmRects[1] && pointRect(mouse, confirmRects[1])) {
    confirmAction = null;
    sfx('click');
  }
  return true;
}

function v11AfterProfileChosen() {
  const pending = V11_PAGES.pendingMode;
  V11_PAGES.pendingMode = null;
  if (!profile) return;
  if (pending === '_modes') { v11OpenModeSelect('home'); return; }
  if (pending === 'story') { startModeFromHome('story'); }
  else if (pending && MODES[pending]) { startModeFromHome(pending); }
  else { state = 'saveSelect'; }
  clearInput();
}

/* ---------------- 顶部分发：标题 / 模式 / 存档 / 日志 ---------------- */
const V11_LEGACY_DRAW = draw;
draw = function () {
  const st = state;
  if (st === 'loading') {
    ctx.clearRect(0, 0, W, H);
    v11DrawLoadingScreen(ctx, time);
    canvas.style.cursor = 'default';
    return;
  }
  if (st === 'offline') {
    ctx.clearRect(0, 0, W, H);
    v11DrawOfflineScreen(ctx, time);
    v11PageCursor([V11_OFFLINE_RECT.r]);
    return;
  }
  if (st === 'title') {
    ctx.clearRect(0, 0, W, H);
    v11DrawTitleScreen(ctx, time);
    v11PageCursor(Object.keys(V11_HOME_RECTS).map(k => V11_HOME_RECTS[k]));
    drawVolumePill(ctx);
    return;
  }
  if (st === 'modeSelect') {
    ctx.clearRect(0, 0, W, H);
    v11DrawModeSelectScreen(ctx, time);
    v11PageCursor(confirmAction ? confirmRects : V11_MODE_RECTS);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'saveSelect') {
    ctx.clearRect(0, 0, W, H);
    v11DrawSaveSelectScreen(ctx, time);
    v11PageCursor(confirmAction ? confirmRects : (slotMenu ? slotMenuRects : V11_SAVE_RECTS));
    return;
  }
  if (st === 'changelog') {
    ctx.clearRect(0, 0, W, H);
    v11DrawChangelogScreen(ctx, time);
    v11PageCursor(V11_CHANGELOG_RECTS);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'settings') {
    ctx.clearRect(0, 0, W, H);
    v11DrawSettingsScreen(ctx, time);
    v11PageCursor(settingsRects);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'bestiary') {
    ctx.clearRect(0, 0, W, H);
    v11DrawBestiaryScreen(ctx, time);
    v11PageCursor(bestiaryRects);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'storySelect') {
    ctx.clearRect(0, 0, W, H);
    v11DrawStorySelectScreen(ctx, time);
    v11PageCursor(storyStageRects);
    drawVolumePill(ctx);
    return;
  }
  V11_LEGACY_DRAW();
};

/* ---------------- 点击分发 ---------------- */
const V11_LEGACY_HANDLE_DOWN = handleDown;
handleDown = function (ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  updatePointer(ev);
  initAudio();
  const st = state;

  if (st === 'offline') {
    if (V11_OFFLINE_RECT.r && pointRect(mouse, V11_OFFLINE_RECT.r)) {
      sfx('click');
      v11BootGame();
    }
    return;
  }
  if (st === 'loading') return;

  if (st === 'title') {
    if (confirmAction) {
      V11_LEGACY_HANDLE_DOWN(ev);
      return;
    }
    const hit = Object.keys(V11_HOME_RECTS).find(k => V11_HOME_RECTS[k] && pointRect(mouse, V11_HOME_RECTS[k]));
    if (!hit) return;
    if (hit === 'start') {
      sfx('click');
      if (!profile) {
        showToast('先新建或载入一份档案，再选模式', C.coral, 2.6);
        V11_PAGES.pendingMode = '_modes';
        v11OpenSaveSelect('start');
      } else {
        V11_PAGES.pendingMode = null;
        v11OpenModeSelect('home');
      }
    } else if (hit === 'save') {
      v11OpenSaveSelect('home');
    } else if (hit === 'settings') {
      openSettings('title');
    } else if (hit === 'bestiary') {
      openBestiary();
    } else if (hit === 'changelog') {
      v11OpenChangelog('title');
    } else if (hit === 'exit') {
      sfx('click');
      if (window.nyanDesktop && window.nyanDesktop.quit) {
        try { window.nyanDesktop.quit(); } catch (e) { /* 忽略 */ }
      } else {
        showToast('网页版请直接关闭标签页 · 进度已保存在本机', C.lavender, 2.8);
      }
    }
    return;
  }

  if (st === 'modeSelect') {
    if (v11HandleConfirmClick()) return;
    const hit = V11_MODE_RECTS.find(r => pointRect(mouse, r));
    if (!hit) { if (pointRect(mouse, { x: 1040, y: 32, w: 184, h: 54 })) v11ReturnFromModeSelect(); return; }
    if (hit.id === 'back') { v11ReturnFromModeSelect(); return; }
    if (!profile) {
      V11_PAGES.pendingMode = hit.id;
      showToast('先选一份档案，再进入' + (MODES[hit.id] ? MODES[hit.id].name : '模式'), C.coral, 2.4);
      v11OpenSaveSelect('mode');
      return;
    }
    sfx('click');
    startModeFromHome(hit.id === 'story' ? 'story' : hit.id);
    clearInput();
    return;
  }

  if (st === 'saveSelect') {
    if (v11HandleConfirmClick()) return;
    if (slotMenu) {
      const hit = slotMenuRects.find(r => pointRect(mouse, r));
      if (!hit) { closeSlotMenu(); return; }
      const slot = slotMenu.slot;
      if (hit.id === 'load') {
        if (activateProfile(slot)) { closeSlotMenu(); v11AfterProfileChosen(); }
      } else if (hit.id === 'overwrite') {
        if (slotCache[slot]) {
          confirmAction = {
            title: `覆盖存档位 ${slot}？`,
            text: '当前档案的全部模式进度会整体写入该槽位，原有进度将被替换。',
            okLabel: '覆盖写入',
            run: () => { if (overwriteProfileAt(slot)) { closeSlotMenu(); } },
          };
        } else if (profile) {
          confirmAction = {
            title: `新建到存档位 ${slot}？`,
            text: '空槽位会写入当前档案的完整进度。',
            okLabel: '写入',
            run: () => { if (overwriteProfileAt(slot)) { closeSlotMenu(); } },
          };
        } else {
          showToast('当前没有档案 · 请选一个已有档案载入', C.coral, 2.4);
        }
        sfx('click');
      } else if (hit.id === 'delete') {
        confirmAction = {
          title: `删除存档位 ${slot}？`,
          text: '该槽位的五个模式进度会一起删除，无法恢复。',
          okLabel: '删除档案',
          run: () => { deleteProfileAt(slot); closeSlotMenu(); },
        };
        sfx('click');
      } else {
        closeSlotMenu(); sfx('click');
      }
      return;
    }
    const hit = V11_SAVE_RECTS.find(r => pointRect(mouse, r));
    if (!hit) {
      if (pointRect(mouse, { x: 1040, y: 32, w: 184, h: 54 })) { state = 'title'; clearInput(); sfx('click'); }
      return;
    }
    if (hit.id === 'back') { state = 'title'; clearInput(); sfx('click'); return; }
    if (hit.id === 'slot') {
      if (!slotCache[hit.slot]) {
        confirmAction = {
          title: `新建存档位 ${hit.slot}？`,
          text: '将创建一份包含五个模式空进度的新档案，并立即设为当前档案。',
          okLabel: '新建档案',
          run: () => { if (createProfileAt(hit.slot, false)) v11AfterProfileChosen(); },
        };
        sfx('click');
      } else {

    return;
  }

  if (st === 'changelog') {
    const hit = V11_CHANGELOG_RECTS.find(r => pointRect(mouse, r));
    if (hit && hit.id === 'back') { v11CloseChangelog(); return; }
    if (hit && hit.id === 'version') {
      V11_PAGES.changelogOpen = V11_PAGES.changelogOpen === hit.version ? null : hit.version;
      sfx('click');
    }
    return;
  }

  if (st === 'settings') {
    const hit = settingsRects.find(r => pointRect(mouse, r));

    if (hit.type === 'changelog') { v11OpenChangelog('settings'); return; }
    if (hit.type === 'scale') applyScaleSetting(hit.value);
    else if (hit.type === 'fps') applyFpsSetting(hit.value);
    else if (hit.type === 'mute') { setMuted(!settings.muted); showVolumePill(); sfx('click'); }
    else if (hit.type === 'master' || hit.type === 'sfx') {
      settingsDrag = hit.type;
      setSettingsSliderFromPointer(hit.type);
    } else if (hit.type === 'fullscreen') toggleFullscreen();
    else if (hit.type === 'touchJoyScale' || hit.type === 'touchRightScale') {
      settingsDrag = hit.type;
      setSettingsSliderFromPointer(hit.type);
    } else if (hit.type === 'touchEdit') { v11OpenTouchEdit(hit.value); }
    else if (hit.type === 'touchReset') { v11ResetTouchCfg(); }
    else if (hit.type === 'save') saveSettingsWithNotice();
    else if (hit.type === 'bestiary') openBestiary();
    else if (hit.type === 'switchmode') v11AbandonRunToModeSelect();
    else if (hit.type === 'back') closeSettings();
    return;
  }

  if (st === 'bestiary') {
    const hit = bestiaryRects.find(r => pointRect(mouse, r));
    if (!hit) return;
    if (hit.id === 'back') closeBestiary();
    else if (hit.id === 'prev') { V11_BESTIARY_PAGE = Math.max(0, V11_BESTIARY_PAGE - 1); sfx('click'); }
    else if (hit.id === 'next') { V11_BESTIARY_PAGE = V11_BESTIARY_PAGE + 1; sfx('click'); }

  if (st === 'storySelect') {
    const hit = storyStageRects.find(r => pointRect(mouse, r));
    if (!hit) return;
    if (hit.id === 'back' || hit.stage === 0) { state = 'title'; clearInput(); sfx('click'); return; }

  V11_LEGACY_HANDLE_DOWN(ev);

window.addEventListener('keydown', ev => {
  const code = ev.code;
  const st = state;

  if (code === 'Escape' && v11IsFullscreen()) {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    sfx('click');
    v11SetFullscreen(false);
    if (state === 'playing') {
      state = 'paused';
      shake = 0; flash = 0;
      clearInput();
      if (typeof releaseTouchControls === 'function') releaseTouchControls();
      showToast('已退出全屏 · 游戏已暂停', C.gold, 2.2);
    }
    return;
  }

  if (st === 'loading') {
    if (['Enter', 'Space', 'Escape'].includes(code)) {
      ev.preventDefault();
      ev.stopImmediatePropagation();
    }
    return;
  }
  if (st === 'offline') {
    if (code === 'Enter' || code === 'Space') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      sfx('click');
      v11BootGame();
    }
    return;
  }
  if (st === 'changelog') {
    const step = code === 'ArrowDown' ? 60 : (code === 'ArrowUp' ? -60 : 0);
    if (step) {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      v11ScrollChangelog(step);
      return;
    }
    if (code === 'Escape') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      v11CloseChangelog();
      return;
    }
    if (code === 'Home' || code === 'End') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      V11_PAGES.changelogScroll = code === 'Home' ? 0 : 999999;
      return;
    }
    return;
  }
  if (st === 'modeSelect' && code === 'Escape') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    v11ReturnFromModeSelect();
    return;
  }
  if (st === 'saveSelect' && code === 'Escape') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    if (confirmAction) { confirmAction = null; sfx('click'); }
    else if (slotMenu) { closeSlotMenu(); sfx('click'); }
    else { state = 'title'; clearInput(); sfx('click'); }
    return;
  }
  if (st === 'storySelect' && code === 'Escape') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    state = 'title'; clearInput(); sfx('click');
    return;
  }
  if (st === 'bestiary') {
    if (code === 'Escape') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      closeBestiary();
      return;
    }
    if (code === 'ArrowLeft' || code === 'ArrowRight') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      V11_BESTIARY_PAGE = Math.max(0, V11_BESTIARY_PAGE + (code === 'ArrowRight' ? 1 : -1));
      sfx('click');
      return;
    }
  }
  if (st === 'title' && code === 'Enter') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    sfx('click');
    if (!profile) {
      showToast('先新建或载入一份档案，再选模式', C.coral, 2.6);
      V11_PAGES.pendingMode = '_modes';
      v11OpenSaveSelect('start');
    } else {
      v11OpenModeSelect('home');
    }
    return;
  }
}, true);

function v11NearestEnemy(x, y, maxDist) {
  let best = null, bd = maxDist === undefined ? 1e9 : maxDist;
  for (const e of enemies) {
    if (e.dead || e.spawnTimer > 0) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd * bd) { bd = Math.sqrt(d); best = e; }
  }
  return best;
}

function v11LineHit(x1, y1, x2, y2, width, damage, opts) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  let hits = 0;
  for (const e of enemies.slice()) {
    if (e.dead || e.spawnTimer > 0) continue;
    const t = clamp(((e.x - x1) * dx + (e.y - y1) * dy) / (len * len), 0, 1);
    const px = x1 + dx * t, py = y1 + dy * t;
    if (Math.hypot(e.x - px, e.y - py) <= width + e.r * .7) {
      damageEnemy(e, damage, Object.assign({ fromX: x1, fromY: y1, kb: 60, kind: 'skill' }, opts || {}));
      hits++;
    }
  }
  return hits;
}

      const a = i * .32, r = 1.4 + i * .33;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.stroke();
    g.strokeStyle = color; g.lineWidth = 1.7;
    g.beginPath();
    for (let i = 0; i < 32; i++) {
      const a = i * .32, r = 1.4 + i * .33;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.stroke();
    circle(g, 0, 0, 2.4, C.ink, null, 0);
    drawStar(g, 9, -9, 3.2, 1.3, 4, color, C.ink, 1);
  } else if (icon === 'heavy') {
    drawPaw(g, 0, 2, 13, color, 1);
    g.strokeStyle = C.ink; g.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      g.beginPath(); g.moveTo(i * 6, -12); g.lineTo(i * 6, -6); g.stroke();
    }
    g.strokeStyle = C.cream; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-4, 5); g.lineTo(4, 5); g.stroke();
  } else if (icon === 'lava') {
    g.beginPath(); g.moveTo(-11, 10); g.lineTo(-4, -3); g.lineTo(0, 3); g.lineTo(5, -9); g.lineTo(12, 10); g.closePath();
    g.fillStyle = color; g.lineWidth = 2.4; g.stroke();
    g.fillStyle = C.gold;
    g.beginPath(); g.arc(0, 2, 3, 0, TAU); g.fill();
    g.fillStyle = withAlpha(C.cream, .8);
    g.beginPath(); g.arc(-5, -6, 2, 0, TAU); g.fill();
  } else if (icon === 'lives') {
    drawHeart(g, 0, 1, 12, color, C.ink, 2.4);
    g.strokeStyle = C.cream; g.lineWidth = 2;
    g.beginPath(); g.arc(0, -1, 5.5, .6, 5.4); g.stroke();
    drawPaw(g, 0, 0, 4.6, C.ink, .8);
  } else if (icon === 'lotus') {
    for (let i = 0; i < 5; i++) {
      g.save(); g.rotate(i * TAU / 5);
      g.beginPath(); g.moveTo(0, 2);
      g.quadraticCurveTo(-6, -5, 0, -12);
      g.quadraticCurveTo(6, -5, 0, 2); g.closePath();
      g.fillStyle = i === 0 ? C.cream : color; g.lineWidth = 1.8; g.stroke();
      g.restore();
    }
    circle(g, 0, 0, 3, C.gold, C.ink, 1.4);
  } else if (icon === 'meteor') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.6;
    drawStar(g, 3, 3, 10, 4.4, 5, color, C.ink, 2.4, -.3);
    g.strokeStyle = withAlpha(C.gold, .75); g.lineWidth = 2.4;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.moveTo(-2 - i * 3, 8 + i * 2); g.lineTo(-10 - i * 2, 12 + i * 2); g.stroke();
    }
  } else if (icon === 'pierce') {
    g.strokeStyle = C.ink; g.lineWidth = 3.4;
    g.beginPath(); g.moveTo(-12, 3); g.lineTo(7, 3); g.stroke();
    g.fillStyle = color;
    g.beginPath(); g.moveTo(12, 3); g.lineTo(4, -2); g.lineTo(4, 8); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = C.cream; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-9, -7); g.lineTo(-9, -1); g.moveTo(-6, -7); g.lineTo(-6, -1); g.stroke();
    drawStar(g, 10, -8, 3.2, 1.2, 4, color, C.ink, 1);
  } else if (icon === 'poison') {
    drawFish(g, 0, 4, 11, color, C.ink, 2.2, 0);
    g.fillStyle = withAlpha(C.ink, .8);
    g.beginPath(); g.arc(-3, 2, 1.6, 0, TAU); g.fill();
    g.strokeStyle = C.mint; g.lineWidth = 1.4;
    for (const [bx, by, r] of [[-10, -4, 2], [-6, -8, 1.5], [-12, -10, 2.4]]) {
      g.beginPath(); g.arc(bx, by, r, 0, TAU); g.stroke();
    }
  } else if (icon === 'roar') {
    drawCatHead(g, 0, 1, 9, 2, 0);
    g.strokeStyle = C.ink; g.lineWidth = 2.4;
    g.beginPath(); g.arc(0, 2, 5, .2, Math.PI - .2); g.stroke();
    g.strokeStyle = color; g.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.arc(0, 0, 8 + i * 3.4, -.9, .9); g.stroke();
      g.beginPath(); g.arc(0, 0, 8 + i * 3.4, Math.PI - .9, Math.PI + .9); g.stroke();
    }
  } else if (icon === 'roll') {
    circle(g, 0, 1, 8.5, color, C.ink, 2.4);
    drawPaw(g, 0, 1, 5, C.cream, .9);
    g.strokeStyle = withAlpha(C.ink, .8); g.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.arc(-2, 1, 10 + i * 2.4, 2.5, 5.4); g.stroke();
    }
    drawStar(g, 10, -9, 3, 1.2, 4, color, C.ink, 1);
  } else if (icon === 'snow') {
    g.strokeStyle = color; g.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * 11, Math.sin(a) * 11); g.stroke();
      g.beginPath(); g.moveTo(Math.cos(a) * 7, Math.sin(a) * 7);
      g.lineTo(Math.cos(a + .5) * 10, Math.sin(a + .5) * 10);
      g.moveTo(Math.cos(a) * 7, Math.sin(a) * 7);
      g.lineTo(Math.cos(a - .5) * 10, Math.sin(a - .5) * 10); g.stroke();
    }
    circle(g, 0, 0, 2.4, C.cream, C.ink, 1.2);
  } else if (icon === 'turret') {
    drawCatHead(g, 0, -4, 8, 1, 0);
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2;
    g.fillRect(-7, 4, 14, 4);
    g.fillRect(-9, 8, 18, 4);
    g.fillStyle = C.ink; g.fillRect(4, -6, 9, 4);
    drawStar(g, 9, -8, 2.6, 1, 4, C.gold, null, 0);
  } else if (icon === 'void') {
    const grad = g.createRadialGradient(0, 0, 2, 0, 0, 12);
    grad.addColorStop(0, '#0b0714');
    grad.addColorStop(.55, withAlpha(color, .95));
    grad.addColorStop(1, withAlpha(color, .08));
    g.fillStyle = grad; g.beginPath(); g.arc(0, 0, 12, 0, TAU); g.fill();
    g.strokeStyle = withAlpha(C.cream, .8); g.lineWidth = 1.4;
    g.beginPath(); g.arc(0, 0, 7, 0, TAU); g.stroke();
    drawStar(g, 8, -8, 3.2, 1.3, 4, C.cream, C.ink, 1);
  } else if (icon === 'star') {
    drawStar(g, 0, 0, 11, 4.6, 5, color, C.ink, 2.2);
    drawStar(g, 0, 0, 4.6, 1.8, 4, C.cream, null, 0);
    drawStar(g, 9, -8, 3.4, 1.3, 4, C.gold, C.ink, 1.2);
  } else if (icon === 'zone') {
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, 3, 11, 6.5, 0, 0, TAU); g.stroke();
    g.strokeStyle = color; g.lineWidth = 2;
    g.beginPath(); g.ellipse(0, 3, 11, 6.5, 0, 0, TAU); g.stroke();
    drawUpgradeIcon(g, 0, -3, 14, 'frost', color);
  } else {
    drawStar(g, 0, 0, 11, 4, 5, color, C.ink, 2);
  }
  g.restore();
}

const V11_LEGACY_DRAW_UPGRADE_ICON = drawUpgradeIcon;
drawUpgradeIcon = function (g, x, y, size, icon, color) {

};

/* ---------------- 技能触发 ---------------- */
function v11SpawnZone(x, y, radius, life, dps, color, opts) {
  V11_SK.zones.push(Object.assign({
    x, y, r: radius, life, max: life, dps, color,
    kind: 'zone', tick: 0, slowMul: 1, ring: 0,
  }, opts || {}));
}

function v11SpawnMeteor(x, y, radius, damage, color, opts) {
  const py = clamp(y, INNER.y + 30, INNER.bottom - 30);
  const px = clamp(x, INNER.x + 30, INNER.right - 30);
  V11_SK.meteors.push(Object.assign({
    x: px, y: py, r: radius, damage, color,
    delay: .52, t: 0, burn: false,
  }, opts || {}));
}

function v11SpawnBeam(x1, y1, x2, y2, color, width) {
  V11_SK.beams.push({ x1, y1, x2, y2, color, width: width || 5, life: .24, max: .24, jag: Math.random() * 100 });
}

function v11SpawnComboSlash(aim, range, arc, color) {
  V11_SK.slashes.push({ x: player.x, y: player.y, aim, range, arc, color, life: .2, max: .2 });
}

function v11NearbyEnemies(x, y, radius) {
  const out = [];
  for (const e of enemies) {
    if (e.dead || e.spawnTimer > 0) continue;
    if (Math.hypot(e.x - x, e.y - y) <= radius + e.r * .7) out.push(e);
  }
  return out;
}

function v11AddBees(targetCount, mobile) {
  const level = v11Lv('bee_swarm');
  while (V11_SK.bees.length < targetCount) {
    V11_SK.bees.push({
      angle: Math.random() * TAU, r: 46 + (V11_SK.bees.length % 3) * 12,
      sting: .2 + Math.random() * .4, level, x: player.x, y: player.y,
    });
  }
  while (V11_SK.bees.length > targetCount) V11_SK.bees.pop();
}

function v11AddSpirits(targetCount) {
  const level = Math.max(v11Lv('spirit_cat'), v11Lv('spirit_army'));
  while (V11_SK.spirits.length < targetCount) {
    V11_SK.spirits.push({
      angle: Math.random() * TAU, r: 34 + V11_SK.spirits.length * 10,
      x: player.x, y: player.y, cd: .5 + Math.random() * .8, level, hitT: 0,
    });
  }
  while (V11_SK.spirits.length > targetCount) V11_SK.spirits.pop();
}

function v11TriggerSkill(id, lv) {
  const p = player;
  if (!p) return;
  const def = V11_SKILL_DEFS[id];
  if (!def) return;
  if (id === 'bee_swarm') { v11AddBees(lv + 1 + (lv >= 4 ? 2 : 0)); return; }
  if (id === 'turret_cat') {
    const n = lv >= 4 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      V11_SK.turrets.push({
        x: p.x + (i === 0 ? -26 : 26), y: p.y + 18, life: 6.2, max: 6.2,
        cd: .25, level: lv, angle: -Math.PI / 2,
      });
    }
    sfx('coin');
    return;
  }
  if (id === 'spirit_cat' || id === 'spirit_army') {
    const n = lv + 1 + (lv >= 4 ? 2 : 0);
    v11AddSpirits(Math.min(7, n));
    sfx('level');
    return;
  }
  if (id === 'comet_tail') {
    const target = v11NearestEnemy(p.x, p.y, 460);
    const base = target ? Math.atan2(target.y - p.y, target.x - p.x) : p.aim;
    const n = lv >= 4 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * .16;
      addProjectile({
        x: p.x + Math.cos(a) * 30, y: p.y + Math.sin(a) * 30,
        angle: a, speed: 470, radius: 12,
        damage: p.attackDamage * (.55 + lv * .12),
        friendly: true, kind: 'fish', life: 1.35, pierce: lv >= 4 ? 5 : 3, color: def.color,
      });
    }
    for (let i = 0; i < 10; i++) addParticle({
      x: p.x + Math.cos(base) * 24, y: p.y + Math.sin(base) * 24,
      vx: Math.cos(base) * rnd(20, 90), vy: Math.sin(base) * rnd(20, 90),
      life: rnd(.12, .3), max: .3, size: rnd(2, 6), color: def.color,
      type: 'spark', rot: base, vr: 3, drag: .8,
    });
    sfx('swipe', .7);
    return;
  }
  if (id === 'meteor_paw' || id === 'meteor_shower') {
    const target = v11NearestEnemy(p.x, p.y, 520);
    const cx = target ? target.x : p.x + Math.cos(p.aim) * 120;
    const cy = target ? target.y : p.y + Math.sin(p.aim) * 120;
    const n = lv >= 4 ? (id === 'meteor_shower' ? 4 : 2) : 1;
    const radius = 58 + lv * 8;
    for (let i = 0; i < n; i++) {
      const off = (i - (n - 1) / 2) * 62;
      v11SpawnMeteor(cx + off, cy + (i % 2 ? 20 : -12), radius,
        p.attackDamage * (1.15 + lv * .22), def.color, { burn: lv >= 4 });
    }
    sfx('boss');
    return;
  }
  if (id === 'lava_burst') {
    const radius = 90 + lv * 22;
    shockwaves.push({
      x: p.x, y: p.y, radius: 22, maxRadius: radius, life: 0, max: .34,
      friendly: true, damage: p.attackDamage * (.65 + lv * .18),
      hitIds: new Set(), color: def.color,
    });
    rings.push({ x: p.x, y: p.y, r0: 20, r1: radius, life: 0, max: .34, color: withAlpha(def.color, .7), width: 8, ink: true });
    v11SpawnZone(p.x, p.y, radius * .72, 1.2, p.attackDamage * (.35 + lv * .12), def.color, { slowMul: 1 });
    for (let i = 0; i < 14; i++) addParticle({
      x: p.x + rnd(-20, 20), y: p.y + rnd(-16, 16),
      vx: rnd(-60, 60), vy: rnd(-140, -20), life: rnd(.3, .7), max: .7,
      size: rnd(3, 8), color: rndPick([def.color, C.gold, C.coral]),
      type: 'puff', rot: 0, vr: 2, gravity: -20, drag: .8,
    });
    sfx('hurt', .3);
    return;
  }
  if (id === 'blizzard') {
    const radius = 150 + lv * 20;
    const hits = v11NearbyEnemies(p.x, p.y, radius);
    for (const e of hits) {
      damageEnemy(e, p.attackDamage * (.28 + lv * .08), { noCrit: true, kind: 'frost' });
      e.slowTimer = Math.max(e.slowTimer || 0, lv >= 4 ? 2.2 : 1.1);
      e.slowMul = Math.min(e.slowMul || 1, lv >= 4 ? .3 : .5);
      if (lv >= 4) e.stunTimer = Math.max(e.stunTimer || 0, .5);
    }
    for (let i = 0; i < 26; i++) addParticle({
      x: p.x + rnd(-radius, radius), y: p.y + rnd(-radius, radius),
      vx: rnd(-30, 30), vy: rnd(40, 110), life: rnd(.25, .7), max: .7,
      size: rnd(2, 5), color: rndPick([def.color, C.white, C.blue]),
      type: 'circle', rot: 0, vr: 1, drag: .9,
    });
    rings.push({ x: p.x, y: p.y, r0: radius * .3, r1: radius, life: 0, max: .4, color: withAlpha(def.color, .45), width: 6, ink: false });
    sfx('frost');
    return;
  }
  if (id === 'chain_lightning' || id === 'thunderstorm') {
    const maxTargets = id === 'thunderstorm' ? (lv >= 4 ? 7 : 5) : (lv >= 4 ? 5 : 3);
    const targets = enemies
      .filter(e => !e.dead && e.spawnTimer <= 0 && dist(p, e) < 420)
      .sort((a, b) => dist(p, a) - dist(p, b))
      .slice(0, maxTargets);
    let fromX = p.x, fromY = p.y;
    for (const e of targets) {
      v11SpawnBeam(fromX, fromY, e.x, e.y, def.color, id === 'thunderstorm' ? 6 : 4);
      for (let i = 0; i < 8; i++) addParticle({
        x: lerp(fromX, e.x, i / 8) + rnd(-8, 8), y: lerp(fromY, e.y, i / 8) + rnd(-8, 8),
        vx: rnd(-50, 50), vy: rnd(-50, 50), life: rnd(.1, .25), max: .25,
        size: rnd(2, 5), color: def.color, type: 'spark', rot: rnd(0, TAU), vr: 5, drag: .8,
      });
      damageEnemy(e, p.attackDamage * (id === 'thunderstorm' ? (.6 + lv * .2) : (.5 + lv * .14)),
        { noChain: true, kind: 'thunder' });
      fromX = e.x; fromY = e.y;
    }
    if (targets.length && id === 'thunderstorm') {
      flash = Math.max(flash, .1);
      flashColor = def.color;
      shake = Math.max(shake, 5);
    }
    sfx('thunder');
    return;
  }
  if (id === 'fire_field') {
    v11SpawnZone(p.x, p.y, 48 + lv * 6, 2.4, p.attackDamage * (.22 + lv * .08), def.color, { kind: 'fire' });
    return;
  }
  if (id === 'thorn_aura') {
    const radius = 74 + lv * 15;
    for (const e of v11NearbyEnemies(p.x, p.y, radius)) {
      damageEnemy(e, p.attackDamage * (.1 + lv * .03), { noCrit: true, kind: 'thorn' });
      if (lv >= 4) {
        const d = Math.atan2(e.y - p.y, e.x - p.x);
        e.kx += Math.cos(d) * 90; e.ky += Math.sin(d) * 60;
      }
    }
    V11_SK.zones.push({ x: p.x, y: p.y, r: radius, life: .06, max: .06, dps: 0, color: def.color, kind: 'aura', tick: 0, slowMul: 1 });
    return;
  }
  if (id === 'freeze_zone') {
    v11SpawnZone(p.x, p.y, 104 + lv * 18, 2.8, p.attackDamage * (.06 + lv * .02), def.color, { slowMul: lv >= 4 ? .22 : .42 });
    sfx('frost');
    return;
  }
  if (id === 'ice_lotus') {
    const radius = 110 + lv * 22;
    shockwaves.push({
      x: p.x, y: p.y, radius: 24, maxRadius: radius, life: 0, max: .5,
      friendly: true, damage: p.attackDamage * (.7 + lv * .2),
      hitIds: new Set(), color: def.color,
    });
    for (const e of v11NearbyEnemies(p.x, p.y, radius)) {
      e.slowTimer = Math.max(e.slowTimer || 0, lv >= 4 ? 2.4 : 1.4);
      e.slowMul = Math.min(e.slowMul || 1, lv >= 4 ? .18 : .35);
    }
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * TAU;
      addParticle({
        x: p.x + Math.cos(a) * 24, y: p.y + Math.sin(a) * 24,
        vx: Math.cos(a) * rnd(90, 160), vy: Math.sin(a) * rnd(90, 160),
        life: rnd(.3, .6), max: .6, size: rnd(3, 7), color: rndPick([def.color, C.white]),
        type: 'star', rot: a, vr: 3, drag: .82,
      });
    }
    sfx('frost');
    return;
  }
  if (id === 'cat_tornado') {
    V11_SK.tornadoes.push({
      x: p.x, y: p.y, vx: Math.cos(p.aim) * 110, vy: Math.sin(p.aim) * 110,
      r: 70 + lv * 12, life: 2.6 + lv * .3, max: 2.9, tick: 0, level: lv, angle: 0,
    });
    sfx('swipe', 1.2);
    return;
  }
  if (id === 'coin_toss') {
    const n = lv >= 4 ? 5 : 3;
    for (let i = 0; i < n; i++) {
      const a = p.aim + (i - (n - 1) / 2) * .22;
      addProjectile({
        x: p.x + Math.cos(a) * 20, y: p.y + Math.sin(a) * 20,
        angle: a, speed: 420, radius: 9,
        damage: p.attackDamage * (.3 + lv * .1),
        friendly: true, kind: 'star', life: 1.1, pierce: 2, color: def.color,
      });
    }
    for (let i = 0; i < 6; i++) addParticle({
      x: p.x, y: p.y - 10, vx: rnd(-60, 60), vy: rnd(-130, -40),
      life: rnd(.25, .5), max: .5, size: rnd(3, 6), color: C.gold,
      type: 'star', rot: rnd(0, TAU), vr: 6, gravity: 70, drag: .8,
    });
    sfx('coin');
    return;
  }
  if (id === 'lucky_star') {
    const n = lv >= 4 ? 8 : 5;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + p.aim * .4;
      addProjectile({
        x: p.x + Math.cos(a) * 18, y: p.y + Math.sin(a) * 18,
        angle: a, speed: 360, radius: 8,
        damage: p.attackDamage * (.28 + lv * .09),
        friendly: true, kind: 'star', life: 1.0, pierce: 3, color: def.color,
      });
    }
    sfx('pickup');
    return;
  }
}

/* ---------------- 更新技能实体 ---------------- */
function v11UpdateSkillSystems(dt) {
  if (!player || !run || state !== 'playing' || !room) {
    v11UpdateSkillVisuals(dt, false);
    return;
  }
  const st = v11EnsureSkillState();
  if (!st) return;

  // 延迟动作（三连爪）
  if (V11_SK.queue.length) {
    const keep = [];
    for (const q of V11_SK.queue) {
      q.t -= dt;
      if (q.t <= 0) { try { q.fn(); } catch (e) { /* 单个技能失败不影响主循环 */ } }
      else keep.push(q);
    }
    V11_SK.queue = keep;
  }

  // 周期触发
  for (const id in V11_SKILL_DEFS) {
    const lv = v11Lv(id);
    if (!lv) continue;
    const def = V11_SKILL_DEFS[id];
    if (!def.cd) continue;
    st.timers[id] = (st.timers[id] || 0) + dt;
    const cd = def.cd * (1 - .1 * (lv - 1));
    if (st.timers[id] >= cd) {
      st.timers[id] -= cd;
      v11TriggerSkill(id, lv);
    }
  }

  // 蜂群跟随
  if (v11Lv('bee_swarm')) {
    const want = v11Lv('bee_swarm') + 1 + (v11Lv('bee_swarm') >= 4 ? 2 : 0);
    v11AddBees(want);
  }
  for (const b of V11_SK.bees) {
    b.angle += dt * 2.1;
    b.r = 44 + (v11Lv('bee_swarm') >= 4 ? 12 : 0);
    b.x = player.x + Math.cos(b.angle) * b.r;
    b.y = player.y + Math.sin(b.angle) * b.r * .8 - 8;
    b.sting -= dt;
    if (b.sting <= 0) {
      b.sting = v11Lv('bee_swarm') >= 4 ? .28 : .55;
      const target = v11NearestEnemy(b.x, b.y, 150);
      if (target) {
        damageEnemy(target, player.attackDamage * (.18 + v11Lv('bee_swarm') * .05), { kb: 30, kind: 'bee' });
        v11SpawnBeam(b.x, b.y, target.x, target.y, '#ffd84d', 2);
        sfx('hit', .25);
      }
    }
  }

  // 炮台
  for (const t of V11_SK.turrets) {
    t.life -= dt; t.cd -= dt;
    if (t.cd <= 0) {
      const target = v11NearestEnemy(t.x, t.y, 380);
      if (target) {
        const a = Math.atan2(target.y - t.y, target.x - t.x);
        t.angle = a;
        addProjectile({
          x: t.x, y: t.y, angle: a, speed: 430, radius: 8,
          damage: player.attackDamage * (.3 + t.level * .1),
          friendly: true, kind: 'star', life: 1.1, pierce: 1, color: '#9ad7ff',
        });
        t.cd = t.level >= 4 ? .28 : .52;
        sfx('swipe', .4);
      } else t.cd = .3;
    }
  }
  V11_SK.turrets = V11_SK.turrets.filter(t => t.life > 0);

  // 猫灵：环绕并周期性扑向最近敌人
  if (v11Lv('spirit_cat') || v11Lv('spirit_army')) {
    const want = Math.min(7, Math.max(v11Lv('spirit_cat'), v11Lv('spirit_army')) + 1 +
      ((v11Lv('spirit_cat') >= 4 || v11Lv('spirit_army') >= 4) ? 2 : 0));
    v11AddSpirits(want);
  }
  for (const s of V11_SK.spirits) {
    s.angle += dt * 1.4;
    s.r = 30 + (s.level >= 4 ? 14 : 0);
    s.x = lerp(s.x, player.x + Math.cos(s.angle) * s.r, .18);
    s.y = lerp(s.y, player.y + Math.sin(s.angle) * s.r * .9 - 12, .18);
    s.cd -= dt;
    if (s.cd <= 0) {
      s.cd = s.level >= 4 ? .5 : .8;
      const target = v11NearestEnemy(s.x, s.y, 190);
      if (target) {
        const a = Math.atan2(target.y - s.y, target.x - s.x);
        v11SpawnBeam(s.x, s.y, target.x, target.y, '#ffe28a', 3);
        damageEnemy(target, player.attackDamage * (.22 + s.level * .07), { kb: 40, kind: 'spirit' });
        for (let i = 0; i < 5; i++) addParticle({
          x: s.x, y: s.y, vx: Math.cos(a) * rnd(60, 130), vy: Math.sin(a) * rnd(60, 130),
          life: rnd(.15, .35), max: .35, size: rnd(2, 5), color: '#ffe28a',
          type: 'spark', rot: a, vr: 4, drag: .8,
        });
      }
    }
  }
  V11_SK.spirits = V11_SK.spirits.filter(s => s.level > 0);
  if (!v11Lv('spirit_cat') && !v11Lv('spirit_army')) V11_SK.spirits.length = 0;

  // 火场 / 冰场 / 毒雾
  for (const z of V11_SK.zones) {
    z.life -= dt;
    z.tick += dt;
    if (z.life <= 0) continue;
    if (z.kind === 'aura') continue;
    if (z.tick >= .42) {
      z.tick -= .42;
      for (const e of v11NearbyEnemies(z.x, z.y, z.r)) {
        if (z.dps > 0) damageEnemy(e, z.dps * .42, { noCrit: true, silent: true, noChain: true, kind: 'zone' });
        if (z.slowMul < 1) {
          e.slowTimer = Math.max(e.slowTimer || 0, .6);
          e.slowMul = Math.min(e.slowMul || 1, z.slowMul);
        }
      }
    }
  }
  V11_SK.zones = V11_SK.zones.filter(z => z.life > 0);

  // 流星落地
  for (const m of V11_SK.meteors) {
    m.t += dt;
  }
  const landed = V11_SK.meteors.filter(m => m.t >= m.delay);
  V11_SK.meteors = V11_SK.meteors.filter(m => m.t < m.delay);
  for (const m of landed) {
    shockwaves.push({
      x: m.x, y: m.y, radius: 12, maxRadius: m.r, life: 0, max: .34,
      friendly: true, damage: m.damage, hitIds: new Set(), color: m.color,
    });
    rings.push({ x: m.x, y: m.y, r0: 10, r1: m.r, life: 0, max: .4, color: withAlpha(m.color, .75), width: 8, ink: true });
    for (let i = 0; i < 22; i++) addParticle({
      x: m.x + rnd(-m.r * .5, m.r * .5), y: m.y + rnd(-m.r * .5, m.r * .5),
      vx: rnd(-170, 170), vy: rnd(-220, 40), life: rnd(.25, .7), max: .7,
      size: rnd(3, 9), color: rndPick([m.color, C.gold, C.coral, C.cream]),
      type: rndPick(['spark', 'star', 'puff']), rot: rnd(0, TAU), vr: rnd(-6, 6), gravity: 50, drag: .8,
    });
    if (m.burn) v11SpawnZone(m.x, m.y, m.r * .8, 1.8, m.damage * .28, '#ff6b3d', {});
    shake = Math.max(shake, 7);
    sfx('hit');
  }

  // 龙卷：吸怪 + 持续伤害
  for (const tw of V11_SK.tornadoes) {
    tw.life -= dt; tw.tick += dt; tw.angle += dt * 8;
    tw.x += tw.vx * dt; tw.y += tw.vy * dt;
    tw.x = clamp(tw.x, INNER.x + 20, INNER.right - 20);
    tw.y = clamp(tw.y, INNER.y + 20, INNER.bottom - 20);
    if (tw.tick >= .35) {
      tw.tick -= .35;
      for (const e of v11NearbyEnemies(tw.x, tw.y, tw.r)) {
        damageEnemy(e, player.attackDamage * (.12 + tw.level * .04), { noCrit: true, silent: true, noChain: true, kind: 'tornado' });
        const a = Math.atan2(tw.y - e.y, tw.x - e.x);
        e.kx += Math.cos(a) * 70; e.ky += Math.sin(a) * 50;
      }
    }
  }
  V11_SK.tornadoes = V11_SK.tornadoes.filter(tw => tw.life > 0);

  v11UpdateSkillVisuals(dt, true);

  // 经济 / 持续状态
  const aura = v11Lv('thorn_aura');
  if (aura) {
    // 气场常驻，仅保留一个用于绘制的记录
    const idx = V11_SK.zones.findIndex(z => z.kind === 'aura');
    if (idx >= 0) V11_SK.zones.splice(idx, 1);
  }
}

function v11UpdateSkillVisuals(dt, live) {
  for (const b of V11_SK.beams) b.life -= dt;
  V11_SK.beams = V11_SK.beams.filter(b => b.life > 0);
  for (const s of V11_SK.slashes) s.life -= dt;
  V11_SK.slashes = V11_SK.slashes.filter(s => s.life > 0);
}

/* ---------------- 绘制技能实体 ---------------- */
function v11DrawSkillSystems(g, t) {
  if (!player || !room) return;
  g.save();

  // 气场（绒毛气场）
  const aura = v11Lv('thorn_aura');
  if (aura) {
    const radius = 74 + aura * 15;
    g.save();
    g.globalAlpha = .2 + Math.sin(t * 5) * .05;
    g.fillStyle = withAlpha('#ffb08a', .16);
    g.beginPath(); g.arc(player.x, player.y, radius, 0, TAU); g.fill();
    g.strokeStyle = withAlpha('#ffb08a', .65); g.lineWidth = 3;
    g.beginPath(); g.arc(player.x, player.y, radius + Math.sin(t * 4) * 3, 0, TAU); g.stroke();
    g.restore();
  }

  // 地面区域：火场 / 冰场
  for (const z of V11_SK.zones) {
    if (z.kind === 'aura') continue;
    const a = clamp(z.life / z.max, 0, 1);
    g.save();
    g.globalAlpha = .1 + a * .2;
    const grad = g.createRadialGradient(z.x, z.y, 4, z.x, z.y, z.r);
    grad.addColorStop(0, withAlpha(z.color, .55));
    grad.addColorStop(.7, withAlpha(z.color, .28));
    grad.addColorStop(1, withAlpha(z.color, 0));
    g.fillStyle = grad;
    g.beginPath(); g.arc(z.x, z.y, z.r, 0, TAU); g.fill();
    g.globalAlpha = .5 + a * .3;
    g.strokeStyle = withAlpha(z.color, .7); g.lineWidth = 2;
    g.beginPath(); g.arc(z.x, z.y, z.r * (1 - .1 * Math.sin(t * 3 + z.x)), 0, TAU); g.stroke();
    if (z.kind === 'fire') {
      for (let i = 0; i < 4; i++) {
        const ang = t * 2 + i * TAU / 4;
        const px = z.x + Math.cos(ang) * z.r * .55, py = z.y + Math.sin(ang) * z.r * .4;
        g.fillStyle = withAlpha(i % 2 ? C.gold : C.coral, .55);
        g.beginPath();
        g.moveTo(px, py + 10);
        g.quadraticCurveTo(px - 6, py - 2, px, py - 12);
        g.quadraticCurveTo(px + 6, py - 2, px, py + 10);
        g.fill();
      }
    } else if (z.slowMul < .6) {
      for (let i = 0; i < 5; i++) {
        const a2 = t * .7 + i * TAU / 5;
        drawStar(g, z.x + Math.cos(a2) * z.r * .6, z.y + Math.sin(a2) * z.r * .45, 5, 2, 4, withAlpha(C.white, .7), null, 0, a2);
      }
    }
    g.restore();
  }

  // 蜂群
  for (const b of V11_SK.bees) {
    g.save(); g.translate(b.x, b.y);
    const flap = Math.sin(t * 22 + b.angle * 3) * .5;
    ellipse(g, -5, -5 + flap * 3, 5, 3.5, withAlpha(C.white, .65), C.ink, 1.2, -.5);
    ellipse(g, 5, -5 - flap * 3, 5, 3.5, withAlpha(C.white, .65), C.ink, 1.2, .5);
    ellipse(g, 0, 0, 8, 6, C.gold, C.ink, 2);
    g.strokeStyle = C.ink; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(-3, -4); g.lineTo(-3, 5); g.moveTo(2, -4); g.lineTo(2, 5); g.stroke();
    circle(g, 4, -1, 1.3, C.ink, null, 0);
    g.restore();
  }

  // 猫炮台
  for (const tur of V11_SK.turrets) {
    g.save(); g.translate(tur.x, tur.y);
    g.globalAlpha = clamp(tur.life / .5, 0, 1);
    g.save(); g.rotate(tur.angle);
    fillRound(g, 2, -4, 18, 8, 4, '#9ad7ff');
    strokeRound(g, 2, -4, 18, 8, 4, C.ink, 2);
    g.restore();
    drawCatHead(g, 0, -4, 8, 1, t);
    fillRound(g, -10, 4, 20, 5, 2, C.ink);
    fillRound(g, -13, 10, 26, 6, 3, '#7fa8c9');
    strokeRound(g, -13, 10, 26, 6, 3, C.ink, 1.6);
    g.restore();
  }

  // 猫灵
  for (const s of V11_SK.spirits) {
    g.save();
    g.globalAlpha = .68 + Math.sin(t * 4 + s.angle) * .12;
    g.translate(s.x, s.y);
    g.fillStyle = withAlpha('#ffe28a', .18);
    g.beginPath(); g.arc(0, 4, 16, 0, TAU); g.fill();
    drawCatHead(g, 0, 0, 9, 2, t);
    g.strokeStyle = withAlpha('#ffe28a', .7); g.lineWidth = 2;
    g.beginPath(); g.arc(0, 6, 12, .5, Math.PI - .5); g.stroke();
    g.restore();
  }

  // 龙卷
  for (const tw of V11_SK.tornadoes) {
    g.save(); g.translate(tw.x, tw.y);
    const a = clamp(tw.life / tw.max, 0, 1);
    g.globalAlpha = .5 + a * .4;
    g.strokeStyle = withAlpha('#ff9ddb', .75); g.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      g.beginPath();
      for (let k = 0; k < 20; k++) {
        const ang = tw.angle * .6 + i * 1.3 + k * .32;
        const rr = 6 + k * (tw.r / 20);
        const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr * .55 - k * 2.2;
        k === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
      }
      g.stroke();
    }
    g.fillStyle = withAlpha('#ff9ddb', .2);
    g.beginPath(); g.arc(0, 0, tw.r * .65, 0, TAU); g.fill();
    g.restore();
  }

  // 流星预警 + 下落
  for (const m of V11_SK.meteors) {
    const k = clamp(m.t / m.delay, 0, 1);
    g.save();
    g.globalAlpha = .28 + k * .4;
    g.strokeStyle = withAlpha(m.color, .85); g.lineWidth = 3;
    g.beginPath(); g.arc(m.x, m.y, m.r * (.5 + k * .5), 0, TAU); g.stroke();
    g.globalAlpha = .15 + k * .2;
    g.fillStyle = m.color;
    g.beginPath(); g.arc(m.x, m.y, m.r * k, 0, TAU); g.fill();
    g.globalAlpha = 1;
    const px = m.x + (1 - k) * 220;
    const py = m.y - 300 + k * 300;
    drawStar(g, px, py, 18, 8, 5, m.color, C.ink, 3, -.4);
    g.strokeStyle = withAlpha(m.color, .6); g.lineWidth = 5;
    g.beginPath(); g.moveTo(px + 18, py - 12); g.lineTo(px + 70, py - 46); g.stroke();
    g.restore();
  }

  // 闪电链
  for (const b of V11_SK.beams) {
    const a = clamp(b.life / b.max, 0, 1);
    g.save();
    g.globalAlpha = a;
    g.strokeStyle = b.color; g.lineWidth = b.width;
    g.beginPath();
    const segs = 9;
    for (let i = 0; i <= segs; i++) {
      const k = i / segs;
      const px = lerp(b.x1, b.x2, k) + (i === 0 || i === segs ? 0 : Math.sin(b.jag + i * 3.3) * 14);
      const py = lerp(b.y1, b.y2, k) + (i === 0 || i === segs ? 0 : Math.cos(b.jag + i * 2.1) * 12);
      i === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
    }
    g.stroke();
    g.strokeStyle = withAlpha(C.white, .8); g.lineWidth = Math.max(1, b.width * .35);
    g.stroke();
    g.restore();
  }

  // 连爪残影
  for (const s of V11_SK.slashes) {
    const a = clamp(s.life / s.max, 0, 1);
    g.save();
    g.globalAlpha = a * .8;
    g.strokeStyle = s.color; g.lineWidth = 7;
    g.beginPath(); g.arc(s.x, s.y, s.range, s.aim - s.arc / 2, s.aim + s.arc / 2); g.stroke();
    g.strokeStyle = withAlpha(C.white, .8); g.lineWidth = 2.4;
    g.beginPath(); g.arc(s.x, s.y, s.range + 4, s.aim - s.arc / 2, s.aim + s.arc / 2); g.stroke();
    g.restore();
  }

  g.restore();
}

const V11_LEGACY_DRAW_SCENE = drawScene;
drawScene = function (g, t) {
  V11_LEGACY_DRAW_SCENE(g, t);
  v11DrawSkillSystems(g, t);
};

/* ---------------- 攻击 / 冲刺钩子 ---------------- */
const V11_LEGACY_PERFORM_ATTACK = performAttack;
performAttack = function () {
  const p = player;
  if (!p || p.dead) { V11_LEGACY_PERFORM_ATTACK(); return; }
  const heavy = v11Lv('heavy_paw');
  const catnip = v11Lv('catnip');
  const lucky = v11Lv('lucky_cat');
  const luckyStar = v11Lv('lucky_star');
  const st = v11EnsureSkillState();
  let dmgMul = 1, critAdd = 0;
  if (heavy) { dmgMul *= (1.35 + .35 * (heavy - 1)) * (heavy >= 4 ? 2.2 : 1); }
  if (catnip) { dmgMul *= (1 + .06 * catnip); }
  if (lucky) critAdd += .04 * lucky;
  if (luckyStar) critAdd += .02 * luckyStar;

  const oldDmg = p.attackDamage;
  const oldCrit = p.critChance;
  p.attackDamage = oldDmg * dmgMul;
  p.critChance = clamp(oldCrit + critAdd, 0, .95);
  try { V11_LEGACY_PERFORM_ATTACK(); }
  finally { p.attackDamage = oldDmg; p.critChance = oldCrit; }

  if (heavy) p.attackTimer *= (1 + .13 * (heavy - 1));
  if (catnip) p.attackTimer *= (1 - .04 * catnip);
  if (st && heavy >= 4) {
    shockwaves.push({
      x: p.x, y: p.y, radius: 18, maxRadius: 120, life: 0, max: .3,
      friendly: true, damage: oldDmg * .6, hitIds: new Set(), color: '#e8a35c',
    });
    rings.push({ x: p.x, y: p.y, r0: 18, r1: 120, life: 0, max: .3, color: withAlpha('#e8a35c', .6), width: 6, ink: true });
  }

  const aim = p.swingAim;
  const combo = v11Lv('combo_paw');
  if (combo) {
    const extra = combo + (combo >= 4 ? 1 : 0);
    for (let i = 1; i <= extra; i++) {
      const omni = combo >= 4 && i === extra;
      V11_SK.queue.push({
        t: .075 * i,
        fn: () => {
          if (!player || player.dead) return;
          const dmg = oldDmg * (.55 * i) * (1 + .06 * (combo - 1));
          if (omni) {
            shockwaves.push({
              x: player.x, y: player.y, radius: 20, maxRadius: player.attackRange * .9,
              life: 0, max: .25, friendly: true, damage: dmg * 1.1,
              hitIds: new Set(), color: '#ff9f43',
            });
            rings.push({ x: player.x, y: player.y, r0: 20, r1: player.attackRange * .9, life: 0, max: .25, color: withAlpha('#ff9f43', .7), width: 7, ink: false });
          } else {
            const arc = player.attackArc * (1 + .08 * i);
            for (const e of enemies.slice()) {
              if (e.dead) continue;
              const d = dist(player, e);
              const ang = Math.atan2(e.y - player.y, e.x - player.x);
              if (d <= player.attackRange + e.r * .55 && Math.abs(angleDiff(ang, aim)) <= arc / 2) {
                damageEnemy(e, dmg, { fromX: player.x, fromY: player.y, kb: 120, kind: 'claw' });
              }
            }
            v11SpawnComboSlash(aim, player.attackRange * .92, arc, '#ff9f43');
          }
          sfx('swipe', .6);
        },
      });
    }
  }

  if (v11Lv('pierce_claw')) {
    const lv = v11Lv('pierce_claw');
    if (st) {
      st.pierce = (st.pierce || 0) + 1;
      const every = lv >= 4 ? 2 : 3;
      if (st.pierce >= every) {
        st.pierce = 0;
        const range = 430;
        const ex = p.x + Math.cos(aim) * range, ey = p.y + Math.sin(aim) * range;
        v11SpawnBeam(p.x, p.y, ex, ey, '#ffe08a', lv >= 4 ? 14 : 9);
        v11LineHit(p.x, p.y, ex, ey, lv >= 4 ? 26 : 16, oldDmg * (1.4 + lv * .35),
          { kb: 180, kind: 'pierce' });
        for (let i = 0; i < 12; i++) addParticle({
          x: p.x + Math.cos(aim) * rnd(20, 220), y: p.y + Math.sin(aim) * rnd(20, 220),
          vx: Math.cos(aim) * rnd(40, 160), vy: Math.sin(aim) * rnd(40, 160),
          life: rnd(.1, .3), max: .3, size: rnd(2, 6), color: '#ffe08a',
          type: 'spark', rot: aim, vr: 3, drag: .8,
        });
        sfx('thunder', .7);
      }
    }
  }

  if (v11Lv('poison_fish')) {
    const lv = v11Lv('poison_fish');
    for (const e of enemies.slice()) {
      if (e.dead) continue;
      const d = dist(p, e);
      const ang = Math.atan2(e.y - p.y, e.x - p.x);
      if (d <= p.attackRange + e.r * .55 && Math.abs(angleDiff(ang, aim)) <= p.attackArc / 2) {
        e.poisonTimer = Math.max(e.poisonTimer || 0, lv >= 4 ? 3.4 : 2.4);
        e.poisonDps = Math.max(e.poisonDps || 0, oldDmg * (.1 + .04 * lv) * (lv >= 4 ? 2 : 1));
        e.poisonTick = 0;
        for (let i = 0; i < 3; i++) addParticle({
          x: e.x + rnd(-10, 10), y: e.y + rnd(-12, 6),
          vx: rnd(-20, 20), vy: rnd(-60, -20), life: rnd(.2, .4), max: .4,
          size: rnd(2, 5), color: '#9de36f', type: 'circle', rot: 0, vr: 1, drag: .8,
        });
      }
    }
  }

  if (v11Lv('panic_meow')) {
    const lv = v11Lv('panic_meow');
    const radius = 100 + lv * 20;
    for (const e of v11NearbyEnemies(p.x, p.y, radius)) {
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      e.kx += Math.cos(a) * (150 + lv * 30);
      e.ky += Math.sin(a) * (90 + lv * 20);
      if (lv >= 4) e.stunTimer = Math.max(e.stunTimer || 0, .9);
    }
    rings.push({ x: p.x, y: p.y, r0: 24, r1: radius, life: 0, max: .32, color: withAlpha('#ffd45e', .5), width: 5, ink: false });
    sfx('roar');
  }

  if (v11Lv('gravity_yarn')) {
    const lv = v11Lv('gravity_yarn');
    for (const e of v11NearbyEnemies(p.x, p.y, 200)) {
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      e.x += Math.cos(a) * (12 + lv * 7);
      e.y += Math.sin(a) * (12 + lv * 7);
    }
    rings.push({ x: p.x, y: p.y, r0: 180, r1: 32, life: 0, max: .3, color: withAlpha('#c4abff', .5), width: 6, ink: false });
    sfx('gravity');
  }
};

const V11_LEGACY_TRY_DASH = tryDash;
tryDash = function () {
  const before = player ? player.dashTimer : 0;
  V11_LEGACY_TRY_DASH();
  const p = player;
  if (!p || p.dead || p.dashTimer <= 0) return;
  const blink = v11Lv('blink_step');
  if (blink) {
    p.dashTimer *= 1 + .06 * blink;
    p.dashCd = Math.max(.35, p.dashCooldown * (1 - .16 * blink));
    if (blink >= 4) {
      v11SpawnBeam(p.x, p.y, p.x + p.dashDir.x * 180, p.y + p.dashDir.y * 180, '#9be7ff', 8);

  g.beginPath(); g.moveTo(-r * .08, r * .12); g.quadraticCurveTo(0, r * .16, r * .08, r * .12); g.stroke();

  g.restore();

/* ---------- 第 5 章 · 虚空团（带洞的环形体） ---------- */

/* ---------- 第 5 章 · 镜猫（立式镜框 + 倒影猫脸） ---------- */

/* ---------- 第 5 章 · 静电球（圆球 + 放射电极 + 电弧） ---------- */
function drawStaticorb(g, e, t) {
  const r = e.r;
  const charge = e.action === 'aim' ? 1 : 0;
  // 放射电极针
  g.strokeStyle = C.ink; g.lineWidth = 2.6;
  for (let i = 0; i < 10; i++) {

    const len = r * (1.0 + (i % 2) * .22 + charge * .18);
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .82, Math.sin(a) * r * .82);

  circle(g, 0, 0, r * .84, null, C.ink, 4);

/* ---------- 第 5 章 · 幽暗之手（大手掌 + 五根手指） ---------- */
function drawGloomhand(g, e, t) {
  const r = e.r;
  const reach = e.action === 'whip' ? 1 : 0;
  const wiggle = Math.sin(t * 3.2 + e.phase) * .07;
  g.save();
  // 五根手指（张开向上）
  for (let i = 0; i < 5; i++) {
    const baseX = (i - 2) * r * .26;
    const a = (i - 2) * .3 + wiggle * (i % 2 ? 1 : -1) + reach * (i - 2) * .08;
    const len = r * (1.0 + (i === 2 ? .35 : i === 0 || i === 4 ? -.2 : 0));
    g.save(); g.translate(baseX, -r * .08); g.rotate(a);
    g.strokeStyle = C.ink; g.lineWidth = r * .2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -len); g.stroke();
    g.strokeStyle = e.color; g.lineWidth = r * .13;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -len); g.stroke();
    g.strokeStyle = withAlpha(C.cream, .5); g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(-r * .03, -r * .12); g.lineTo(-r * .03, -len * .8); g.stroke();
    g.restore();
  }
  // 手掌
  ellipse(g, 0, r * .28, r * .78, r * .58, e.color, C.ink, 4);
  // 掌心眼
  ellipse(g, 0, r * .22, r * .24, r * .18, '#0a0412', C.ink, 2.4);
  circle(g, Math.sin(t * 2) * r * .05, r * .22, r * .07, C.lavender, null, 0);
  // 掌根与雾尾
  g.strokeStyle = C.ink; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-r * .4, r * .7); g.quadraticCurveTo(-r * .6, r * 1.0, -r * .2, r * 1.12); g.stroke();
  g.beginPath(); g.moveTo(r * .4, r * .7); g.quadraticCurveTo(r * .6, r * 1.0, r * .2, r * 1.12); g.stroke();
  g.restore();
}

/* ---------- 第 5 章 · 悖论犬（滚轮式环形身体 + 双耳） ---------- */
function drawParadoxpup(g, e, t) {

/* ---------- 第 5 章 Boss · 虚空之镜（双镜面 + 中央眼 + 碎片冠） ---------- */
function drawVoidmirror(g, e, t) {
  const r = e.r;

  // 背后镜面碎片
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * .9 + i * Math.PI * .3;

    g.translate(Math.cos(a) * dist0, Math.sin(a) * dist0 * .8);

  // 左右两块斜镜面（沙漏剪影）
  for (const sx of [-1, 1]) {
    g.save();
    g.translate(sx * r * .58, 0);
    g.rotate(sx * .16);

/* ---------------- 新敌人 AI ---------------- */
function v11PlaceNear(e, min, max) {
  if (!player) return;
  const a = rnd(0, TAU);
  e.x = clamp(player.x + Math.cos(a) * rnd(min, max), INNER.x + e.r, INNER.right - e.r);
  e.y = clamp(player.y + Math.sin(a) * rnd(min, max), INNER.y + e.r, INNER.bottom - e.r);
}

function v11EnemyFuseExplode(e) {
  const rad = 78 + e.r;
  shake = Math.max(shake, 13);
  flash = Math.max(flash, .14);
  flashColor = e.type === 'snowman' ? '#dff6ff' : C.gold;
  sfx('stomp');
  sfx('explode');
  rings.push({ x: e.x, y: e.y, r0: 20, r1: rad, life: 0, max: .38, color: withAlpha(e.color, .8), width: 12, ink: true });
  shockwaves.push({
    x: e.x, y: e.y, radius: 24, maxRadius: rad, life: 0, max: .26,
    friendly: false, damage: Math.round(e.damage * 1.15), color: e.color,
  });
  addBurst(e.x, e.y, e.color, 26, 300);
  addBurst(e.x, e.y, C.cream, 12, 220);
  // 雪人爆炸后还会甩出一圈雪球，逼玩家换位。
  if (e.type === 'snowman') {
    for (let i = 0; i < 6; i++) {
      enemyShoot(e, i / 6 * TAU + rnd(0, .2), { speed: 190, radius: 9, damage: Math.round(e.damage * .5), kind: 'snow', life: 2.6 });
    }
  }
}

function updateNewEnemyAI(e, dt) {
  e.attackTimer -= dt;
  if (!player) return;
  const d = dist(e, player);
  const toP = Math.atan2(player.y - e.y, player.x - e.x);
  const ai = e.ai;
  const stunned = e.action === 'stun';
  if (stunned) {
    e.actionT -= dt;
    if (e.actionT <= 0) e.action = 'idle';
    return;
  }

  // 炸弹型：贴近后点燃引信，原地蓄力，再炸出一圈。
  if (ai === 'bomber') {
    if (e.action === 'fuse') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        e.action = 'blast';
        e.actionT = .18;
        e.attackTimer = e.type === 'snowman' ? 2.9 : 2.5;
        v11EnemyFuseExplode(e);
      }
      return;
    }
    if (e.action === 'blast') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    enemyMoveChase(e, dt, .9, .12);
    if (e.attackTimer <= 0 && d < e.r + 150) {
      e.action = 'fuse'; e.actionT = .85;
      addFloater(e.x, e.y - e.r - 14, '要炸了!', C.gold, 14);
      sfx('shoot', .6);
    }
    return;
  }

  // 瞬移型：先溶解，再出现在玩家附近。
  if (ai === 'teleporter') {
    if (e.action === 'vanish') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        addBurst(e.x, e.y, e.color, 20, 240);
        v11PlaceNear(e, 130, 210);
        rings.push({ x: e.x, y: e.y, r0: 8, r1: e.r * 2.4, life: 0, max: .35, color: withAlpha(C.lavender, .75), width: 8, ink: true });
        addBurst(e.x, e.y, C.lavender, 18, 200);
        sfx('evolve', .7);
        e.action = 'idle';
        e.attackTimer = 1.35;
      }
      return;
    }
    enemyMoveChase(e, dt, .72, .28);
    if (e.attackTimer <= 0 && d > e.r + 90) {
      e.action = 'vanish'; e.actionT = .4;
      addFloater(e.x, e.y - e.r - 12, '？', C.lavender, 15);
    }
    return;
  }

  // 狙击型：拉开距离 → 瞄准线 → 高速单发。
  if (ai === 'sniper') {
    if (e.action === 'aim') {
      e.actionT -= dt;
      e.aimAngle = toP;
      if (e.actionT <= 0) {
        enemyShoot(e, toP, { speed: 520, radius: 7, damage: Math.round(e.damage * 1.3), kind: e.projectile, life: 3.4, offset: e.r * .9 });
        e.action = 'recoil'; e.actionT = .2;
        e.attackTimer = 2.3;
        shake = Math.max(shake, 3);
        sfx('shoot', 1.2);
      }
      return;
    }
    if (e.action === 'recoil') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    let dx = 0, dy = 0;
    if (d < 330) { dx -= Math.cos(toP); dy -= Math.sin(toP); }
    else if (d > 470) { dx += Math.cos(toP); dy += Math.sin(toP); }
    dx += Math.cos(toP + e.wobbleSign * Math.PI / 2) * .7;
    dy += Math.sin(toP + e.wobbleSign * Math.PI / 2) * .7;
    const len = Math.hypot(dx, dy) || 1;
    moveWorld(e, dx / len * e.speed * enemySlowMul(e) * dt, dy / len * e.speed * enemySlowMul(e) * dt);
    if (e.attackTimer <= 0 && d < 760) { e.action = 'aim'; e.actionT = .55; }
    return;
  }

  // 滚轮型：慢速绕圈，冷却好就直线滚撞，撞墙反弹。
  if (ai === 'roller') {
    if (e.action === 'roll') {
      e.actionT -= dt;
      const sp = 640;
      const dx = Math.cos(e.chargeAngle) * sp * dt;
      const dy = Math.sin(e.chargeAngle) * sp * dt;
      const bx = moveWorld(e, dx, 0);
      const by = moveWorld(e, 0, dy);
      if (bx) { e.chargeAngle = Math.PI - e.chargeAngle; rings.push({ x: e.x, y: e.y, r0: 8, r1: e.r * 2, life: 0, max: .3, color: withAlpha(C.lavender, .6), width: 7, ink: true }); sfx('stomp', .8); }
      if (by) { e.chargeAngle = -e.chargeAngle; rings.push({ x: e.x, y: e.y, r0: 8, r1: e.r * 2, life: 0, max: .3, color: withAlpha(C.lavender, .6), width: 7, ink: true }); sfx('stomp', .8); }
      if (e.actionT <= 0) {
        e.action = 'idle';
        e.attackTimer = 1.9;
        for (let i = 0; i < 8; i++) addParticle({
          x: e.x + rnd(-e.r, e.r), y: e.y + e.r * .7,
          vx: rnd(-110, 110), vy: rnd(-50, 10), life: rnd(.15, .34), max: .34,
          size: rnd(2, 6), color: withAlpha(e.color, .6), type: 'puff', rot: 0, vr: 0, gravity: 18, drag: .8,
        });
      }
      return;
    }
    enemyMoveChase(e, dt, .55, .35);
    if (e.attackTimer <= 0 && d < 520) {
      e.action = 'roll'; e.actionT = .8;
      e.chargeAngle = toP;
      sfx('dash', .8);
    }
    return;
  }

  updateEnemyAI(e, dt);
}

      });

      }

        rings.push({ x: e.x, y: e.y, r0: 16 + i * 20, r1: 260 + i * 44, life: 0, max: .55 + i * .06, color: withAlpha('#dff6ff', .55), width: 8, ink: true });

  }

  if (e.action === 'windSummon') {
    e.actionT -= dt;
    if (e.actionT <= 0) {
      e.action = 'idle';
      e.attackTimer = e.enraged ? 2.2 : 3.2;

  if (e.action === 'roar') {

  }
  if (e.action === 'stun') {

  }
}
