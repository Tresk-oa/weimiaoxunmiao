    x: px, y: py, r: radius, damage, color,
    delay: .52, t: 0, burn: false,
  }, opts || {}));
}

function v11SpawnBeam(x1, y1, x2, y2, color, width) {
  V11_SK.beams.push({ x1, y1, x2, y2, color, width: width || 5, life: .24, max: .24, jag: Math.random() * 100 });
}

function v11SpawnComboSlash(aim, range, arc, color) {
  V11_SK.slashes.push({ x: player.x, y: player.y, aim, range, arc, color, life: .2, max: .2 });
}

function v11NearbyEnemies(x, y, radius) {
  const out = [];
  for (const e of enemies) {
    if (e.dead || e.spawnTimer > 0) continue;
    if (Math.hypot(e.x - x, e.y - y) <= radius + e.r * .7) out.push(e);
  }
  return out;
}

function v11AddBees(targetCount, mobile) {
  const level = v11Lv('bee_swarm');
  while (V11_SK.bees.length < targetCount) {
    V11_SK.bees.push({
      angle: Math.random() * TAU, r: 46 + (V11_SK.bees.length % 3) * 12,
      sting: .2 + Math.random() * .4, level, x: player.x, y: player.y,
    });
  }
  while (V11_SK.bees.length > targetCount) V11_SK.bees.pop();
}

function v11AddSpirits(targetCount) {
  const level = Math.max(v11Lv('spirit_cat'), v11Lv('spirit_army'));
  while (V11_SK.spirits.length < targetCount) {
    V11_SK.spirits.push({
      angle: Math.random() * TAU, r: 34 + V11_SK.spirits.length * 10,
      x: player.x, y: player.y, cd: .5 + Math.random() * .8, level, hitT: 0,
    });
  }
  while (V11_SK.spirits.length > targetCount) V11_SK.spirits.pop();
}

function v11TriggerSkill(id, lv) {
  const p = player;
  if (!p) return;
  const def = V11_SKILL_DEFS[id];
  if (!def) return;
  if (id === 'bee_swarm') { v11AddBees(lv + 1 + (lv >= 4 ? 2 : 0)); return; }
  if (id === 'turret_cat') {
    const n = lv >= 4 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      V11_SK.turrets.push({
        x: p.x + (i === 0 ? -26 : 26), y: p.y + 18, life: 6.2, max: 6.2,
        cd: .25, level: lv, angle: -Math.PI / 2,
      });
    }
    sfx('coin');
    return;
  }
  if (id === 'spirit_cat' || id === 'spirit_army') {
    const n = lv + 1 + (lv >= 4 ? 2 : 0);
    v11AddSpirits(Math.min(7, n));
    sfx('level');
    return;
  }
  if (id === 'comet_tail') {
    const target = v11NearestEnemy(p.x, p.y, 460);
    const base = target ? Math.atan2(target.y - p.y, target.x - p.x) : p.aim;
    const n = lv >= 4 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * .16;
      addProjectile({
        x: p.x + Math.cos(a) * 30, y: p.y + Math.sin(a) * 30,
        angle: a, speed: 470, radius: 12,
        damage: p.attackDamage * (.55 + lv * .12),
        friendly: true, kind: 'fish', life: 1.35, pierce: lv >= 4 ? 5 : 3, color: def.color,
      });
    }
    for (let i = 0; i < 10; i++) addParticle({
      x: p.x + Math.cos(base) * 24, y: p.y + Math.sin(base) * 24,
      vx: Math.cos(base) * rnd(20, 90), vy: Math.sin(base) * rnd(20, 90),
      life: rnd(.12, .3), max: .3, size: rnd(2, 6), color: def.color,
      type: 'spark', rot: base, vr: 3, drag: .8,
    });
    sfx('swipe', .7);
    return;
  }
  if (id === 'meteor_paw' || id === 'meteor_shower') {
    const target = v11NearestEnemy(p.x, p.y, 520);
    const cx = target ? target.x : p.x + Math.cos(p.aim) * 120;
    const cy = target ? target.y : p.y + Math.sin(p.aim) * 120;
    const n = lv >= 4 ? (id === 'meteor_shower' ? 4 : 2) : 1;
    const radius = 58 + lv * 8;
    for (let i = 0; i < n; i++) {
      const off = (i - (n - 1) / 2) * 62;
      v11SpawnMeteor(cx + off, cy + (i % 2 ? 20 : -12), radius,
        p.attackDamage * (1.15 + lv * .22), def.color, { burn: lv >= 4 });
    }
    sfx('boss');
    return;
  }
  if (id === 'lava_burst') {
    const radius = 90 + lv * 22;
    shockwaves.push({
      x: p.x, y: p.y, radius: 22, maxRadius: radius, life: 0, max: .34,
      friendly: true, damage: p.attackDamage * (.65 + lv * .18),
      hitIds: new Set(), color: def.color,
    });
    rings.push({ x: p.x, y: p.y, r0: 20, r1: radius, life: 0, max: .34, color: withAlpha(def.color, .7), width: 8, ink: true });
    v11SpawnZone(p.x, p.y, radius * .72, 1.2, p.attackDamage * (.35 + lv * .12), def.color, { slowMul: 1 });
    for (let i = 0; i < 14; i++) addParticle({
      x: p.x + rnd(-20, 20), y: p.y + rnd(-16, 16),
      vx: rnd(-60, 60), vy: rnd(-140, -20), life: rnd(.3, .7), max: .7,
      size: rnd(3, 8), color: rndPick([def.color, C.gold, C.coral]),
      type: 'puff', rot: 0, vr: 2, gravity: -20, drag: .8,
    });
    sfx('hurt', .3);
    return;
  }
  if (id === 'blizzard') {
    const radius = 150 + lv * 20;
    const hits = v11NearbyEnemies(p.x, p.y, radius);
    for (const e of hits) {
      damageEnemy(e, p.attackDamage * (.28 + lv * .08), { noCrit: true, kind: 'frost' });
      e.slowTimer = Math.max(e.slowTimer || 0, lv >= 4 ? 2.2 : 1.1);
      e.slowMul = Math.min(e.slowMul || 1, lv >= 4 ? .3 : .5);
      if (lv >= 4) e.stunTimer = Math.max(e.stunTimer || 0, .5);
    }
    for (let i = 0; i < 26; i++) addParticle({
      x: p.x + rnd(-radius, radius), y: p.y + rnd(-radius, radius),
      vx: rnd(-30, 30), vy: rnd(40, 110), life: rnd(.25, .7), max: .7,
      size: rnd(2, 5), color: rndPick([def.color, C.white, C.blue]),
      type: 'circle', rot: 0, vr: 1, drag: .9,
    });
    rings.push({ x: p.x, y: p.y, r0: radius * .3, r1: radius, life: 0, max: .4, color: withAlpha(def.color, .45), width: 6, ink: false });
    sfx('frost');
    return;
  }
  if (id === 'chain_lightning' || id === 'thunderstorm') {
    const maxTargets = id === 'thunderstorm' ? (lv >= 4 ? 7 : 5) : (lv >= 4 ? 5 : 3);
    const targets = enemies
      .filter(e => !e.dead && e.spawnTimer <= 0 && dist(p, e) < 420)
      .sort((a, b) => dist(p, a) - dist(p, b))
      .slice(0, maxTargets);
    let fromX = p.x, fromY = p.y;
    for (const e of targets) {
      v11SpawnBeam(fromX, fromY, e.x, e.y, def.color, id === 'thunderstorm' ? 6 : 4);
      for (let i = 0; i < 8; i++) addParticle({
        x: lerp(fromX, e.x, i / 8) + rnd(-8, 8), y: lerp(fromY, e.y, i / 8) + rnd(-8, 8),
        vx: rnd(-50, 50), vy: rnd(-50, 50), life: rnd(.1, .25), max: .25,
        size: rnd(2, 5), color: def.color, type: 'spark', rot: rnd(0, TAU), vr: 5, drag: .8,
      });
      damageEnemy(e, p.attackDamage * (id === 'thunderstorm' ? (.6 + lv * .2) : (.5 + lv * .14)),
        { noChain: true, kind: 'thunder' });
      fromX = e.x; fromY = e.y;
    }
    if (targets.length && id === 'thunderstorm') {
      flash = Math.max(flash, .1);
      flashColor = def.color;
      shake = Math.max(shake, 5);
    }
    sfx('thunder');
    return;
  }
  if (id === 'fire_field') {
    v11SpawnZone(p.x, p.y, 48 + lv * 6, 2.4, p.attackDamage * (.22 + lv * .08), def.color, { kind: 'fire' });
    return;
  }
  if (id === 'thorn_aura') {
    const radius = 74 + lv * 15;
    for (const e of v11NearbyEnemies(p.x, p.y, radius)) {
      damageEnemy(e, p.attackDamage * (.1 + lv * .03), { noCrit: true, kind: 'thorn' });
      if (lv >= 4) {
        const d = Math.atan2(e.y - p.y, e.x - p.x);
        e.kx += Math.cos(d) * 90; e.ky += Math.sin(d) * 60;
      }
    }
    V11_SK.zones.push({ x: p.x, y: p.y, r: radius, life: .06, max: .06, dps: 0, color: def.color, kind: 'aura', tick: 0, slowMul: 1 });
    return;
  }
  if (id === 'freeze_zone') {
    v11SpawnZone(p.x, p.y, 104 + lv * 18, 2.8, p.attackDamage * (.06 + lv * .02), def.color, { slowMul: lv >= 4 ? .22 : .42 });
    sfx('frost');
    return;
  }
  if (id === 'ice_lotus') {
    const radius = 110 + lv * 22;
    shockwaves.push({
      x: p.x, y: p.y, radius: 24, maxRadius: radius, life: 0, max: .5,
      friendly: true, damage: p.attackDamage * (.7 + lv * .2),
      hitIds: new Set(), color: def.color,
    });
    for (const e of v11NearbyEnemies(p.x, p.y, radius)) {
      e.slowTimer = Math.max(e.slowTimer || 0, lv >= 4 ? 2.4 : 1.4);
      e.slowMul = Math.min(e.slowMul || 1, lv >= 4 ? .18 : .35);
    }
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * TAU;
      addParticle({
        x: p.x + Math.cos(a) * 24, y: p.y + Math.sin(a) * 24,
        vx: Math.cos(a) * rnd(90, 160), vy: Math.sin(a) * rnd(90, 160),
        life: rnd(.3, .6), max: .6, size: rnd(3, 7), color: rndPick([def.color, C.white]),
        type: 'star', rot: a, vr: 3, drag: .82,
      });
    }
    sfx('frost');
    return;
  }
  if (id === 'cat_tornado') {
    V11_SK.tornadoes.push({
      x: p.x, y: p.y, vx: Math.cos(p.aim) * 110, vy: Math.sin(p.aim) * 110,
      r: 70 + lv * 12, life: 2.6 + lv * .3, max: 2.9, tick: 0, level: lv, angle: 0,
    });
    sfx('swipe', 1.2);
    return;
  }
  if (id === 'coin_toss') {
    const n = lv >= 4 ? 5 : 3;
    for (let i = 0; i < n; i++) {
      const a = p.aim + (i - (n - 1) / 2) * .22;
      addProjectile({
        x: p.x + Math.cos(a) * 20, y: p.y + Math.sin(a) * 20,
        angle: a, speed: 420, radius: 9,
        damage: p.attackDamage * (.3 + lv * .1),
        friendly: true, kind: 'star', life: 1.1, pierce: 2, color: def.color,
      });
    }
    for (let i = 0; i < 6; i++) addParticle({
      x: p.x, y: p.y - 10, vx: rnd(-60, 60), vy: rnd(-130, -40),
      life: rnd(.25, .5), max: .5, size: rnd(3, 6), color: C.gold,
      type: 'star', rot: rnd(0, TAU), vr: 6, gravity: 70, drag: .8,
    });
    sfx('coin');
    return;
  }
  if (id === 'lucky_star') {
    const n = lv >= 4 ? 8 : 5;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + p.aim * .4;
      addProjectile({
        x: p.x + Math.cos(a) * 18, y: p.y + Math.sin(a) * 18,
        angle: a, speed: 360, radius: 8,
        damage: p.attackDamage * (.28 + lv * .09),
        friendly: true, kind: 'star', life: 1.0, pierce: 3, color: def.color,
      });
    }
    sfx('pickup');
    return;
  }
}

/* ---------------- 更新技能实体 ---------------- */
function v11UpdateSkillSystems(dt) {
  if (!player || !run || state !== 'playing' || !room) {
    v11UpdateSkillVisuals(dt, false);
    return;
  }
  const st = v11EnsureSkillState();
  if (!st) return;

  // 延迟动作（三连爪）
  if (V11_SK.queue.length) {
    const keep = [];
    for (const q of V11_SK.queue) {
      q.t -= dt;
      if (q.t <= 0) { try { q.fn(); } catch (e) { /* 单个技能失败不影响主循环 */ } }
      else keep.push(q);
    }
    V11_SK.queue = keep;
  }

  // 周期触发
  for (const id in V11_SKILL_DEFS) {
    const lv = v11Lv(id);
    if (!lv) continue;
    const def = V11_SKILL_DEFS[id];
    if (!def.cd) continue;
    st.timers[id] = (st.timers[id] || 0) + dt;
    const cd = def.cd * (1 - .1 * (lv - 1));
    if (st.timers[id] >= cd) {
      st.timers[id] -= cd;
      v11TriggerSkill(id, lv);
    }
  }

  // 蜂群跟随
  if (v11Lv('bee_swarm')) {
    const want = v11Lv('bee_swarm') + 1 + (v11Lv('bee_swarm') >= 4 ? 2 : 0);
    v11AddBees(want);
  }
  for (const b of V11_SK.bees) {
    b.angle += dt * 2.1;
    b.r = 44 + (v11Lv('bee_swarm') >= 4 ? 12 : 0);
    b.x = player.x + Math.cos(b.angle) * b.r;
    b.y = player.y + Math.sin(b.angle) * b.r * .8 - 8;
    b.sting -= dt;
    if (b.sting <= 0) {
      b.sting = v11Lv('bee_swarm') >= 4 ? .28 : .55;
      const target = v11NearestEnemy(b.x, b.y, 150);
      if (target) {
        damageEnemy(target, player.attackDamage * (.18 + v11Lv('bee_swarm') * .05), { kb: 30, kind: 'bee' });
        v11SpawnBeam(b.x, b.y, target.x, target.y, '#ffd84d', 2);
        sfx('hit', .25);
      }
    }
  }

  // 炮台
  for (const t of V11_SK.turrets) {
    t.life -= dt; t.cd -= dt;
    if (t.cd <= 0) {
      const target = v11NearestEnemy(t.x, t.y, 380);
      if (target) {
        const a = Math.atan2(target.y - t.y, target.x - t.x);
        t.angle = a;
        addProjectile({
          x: t.x, y: t.y, angle: a, speed: 430, radius: 8,
          damage: player.attackDamage * (.3 + t.level * .1),
          friendly: true, kind: 'star', life: 1.1, pierce: 1, color: '#9ad7ff',
        });
        t.cd = t.level >= 4 ? .28 : .52;
        sfx('swipe', .4);
      } else t.cd = .3;
    }
  }
  V11_SK.turrets = V11_SK.turrets.filter(t => t.life > 0);

  // 猫灵：环绕并周期性扑向最近敌人
  if (v11Lv('spirit_cat') || v11Lv('spirit_army')) {
    const want = Math.min(7, Math.max(v11Lv('spirit_cat'), v11Lv('spirit_army')) + 1 +
      ((v11Lv('spirit_cat') >= 4 || v11Lv('spirit_army') >= 4) ? 2 : 0));
    v11AddSpirits(want);
  }
  for (const s of V11_SK.spirits) {
    s.angle += dt * 1.4;
    s.r = 30 + (s.level >= 4 ? 14 : 0);
    s.x = lerp(s.x, player.x + Math.cos(s.angle) * s.r, .18);
    s.y = lerp(s.y, player.y + Math.sin(s.angle) * s.r * .9 - 12, .18);
    s.cd -= dt;
    if (s.cd <= 0) {
      s.cd = s.level >= 4 ? .5 : .8;
      const target = v11NearestEnemy(s.x, s.y, 190);
      if (target) {
        const a = Math.atan2(target.y - s.y, target.x - s.x);
        v11SpawnBeam(s.x, s.y, target.x, target.y, '#ffe28a', 3);
        damageEnemy(target, player.attackDamage * (.22 + s.level * .07), { kb: 40, kind: 'spirit' });
        for (let i = 0; i < 5; i++) addParticle({
          x: s.x, y: s.y, vx: Math.cos(a) * rnd(60, 130), vy: Math.sin(a) * rnd(60, 130),
          life: rnd(.15, .35), max: .35, size: rnd(2, 5), color: '#ffe28a',
          type: 'spark', rot: a, vr: 4, drag: .8,
        });
      }
    }
  }
  V11_SK.spirits = V11_SK.spirits.filter(s => s.level > 0);
  if (!v11Lv('spirit_cat') && !v11Lv('spirit_army')) V11_SK.spirits.length = 0;

  // 火场 / 冰场 / 毒雾
  for (const z of V11_SK.zones) {
    z.life -= dt;
    z.tick += dt;
    if (z.life <= 0) continue;
    if (z.kind === 'aura') continue;
    if (z.tick >= .42) {
      z.tick -= .42;
      for (const e of v11NearbyEnemies(z.x, z.y, z.r)) {
        if (z.dps > 0) damageEnemy(e, z.dps * .42, { noCrit: true, silent: true, noChain: true, kind: 'zone' });
        if (z.slowMul < 1) {
          e.slowTimer = Math.max(e.slowTimer || 0, .6);
          e.slowMul = Math.min(e.slowMul || 1, z.slowMul);
        }
      }
    }
  }
  V11_SK.zones = V11_SK.zones.filter(z => z.life > 0);

  // 流星落地
  for (const m of V11_SK.meteors) {
    m.t += dt;
  }
  const landed = V11_SK.meteors.filter(m => m.t >= m.delay);
  V11_SK.meteors = V11_SK.meteors.filter(m => m.t < m.delay);
  for (const m of landed) {
    shockwaves.push({
      x: m.x, y: m.y, radius: 12, maxRadius: m.r, life: 0, max: .34,
      friendly: true, damage: m.damage, hitIds: new Set(), color: m.color,
    });
    rings.push({ x: m.x, y: m.y, r0: 10, r1: m.r, life: 0, max: .4, color: withAlpha(m.color, .75), width: 8, ink: true });
    for (let i = 0; i < 22; i++) addParticle({
      x: m.x + rnd(-m.r * .5, m.r * .5), y: m.y + rnd(-m.r * .5, m.r * .5),
      vx: rnd(-170, 170), vy: rnd(-220, 40), life: rnd(.25, .7), max: .7,
      size: rnd(3, 9), color: rndPick([m.color, C.gold, C.coral, C.cream]),
      type: rndPick(['spark', 'star', 'puff']), rot: rnd(0, TAU), vr: rnd(-6, 6), gravity: 50, drag: .8,
    });
    if (m.burn) v11SpawnZone(m.x, m.y, m.r * .8, 1.8, m.damage * .28, '#ff6b3d', {});
    shake = Math.max(shake, 7);
    sfx('hit');
  }

  // 龙卷：吸怪 + 持续伤害
  for (const tw of V11_SK.tornadoes) {
    tw.life -= dt; tw.tick += dt; tw.angle += dt * 8;
    tw.x += tw.vx * dt; tw.y += tw.vy * dt;
    tw.x = clamp(tw.x, INNER.x + 20, INNER.right - 20);
    tw.y = clamp(tw.y, INNER.y + 20, INNER.bottom - 20);
    if (tw.tick >= .35) {
      tw.tick -= .35;
      for (const e of v11NearbyEnemies(tw.x, tw.y, tw.r)) {
        damageEnemy(e, player.attackDamage * (.12 + tw.level * .04), { noCrit: true, silent: true, noChain: true, kind: 'tornado' });
        const a = Math.atan2(tw.y - e.y, tw.x - e.x);
        e.kx += Math.cos(a) * 70; e.ky += Math.sin(a) * 50;
      }
    }
  }
  V11_SK.tornadoes = V11_SK.tornadoes.filter(tw => tw.life > 0);

  v11UpdateSkillVisuals(dt, true);

  // 经济 / 持续状态
  const aura = v11Lv('thorn_aura');
  if (aura) {
    // 气场常驻，仅保留一个用于绘制的记录
    const idx = V11_SK.zones.findIndex(z => z.kind === 'aura');
    if (idx >= 0) V11_SK.zones.splice(idx, 1);
  }
}

function v11UpdateSkillVisuals(dt, live) {
  for (const b of V11_SK.beams) b.life -= dt;
  V11_SK.beams = V11_SK.beams.filter(b => b.life > 0);
  for (const s of V11_SK.slashes) s.life -= dt;
  V11_SK.slashes = V11_SK.slashes.filter(s => s.life > 0);
}

/* ---------------- 绘制技能实体 ---------------- */
function v11DrawSkillSystems(g, t) {
  if (!player || !room) return;
  g.save();

  // 气场（绒毛气场）
  const aura = v11Lv('thorn_aura');
  if (aura) {
    const radius = 74 + aura * 15;
    g.save();
    g.globalAlpha = .2 + Math.sin(t * 5) * .05;
    g.fillStyle = withAlpha('#ffb08a', .16);
    g.beginPath(); g.arc(player.x, player.y, radius, 0, TAU); g.fill();
    g.strokeStyle = withAlpha('#ffb08a', .65); g.lineWidth = 3;
    g.beginPath(); g.arc(player.x, player.y, radius + Math.sin(t * 4) * 3, 0, TAU); g.stroke();
    g.restore();
  }

  // 地面区域：火场 / 冰场
  for (const z of V11_SK.zones) {
    if (z.kind === 'aura') continue;
    const a = clamp(z.life / z.max, 0, 1);
    g.save();
    g.globalAlpha = .1 + a * .2;
    const grad = g.createRadialGradient(z.x, z.y, 4, z.x, z.y, z.r);
    grad.addColorStop(0, withAlpha(z.color, .55));
    grad.addColorStop(.7, withAlpha(z.color, .28));
    grad.addColorStop(1, withAlpha(z.color, 0));
    g.fillStyle = grad;
    g.beginPath(); g.arc(z.x, z.y, z.r, 0, TAU); g.fill();
    g.globalAlpha = .5 + a * .3;
    g.strokeStyle = withAlpha(z.color, .7); g.lineWidth = 2;
    g.beginPath(); g.arc(z.x, z.y, z.r * (1 - .1 * Math.sin(t * 3 + z.x)), 0, TAU); g.stroke();
    if (z.kind === 'fire') {
      for (let i = 0; i < 4; i++) {
        const ang = t * 2 + i * TAU / 4;
        const px = z.x + Math.cos(ang) * z.r * .55, py = z.y + Math.sin(ang) * z.r * .4;
        g.fillStyle = withAlpha(i % 2 ? C.gold : C.coral, .55);
        g.beginPath();
        g.moveTo(px, py + 10);
        g.quadraticCurveTo(px - 6, py - 2, px, py - 12);
        g.quadraticCurveTo(px + 6, py - 2, px, py + 10);
        g.fill();
      }
    } else if (z.slowMul < .6) {
      for (let i = 0; i < 5; i++) {
        const a2 = t * .7 + i * TAU / 5;
        drawStar(g, z.x + Math.cos(a2) * z.r * .6, z.y + Math.sin(a2) * z.r * .45, 5, 2, 4, withAlpha(C.white, .7), null, 0, a2);
      }
    }
    g.restore();
  }

  // 蜂群
  for (const b of V11_SK.bees) {
    g.save(); g.translate(b.x, b.y);
    const flap = Math.sin(t * 22 + b.angle * 3) * .5;
    ellipse(g, -5, -5 + flap * 3, 5, 3.5, withAlpha(C.white, .65), C.ink, 1.2, -.5);
    ellipse(g, 5, -5 - flap * 3, 5, 3.5, withAlpha(C.white, .65), C.ink, 1.2, .5);
    ellipse(g, 0, 0, 8, 6, C.gold, C.ink, 2);
    g.strokeStyle = C.ink; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(-3, -4); g.lineTo(-3, 5); g.moveTo(2, -4); g.lineTo(2, 5); g.stroke();
    circle(g, 4, -1, 1.3, C.ink, null, 0);
    g.restore();
  }

  // 猫炮台
  for (const tur of V11_SK.turrets) {
    g.save(); g.translate(tur.x, tur.y);
    g.globalAlpha = clamp(tur.life / .5, 0, 1);
    g.save(); g.rotate(tur.angle);
    fillRound(g, 2, -4, 18, 8, 4, '#9ad7ff');
    strokeRound(g, 2, -4, 18, 8, 4, C.ink, 2);
    g.restore();
    drawCatHead(g, 0, -4, 8, 1, t);
    fillRound(g, -10, 4, 20, 5, 2, C.ink);
    fillRound(g, -13, 10, 26, 6, 3, '#7fa8c9');
    strokeRound(g, -13, 10, 26, 6, 3, C.ink, 1.6);
    g.restore();
  }

  // 猫灵
  for (const s of V11_SK.spirits) {
    g.save();
    g.globalAlpha = .68 + Math.sin(t * 4 + s.angle) * .12;
    g.translate(s.x, s.y);
    g.fillStyle = withAlpha('#ffe28a', .18);
    g.beginPath(); g.arc(0, 4, 16, 0, TAU); g.fill();
    drawCatHead(g, 0, 0, 9, 2, t);
    g.strokeStyle = withAlpha('#ffe28a', .7); g.lineWidth = 2;
    g.beginPath(); g.arc(0, 6, 12, .5, Math.PI - .5); g.stroke();
    g.restore();
  }

  // 龙卷
  for (const tw of V11_SK.tornadoes) {
    g.save(); g.translate(tw.x, tw.y);
    const a = clamp(tw.life / tw.max, 0, 1);
    g.globalAlpha = .5 + a * .4;
    g.strokeStyle = withAlpha('#ff9ddb', .75); g.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      g.beginPath();
      for (let k = 0; k < 20; k++) {
        const ang = tw.angle * .6 + i * 1.3 + k * .32;
        const rr = 6 + k * (tw.r / 20);
        const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr * .55 - k * 2.2;
        k === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
      }
      g.stroke();
    }
    g.fillStyle = withAlpha('#ff9ddb', .2);
    g.beginPath(); g.arc(0, 0, tw.r * .65, 0, TAU); g.fill();
    g.restore();
  }

  // 流星预警 + 下落
  for (const m of V11_SK.meteors) {
    const k = clamp(m.t / m.delay, 0, 1);
    g.save();
    g.globalAlpha = .28 + k * .4;
    g.strokeStyle = withAlpha(m.color, .85); g.lineWidth = 3;
    g.beginPath(); g.arc(m.x, m.y, m.r * (.5 + k * .5), 0, TAU); g.stroke();
    g.globalAlpha = .15 + k * .2;
    g.fillStyle = m.color;
    g.beginPath(); g.arc(m.x, m.y, m.r * k, 0, TAU); g.fill();
    g.globalAlpha = 1;
    const px = m.x + (1 - k) * 220;
    const py = m.y - 300 + k * 300;
    drawStar(g, px, py, 18, 8, 5, m.color, C.ink, 3, -.4);
    g.strokeStyle = withAlpha(m.color, .6); g.lineWidth = 5;
    g.beginPath(); g.moveTo(px + 18, py - 12); g.lineTo(px + 70, py - 46); g.stroke();
    g.restore();
  }

  // 闪电链
  for (const b of V11_SK.beams) {
    const a = clamp(b.life / b.max, 0, 1);
    g.save();
    g.globalAlpha = a;
    g.strokeStyle = b.color; g.lineWidth = b.width;
    g.beginPath();
    const segs = 9;
    for (let i = 0; i <= segs; i++) {
      const k = i / segs;
      const px = lerp(b.x1, b.x2, k) + (i === 0 || i === segs ? 0 : Math.sin(b.jag + i * 3.3) * 14);
      const py = lerp(b.y1, b.y2, k) + (i === 0 || i === segs ? 0 : Math.cos(b.jag + i * 2.1) * 12);
      i === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
    }
    g.stroke();
    g.strokeStyle = withAlpha(C.white, .8); g.lineWidth = Math.max(1, b.width * .35);
    g.stroke();
    g.restore();
  }

  // 连爪残影
  for (const s of V11_SK.slashes) {
    const a = clamp(s.life / s.max, 0, 1);
    g.save();
    g.globalAlpha = a * .8;
    g.strokeStyle = s.color; g.lineWidth = 7;
    g.beginPath(); g.arc(s.x, s.y, s.range, s.aim - s.arc / 2, s.aim + s.arc / 2); g.stroke();
    g.strokeStyle = withAlpha(C.white, .8); g.lineWidth = 2.4;
    g.beginPath(); g.arc(s.x, s.y, s.range + 4, s.aim - s.arc / 2, s.aim + s.arc / 2); g.stroke();
    g.restore();
  }

  g.restore();
}

const V11_LEGACY_PERFORM_ATTACK = performAttack;
performAttack = function () {
  const p = player;
  if (!p || p.dead) { V11_LEGACY_PERFORM_ATTACK(); return; }
  const heavy = v11Lv('heavy_paw');
  const catnip = v11Lv('catnip');
  const lucky = v11Lv('lucky_cat');
  const luckyStar = v11Lv('lucky_star');
  const st = v11EnsureSkillState();
  let dmgMul = 1, critAdd = 0;
  if (heavy) { dmgMul *= (1.35 + .35 * (heavy - 1)) * (heavy >= 4 ? 2.2 : 1); }
  if (catnip) { dmgMul *= (1 + .06 * catnip); }
  if (lucky) critAdd += .04 * lucky;
  if (luckyStar) critAdd += .02 * luckyStar;

  const oldDmg = p.attackDamage;
  const oldCrit = p.critChance;
  p.attackDamage = oldDmg * dmgMul;
  p.critChance = clamp(oldCrit + critAdd, 0, .95);
  try { V11_LEGACY_PERFORM_ATTACK(); }
  finally { p.attackDamage = oldDmg; p.critChance = oldCrit; }

  if (heavy) p.attackTimer *= (1 + .13 * (heavy - 1));
  if (catnip) p.attackTimer *= (1 - .04 * catnip);
  if (st && heavy >= 4) {
    shockwaves.push({
      x: p.x, y: p.y, radius: 18, maxRadius: 120, life: 0, max: .3,
      friendly: true, damage: oldDmg * .6, hitIds: new Set(), color: '#e8a35c',
    });
    rings.push({ x: p.x, y: p.y, r0: 18, r1: 120, life: 0, max: .3, color: withAlpha('#e8a35c', .6), width: 6, ink: true });
  }

  const aim = p.swingAim;
  const combo = v11Lv('combo_paw');
  if (combo) {
    const extra = combo + (combo >= 4 ? 1 : 0);
    for (let i = 1; i <= extra; i++) {
      const omni = combo >= 4 && i === extra;
      V11_SK.queue.push({
        t: .075 * i,
        fn: () => {
          if (!player || player.dead) return;
          const dmg = oldDmg * (.55 * i) * (1 + .06 * (combo - 1));
          if (omni) {
            shockwaves.push({
              x: player.x, y: player.y, radius: 20, maxRadius: player.attackRange * .9,
              life: 0, max: .25, friendly: true, damage: dmg * 1.1,
              hitIds: new Set(), color: '#ff9f43',
            });
            rings.push({ x: player.x, y: player.y, r0: 20, r1: player.attackRange * .9, life: 0, max: .25, color: withAlpha('#ff9f43', .7), width: 7, ink: false });
          } else {
            const arc = player.attackArc * (1 + .08 * i);
            for (const e of enemies.slice()) {
              if (e.dead) continue;
              const d = dist(player, e);
              const ang = Math.atan2(e.y - player.y, e.x - player.x);
              if (d <= player.attackRange + e.r * .55 && Math.abs(angleDiff(ang, aim)) <= arc / 2) {
                damageEnemy(e, dmg, { fromX: player.x, fromY: player.y, kb: 120, kind: 'claw' });
              }
            }
            v11SpawnComboSlash(aim, player.attackRange * .92, arc, '#ff9f43');
          }
          sfx('swipe', .6);
        },
      });
    }
  }

  if (v11Lv('pierce_claw')) {
    const lv = v11Lv('pierce_claw');
    if (st) {
      st.pierce = (st.pierce || 0) + 1;
      const every = lv >= 4 ? 2 : 3;
      if (st.pierce >= every) {
        st.pierce = 0;
        const range = 430;
        const ex = p.x + Math.cos(aim) * range, ey = p.y + Math.sin(aim) * range;
        v11SpawnBeam(p.x, p.y, ex, ey, '#ffe08a', lv >= 4 ? 14 : 9);
        v11LineHit(p.x, p.y, ex, ey, lv >= 4 ? 26 : 16, oldDmg * (1.4 + lv * .35),
          { kb: 180, kind: 'pierce' });
        for (let i = 0; i < 12; i++) addParticle({
          x: p.x + Math.cos(aim) * rnd(20, 220), y: p.y + Math.sin(aim) * rnd(20, 220),
          vx: Math.cos(aim) * rnd(40, 160), vy: Math.sin(aim) * rnd(40, 160),
          life: rnd(.1, .3), max: .3, size: rnd(2, 6), color: '#ffe08a',
          type: 'spark', rot: aim, vr: 3, drag: .8,
        });
        sfx('thunder', .7);
      }
    }
  }

  if (v11Lv('poison_fish')) {
    const lv = v11Lv('poison_fish');
    for (const e of enemies.slice()) {
      if (e.dead) continue;
      const d = dist(p, e);
      const ang = Math.atan2(e.y - p.y, e.x - p.x);
      if (d <= p.attackRange + e.r * .55 && Math.abs(angleDiff(ang, aim)) <= p.attackArc / 2) {
        e.poisonTimer = Math.max(e.poisonTimer || 0, lv >= 4 ? 3.4 : 2.4);
        e.poisonDps = Math.max(e.poisonDps || 0, oldDmg * (.1 + .04 * lv) * (lv >= 4 ? 2 : 1));
        e.poisonTick = 0;
        for (let i = 0; i < 3; i++) addParticle({
          x: e.x + rnd(-10, 10), y: e.y + rnd(-12, 6),
          vx: rnd(-20, 20), vy: rnd(-60, -20), life: rnd(.2, .4), max: .4,
          size: rnd(2, 5), color: '#9de36f', type: 'circle', rot: 0, vr: 1, drag: .8,
        });
      }
    }
  }

  if (v11Lv('panic_meow')) {
    const lv = v11Lv('panic_meow');
    const radius = 100 + lv * 20;
    for (const e of v11NearbyEnemies(p.x, p.y, radius)) {
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      e.kx += Math.cos(a) * (150 + lv * 30);
      e.ky += Math.sin(a) * (90 + lv * 20);
      if (lv >= 4) e.stunTimer = Math.max(e.stunTimer || 0, .9);
    }
    rings.push({ x: p.x, y: p.y, r0: 24, r1: radius, life: 0, max: .32, color: withAlpha('#ffd45e', .5), width: 5, ink: false });
    sfx('roar');
  }

  if (v11Lv('gravity_yarn')) {
    const lv = v11Lv('gravity_yarn');
    for (const e of v11NearbyEnemies(p.x, p.y, 200)) {
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      e.x += Math.cos(a) * (12 + lv * 7);
      e.y += Math.sin(a) * (12 + lv * 7);
    }
    rings.push({ x: p.x, y: p.y, r0: 180, r1: 32, life: 0, max: .3, color: withAlpha('#c4abff', .5), width: 6, ink: false });
    sfx('gravity');
  }
};

const V11_LEGACY_TRY_DASH = tryDash;
tryDash = function () {
  const before = player ? player.dashTimer : 0;
  V11_LEGACY_TRY_DASH();
  const p = player;
  if (!p || p.dead || p.dashTimer <= 0) return;
  const blink = v11Lv('blink_step');
  if (blink) {
    p.dashTimer *= 1 + .06 * blink;
    p.dashCd = Math.max(.35, p.dashCooldown * (1 - .16 * blink));
    if (blink >= 4) {
      v11SpawnBeam(p.x, p.y, p.x + p.dashDir.x * 180, p.y + p.dashDir.y * 180, '#9be7ff', 8);
      v11LineHit(p.x, p.y, p.x + p.dashDir.x * 180, p.y + p.dashDir.y * 180, 20,
        p.attackDamage * .8, { kb: 90, kind: 'blink' });
    }
  }
  const roll = v11Lv('cat_roll');
  if (roll) {
    const radius = roll >= 4 ? 66 : 48;
    v11SpawnZone(p.x, p.y, radius, 1.3, p.attackDamage * (.5 + roll * .15) * (roll >= 4 ? 1.8 : 1),
      '#ffc46b', { slowMul: roll >= 4 ? .45 : 1 });
  }
  const vp = v11Lv('void_pounce');
  if (vp) {
    const x = p.x, y = p.y, dx = p.dashDir.x, dy = p.dashDir.y;
    V11_SK.queue.push({
      t: .16,
      fn: () => {
        const ex = clamp(x + dx * 200, INNER.x, INNER.right);
        const ey = clamp(y + dy * 200, INNER.y, INNER.bottom);
        v11SpawnBeam(x, y, ex, ey, '#a98cff', 10);
        v11LineHit(x, y, ex, ey, 34, (player ? player.attackDamage : 10) * (.9 + vp * .3),

        sfx('dash');
      },
    });
  }
  if (before <= 0 && p.dashTimer > 0) sfx('dash');
};

};

function drawCaramelCrab(g, e, t) {
  const r = e.r;
  const scuttle = Math.sin(t * 10 + e.phase) * r * .05;
  const pinch = e.action === 'wind' ? 1 : 0;

  g.strokeStyle = C.ink; g.lineWidth = 3.2; g.lineCap = 'round';
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const a = .5 + i * .42;
      const bx = sx * r * .6, by = r * .25 + i * r * .14;
      g.beginPath();
      g.moveTo(bx, by);
      g.lineTo(bx + sx * r * .52, by + scuttle + r * .22);
      g.lineTo(bx + sx * r * .72, by + r * .34);
      g.stroke();
    }
  }
  // 横宽蟹壳
  g.save(); g.translate(0, -r * .1 + scuttle * .3);
  ellipse(g, 0, 0, r * 1.12, r * .62, e.color, C.ink, 4.2);
  // 焦糖淋面
  g.strokeStyle = '#a95c2c'; g.lineWidth = r * .14; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-r * .72, -r * .18);
  g.quadraticCurveTo(-r * .3, r * .12, 0, -r * .1);
  g.quadraticCurveTo(r * .35, r * .14, r * .68, -r * .16);
  g.stroke();
  g.strokeStyle = withAlpha(C.cream, .7); g.lineWidth = r * .05;
  g.beginPath(); g.moveTo(-r * .55, -r * .3); g.lineTo(r * .2, -r * .34); g.stroke();
  // 蟹眼立柱
  for (const sx of [-1, 1]) {
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.moveTo(sx * r * .42, -r * .5); g.lineTo(sx * r * .5, -r * .92); g.stroke();
    circle(g, sx * r * .5, -r * .96, r * .2, C.white, C.ink, 2.6);

  }

    g.quadraticCurveTo(sx * r * .05, -r * .4, 0, 0);

/* ---------- 第 2 章 · 电池猫（竖长方块 + 电极耳） ---------- */
function drawBatteryCat(g, e, t) {
  const r = e.r;

  g.restore();

  g.save(); g.translate(0, charge ? Math.sin(t * 30) * 1.6 : Math.sin(t * 5 + e.phase) * 1.2);

  fillRound(g, r * .16, -r * .75, r * .09, r * .28, r * .03, C.ink);
  // 猫耳电极
  catEar(g, -r * .48, -r * .72, r * .27, r * .34, -.35, e.color, C.gold);
  catEar(g, r * .48, -r * .72, r * .27, r * .34, .35, e.color, C.gold);
  // 眼睛在电量窗里

  circle(g, r * .18, -r * .06, r * .1, C.cream, null, 0);

  circle(g, r * .18 + look * r * .03, -r * .06, r * .045, C.ink, null, 0);

  // 小短腿

  fillRound(g, r * 1.0, r * .06, r * .2, r * .18, r * .05, C.gold); strokeRound(g, r * 1.0, r * .06, r * .2, r * .18, r * .05, C.ink, 2.4);

/* ---------- 第 3 章 · 耳语猫（细高幽灵 + 长尾卷） ---------- */
function drawWhispercat(g, e, t) {
  const r = e.r;

  ellipse(g, r * .16, -r * .22, r * .1, r * .16, '#1a0f28', null, 0);

  // 竖着的“耳语嘴”

}

/* ---------- 第 4 章 · 雪螨（小而多刺的三角跳虫） ---------- */
function drawSnowmite(g, e, t) {

/* ---------- 第 4 章 · 冰锥精（一簇锋利晶柱） ---------- */
function drawIceshard(g, e, t) {
  const r = e.r;

/* ---------- 第 4 章 · 霜团子（巨大蓬松云 + 迷你脸） ---------- */

/* ---------- 第 4 章 · 雪橇犬（横向长身 + 雪橇板） ---------- */

/* ---------- 第 4 章 · 雪人（三层雪球 + 水桶帽 + 树枝手） ---------- */

/* ---------- 第 4 章 Boss · 霜冠雪后（高塔身 + 冰冠 + 长袖） ---------- */

  g.closePath();
  g.fillStyle = enraged ? '#dff0ff' : e.color; g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 4; g.stroke();
  // 裙面冰纹
  g.strokeStyle = withAlpha('#5fa6c9', .7); g.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    g.beginPath();
    g.moveTo(-r * .2 + i * r * .2, -r * .3);
    g.lineTo(-r * .44 + i * r * .34, r * .8);
    g.stroke();
  }
  drawStar(g, 0, r * .45, r * .26, r * .11, 6, withAlpha(C.white, .85), null, 0, t);
  // 细长冰臂
  for (const sx of [-1, 1]) {
    g.strokeStyle = C.ink; g.lineWidth = r * .16;
    g.beginPath();
    g.moveTo(sx * r * .3, -r * .45);
    g.quadraticCurveTo(sx * r * 1.3, -r * .2, sx * r * 1.35, r * .35);
    g.stroke();
    circle(g, sx * r * 1.35, r * .35, r * .12, '#dff6ff', C.ink, 2.4);
  }
  // 脸：冰晶眼 + 冷面
  g.save(); g.translate(0, -r * .56);
  ellipse(g, 0, 0, r * .3, r * .26, '#f2fdff', C.ink, 2.6);
  for (const sx of [-1, 1]) {
    g.fillStyle = enraged ? C.coral : '#2b6d8c';
    g.beginPath();
    g.moveTo(sx * r * .14, -r * .06); g.lineTo(sx * r * .06, -r * .16); g.lineTo(sx * r * .02, -r * .03);
    g.closePath(); g.fill();
  }
  g.strokeStyle = '#2b6d8c'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(-r * .08, r * .12); g.quadraticCurveTo(0, r * .16, r * .08, r * .12); g.stroke();
  g.restore();
  g.restore();
}

/* ---------- 第 5 章 · 虚空团（带洞的环形体） ---------- */
function drawVoidling(g, e, t) {
  const r = e.r;
  const pulse = 1 + Math.sin(t * 2.6 + e.phase) * .08;
  g.save(); g.scale(pulse, 1 / pulse);
  // 灵动触须
  g.strokeStyle = C.ink; g.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    const a = Math.PI * .35 + i * .42;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .55, r * .45);
    g.quadraticCurveTo(Math.cos(a) * r * .9, r * .85, Math.cos(a) * r * .8 + Math.sin(t * 4 + i) * r * .18, r * 1.18);
    g.stroke();
  }
  // 环形外体
  circle(g, 0, 0, r * .92, e.color, C.ink, 4.2);
  // 中央黑洞
  g.save();
  const hole = g.createRadialGradient(0, 0, r * .08, 0, 0, r * .5);
  hole.addColorStop(0, '#05020a'); hole.addColorStop(.7, '#160a24'); hole.addColorStop(1, '#2c1740');
  g.fillStyle = hole;
  g.beginPath(); g.arc(0, 0, r * .46, 0, TAU); g.fill();
  g.strokeStyle = withAlpha(C.cream, .7); g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, r * .46, 0, TAU); g.stroke();
  // 洞里一颗星
  drawStar(g, Math.cos(t * 1.4) * r * .16, Math.sin(t * 1.7) * r * .14, r * .12, r * .05, 5, C.gold, null, 0, t);
  g.restore();
  // 上方独眼
  ellipse(g, 0, -r * .64, r * .26, r * .17, '#0a0412', C.ink, 2.4);
  circle(g, Math.sin(t * 2) * r * .05, -r * .64, r * .08, C.lavender, null, 0);
  g.restore();
}

/* ---------- 第 5 章 · 镜猫（立式镜框 + 倒影猫脸） ---------- */
function drawMirrorcat(g, e, t) {
  const r = e.r;
  const tele = e.action === 'vanish';
  const shimmer = Math.sin(t * 5 + e.phase) * .12;
  g.save();
  if (tele) g.globalAlpha = .5 + shimmer;
  // 镜框（竖向圆角矩形）
  fillRound(g, -r * .7, -r * 1.02, r * 1.4, r * 1.78, r * .4, e.color);
  strokeRound(g, -r * .7, -r * 1.02, r * 1.4, r * 1.78, r * .4, C.ink, 4.2);
  fillRound(g, -r * .52, -r * .84, r * 1.04, r * 1.42, r * .28, '#1a1030');
  // 镜面反光
  g.save(); g.beginPath();
  g.moveTo(-r * .4, -r * .7); g.lineTo(-r * .05, -r * .8);
  g.lineTo(r * .1, r * .48); g.lineTo(-r * .25, r * .52);
  g.closePath(); g.fillStyle = withAlpha('#c4abff', .22 + Math.abs(shimmer) * .3); g.fill();
  g.restore();
  // 倒影猫脸（与本体左右翻）
  g.save(); g.translate(0, -r * .16); g.scale(-1, 1);
  catEar(g, -r * .26, -r * .34, r * .15, r * .24, -.3, '#e8dcff', C.ink, 2);
  catEar(g, r * .26, -r * .34, r * .15, r * .24, .3, '#e8dcff', C.ink, 2);
  ellipse(g, 0, 0, r * .36, r * .32, '#e8dcff', C.ink, 2.4);
  circle(g, -r * .13, -r * .03, r * .06, C.ink, null, 0);
  circle(g, r * .13, -r * .03, r * .06, C.ink, null, 0);
  g.strokeStyle = C.ink; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(-r * .07, r * .13); g.quadraticCurveTo(0, r * .18, r * .07, r * .13); g.stroke();
  g.restore();
  // 框顶猫耳
  catEar(g, -r * .44, -r * 1.0, r * .2, r * .3, -.35, e.color, C.lavender);
  catEar(g, r * .44, -r * 1.0, r * .2, r * .3, .35, e.color, C.lavender);
  // 镜脚
  g.strokeStyle = C.ink; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(-r * .4, r * .72); g.lineTo(-r * .55, r * .96); g.stroke();
  g.beginPath(); g.moveTo(r * .4, r * .72); g.lineTo(r * .55, r * .96); g.stroke();
  // 裂纹
  g.strokeStyle = withAlpha('#ffffff', .55); g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(-r * .2, -r * .5); g.lineTo(-r * .05, -r * .25); g.lineTo(-r * .18, -r * .12); g.stroke();
  g.restore();
}

/* ---------- 第 5 章 · 静电球（圆球 + 放射电极 + 电弧） ---------- */
function drawStaticorb(g, e, t) {
  const r = e.r;
  const charge = e.action === 'aim' ? 1 : 0;
  // 放射电极针
  g.strokeStyle = C.ink; g.lineWidth = 2.6;
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU + t * (charge ? .8 : .25);
    const len = r * (1.0 + (i % 2) * .22 + charge * .18);
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .82, Math.sin(a) * r * .82);
    g.lineTo(Math.cos(a) * len, Math.sin(a) * len);
    g.stroke();
    if (i % 2 === 0) circle(g, Math.cos(a) * len, Math.sin(a) * len, r * .08, charge ? C.gold : C.cream, C.ink, 1.6);
  }
  // 球体
  const body = g.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r * .95);
  body.addColorStop(0, '#f6f0ff'); body.addColorStop(.55, e.color); body.addColorStop(1, '#3c2b5a');
  circle(g, 0, 0, r * .84, null, C.ink, 4);
  g.fillStyle = body; g.beginPath(); g.arc(0, 0, r * .8, 0, TAU); g.fill();
  // 电弧爬行
  g.strokeStyle = withAlpha(C.gold, .85); g.lineWidth = 2;
  for (let i = 0; i < (charge ? 4 : 2); i++) {
    let x = -r * .4, y = -r * .5 + i * r * .18;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += r * .22; y += (k % 2 ? 1 : -1) * r * .12; g.lineTo(x, y); }
    g.stroke();
  }
  // 单眼
  ellipse(g, 0, -r * .05, r * .26, r * .18, '#ffffff', C.ink, 2.4);
  circle(g, 0, -r * .05, r * .1, '#1a1030', null, 0);
  circle(g, r * .04, -r * .09, r * .03, C.white, null, 0);
}

/* ---------- 第 5 章 · 幽暗之手（大手掌 + 五根手指） ---------- */
function drawGloomhand(g, e, t) {
  const r = e.r;
  const reach = e.action === 'whip' ? 1 : 0;
  const wiggle = Math.sin(t * 3.2 + e.phase) * .07;
  g.save();
  // 五根手指（张开向上）
  for (let i = 0; i < 5; i++) {
    const baseX = (i - 2) * r * .26;
    const a = (i - 2) * .3 + wiggle * (i % 2 ? 1 : -1) + reach * (i - 2) * .08;
    const len = r * (1.0 + (i === 2 ? .35 : i === 0 || i === 4 ? -.2 : 0));
    g.save(); g.translate(baseX, -r * .08); g.rotate(a);
    g.strokeStyle = C.ink; g.lineWidth = r * .2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -len); g.stroke();
    g.strokeStyle = e.color; g.lineWidth = r * .13;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -len); g.stroke();
    g.strokeStyle = withAlpha(C.cream, .5); g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(-r * .03, -r * .12); g.lineTo(-r * .03, -len * .8); g.stroke();
    g.restore();
  }
  // 手掌
  ellipse(g, 0, r * .28, r * .78, r * .58, e.color, C.ink, 4);
  // 掌心眼
  ellipse(g, 0, r * .22, r * .24, r * .18, '#0a0412', C.ink, 2.4);
  circle(g, Math.sin(t * 2) * r * .05, r * .22, r * .07, C.lavender, null, 0);
  // 掌根与雾尾
  g.strokeStyle = C.ink; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-r * .4, r * .7); g.quadraticCurveTo(-r * .6, r * 1.0, -r * .2, r * 1.12); g.stroke();
  g.beginPath(); g.moveTo(r * .4, r * .7); g.quadraticCurveTo(r * .6, r * 1.0, r * .2, r * 1.12); g.stroke();
  g.restore();
}

/* ---------- 第 5 章 · 悖论犬（滚轮式环形身体 + 双耳） ---------- */
function drawParadoxpup(g, e, t) {
  const r = e.r;
  const roll = e.action === 'roll' ? t * 8 : Math.sin(t * 3 + e.phase) * .08;
  g.save(); g.rotate(roll);
  // 环形轮身
  g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath(); g.arc(0, 0, r * .9, 0, TAU); g.stroke();
  g.strokeStyle = e.color; g.lineWidth = r * .34;
  g.beginPath(); g.arc(0, 0, r * .82, 0, TAU); g.stroke();
  g.strokeStyle = withAlpha(C.cream, .5); g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, r * .7, 0, TAU); g.stroke();
  // 轮内小狗脸
  ellipse(g, 0, 0, r * .4, r * .32, '#efe6ff', C.ink, 3);
  g.fillStyle = C.ink;
  ellipse(g, -r * .14, -r * .04, r * .06, r * .09, C.ink, null, 0);
  ellipse(g, r * .14, -r * .04, r * .06, r * .09, C.ink, null, 0);
  ellipse(g, 0, r * .16, r * .11, r * .08, C.ink, null, 0);
  g.restore();
  // 不随轮子转的双耳
  catEar(g, -r * .5, -r * .82, r * .18, r * .3, -.4, e.color, '#d8c8ff');
  catEar(g, r * .5, -r * .82, r * .18, r * .3, .4, e.color, '#d8c8ff');
  // 车轮反光
  g.save(); g.globalAlpha = .4;
  g.strokeStyle = C.cream; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, r * .96, -.4, .9); g.stroke();
  g.restore();
}

/* ---------- 第 5 章 Boss · 虚空之镜（双镜面 + 中央眼 + 碎片冠） ---------- */
function drawVoidmirror(g, e, t) {
  const r = e.r;
  const float = Math.sin(t * 1.5) * r * .06;
  const enraged = e.enraged;
  g.save(); g.translate(0, float);
  // 背后镜面碎片
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * .9 + i * Math.PI * .3;
    const dist0 = r * (1.35 + (i % 2) * .2);
    g.save();
    g.translate(Math.cos(a) * dist0, Math.sin(a) * dist0 * .8);
    g.rotate(a + t * .2);
    g.beginPath();
    g.moveTo(-r * .16, 0); g.lineTo(0, -r * .3); g.lineTo(r * .16, 0); g.lineTo(0, r * .18);
    g.closePath();
    g.fillStyle = i % 2 ? withAlpha(C.lavender, .55) : withAlpha(C.cream, .35);
    g.fill(); g.strokeStyle = withAlpha(C.ink, .8); g.lineWidth = 2; g.stroke();
    g.restore();
  }
  // 左右两块斜镜面（沙漏剪影）
  for (const sx of [-1, 1]) {
    g.save();
    g.translate(sx * r * .58, 0);
    g.rotate(sx * .16);
    g.beginPath();
    g.moveTo(-r * .34, -r * 1.05);
    g.lineTo(r * .34, -r * .82);
    g.lineTo(r * .28, r * .98);
    g.lineTo(-r * .3, r * .82);
    g.closePath();
    g.fillStyle = enraged ? '#4a2a5c' : e.color;
    g.fill(); g.strokeStyle = C.ink; g.lineWidth = 4; g.stroke();
    // 镜面裂纹
    g.strokeStyle = withAlpha(C.cream, .4); g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-r * .12, -r * .9); g.lineTo(r * .04, -r * .2); g.lineTo(-r * .16, r * .3); g.stroke();
    g.restore();
  }
  // 中央虚空裂缝
  g.save();
  const core = g.createLinearGradient(0, -r, 0, r);
  core.addColorStop(0, '#130720'); core.addColorStop(.5, '#2c1540'); core.addColorStop(1, '#0b0414');
  g.fillStyle = core;
  g.beginPath();
  g.moveTo(-r * .26, -r * .95);
  g.quadraticCurveTo(r * .1, 0, -r * .2, r * .95);
  g.quadraticCurveTo(r * .22, 0, -r * .26, -r * .95);
  g.closePath(); g.fill();
  g.strokeStyle = withAlpha(C.lavender, .7); g.lineWidth = 2.4; g.stroke();
  g.restore();
  // 中央独眼
  g.save(); g.translate(0, -r * .08);
  ellipse(g, 0, 0, r * .5, r * .3, enraged ? C.coral : C.cream, C.ink, 4);
  ellipse(g, 0, 0, r * .2, r * .24, '#1a0a26', null, 0);
  circle(g, Math.sin(t * 2.2) * r * .06, -r * .02, r * .08, C.lavender, null, 0);
  // 眼周缝合线
  g.strokeStyle = C.ink; g.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const x = -r * .4 + i * r * .26;
    g.beginPath(); g.moveTo(x, -r * .26); g.lineTo(x + r * .04, r * .26); g.stroke();
  }
  g.restore();
  // 猫耳式镜角
  catEar(g, -r * .5, -r * 1.0, r * .22, r * .4, -.35, e.color, C.lavender);
  catEar(g, r * .5, -r * 1.0, r * .22, r * .4, .35, e.color, C.lavender);
  g.restore();
}

    });

/* 第四阶独立造型：悬浮虚空体 + 镜面披风 + 独眼面罩 + 触须，无腿。 */
function drawFormVoidseeker(g, p, r, t, moving, blink, isDead) {
  const f = FORMS[3] || FORMS[FORMS.length - 1];
  const hover = Math.sin(t * 2.1) * r * .13;
  const hurt = (p.hurtFlash || 0) > 0 ? Math.sin(t * 44) * r * .035 : 0;
  const swing = p.attackAnim > 0 ? Math.sin((1 - p.attackAnim / p.attackAnimMax) * Math.PI) : 0;
  const look = Math.cos(p.aim || 0);

  // 虚空底环（替代双腿）
  g.save();
  g.globalAlpha = isDead ? .1 : .32;
  const halo = g.createRadialGradient(0, r * .95, r * .1, 0, r * .95, r * 1.7);
  halo.addColorStop(0, withAlpha(f.accent, .55));
  halo.addColorStop(.6, withAlpha('#6d4fa8', .22));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = halo;
  g.beginPath(); g.ellipse(0, r * .95 + hover * .2, r * 1.5, r * .42, 0, 0, TAU); g.fill();
  g.strokeStyle = withAlpha(f.trim, .65); g.lineWidth = 2;
  g.beginPath(); g.ellipse(0, r * .95 + hover * .2, r * 1.05, r * .3, 0, 0, TAU); g.stroke();
  g.restore();

  // 环绕镜面碎片
  for (let i = 0; i < 5; i++) {
    const a = t * .7 + i * TAU / 5;
    const rr = r * (1.35 + (i % 2) * .2);
    g.save();
    g.translate(Math.cos(a) * rr, -r * .55 + Math.sin(a) * rr * .42);
    g.rotate(a + t * .4);
    g.globalAlpha = .55;
    g.beginPath();
    g.moveTo(0, -r * .16); g.lineTo(r * .1, 0); g.lineTo(0, r * .14); g.lineTo(-r * .09, 0);
    g.closePath();
    g.fillStyle = i % 2 ? withAlpha(f.trim, .7) : withAlpha(C.cream, .5);
    g.fill();
    g.strokeStyle = withAlpha(C.ink, .7); g.lineWidth = 1.4; g.stroke();
    g.restore();
  }

  g.save();
  g.translate(hurt, hover);

  // 镜面披风：左右两片大三角，剪影像张开的裂缝
  for (const sx of [-1, 1]) {
    g.save();
    g.translate(sx * r * .62, r * .12);
    g.rotate(sx * (.18 + Math.sin(t * 1.6 + sx) * .05));
    g.beginPath();
    g.moveTo(0, -r * .7);
    g.quadraticCurveTo(sx * r * .95, -r * .35, sx * r * 1.15, r * .9);
    g.quadraticCurveTo(sx * r * .45, r * .5, 0, r * .62);
    g.closePath();
    g.fillStyle = sx < 0 ? '#3b2a5e' : '#4b356f';
    g.fill(); g.strokeStyle = C.ink; g.lineWidth = 4; g.stroke();
    g.strokeStyle = withAlpha(f.trim, .6); g.lineWidth = 2;
    g.beginPath(); g.moveTo(sx * r * .1, -r * .5); g.quadraticCurveTo(sx * r * .8, -r * .15, sx * r * .95, r * .72); g.stroke();
    g.restore();
  }

  // 星屑触须（下摆）
  g.save(); g.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const a = .45 + i * .38;
    const sx = i < 2 ? -1 : 1;
    const wig = Math.sin(t * 3 + i) * r * .12;
    g.strokeStyle = C.ink; g.lineWidth = r * .16;
    g.beginPath();
    g.moveTo(sx * r * .35, r * .55);
    g.quadraticCurveTo(sx * r * .55 + wig, r * .95, sx * r * .3 + wig, r * 1.25);
    g.stroke();
    g.strokeStyle = f.trim; g.lineWidth = r * .075;
    g.beginPath();
    g.moveTo(sx * r * .35, r * .55);
    g.quadraticCurveTo(sx * r * .55 + wig, r * .95, sx * r * .3 + wig, r * 1.25);
    g.stroke();
    drawStar(g, sx * r * .3 + wig, r * 1.25, r * .1, r * .04, 5, C.gold, null, 0, t + i);
  }
  g.restore();

  // 主体：不对称的虚空猫体

/* ---------------- 新敌人 AI ---------------- */
function v11PlaceNear(e, min, max) {
  if (!player) return;
  const a = rnd(0, TAU);
  e.x = clamp(player.x + Math.cos(a) * rnd(min, max), INNER.x + e.r, INNER.right - e.r);
  e.y = clamp(player.y + Math.sin(a) * rnd(min, max), INNER.y + e.r, INNER.bottom - e.r);
}

function v11EnemyFuseExplode(e) {
  const rad = 78 + e.r;
  shake = Math.max(shake, 13);
  flash = Math.max(flash, .14);
  flashColor = e.type === 'snowman' ? '#dff6ff' : C.gold;
  sfx('stomp');
  sfx('explode');
  rings.push({ x: e.x, y: e.y, r0: 20, r1: rad, life: 0, max: .38, color: withAlpha(e.color, .8), width: 12, ink: true });
  shockwaves.push({
    x: e.x, y: e.y, radius: 24, maxRadius: rad, life: 0, max: .26,
    friendly: false, damage: Math.round(e.damage * 1.15), color: e.color,
  });
  addBurst(e.x, e.y, e.color, 26, 300);
  addBurst(e.x, e.y, C.cream, 12, 220);
  // 雪人爆炸后还会甩出一圈雪球，逼玩家换位。
  if (e.type === 'snowman') {
    for (let i = 0; i < 6; i++) {
      enemyShoot(e, i / 6 * TAU + rnd(0, .2), { speed: 190, radius: 9, damage: Math.round(e.damage * .5), kind: 'snow', life: 2.6 });
    }
  }
}

function updateNewEnemyAI(e, dt) {
  e.attackTimer -= dt;
  if (!player) return;
  const d = dist(e, player);
  const toP = Math.atan2(player.y - e.y, player.x - e.x);
  const ai = e.ai;
  const stunned = e.action === 'stun';
  if (stunned) {
    e.actionT -= dt;
    if (e.actionT <= 0) e.action = 'idle';
    return;
  }

  // 炸弹型：贴近后点燃引信，原地蓄力，再炸出一圈。
  if (ai === 'bomber') {
    if (e.action === 'fuse') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        e.action = 'blast';
        e.actionT = .18;
        e.attackTimer = e.type === 'snowman' ? 2.9 : 2.5;
        v11EnemyFuseExplode(e);
      }
      return;
    }
    if (e.action === 'blast') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    enemyMoveChase(e, dt, .9, .12);
    if (e.attackTimer <= 0 && d < e.r + 150) {
      e.action = 'fuse'; e.actionT = .85;
      addFloater(e.x, e.y - e.r - 14, '要炸了!', C.gold, 14);
      sfx('shoot', .6);
    }
    return;
  }

  // 瞬移型：先溶解，再出现在玩家附近。
  if (ai === 'teleporter') {
    if (e.action === 'vanish') {
      e.actionT -= dt;
      if (e.actionT <= 0) {
        addBurst(e.x, e.y, e.color, 20, 240);
        v11PlaceNear(e, 130, 210);
        rings.push({ x: e.x, y: e.y, r0: 8, r1: e.r * 2.4, life: 0, max: .35, color: withAlpha(C.lavender, .75), width: 8, ink: true });
        addBurst(e.x, e.y, C.lavender, 18, 200);
        sfx('evolve', .7);
        e.action = 'idle';
        e.attackTimer = 1.35;
      }
      return;
    }
    enemyMoveChase(e, dt, .72, .28);
    if (e.attackTimer <= 0 && d > e.r + 90) {
      e.action = 'vanish'; e.actionT = .4;
      addFloater(e.x, e.y - e.r - 12, '？', C.lavender, 15);
    }
    return;
  }

  // 狙击型：拉开距离 → 瞄准线 → 高速单发。
  if (ai === 'sniper') {
    if (e.action === 'aim') {
      e.actionT -= dt;
      e.aimAngle = toP;
      if (e.actionT <= 0) {
        enemyShoot(e, toP, { speed: 520, radius: 7, damage: Math.round(e.damage * 1.3), kind: e.projectile, life: 3.4, offset: e.r * .9 });
        e.action = 'recoil'; e.actionT = .2;
        e.attackTimer = 2.3;
        shake = Math.max(shake, 3);
        sfx('shoot', 1.2);
      }
      return;
    }
    if (e.action === 'recoil') {
      e.actionT -= dt;
      if (e.actionT <= 0) e.action = 'idle';
      return;
    }
    let dx = 0, dy = 0;
    if (d < 330) { dx -= Math.cos(toP); dy -= Math.sin(toP); }
    else if (d > 470) { dx += Math.cos(toP); dy += Math.sin(toP); }
    dx += Math.cos(toP + e.wobbleSign * Math.PI / 2) * .7;
    dy += Math.sin(toP + e.wobbleSign * Math.PI / 2) * .7;
    const len = Math.hypot(dx, dy) || 1;
    moveWorld(e, dx / len * e.speed * enemySlowMul(e) * dt, dy / len * e.speed * enemySlowMul(e) * dt);
    if (e.attackTimer <= 0 && d < 760) { e.action = 'aim'; e.actionT = .55; }
    return;
  }

  // 滚轮型：慢速绕圈，冷却好就直线滚撞，撞墙反弹。
  if (ai === 'roller') {
    if (e.action === 'roll') {
      e.actionT -= dt;
      const sp = 640;
      const dx = Math.cos(e.chargeAngle) * sp * dt;
      const dy = Math.sin(e.chargeAngle) * sp * dt;
      const bx = moveWorld(e, dx, 0);
      const by = moveWorld(e, 0, dy);
      if (bx) { e.chargeAngle = Math.PI - e.chargeAngle; rings.push({ x: e.x, y: e.y, r0: 8, r1: e.r * 2, life: 0, max: .3, color: withAlpha(C.lavender, .6), width: 7, ink: true }); sfx('stomp', .8); }
      if (by) { e.chargeAngle = -e.chargeAngle; rings.push({ x: e.x, y: e.y, r0: 8, r1: e.r * 2, life: 0, max: .3, color: withAlpha(C.lavender, .6), width: 7, ink: true }); sfx('stomp', .8); }
      if (e.actionT <= 0) {
        e.action = 'idle';
        e.attackTimer = 1.9;
        for (let i = 0; i < 8; i++) addParticle({
          x: e.x + rnd(-e.r, e.r), y: e.y + e.r * .7,
          vx: rnd(-110, 110), vy: rnd(-50, 10), life: rnd(.15, .34), max: .34,
          size: rnd(2, 6), color: withAlpha(e.color, .6), type: 'puff', rot: 0, vr: 0, gravity: 18, drag: .8,
        });
      }
      return;
    }
    enemyMoveChase(e, dt, .55, .35);
    if (e.attackTimer <= 0 && d < 520) {
      e.action = 'roll'; e.actionT = .8;
      e.chargeAngle = toP;
      sfx('dash', .8);
    }
    return;
  }

  updateEnemyAI(e, dt);
}

  if (e.ai === 'bossVoid') return v11BossVoidAI(e, dt);
  return V11_LEGACY_BOSS_AI(e, dt);
};

/* ---------------- 新攻击预警 ---------------- */
const V11_LEGACY_TELEGRAPH = drawEnemyTelegraph;
drawEnemyTelegraph = function (g, e, t) {
  if (!e || e.dead || e.spawnTimer > 0 || !player) {
    return V11_LEGACY_TELEGRAPH(g, e, t);
  }
  const active = Math.sin(t * 12) * .5 + .5;
  if (e.ai === 'bomber' && e.action === 'fuse') {
    const rad = 78 + e.r;
    const p = 1 - clamp(e.actionT / .85, 0, 1);
    g.save(); g.globalAlpha = .2 * active; g.fillStyle = e.color;
    g.beginPath(); g.arc(e.x, e.y, rad, 0, TAU); g.fill(); g.globalAlpha = 1;
    dashedCircle(g, e.x, e.y, rad * (.6 + p * .4), withAlpha(C.gold, .7), 5, [13, 9]);
    dashedCircle(g, e.x, e.y, rad, withAlpha(C.coral, .55), 3, [8, 10]);
    g.restore();
    return;
  }
  if (e.ai === 'sniper' && e.action === 'aim') {
    drawTelegraphLine(g, e, e.aimAngle || Math.atan2(player.y - e.y, player.x - e.x), 760, '#9fe8ff', active);
    return;
  }
  if (e.ai === 'roller' && e.action === 'roll') {
    drawTelegraphSpeedLines(g, e, e.chargeAngle, C.lavender, 5);
    return;
  }
  if (e.ai === 'bossSnow') {
    if (e.action === 'windIcicles') {
      const p = 1 - clamp(e.actionT / .65, 0, 1);
      for (let i = 0; i < 5; i++) drawTelegraphLine(g, e, Math.atan2(player.y - e.y, player.x - e.x) + (i - 2) * .18, 380 + p * 120, '#bfefff', active);
      dashedCircle(g, e.x, e.y, e.r * 1.5 + p * 40, withAlpha('#bfefff', .5), 4, [12, 10]);
      return;
    }
    if (e.action === 'windBlizzard') {
      const p = 1 - clamp(e.actionT / .7, 0, 1);
      dashedCircle(g, e.x, e.y, 300 * easeOut(p), withAlpha('#dff6ff', .65), 6, [15, 10]);
      g.save(); g.globalAlpha = .15 * active; g.fillStyle = '#dff6ff';
      g.beginPath(); g.arc(e.x, e.y, 300, 0, TAU); g.fill(); g.restore();
      return;
    }
    if (e.action === 'windSummon') {
      for (let i = 0; i < 2; i++) {
        const a = t * 2 + i * Math.PI;
        dashedCircle(g, e.x + Math.cos(a) * e.r * .8, e.y + Math.sin(a) * e.r * .5, e.r * .5, withAlpha('#ffffff', .5), 3, [8, 8]);
      }
      return;
    }
  }
  if (e.ai === 'bossVoid') {
    if (e.action === 'windPulse') {
      const p = 1 - clamp(e.actionT / .65, 0, 1);
      for (let i = 0; i < 3; i++) dashedCircle(g, e.x, e.y, (250 + i * 40) * easeOut(p), withAlpha(C.lavender, .45 + i * .1), 4, [16, 12]);
      return;
    }
    if (e.action === 'windMirror') {
      for (let i = 0; i < 4; i++) {
        const a = t * 1.2 + i * TAU / 4;
        g.save(); g.globalAlpha = .45;
        drawStar(g, e.x + Math.cos(a) * e.r * 1.2, e.y + Math.sin(a) * e.r * .8, e.r * .18, e.r * .07, 4, C.lavender, null, 0, a);
        g.restore();
      }
      return;
    }
    if (e.action === 'warp') {
      dashedCircle(g, e.x, e.y, e.r * 1.7, withAlpha(C.lavender, .65 + active * .2), 5, [10, 8]);
      return;
    }
  }
  return V11_LEGACY_TELEGRAPH(g, e, t);
};

/* ---------------- 新弹道外观 ---------------- */
const V11_LEGACY_PROJ_COLOR = projectileColorFor;
projectileColorFor = function (e) {
  switch (e.projectile) {
    case 'frost': return '#bfefff';
    case 'snow': return '#f4fcff';
    case 'ink': return '#5b3f78';
    case 'mirror': return '#c9a8ff';
    case 'static': return '#ffe36e';
    case 'void': return '#8a6bc4';
    default: return V11_LEGACY_PROJ_COLOR(e);
  }
};

const V11_NEW_PROJ_KINDS = new Set(['frost', 'snow', 'ink', 'mirror', 'static', 'void']);
const V11_LEGACY_DRAW_PROJECTILE = drawProjectile;

drawProjectile = function (g, pr) {
  if (!pr || pr.friendly || !V11_NEW_PROJ_KINDS.has(pr.kind)) return V11_LEGACY_DRAW_PROJECTILE(g, pr);
  const r = pr.radius;
  g.save();
  g.translate(pr.x, pr.y);
  g.rotate(pr.rot);
  // 尾迹
  g.globalAlpha = .34;
  g.fillStyle = withAlpha(pr.color, .55);
  g.beginPath(); g.arc(-r * 1.2, 0, r * 1.1, 0, TAU); g.fill();
  g.globalAlpha = 1;
  if (pr.kind === 'frost') {
    // 六角冰晶
    g.strokeStyle = C.ink; g.lineWidth = 2.2;
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      g.beginPath();
      g.moveTo(-Math.cos(a) * r * 1.15, -Math.sin(a) * r * 1.15);
      g.lineTo(Math.cos(a) * r * 1.15, Math.sin(a) * r * 1.15);
      g.stroke();
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(Math.cos(a) * r * .45 * s, Math.sin(a) * r * .45 * s);
        g.lineTo(Math.cos(a + .7) * r * .8 * s, Math.sin(a + .7) * r * .8 * s);
        g.stroke();
      }
    }
    circle(g, 0, 0, r * .34, C.white, C.ink, 1.8);
  } else if (pr.kind === 'snow') {
    circle(g, 0, 0, r, '#f8feff', C.ink, 2.8);
    g.globalAlpha = .4; circle(g, -r * .3, -r * .3, r * .35, C.white, null, 0); g.globalAlpha = 1;
  } else if (pr.kind === 'ink') {
    g.fillStyle = '#3a2451'; g.strokeStyle = C.ink; g.lineWidth = 2.4;
    g.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      const rr = r * (i % 2 ? .78 : 1.12);
      i === 0 ? g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill(); g.stroke();
    circle(g, r * .2, -r * .25, r * .18, withAlpha(C.cream, .55), null, 0);
  } else if (pr.kind === 'mirror') {
    g.fillStyle = withAlpha(C.lavender, .85); g.strokeStyle = C.ink; g.lineWidth = 2.6;
    g.beginPath();
    g.moveTo(0, -r * 1.2); g.lineTo(r * .78, 0); g.lineTo(0, r * 1.2); g.lineTo(-r * .78, 0);
    g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = withAlpha(C.cream, .8); g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-r * .3, -r * .4); g.lineTo(r * .1, r * .3); g.stroke();
  } else if (pr.kind === 'static') {
    g.strokeStyle = C.gold; g.lineWidth = 2.6;
    let x = -r, y = 0;
    g.beginPath(); g.moveTo(x, y);
    for (let i = 0; i < 4; i++) { x += r * .5; y = (i % 2 ? -1 : 1) * r * .55; g.lineTo(x, y); }
    g.stroke();
    circle(g, 0, 0, r * .72, '#fff6c9', C.ink, 2.2);
    circle(g, r * .15, -r * .1, r * .22, C.ink, null, 0);
  } else {
    // void
    g.fillStyle = '#1a0b2c'; g.strokeStyle = C.lavender; g.lineWidth = 2.2;
    circle(g, 0, 0, r, '#1a0b2c', C.lavender, 2.2);
    g.globalAlpha = .8;
    g.strokeStyle = withAlpha(C.cream, .7); g.lineWidth = 1.4;
    g.beginPath(); g.ellipse(0, 0, r * 1.35, r * .45, .5, 0, TAU); g.stroke();
    g.globalAlpha = 1;
    circle(g, 0, 0, r * .3, C.lavender, null, 0);
  }
  g.restore();
};

/* ---------------- 新音色（猫系搞笑，降刺耳高频） ---------------- */
const V11_LEGACY_SFX = sfx;
sfx = function (name, pitch = 1) {
  if (!audioCtx || muted) return V11_LEGACY_SFX(name, pitch);
  const now = audioCtx.currentTime;
  if (sfxLast[name] && now - sfxLast[name] < .045) return;
  if (name === 'frost') {
    sfxLast[name] = now;
    meow(560 * pitch, .14, .13, 0, 'sad');
    tone(1180 * pitch, .16, 'sine', .1, -220, .02, 'sfx', 3000);
    noise(.16, .07, 0, 2400);
    return;
  }
  if (name === 'thunder') {
    sfxLast[name] = now;
    noise(.16, .16, 0, 1800);
    tone(92, .24, 'sawtooth', .14, -40, .01, 'sfx', 800);
    tone(620 * pitch, .1, 'square', .1, 120, 0, 'sfx', 1800);
    return;
  }
  if (name === 'roar') {
    sfxLast[name] = now;
    meow(330 * pitch, .32, .3, 0, 'fierce');
    tone(110, .3, 'sawtooth', .16, 25, .02, 'sfx', 700);
    noise(.24, .1, .05, 600);
    return;
  }
  if (name === 'gravity') {
    sfxLast[name] = now;
    meow(420 * pitch, .22, .13, 0, 'sad');
    tone(150, .38, 'sine', .14, -70, 0, 'sfx', 900);
    noise(.3, .07, 0, 700);
    return;
  }
  if (name === 'void') {
    sfxLast[name] = now;
    meow(380 * pitch, .3, .19, 0, 'sad');
    tone(180, .4, 'triangle', .12, -50, .02, 'sfx', 1100);
    noise(.3, .06, .08, 550);
    return;
  }
  if (name === 'explode') {
    sfxLast[name] = now;
    noise(.3, .22, 0, 700);
    tone(96, .26, 'square', .2, -50, 0, 'sfx', 620);
    meow(900, .16, .12, .1, 'fierce');
    return;
  }
  return V11_LEGACY_SFX(name, pitch);
};

/* ---------------- 第 4/5 章场景背景 ---------------- */
const V11_LEGACY_BUILD_BG = buildRoomBackground;
buildRoomBackground = function (room) {
  const bg = V11_LEGACY_BUILD_BG(room);
  if (!room || !room.theme || !bg) return bg;
  const style = room.theme.style;
  if (style !== 'frost' && style !== 'void') return bg;
  const g = bg.getContext('2d');
  const seed = hashSeed(run.seed, (room.stage || 1) * 977, (room.number || 1) * 311);
  const vg = seeded(seed);
  g.save();
  g.lineJoin = 'round';
  if (style === 'frost') {
    // 顶部冰锥
    for (let x = INNER.x + 40; x < INNER.right - 20; x += 74) {
      const len = 18 + vg() * 34;
      g.beginPath();
      g.moveTo(x - 11, INNER.y + 2);
      g.lineTo(x + 2 + vg() * 6, INNER.y + len);
      g.lineTo(x + 11, INNER.y + 2);
      g.closePath();
      g.fillStyle = withAlpha('#e8fbff', .55);
      g.fill();
      g.strokeStyle = withAlpha('#5f9cb8', .35); g.lineWidth = 1.5; g.stroke();
    }
    // 雪堆
    for (let i = 0; i < 8; i++) {
      const x = INNER.x + 50 + vg() * (INNER.w - 100);
      const y = INNER.bottom - 8 - vg() * 16;
      g.beginPath(); g.ellipse(x, y, 26 + vg() * 40, 8 + vg() * 10, 0, 0, TAU);
      g.fillStyle = withAlpha('#ffffff', .18 + vg() * .12); g.fill();
    }
    // 冰面反光
    for (let i = 0; i < 12; i++) {
      const x = INNER.x + vg() * INNER.w, y = INNER.y + vg() * INNER.h;
      drawStar(g, x, y, 3 + vg() * 6, 1.4, 6, withAlpha('#ffffff', .28 + vg() * .2), null, 0, vg() * TAU);
    }
    g.strokeStyle = withAlpha('#ffffff', .16); g.lineWidth = 1.4;
    for (let i = 0; i < 6; i++) {
      const x = INNER.x + 40 + vg() * (INNER.w - 80), y = INNER.y + 40 + vg() * (INNER.h - 80);
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x + 30 + vg() * 50, y + 12); g.lineTo(x + 60, y - 10);
      g.stroke();
    }
  } else {
    // 虚空镜面：斜向镜带
    g.globalAlpha = .2;
    for (let i = -2; i < 8; i++) {
      g.fillStyle = i % 2 ? withAlpha('#c9a8ff', .35) : withAlpha('#78c9f7', .18);
      g.beginPath();
      const x = INNER.x + i * 190;
      g.moveTo(x, INNER.y); g.lineTo(x + 90, INNER.y);
      g.lineTo(x + 90 + INNER.h, INNER.bottom); g.lineTo(x + INNER.h, INNER.bottom);
      g.closePath(); g.fill();
    }
    g.globalAlpha = 1;
    // 镜面裂缝
    g.strokeStyle = withAlpha('#e0ccff', .35); g.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      let x = INNER.x + vg() * INNER.w, y = INNER.y + vg() * INNER.h;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 4; k++) {
        x += (vg() - .5) * 120; y += (vg() - .5) * 90;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    // 悬浮碎片
    for (let i = 0; i < 10; i++) {
      const x = INNER.x + 30 + vg() * (INNER.w - 60);
      const y = INNER.y + 30 + vg() * (INNER.h - 60);
      const s = 6 + vg() * 12;
      g.save(); g.translate(x, y); g.rotate(vg() * TAU);
      g.globalAlpha = .28 + vg() * .18;
      g.beginPath(); g.moveTo(0, -s); g.lineTo(s * .5, 0); g.lineTo(0, s); g.lineTo(-s * .5, 0);
      g.closePath(); g.fillStyle = '#c9a8ff'; g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
    // 中央倒影圆
    g.strokeStyle = withAlpha('#8a6bc4', .3); g.lineWidth = 3;
    g.beginPath(); g.ellipse(W / 2, INNER.y + INNER.h * .55, 190, 70, 0, 0, TAU); g.stroke();
  }
  g.restore();
  return bg;
};

      name: f.name,
      tier: f.tier,
      unlockLevel: f.unlockLevel || 1,
      radius: f.radius,
      art: f.art,
      hasArt: !!FORM_ART[f.art],
      tip: f.tip || '',
    }));
  };

  NYAN.skillSystems = function () {
    return {
      zones: V11_SK.zones.length,
      bees: V11_SK.bees.length,
      turrets: V11_SK.turrets.length,
      spirits: V11_SK.spirits.length,
      meteors: V11_SK.meteors.length,
      tornadoes: V11_SK.tornadoes.length,
      beams: V11_SK.beams.length,
      slashes: V11_SK.slashes.length,
      queued: V11_SK.queue.length,
      stacks: run ? Object.assign({}, run.upgradeStacks) : {},
      skillSt: run && run.skillSt ? {
        revivesUsed: run.skillSt.revivesUsed || 0,
        pierce: run.skillSt.pierce || 0,
      } : null,
    };
  };

  NYAN.changelogSummary = function () {
    const data = V11_CONFIG.changelog;
    if (!data || !Array.isArray(data.versions)) return { current: v11Version(), versions: [] };
    return {
      current: data.current,
      versions: data.versions.map(v => ({
        version: v.version,
        date: v.date,
        added: (v.added || []).length,
        improved: (v.improved || []).length,
        fixed: (v.fixed || []).length,
        known: (v.known || []).length,
      })),
    };
  };

  /* ---------------- 验收辅助 ---------------- */
  NYAN.spawnEnemyNow = function (type, x, y, delay) {
    if (!run || !room) return null;
    const e = spawnEnemy(type, Number(x) || W / 2, Number(y) || 300, Number(delay) || 0);
    return e ? { uid: e.uid, type: e.type, name: e.name, hp: e.hp, boss: e.boss } : null;
  };

  NYAN.spawnBossNow = function (chapter) {
    const n = clamp(Math.floor(Number(chapter) || 1), 1, Math.max(1, ENEMY_MODULES.length));
    const mod = ENEMY_MODULES[n - 1];
    const key = mod && mod.boss ? mod.boss : 'boss';
    const r = NYAN.spawnEnemyNow(key, W / 2, INNER.y + 160, 0);
    return { chapter: n, key, enemy: r };
  };

  NYAN.key = function (code, type) {
    const ev = new KeyboardEvent(type || 'keydown', { code, key: code === 'Escape' ? 'Escape' : code, bubbles: true, cancelable: true });
    window.dispatchEvent(ev);
    return state;
  };

  NYAN.setForm = function (n) {
    const f = clamp(Number(n) || 0, 0, FORMS.length - 1);
    if (player) {
      player.form = f;
      player.r = FORMS[f].radius;
      player.upgradeFx = .4;
    }
    return f;
  };

  // 兼容旧验收脚本：把新主页/新页面塞进 titleRects。
  NYAN.titleRects = function () {
    return {
      home: NYAN.homeRects(),
      modes: V11_MODE_RECTS.map(r => ({ ...r })),
      modeCards: V11_MODE_RECTS.map(r => ({ ...r })),
      slots: V11_SAVE_RECTS.map(r => ({ ...r })),
      save: V11_SAVE_RECTS.map(r => ({ ...r })),
      changelog: V11_CHANGELOG_RECTS.map(r => ({ ...r })),
      offline: cloneRect(V11_OFFLINE_RECT.r),
      settings: { ...titleSettingsRect },
      slotMenu: slotMenuRects.map(r => ({ ...r })),
      confirm: confirmRects.map(r => ({ ...r })),
      pause: pauseRects.map(r => ({ ...r })),
      between: betweenRects.map(r => ({ ...r })),
      exit: exitRects.map(r => ({ ...r })),
      bestiary: bestiaryRects.map(r => ({ ...r })),
      story: storyStageRects.map(r => ({ ...r })),
      settingsButtons: settingsRects.map(r => ({ ...r })),
    };
  };
})();

/* ================= v1.1 ONLINE LAYER 注入结束 ================= */

// 启动：先进入联网加载页，拉取 config/*.json 后才进入主页。
// 断网 / file:// / 配置损坏都会停在“本游戏需要网络”页，不会进入游戏。
applyViewScale();
lastFrame = performance.now();
requestAnimationFrame(frame);
v11BootGame();

})();
</script>
</body>
