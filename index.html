/* ---------------- 新攻击预警 ---------------- */
const V11_LEGACY_TELEGRAPH = drawEnemyTelegraph;
drawEnemyTelegraph = function (g, e, t) {
  if (!e || e.dead || e.spawnTimer > 0 || !player) {
    return V11_LEGACY_TELEGRAPH(g, e, t);
  }
  const active = Math.sin(t * 12) * .5 + .5;
  if (e.ai === 'bomber' && e.action === 'fuse') {
    const rad = 78 + e.r;
    const p = 1 - clamp(e.actionT / .85, 0, 1);
    g.save(); g.globalAlpha = .2 * active; g.fillStyle = e.color;
    g.beginPath(); g.arc(e.x, e.y, rad, 0, TAU); g.fill(); g.globalAlpha = 1;
    dashedCircle(g, e.x, e.y, rad * (.6 + p * .4), withAlpha(C.gold, .7), 5, [13, 9]);
    dashedCircle(g, e.x, e.y, rad, withAlpha(C.coral, .55), 3, [8, 10]);
    g.restore();
    return;
  }
  if (e.ai === 'sniper' && e.action === 'aim') {
    drawTelegraphLine(g, e, e.aimAngle || Math.atan2(player.y - e.y, player.x - e.x), 760, '#9fe8ff', active);
    return;
  }
  if (e.ai === 'roller' && e.action === 'roll') {
    drawTelegraphSpeedLines(g, e, e.chargeAngle, C.lavender, 5);
    return;
  }
  if (e.ai === 'bossSnow') {
    if (e.action === 'windIcicles') {
      const p = 1 - clamp(e.actionT / .65, 0, 1);
      for (let i = 0; i < 5; i++) drawTelegraphLine(g, e, Math.atan2(player.y - e.y, player.x - e.x) + (i - 2) * .18, 380 + p * 120, '#bfefff', active);
      dashedCircle(g, e.x, e.y, e.r * 1.5 + p * 40, withAlpha('#bfefff', .5), 4, [12, 10]);
      return;
    }
    if (e.action === 'windBlizzard') {
      const p = 1 - clamp(e.actionT / .7, 0, 1);
      dashedCircle(g, e.x, e.y, 300 * easeOut(p), withAlpha('#dff6ff', .65), 6, [15, 10]);
      g.save(); g.globalAlpha = .15 * active; g.fillStyle = '#dff6ff';
      g.beginPath(); g.arc(e.x, e.y, 300, 0, TAU); g.fill(); g.restore();
      return;
    }
    if (e.action === 'windSummon') {
      for (let i = 0; i < 2; i++) {
        const a = t * 2 + i * Math.PI;
        dashedCircle(g, e.x + Math.cos(a) * e.r * .8, e.y + Math.sin(a) * e.r * .5, e.r * .5, withAlpha('#ffffff', .5), 3, [8, 8]);
      }
      return;
    }
  }
  if (e.ai === 'bossVoid') {
    if (e.action === 'windPulse') {
      const p = 1 - clamp(e.actionT / .65, 0, 1);
      for (let i = 0; i < 3; i++) dashedCircle(g, e.x, e.y, (250 + i * 40) * easeOut(p), withAlpha(C.lavender, .45 + i * .1), 4, [16, 12]);
      return;
    }
    if (e.action === 'windMirror') {
      for (let i = 0; i < 4; i++) {
        const a = t * 1.2 + i * TAU / 4;
        g.save(); g.globalAlpha = .45;
        drawStar(g, e.x + Math.cos(a) * e.r * 1.2, e.y + Math.sin(a) * e.r * .8, e.r * .18, e.r * .07, 4, C.lavender, null, 0, a);
        g.restore();
      }
      return;
    }
    if (e.action === 'warp') {
      dashedCircle(g, e.x, e.y, e.r * 1.7, withAlpha(C.lavender, .65 + active * .2), 5, [10, 8]);
      return;
    }
  }
  return V11_LEGACY_TELEGRAPH(g, e, t);
};

const V11_LEGACY_PROJ_COLOR = projectileColorFor;
projectileColorFor = function (e) {

    case 'ink': return '#5b3f78';

const V11_NEW_PROJ_KINDS = new Set(['frost', 'snow', 'ink', 'mirror', 'static', 'void']);
const V11_LEGACY_DRAW_PROJECTILE = drawProjectile;

drawProjectile = function (g, pr) {
  if (!pr || pr.friendly || !V11_NEW_PROJ_KINDS.has(pr.kind)) return V11_LEGACY_DRAW_PROJECTILE(g, pr);
  const r = pr.radius;
  g.save();
  g.translate(pr.x, pr.y);
  g.rotate(pr.rot);
  // 尾迹
  g.globalAlpha = .34;
  g.fillStyle = withAlpha(pr.color, .55);
  g.beginPath(); g.arc(-r * 1.2, 0, r * 1.1, 0, TAU); g.fill();
  g.globalAlpha = 1;
  if (pr.kind === 'frost') {
    // 六角冰晶
    g.strokeStyle = C.ink; g.lineWidth = 2.2;
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      g.beginPath();
      g.moveTo(-Math.cos(a) * r * 1.15, -Math.sin(a) * r * 1.15);
      g.lineTo(Math.cos(a) * r * 1.15, Math.sin(a) * r * 1.15);
      g.stroke();
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(Math.cos(a) * r * .45 * s, Math.sin(a) * r * .45 * s);
        g.lineTo(Math.cos(a + .7) * r * .8 * s, Math.sin(a + .7) * r * .8 * s);
        g.stroke();
      }
    }
    circle(g, 0, 0, r * .34, C.white, C.ink, 1.8);
  } else if (pr.kind === 'snow') {
    circle(g, 0, 0, r, '#f8feff', C.ink, 2.8);
    g.globalAlpha = .4; circle(g, -r * .3, -r * .3, r * .35, C.white, null, 0); g.globalAlpha = 1;
  } else if (pr.kind === 'ink') {
    g.fillStyle = '#3a2451'; g.strokeStyle = C.ink; g.lineWidth = 2.4;
    g.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      const rr = r * (i % 2 ? .78 : 1.12);
      i === 0 ? g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill(); g.stroke();
    circle(g, r * .2, -r * .25, r * .18, withAlpha(C.cream, .55), null, 0);
  } else if (pr.kind === 'mirror') {
    g.fillStyle = withAlpha(C.lavender, .85); g.strokeStyle = C.ink; g.lineWidth = 2.6;
    g.beginPath();
    g.moveTo(0, -r * 1.2); g.lineTo(r * .78, 0); g.lineTo(0, r * 1.2); g.lineTo(-r * .78, 0);
    g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = withAlpha(C.cream, .8); g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-r * .3, -r * .4); g.lineTo(r * .1, r * .3); g.stroke();
  } else if (pr.kind === 'static') {
    g.strokeStyle = C.gold; g.lineWidth = 2.6;
    let x = -r, y = 0;
    g.beginPath(); g.moveTo(x, y);
    for (let i = 0; i < 4; i++) { x += r * .5; y = (i % 2 ? -1 : 1) * r * .55; g.lineTo(x, y); }
    g.stroke();
    circle(g, 0, 0, r * .72, '#fff6c9', C.ink, 2.2);
    circle(g, r * .15, -r * .1, r * .22, C.ink, null, 0);
  } else {
    // void
    g.fillStyle = '#1a0b2c'; g.strokeStyle = C.lavender; g.lineWidth = 2.2;
    circle(g, 0, 0, r, '#1a0b2c', C.lavender, 2.2);
    g.globalAlpha = .8;
    g.strokeStyle = withAlpha(C.cream, .7); g.lineWidth = 1.4;
    g.beginPath(); g.ellipse(0, 0, r * 1.35, r * .45, .5, 0, TAU); g.stroke();
    g.globalAlpha = 1;
    circle(g, 0, 0, r * .3, C.lavender, null, 0);
  }
  g.restore();
};

/* ---------------- 新音色（猫系搞笑，降刺耳高频） ---------------- */
const V11_LEGACY_SFX = sfx;
sfx = function (name, pitch = 1) {
  if (!audioCtx || muted) return V11_LEGACY_SFX(name, pitch);
  const now = audioCtx.currentTime;
  if (sfxLast[name] && now - sfxLast[name] < .045) return;
  if (name === 'frost') {
    sfxLast[name] = now;
    meow(560 * pitch, .14, .13, 0, 'sad');
    tone(1180 * pitch, .16, 'sine', .1, -220, .02, 'sfx', 3000);
    noise(.16, .07, 0, 2400);
    return;
  }
  if (name === 'thunder') {
    sfxLast[name] = now;
    noise(.16, .16, 0, 1800);
    tone(92, .24, 'sawtooth', .14, -40, .01, 'sfx', 800);
    tone(620 * pitch, .1, 'square', .1, 120, 0, 'sfx', 1800);
    return;
  }
  if (name === 'roar') {
    sfxLast[name] = now;
    meow(330 * pitch, .32, .3, 0, 'fierce');
    tone(110, .3, 'sawtooth', .16, 25, .02, 'sfx', 700);
    noise(.24, .1, .05, 600);
    return;
  }
  if (name === 'gravity') {
    sfxLast[name] = now;
    meow(420 * pitch, .22, .13, 0, 'sad');
    tone(150, .38, 'sine', .14, -70, 0, 'sfx', 900);
    noise(.3, .07, 0, 700);
    return;
  }
  if (name === 'void') {
    sfxLast[name] = now;
    meow(380 * pitch, .3, .19, 0, 'sad');
    tone(180, .4, 'triangle', .12, -50, .02, 'sfx', 1100);
    noise(.3, .06, .08, 550);
    return;
  }
  if (name === 'explode') {
    sfxLast[name] = now;
    noise(.3, .22, 0, 700);
    tone(96, .26, 'square', .2, -50, 0, 'sfx', 620);
    meow(900, .16, .12, .1, 'fierce');
    return;
  }
  return V11_LEGACY_SFX(name, pitch);
};

/* ---------------- 第 4/5 章场景背景 ---------------- */
const V11_LEGACY_BUILD_BG = buildRoomBackground;
buildRoomBackground = function (room) {
  const bg = V11_LEGACY_BUILD_BG(room);
  if (!room || !room.theme || !bg) return bg;
  const style = room.theme.style;
  if (style !== 'frost' && style !== 'void') return bg;
  const g = bg.getContext('2d');
  const seed = hashSeed(run.seed, (room.stage || 1) * 977, (room.number || 1) * 311);
  const vg = seeded(seed);
  g.save();
  g.lineJoin = 'round';
  if (style === 'frost') {
    // 顶部冰锥
    for (let x = INNER.x + 40; x < INNER.right - 20; x += 74) {
      const len = 18 + vg() * 34;
      g.beginPath();
      g.moveTo(x - 11, INNER.y + 2);
      g.lineTo(x + 2 + vg() * 6, INNER.y + len);
      g.lineTo(x + 11, INNER.y + 2);
      g.closePath();
      g.fillStyle = withAlpha('#e8fbff', .55);
      g.fill();
      g.strokeStyle = withAlpha('#5f9cb8', .35); g.lineWidth = 1.5; g.stroke();
    }
    // 雪堆
    for (let i = 0; i < 8; i++) {
      const x = INNER.x + 50 + vg() * (INNER.w - 100);
      const y = INNER.bottom - 8 - vg() * 16;
      g.beginPath(); g.ellipse(x, y, 26 + vg() * 40, 8 + vg() * 10, 0, 0, TAU);
      g.fillStyle = withAlpha('#ffffff', .18 + vg() * .12); g.fill();
    }
    // 冰面反光
    for (let i = 0; i < 12; i++) {
      const x = INNER.x + vg() * INNER.w, y = INNER.y + vg() * INNER.h;
      drawStar(g, x, y, 3 + vg() * 6, 1.4, 6, withAlpha('#ffffff', .28 + vg() * .2), null, 0, vg() * TAU);
    }
    g.strokeStyle = withAlpha('#ffffff', .16); g.lineWidth = 1.4;
    for (let i = 0; i < 6; i++) {
      const x = INNER.x + 40 + vg() * (INNER.w - 80), y = INNER.y + 40 + vg() * (INNER.h - 80);
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x + 30 + vg() * 50, y + 12); g.lineTo(x + 60, y - 10);
      g.stroke();
    }
  } else {
    // 虚空镜面：斜向镜带
    g.globalAlpha = .2;
    for (let i = -2; i < 8; i++) {
      g.fillStyle = i % 2 ? withAlpha('#c9a8ff', .35) : withAlpha('#78c9f7', .18);
      g.beginPath();
      const x = INNER.x + i * 190;
      g.moveTo(x, INNER.y); g.lineTo(x + 90, INNER.y);
      g.lineTo(x + 90 + INNER.h, INNER.bottom); g.lineTo(x + INNER.h, INNER.bottom);
      g.closePath(); g.fill();
    }
    g.globalAlpha = 1;
    // 镜面裂缝
    g.strokeStyle = withAlpha('#e0ccff', .35); g.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      let x = INNER.x + vg() * INNER.w, y = INNER.y + vg() * INNER.h;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 4; k++) {
        x += (vg() - .5) * 120; y += (vg() - .5) * 90;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    // 悬浮碎片
    for (let i = 0; i < 10; i++) {
      const x = INNER.x + 30 + vg() * (INNER.w - 60);
      const y = INNER.y + 30 + vg() * (INNER.h - 60);

      g.restore();
    }
    g.globalAlpha = 1;
    // 中央倒影圆
    g.strokeStyle = withAlpha('#8a6bc4', .3); g.lineWidth = 3;
    g.beginPath(); g.ellipse(W / 2, INNER.y + INNER.h * .55, 190, 70, 0, 0, TAU); g.stroke();
  }

/* ---------------- 触控配置（独立 localStorage 键） ---------------- */
const V11_TOUCH_CFG_KEY = 'weimiaoxunmiao_touchcfg_v1';

const V11_TOUCH_CFG = {};

function v11LoadTouchCfg() {
  Object.assign(V11_TOUCH_CFG, V11_TOUCH_CFG_DEF);
  try {
    const raw = localStorage.getItem(V11_TOUCH_CFG_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        const num = (v, def, a, b) => { const n = Number(v); return Number.isFinite(n) ? clamp(n, a, b) : def; };
        V11_TOUCH_CFG.joyScale = num(p.joyScale, 1, .7, 1.5);
        V11_TOUCH_CFG.rightScale = num(p.rightScale, 1, .7, 1.5);
        V11_TOUCH_CFG.joyAx = num(p.joyAx, V11_TOUCH_CFG_DEF.joyAx, 0, 1);
        V11_TOUCH_CFG.joyAy = num(p.joyAy, V11_TOUCH_CFG_DEF.joyAy, 0, 1);
        V11_TOUCH_CFG.rightAx = num(p.rightAx, V11_TOUCH_CFG_DEF.rightAx, 0, 1);
        V11_TOUCH_CFG.rightAy = num(p.rightAy, V11_TOUCH_CFG_DEF.rightAy, 0, 1);
      }
    }
  } catch (e) { /* 损坏的配置回退默认 */ }
}
function v11PersistTouchCfg() {
  try {
    localStorage.setItem(V11_TOUCH_CFG_KEY, JSON.stringify({
      joyScale: V11_TOUCH_CFG.joyScale, joyAx: V11_TOUCH_CFG.joyAx, joyAy: V11_TOUCH_CFG.joyAy,
      rightScale: V11_TOUCH_CFG.rightScale, rightAx: V11_TOUCH_CFG.rightAx, rightAy: V11_TOUCH_CFG.rightAy,
    }));
  } catch (e) { /* 忽略 */ }
}

/* ---------------- 布局计算（覆盖 v11SyncTouchLayout） ---------------- */
const V11F_LEGACY_SYNC_TOUCH = v11SyncTouchLayout;
v11SyncTouchLayout = function () {
  const s = V11_TOUCH_CFG;
  TOUCH_JOY.r = 76 * s.joyScale;
  TOUCH_JOY.knob = 30 * s.joyScale;
  TOUCH_ATTACK.r = 58 * s.rightScale;
  TOUCH_DASH.r = 42 * s.rightScale;

  // 锚点（逻辑坐标）先按配置换算，再按“半屏硬边界 + 避开 HUD”夹取。
  TOUCH_JOY.x = s.joyAx * W;
  TOUCH_JOY.y = s.joyAy * H;
  TOUCH_ATTACK.x = s.rightAx * W;
  TOUCH_ATTACK.y = s.rightAy * H;

  // 左半区：摇杆整圆不得越过中线，中心最低 76 以避开 HUD 左面板。
  const joyMinX = clamp(W / 2 - TOUCH_JOY.r, 76, W / 2 - 76);
  TOUCH_JOY.x = clamp(TOUCH_JOY.x, 76, Math.max(76, joyMinX));
  TOUCH_JOY.y = clamp(TOUCH_JOY.y, 150, H - 84);

  // 右半区：攻击整圆不得越过中线。
  TOUCH_ATTACK.x = clamp(TOUCH_ATTACK.x, Math.min(W / 2 + TOUCH_ATTACK.r, W - 76), W - 76);
  TOUCH_ATTACK.y = clamp(TOUCH_ATTACK.y, 150, H - 96);

  // 冲刺相对攻击偏移（−124, +68）× 缩放，同样夹在右半区。
  TOUCH_DASH.x = clamp(TOUCH_ATTACK.x - 124 * s.rightScale, W / 2 + TOUCH_DASH.r, W - 76);
  TOUCH_DASH.y = clamp(TOUCH_ATTACK.y + 68 * s.rightScale, 150, H - 96);

  if (touchState.joyId === null) {
    touchState.joyX = TOUCH_JOY.x;
    touchState.joyY = TOUCH_JOY.y;
    touchState.joyBaseX = TOUCH_JOY.x;
    touchState.joyBaseY = TOUCH_JOY.y;
  }

/* 修改配置 → 夹取 → 同步实体 → 写盘（拖动/滑杆/重置共用）。 */
function v11ApplyTouchCfg() {
  const s = V11_TOUCH_CFG;
  s.joyScale = clamp(Math.round(s.joyScale * 20) / 20, .7, 1.5);
  s.rightScale = clamp(Math.round(s.rightScale * 20) / 20, .7, 1.5);
  s.joyAx = clamp(s.joyAx, 0, 1);
  s.joyAy = clamp(s.joyAy, 0, 1);
  s.rightAx = clamp(s.rightAx, 0, 1);
  s.rightAy = clamp(s.rightAy, 0, 1);

  v11SyncTouchLayout();
}
function v11SetTouchScale(zone, v) {
  if (zone === 'joy') V11_TOUCH_CFG.joyScale = v;
  else V11_TOUCH_CFG.rightScale = v;

const V11F_LEGACY_UPDATE_JOY = updateJoystick;
updateJoystick = function (pt) {
  const active = touchState.joyId !== null;
  const baseX = active ? touchState.joyBaseX : TOUCH_JOY.x;
  const baseY = active ? touchState.joyBaseY : TOUCH_JOY.y;
  let dx = pt.x - baseX, dy = pt.y - baseY;
  const max = TOUCH_JOY.r - TOUCH_JOY.knob * .4;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  touchState.joyX = baseX + dx;
  touchState.joyY = baseY + dy;
  const mag = Math.min(1, len / max);
  const nlen = Math.hypot(dx, dy);
  const norm = nlen > .001 ? { x: dx / nlen, y: dy / nlen } : { x: 0, y: 0 };
  touchState.vec.x = norm.x * mag;
  touchState.vec.y = norm.y * mag;
};

    if (hit === 'done') { state = 'settings'; settingsDrag = null; clearInput(); sfx('click'); return; }
    if (hit === 'reset') { v11ResetTouchCfg(); return; }
    if (hit === 'joy' || hit === 'right') { V11_TE.zone = hit; V11_TE.dragId = ev.pointerId; }
    return;
  }

  // 非战斗界面：交给共用 UI 点击逻辑。
  if (state !== 'playing' && state !== 'transition') {
    handleDown({ button: 0, clientX: ev.clientX, clientY: ev.clientY, preventDefault() {} });
    return;
  }

  // 战斗界面：右上角齿轮 → 设置面板。
  if (pointRect(pt, V11_HUD_GEAR)) {
    openSettings('playing');
    return;
  }

  // 左半屏（避开顶部 HUD）：任意位置按下即出摇杆；已有摇杆的手指不再重复。
  if (pt.x < W / 2 && pt.y > 110) {
    if (touchState.joyId === null) {
      touchState.joyId = ev.pointerId;
      touchState.joyBaseX = pt.x;
      touchState.joyBaseY = pt.y;
      updateJoystick(pt);
    }
    return;
  }

  // 右半屏：攻击 / 冲刺热区（命中半径随缩放扩大）；空白 = 朝方向挥爪。
  if (touchState.attackId === null && Math.hypot(pt.x - TOUCH_ATTACK.x, pt.y - TOUCH_ATTACK.y) <= TOUCH_ATTACK.r + 18) {
    touchState.attackId = ev.pointerId;
    touchState.attackHeld = true;
    return;
  }
  if (touchState.dashId === null && Math.hypot(pt.x - TOUCH_DASH.x, pt.y - TOUCH_DASH.y) <= TOUCH_DASH.r + 18) {
    touchState.dashId = ev.pointerId;
    if (clickCooldown <= 0 && state === 'playing') tryDash();
    return;
  }
  mouse.x = clamp(pt.x, 0, W); mouse.y = clamp(pt.y, 0, H); mouse.inside = true;
  if (player && !player.dead) {
    player.aim = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    if (state === 'playing' && player.attackTimer <= 0) performAttack();
  }
};

const V11F_LEGACY_TOUCH_MOVE = handleTouchMove;

};

/* ---------------- §2 touchEdit：拖动定位控制区 ---------------- */
function v11OpenTouchEdit(zone) {
  V11_TE.zone = zone === 'right' ? 'right' : 'joy';
  V11_TE.dragId = null;
  state = 'touchEdit';
  settingsDrag = null;
  clearInput();
  sfx('click');
}

function v11TouchEditMove(pt) {
  if (V11_TE.zone === 'joy') {
    V11_TOUCH_CFG.joyAx = pt.x / W;
    V11_TOUCH_CFG.joyAy = pt.y / H;
  } else {
    V11_TOUCH_CFG.rightAx = pt.x / W;
    V11_TOUCH_CFG.rightAy = pt.y / H;
  }
  v11ApplyTouchCfg();
}

function v11TouchEditHit(pt) {
  if (V11_TE_RECTS.done && pointRect(pt, V11_TE_RECTS.done)) return 'done';
  if (V11_TE_RECTS.reset && pointRect(pt, V11_TE_RECTS.reset)) return 'reset';
  const joyR = Math.max(TOUCH_JOY.r + 42, 92);
  if (Math.hypot(pt.x - TOUCH_JOY.x, pt.y - TOUCH_JOY.y) <= joyR) return 'joy';
  const rightR = Math.max(TOUCH_ATTACK.r + 42, 84);
  if (Math.hypot(pt.x - TOUCH_ATTACK.x, pt.y - TOUCH_ATTACK.y) <= rightR) return 'right';
  return null;
}

  if (selRight) {

/* ---------------- §2/§4 handleDown 覆盖：齿轮 / touchEdit / gameover ---------------- */
const V11F_LEGACY_HANDLE_DOWN = handleDown;
handleDown = function (ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  updatePointer(ev);
  initAudio();
  const st = state;

  if (st === 'touchEdit') {
    const hit = v11TouchEditHit(mouse);
    if (hit === 'done') { state = 'settings'; settingsDrag = null; clearInput(); sfx('click'); }
    else if (hit === 'reset') { v11ResetTouchCfg(); }
    else if (hit === 'joy' || hit === 'right') { V11_TE.zone = hit; V11_TE.dragId = 'mouse'; }
    return;
  }

  if (st === 'playing' && run && player && pointRect(mouse, V11_HUD_GEAR)) {
    sfx('click');
    openSettings('playing');
    return;
  }

  if (st === 'gameover') {
    if (pointRect(mouse, V11_GAMEOVER_RECTS.restart)) {
      sfx('click');
      restartCurrentStage();
      clearInput();
    } else if (pointRect(mouse, V11_GAMEOVER_RECTS.saveLeave)) {
      sfx('click');
      exitCurrentMode(true);
    } else if (pointRect(mouse, V11_GAMEOVER_RECTS.noSaveLeave)) {
      sfx('click');
      exitCurrentMode(false);
    }
    return;
  }

  V11F_LEGACY_HANDLE_DOWN(ev);
};

/* ---------------- 键盘：T 开设置 / touchEdit Esc 返回 ---------------- */
window.addEventListener('keydown', ev => {
  if (ev.code === 'KeyT' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    if (state === 'playing') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      openSettings('playing');
    }
    return;
  }
  if (ev.code === 'Escape' && state === 'touchEdit') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    state = 'settings';
    settingsDrag = null;
    clearInput();
    sfx('click');
  }
}, true);

window.addEventListener('mousemove', () => {
  if (state === 'touchEdit' && V11_TE.dragId === 'mouse') v11TouchEditMove({ x: mouse.x, y: mouse.y });
});
window.addEventListener('mouseup', () => {
  if (V11_TE.dragId === 'mouse') V11_TE.dragId = null;
});

setSettingsSliderFromPointer = function (type) {
  if (type === 'touchJoyScale' || type === 'touchRightScale') {
    const rect = settingsRects.find(r => r.type === type);
    if (!rect) return;
    const ratio = clamp((mouse.x - rect.trackX) / Math.max(1, rect.trackW), 0, 1);
    let v = rect.min + (rect.max - rect.min) * ratio;
    v = Math.round(v * 20) / 20;
    v11SetTouchScale(type === 'touchJoyScale' ? 'joy' : 'right', v);
    sfx('click');
    return;
  }
  V11F_LEGACY_SLIDER(type);
};

const V11G_DARK_FILL = {
  '#251733': '#fff3dc', '#21152f': '#fff3dc', '#221531': '#fff3dc',

  '37,23,51': 1, '33,21,47': 1, '26,16,38': 1, '23,14,36': 1,
  '21,13,32': 1, '42,24,48': 1, '34,24,39': 1, '59,43,76': 1,
  '34,21,49': 1, '38,24,53': 1, // 模式页 / 剧情选关页卡片（rgba 形式）
};
let V11G_BRIGHT = false;

function v11gMapText(c) {
  if (!V11G_BRIGHT || typeof c !== 'string') return c;
  const low = c.toLowerCase();
  if (low === '#fff4db' || low === '#fffaf0' || low === '#ffe8b8') return V11_THEME.ink;
  if (low === '#ffcc4d') return C.goldDeep;
  if (low === '#7be0c1') return C.mintDeep;
  if (low === '#c4abff') return '#7a5ccc';
  if (low === '#ffb2c9' || low === '#ffd9e2') return C.coralDeep;
  const m = c.replace(/\s/g, '').match(/^rgba\(255,244,219,([\d.]+)\)$/i);
  if (m) return `rgba(43,32,48,${m[1]})`;
  return c;
}

function v11gMapFill(c) {
  if (!V11G_BRIGHT || typeof c !== 'string') return c;
  const clean = c.replace(/\s/g, '');
  const m = clean.match(/^rgba\((\d+),(\d+),(\d+),([\d.]+)\)$/i);
  if (m) {
    const rgb = `${+m[1]},${+m[2]},${+m[3]}`;
    if (rgb === '255,244,219') return `rgba(43,32,48,${Math.min(.18, +m[4] * .6)})`;
    if (V11G_DARK_RGBA[rgb]) return `rgba(255,243,220,${+m[4]})`;
    return c;
  }
  return V11G_DARK_FILL[clean.toLowerCase()] || c;
}

/* 亮底上“深墨填充 + 默认深墨描边”会把标题糊成一块墨：这类描边改暖白。
   只处理“填充与描边都不够亮”的情况，彩色描边、金色大字保持原样。 */
const V11G_DARK_TEXT = { '#241a2e': 1, '#2b2030': 1, '#4a3956': 1, '#32243f': 1, '#171020': 1 };
function v11gIsDarkInk(c) {
  if (typeof c !== 'string') return false;
  const clean = c.replace(/\s/g, '').toLowerCase();
  if (V11G_DARK_TEXT[clean]) return true;
  const m = clean.match(/^rgba\((\d+),(\d+),(\d+),([\d.]+)\)$/i);
  if (m) return (+m[1] * .2126 + +m[2] * .7152 + +m[3] * .0722) < 90;
  return false;
}

function v11gMenuFontSize(size) {
  if (typeof V11_PROFILE === 'undefined' || !V11_PROFILE || !V11_PROFILE.mobile) return size;
  if (V11G_MENU_STATES.indexOf(state) === -1) return size;

function v11gBgGradients(g) {
  const key = W + 'x' + H;
  if (V11G_BG_GRAD.ctx !== g || V11G_BG_GRAD.key !== key) {
    const base = g.createLinearGradient(0, 0, 0, H);

    const bottom = g.createLinearGradient(0, H - 300, 0, H);

    V11G_BG_GRAD.ctx = g;
    V11G_BG_GRAD.key = key;
    V11G_BG_GRAD.base = base;

function v11gEnsureDomGear() {
  if (!IS_TOUCH_DEVICE || v11gDomGear) return;

    ].join(';');

      // v1.1.3 补充项：不再闪金色底，按住 / 松开视觉完全一致。
    }, { passive: false });
    document.body.appendChild(btn);
    v11gDomGear = btn;
    v11gSyncDomGear();
  } catch (e) { v11gDomGear = null; }
}

function v11gSyncDomGear() {
  if (!v11gDomGear) return;
  const show = IS_TOUCH_DEVICE && !v11IsPortraitMobile() &&
    ['playing', 'transition', 'paused'].includes(state);
  if (!show) { v11gDomGear.style.display = 'none'; return; }
  const r = canvas.getBoundingClientRect();
  const k = Math.min(r.width / W, r.height / H);
  const wCss = Math.max(96, V11_GEAR_PILL.w * k);
  const hCss = Math.max(48, V11_GEAR_PILL.h * k);
  const cx = r.left + (r.width - W * k) / 2 + (V11_GEAR_PILL.x + V11_GEAR_PILL.w / 2) * k;
  const cy = r.top + (r.height - H * k) / 2 + (V11_GEAR_PILL.y + V11_GEAR_PILL.h / 2) * k;
  const maxLeft = r.left + Math.max(0, r.width - wCss);
  const maxTop = r.top + Math.max(0, r.height - hCss);
  const left = clamp(cx - wCss / 2, r.left, maxLeft);
  const top = clamp(cy - hCss / 2, r.top, maxTop);
  v11gDomGear.style.display = 'block';
  v11gDomGear.style.left = Math.round(left) + 'px';
  v11gDomGear.style.top = Math.round(top) + 'px';
  v11gDomGear.style.width = Math.round(wCss) + 'px';
  v11gDomGear.style.height = Math.round(hCss) + 'px';
}
window.addEventListener('resize', () => { v11gSyncDomGear(); });

  }
  if (st === 'paused' && pointRect(mouse, V11_GEAR_PILL)) {
    v11GPress('hud');
    sfx('click');
    openSettings('paused');
    return;
  }
  if (st === 'modeSelect' && pointRect(mouse, V11_MODE_SETTINGS_RECT)) {
    v11GPress('mode');
    sfx('click');
    V11G_SETTINGS_BACK = 'modeSelect';
    openSettings('title');
    return;

  V11G_LEGACY_HANDLE_DOWN(ev);

    for (const k of Object.keys(V11_HOME_RECTS)) {
      if (V11_HOME_RECTS[k] && pointRect(mouse, V11_HOME_RECTS[k])) { v11GPress(k); break; }
    }
  }
};

const V11H_CHAR_KEY = 'weimiaoxunmiao_char_v1';
const V11H_PHOTO_KEY = 'weimiaoxunmiao_photo_v1';
let V11_CHAR = { kind: 'preset', id: 'cream' };
let V11_PHOTO = null;          // JPEG dataURL
let V11_PHOTO_IMG = null;      // 解码后的 Image
let V11H_PHOTO_ERROR = null;
let V11H_LAST_PRESET = 'cream';

function v11hCurrentCat() {
  if (V11_CHAR.kind === 'photo') return { id: 'photo', name: '照片猫猫', tier: '自定义' };
  return v11CatById(V11_CHAR.id);
}

function v11hReadChar() {
  try {
    const raw = localStorage.getItem(V11H_CHAR_KEY);
    if (!raw) return { kind: 'preset', id: 'cream' };
    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== 'object') return { kind: 'preset', id: 'cream' };
    if (obj.kind === 'photo') return { kind: 'photo' };
    if (obj.kind === 'preset' && V11_CATS.some(c => c.id === obj.id)) return { kind: 'preset', id: obj.id };
  } catch (e) { /* 坏 JSON：回落默认，不重写旧数据 */ }
  return { kind: 'preset', id: 'cream' };
}

function v11hSaveChar() {
  try { localStorage.setItem(V11H_CHAR_KEY, JSON.stringify(V11_CHAR)); } catch (e) { /* 存满时静默 */ }
}

function v11hReadPhoto() {
  try {
    const raw = localStorage.getItem(V11H_PHOTO_KEY);
    if (!raw || typeof raw !== 'string') return null;
    if (!/^data:image\/jpeg;base64,/i.test(raw)) return null;
    // 只校验“确实是 JPEG + 字节数不为 0”，不设过高门槛：
    // 纯色/像素风小图压缩后可能只有 1~2KB，也应当能正常还原。
    if (v11hDataUrlBytes(raw) < 256) return null;
    return raw;
  } catch (e) { return null; }
}

function v11hDataUrlBytes(dataUrl) {
  if (typeof dataUrl !== 'string') return 0;
  const comma = dataUrl.indexOf(',');
  if (comma < 0) return 0;
    const b64 = dataUrl.slice(comma + 1);
  let pad = 0;
  if (b64.endsWith('==')) pad = 2;
  else if (b64.endsWith('=')) pad = 1;
  return Math.max(0, Math.floor(b64.length * 3 / 4) - pad);
}

function v11hSyncFormNames() {
  if (V11_CHAR.kind === 'photo') {
    for (let i = 0; i < 3 && i < FORMS.length; i++) FORMS[i].name = '照片猫猫';
    return;
  }
  const cat = v11hCurrentCat();
  for (let i = 0; i < 3 && i < FORMS.length; i++) FORMS[i].name = v11hStageName(cat, i);
}

function v11hSetPreset(id, opts) {
  if (!V11_CATS.some(c => c.id === id)) id = 'cream';
  V11_CHAR = { kind: 'preset', id };
  V11H_LAST_PRESET = id;
  v11hSaveChar();
  v11hSyncFormNames();
  if (!opts || !opts.silent) showToast('已换上「' + v11CatById(id).name + '」· 战斗内立即生效', C.gold, 2.2);
  sfx('click');
  return V11_CHAR;
}

function v11hUsePhoto(opts) {
  if (!V11_PHOTO) {
    if (!opts || !opts.silent) showToast('还没有照片主角 · 先导入一张照片', C.coral, 2.4);
    return { ok: false, error: 'no-photo' };
  }
  V11_CHAR = { kind: 'photo' };
  v11hSaveChar();
  v11hSyncFormNames();
  if (!opts || !opts.silent) showToast('照片主角已上场 · 进化时会叠上猫耳与战甲', C.mint, 2.3);
  sfx('click');
  return { ok: true };
}

let V11H_CLEAR_ARMED = 0;
function v11hClearPhoto(opts) {
  if (!V11_PHOTO) return { ok: false, error: 'no-photo' };
  const force = !!(opts && opts.force);
  if (!force && performance.now() - V11H_CLEAR_ARMED > 2500) {
    V11H_CLEAR_ARMED = performance.now();
    if (!opts || !opts.silent) showToast('再点一次「删除照片」确认（不会删除内置猫）', C.coral, 2.6);
    return { ok: false, error: 'need-confirm' };
  }
  V11H_CLEAR_ARMED = 0;
  try { localStorage.removeItem(V11H_PHOTO_KEY); } catch (e) { /* 忽略 */ }
  V11_PHOTO = null;
  V11_PHOTO_IMG = null;
  V11H_PHOTO_ERROR = null;
  if (V11_CHAR.kind === 'photo') {
    V11_CHAR = { kind: 'preset', id: V11H_LAST_PRESET || 'cream' };
    v11hSaveChar();
    v11hSyncFormNames();
  }
  if (!opts || !opts.silent) showToast('照片主角已删除 · 已回到「' + v11hCurrentCat().name + '」', C.mint, 2.2);
  sfx('click');
  return { ok: true };
}

function v11hPhotoMeta() {
  if (!V11_PHOTO) return { exists: false, bytes: 0, w: 0, h: 0, ready: false };
  return {
    exists: true,
    bytes: v11hDataUrlBytes(V11_PHOTO),
    w: 256, h: 256,
    ready: !!V11_PHOTO_IMG,
    error: V11H_PHOTO_ERROR,
  };
}

function v11hDecodePhoto(dataUrl) {
  return new Promise((resolve, reject) => {
    try {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('照片解码失败'));
      img.src = dataUrl;
    } catch (e) { reject(e); }
  });
}

function v11hApplyPhoto(dataUrl) {
  V11_PHOTO = dataUrl;
  V11H_PHOTO_ERROR = null;
  v11hDecodePhoto(dataUrl).then(img => {
    V11_PHOTO_IMG = img;
  }).catch(() => {
    V11_PHOTO_IMG = null;
    V11H_PHOTO_ERROR = 'decode';
  });
}

/* ---------------- 3. 照片导入流水线 ---------------- */
function v11hReadFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    try {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => reject(new Error('读取文件失败'));
      fr.readAsDataURL(file);
    } catch (e) { reject(e); }
  });
}

/* 256×256 居中裁切 → 饱和/对比增强 → 轻微像素化 → JPEG 阶梯压缩。 */
function v11hProcessPhoto(img) {
  const SIZE = 256;
  const SMALL = 72;
  const work = document.createElement('canvas');
  work.width = SMALL; work.height = SMALL;
  const wc = work.getContext('2d');
  const iw = img.naturalWidth || img.width || 1;
  const ih = img.naturalHeight || img.height || 1;
  const cover = Math.max(SMALL / iw, SMALL / ih);
  const dw = iw * cover, dh = ih * cover;
  wc.imageSmoothingEnabled = true;
  wc.drawImage(img, (SMALL - dw) / 2, (SMALL - dh) / 2, dw, dh);

  let imgData = null;
  try { imgData = wc.getImageData(0, 0, SMALL, SMALL); } catch (e) { imgData = null; }
  if (imgData) {
    const px = imgData.data;
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i], g = px[i + 1], b = px[i + 2];
      const lum = r * .2126 + g * .7152 + b * .0722;
      // 饱和度 1.45 + 对比 1.12 + 亮度 +6
      let nr = lum + (r - lum) * 1.45;
      let ng = lum + (g - lum) * 1.45;
      let nb = lum + (b - lum) * 1.45;
      nr = (nr - 128) * 1.12 + 128 + 6;
      ng = (ng - 128) * 1.12 + 128 + 6;
      nb = (nb - 128) * 1.12 + 128 + 6;
      // 轻像素卡通化：6 级色阶
      px[i] = clamp(Math.round(nr / 17) * 17, 0, 255);
      px[i + 1] = clamp(Math.round(ng / 17) * 17, 0, 255);
      px[i + 2] = clamp(Math.round(nb / 17) * 17, 0, 255);
    }
    wc.putImageData(imgData, 0, 0);
  }

  const out = document.createElement('canvas');
  out.width = SIZE; out.height = SIZE;
  const oc = out.getContext('2d');
  oc.imageSmoothingEnabled = false;
  oc.drawImage(work, 0, 0, SIZE, SIZE);

  const qualities = [.86, .78, .7, .62, .54, .46, .38];
  let dataUrl = '';
  let bytes = 0;
  for (const q of qualities) {
    dataUrl = out.toDataURL('image/jpeg', q);
    bytes = v11hDataUrlBytes(dataUrl);
    if (bytes <= 100 * 1024) break;
  }
  return { dataUrl, bytes, quality: qualities[qualities.length - 1], w: SIZE, h: SIZE };
}

async function v11ImportPhoto(file) {
  try {
    if (!file) return { ok: false, error: 'no-file' };
    if (!/^image\//i.test(file.type || '')) {
      showToast('只能选择图片文件（JPG / PNG / WebP）', C.coral, 2.6);
      return { ok: false, error: 'type' };
    }
    if ((file.size || 0) > 12 * 1024 * 1024) {
      showToast('图片超过 12MB，请先压缩或裁小一点', C.coral, 2.6);
      return { ok: false, error: 'too-large' };
    }
    showToast('正在把照片变成猫猫…', C.gold, 1.6);
    const raw = await v11hReadFileAsDataUrl(file);
    const img = await v11hDecodePhoto(raw);
    const result = v11hProcessPhoto(img);
    if (!result.bytes || result.bytes > 100 * 1024) {
      showToast('照片压缩失败，旧照片没有改动', C.coral, 2.6);
      return { ok: false, error: 'compress' };
    }
    try { localStorage.setItem(V11H_PHOTO_KEY, result.dataUrl); }
    catch (e) {
      showToast('本机存储空间不足，照片没有保存', C.coral, 2.6);
      return { ok: false, error: 'storage' };
    }
    V11_PHOTO = result.dataUrl;
    V11H_PHOTO_ERROR = null;
    // 用压缩后的成品图解码，绝不把原图当主角（否则会把本地照片画成原图）
    V11_PHOTO_IMG = await v11hDecodePhoto(result.dataUrl);
    return { ok: true, bytes: result.bytes, w: result.w, h: result.h };
  } catch (e) {
    showToast('照片处理失败：' + (e && e.message ? e.message : '未知错误'), C.coral, 2.6);
    return { ok: false, error: 'exception' };
  }
}

/* 调试 / 自测用：直接给 dataURL，走同一套流水线。 */
async function v11hImportDataUrl(dataUrl) {
  try {
    if (typeof dataUrl !== 'string' || !/^data:image\//i.test(dataUrl)) {
      showToast('不是有效的图片数据', C.coral, 2.4);
      return { ok: false, error: 'type' };
    }
    const img = await v11hDecodePhoto(dataUrl);
    const result = v11hProcessPhoto(img);
    if (!result.bytes || result.bytes > 100 * 1024) return { ok: false, error: 'compress' };
    try { localStorage.setItem(V11H_PHOTO_KEY, result.dataUrl); }
    catch (e) { return { ok: false, error: 'storage' }; }
    V11_PHOTO = result.dataUrl;
    V11H_PHOTO_ERROR = null;
    V11_PHOTO_IMG = await v11hDecodePhoto(result.dataUrl);
    return { ok: true, bytes: result.bytes, w: result.w, h: result.h, meta: v11hPhotoMeta() };
  } catch (e) {
    return { ok: false, error: 'exception', message: e && e.message ? e.message : '' };
  }
}

/* ---------------- 4. 程序化绘制：预设猫 ---------------- */
function v11hShapeDims(shape) {
  if (shape === 'slim') return { bw: .62, bh: .82, hw: .84, hh: .8, hy: -.46, by: .24 };
  if (shape === 'fluffy') return { bw: 1.0, bh: .78, hw: .98, hh: .9, hy: -.46, by: .18 };
  return { bw: .88, bh: .72, hw: .94, hh: .88, hy: -.44, by: .18 };
}

function v11hDrawEars(g, r, cat, lw) {
  const ink = C.ink, body = cat.body, accent = cat.accent;
  const ear = cat.ear || 'round';
  for (const sx of [-1, 1]) {
    if (ear === 'point') {
      g.beginPath();
      g.moveTo(sx * r * .34, -r * .56);
      g.lineTo(sx * r * .78, -r * 1.02);
      g.lineTo(sx * r * .94, -r * .42);
      g.closePath();
      g.fillStyle = body; g.fill();
      g.strokeStyle = ink; g.lineWidth = lw; g.stroke();
      g.beginPath();
      g.moveTo(sx * r * .5, -r * .58);
      g.lineTo(sx * r * .75, -r * .86);
      g.lineTo(sx * r * .82, -r * .48);
      g.closePath(); g.fillStyle = withAlpha(accent, .7); g.fill();
    } else if (ear === 'fold') {
      g.beginPath();
      g.moveTo(sx * r * .36, -r * .62);
      g.lineTo(sx * r * .9, -r * .84);
      g.lineTo(sx * r * .92, -r * .34);
      g.closePath();
      g.fillStyle = body; g.fill();
      g.strokeStyle = ink; g.lineWidth = lw; g.stroke();
      g.beginPath();
      g.moveTo(sx * r * .5, -r * .6);
      g.lineTo(sx * r * .78, -r * .72);
      g.strokeStyle = withAlpha(ink, .45); g.lineWidth = lw * .7; g.stroke();
    } else if (ear === 'curl') {
      circle(g, sx * r * .6, -r * .55, r * .3, body, ink, lw);
      g.save();
      g.strokeStyle = withAlpha(accent, .9); g.lineWidth = lw * .8; g.lineCap = 'round';
      g.beginPath();
      g.arc(sx * r * .6, -r * .55, r * .16, sx > 0 ? -Math.PI * .9 : Math.PI * .1, sx > 0 ? Math.PI * .5 : Math.PI * 1.5);
      g.stroke();
      g.restore();
    } else if (ear === 'drop') {
      ellipse(g, sx * r * .72, -r * .34, r * .22, r * .42, body, ink, lw, sx * .22);
      ellipse(g, sx * r * .74, -r * .3, r * .1, r * .22, withAlpha(accent, .72), null, 0, sx * .22);
    } else {
      circle(g, sx * r * .62, -r * .54, r * .3, body, ink, lw);
      circle(g, sx * r * .62, -r * .54, r * .12, withAlpha(accent, .8), null, 0);
    }
  }
}

function v11hDrawFace(g, r, cat, t, o) {
  const ink = C.ink, eye = cat.eye;
  const face = cat.face || 'smile';
  const blink = !!o.blink, dead = !!o.dead;
  const lw = Math.max(1.1, r * .1);
  const lx = Math.cos(o.aim || 0) * r * .05;
  const ly = Math.sin(o.aim || 0) * r * .04;

  if (blink || dead || face === 'sleepy') {
    g.strokeStyle = ink; g.lineWidth = lw;
    for (const sx of [-1, 1]) {
      g.beginPath();
      g.moveTo(sx * r * .48, -r * .1);
      g.quadraticCurveTo(sx * r * .33, r * .01, sx * r * .18, -r * .1);
      g.stroke();
    }
  } else if (face === 'cold') {
    for (const sx of [-1, 1]) {
      ellipse(g, sx * r * .33 + lx, -r * .1 + ly, r * .21, r * .075, eye, ink, lw * .9);
      circle(g, sx * r * .36 + lx, -r * .1 + ly, r * .035, C.white, null, 0);
    }
  } else if (face === 'angry') {
    for (const sx of [-1, 1]) {
      ellipse(g, sx * r * .33 + lx, -r * .08 + ly, r * .22, r * .24, C.white, ink, lw);
      circle(g, sx * r * .3 + lx * 2, -r * .04 + ly, r * .1, eye, null, 0);
      g.strokeStyle = ink; g.lineWidth = lw * 1.15;
      g.beginPath();
      g.moveTo(sx * r * .12, -r * .3);
      g.lineTo(sx * r * .55, -r * .18);
      g.stroke();
    }
  } else if (face === 'smug') {
    for (const sx of [-1, 1]) {
      ellipse(g, sx * r * .33 + lx, -r * .1 + ly, r * .21, r * .23, C.white, ink, lw);
      circle(g, sx * r * .3 + lx * 2, -r * .06 + ly, r * .09, eye, null, 0);
      g.save();
      g.fillStyle = withAlpha(cat.body, .95);
      g.beginPath();
      g.rect(sx * r * .33 + lx - r * .24, -r * .32 + ly, r * .48, r * .12);
      g.fill();
      g.restore();
    }
  } else {
    for (const sx of [-1, 1]) {
      ellipse(g, sx * r * .33 + lx, -r * .1 + ly, r * .23, r * .26, C.white, ink, lw);
      circle(g, sx * r * .33 + lx * 2, -r * .08 + ly, r * .11, eye, null, 0);
      circle(g, sx * r * .29 + lx * 2, -r * .12 + ly, r * .042, C.white, null, 0);
    }
  }

  // 鼻子
  g.fillStyle = C.coral;
  g.beginPath();
  g.moveTo(-r * .09, r * .14); g.lineTo(0, r * .22); g.lineTo(r * .09, r * .14);
  g.closePath(); g.fill();

  // 嘴
  g.strokeStyle = ink; g.lineWidth = lw * .8;
  if (face === 'angry') {
    g.fillStyle = C.coral;
    g.beginPath();
    g.moveTo(-r * .16, r * .3); g.quadraticCurveTo(0, r * .56, r * .16, r * .3);
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = C.white;
    g.beginPath(); g.moveTo(-r * .1, r * .31); g.lineTo(-r * .04, r * .42); g.lineTo(r * .01, r * .31); g.fill();
    g.beginPath(); g.moveTo(r * .1, r * .31); g.lineTo(r * .04, r * .42); g.lineTo(-r * .01, r * .31); g.fill();
  } else if (face === 'smug') {
    g.beginPath(); g.moveTo(-r * .08, r * .34); g.lineTo(r * .18, r * .28); g.stroke();
  } else if (face === 'sleepy') {
    ellipse(g, 0, r * .38, r * .07, r * .05, withAlpha(ink, .55), null, 0);
  } else if (face === 'cold') {
    g.beginPath(); g.moveTo(-r * .1, r * .34); g.lineTo(r * .1, r * .34); g.stroke();
  } else {
    g.beginPath();
    g.moveTo(-r * .17, r * .33);
    g.quadraticCurveTo(0, r * .47, r * .17, r * .33);
    g.stroke();
  }

  if (face === 'smile' || face === 'smug') {
    ellipse(g, -r * .64, r * .06, r * .13, r * .07, withAlpha(C.coral, .45), null, 0);
    ellipse(g, r * .64, r * .06, r * .13, r * .07, withAlpha(C.coral, .45), null, 0);
  }
}

/* 底猫：只画脸型 / 底色 / 体型 / 尾巴 / 爪子。
   v1.1.3 起不再携带固定的“觉醒 / 真神”装饰；战斗内形态由流派驱动。 */
function v11hDrawCatBase(g, r, cat, t, o) {
  o = o || {};
  const ink = C.ink;
  const lw = Math.max(1.1, r * .12);
  const dims = v11hShapeDims(cat.shape);
  const headOnly = !!o.headOnly;
  const body = cat.body, belly = cat.belly, trim = cat.trim, accent = cat.accent;

  if (!headOnly) {
    // 尾巴
    const wag = Math.sin(t * (o.moving ? 11 : 3.0)) * r * .18;
    g.save(); g.lineCap = 'round';
    g.strokeStyle = ink; g.lineWidth = Math.max(2, r * .24);
    g.beginPath();
    g.moveTo(r * .55, r * .3);
    g.quadraticCurveTo(r * 1.15, r * .35 + wag, r * 1.2, -r * .1 + wag);
    g.stroke();
    g.strokeStyle = body; g.lineWidth = Math.max(1.2, r * .12);
    g.beginPath();
    g.moveTo(r * .55, r * .3);
    g.quadraticCurveTo(r * 1.15, r * .35 + wag, r * 1.2, -r * .1 + wag);
    g.stroke();
    g.restore();

    // 后腿
    for (const sx of [-1, 1]) {
      ellipse(g, sx * r * .42, r * .8, r * .26, r * .18, body, ink, lw * .9);
    }

    // 身体
    ellipse(g, 0, r * dims.by, r * dims.bw, r * dims.bh, body, ink, lw * 1.25);
    ellipse(g, 0, r * dims.by + r * .07, r * dims.bw * .55, r * dims.bh * .5, belly, null, 0);
    if (cat.shape === 'fluffy') {
      g.strokeStyle = withAlpha(ink, .35); g.lineWidth = lw * .55;
      for (let i = -2; i <= 2; i++) {
        g.beginPath();
        g.moveTo(i * r * .22, r * dims.by - r * dims.bh * .82);
        g.lineTo(i * r * .26, r * dims.by - r * dims.bh * 1.02);
        g.stroke();
      }
    }
  }

  // 头（只画头时不做身体偏移，保证在图标中心）
  g.save();
  g.translate(0, headOnly ? 0 : r * dims.hy);
  v11hDrawEars(g, r, cat, lw);

  ellipse(g, 0, 0, r * dims.hw, r * dims.hh, body, ink, lw * 1.25);
  ellipse(g, 0, r * dims.hh * .3, r * dims.hw * .48, r * dims.hh * .3, belly, null, 0);

  if (cat.shape === 'fluffy') {
    for (const sx of [-1, 1]) {
      g.beginPath();
      g.moveTo(sx * r * dims.hw * .8, r * .1);
      g.lineTo(sx * r * dims.hw * 1.02, r * .02);
      g.lineTo(sx * r * dims.hw * .82, r * .24);
      g.closePath();
      g.fillStyle = body; g.fill();
      g.strokeStyle = ink; g.lineWidth = lw * .7; g.stroke();
    }
  }

  v11hDrawFace(g, r, cat, t, { aim: o.aim, blink: o.blink, dead: o.dead });
  g.restore();

  if (!headOnly) {
    // 前爪
    const swing = o.attackAnim > 0 ? Math.sin((1 - o.attackAnim / (o.attackAnimMax || .001)) * Math.PI) : 0;
    const aim = o.aim || 0;
    for (const sx of [-1, 1]) {
      g.save();
      const ext = sx > 0 ? swing * r * .45 : 0;
      g.translate(sx * r * .4 + Math.cos(aim) * ext, r * .56 + Math.sin(aim) * ext);
      ellipse(g, 0, 0, r * .24, r * .26, body, ink, lw * .85);
      g.strokeStyle = withAlpha(ink, .3); g.lineWidth = lw * .4;
      for (let i = -1; i <= 1; i++) {
        g.beginPath();
        g.moveTo(i * r * .08, r * .04);
        g.lineTo(i * r * .1, r * .18);
        g.stroke();
      }
      g.restore();
    }
    if (!o.hideWeapon) v11hDrawWeapon(g, r, cat, 0, t, o);
  }
}

/* form = {schoolId, tier} | null：null 只画底猫；否则交给 _v11i 的 10 套流派形态。

}

function v11hDrawSchoolForm(g, r, cat, form, t, o) {

function v11hDrawWeapon(g, r, cat, stage, t, o) {
  const ink = C.ink, lw = Math.max(1.1, r * .12);
  const w = cat.weapon;
  if (w === 'claw') {
    g.save();
    g.translate(r * .62 + (o.attackAnim > 0 ? r * .2 : 0), r * .5);
    g.rotate(-.28);
    fillRound(g, -r * .2, -r * .1, r * .42, r * .2, r * .08, stage >= 1 ? '#cfd4e4' : '#c3c7d6');
    strokeRound(g, -r * .2, -r * .1, r * .42, r * .2, r * .08, ink, lw * .8);
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(-r * .16 + i * r * .12, -r * .1);
      g.lineTo(-r * .1 + i * r * .12, -r * .3);
      g.lineTo(-r * .02 + i * r * .12, -r * .1);
      g.closePath();
      g.fillStyle = stage >= 1 ? '#f2f5ff' : '#dfe4f2';
      g.fill();
      g.strokeStyle = ink; g.lineWidth = lw * .5; g.stroke();
    }
    g.restore();
  } else if (w === 'fish') {
    drawFish(g, r * .78, r * .52, r * .3, cat.trim, ink, lw * .7, -.35);
  } else if (w === 'star') {
    g.save();
    g.strokeStyle = ink; g.lineWidth = lw * .7;
    g.beginPath(); g.moveTo(r * .28, r * .62); g.lineTo(r * .72, r * .2); g.stroke();
    drawStar(g, r * .8, r * .08, r * .24, r * .1, 5, cat.trim, ink, lw * .8, t * .8);
    g.restore();
  } else if (w === 'bell') {
    g.save(); g.translate(0, r * .56);
    circle(g, 0, 0, r * .16, C.gold, ink, lw * .8);
    g.strokeStyle = ink; g.lineWidth = lw * .5;
    g.beginPath(); g.moveTo(-r * .05, -r * .02); g.lineTo(0, r * .08); g.lineTo(r * .05, -r * .02); g.stroke();
    g.restore();
  } else if (w === 'yarn') {
    circle(g, r * .84, r * .68, r * .26, cat.accent, ink, lw * .8);
    g.save();
    g.strokeStyle = withAlpha(ink, .45); g.lineWidth = lw * .5;
    g.beginPath(); g.arc(r * .84, r * .68, r * .14, .4, Math.PI * 2.1); g.stroke();
    g.restore();
  } else if (w === 'branch') {
    g.save();
    g.strokeStyle = ink; g.lineWidth = lw * .8;
    g.beginPath(); g.moveTo(r * .48, r * .66); g.lineTo(r * .96, r * .08); g.stroke();
    ellipse(g, r * 1.0, r * .02, r * .16, r * .07, cat.trim, ink, lw * .6, -.5);
    g.restore();
  } else if (w === 'snow') {
    for (let i = 0; i < 3; i++) {
      const a = t * 1.1 + i * TAU / 3;
      drawStar(g, Math.cos(a) * r * .95, Math.sin(a) * r * .55 - r * .1, r * .1, r * .04, 6,
        withAlpha(C.white, .9), C.blue, lw * .45, a);
    }
  }
}

function v11hActiveSchoolColor() {
  try {
    if (!run || !run.schools) return null;
    const map = { combo: C.coral, burst: C.gold, area: C.mint, summon: C.lavender, heal: C.blue };
    const ids = Array.isArray(run.schools) ? run.schools : Object.keys(run.schools);
    for (const id of ids) if (map[id]) return map[id];
    return null;
  } catch (e) { return null; }
}

function v11hDrawPhotoCircle(g, x, y, r, t) {
  const ink = C.ink;
  const bezel = Math.max(1.6, r * .09);
  if (V11_PHOTO_IMG) {
    g.save();
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.clip();
    const cover = Math.max((r * 2) / (V11_PHOTO_IMG.width || 1), (r * 2) / (V11_PHOTO_IMG.height || 1));
    const dw = (V11_PHOTO_IMG.width || 1) * cover;
    const dh = (V11_PHOTO_IMG.height || 1) * cover;
    g.drawImage(V11_PHOTO_IMG, x - dw / 2, y - dh / 2, dw, dh);
    g.restore();
  } else {
    circle(g, x, y, r, V11_THEME.card, ink, bezel);
    drawPaw(g, x, y, r * .5, withAlpha(ink, .25));
  }
  // 白色描边（在绘制时加，绝不烘焙进 JPEG）
  circle(g, x, y, r, null, C.white, bezel * 1.5);
  circle(g, x, y, r - bezel * 1.9, null, withAlpha(ink, .5), Math.max(1, r * .045));
}

/* 照片主角：照片圆 + 猫耳 + 胡须 + 圆眼，不再携带固定三阶装饰。
   v1.1.3：form = {schoolId,tier}|null；非空时以 50% 透明度叠加
   对应流派主题层（只取外围剪影/光效，不覆盖脸）。 */
function v11DrawPhotoCat(g, x, y, size, form, t, schoolColor) {
  const r = Math.max(8, size);
  const ink = C.ink;
  const lw = Math.max(1.2, r * .1);
  const school = schoolColor || (form && form.color) || v11hActiveSchoolColor();

  v11hDrawPhotoCircle(g, x, y, r, t);

  // 猫耳（叠在圆外）
  for (const sx of [-1, 1]) {
    g.beginPath();
    g.moveTo(x + sx * r * .34, y - r * .72);
    g.lineTo(x + sx * r * .7, y - r * 1.16);
    g.lineTo(x + sx * r * .98, y - r * .58);
    g.closePath();
    g.fillStyle = V11_THEME.panelWarm; g.fill();
    g.strokeStyle = ink; g.lineWidth = lw; g.stroke();
    g.beginPath();
    g.moveTo(x + sx * r * .48, y - r * .72);
    g.lineTo(x + sx * r * .7, y - r * .98);
    g.lineTo(x + sx * r * .84, y - r * .66);
    g.closePath();
    g.fillStyle = withAlpha(form && form.tier >= 2 && school ? school : C.coral, .55); g.fill();
  }

  // 胡须
  g.save();
  g.strokeStyle = withAlpha(ink, .7); g.lineWidth = Math.max(1, r * .045);
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const yy = y + r * (.02 + i * .16);
      g.beginPath();
      g.moveTo(x + sx * r * .48, yy);
      g.lineTo(x + sx * r * .96, yy - r * .1 + i * r * .1);
      g.stroke();
    }
  }
  g.restore();

  // 圆眼
  for (const sx of [-1, 1]) {
    circle(g, x + sx * r * .24, y - r * .14, r * .14, withAlpha(C.white, .94), ink, lw * .8);
    circle(g, x + sx * r * .24, y - r * .12, r * .065, ink, null, 0);
    circle(g, x + sx * r * .22, y - r * .15, r * .022, C.white, null, 0);
  }
  g.fillStyle = withAlpha(C.coral, .95);
  g.beginPath();
  g.moveTo(x - r * .05, y + r * .1); g.lineTo(x, y + r * .16); g.lineTo(x + r * .05, y + r * .1);
  g.closePath(); g.fill();
  g.strokeStyle = ink; g.lineWidth = Math.max(1, r * .045);
  g.beginPath();
  g.moveTo(x - r * .1, y + r * .2);
  g.quadraticCurveTo(x, y + r * .3, x + r * .1, y + r * .2);
  g.stroke();

  if (form && form.schoolId && typeof v11hDrawSchoolForm === 'function') {
    const baseCat = V11_CHAR.kind === 'photo' ? v11CatById(V11H_LAST_PRESET) : v11hCurrentCat();
    g.save();
    g.globalAlpha = .5;
    g.translate(x, y);
    v11hDrawSchoolForm(g, r * 1.02, baseCat, form, t, { overlayOnly: true, fxScale: .88 });
    g.restore();
  }
}

/* v1.1.3：奶油团子不再走旧三阶精灵；所有底猫统一由流派形态驱动。 */
drawPlayerSprite = function (g, p, t, opts = {}) {
  const cat = v11hCurrentCat();
  const isPhoto = V11_CHAR.kind === 'photo';
  return v11hDrawCustomPlayer(g, p, t, opts, isPhoto, cat);
};

function v11hDrawCustomPlayer(g, p, t, opts, isPhoto, cat) {
  const r = p.r || 20;
  const isDead = p.dead || opts.dead;
  const moving = p.moving && !isDead;
  const bob = isDead ? 0 : Math.sin(t * (moving ? 12 : 4.8) + (opts.phase || 0)) * (moving ? 2.2 : 1.4);
  const squish = isDead ? .22 : (moving ? 1 + Math.sin(t * 12 + (opts.phase || 0)) * .035 : 1);
  const blink = !isDead && ((t * 1.55 + (opts.blinkOffset || 0)) % 4.3 > 4.1);
  const low = p.hp !== undefined && p.hp > 0 && p.hp / p.maxHp < .3;
  const form = v11hActiveSchoolForm();

  g.save();
  g.globalAlpha = .28;
  g.fillStyle = C.ink;
  g.beginPath(); g.ellipse(p.x, p.y + r * 1.02, r * 1.25, r * .38, 0, 0, TAU); g.fill();
  if (!isDead && p.dashCd > 0) {
    const charge = 1 - p.dashCd / p.dashCooldown;
    g.strokeStyle = withAlpha(C.mint, .45); g.lineWidth = 2;
    g.beginPath(); g.arc(p.x, p.y + r * 1.02, r * 1.32, Math.PI * .12, Math.PI * .88); g.stroke();
    g.strokeStyle = withAlpha(C.cream, .75); g.lineWidth = 3;
    g.beginPath(); g.arc(p.x, p.y + r * 1.02, r * 1.32, Math.PI * .12, Math.PI * .12 + Math.PI * .76 * charge); g.stroke();
  }
  if (form && !isDead) {
    g.globalAlpha = form.tier >= 2 ? .26 : .16 + Math.sin(t * 6) * .06;
    g.fillStyle = withAlpha(form.color, .9);
    g.beginPath(); g.ellipse(p.x, p.y + r * 1.02, r * 1.6, r * .5, 0, 0, TAU); g.fill();
    if (form.tier >= 2) {
      g.globalAlpha = .3;
      g.strokeStyle = withAlpha(form.color, .8); g.lineWidth = 2.4;
      g.beginPath(); g.ellipse(p.x, p.y + r * 1.05, r * 1.5, r * .45, 0, 0, TAU); g.stroke();
    }
  }
  g.restore();

  g.save();
  g.translate(p.x, p.y + bob);
  if (isDead) {
    const dt = Math.min(1, (p.deathT || 0) * 2.2);
    g.rotate(1.15 * dt);
    g.scale(1.08, .46 + .54 * (1 - dt));
    g.translate(0, 14 * dt);
  }
  if (!isDead && p.invuln > 0 && p.hurtFlash > 0 && Math.floor(t * 28) % 2 === 0 && !opts.alwaysVisible) {
    g.globalAlpha = .48;
  }
  g.scale(1, squish);

  if (isPhoto) {
    v11DrawPhotoCat(g, 0, -r * .18, r * 1.02, form, t, form ? form.color : null);
  } else {
    v11hDrawCatFigure(g, r * 1.02, cat, form, t, {
      aim: p.aim, moving, blink, dead: isDead,
      attackAnim: p.attackAnim, attackAnimMax: p.attackAnimMax,
    });
  }

  if (p.upgradeFx > 0 && !isDead) {
    for (let i = 0; i < 5; i++) {
      const a = t * 2 + i * TAU / 5;
      drawStar(g, Math.cos(a) * r * 1.3, -r * .5 + Math.sin(a) * r * 1.2, 4, 1.8, 5, C.gold, null, 0, t);
    }
  }
  if (low && !isDead) {
    g.fillStyle = C.blue; g.strokeStyle = C.ink; g.lineWidth = 2;
    g.beginPath(); g.moveTo(r * .88, -r * .9); g.quadraticCurveTo(r * 1.12, -r * .55, r * .88, -r * .48); g.quadraticCurveTo(r * .65, -r * .6, r * .88, -r * .9); g.fill(); g.stroke();
  }
  if (isDead) {
    for (let i = 0; i < 3; i++) {
      const a = t * 1.3 + i * TAU / 3;
      drawStar(g, Math.cos(a) * r * 1.3, -r * 1.2 + Math.sin(a) * r * .25, 5, 2.2, 5, C.gold, C.ink, 1.5);
    }
  }
  g.restore();
}

function v11hHomeCharRect() {
  const lay = v11gHomeLayout();
  if (lay.compact) {
    const link = (lay.links || []).find(l => l.id === 'charshop');
    if (link) return { x: link.x, y: link.y, w: link.w, h: link.h };
    return { x: 648, y: 550, w: 294, h: 72 };
  }
  return { x: 112, y: 658, w: 470, h: 48 };
}

function v11hRectOverlap(a, b) {
  return !!(a && b && a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
}
let V11H_HOME_CHAR_CONFLICTS = [];
function v11hHomeCharConflicts() {
  const lay = v11gHomeLayout();
  const r = v11hHomeCharRect();
  const boxes = [];
  if (lay.card) boxes.push({ id: 'card', r: lay.card });
  if (lay.cur) boxes.push({ id: 'cur', r: lay.cur });
  for (const l of lay.links) if (l.id !== 'charshop') boxes.push({ id: 'link:' + l.id, r: l });
  if (lay.version) boxes.push({ id: 'version', r: { x: lay.version.x - 120, y: lay.version.y - 12, w: 120, h: 18 } });
  V11H_HOME_CHAR_CONFLICTS = boxes.filter(b => v11hRectOverlap(r, b.r))
    .map(b => ({ id: b.id, rect: Object.assign({}, b.r) }));
  return V11H_HOME_CHAR_CONFLICTS.slice();
}

/* ---------------- 9. 顶层分发：charshop / 入口按钮 ---------------- */
const V11H_LEGACY_DRAW = draw;

const V11H_LEGACY_HANDLE_DOWN = handleDown;
handleDown = function (ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  updatePointer(ev);
  initAudio();
  const st = state;

  if (st === 'charshop') {
    const hit = V11H_SHOP_RECTS.find(r => pointRect(mouse, r));
    if (!hit) return;
    if (hit.id === 'shopBack') { v11hCloseCharShop(); return; }
    if (hit.id === 'shopPreset') { V11H_LAST_PRESET = hit.presetId; v11hSetPreset(hit.presetId); return; }
    if (hit.id === 'shopSchool') { V11H_SHOP_PREVIEW = hit.schoolId; sfx('click'); return; }
    if (hit.id === 'shopPhoto') {
      if (V11H_IMPORTING) { showToast('照片还在处理中，稍等一下', C.gold, 2); return; }
      v11hPickPhotoFile();
      return;
    }
    if (hit.id === 'shopUse') { v11hUsePhoto(); return; }
    if (hit.id === 'shopClear') { v11hClearPhoto(); return; }
    return;
  }

  if (st === 'title' && V11_HOME_RECTS.charshop && pointRect(mouse, V11_HOME_RECTS.charshop)) {
    v11GPress('charshop');
    v11hOpenCharShop('title');
    return;
  }

  if (st === 'modeSelect' && pointRect(mouse, V11H_MODE_CHAR_RECT)) {
    v11GPress('charshop');
    v11hOpenCharShop('modeSelect');
    return;
  }

  if (st === 'bestiary') {
    const hit = bestiaryRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'tabMonster') {
        V11H_BESTIARY_TAB = 'monster';
        V11_BESTIARY_PAGE = 0;
        sfx('click');
        return;
      }
      if (hit.id === 'tabChar') {
        V11H_BESTIARY_TAB = 'char';
        sfx('click');
        return;
      }
      if (hit.id === 'tabForms') {
        V11H_BESTIARY_TAB = 'forms';
        sfx('click');
        return;
      }
      if (hit.id === 'charCard') {
        V11H_LAST_PRESET = hit.presetId;
        v11hSetPreset(hit.presetId);
        return;
      }
      if (hit.id === 'charPhoto') { v11hUsePhoto(); return; }
      if (hit.id === 'charPhotoEmpty') { v11hPickPhotoFile(); return; }
    }
  }

  V11H_LEGACY_HANDLE_DOWN(ev);
};

window.addEventListener('keydown', ev => {
  if (ev.code === 'Escape' && state === 'charshop') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    v11hCloseCharShop();

}, true);

const V11H_LEGACY_UPDATE = update;
update = function (dt) {
  if (state === 'charshop') {
    time += dt;
    if (volumePill) {
      volumePill.t += dt;
      if (volumePill.t >= volumePill.until) volumePill = null;
    }
    return;

  V11H_LEGACY_UPDATE(dt);
};

let v11hDomFile = null;

  if (v11hDomFile) return;

    input.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
    input.addEventListener('change', () => {

      input.value = '';
      if (f) {
        V11H_IMPORTING = true;
        v11ImportPhoto(f).then(res => {
          V11H_IMPORTING = false;
          if (res && res.ok) {
            V11_CHAR = { kind: 'photo' };
            v11hSaveChar();
            v11hSyncFormNames();
            showToast('照片主角已保存（' + Math.round(res.bytes / 1024) + ' KB）· 已换上', C.mint, 2.6);
            sfx('click');

        }).catch(() => { V11H_IMPORTING = false; });
      }
    });
    document.body.appendChild(input);
    v11hDomFile = input;
  } catch (e) { v11hDomFile = null; }
}

function v11hPickPhotoFile() {

/* ==================================================================
   v1.1.3 LAYER · I：流派驱动进化 / 10 套流派形态 / 升级刷新 / 三档关卡上限 / 通关页
   ------------------------------------------------------------------
   - openUpgrade() 每次把 run.upgradeRefreshLeft 重置为 2
   - 升级页「🔄 刷新（剩 N 次）」按钮 + 快捷键 R，重摇不消耗升级次数
   - easy 20 / hard 25 / hell 30 三档显式上限，通关进入 victory 页
   - 通关时 checkpoint=null + cleared=true，读档绝不从 cap+1 越界
   - 无限 / 剧情模式绝不截断（只判断 mode ∈ {easy,hard,hell}）
   ================================================================== */

let victoryInfo = null;
const V11I_REFRESH_RECT = { x: 0, y: 0, w: 0, h: 0 };
let V11I_REFRESH_READY = false;
const V11I_VICTORY_RECTS = { next: null, back: null };

/* ---------------- 1. 升级刷新 ---------------- */
const V11I_LEGACY_OPEN_UPGRADE = openUpgrade;
openUpgrade = function () {
  V11I_LEGACY_OPEN_UPGRADE();
  if (state === 'upgrade' && run) run.upgradeRefreshLeft = 2;
};

function v11iRefreshLeft() {
  return run ? Math.max(0, Math.floor(Number(run.upgradeRefreshLeft) || 0)) : 0;
}

function v11iCardIds() {
  return (upgradeCards || []).map(c => c.id).sort().join('|');
}

function v11iRefreshUpgradeCards() {
  if (state !== 'upgrade' || !run) return false;
  if (v11iRefreshLeft() <= 0) {
    showToast('刷新次数已用完 · 选一张卡继续', C.lavender, 2.0);
    sfx('click', .8);
    return false;
  }
  run.upgradeRefreshLeft = v11iRefreshLeft() - 1;
  const before = v11iCardIds();
  let fresh = makeUpgradeCards();
  let tries = 0;
  // 最多重摇 8 次，避免恰好摇出同一组 id 让玩家以为按钮坏了。
  while (fresh.map(c => c.id).sort().join('|') === before && tries < 8) {
    fresh = makeUpgradeCards();
    tries++;
  }
  upgradeCards = fresh;
  modalHover = -1;
  modalOpenTime = 0;
  sfx('click');
  showToast(`重新摇出 ${upgradeCards.length} 张候选 · 还剩 ${run.upgradeRefreshLeft} 次`, C.gold, 1.8);
  return true;
}

/* 完整重绘升级页：保留原卡面 / BUILD 概览，新增刷新按钮并把提示下移。 */
drawUpgradeScreen = function (g, t) {
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#150d21'); bg.addColorStop(.55, '#241531'); bg.addColorStop(1, '#3c2340');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, 360); g.globalAlpha = .09;
  for (let i = 0; i < 16; i++) {
    g.fillStyle = i % 2 ? C.gold : C.coral;
    g.beginPath(); g.moveTo(0, 0);
    g.arc(0, 0, 760, i * TAU / 16, i * TAU / 16 + .12); g.closePath(); g.fill();
  }
  g.restore();

  drawText(g, 'CHOOSE YOUR CAT POWER', W / 2, 28, 12, withAlpha(C.gold, .8), { align: 'center', weight: 900 });
  drawText(g, '等级提升 · 三选一', W / 2, 62, 36, C.cream, { align: 'center', line: 7, weight: 900 });
  const remaining = run ? run.pendingLevelUps : 1;
  const activeForm = typeof v11hActiveSchoolForm === 'function' ? v11hActiveSchoolForm() : null;
  const formLabel = activeForm ? activeForm.name : v11hCurrentCat().name;
  drawText(g, `猫猫 Lv.${player.level} · 还有 ${remaining} 次选择 · 当前形态「${formLabel}」`,
    W / 2, 98, 12, withAlpha(C.cream, .7), { align: 'center', weight: 700 });

  // T3b：已解锁的流派共鸣徽章（与下方刷新按钮同页）
  v11iDrawUpgradeSchoolBadges(g, t);

  upgradeCardRects = [];
  const cardW = 324, cardH = 394;
  const startX = (W - (cardW * 3 + 56)) / 2;
  const cardY = 138;
  modalHover = -1;
  for (let i = 0; i < upgradeCards.length; i++) {
    const rect = { x: startX + i * (cardW + 28), y: cardY, w: cardW, h: cardH };
    upgradeCardRects.push(rect);
    if (pointRect(mouse, rect)) modalHover = i;
  }
  for (let i = 0; i < upgradeCards.length; i++) {
    drawUpgradeCard(g, upgradeCards[i], i, upgradeCardRects[i], t);
  }

  // 当前 build 概览
  const entries = Object.entries(run.upgradeStacks || {});
  let ix = 214;
  drawText(g, '当前 BUILD', 134, 566, 11, withAlpha(C.cream, .55), { weight: 900 });
  if (!entries.length) {
    drawText(g, '（空白 · 这就是你的第一次选择）', 234, 566, 10, withAlpha(C.cream, .38), { weight: 700 });
  } else {
    for (let i = 0; i < entries.length && i < 14; i++) {
      const u = SKILL_BY_ID[entries[i][0]];
      if (!u) continue;
      fillRound(g, ix, 550, 30, 30, 8, withAlpha(u.color, .16));
      drawUpgradeIcon(g, ix + 15, 565, 19, entries[i][1] >= 4 ? u.mutateIcon : u.icon, u.color);
      drawText(g, `Lv.${entries[i][1]}`, ix + 15, 578, 7, C.cream, { align: 'center', weight: 900 });
      ix += 34;
    }
  }

  // 免费刷新：不消耗升级次数，0 次置灰。
  const left = v11iRefreshLeft();
  const rect = { x: W / 2 - 140, y: 584, w: 280, h: 44 };
  V11I_REFRESH_RECT.x = rect.x; V11I_REFRESH_RECT.y = rect.y;
  V11I_REFRESH_RECT.w = rect.w; V11I_REFRESH_RECT.h = rect.h;
  V11I_REFRESH_READY = true;
  const enabled = left > 0;
  const hov = enabled && pointRect(mouse, rect);
  fillRound(g, rect.x + 4, rect.y + 5, rect.w, rect.h, 14, withAlpha(C.ink, .45));
  fillRound(g, rect.x, rect.y, rect.w, rect.h, 14,
    enabled ? (hov ? withAlpha(C.gold, .34) : withAlpha(C.gold, .16)) : withAlpha('#3a2c46', .55));
  strokeRound(g, rect.x, rect.y, rect.w, rect.h, 14,
    enabled ? (hov ? C.gold : withAlpha(C.gold, .62)) : withAlpha(C.cream, .22), hov ? 2.6 : 1.8);
  drawText(g, enabled ? `🔄 刷新（剩 ${left} 次）` : '🔄 刷新（已用完）',
    rect.x + rect.w / 2, rect.y + rect.h / 2, 16,
    enabled ? C.cream : withAlpha(C.cream, .42), { align: 'center', weight: 900 });

  drawText(g, '1 / 2 / 3 快速选择  ·  点击卡片  ·  R 刷新候选', W / 2, 646, 11, withAlpha(C.cream, .56), { align: 'center', weight: 700 });
  drawText(g, '刷新只重摇候选，不消耗升级次数；所有增益都会在本局保留', W / 2, 668, 10, withAlpha(C.cream, .35), { align: 'center' });
};

/* ---------------- 2. 三档上限 + 通关 ---------------- */
function v11iModeCap(modeId) {
  if (!modeId) return 0;
  return Math.max(0, Math.floor(Number(V11_MODE_CAPS[modeId]) || 0));
}

function v11iModeCardCapText(modeId) {
  if (modeId === 'infinite') return '最终 ∞';
  const cap = v11iModeCap(modeId);
  return cap ? `最终 ${cap} 关` : '';
}

const V11I_LEGACY_ON_STAGE_CLEARED = onStageCleared;
onStageCleared = function (clearedStage) {
  if (!run) { V11I_LEGACY_ON_STAGE_CLEARED(clearedStage); return; }
  const mode = run.mode;
  const isCapped = ['easy', 'hard', 'hell'].includes(mode);
  const cap = v11iModeCap(mode);
  if (isCapped && cap > 0 && clearedStage >= cap) {
    transition = null;
    prepareStageClear(clearedStage);
    const mp = modeProgressFor(mode);
    if (mp) {
      // 必修坑：通关后不能留下 cap+1 的检查点，否则读档越界开局。
      mp.checkpoint = null;
      mp.cleared = true;
    }
    persistProfile(false);
    syncMetaFromProfile();
    victoryInfo = { mode, stage: clearedStage };
    state = 'victory';
    // 战斗内残留的横幅 / 操作提示不应盖在通关页上。
    banner = null;
    toast = null;
    sfx('clear');
    return;
  }
  V11I_LEGACY_ON_STAGE_CLEARED(clearedStage);
};

function v11iVictoryNextMode(mode) {
  if (mode === 'easy') return 'hard';
  if (mode === 'hard') return 'hell';
  return null;
}

function v11iVictoryContinue() {
  if (!victoryInfo) return state;
  const next = v11iVictoryNextMode(victoryInfo.mode);
  if (!next) {
    showToast('已达成最高难度 · 地狱模式已通关', C.gold, 2.6);
    sfx('click');
    return state;
  }
  victoryInfo = null;
  sfx('click');
  returnToHome();
  startModeFromHome(next);
  clearInput();
  return state;
}

function v11iVictoryBack() {
  victoryInfo = null;
  sfx('click');
  returnToHome();
  state = 'modeSelect';
  clearInput();
  return state;
}

/* ---------------- 3. 通关页绘制 ---------------- */
function v11iDrawVictoryButton(g, rect, label, primary, t) {

  fillRound(g, rect.x + 5, rect.y + 6, rect.w, rect.h, 16, V11_THEME.shadow);

}

function v11iDrawVictoryScreen(g, t) {
  v11ThemeBg(g, t, { variant: 'mode' });
  const info = victoryInfo || { mode: (run && run.mode) || 'easy', stage: 0 };
  if (!victoryInfo && run) victoryInfo = info;
  const mode = MODES[info.mode] || MODES.easy || { name: '简单' };
  const cap = v11iModeCap(info.mode) || info.stage || 0;
  const accent = MODE_ACCENT[info.mode] || mode.color || C.gold;
  const next = v11iVictoryNextMode(info.mode);

  // 主面板
  fillRound(g, 326, 94, 640, 568, 26, V11_THEME.shadow);
  fillRound(g, 320, 86, 640, 568, 26, V11_THEME.panel);
  strokeRound(g, 320, 86, 640, 568, 26, V11_THEME.line, 4);
  fillRound(g, 338, 104, 604, 9, 4.5, accent);

  drawText(g, 'VICTORY · 通关', W / 2, 132, 12, V11_THEME.muted, { align: 'center', weight: 900 });
  drawText(g, '恭喜，你通关了！！！', W / 2, 180, 38, V11_THEME.ink, { align: 'center', line: 0, weight: 900 });
  drawText(g, `${mode.name}模式 · 第 ${info.stage} / ${cap} 关`,
    W / 2, 216, 14, V11_THEME.muted, { align: 'center', weight: 800 });

  // 主角头像 + 金环
  circle(g, W / 2, 286, 52, withAlpha(accent, .18), null, 0);

/* ---------------- 5. 顶部状态分发 ---------------- */
const V11I_LEGACY_DRAW = draw;
draw = function (g, t) {
  if (state === 'victory') {
    ctx.clearRect(0, 0, W, H);
    v11iDrawVictoryScreen(ctx, time);
    v11PageCursor([V11I_VICTORY_RECTS.next, V11I_VICTORY_RECTS.back]);
    drawVolumePill(ctx);
    drawBannerAndToast(ctx, time);
    if (typeof v11gSyncDomGear === 'function') v11gSyncDomGear();
    return;
  }
  V11I_LEGACY_DRAW(g, t);
  if (state === 'upgrade' && V11I_REFRESH_READY && v11iRefreshLeft() > 0 && pointRect(mouse, V11I_REFRESH_RECT)) {
    canvas.style.cursor = 'pointer';
  }
};

const V11I_LEGACY_HANDLE_DOWN = handleDown;
handleDown = function (ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  updatePointer(ev);
  initAudio();
  if (state === 'victory') {
    if (V11I_VICTORY_RECTS.next && pointRect(mouse, V11I_VICTORY_RECTS.next)) { v11iVictoryContinue(); return; }
    if (V11I_VICTORY_RECTS.back && pointRect(mouse, V11I_VICTORY_RECTS.back)) { v11iVictoryBack(); return; }
    return;
  }
  if (state === 'upgrade' && V11I_REFRESH_READY && pointRect(mouse, V11I_REFRESH_RECT)) {
    v11iRefreshUpgradeCards();
    return;
  }
  V11I_LEGACY_HANDLE_DOWN(ev);
};

const V11I_LEGACY_UPDATE = update;
update = function (dt) {
  if (state === 'victory') {
    time += dt;
    if (volumePill) {
      volumePill.t += dt;
      if (volumePill.t >= volumePill.until) volumePill = null;
    }
    updateEffects(dt);
    return;
  }
  V11I_LEGACY_UPDATE(dt);
};

window.addEventListener('keydown', ev => {
  if (state === 'victory') {
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter' || ev.code === 'Space') {
      ev.preventDefault(); ev.stopImmediatePropagation();
      v11iVictoryContinue();
      return;
    }
    if (ev.code === 'Escape') {
      ev.preventDefault(); ev.stopImmediatePropagation();
      v11iVictoryBack();
      return;
    }
    return;
  }
  if (state !== 'upgrade') return;
  if (ev.code !== 'KeyR' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  v11iRefreshUpgradeCards();
}, true);

/* ==================================================================
   v1.1.3：流派驱动进化 · 10 套 Canvas 程序化形态
   ------------------------------------------------------------------
   - 5 流派 × 2 阶；颜色沿用 V11_SCHOOLS 的 color
   - 每个函数 (g, r, cat, t, o)：先画底猫，再叠流派剪影
   - o.headOnly：只画头 + 冠饰；o.overlayOnly：照片叠加，只取外围层
   - o.fxScale：手机 / 小图降粒子（.6）；不缩放底猫
   - 禁止外部图 / 每帧 new Image / 每帧新建渐变
   ================================================================== */
const V11_SCHOOL_FORMS = {
  combo: { t1: v11iDrawComboT1, t2: v11iDrawComboT2 },
  burst: { t1: v11iDrawBurstT1, t2: v11iDrawBurstT2 },
  area: { t1: v11iDrawAreaT1, t2: v11iDrawAreaT2 },
  summon: { t1: v11iDrawSummonT1, t2: v11iDrawSummonT2 },
  heal: { t1: v11iDrawHealT1, t2: v11iDrawHealT2 },
};

function v11iFormFx(o) {
  return clamp((o && o.fxScale) || 1, .5, 1.2);
}

function v11iFormPoly(g, pts, fill, stroke, lw) {
  if (!pts || !pts.length) return;
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1.5; g.stroke(); }
}

/* 底猫：缩放 .72~.82，让流派剪影占 85%+；overlayOnly 时完全不画。 */
function v11iFormBase(g, r, cat, t, o, scale) {
  if (o && o.overlayOnly) return;
  const headOnly = !!(o && o.headOnly);
  const s = headOnly ? .92 : (scale || .8);
  g.save();
  g.scale(s, s);
  v11hDrawCatBase(g, r, cat, t, {
    headOnly,
    hideWeapon: true,
    aim: o && o.aim,
    blink: o && o.blink,
    dead: o && o.dead,
    moving: o && o.moving,
    attackAnim: o && o.attackAnim,
    attackAnimMax: o && o.attackAnimMax,
  });
  g.restore();
}

/* 无渐变的多层柔光，避免每帧 createRadialGradient。 */
function v11iFormGlow(g, x, y, rad, color, alpha) {
  g.save();
  for (let i = 3; i >= 1; i--) {
    g.fillStyle = withAlpha(color, alpha * i / 4);
    g.beginPath(); g.arc(x, y, rad * i / 3, 0, TAU); g.fill();
  }
  g.restore();
}

/* 幽灵小猫随从：尖耳 + 圆头 + 波浪下摆。 */
function v11iFormGhost(g, x, y, s, color, alpha, ink) {
  g.save();
  g.globalAlpha = alpha;
  g.fillStyle = withAlpha(color, .55);
  g.strokeStyle = withAlpha(ink, .55);
  g.lineWidth = Math.max(.8, s * .12);
  for (const sx of [-1, 1]) {
    g.beginPath();
    g.moveTo(x + sx * s * .3, y - s * .2);
    g.lineTo(x + sx * s * .64, y - s * .72);
    g.lineTo(x + sx * s * .78, y - s * .12);
    g.closePath(); g.fill(); g.stroke();
  }
  g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill(); g.stroke();
  g.beginPath();
  g.moveTo(x - s * .86, y + s * .3);
  g.lineTo(x + s * .86, y + s * .3);
  g.lineTo(x + s * .86, y + s * 1.05);
  g.quadraticCurveTo(x + s * .58, y + s * 1.3, x + s * .3, y + s * 1.05);
  g.quadraticCurveTo(x, y + s * 1.32, x - s * .3, y + s * 1.05);
  g.quadraticCurveTo(x - s * .58, y + s * 1.3, x - s * .86, y + s * 1.05);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = withAlpha(ink, .8);
  for (const sx of [-1, 1]) {
    g.beginPath(); g.arc(x + sx * s * .3, y + s * .02, s * .12, 0, TAU); g.fill();
  }
  g.restore();
}

/* ---------------- 连击流：残影箭形猫 ---------------- */
function v11iDrawComboT1(g, r, cat, t, o) {
  o = o || {};
  const col = C.coral, aux = C.mint, ink = C.ink;
  const fx = v11iFormFx(o);
  if (!o.headOnly) {
    g.save();
    // 速度残影线
    for (let i = 0; i < 4; i++) {
      const yy = -r * .78 + i * r * .44;
      g.strokeStyle = withAlpha(aux, .42 - i * .07);
      g.lineWidth = Math.max(1, r * .05);
      g.beginPath();
      g.moveTo(-r * 1.62 - (i % 2) * r * .2, yy);
      g.lineTo(-r * .48, yy);
      g.stroke();
    }
    // 风车阵
    const blades = Math.max(3, Math.round(4 * fx));
    for (let i = 0; i < blades; i++) {
      const a = t * 2.4 + i * TAU / blades;
      const cx = Math.cos(a) * r * 1.28, cy = Math.sin(a) * r * .82;
      g.save(); g.translate(cx, cy); g.rotate(a * 1.7);
      v11iFormPoly(g, [[0, 0], [r * .46, 0], [r * .16, r * .18]],
        withAlpha(col, .5), withAlpha(aux, .6), .8);
      g.restore();
    }
    g.restore();
  }
  v11iFormBase(g, r, cat, t, o, .8);
  // 箭形轮廓：空心 + 低透明填充，不遮脸
  g.save();
  g.strokeStyle = withAlpha(col, .95); g.lineWidth = Math.max(1.5, r * .075);
  g.fillStyle = withAlpha(col, .1);
  g.beginPath();
  g.moveTo(-r * .92, -r * .98); g.lineTo(r * 1.42, -r * .58);
  g.lineTo(r * 1.7, 0); g.lineTo(r * 1.42, r * .58);
  g.lineTo(-r * .92, r * .98); g.lineTo(-r * .46, 0);
  g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = withAlpha(C.white, .62); g.lineWidth = Math.max(1, r * .045);
  g.beginPath(); g.arc(0, r * .06, r * 1.22, -.8, .55); g.stroke();
  g.restore();
  if (o.headOnly) {
    g.save();
    for (let i = 0; i < 3; i++) {
      const a = t * 2.5 + i * TAU / 3;
      g.save(); g.translate(Math.cos(a) * r * 1.25, Math.sin(a) * r * .72);
      v11iFormPoly(g, [[0, 0], [r * .42, 0], [r * .14, r * .16]], withAlpha(col, .55), withAlpha(ink, .3), .7);
      g.restore();
    }
    g.strokeStyle = withAlpha(aux, .5); g.lineWidth = Math.max(1, r * .05);
    for (let i = 0; i < 2; i++) {
      g.beginPath(); g.moveTo(-r * 1.35, -r * .2 + i * r * .5); g.lineTo(-r * .8, -r * .2 + i * r * .5); g.stroke();
    }
    g.restore();
  }
}

function v11iDrawComboT2(g, r, cat, t, o) {
  o = o || {};
  const col = C.coral, aux = C.mint, ink = C.ink;
  const fx = v11iFormFx(o);
  if (!o.headOnly) {
    // 多重分身：两只完整箭形残影猫（尖耳 + 眼光 + 速度线，不再是粉色团块）
    g.save();
    for (let k = 0; k < 2; k++) {
      const ox = -r * (1.52 + k * .52), oy = -r * .06 + k * r * .28;
      g.save();
      g.globalAlpha = .46 - k * .14;
      g.strokeStyle = withAlpha(aux, .8); g.lineWidth = Math.max(1, r * .055);
      for (let i = 0; i < 3; i++) {
        g.beginPath();
        g.moveTo(ox - r * 1.05, oy - r * .22 + i * r * .26);
        g.lineTo(ox - r * .42, oy - r * .22 + i * r * .26);
        g.stroke();
      }
      // 箭形身体（指向右）
      v11iFormPoly(g, [[ox - r * .5, oy - r * .2], [ox + r * .52, oy + r * .02], [ox - r * .12, oy + r * .34]],
        withAlpha(col, .85), withAlpha(aux, .9), Math.max(1, r * .05));
      // 头 + 双尖耳
      circle(g, ox - r * .4, oy - r * .26, r * .3, withAlpha(col, .8), withAlpha(aux, .9), Math.max(1, r * .055));
      v11iFormPoly(g, [[ox - r * .62, oy - r * .44], [ox - r * .8, oy - r * .86], [ox - r * .4, oy - r * .6]],
        withAlpha(col, .8), withAlpha(aux, .85), Math.max(1, r * .045));
      v11iFormPoly(g, [[ox - r * .3, oy - r * .5], [ox - r * .18, oy - r * .9], [ox + r * .02, oy - r * .52]],
        withAlpha(col, .8), withAlpha(aux, .85), Math.max(1, r * .045));
      // 白色眼光
      g.strokeStyle = withAlpha(C.white, .9); g.lineWidth = Math.max(1, r * .06);
      g.beginPath(); g.moveTo(ox - r * .52, oy - r * .3); g.lineTo(ox - r * .24, oy - r * .26); g.stroke();
      g.restore();
    }
    // 6 片风车刃
    const blades = Math.max(4, Math.round(6 * fx));
    for (let i = 0; i < blades; i++) {
      const a = t * 3 + i * TAU / blades;
      g.save(); g.translate(Math.cos(a) * r * 1.55, Math.sin(a) * r * 1.02); g.rotate(a * 1.9);
      v11iFormPoly(g, [[0, 0], [r * .58, 0], [r * .2, r * .2]], withAlpha(col, .55), withAlpha(aux, .7), .9);
      g.restore();
    }
    g.restore();
  }
  v11iFormBase(g, r, cat, t, o, .76);
  g.save();
  // 双层箭形轮廓 + 刃光
  g.strokeStyle = withAlpha(col, .95); g.lineWidth = Math.max(1.8, r * .085);
  g.fillStyle = withAlpha(col, .12);
  g.beginPath();
  g.moveTo(-r * 1.05, -r * 1.08); g.lineTo(r * 1.5, -r * .68);
  g.lineTo(r * 1.92, 0); g.lineTo(r * 1.5, r * .68);
  g.lineTo(-r * 1.05, r * 1.08); g.lineTo(-r * .52, 0);
  g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = withAlpha(aux, .55); g.lineWidth = Math.max(1.2, r * .05);
  g.beginPath(); g.arc(0, r * .05, r * 1.42, -.85, .62); g.stroke();
  // 刃光：头顶与下腹两道交叉弧光，避开脸
  g.strokeStyle = withAlpha(C.white, .9); g.lineWidth = Math.max(1.4, r * .06);
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(-r * 1.32, -r * .98); g.quadraticCurveTo(r * .2, -r * 1.52, r * 1.62, -r * .62); g.stroke();
  g.beginPath(); g.moveTo(-r * 1.28, r * .96); g.quadraticCurveTo(r * .2, r * 1.5, r * 1.6, r * .6); g.stroke();
  g.strokeStyle = withAlpha(aux, .85); g.lineWidth = Math.max(1.2, r * .05);
  for (let i = 0; i < 3; i++) {
    const yy = -r * .5 + i * r * .5;
    g.beginPath(); g.moveTo(r * .9, yy - r * .1); g.lineTo(r * 1.62, yy + r * .1); g.stroke();
  }
  g.restore();
  if (o.headOnly) {
    g.save();
    for (let i = 0; i < 4; i++) {
      const a = t * 3 + i * TAU / 4;
      g.save(); g.translate(Math.cos(a) * r * 1.4, Math.sin(a) * r * .8); g.rotate(a * 2);
      v11iFormPoly(g, [[0, 0], [r * .5, 0], [r * .18, r * .18]], withAlpha(col, .55), withAlpha(aux, .7), .8);
      g.restore();
    }
    g.restore();
  }
}

/* ---------------- 爆发流：熔岩重甲坦克猫 ---------------- */
function v11iDrawBurstT1(g, r, cat, t, o) {
  o = o || {};
  const col = C.gold, aux = C.coralDeep, ink = C.ink;
  const fx = v11iFormFx(o);
  const lw = Math.max(1.3, r * .07);
  // 宽体暗底盘：剪影从“猫”拉成“坦克”，比底猫宽 2.4 倍
  v11iFormPoly(g, [
    [-r * 1.32, -r * .44], [r * 1.32, -r * .44],
    [r * 1.18, r * 1.08], [-r * 1.18, r * 1.08],
  ], withAlpha(ink, .16), null, 0);
  // 后层：巨角 + 宽肩甲底座（底猫压在上面，只露出外侧硬轮廓）
  g.save();
  for (const sx of [-1, 1]) {
    v11iFormPoly(g, [[sx * r * .5, -r * .5], [sx * r * 1.08, -r * 1.38], [sx * r * 1.02, -r * .3]],
      withAlpha(aux, .5), ink, lw * 1.2);
    v11iFormPoly(g, [[sx * r * .46, -r * .4], [sx * r * 1.58, -r * .56], [sx * r * 1.64, r * .36], [sx * r * .5, r * .6]],
      withAlpha(col, .62), ink, lw * 1.4);
  }
  g.restore();
  v11iFormBase(g, r, cat, t, o, .7);
  g.save();
  if (o.headOnly) {
    // 小图：只留双巨角 + 肩甲块 + 熔岩核心
    for (const sx of [-1, 1]) {
