  drawText(g, `${MODES[run.mode].name} · ${th.name} · ${room && room.bossRoom ? 'BOSS ROOM' : '探索中'}`,

  const waveText = room ? (room.cleared ? '已清空' : `波次 ${Math.min(room.waveIndex, room.waves.length)}/${room.waves.length}`) : '';
  drawText(g, `${roomText}   ·   ${waveText}`, W / 2, 70, 11, room && room.cleared ? C.mint : withAlpha(C.cream, .72), { align: 'center', weight: 700 });
  for (let i = 0; i < run.roomsThisStage; i++) {
    const px = W / 2 - (run.roomsThisStage - 1) * 7 + i * 14;
    circle(g, px, 82, 3.2, i === run.roomNumber - 1 ? C.gold : (i < run.roomNumber - 1 ? C.mint : withAlpha(C.cream, .25)), null, 0);
  }

  // ------- 右上：击杀 / 分数 / 种子 / 音量（与设置面板同一数据源） -------
  panel(g, 790, 12, 474, 78, 18, '#fff3d9', C.ink, 4, 5);
  g.strokeStyle = withAlpha(C.ink, .15); g.lineWidth = 2;
  g.beginPath(); g.moveTo(916, 24); g.lineTo(916, 78); g.stroke();
  g.beginPath(); g.moveTo(1046, 24); g.lineTo(1046, 78); g.stroke();
  g.beginPath(); g.moveTo(1202, 24); g.lineTo(1202, 78); g.stroke();
  drawText(g, '本局击杀', 806, 31, 10, C.inkSoft, { weight: 800 });
  drawText(g, formatNum(run.kills), 806, 57, 25, C.ink, { weight: 900 });
  drawUpgradeIcon(g, 882, 52, 20, 'claw', C.coral);
  drawText(g, '分数', 928, 31, 10, C.inkSoft, { weight: 800 });
  drawText(g, formatNum(run.score), 928, 57, 25, C.ink, { weight: 900, line: 0 });
  drawStar(g, 1024, 54, 6, 2.5, 5, C.gold, null, 0);
  drawText(g, '本局种子', 1056, 27, 9, C.inkSoft, { weight: 800 });
  drawText(g, run.seedHex.slice(0, 4) + ' ' + run.seedHex.slice(4), 1056, 47, 12, C.ink, { weight: 900, line: 0 });
  const mpHud = modeProgressFor(run.mode);
  drawText(g, `最佳 ${mpHud ? stageLabel(mpHud.bestStage || 1, run.mode) : '-'} · 本局 ${formatNum(run.kills)} 杀`,

  // HUD 音量 / 静音按钮：点击立刻与设置面板同步
  const muteHover = pointRect(mouse, hudMuteRect);
  fillRound(g, hudMuteRect.x, hudMuteRect.y, hudMuteRect.w, hudMuteRect.h, 12,
    muteHover ? withAlpha(settings.muted ? C.coral : C.mint, .18) : withAlpha(C.ink, .04));
  strokeRound(g, hudMuteRect.x, hudMuteRect.y, hudMuteRect.w, hudMuteRect.h, 12,
    withAlpha(C.ink, muteHover ? .45 : .16), muteHover ? 2 : 1.5);
  drawSpeakerIcon(g, hudMuteRect.x + 20, hudMuteRect.y + 21, 16, settings.muted, C.ink);
  drawText(g, settings.muted ? '静' : '音', hudMuteRect.x + 32, hudMuteRect.y + 21, 9, withAlpha(C.inkSoft, .7), { weight: 800 });

  // ------- 底部 -------
  drawBuildStrip(g, t);

    const x = 552, y = 681, w = 480, h = 30;

    strokeRound(g, x, y, w, h, 12, withAlpha(C.cream, .16), 1.5);
    drawText(g, '左键 / J  挥爪      SPACE  冲刺斩      撞进猫门过关', x + w / 2, y + 15, 10, withAlpha(C.cream, .62), { align: 'center' });
  }
  drawControlHint(g);
}

function drawBannerAndToast(g, t) {
  // 关卡横幅只在战斗相关状态显示，避免主页 / 选关 / 设置被残留横幅遮挡。
  const bannerVisible = state === 'playing' || state === 'transition' || state === 'dead' || state === 'gameover';
  if (banner && bannerVisible) {
    const b = banner;
    const total = Math.max(.01, b.duration);
    const inT = clamp(b.elapsed / .22, 0, 1);
    const outT = clamp((total - b.elapsed) / .35, 0, 1);
    const a = Math.min(easeOut(inT), outT);
    if (a > .01) {
      const yy = 202 - (1 - easeOut(inT)) * 18;
      g.save();
      g.globalAlpha = a;
      fillRound(g, W / 2 - 318, yy - 34, 636, 72, 20, withAlpha(C.ink, .4));
      panel(g, W / 2 - 312, yy - 38, 624, 68, 18, '#fff2d6', C.ink, 4, 4);
      fillRound(g, W / 2 - 306, yy - 32, 612, 9, 4.5, b.color);
      drawText(g, b.title, W / 2, yy - 10, 28, C.ink, { align: 'center', line: 0, weight: 900 });
      if (b.subtitle) drawText(g, b.subtitle, W / 2, yy + 19, 12, C.inkSoft, { align: 'center', weight: 700 });
      drawStar(g, W / 2 - 282, yy - 9, 10, 4, 5, b.color, C.ink, 2, t);
      drawStar(g, W / 2 + 282, yy - 9, 10, 4, 5, b.color, C.ink, 2, -t);
      g.restore();
    }
  }
  if (toast) {
    const a = Math.min(1, Math.min(toast.elapsed / .18, (toast.duration - toast.elapsed) / .3));
    if (a > 0) {
      g.save();
      g.globalAlpha = clamp(a, 0, 1);
      g.font = '700 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
      const tw = Math.min(840, Math.max(210, g.measureText(toast.text).width + 58));
      const x = W / 2 - tw / 2, y = 639;
      fillRound(g, x + 3, y + 3, tw, 26, 13, withAlpha(C.ink, .35));
      fillRound(g, x, y, tw, 26, 13, withAlpha('#2b1c36', .9));
      strokeRound(g, x, y, tw, 26, 13, withAlpha(toast.color, .5), 1.5);
      drawText(g, toast.text, W / 2, y + 14, 12, toast.color, { align: 'center', weight: 700 });
      g.restore();
    }
  }
}

let titleBgCache = null;
const titleStartRect = { x: 490, y: 486, w: 300, h: 76 };
const titleSettingsRect = { x: 1092, y: 34, w: 156, h: 46 };
const pauseRects = [];
const gameoverRestartRect = { x: 468, y: 558, w: 344, h: 62 };

function pointRect(p, r) {
  return p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function makeTitleBackground() {
  if (titleBgCache) return titleBgCache;
  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  const g = bg.getContext('2d');
  const rr = seeded(0xB47B1E5);
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#1d122c');
  grd.addColorStop(.48, '#2e1d3e');
  grd.addColorStop(1, '#4a2949');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  // 剧场灯光
  g.save();
  g.globalAlpha = .24;
  const beam = g.createRadialGradient(W / 2, 380, 40, W / 2, 430, 680);
  beam.addColorStop(0, '#fff4cc');
  beam.addColorStop(.42, '#ffc26e');
  beam.addColorStop(1, 'rgba(120,70,110,0)');
  g.fillStyle = beam;
  g.beginPath(); g.ellipse(W / 2, 410, 650, 370, 0, 0, TAU); g.fill();
  g.restore();

  // 放射条纹
  g.save(); g.translate(W / 2, 390);
  for (let i = 0; i < 18; i++) {
    const a0 = i * TAU / 18, a1 = a0 + TAU / 36;
    g.fillStyle = i % 2 ? 'rgba(255,226,160,.035)' : 'rgba(255,120,150,.028)';
    g.beginPath(); g.moveTo(0, 0);
    g.arc(0, 0, 880, a0, a1); g.closePath(); g.fill();
  }
  g.restore();

  // 背景涂鸦
  for (let i = 0; i < 54; i++) {
    const x = rr() * W, y = 50 + rr() * (H - 70), s = 4 + rr() * 12;
    g.globalAlpha = .09 + rr() * .16;
    const type = i % 4;
    if (type === 0) drawPaw(g, x, y, s, i % 2 ? C.pink : C.cream);
    else if (type === 1) drawStar(g, x, y, s, s * .45, 5, C.gold, null, 0, rr() * TAU);
    else if (type === 2) drawFish(g, x, y, s, null, C.mint, 1.2, rr() * TAU);
    else {
      g.strokeStyle = C.cream; g.lineWidth = 1.5;
      g.beginPath(); g.arc(x, y, s, 0, TAU * (.4 + rr())); g.stroke();
    }
  }
  g.globalAlpha = 1;

  // 舞台地板
  g.save();
  fillRound(g, 70, 415, 1140, 258, 46, 'rgba(20,10,27,.42)');
  fillRound(g, 94, 432, 1092, 225, 36, 'rgba(255,238,200,.055)');
  g.strokeStyle = 'rgba(255,238,200,.14)'; g.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const y = 456 + i * 27;
    g.beginPath(); g.moveTo(122 + i * 10, y); g.lineTo(1158 - i * 10, y); g.stroke();
  }
  g.strokeStyle = 'rgba(255,200,120,.18)'; g.lineWidth = 3;
  g.beginPath(); g.ellipse(W / 2, 513, 430, 90, 0, 0, TAU); g.stroke();
  g.beginPath(); g.ellipse(W / 2, 513, 300, 68, 0, 0, TAU); g.stroke();
  g.restore();

  // 顶部三角彩旗
  for (let i = 0; i < 12; i++) {
    const x = 115 + i * 90;
    g.fillStyle = [C.coral, C.gold, C.mint, C.lavender][i % 4];
    g.globalAlpha = .55;
    g.beginPath(); g.moveTo(x, 28 + Math.sin(i * .9) * 5); g.lineTo(x + 38, 28 + Math.sin(i * .9) * 5); g.lineTo(x + 19, 75); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
  g.strokeStyle = withAlpha(C.ink, .6); g.lineWidth = 3;
  g.beginPath(); g.moveTo(60, 36); g.quadraticCurveTo(W / 2, 78, W - 60, 36); g.stroke();

  // 左右垂帘
  for (const side of [-1, 1]) {
    g.save();
    g.fillStyle = 'rgba(255,111,134,.13)';
    g.beginPath();
    const x = side < 0 ? 0 : W;
    g.moveTo(x, 0); g.lineTo(x - side * 184, 0);
    g.quadraticCurveTo(x - side * 120, 250, x - side * 150, 490);
    g.lineTo(x, 540);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,210,165,.14)'; g.lineWidth = 2; g.stroke();
    g.restore();
  }

  // 边角暗角
  const vg = g.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 790);
  vg.addColorStop(.55, 'rgba(13,7,20,0)');
  vg.addColorStop(1, 'rgba(10,5,15,.7)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  titleBgCache = bg;
  return bg;
}

/* 档案正文按宽度自动换行，必要时缩小字号，最多三行。 */
function fitCaseLines(g, text, maxWidth, maxLines, startSize) {
  const family = '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
  let size = startSize;
  let lines = [];
  while (size >= 10) {
    lines = wrapText(g, text, maxWidth, `700 ${size}px ${family}`);
    if (lines.length <= maxLines) break;
    size -= .5;
  }
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[lines.length - 1] = lines[lines.length - 1].replace(/[，。；、]?$/, '…');
  }
  return { lines, size };
}

function drawCaseFileRow(g, x, y, w, h, number, label, english, body, accent, icon, t) {

  fillRound(g, x + 8, y + 8, 138, h - 16, 10, accent);
  strokeRound(g, x + 8, y + 8, 138, h - 16, 10, withAlpha(C.ink, .6), 2);
  drawText(g, number, x + 22, y + 17, 10, withAlpha(C.ink, .55), { weight: 900 });
  drawText(g, label, x + 22, y + 42, 19, C.ink, { weight: 900 });
  drawText(g, english, x + 22, y + 64, 8, withAlpha(C.ink, .48), { weight: 900 });

  g.save(); g.strokeStyle = withAlpha(C.ink, .15); g.lineWidth = 1.5; g.setLineDash([3, 4]);
  g.beginPath(); g.moveTo(x + w - 108, y + 10); g.lineTo(x + w - 108, y + h - 10); g.stroke();
  g.restore();

  const textX = x + 164;
  const textW = w - 164 - 120;
  const fit = fitCaseLines(g, body, textW, 3, 13);
  const lineH = fit.size + 5.5;
  const startY = y + h / 2 - ((fit.lines.length - 1) * lineH) / 2;
  for (let i = 0; i < fit.lines.length; i++) {
    drawText(g, fit.lines[i], textX, startY + i * lineH, fit.size, C.inkSoft, { weight: 700 });
  }

  circle(g, x + w - 54, y + h / 2, 32, withAlpha(accent, .13), withAlpha(C.ink, .35), 1.8);
  icon(g, x + w - 54, y + h / 2, t);
}

function drawGearIcon(g, x, y, r, color = C.ink) {
  g.save(); g.translate(x, y); g.fillStyle = color; g.strokeStyle = color;
  for (let i = 0; i < 8; i++) {
    g.save(); g.rotate(i * TAU / 8);
    g.fillRect(-r * .16, -r * 1.02, r * .32, r * .38);
    g.restore();
  }
  g.beginPath(); g.arc(0, 0, r * .72, 0, TAU); g.fill();
  g.fillStyle = C.cream;
  g.beginPath(); g.arc(0, 0, r * .32, 0, TAU); g.fill();
  g.restore();
}

function drawSpeakerIcon(g, x, y, s, mutedNow = false, color = C.ink) {
  g.save(); g.translate(x, y); g.strokeStyle = color; g.fillStyle = color;
  g.beginPath();
  g.moveTo(-s * .55, -s * .2); g.lineTo(-s * .2, -s * .2);
  g.lineTo(s * .15, -s * .58); g.lineTo(s * .15, s * .58);
  g.lineTo(-s * .2, s * .2); g.lineTo(-s * .55, s * .2);
  g.closePath(); g.fill();
  if (!mutedNow) {
    g.lineWidth = Math.max(1.5, s * .12);
    g.beginPath(); g.arc(s * .08, 0, s * .38, -.7, .7); g.stroke();
    g.beginPath(); g.arc(s * .08, 0, s * .65, -.8, .8); g.stroke();
  } else {
    g.lineWidth = Math.max(2, s * .15); g.strokeStyle = C.coralDeep;
    g.beginPath(); g.moveTo(s * .35, -s * .5); g.lineTo(s * .82, s * .5); g.stroke();
    g.beginPath(); g.moveTo(s * .82, -s * .5); g.lineTo(s * .35, s * .5); g.stroke();
  }
  g.restore();
}

function drawHomeModeIcon(g, id, x, y, r, color) {
  if (id === 'easy') {
    drawPaw(g, x, y, r, color);
  } else if (id === 'hard') {
    drawStar(g, x, y, r, r * .55, 5, color, C.ink, 2.2, -.4);
  } else if (id === 'hell') {
    circle(g, x, y, r * .8, color, C.ink, 2.5);
    drawBeastEye(g, x - r * .28, y, r * .22, r * .22, 0, 0);
    drawBeastEye(g, x + r * .28, y, r * .22, r * .22, 0, 0);
  } else if (id === 'story') {
    g.save(); g.translate(x, y);
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(-r * .85, -r * .62); g.lineTo(0, -r * .38); g.lineTo(r * .85, -r * .62);
    g.lineTo(r * .85, r * .58); g.lineTo(0, r * .82); g.lineTo(-r * .85, r * .58); g.closePath();
    g.fill(); g.stroke();
    g.strokeStyle = withAlpha(C.ink, .55); g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(0, -r * .38); g.lineTo(0, r * .82); g.stroke();
    g.restore();

    g.save(); g.translate(x, y);

      g.beginPath(); g.arc(0, 0, r * (.45 + i * .24), i * 1.2, i * 1.2 + 3.8); g.stroke();

    g.restore();
  }
}

  fillRound(g, x, y, w, h, 16, hover ? withAlpha(accent, .2) : withAlpha('#2a1b3a', .92));
  strokeRound(g, x, y, w, h, 16, hover ? accent : withAlpha(accent, .45), hover ? 3 : 2);
  fillRound(g, x, y, 7, h, 3.5, accent);
  circle(g, x + 42, y + h / 2, 23, withAlpha(accent, .2), withAlpha(accent, .65), 2);
  drawHomeModeIcon(g, modeId, x + 42, y + h / 2, 16, accent);

  drawText(g, MODE_TAGLINE[modeId], x + 78, y + 48, 11, withAlpha(C.cream, .72), { weight: 700 });
  const prog = profile ? profile.modes[modeId] : null;
  drawText(g, prog ? modeProgressLabel(modeId, prog) : '未选存档', x + w - 18, y + 24, 13, accent, { align: 'right', weight: 900 });

  const prof = slotCache[slot];
  const active = activeSlot === slot && profile;

  const sr = titleSettingsRect;

  fillRound(g, sr.x + 4, sr.y + 5, sr.w, sr.h, 14, withAlpha(C.ink, .4));

    drawHomeModeCard(g, modeIds[i], 64, 188 + i * 91, 556, 80, t);

  // 存档位（9 槽）。
  drawText(g, '存档位 · 9 槽', 660, 174, 13, withAlpha(C.cream, .6), { weight: 800 });
  drawText(g, `最后使用：${activeSlot ? '槽 ' + activeSlot : '无'}`, 1216, 174, 11,
    activeSlot ? C.mint : withAlpha(C.cream, .45), { align: 'right', weight: 700 });
  for (let i = 1; i <= SAVE_SLOTS; i++) {
    const col = (i - 1) % 3, row = Math.floor((i - 1) / 3);

    withAlpha(C.cream, .42), { align: 'center', weight: 700 });

  // 弹层：槽位菜单 / 覆盖删除确认。
  if (slotMenu) drawSlotMenu(g, t);
  if (confirmAction) drawConfirmDialog(g, t);
}

function drawStoryPortrait(g, key, x, y, scale, t, alpha = 1) {
  g.save();
  g.globalAlpha *= alpha;
  g.translate(x + Math.sin(t * 1.4) * 5, y + Math.sin(t * 2.1) * 6);
  g.rotate(Math.sin(t * .8) * .012);
  const s = scale || 1;
  if (key === 'mirror') {
    // 镜子猫：一面有猫耳的椭圆铜镜，镜中倒影会自己动。
    g.save(); g.translate(0, 6);
    g.fillStyle = '#6e4f9d'; g.strokeStyle = C.ink; g.lineWidth = 6;
    g.beginPath(); g.ellipse(0, -18, 92 * s, 128 * s, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#bda2ee'; g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, -18, 82 * s, 116 * s, 0, 0, TAU); g.fill(); g.stroke();
    const grad = g.createLinearGradient(-60 * s, -110 * s, 60 * s, 100 * s);
    grad.addColorStop(0, '#e8e1ff'); grad.addColorStop(.5, '#b9d7f8'); grad.addColorStop(1, '#8d75c7');
    g.fillStyle = grad;
    g.beginPath(); g.ellipse(0, -18, 70 * s, 104 * s, 0, 0, TAU); g.fill();
    drawCatHead(g, 0, -28 * s, 58 * s, player ? (player.form || 0) : 0, t);
    g.save(); g.globalAlpha = .35; g.strokeStyle = C.white; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-54 * s, -64 * s); g.lineTo(-38 * s, -40 * s); g.lineTo(-44 * s, -8 * s); g.stroke();
    g.beginPath(); g.moveTo(44 * s, -70 * s); g.lineTo(26 * s, -38 * s); g.stroke();
    g.restore();
    // 镜框小耳朵，坚定地宣称自己也是猫
    catEar(g, -72 * s, -118 * s, 24 * s, 38 * s, -.28, '#bda2ee', '#ffd9e2');
    catEar(g, 72 * s, -118 * s, 24 * s, 38 * s, .28, '#bda2ee', '#ffd9e2');
    g.fillStyle = C.gold; g.strokeStyle = C.ink; g.lineWidth = 4;
    g.beginPath(); g.ellipse(0, 108 * s, 30 * s, 20 * s, 0, 0, TAU); g.fill(); g.stroke();
    drawStar(g, 0, 108 * s, 12 * s, 5 * s, 5, C.cream, null, 0, t);
    g.restore();
  } else if (key === 'star') {
    // 星星猫：宇宙路灯本体，圆滚滚但头顶一颗大星。
    g.save();
    for (let i = 0; i < 5; i++) {
      const a = t * .7 + i * TAU / 5;
      g.save(); g.globalAlpha = .55;
      drawStar(g, Math.cos(a) * 112 * s, -66 * s + Math.sin(a) * 45 * s, 10 * s, 4 * s, 5, C.gold, null, 0, a);
      g.restore();
    }
    catEar(g, -48 * s, -78 * s, 26 * s, 38 * s, -.24, '#8f86de', '#ffd9ef');
    catEar(g, 48 * s, -78 * s, 26 * s, 38 * s, .24, '#8f86de', '#ffd9ef');
    ellipse(g, 0, -2 * s, 72 * s, 70 * s, '#8f86de', C.ink, 5);
    ellipse(g, 0, 26 * s, 34 * s, 26 * s, '#c0b8ff', null, 0);
    drawStar(g, 0, -106 * s, 34 * s, 15 * s, 5, C.gold, C.ink, 3, t * .4);
    drawStar(g, 0, -46 * s, 7 * s, 3 * s, 5, C.cream, null, 0, t);
    ellipse(g, -27 * s, -12 * s, 14 * s, 17 * s, C.white, C.ink, 2);
    ellipse(g, 27 * s, -12 * s, 14 * s, 17 * s, C.white, C.ink, 2);
    circle(g, -25 * s, -9 * s, 7 * s, C.ink, null, 0);
    circle(g, 25 * s, -9 * s, 7 * s, C.ink, null, 0);
    g.strokeStyle = C.ink; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-13 * s, 17 * s); g.quadraticCurveTo(0, 26 * s, 13 * s, 17 * s); g.stroke();
    // 小短手举着路灯
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-58 * s, 30 * s); g.lineTo(-84 * s, 8 * s); g.stroke();
    g.beginPath(); g.moveTo(58 * s, 30 * s); g.lineTo(84 * s, 8 * s); g.stroke();
    g.restore();
  } else if (key === 'seeker') {
    // 找猫狂：脸真的丢了，只剩下一大片空白和问号；披着破斗篷。
    g.save();
    g.fillStyle = '#493b62'; g.strokeStyle = C.ink; g.lineWidth = 5;
    g.beginPath();
    g.moveTo(-82 * s, 108 * s); g.quadraticCurveTo(-60 * s, -54 * s, 0, -80 * s);
    g.quadraticCurveTo(56 * s, -54 * s, 82 * s, 108 * s);
    g.quadraticCurveTo(0, 130 * s, -82 * s, 108 * s); g.closePath(); g.fill(); g.stroke();
    // 破布角
    for (let i = 0; i < 4; i++) {
      g.fillStyle = i % 2 ? '#5b4a76' : '#3d304f';
      g.beginPath();
      g.moveTo(-70 * s + i * 42 * s, 106 * s); g.lineTo(-58 * s + i * 42 * s, 130 * s); g.lineTo(-42 * s + i * 42 * s, 104 * s); g.closePath(); g.fill();
    }
    // 空白脸
    ellipse(g, 0, -26 * s, 60 * s, 56 * s, '#f7eee2', C.ink, 4);
    g.strokeStyle = withAlpha(C.ink, .28); g.lineWidth = 2;
    g.beginPath(); g.moveTo(-34 * s, -44 * s); g.lineTo(34 * s, -20 * s); g.stroke();
    g.beginPath(); g.moveTo(-18 * s, -58 * s); g.lineTo(24 * s, -44 * s); g.stroke();
    drawText(g, '?', 22 * s, -25 * s, 44 * s, C.coralDeep, { align: 'center', weight: 900, rotation: .12 });
    // 破耳朵 + 绷带
    catEar(g, -52 * s, -78 * s, 24 * s, 38 * s, -.35, '#493b62', '#7d6a95');
    catEar(g, 50 * s, -78 * s, 22 * s, 34 * s, .38, '#493b62', '#7d6a95');
    g.fillStyle = C.cream; g.strokeStyle = C.ink; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-58 * s, -45 * s); g.lineTo(6 * s, -74 * s); g.lineTo(11 * s, -62 * s); g.lineTo(-54 * s, -33 * s); g.closePath(); g.fill(); g.stroke();
    // 巨大的找猫放大镜
    g.strokeStyle = C.ink; g.lineWidth = 7;
    g.beginPath(); g.arc(104 * s, 16 * s, 36 * s, 0, TAU); g.stroke();
    g.strokeStyle = C.gold; g.lineWidth = 3;
    g.beginPath(); g.arc(104 * s, 16 * s, 30 * s, 0, TAU); g.stroke();
    g.lineCap = 'round'; g.lineWidth = 12;
    g.beginPath(); g.moveTo(78 * s, 52 * s); g.lineTo(55 * s, 86 * s); g.stroke();
    g.restore();
  } else if (key === 'archive') {
    g.save(); g.rotate(-.04);
    g.fillStyle = '#d9c4a2'; g.strokeStyle = C.ink; g.lineWidth = 5;
    roundRectPath(g, -92 * s, -94 * s, 184 * s, 218 * s, 12 * s); g.fill(); g.stroke();
    g.fillStyle = '#f8e8c8';
    roundRectPath(g, -82 * s, -110 * s, 174 * s, 198 * s, 9 * s); g.fill();
    strokeRound(g, -82 * s, -110 * s, 174 * s, 198 * s, 9 * s, C.ink, 3);
    g.fillStyle = C.coralDeep;

    g.restore();

    g.beginPath(); g.moveTo(64 * s, -38 * s); g.quadraticCurveTo(100 * s, -84 * s, 90 * s, -8 * s); g.quadraticCurveTo(60 * s, -3 * s, 64 * s, -38 * s); g.closePath(); g.fill(); g.stroke();
    // 收缩瞳孔
    ellipse(g, -25 * s, -15 * s, 18 * s, 22 * s, C.white, C.ink, 2.4);
    ellipse(g, 25 * s, -15 * s, 18 * s, 22 * s, C.white, C.ink, 2.4);
    circle(g, -25 * s, -12 * s, 9 * s, C.ink, null, 0);
    circle(g, 25 * s, -12 * s, 9 * s, C.ink, null, 0);
    // 大嘴和牙
    g.fillStyle = C.ink;
    g.beginPath(); g.ellipse(0, 36 * s, 44 * s, 20 * s, 0, 0, TAU); g.fill();

function drawStoryScreen(g, t) {
  if (!story) return;
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#100b1b');
  bg.addColorStop(.45, '#261833');
  bg.addColorStop(1, '#4b2a48');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // 幕布 + 圆形追光
  g.save();
  const spot = g.createRadialGradient(318, 304, 20, 318, 330, 360);
  spot.addColorStop(0, 'rgba(255,235,183,.22)');
  spot.addColorStop(.5, 'rgba(190,145,225,.1)');
  spot.addColorStop(1, 'rgba(20,10,28,0)');
  g.fillStyle = spot; g.fillRect(0, 0, W, H);
  g.restore();
  // 星星与漂浮的喵影
  for (let i = 0; i < 26; i++) {
    const a = i * 2.1 + t * .3;
    const x = 30 + ((i * 173) % 1200);
    const y = 28 + ((i * 71) % 470);
    g.save(); g.globalAlpha = .18 + Math.sin(t * 1.4 + i) * .08;
    drawStar(g, x, y, 3 + i % 4, 1.4, 5, i % 3 ? C.cream : C.gold, null, 0, a);
    g.restore();
  }

  drawText(g, story.chapter.title, 78, 50, 31, C.cream, { line: 5, weight: 900 });
  drawText(g, story.chapter.subtitle || '', 80, 82, 11, withAlpha(C.gold, .82), { weight: 700 });
  g.strokeStyle = withAlpha(C.cream, .2); g.lineWidth = 2;
  g.beginPath(); g.moveTo(78, 102); g.lineTo(440, 102); g.stroke();

  // 跳章按钮
  const sv = story.skipRect;
  const sh = pointRect(mouse, sv);
  fillRound(g, sv.x, sv.y, sv.w, sv.h, 10, sh ? withAlpha(C.coral, .85) : withAlpha(C.ink, .48));
  strokeRound(g, sv.x, sv.y, sv.w, sv.h, 10, withAlpha(C.cream, sh ? .7 : .3), 1.5);
  drawText(g, '跳过章节', sv.x + sv.w / 2, sv.y + sv.h / 2, 10, C.cream, { align: 'center', weight: 800 });

  if (story.phase === 'gate') {
    // 已读章节选择：重看本章 / 直接跳过
    g.fillStyle = 'rgba(12,7,18,.55)'; g.fillRect(0, 0, W, H);
    const px = 340, py = 186, pw = 600, ph = 348;
    panel(g, px, py, pw, ph, 24, '#fff3d9', C.ink, 5, 10);
    drawText(g, '本章已看过', W / 2, py + 54, 31, C.ink, { align: 'center', weight: 900 });
    drawText(g, story.chapter.title, W / 2, py + 94, 18, C.inkSoft, { align: 'center', weight: 800 });
    drawText(g, '猫的记忆还在，但宇宙不介意你再演一遍。', W / 2, py + 126, 11, withAlpha(C.inkSoft, .68), { align: 'center', weight: 700 });
    drawCatHead(g, W / 2, py + 185, 28, player ? (player.form || 0) : 0, t);
    storyGateRects.length = 0;
    const replay = { x: px + 58, y: py + 236, w: 226, h: 58, id: 'replay' };
    const skip = { x: px + pw - 284, y: py + 236, w: 226, h: 58, id: 'skip' };
    storyGateRects.push(replay, skip);
    for (const [btn, label, accent, hover] of [
      [replay, '重看本章', C.gold, pointRect(mouse, replay)],
      [skip, '跳过 · 下一关', '#e6d7c1', pointRect(mouse, skip)],
    ]) {
      fillRound(g, btn.x + 4, btn.y + 5, btn.w, btn.h, 15, withAlpha(C.ink, .25));
      fillRound(g, btn.x, btn.y, btn.w, btn.h, 15, hover ? '#ffe083' : accent);
      strokeRound(g, btn.x, btn.y, btn.w, btn.h, 15, C.ink, hover ? 3 : 2);
      drawText(g, label, btn.x + btn.w / 2, btn.y + 29, 16, C.ink, { align: 'center', weight: 900 });
    }
    drawText(g, 'Enter 重看   ·   Space 跳过', W / 2, py + 316, 10, withAlpha(C.inkSoft, .6), { align: 'center', weight: 700 });
    return;
  }

  const line = story.chapter.lines[story.line];
  if (!line) return;
  const enter = easeOut(story.enter);
  // 角色立绘入场
  g.save();
  g.globalAlpha = enter;
  drawStoryPortrait(g, line.portrait || 'player', 292 - (1 - enter) * 52, 306, 1.05, t + story.line, enter);
  g.restore();

  // 对话框
  const dx = 382, dy = 444, dw = 842, dh = 224;
  fillRound(g, dx + 7, dy + 8, dw, dh, 22, withAlpha(C.ink, .4));
  fillRound(g, dx, dy, dw, dh, 22, withAlpha('#1c1127', .96));
  strokeRound(g, dx, dy, dw, dh, 22, withAlpha(C.gold, .55), 2);
  fillRound(g, dx + 22, dy - 18, 208, 36, 18, C.gold);
  strokeRound(g, dx + 22, dy - 18, 208, 36, 18, C.ink, 2.2);
  drawText(g, line.who, dx + 126, dy, 15, C.ink, { align: 'center', weight: 900 });
  drawPaw(g, dx + 41, dy, 9, C.coral, .7);

  // 打字机文本（预换行，保证逐字出现不跳动）
  g.save();
  g.font = storyFont();
  let revealed = Math.floor(story.reveal);
  let ty = dy + 46;
  for (let i = 0; i < story.wrapped.length; i++) {
    const part = story.wrapped[i].slice(0, Math.max(0, revealed));
    drawText(g, part, dx + 32, ty, 20, C.cream, { line: 0, weight: 800 });
    revealed -= story.wrapped[i].length;
    ty += 30;
    if (revealed <= 0) break;
  }
  g.restore();

  // 继续提示
  const done = story.reveal >= line.text.length;
  if (done) {
    const pulse = .55 + Math.sin(t * 4.4) * .3;
    drawText(g, story.line >= story.chapter.lines.length - 1 ? '点击 / Enter · 进入下一关' : '点击 / Enter · 继续',
      dx + dw - 28, dy + dh - 24, 11, withAlpha(C.gold, pulse), { align: 'right', weight: 800 });
  }
  drawText(g, 'Esc · 跳过本章', dx + 28, dy + dh - 24, 10, withAlpha(C.cream, .38), { weight: 700 });

  // 进度点
  for (let i = 0; i < story.chapter.lines.length; i++) {
    const px = W / 2 - (story.chapter.lines.length - 1) * 9 + i * 18;
    circle(g, px, 690, 4, i === story.line ? C.gold : (i < story.line ? C.mint : withAlpha(C.cream, .25)), null, 0);
  }
}

/* ---------------------------- 结局：悬案仍未告破 ---------------------------- */
function drawSimpleMob(g, x, y, r, color, t, boss = false) {
  ellipse(g, x, y, r, r * .92, color, C.ink, 3);
  catEar(g, x - r * .58, y - r * .55, r * .28, r * .38, -.25, color, withAlpha(C.coral, .6));
  catEar(g, x + r * .58, y - r * .55, r * .28, r * .38, .25, color, withAlpha(C.coral, .6));
  drawBeastEye(g, x - r * .3, y - r * .08, r * .16, r * .2, 0, 0, boss ? 'angry' : 'normal');
  drawBeastEye(g, x + r * .3, y - r * .08, r * .16, r * .2, 0, 0, boss ? 'angry' : 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x - r * .2, y + r * .28); g.quadraticCurveTo(x, y + r * .42, x + r * .2, y + r * .28); g.stroke();
  if (boss) drawStar(g, x, y - r * .92, r * .23, r * .1, 5, C.coral, C.ink, 1.5, t);
}

function drawMemoryCard(g, card, x, y, w, h, rot, t, index) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.globalAlpha = clamp((ending.t - index * .18) / .35, 0, 1);
  fillRound(g, 6, 7, w, h, 10, withAlpha(C.ink, .34));
  fillRound(g, 0, 0, w, h, 10, '#fff4dd');
  strokeRound(g, 0, 0, w, h, 10, C.ink, 3);
  fillRound(g, 8, 8, w - 16, 22, 5, withAlpha(card.boss ? C.coral : C.mint, .32));
  drawText(g, `STAGE ${String(card.stage).padStart(2, '0')} · ROOM ${card.room}`, 14, 19, 8, C.ink, { weight: 900 });

  // 迷你战斗剪影：主角 + 怪 + 爪痕 + 猫粮
  const iw = w - 20, ih = h - 46;
  g.save(); g.translate(10, 34);
  fillRound(g, 0, 0, iw, ih, 6, '#2b1c39');
  g.strokeStyle = withAlpha(C.cream, .15); g.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(0, i * ih / 4); g.lineTo(iw, i * ih / 4); g.stroke();
  }
  const fake = {
    x: iw * .34, y: ih * .54, r: 13, form: card.form, moving: false,
    aim: -.5, attackAnim: 0, attackAnimMax: .22, dashCd: 0,
    dashCooldown: BALANCE.dashCooldown, hp: 1, maxHp: 1,
    invuln: 0, hurtFlash: 0, dead: false, deathT: 0, upgradeFx: 0,
  };
  drawPlayerSprite(g, fake, t, { alwaysVisible: true });
  drawSimpleMob(g, iw * .72, ih * .5, 15, card.boss ? '#a55f72' : '#8f7a9f', t, card.boss);
  g.strokeStyle = withAlpha(C.gold, .78); g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(iw * .46, ih * .42); g.arc(iw * .55, ih * .43, iw * .16, -.9, .55); g.stroke();
  for (let i = 0; i < 3; i++) drawStar(g, iw * .18 + i * 9, ih * .83, 2.5, 1, 5, C.gold, null, 0);
  g.restore();
  drawText(g, card.boss ? 'BOSS 战片段' : '本局战斗片段', w / 2, h - 12, 8, withAlpha(C.inkSoft, .8), { align: 'center', weight: 800, line: 1 });
  g.restore();
}

function drawEndingScreen(g, t) {
  const bg = g.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 760);
  bg.addColorStop(0, '#32244a');
  bg.addColorStop(.5, '#1b1228');
  bg.addColorStop(1, '#0c0712');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // 无限回环的镜子隧道
  g.save(); g.translate(W / 2, 336);
  for (let i = 8; i >= 0; i--) {
    const s = 1 - i * .1;
    g.save(); g.rotate((i % 2 ? -1 : 1) * i * .012);
    const ww = 420 * s, hh = 334 * s;
    fillRound(g, -ww / 2, -hh / 2, ww, hh, (ww * .14), i % 2 ? '#4e3a6d' : '#33234b');
    strokeRound(g, -ww / 2, -hh / 2, ww, hh, (ww * .14), withAlpha(C.ink, .8), 4);
    g.fillStyle = withAlpha(i % 2 ? '#c8b3ee' : '#8b72bb', .08);
    roundRectPath(g, -ww / 2 + 12, -hh / 2 + 12, ww - 24, hh - 24, ww * .11); g.fill();
    g.restore();
  }
  g.restore();

  // 中央镜子与主角倒影
  g.save(); g.translate(W / 2, 364);
  g.fillStyle = '#b49ae4'; g.strokeStyle = C.ink; g.lineWidth = 7;
  g.beginPath(); g.ellipse(0, 0, 118, 146, 0, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = '#efe5ff';
  g.beginPath(); g.ellipse(0, 0, 101, 128, 0, 0, TAU); g.fill();
  g.fillStyle = '#b5c6ea';
  g.beginPath(); g.ellipse(0, 4, 82, 108, 0, 0, TAU); g.fill();
  drawCatHead(g, 0, -6, 56, player ? (player.form || 0) : 0, t);
  catEar(g, -100, -112, 24, 38, -.28, '#b49ae4', '#ffd9e2');
  catEar(g, 100, -112, 24, 38, .28, '#b49ae4', '#ffd9e2');
  drawStar(g, 95, -95, 14, 6, 5, C.gold, C.ink, 2, t);
  g.restore();
  // “你猜”气泡
  drawSpeechBubble(g, W / 2 + 224, 250, '你猜。', C.gold, .9);

  drawText(g, '本局结束 · 悬案仍未告破', W / 2, 58, 34, C.cream, { align: 'center', line: 8, weight: 900 });
  drawText(g, '为喵，寻喵。镜子里的猫也在找另一只猫。', W / 2, 96, 12, withAlpha(C.gold, .82), { align: 'center', weight: 700 });

  // 拍立得：本局真实战斗记录
  const cards = (ending.cards && ending.cards.length ? ending.cards.slice(-3) : []);
  if (!cards.length && ending) {
    cards.push({ stage: ending.stage, room: 1, boss: false, form: ending.form });
  }
  const leftPos = [[44, 166, -.075], [86, 336, .055], [38, 500, -.035]];
  const rightPos = [[1018, 176, .06], [1060, 338, -.055]];
  cards.forEach((card, i) => {
    const pos = i % 2 === 0 ? leftPos[Math.floor(i / 2) % leftPos.length] : rightPos[Math.floor(i / 2) % rightPos.length];
    drawMemoryCard(g, card, pos[0], pos[1], 208, 148, pos[2], t, i);
  });

  // 底部结算
  const px = 350, py = 548, pw = 580, ph = 142;
  panel(g, px, py, pw, ph, 20, '#fff3d9', C.ink, 4, 7);
  drawText(g, `STAGE ${ending.stage}`, px + 44, py + 38, 22, C.ink, { weight: 900 });
  drawText(g, `击杀 ${formatNum(ending.kills)}`, px + 194, py + 38, 14, C.inkSoft, { weight: 800 });
  drawText(g, `得分 ${formatNum(ending.score)}`, px + 338, py + 38, 14, C.inkSoft, { weight: 800 });
  drawText(g, `种子 ${ending.seedHex}`, px + 44, py + 67, 11, withAlpha(C.inkSoft, .65), { weight: 700 });
  g.strokeStyle = withAlpha(C.ink, .15); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(px + 34, py + 84); g.lineTo(px + pw - 34, py + 84); g.stroke();
  const pr = { x: px + 34, y: py + 95, w: pw - 68, h: 32 };
  const hov = pointRect(mouse, pr) || true;
  fillRound(g, pr.x, pr.y, pr.w, pr.h, 10, withAlpha(C.gold, .22));
  drawText(g, 'R / ENTER / 点击 · 再次出门找猫', px + pw / 2, py + 111, 12, C.ink, { align: 'center', weight: 900 });

  drawText(g, '重开不是失败，是新一轮找猫。猫粮 KPI 永不为零。', W / 2, 708, 10, withAlpha(C.gold, .62), { align: 'center', weight: 700 });
}

/* ---------------------------- 音量浮动提示 ---------------------------- */
function drawVolumePill(g) {
  if (!volumePill) return;
  const a = Math.min(1, Math.min((volumePill.t + .1) / .15, (volumePill.until - volumePill.t) / .35));
  if (a <= 0) return;
  g.save(); g.globalAlpha = clamp(a, 0, 1);
  g.font = '800 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
  const tw = g.measureText(volumePill.text).width + 48;
  fillRound(g, W / 2 - tw / 2, H - 44, tw, 28, 14, withAlpha(C.ink, .82));
  strokeRound(g, W / 2 - tw / 2, H - 44, tw, 28, 14, withAlpha(C.gold, .5), 1.5);
  drawSpeakerIcon(g, W / 2 - tw / 2 + 19, H - 30, 13, settings.muted, C.gold);
  drawText(g, volumePill.text, W / 2 + 8, H - 30, 12, C.cream, { align: 'center', weight: 800 });
  g.restore();
}


function drawUpgradeCard(g, u, index, base, t) {
  const appear = easeOut(clamp((modalOpenTime - index * .06) / .34, 0, 1));
  const hover = pointRect(mouse, base);
  const rc = RARITY[u.rarity] || RARITY.common;
  const lift = hover ? 8 : 0;
  const x = base.x, w = base.w;
  const y = base.y - (1 - appear) * 34 - lift;
  const h = base.h;
  g.save();
  g.globalAlpha = appear;

  // 卡片
  fillRound(g, x + 7, base.y + 8, w, h, 20, withAlpha(C.ink, .38));

  // 放射装饰
  g.save(); g.translate(W / 2, 360); g.globalAlpha = .09;
  for (let i = 0; i < 16; i++) {
    g.fillStyle = i % 2 ? C.gold : C.coral;
    g.beginPath(); g.moveTo(0, 0);
    g.arc(0, 0, 760, i * TAU / 16, i * TAU / 16 + .12); g.closePath(); g.fill();

function drawTransitionOverlay(g, t) {
  if (!transition) return;
  const p = clamp(transition.t / transition.dur, 0, 1);
  const cover = p < .5 ? easeInOut(p * 2) : easeInOut((1 - p) * 2);
  if (cover <= .001) return;
  g.save();
  g.fillStyle = withAlpha('#160e20', cover * .98);
  g.fillRect(0, 0, W, H);
  if (p > .32 && p < .72) {
    const af = Math.min((p - .32) / .12, (1 - p) / .12);
    g.globalAlpha = clamp(af, 0, 1) * .95;
    g.translate(W / 2, H / 2);
    g.strokeStyle = withAlpha(C.gold, .8); g.lineWidth = 3;
    g.beginPath(); g.arc(0, -10, 50, 0, TAU); g.stroke();
    drawStar(g, 0, -10, 16, 6, 5, C.gold, C.ink, 2, t);
    drawText(g, '喵步穿门…', 0, 64, 20, C.cream, { align: 'center', line: 4, weight: 800 });
    g.globalAlpha = 1;
  }
  g.restore();
}

/* ------------------------------------------------------------------
   07E. 设置状态切换 / 应用
   ------------------------------------------------------------------ */
function openSettings(from) {
  settingsReturn = from === 'paused' ? 'paused' : 'title';
  state = 'settings';
  settingsDrag = null;
  clearInput();
  initAudio();
  sfx('click');
}

function closeSettings() {
  state = settingsReturn === 'paused' ? 'paused' : 'title';
  settingsDrag = null;
  clearInput();
  persistSettings();
  sfx('click');
}

function applyScaleSetting(scale) {
  if (![.75, 1, 1.25, 1.5].includes(scale)) return;
  settings.scale = scale;
  persistSettings();
  applyViewScale();
  sfx('click');
}

function applyFpsSetting(fps) {
  if (![30, 60, 120, 0].includes(fps)) return;
  settings.fps = fps;
  persistSettings();
  sfx('click');
}

function saveSettingsWithNotice() {
  const res = persistSettings();
  settingsNotice = res.ok
    ? { ok: true, text: '保存成功 · 设置已写入本机', at: time }
    : { ok: false, text: '保存失败：' + res.error, at: time };
  if (res.ok) { sfx('clear'); showToast('设置保存成功', C.mint, 2.0); }
  else { sfx('hurt'); showToast('保存设置失败：' + res.error, C.coral, 3.2); }
}

function toggleFullscreen() {
  // §11 / §17：全屏时忽略窗口档位，等比铺满屏幕；再次触发退出全屏。
  try {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else {
      const target = document.documentElement;
      const p = target.requestFullscreen && target.requestFullscreen({ navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => showToast('当前环境不允许全屏', C.coral, 2.4));
    }
  } catch (e) {
    showToast('当前环境不允许全屏', C.coral, 2.4);
  }
}

function setSettingsSliderFromPointer(type) {
  const rect = settingsRects.find(r => (r.type === 'master' || r.type === 'sfx') && type === r.type);
  if (!rect) return;
  const ratio = clamp((mouse.x - rect.trackX) / Math.max(1, rect.trackW), 0, 1);
  if (type === 'master') {
    setMasterVolume(ratio, true, true);
    showVolumePill();
  } else {
    setSfxVolume(ratio, true);
    sfx('pickup');
  }
}

/* ------------------------------------------------------------------
   07F. 剧情选关 / 每 3 关提示 / 退出确认 / 模型图鉴
   ------------------------------------------------------------------ */
function storyUnlockedStage() {
  const mp = modeProgressFor('story');
  if (!mp) return 1;
  return clamp(mp.unlockedStage || 1, 1, STAGE_CFG.storyStageCount);
}

function startStoryStage(stage) {
  if (!profile) { showToast('请先在主页选择一个存档位', C.coral, 2.4); return; }
  const unlocked = storyUnlockedStage();
  if (stage > unlocked) {
    showToast(`尚未解锁 · 先通关 ${stageLabel(unlocked, 'story')}`, C.coral, 2.4);
    return;
  }
  const mp = modeProgressFor('story');
  const cp = mp && mp.checkpoint && mp.checkpoint.stage === stage ? mp.checkpoint : null;
  startModeStage('story', stage, {
    checkpoint: cp,
    fresh: !cp,
    seed: cp ? cp.seed : undefined,
    countRun: true,
  });
}

function drawStorySelectScreen(g, t) {
  storyStageRects = [];
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#140e22'); bg.addColorStop(.55, '#2a1a3d'); bg.addColorStop(1, '#4a2c4c');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 24; i++) {
    const a = i * 1.7 + t * .1;
    g.globalAlpha = .14 + Math.sin(t + i) * .06;
    drawStar(g, 30 + ((i * 149) % 1220), 24 + ((i * 91) % 670), 3 + i % 4, 1.4, 5, i % 3 ? C.cream : C.lavender, null, 0, a);
  }
  g.globalAlpha = 1;

  drawText(g, '剧情模式 · 选关', 52, 46, 30, C.cream, { weight: 900, line: 5 });
  const mp = modeProgressFor('story');
  const cleared = mp ? (mp.clearedStage || 0) : 0;
  drawText(g, '18 关全部可见 · 顺序解锁 · 每 3 关一次存档提示', 54, 78, 12, withAlpha(C.cream, .68), { weight: 700 });
  drawText(g, `已通关 ${cleared} / ${STAGE_CFG.storyStageCount}`, 1228, 48, 15, C.gold, { align: 'right', weight: 900 });

  const back = { x: 1088, y: 62, w: 140, h: 42 };
  const bh = pointRect(mouse, back);
  fillRound(g, back.x, back.y, back.w, back.h, 12, bh ? C.mint : withAlpha(C.mint, .78));
  strokeRound(g, back.x, back.y, back.w, back.h, 12, C.ink, 2.4);
  drawText(g, '返回主页', back.x + back.w / 2, back.y + 21, 15, C.ink, { align: 'center', weight: 900 });

  const unlocked = storyUnlockedStage();
  for (let stage = 1; stage <= STAGE_CFG.storyStageCount; stage++) {
    const idx = stage - 1;
    const col = idx % 6, row = Math.floor(idx / 6);
    const x = 52 + col * 202, y = 104 + row * 184, w = 186, h = 164;
    const open = stage <= unlocked;
    const done = stage <= cleared;
    const boss = stage % STAGE_CFG.bossEvery === 0;
    const chapter = Math.floor(idx / CHAPTER_STAGES);
    const theme = THEMES[chapter] || THEMES[0];
    const accent = open ? theme.accent : withAlpha(C.cream, .25);
    const hover = open && pointRect(mouse, { x, y, w, h });
    g.save();
    fillRound(g, x + 4, y + 5, w, h, 15, withAlpha(C.ink, .35));
    fillRound(g, x, y, w, h, 15, hover ? withAlpha(theme.accent, .22) : withAlpha('#261835', .94));
    strokeRound(g, x, y, w, h, 15, hover ? theme.accent : withAlpha(accent, .55), hover ? 3 : 1.8);
    fillRound(g, x, y, w, 6, 3, accent);
    drawText(g, stageLabel(stage, 'story'), x + 16, y + 32, 30, open ? C.cream : withAlpha(C.cream, .35), { weight: 900 });
    drawText(g, theme.name, x + 16, y + 58, 10, withAlpha(C.cream, open ? .68 : .3), { weight: 700 });
    if (boss) {
      fillRound(g, x + w - 66, y + 16, 52, 22, 11, withAlpha(C.coral, open ? .8 : .25));
      drawText(g, 'BOSS', x + w - 40, y + 27, 11, open ? C.cream : withAlpha(C.cream, .4), { align: 'center', weight: 900 });
    }
    const chapterInfo = STORY_CHAPTERS.find(ch => ch.stage === stage);
    drawText(g, chapterInfo ? chapterInfo.subtitle : '找猫途中',
      x + 16, y + 88, 10, withAlpha(C.cream, open ? .55 : .25), { weight: 600 });
    if (done) {
      fillRound(g, x + 16, y + 112, 80, 24, 12, withAlpha(C.mint, .2));
      drawText(g, '✓ 已通关', x + 56, y + 124, 11, C.mint, { align: 'center', weight: 900 });
    } else if (open) {
      drawText(g, stage === Math.max(1, cleared + 1) ? '▶ 当前关卡' : '可挑战', x + 16, y + 124, 11, accent, { weight: 900 });
    } else {
      drawText(g, `锁定 · 先通关 ${stageLabel(stage - 1, 'story')}`, x + 16, y + 124, 10, withAlpha(C.cream, .4), { weight: 700 });
    }
    if (!open) {
      g.globalAlpha = .35; g.fillStyle = '#0d0815';
      fillRound(g, x + w - 80, y + h - 52, 64, 34, 12, withAlpha('#0d0815', .5));
      drawText(g, '锁定', x + w - 48, y + h - 35, 11, withAlpha(C.cream, .55), { align: 'center', weight: 900 });
      g.globalAlpha = 1;
    }
    g.restore();
    if (open) storyStageRects.push({ stage, x, y, w, h });
  }
  drawText(g, '点击已解锁关卡开始 · 关卡进度自动写入检查点', W / 2, 656, 11, withAlpha(C.cream, .5), { align: 'center', weight: 700 });
  storyStageRects.push({ stage: 0, id: 'back', ...back });
}

function openBestiary() {
  // 记住来源页：从设置页（含从暂停进入的设置页）进图鉴，返回设置页；从主页进，返回主页。

/* ------------------------------------------------------------------
   07D. 总绘制入口
   ------------------------------------------------------------------ */
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') {
    drawTitleScreen(ctx, time);
    const slotMenuHit = slotMenu && slotMenuRects.some(r => pointRect(mouse, r));
    const confirmHit = confirmAction && confirmRects.some(r => pointRect(mouse, r));
    const homeHit = homeModeRects.some(r => pointRect(mouse, r)) ||
      saveSlotRects.some(r => pointRect(mouse, r)) || pointRect(mouse, titleSettingsRect);
    canvas.style.cursor = (slotMenuHit || confirmHit || homeHit) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'storySelect') {
    drawStorySelectScreen(ctx, time);
    canvas.style.cursor = storyStageRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'bestiary') {
    drawBestiaryScreen(ctx, time);
    canvas.style.cursor = bestiaryRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'settings') {
    // 设置页只画自己，不叠战斗世界，保证任何 FPS 下都稳定。
    drawSettingsScreen(ctx, time);
    canvas.style.cursor = settingsRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'story') {
    drawStoryScreen(ctx, time);
    if (story && story.phase === 'gate') {
      canvas.style.cursor = storyGateRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    } else {
      canvas.style.cursor = pointRect(mouse, storySkipRect) ? 'pointer' : 'default';
    }
    drawVolumePill(ctx);
    return;
  }
  if (state === 'ending') {
    drawEndingScreen(ctx, time);
    canvas.style.cursor = 'pointer';
    drawVolumePill(ctx);
    return;
  }
  if (state === 'upgrade') {
    // §12.1：升级层独立清屏绘制 —— 不画主世界、不应用震屏，只留下静止的三选一。
    drawUpgradeScreen(ctx, time);
    canvas.style.cursor = modalHover >= 0 ? 'pointer' : 'default';
    drawVolumePill(ctx);
    return;
  }

  if (room) drawScene(ctx, time);
  else { ctx.fillStyle = C.bgDeep; ctx.fillRect(0, 0, W, H); }
  drawHUD(ctx, time);
  drawBannerAndToast(ctx, time);
  if (state === 'playing' || state === 'transition') drawTouchControls(ctx, time);

  if (state === 'between') {
    drawBetweenScreen(ctx, time);
    canvas.style.cursor = betweenRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
  } else if (state === 'exitConfirm') {
    drawExitConfirmScreen(ctx, time);
    canvas.style.cursor = exitRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
  } else if (state === 'paused') {
    drawPauseScreen(ctx, time);
    canvas.style.cursor = pauseRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
  } else if (state === 'dead' || state === 'gameover') {
    drawDeathScreen(ctx, time);
    canvas.style.cursor = state === 'gameover' && pointRect(mouse, gameoverRestartRect) ? 'pointer' : 'default';
  } else {
    if (state === 'playing' && mouse.inside && mouse.y > ARENA.y + 10) drawCrosshair(ctx, time);
    canvas.style.cursor = 'none';
  }

  drawTransitionOverlay(ctx, time);
  drawVolumePill(ctx);
}

/* ------------------------------------------------------------------
   08. 输入 / 主循环 / 启动
   ------------------------------------------------------------------ */
function clearInput() {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
}

function updatePointer(ev) {
  const r = canvas.getBoundingClientRect();
  const x = (ev.clientX - r.left) / Math.max(1, r.width) * W;
  const y = (ev.clientY - r.top) / Math.max(1, r.height) * H;
  mouse.x = clamp(x, 0, W);
  mouse.y = clamp(y, 0, H);
  mouse.inside = x >= 0 && x <= W && y >= 0 && y <= H;
  if (player && !player.dead) updateAim();
}

function resumeGame() {
  if (state !== 'paused') return;
  state = 'playing';
  clickCooldown = Math.max(clickCooldown, .12);
  clearInput();
}

window.addEventListener('mousemove', ev => {
  updatePointer(ev);
  if (state === 'settings' && settingsDrag) setSettingsSliderFromPointer(settingsDrag);
}, { passive: true });
window.addEventListener('mouseout', ev => {
  if (!ev.relatedTarget) { mouse.inside = false; mouse.down = false; settingsDrag = null; }
});
window.addEventListener('mouseup', () => { mouse.down = false; settingsDrag = null; });
canvas.addEventListener('contextmenu', ev => ev.preventDefault());

/* 鼠标 / 触摸共用的 UI 点击入口，避免两套点击逻辑分叉。 */
function handleDown(ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  updatePointer(ev);
  initAudio();

  if (state === 'settings') {
    const hit = settingsRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.type === 'scale') applyScaleSetting(hit.value);
      else if (hit.type === 'fps') applyFpsSetting(hit.value);
      else if (hit.type === 'mute') {
        setMuted(!settings.muted);
        showVolumePill();
        sfx('click');
      } else if (hit.type === 'master' || hit.type === 'sfx') {
        settingsDrag = hit.type;
        setSettingsSliderFromPointer(hit.type);
      } else if (hit.type === 'fullscreen') toggleFullscreen();
      else if (hit.type === 'save') saveSettingsWithNotice();
      else if (hit.type === 'bestiary') openBestiary();
      else if (hit.type === 'back') closeSettings();
    }
    return;
  }
  if (state === 'bestiary') {
    const hit = bestiaryRects.find(r => pointRect(mouse, r));
    if (hit && hit.id === 'back') closeBestiary();
    return;
  }
  if (state === 'storySelect') {
    const hit = storyStageRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'back') returnToHome();
      else startStoryStage(hit.stage);
    }
    return;
  }
  if (state === 'title') {
    // 确认弹窗优先；其次槽位菜单；最后才是主页卡片。
    if (confirmAction) {
      if (confirmRects[0] && pointRect(mouse, confirmRects[0])) {
        const act = confirmAction;
        confirmAction = null;
        act.run();
      } else if (confirmRects[1] && pointRect(mouse, confirmRects[1])) {
        confirmAction = null;
        sfx('click');
      }
      return;
    }
    if (slotMenu) {
      const hit = slotMenuRects.find(r => pointRect(mouse, r));
      if (!hit) { if (!pointRect(mouse, { x: W / 2 - 180, y: H / 2 - 138, w: 360, h: 276 })) closeSlotMenu(); return; }
      const slot = slotMenu.slot;
      if (hit.id === 'load') {
        activateProfile(slot);
        closeSlotMenu();
      } else if (hit.id === 'overwrite') {
        if (slotCache[slot]) {
          confirmAction = {
            title: `覆盖存档位 ${slot}？`, text: '当前档案会整体写入该槽位，原有进度将被替换。',
            okLabel: '覆盖写入', run: () => { overwriteProfileAt(slot); closeSlotMenu(); },
          };
        } else if (profile) {
          confirmAction = {
            title: `写入存档位 ${slot}？`, text: '空槽位将写入当前档案的完整进度。',
            okLabel: '写入', run: () => { overwriteProfileAt(slot); closeSlotMenu(); },
          };
        } else {
          showToast('请先新建一个档案', C.coral, 2.2);
        }
        sfx('click');
      } else if (hit.id === 'delete') {
        confirmAction = {
          title: `删除存档位 ${slot}？`, text: '该槽位的五个模式进度会一起删除，无法恢复。',
          okLabel: '删除档案', run: () => { deleteProfileAt(slot); closeSlotMenu(); },
        };
        sfx('click');
      } else if (hit.id === 'cancel' || hit.id === 'info') {
        closeSlotMenu();
        sfx('click');
      }
      return;
    }
    if (pointRect(mouse, titleSettingsRect)) {
      openSettings('title');
      return;
    }
    const modeHit = homeModeRects.find(r => pointRect(mouse, r));
    if (modeHit) {
      startModeFromHome(modeHit.id);
      clearInput();
      return;
    }
    const slotHit = saveSlotRects.find(r => pointRect(mouse, r));
    if (slotHit) {
      if (!slotCache[slotHit.slot]) {
        confirmAction = {
          title: `新建存档位 ${slotHit.slot}？`, text: '将创建一份包含五个模式空进度的新档案。',
          okLabel: '新建档案', run: () => { createProfileAt(slotHit.slot, false); closeSlotMenu(); },
        };
        sfx('click');
      } else {
        openSlotMenu(slotHit.slot);
      }
      return;
    }
    return;
  }
  if (state === 'story') {
    if (story && story.phase === 'gate') {
      const hit = storyGateRects.find(r => pointRect(mouse, r));
      if (hit) {
        if (hit.id === 'replay') beginStoryPlay();
        else finishStory(true);
      } else if (pointRect(mouse, storySkipRect)) {
        finishStory(true);
      }
    } else if (story) {
      if (pointRect(mouse, storySkipRect)) finishStory(true);
      else nextStoryLine();
    }
    return;
  }
  if (state === 'ending') {
    returnToHome();
    clearInput();
    return;
  }
  if (state === 'upgrade') {
    if (modalHover >= 0 && upgradeCardRects[modalHover]) selectUpgrade(modalHover);
    else {
      for (let i = 0; i < upgradeCardRects.length; i++) {
        if (pointRect(mouse, upgradeCardRects[i])) { selectUpgrade(i); break; }
      }
    }
    return;
  }
  if (state === 'between') {
    const hit = betweenRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'continue') continueBetween();
      else if (hit.id === 'save') persistProfile(true);
      else if (hit.id === 'exit') exitCurrentMode(false);
    }
    return;
  }
  if (state === 'exitConfirm') {
    const hit = exitRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'saveExit') exitCurrentMode(true);
      else if (hit.id === 'exit') exitCurrentMode(false);
      else if (hit.id === 'cancel') { state = 'paused'; clearInput(); sfx('click'); }
    }
    return;
  }
  if (state === 'paused') {
    const hit = pauseRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'resume') resumeGame();
      else if (hit.id === 'save') persistProfile(true);
      else if (hit.id === 'settings') openSettings('paused');
      else if (hit.id === 'exit') openExitConfirm();
    }
    return;
  }
  if (state === 'gameover') {
    if (pointRect(mouse, gameoverRestartRect)) {
      restartCurrentStage();
      clearInput();
    }
    return;
  }
  if (state === 'dead') {
    // 等待死亡演出结束；R 随时可以提前重开。
    return;
  }
  if (state !== 'playing' && state !== 'transition') return;

  // HUD 右上角音量按钮：与设置面板、[ / ]、M 共用同一个 settings.muted。
  if (pointRect(mouse, hudMuteRect)) {
    setMuted(!settings.muted);
    showVolumePill();
    sfx('click');
    return;
  }

  mouse.down = true;
  if (state === 'playing' && clickCooldown <= 0 && player && !player.dead && player.attackTimer <= 0) {
    performAttack();
  }
}

canvas.addEventListener('mousedown', ev => {
  if (performance.now() - touchState.lastTouchAt < 480) return;
  handleDown(ev);
});

/* ------------------------------------------------------------------
   08B. 触摸操作（§12）：左下摇杆 + 右下攻击 / 冲刺
   ------------------------------------------------------------------ */
const IS_TOUCH_DEVICE = (() => {
  try {
    if (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) return true;
    return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  } catch (e) { return false; }
})();
const TOUCH_JOY = { x: 152, y: 584, r: 76, knob: 30 };
const TOUCH_ATTACK = { x: 1168, y: 566, r: 58 };
const TOUCH_DASH = { x: 1044, y: 634, r: 42 };

function touchPoint(ev) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) / Math.max(1, r.width) * W,
    y: (ev.clientY - r.top) / Math.max(1, r.height) * H,
  };
}

function updateJoystick(pt) {
  let dx = pt.x - TOUCH_JOY.x, dy = pt.y - TOUCH_JOY.y;
  const max = TOUCH_JOY.r - TOUCH_JOY.knob * .4;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  touchState.joyX = TOUCH_JOY.x + dx;
  touchState.joyY = TOUCH_JOY.y + dy;
  const mag = Math.min(1, len / max);
  const nlen = Math.hypot(dx, dy);
  const norm = nlen > 0.001 ? { x: dx / nlen, y: dy / nlen } : { x: 0, y: 0 };
  touchState.vec.x = norm.x * mag;
  touchState.vec.y = norm.y * mag;
}

function releaseTouchControls() {
  touchState.joyId = null;
  touchState.attackId = null;
  touchState.dashId = null;
  touchState.attackHeld = false;
  touchState.vec.x = 0; touchState.vec.y = 0;
  touchState.joyX = TOUCH_JOY.x; touchState.joyY = TOUCH_JOY.y;
}

function handleTouchStart(ev) {
  ev.preventDefault();
  touchState.lastTouchAt = performance.now();
  touchState.usingTouch = true;
  touchActive = true;
  initAudio();
  const pt = touchPoint(ev);

  // 非战斗界面：交给共用 UI 点击逻辑。
  if (state !== 'playing' && state !== 'transition') {
    handleDown({ button: 0, clientX: ev.clientX, clientY: ev.clientY, preventDefault() {} });
    return;
  }

  // 战斗界面：摇杆 / 攻击 / 冲刺三块热区。
  if (touchState.joyId === null && Math.hypot(pt.x - TOUCH_JOY.x, pt.y - TOUCH_JOY.y) <= TOUCH_JOY.r + 22) {
    touchState.joyId = ev.pointerId;
    updateJoystick(pt);
    return;
  }
  if (touchState.attackId === null && Math.hypot(pt.x - TOUCH_ATTACK.x, pt.y - TOUCH_ATTACK.y) <= TOUCH_ATTACK.r + 18) {
    touchState.attackId = ev.pointerId;
    touchState.attackHeld = true;
    return;
  }
  if (touchState.dashId === null && Math.hypot(pt.x - TOUCH_DASH.x, pt.y - TOUCH_DASH.y) <= TOUCH_DASH.r + 18) {
    touchState.dashId = ev.pointerId;
    if (clickCooldown <= 0 && state === 'playing') tryDash();
    return;
  }
  // 点空白区域 = 朝点击方向挥爪（方便单手玩）。
  mouse.x = clamp(pt.x, 0, W); mouse.y = clamp(pt.y, 0, H); mouse.inside = true;
  if (player && !player.dead) {
    player.aim = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    if (state === 'playing' && player.attackTimer <= 0) performAttack();
  }
}

function handleTouchMove(ev) {
  if (!touchState.usingTouch) return;
  ev.preventDefault();
  if (touchState.joyId === ev.pointerId) updateJoystick(touchPoint(ev));
}

function handleTouchEnd(ev) {
  if (touchState.joyId === ev.pointerId) {
    touchState.joyId = null;
    touchState.vec.x = 0; touchState.vec.y = 0;
    touchState.joyX = TOUCH_JOY.x; touchState.joyY = TOUCH_JOY.y;
  }
  if (touchState.attackId === ev.pointerId) {
    touchState.attackId = null;
    touchState.attackHeld = false;
  }
  if (touchState.dashId === ev.pointerId) touchState.dashId = null;
}

canvas.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'touch') handleTouchStart(ev);
}, { passive: false });
canvas.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'touch') handleTouchMove(ev);
}, { passive: false });
canvas.addEventListener('pointerup', ev => {
  if (ev.pointerType === 'touch') handleTouchEnd(ev);
}, { passive: false });
canvas.addEventListener('pointercancel', ev => {
  if (ev.pointerType === 'touch') handleTouchEnd(ev);
}, { passive: false });

function drawTouchControls(g, t) {
  if (!touchState.usingTouch && !IS_TOUCH_DEVICE) return;
  if (!run || !player) return;
  g.save();
  // 摇杆底盘
  g.globalAlpha = .32;
  circle(g, TOUCH_JOY.x, TOUCH_JOY.y, TOUCH_JOY.r, withAlpha('#140c1f', .5), withAlpha(C.cream, .25), 2);
  g.globalAlpha = .5;
  circle(g, TOUCH_JOY.x, TOUCH_JOY.y, TOUCH_JOY.r * .62, null, withAlpha(C.cream, .25), 1.5);
  const knobX = touchState.joyId !== null ? touchState.joyX : TOUCH_JOY.x;
  const knobY = touchState.joyId !== null ? touchState.joyY : TOUCH_JOY.y;
  g.globalAlpha = .62;
  circle(g, knobX, knobY, TOUCH_JOY.knob, withAlpha(C.cream, .35), withAlpha(C.ink, .5), 2);
  g.globalAlpha = .85;
  drawPaw(g, knobX, knobY, 18, withAlpha(C.cream, .8));

  // 攻击按钮
  const atkDown = touchState.attackHeld;
  g.globalAlpha = atkDown ? .9 : .55;
  circle(g, TOUCH_ATTACK.x, TOUCH_ATTACK.y, TOUCH_ATTACK.r,
    atkDown ? withAlpha(C.coral, .55) : withAlpha('#2a1838', .7), withAlpha(C.coral, .8), 3);
  drawUpgradeIcon(g, TOUCH_ATTACK.x, TOUCH_ATTACK.y, 44, 'claw', C.cream);
  drawText(g, '攻击', TOUCH_ATTACK.x, TOUCH_ATTACK.y + TOUCH_ATTACK.r - 14, 12, C.cream, { align: 'center', weight: 900 });

  // 冲刺按钮
  g.globalAlpha = .6;
  circle(g, TOUCH_DASH.x, TOUCH_DASH.y, TOUCH_DASH.r, withAlpha('#2a1838', .7), withAlpha(C.mint, .8), 3);
  drawUpgradeIcon(g, TOUCH_DASH.x, TOUCH_DASH.y, 30, 'boot', C.mint);
  drawText(g, '冲刺', TOUCH_DASH.x, TOUCH_DASH.y + TOUCH_DASH.r - 12, 11, C.cream, { align: 'center', weight: 900 });
  g.restore();

  // 竖屏提示（不强制旋转）
  if (window.innerHeight > window.innerWidth) {
    fillRound(g, W / 2 - 190, 88, 380, 40, 14, withAlpha('#1b1029', .82));
    strokeRound(g, W / 2 - 190, 88, 380, 40, 14, withAlpha(C.gold, .55), 2);
    drawText(g, '建议横屏游玩 · 竖屏也能操作', W / 2, 108, 13, C.gold, { align: 'center', weight: 800 });
  }
}

if (IS_TOUCH_DEVICE) {
  // 只显示触摸控件；真正触摸后 usingTouch 才会切换瞄准逻辑，避免触屏笔记本鼠标瞄准失灵。
  touchActive = true;
}

window.addEventListener('keydown', ev => {
  const code = ev.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(code)) ev.preventDefault();

  const first = !keys[code];
  keys[code] = true;
  if (!first && ev.repeat) return;
  initAudio();

  // 主音量快捷键：任何界面都实时生效，并自动解除静音。
  if (code === 'BracketLeft' || code === 'BracketRight') {
    const delta = code === 'BracketRight' ? .05 : -.05;
    setMasterVolume(settings.masterVolume + delta, true, true);
    showVolumePill();
    sfx('click');
    return;
  }

  // 全局静音：HUD 按钮 / 设置面板 / M 键共用同一个值。
  if (code === 'KeyM') {
    setMuted(!settings.muted);
    showVolumePill();
    if (!['title', 'settings', 'story', 'ending'].includes(state)) {
      showToast(settings.muted ? '静音了 · 按 M 恢复猫叫与音效' : '音效已开启 · 喵！', settings.muted ? C.lavender : C.mint, 1.5);
    }
    return;
  }

  // §11 全屏快捷键：任何界面可用。
  if (code === 'KeyF') {
    toggleFullscreen();
    return;
  }

  if (code === 'KeyR') {
    // §5 死亡与存档分离：R 从当前关卡的检查点重开，而不是回到标题。
    if (['playing', 'paused', 'dead', 'gameover'].includes(state)) {
      restartCurrentStage();
      clearInput();
    } else if (state === 'ending') {
      returnToHome();
      clearInput();
    }
    return;
  }

  if (code === 'Escape') {
    if (state === 'settings') {
      closeSettings();
    } else if (state === 'bestiary') {
      closeBestiary();
    } else if (state === 'storySelect') {
      returnToHome();
    } else if (state === 'story') {
      finishStory(true);
    } else if (state === 'title') {
      if (confirmAction) { confirmAction = null; sfx('click'); }
      else if (slotMenu) { closeSlotMenu(); sfx('click'); }
    } else if (state === 'playing') {
      state = 'paused';
      shake = 0; flash = 0;
      clearInput();
      releaseTouchControls();
      sfx('click');
    } else if (state === 'paused') {
      resumeGame();
      sfx('click');
    } else if (state === 'between') {
      continueBetween();
    } else if (state === 'exitConfirm') {
      state = 'paused'; clearInput(); sfx('click');
    } else if (state === 'ending') {
      returnToHome();
    }
    return;
  }

  if (state === 'settings' || state === 'bestiary') return;
  if (state === 'storySelect') return;

  if (state === 'title') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      if (confirmAction) confirmAction = null;
      else if (slotMenu) closeSlotMenu();
      else startModeFromHome(MODE_LIST[0]);
      clearInput();
    } else if (code === 'KeyO') {
      openSettings('title');
    }
    return;
  }

  if (state === 'between') {
    if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') continueBetween();
    else if (code === 'KeyS') persistProfile(true);
    return;
  }
  if (state === 'exitConfirm') {
    if (code === 'KeyS') exitCurrentMode(true);
    else if (code === 'Enter' || code === 'NumpadEnter') exitCurrentMode(false);
    return;
  }

  if (state === 'story') {
    if (story && story.phase === 'gate') {
      if (code === 'Enter' || code === 'NumpadEnter') beginStoryPlay();
      else if (code === 'Space') finishStory(true);
    } else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') {
      nextStoryLine();
    }
    return;
  }

  if (state === 'ending') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      returnToHome();
      clearInput();
    }
    return;
  }

  if (state === 'paused') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      resumeGame();
      sfx('click');
    } else if (code === 'KeyO') {
      openSettings('paused');
    } else if (code === 'KeyS') {
      persistProfile(true);
    } else if (code === 'KeyE') {
      openExitConfirm();
    }
    return;
  }

  if (state === 'upgrade') {
    if (code === 'Digit1' || code === 'Numpad1') selectUpgrade(0);
    else if (code === 'Digit2' || code === 'Numpad2') selectUpgrade(1);
    else if (code === 'Digit3' || code === 'Numpad3') selectUpgrade(2);
    return;
  }

  if (state === 'dead' || state === 'gameover') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      restartCurrentStage();
      clearInput();
    }
    return;
  }

  if (state === 'playing') {
    if (code === 'Space' && clickCooldown <= 0) tryDash();
    if (code === 'KeyJ' && player && player.attackTimer <= 0) performAttack();
  }
});

window.addEventListener('keyup', ev => {
  keys[ev.code] = false;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(ev.code)) ev.preventDefault();
});

window.addEventListener('blur', () => {
  clearInput();
  mouse.inside = false;
  if (state === 'playing') state = 'paused';
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInput();
    if (state === 'playing') state = 'paused';
  }
});

function update(dt) {
  // 音量浮动提示在所有界面都独立计时，不依赖战斗状态。
  if (volumePill) {
    volumePill.t += dt;
    if (volumePill.t >= volumePill.until) volumePill = null;
  }

  if (state === 'title') {
    time += dt;
    return;
  }
  if (state === 'settings' || state === 'storySelect' || state === 'bestiary') {
    time += dt;
    return;
  }
  if (state === 'between' || state === 'exitConfirm') {
    time += dt;
    updateEffects(dt);
    return;
  }
  if (state === 'story') {
    // §12.1 / §3：剧情期间完全冻结战斗，只推进对白与演出计时。
    time += dt;
    updateStory(dt);
    return;
  }
  if (state === 'ending') {
    time += dt;
    if (ending) ending.t += dt;
    return;
  }
  if (state === 'paused' || state === 'upgrade') {
    // 障碍、敌人、UI 全部冻结；三选一卡片用自己的入场计时。
    if (state === 'upgrade') modalOpenTime += dt;
    return;
  }

  time += dt;

  if (state === 'playing') {
    updateGameplay(dt);
    updateEffects(dt);
    updateMusic(dt);
    // openUpgrade 可能在 updatePickups 内触发；此处不再推进世界。
    if (state === 'playing' && room && room.clearAnim > 0) room.clearAnim = Math.max(0, room.clearAnim - dt);
  } else if (state === 'transition') {
    updateEffects(dt);
    updateTransition(dt);
    updateMusic(dt);
  } else if (state === 'dead') {
    deathTimer += dt;
    if (player) player.deathT += dt;
    updateEffects(dt);
    updateMusic(dt);
    if (deathTimer >= 1.45) finishGameOver();
  } else if (state === 'gameover') {
    updateEffects(dt);
  }
}

function frame(now) {
  // FPS 上限：requestAnimationFrame + 帧间隔封顶，绝不无脑跑满。
  // 0 = 无限制；30/60/120 都严格按最小帧间隔跳过多余回调。
  const cap = settings.fps;
  if (cap > 0) {
    const minInterval = 1000 / cap - .6;
    if (now - lastFrame < minInterval) {
      requestAnimationFrame(frame);
      return;
    }
  }
  const raw = (now - lastFrame) / 1000;
  lastFrame = now;
  // 低帧率时限制单帧步长，避免穿墙和丢失碰撞；30FPS 时仍能完整模拟。
  const dt = clamp(raw, 0, .05);
  update(dt);
  draw();
  debugFrameCount++;
  requestAnimationFrame(frame);
}

/* 仅在 URL 带 #debug 时挂接验证接口，不影响正常游玩体验。 */
const DEBUG_MODE = /(?:^|[#&?])debug(?:[&#=]|$)/i.test(location.hash + '&' + location.search);
if (DEBUG_MODE) {
  window.__nyan = {
    version: '1.0',
    start(seed) {
      startNewRun(seed);
      return { state, seed: run && run.seedHex };
    },
    snapshot() {

        mode: run ? run.mode : null,

        theme: run && run.theme ? run.theme.id : null,
        module: run && run.module ? run.module.id : null,
        stage: run ? run.stage : 0,

        roomsThisStage: run ? run.roomsThisStage : 0,
        waveIndex: room ? room.waveIndex : 0,

        xpNeed: player ? player.xpNeed : 0,

        enemies: enemies.filter(e => !e.dead).length,
        boss: enemies.filter(e => e.boss && !e.dead).length,
        projectiles: projectiles.length,

        score: run ? run.score : 0,

        cards: upgradeCards.map(u => u.name),

      };
    },
    player() { return player; },
    run() { return run; },
    room() { return room; },
    enemies() { return enemies; },
    pickups() { return pickups; },
    setMouse(x, y, down) {
      mouse.x = clamp(x, 0, W); mouse.y = clamp(y, 0, H); mouse.inside = true;
      if (typeof down === 'boolean') mouse.down = down;
      if (player) updateAim();
    },
    attack() {
      if (state !== 'playing' || !player || player.dead) return false;
      player.attackTimer = 0; performAttack(); return true;
    },

      return tryDash();
    },
    grantXP(amount) {
      if (!player) return 0;
      player.xp += Math.max(0, amount);
      checkLevelUp();

    },
    choose(index) { selectUpgrade(index); return state; },
    grantSkill(id, level) {
      if (!player || !run || !SKILL_BY_ID[id]) return false;
      const skill = SKILL_BY_ID[id];
      const target = clamp(Math.floor(Number(level) || 1), 1, 4);
      let cur = run.upgradeStacks[id] || 0;
      while (cur < target) { cur++; applySkillLevel(skill, cur); }
      return {

        level: run.upgradeStacks[id],
        mutateIcon: run.upgradeStacks[id] >= 4 ? skill.mutateIcon : skill.icon,

      if (!recipe) return false;

      const result = SKILL_BY_ID[recipe.result];
      if (result && (run.upgradeStacks[result.id] || 0) < 4) applySkillLevel(result, 1);

    },

    },
    contentSummary() {

      return {

    startStage(modeId, stage, seed) {

    },

      if (!run) startNewRun();

      enterRoom(run.roomsThisStage, true);
      return {

    settingsSnapshot() { return Object.assign({}, settings); },
    openSettingsPanel(from) { openSettings(from || 'title'); return state; },
    closeSettingsPanel() { closeSettings(); return state; },
    setScale(v) { applyScaleSetting(v); return settings.scale; },
    setFps(v) { applyFpsSetting(v); return settings.fps; },
    setMaster(v) { setMasterVolume(v, true, true); showVolumePill(); return settings.masterVolume; },
    setSfx(v) { setSfxVolume(v, true); return settings.sfxVolume; },
    setMutedValue(v) { setMuted(v); showVolumePill(); return settings.muted; },
    frames() { return debugFrameCount; },
    resetFrames() { debugFrameCount = 0; return 0; },
    storySnapshot() {
      if (!story) return null;
      return {
        id: story.chapter.id,
        stage: story.chapter.stage,
        phase: story.phase,
        line: story.line,
        lines: story.chapter.lines.length,
        who: story.chapter.lines[story.line] && story.chapter.lines[story.line].who,
        text: story.chapter.lines[story.line] && story.chapter.lines[story.line].text,
        reveal: Math.floor(story.reveal),
        seenBefore: story.seenBefore,
        final: !!story.chapter.final,
      };
    },
    startStoryAt(stage) {
      // 调试用：确保当前处于剧情模式对应关卡，再播放该关的过场。
      const target = clamp(Math.floor(Number(stage) || 1), 1, STAGE_CFG.storyStageCount);
      if (!run || run.mode !== 'story' || run.stage !== target) {
        startModeStage('story', target, { fresh: true, countRun: false });
      }
      const chapter = storyChapterForStage(target, 'story');
      if (!chapter) return null;
      startStory(chapter, () => { state = ending ? 'ending' : (run ? 'playing' : 'title'); });
      return chapter.id;
    },
    finishStoryNow() { finishStory(true); return state; },
    advanceStory() { nextStoryLine(); return state; },
    storySeen(id) { return !!storyProgress.seen[id]; },
    setStorySeen(id, seen) {
      if (seen === false) delete storyProgress.seen[id];
      else storyProgress.seen[id] = true;
      saveStoryProgress();
      return !!storyProgress.seen[id];
    },
    clearStorySeen() { storyProgress.seen = {}; saveStoryProgress(); },
    forceStageClear(stage) {
      if (!run) startNewRun();
      const target = Math.max(1, Math.min(STAGE_CFG.finalStage, Number(stage) || 1));
      run.stage = target;
      beginStage(target, true);
      enterRoom(run.roomsThisStage, true);
      room.cleared = true; room.doorOpen = true; room.doorOpenDelay = 0;
      player.x = DOOR.x; player.y = DOOR.y + DOOR.r * .6;
      beginDoorTransition();
      return { stage: target, state };
    },
    endingScreen() {
      if (!run) startNewRun();
      startEnding();
      return state;
    },
    setForm(n) {
      const f = clamp(Number(n) || 0, 0, 2);

    },
    hurt(amount) {
      if (!player || player.dead) return false;
      player.invuln = 0;
      hurtPlayer(amount, player.x + 30, player.y + 10);
      return !player.dead;
    },
    heal() { if (player) player.hp = player.maxHp; },
    killAll() {
      for (const e of enemies.slice()) if (!e.dead) damageEnemy(e, 999999, { noCrit: true });
    },
    finishWaves() {
      if (!room) return false;
      room.waveIndex = room.waves.length;
      for (const e of enemies.slice()) if (!e.dead) damageEnemy(e, 999999, { noCrit: true });
      return true;
    },
    enterDoor() {
      if (!room || !player) return false;
      room.cleared = true; room.doorOpen = true; room.doorOpenDelay = 0;
      player.x = DOOR.x; player.y = DOOR.y + DOOR.r * .6;
      beginDoorTransition();
      return true;
    },
    bossRoom() {
      if (!run) startNewRun();
      run.stage = STAGE_CFG.bossEvery;
      beginStage(run.stage, true);
      enterRoom(run.roomsThisStage, true);
      return { stage: run.stage, room: run.roomNumber };
    },
    die() {
      if (!player || player.dead) return false;
      player.invuln = 0;
      hurtPlayer(999999, player.x + 20, player.y);
      return state;
    },
    finishGameOver() { finishGameOver(); return state; },
    meta() { return Object.assign({}, meta); },
    storageKey: STORAGE_KEY,

    /* ---- 存档位 / 五模式验收接口 ---- */
    profileSummary() {
      const modes = {};
      if (profile) {

          const p = profile.modes[id];
          modes[id] = {
            bestStage: p.bestStage,

            unlocked: p.unlocked,
            seenCount: Object.keys(p.seen || {}).length,
            checkpoint: p.checkpoint ? { stage: p.checkpoint.stage, seed: p.checkpoint.seed, at: p.checkpoint.at } : null,
          };

        state,
        activeSlot,

        modes,
        slots: slotCache.slice(1).map((p, i) => p ? {
          slot: i + 1,
          updatedAt: p.updatedAt,

    },
    slotRaw(slot) {

    },
    createSlot(slot, overwrite) {
      const n = clamp(Math.floor(Number(slot) || 0), 1, SAVE_SLOTS);
      return createProfileAt(n, !!overwrite);
    },
    activateSlot(slot) { return activateProfile(slot, false); },
    deleteSlotAt(slot) { return deleteProfileAt(slot); },
    overwriteSlotAt(slot) { return overwriteProfileAt(slot); },
    saveNow() { return persistProfile(true); },
    clearAllSaves() {
      for (let i = 1; i <= SAVE_SLOTS; i++) {
        try { localStorage.removeItem(SAVE_PREFIX + i); } catch (e) { /* 忽略 */ }
      }
      try { localStorage.removeItem(LAST_SLOT_KEY); } catch (e) { /* 忽略 */ }
      activeSlot = 0;
      profile = null;
      meta = { kills: 0, bestStage: 0, bestScore: 0, runs: 0 };

      confirmAction = null;

    },
    setModeProgress(modeId, patch) {
      if (!profile || !profile.modes[modeId] || !patch) return false;
      const p = profile.modes[modeId];
      for (const key of ['bestStage', 'clearedStage', 'unlockedStage', 'level', 'form', 'unlocked']) {

    },

    startMode(modeId) { startModeFromHome(modeId); return state; },

    storyList() { return storyStageRects.map(r => ({ ...r })); },

    },
    betweenSnapshot() { return betweenInfo ? Object.assign({}, betweenInfo) : null; },
    continueBetweenNow() { continueBetween(); return state; },
    pauseGame() { if (state === 'playing') { state = 'paused'; sfx('click'); } return state; },
    openExitConfirmNow() { openExitConfirm(); return state; },
    exitMode(saveFirst) { exitCurrentMode(!!saveFirst); return state; },
    openBestiaryScreen() { openBestiary(); return state; },
    closeBestiaryScreen() { closeBestiary(); return state; },
    settingsNotice() { return settingsNotice ? Object.assign({}, settingsNotice) : null; },
    saveSettingsNow() { saveSettingsWithNotice(); return settingsNotice ? Object.assign({}, settingsNotice) : null; },
    toggleFullscreenNow() { toggleFullscreen(); return !!document.fullscreenElement; },

    /* ---- 主页可点击区域 / 输入模拟（供无头验收使用） ---- */
    titleRects() {
      return {
        modes: homeModeRects.map(r => ({ ...r })),
        slots: saveSlotRects.map(r => ({ ...r })),
        settings: { ...titleSettingsRect },
        slotMenu: slotMenuRects.map(r => ({ ...r })),
        confirm: confirmRects.map(r => ({ ...r })),
        pause: pauseRects.map(r => ({ ...r })),
        between: betweenRects.map(r => ({ ...r })),
        exit: exitRects.map(r => ({ ...r })),
        bestiary: bestiaryRects.map(r => ({ ...r })),
        story: storyStageRects.map(r => ({ ...r })),
        settingsButtons: settingsRects.map(r => ({ ...r })),
      };
    },
    clickAt(x, y) {
      const r = canvas.getBoundingClientRect();
      const clientX = r.left + (Number(x) || 0) / W * r.width;
      const clientY = r.top + (Number(y) || 0) / H * r.height;
      handleDown({ button: 0, clientX, clientY, preventDefault() {} });
      return { state, mouse: { x: mouse.x, y: mouse.y }, slotMenu: slotMenu ? slotMenu.slot : 0, confirm: !!confirmAction };
    },
    setMousePoint(x, y) {
      mouse.x = clamp(Number(x) || 0, 0, W);
      mouse.y = clamp(Number(y) || 0, 0, H);
      mouse.inside = true;
      return { x: mouse.x, y: mouse.y };
    },
    modeMultipliers(modeId, stage) {
      return {
        hpMul: modeStatMul(modeId, 'hpMul', stage),
        dmgMul: modeStatMul(modeId, 'dmgMul', stage),
        countMul: modeStatMul(modeId, 'countMul', stage),
        dropMul: modeStatMul(modeId, 'dropMul', stage),
        mobility: (MODES[modeId] || MODES.easy).mobility,
      };
    },
  };
  console.log('[NYAN] debug interface ready:', '#debug');
}

   ================================================================== */

   并忽略所有点击 / 触摸；桌面与手机横屏都不受影响。 */
function v11IsPortraitMobile() {

    return !!(V11_PROFILE.mobile && window.innerHeight > window.innerWidth);
  } catch (e) { return false; }
}

/* ---------------- 线上 JSON 加载 ---------------- */
const V11_CONFIG_FILES = ['game', 'enemies', 'skills', 'story', 'changelog'];

async function v11FetchJson(name) {
  const url = 'config/' + name + '.json';
  const res = await fetch(url, { cache: 'no-store', credentials: 'same-origin' });
  if (!res.ok) throw new Error(`${url} 拉取失败（HTTP ${res.status}）`);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error(`${url} 不是合法 JSON`); }
}

async function v11LoadRemoteConfig() {
  if (location.protocol === 'file:') {
    throw new Error('当前是 file:// 本地打开，请用 http(s) 访问');
  }
  const entries = await Promise.all(V11_CONFIG_FILES.map(async name => [name, await v11FetchJson(name)]));
  const data = Object.fromEntries(entries);
  v11ApplyConfig(data);
  return data;
}

function v11ApplyConfig(data) {
  const game = data.game || {};
  const enemies = data.enemies || {};
  const skills = data.skills || {};
  const story = data.story || {};
  const changelog = data.changelog || {};

  // ---- 数值 / 关卡 ----
  if (game.balance) Object.assign(BALANCE, game.balance);
  if (game.stageCfg) Object.assign(STAGE_CFG, game.stageCfg);
  // ---- 模式 ----
  if (game.modes) {
    for (const [id, m] of Object.entries(game.modes)) {
      if (!MODES[id]) MODES[id] = {};
      Object.assign(MODES[id], m);
    }
    const list = Array.isArray(game.modeList) ? game.modeList : Object.keys(game.modes);
    MODE_LIST.length = 0;
    for (const id of list) if (MODES[id]) MODE_LIST.push(id);
  }
  // ---- 三档上限（仅 easy / hard / hell；无限与剧情不设上限）----
  if (game.modeCaps && typeof game.modeCaps === 'object') {
    for (const id of ['easy', 'hard', 'hell']) {
      const cap = Math.floor(Number(game.modeCaps[id]) || 0);
      if (cap > 0) V11_MODE_CAPS[id] = cap;
    }
  }
  // ---- 敌人 ----
  if (enemies.defs) {
    for (const key of Object.keys(ENEMY_DEFS)) delete ENEMY_DEFS[key];
    for (const [key, def] of Object.entries(enemies.defs)) ENEMY_DEFS[key] = def;
  }
  if (Array.isArray(enemies.modules) && enemies.modules.length) {
    ENEMY_MODULES.length = 0;
    for (const m of enemies.modules) ENEMY_MODULES.push(m);
  }
  if (Array.isArray(enemies.themes) && enemies.themes.length) {
    THEMES.length = 0;
    for (const t of enemies.themes) THEMES.push(t);
  }
  // ---- 技能 / 配方 ----
  v11ApplySkillsConfig(skills);
  // ---- 剧情 ----
  if (Array.isArray(story.chapters) && story.chapters.length) {
    STORY_CHAPTERS.length = 0;
    for (const c of story.chapters) STORY_CHAPTERS.push(c);
  }
  // ---- 版本日志 ----
  if (Array.isArray(changelog.versions) && changelog.versions.length) {
    V11_CONFIG.changelog = changelog;
  }
  V11_CONFIG.gameVersion = game.version || null;
  V11_CONFIG.files = {
    game: !!data.game, enemies: !!data.enemies, skills: !!data.skills,
    story: !!data.story, changelog: !!data.changelog,
  };
  V11_CONFIG.loaded = true;
  V11_CONFIG.loading = false;
  V11_CONFIG.error = '';
  V11_CONFIG.loadedAt = Date.now();
  v11AfterConfig();
}

/* 技能配置合并：旧技能保留内联 apply，新技能用 effect 注册表驱动。
   这样 30+ 技能与 13 条配方都能从 JSON 在线扩充，不必改 HTML。 */
function v11ApplySkillsConfig(cfg) {
  if (!Array.isArray(cfg.skills) || !cfg.skills.length) return;
  const legacyById = {};
  for (const s of SKILLS) legacyById[s.id] = s;
  SKILLS.length = 0;
  for (const raw of cfg.skills) {
    const old = legacyById[raw.id];
    const merged = Object.assign({}, old || {}, raw);
    if (!merged.apply || typeof merged.apply !== 'function') merged.apply = v11SkillApply(merged.id);
    if (!merged.mutateIcon) merged.mutateIcon = merged.icon;
    SKILLS.push(merged);
  }
  for (const key of Object.keys(SKILL_BY_ID)) delete SKILL_BY_ID[key];
  for (const s of SKILLS) SKILL_BY_ID[s.id] = s;
  if (Array.isArray(cfg.recipes)) {
    SKILL_RECIPES.length = 0;
    for (const r of cfg.recipes) {
      SKILL_RECIPES.push(Object.assign({}, r, {
        icon: r.icon || 'star',
        color: r.color || C.gold,
      }));
    }
  }
}

/* 新技能默认 apply：等级本身写入 run.upgradeStacks；
   持续型效果由 updateSkillSystems 按等级实时计算，避免存档字段膨胀。 */
function v11SkillApply(id) {
  return function (p, lv) { /* 统计型/持续型技能无需写入玩家字段 */ };
}

function v11AfterConfig() {
  // 章节数、最终关卡等可能变化：把联动值同步到 UI 文案。
  MODE_TAGLINE.story = `${STAGE_CFG.storyStageCount || 30} 关 · 章节剧情 · 顺序解锁`;
  MODE_TAGLINE.infinite = '层数递增 · 越找越离谱';
  // 让新配置里的章节背景/敌人绘制立即生效（见 B/C 段注册表）。
  v11RegisterEnemyArt();
  v11RegisterPlayerArt();
}

/* ---------------- 启动 / 断网 ---------------- */
async function v11BootGame() {
  if (V11_CONFIG.loading) return;
  V11_CONFIG.loading = true;
  V11_CONFIG.error = '';
  state = 'loading';
  V11_PAGES.pendingMode = null;
  v11EnsureBackground();
  try {
    // 配置与背景并行：背景最多等 1200ms，超时直接放行进主页（图片失败走渐变兜底）。
    await Promise.all([v11LoadRemoteConfig(), v11BgWait(1200)]);
    state = 'title';
    const hint = lastSlotHint();
    if (hint) activateProfile(hint, true);
    v11SyncCanvasSize();
    showToast(`联网配置已就绪 · ${v11Version()}`, C.mint, 2.2);
  } catch (err) {
    V11_CONFIG.loading = false;
    V11_CONFIG.error = (err && err.message) || '网络不可用';
    state = 'offline';
  }
}

  const tips = IS_TOUCH_DEVICE

    : ['检查网络连接或代理', '确认 config/ 目录与 index.html 同源部署', 'file:// 直接双击不可用，请用 http(s) 访问'];
  for (let i = 0; i < tips.length; i++) {

  const btn = { x: W / 2 - 150, y: 486, w: 300, h: 64 };
