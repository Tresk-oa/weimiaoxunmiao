function drawCatHead(g, x, y, size, formIndex, t = 0) {
  const f = FORMS[formIndex || 0] || FORMS[0];
  g.save(); g.translate(x, y);
  if ((formIndex || 0) === 2) g.rotate(Math.sin(t * 1.2) * .025);
  const head = FORM_HEAD_ART[f.art] || FORM_HEAD_ART.basic;
  head(g, size, t);
  g.restore();
}


function drawSlash(g, p, t) {
  if (!p || p.dead || p.attackAnim <= 0) return;
  const progress = 1 - p.attackAnim / p.attackAnimMax;
  const alpha = clamp(p.attackAnim / p.attackAnimMax, 0, 1) * .85;
  const colors = p.form === 2 ? [C.gold, C.lavender, C.cream] : (p.form === 1 ? [C.gold, C.coral, C.cream] : [C.cream, C.gold, C.coral]);
  g.save();
  g.globalAlpha = alpha;
  // 挥爪范围提示
  g.fillStyle = withAlpha(colors[1], .10);
  g.beginPath();
  g.moveTo(p.x, p.y);
  g.arc(p.x, p.y, p.attackRange, p.swingAim - p.attackArc / 2, p.swingAim + p.attackArc / 2);
  g.closePath(); g.fill();
  g.strokeStyle = withAlpha(colors[1], .25); g.lineWidth = 2;
  g.beginPath(); g.arc(p.x, p.y, p.attackRange, p.swingAim - p.attackArc / 2, p.swingAim + p.attackArc / 2); g.stroke();

  const sweepA = p.swingAim - p.attackArc * .52 + p.attackArc * 1.04 * easeOut(progress);
  for (let i = 0; i < 3; i++) {
    const rr = p.attackRange * (.55 + i * .15);
    const a0 = sweepA - .52 - i * .08;
    const a1 = sweepA + .34 - i * .06;
    g.save();
    g.strokeStyle = C.ink; g.lineWidth = 11 - i * 2;
    g.beginPath(); g.arc(p.x, p.y, rr, a0, a1); g.stroke();
    g.strokeStyle = colors[i]; g.lineWidth = 7 - i * 1.7;
    g.beginPath(); g.arc(p.x, p.y, rr, a0, a1); g.stroke();
    g.restore();
  }
  // 甩爪的爪印残影
  const tipX = p.x + Math.cos(sweepA) * p.attackRange * .77;
  const tipY = p.y + Math.sin(sweepA) * p.attackRange * .77;
  g.save(); g.translate(tipX, tipY); g.rotate(sweepA + Math.PI / 2);
  g.globalAlpha = alpha * .6;
  drawPaw(g, 0, 0, 10, colors[0]);
  g.restore();
  if (p.form === 2) {
    for (let i = 0; i < 4; i++) {
      const a = sweepA + i * .28;
      drawStar(g, p.x + Math.cos(a) * p.attackRange * .5, p.y + Math.sin(a) * p.attackRange * .5, 4, 1.5, 5, C.gold, null, 0);
    }
  }
  g.restore();
}

function drawClone(g, c) {
  if (!c || c.dead) return;
  const p = player;
  const f = FORMS[p.form || 0];
  const r = (p.r || 20) * .72;
  g.save();
  g.globalAlpha = .58 + Math.sin(time * 5 + c.id) * .09;
  g.translate(c.x, c.y);
  g.fillStyle = withAlpha(C.lavender, .25);
  g.beginPath(); g.ellipse(0, r * 1, r * .9, r * .3, 0, 0, TAU); g.fill();
  catEar(g, -r * .5, -r * .55, r * .28, r * .38, -.2, withAlpha(C.lavender, .85), withAlpha(C.cream, .5));
  catEar(g, r * .5, -r * .55, r * .28, r * .38, .2, withAlpha(C.lavender, .85), withAlpha(C.cream, .5));
  ellipse(g, 0, 0, r * .9, r * .92, withAlpha(C.lavender, .88), withAlpha(C.ink, .45), 2.5);
  ellipse(g, 0, r * .25, r * .48, r * .42, withAlpha(C.cream, .5), null, 0);
  g.fillStyle = C.ink;
  ellipse(g, -r * .28, -r * .2, r * .16, r * .21, C.cream, null, 0);
  ellipse(g, r * .28, -r * .2, r * .16, r * .21, C.cream, null, 0);
  circle(g, -r * .25, -r * .2, r * .08, C.ink, null, 0);
  circle(g, r * .31, -r * .2, r * .08, C.ink, null, 0);
  g.fillStyle = C.coral;
  g.beginPath(); g.moveTo(-r * .07, r * .03); g.lineTo(0, r * .09); g.lineTo(r * .07, r * .03); g.closePath(); g.fill();
  if (c.attackAnim > 0) {
    const a = c.aim || 0;
    g.strokeStyle = withAlpha(C.cream, .85); g.lineWidth = 4;
    g.beginPath(); g.arc(0, 0, r * 1.2, a - .6, a + .6); g.stroke();
  }
  g.restore();
}

/* ------------------------------------------------------------------
   06C. 怪诞猫猫敌人 / 预警 / 敌人血条
   Battle Cats 风：圆滚滚、粗黑描边、扁平上色 + 夸张表情。
   ------------------------------------------------------------------ */
function dashedCircle(g, x, y, r, color, width = 4, dash = [10, 8]) {
  g.save();
  g.strokeStyle = color; g.lineWidth = width;
  g.setLineDash(dash);
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
  g.restore();
}

function drawBeastEye(g, x, y, rx, ry, lookX, lookY, mode = 'normal', tilt = 0) {
  g.save(); g.translate(x, y); g.rotate(tilt);
  ellipse(g, 0, 0, rx, ry, C.white, C.ink, 2.8);
  if (mode === 'stun') {
    g.strokeStyle = C.ink; g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(-rx * .55, -ry * .55); g.lineTo(rx * .55, ry * .55); g.stroke();
    g.beginPath(); g.moveTo(rx * .55, -ry * .55); g.lineTo(-rx * .55, ry * .55); g.stroke();
  } else if (mode === 'happy') {
    g.strokeStyle = C.ink; g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, ry * .1, rx * .62, Math.PI * .12, Math.PI - .12); g.stroke();
  } else {
    circle(g, lookX * rx * .42, lookY * ry * .42, Math.min(rx, ry) * (mode === 'angry' ? .46 : .38), C.ink, null, 0);
    circle(g, lookX * rx * .42 - rx * .18, lookY * ry * .42 - ry * .2, Math.max(1, rx * .11), C.white, null, 0);
    if (mode === 'angry') {
      g.strokeStyle = C.ink; g.lineWidth = 3;
      g.beginPath(); g.moveTo(-rx * .85, -ry * 1.15); g.lineTo(rx * .62, -ry * .5); g.stroke();
    }
  }
  g.restore();
}

function drawTelegraphLine(g, e, angle, len, color, active) {
  g.strokeStyle = withAlpha(color, .55 + active * .2); g.lineWidth = 4;
  g.setLineDash([12, 8]);
  g.beginPath(); g.moveTo(e.x, e.y);
  g.lineTo(e.x + Math.cos(angle) * len, e.y + Math.sin(angle) * len); g.stroke();
  g.setLineDash([]);
  g.save();
  g.translate(e.x + Math.cos(angle) * len, e.y + Math.sin(angle) * len);
  g.rotate(angle);
  g.fillStyle = withAlpha(color, .85);
  g.beginPath(); g.moveTo(16, 0); g.lineTo(-6, -13); g.lineTo(-6, 13); g.closePath(); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 2.5; g.stroke();
  g.restore();
}

function drawTelegraphCone(g, e, angle, radius, halfArc, color, active) {
  g.globalAlpha = .2 + active * .12;
  g.fillStyle = color;
  g.beginPath(); g.moveTo(e.x, e.y);
  g.arc(e.x, e.y, radius, angle - halfArc, angle + halfArc); g.closePath(); g.fill();
  g.globalAlpha = 1;
  g.strokeStyle = withAlpha(color, .8); g.lineWidth = 4;
  g.setLineDash([13, 9]);
  g.beginPath(); g.moveTo(e.x, e.y);
  g.lineTo(e.x + Math.cos(angle - halfArc) * radius, e.y + Math.sin(angle - halfArc) * radius);
  g.moveTo(e.x, e.y);
  g.lineTo(e.x + Math.cos(angle + halfArc) * radius, e.y + Math.sin(angle + halfArc) * radius);
  g.stroke();
  g.setLineDash([]);
}

function drawTelegraphSpeedLines(g, e, angle, color, count = 4) {
  g.globalAlpha = .55;
  for (let i = 0; i < count; i++) {
    const off = i * 9 + 14;
    g.strokeStyle = i % 2 ? C.cream : color; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(e.x - Math.cos(angle) * off - Math.sin(angle) * e.r * .65,
      e.y - Math.sin(angle) * off + Math.cos(angle) * e.r * .65);
    g.lineTo(e.x - Math.cos(angle) * (off + 30) - Math.sin(angle) * e.r * .65,
      e.y - Math.sin(angle) * (off + 30) + Math.cos(angle) * e.r * .65);
    g.stroke();
  }
  g.globalAlpha = 1;
}

/* §9：预警完全按 AI 行为泛化，不依赖旧敌人 type。 */
function drawEnemyTelegraph(g, e, t) {
  if (!e || e.dead || e.spawnTimer > 0 || !player) return;
  const active = Math.sin(t * 12) * .5 + .5;
  g.save();
  const toP = Math.atan2(player.y - e.y, player.x - e.x);

  if (e.ai === 'charger' && e.action === 'wind') {
    drawTelegraphLine(g, e, e.chargeAngle, 360, C.coral, active);
  } else if (e.ai === 'charger' && e.action === 'charge') {
    drawTelegraphSpeedLines(g, e, e.chargeAngle, C.coral, 4);
  } else if (e.ai === 'ranged' && e.action === 'wind') {
    drawTelegraphLine(g, e, e.aimAngle || toP, 560, C.pink, active);
    g.save(); g.translate(e.x, e.y - e.r * .1); g.rotate(t * 5);
    drawFish(g, 0, 0, 15, withAlpha(C.mint, .85), C.ink, 2.5, 0);
    g.restore();
  } else if (e.ai === 'lunge' && e.action === 'crouch') {
    const p = 1 - clamp(e.actionT / .5, 0, 1);
    dashedCircle(g, e.x, e.y, 150 * easeOut(p), withAlpha(C.coral, .5 + .3 * active), 5, [14, 9]);
    g.globalAlpha = .18 * active; g.fillStyle = C.coral;
    g.beginPath(); g.arc(e.x, e.y, 150, 0, TAU); g.fill();
    g.globalAlpha = 1;
  } else if (e.ai === 'lunge' && e.action === 'leap') {
    drawTelegraphSpeedLines(g, e, e.chargeAngle, C.pink, 5);
  } else if (e.ai === 'zigzag' && e.action === 'bite') {
    drawTelegraphSpeedLines(g, e, e.chargeAngle, C.mint, 3);
  } else if (e.ai === 'heavy' && e.action === 'stomp') {
    const p = 1 - clamp(e.actionT / .62, 0, 1);
    dashedCircle(g, e.x, e.y, 150 * easeOut(p), withAlpha(C.coral, .5 + .3 * active), 5, [14, 9]);
    dashedCircle(g, e.x, e.y, 77, withAlpha(C.gold, .55), 3, [8, 8]);
    g.globalAlpha = .22 * active; g.fillStyle = C.coral;
    g.beginPath(); g.arc(e.x, e.y, 150, 0, TAU); g.fill();
    g.globalAlpha = 1;
  } else if (e.ai === 'drill' && e.action === 'rev') {
    const p = 1 - clamp(e.actionT / .48, 0, 1);
    dashedCircle(g, e.x, e.y, e.r + 12 + p * 22, withAlpha(C.blue, .55 + .3 * active), 4, [10, 8]);
    drawTelegraphLine(g, e, toP, 340, C.blue, active);
  } else if (e.ai === 'drill' && e.action === 'drill') {
    drawTelegraphSpeedLines(g, e, e.chargeAngle, C.blue, 5);
  } else if (e.ai === 'orbiter' && e.action === 'wind') {
    drawTelegraphCone(g, e, toP, 320, .16, C.lavender, active);
  } else if (e.ai === 'whip' && e.action === 'whip') {
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    drawTelegraphCone(g, e, ang, 190, .65, C.lavender, active);
  } else if (e.action === 'windCharge') {
    drawTelegraphCone(g, e, toP, 560, .19, C.coral, active);
    g.strokeStyle = withAlpha(C.coral, .75); g.lineWidth = 4;
    g.setLineDash([13, 9]);
    g.beginPath(); g.moveTo(e.x, e.y);
    g.lineTo(e.x + Math.cos(toP) * 560, e.y + Math.sin(toP) * 560); g.stroke();
    g.setLineDash([]);
  } else if (e.action === 'windBarrage') {
    const p = 1 - clamp(e.actionT / (e.enraged ? .45 : .6), 0, 1);
    for (let i = 0; i < 3; i++) {
      dashedCircle(g, e.x, e.y, e.r * 1.3 + i * 24 + p * 20, withAlpha(C.gold, .35 + i * .1), 4, [11, 9]);
    }
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + t * .8;
      g.fillStyle = withAlpha(C.gold, .5 + active * .25);
      circle(g, e.x + Math.cos(a) * (e.r + 18), e.y + Math.sin(a) * (e.r + 18), 4, C.gold, null, 0);
    }
  } else if (e.action === 'windMissiles') {
    const p = 1 - clamp(e.actionT / (e.enraged ? .45 : .6), 0, 1);
    for (let i = 0; i < 3; i++) {
      drawTelegraphLine(g, e, toP + (i - 1) * .2, 330 + p * 60, C.gold, active);
    }
  } else if (e.action === 'roar') {
    g.globalAlpha = .22 * active; g.fillStyle = C.coral;
    g.beginPath(); g.arc(e.x, e.y, e.r * 2.4, 0, TAU); g.fill();
    g.globalAlpha = 1;
    dashedCircle(g, e.x, e.y, e.r * 2.4, withAlpha(C.coral, .55), 5, [16, 10]);
  } else if (e.action === 'teleport') {
    dashedCircle(g, e.x, e.y, e.r * 1.6, withAlpha(C.lavender, .55 + active * .3), 4, [9, 7]);
  }
  g.restore();
}

/* ------------------------------------------------------------------
   06C. §9 敌人造型库：15 个独立绘制函数（12 小怪 + 3 Boss）
   每个函数都有自己的轮廓、配色、动作语言；遮住颜色也能靠剪影区分。
   ------------------------------------------------------------------ */
function enemyLook(e) { return player ? (Math.sign(player.x - e.x) || 1) : 1; }

function drawCatEar(g, x, y, s, rot, outer, inner) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = outer; g.strokeStyle = C.ink; g.lineWidth = Math.max(2, s * .18);
  g.beginPath();
  g.moveTo(-s * .52, s * .3);
  g.quadraticCurveTo(-s * .2, -s * .8, 0, -s * .98);
  g.quadraticCurveTo(s * .2, -s * .8, s * .52, s * .3);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = inner;
  g.beginPath(); g.moveTo(-s * .3, s * .18); g.quadraticCurveTo(0, -s * .46, s * .3, s * .18); g.closePath(); g.fill();
  g.restore();
}

function drawGearShape(g, radius, teeth, fill, rot = 0) {
  g.save(); g.rotate(rot);
  g.fillStyle = fill; g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a = i / (teeth * 2) * TAU;
    const rr = i % 2 === 0 ? radius * 1.12 : radius * .9;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.closePath(); g.fill(); g.stroke();
  circle(g, 0, 0, radius * .38, '#5c7288', C.ink, 3);
  g.restore();
}

/* 1. 软糖滚滚：半透明软糖熊猫，头顶樱桃，会左右弹跳着冲撞。 */
function drawGummy(g, e, t) {
  const r = e.r;
  const angry = e.action === 'wind' || e.action === 'charge';
  const wob = Math.sin(t * 8 + e.phase) * .06;
  g.save();
  g.translate(0, Math.sin(t * 7 + e.phase) * r * .06);
  g.scale(1 + wob, 1 - wob);
  // 软糖光泽层
  g.fillStyle = e.color;
  g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath();
  g.moveTo(-r * .9, r * .55);
  g.quadraticCurveTo(-r * 1.02, -r * .5, -r * .38, -r * .82);
  g.quadraticCurveTo(0, -r * 1.05, r * .38, -r * .82);
  g.quadraticCurveTo(r * 1.02, -r * .5, r * .9, r * .55);
  g.quadraticCurveTo(0, r * 1.02, -r * .9, r * .55);
  g.closePath(); g.fill(); g.stroke();
  g.save(); g.globalAlpha = .35; g.fillStyle = C.white;
  ellipse(g, -r * .38, -r * .45, r * .24, r * .16, C.white, null, 0, -.4);
  ellipse(g, r * .45, r * .1, r * .1, r * .06, C.white, null, 0, -.4);
  g.restore();
  drawCatEar(g, -r * .56, -r * .68, r * .55, -.45, e.color, '#ffe3ed');
  drawCatEar(g, r * .56, -r * .68, r * .55, .45, e.color, '#ffe3ed');
  // 樱桃
  g.strokeStyle = '#5f9b55'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, -r * .82); g.quadraticCurveTo(r * .2, -r * 1.12, r * .1, -r * 1.25); g.stroke();
  circle(g, r * .1, -r * 1.3, r * .16, '#ff566e', C.ink, 3);
  // 表情
  const look = enemyLook(e);
  drawBeastEye(g, -r * .3, -r * .2, r * .18, r * .22, look, .12, angry ? 'angry' : 'normal');
  drawBeastEye(g, r * .3, -r * .2, r * .18, r * .22, look, .12, angry ? 'angry' : 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(-r * .18, r * .27); g.quadraticCurveTo(0, angry ? r * .1 : r * .4, r * .18, r * .27); g.stroke();
  if (angry) {
    g.fillStyle = C.cream;
    g.beginPath(); g.moveTo(-r * .08, r * .28); g.lineTo(r * .08, r * .28); g.lineTo(0, r * .38); g.closePath(); g.fill();
  }
  // 小短手
  ellipse(g, -r * .93, r * .2, r * .18, r * .27, e.color, C.ink, 3);
  ellipse(g, r * .93, r * .2, r * .18, r * .27, e.color, C.ink, 3);
  g.restore();
}

/* 2. 棒棒糖猫：糖果圆盘 + 糖棍腿，投掷糖屑时会旋转。 */
function drawLollipop(g, e, t) {
  const r = e.r;
  const dir = enemyLook(e);
  const wind = e.action === 'wind';
  g.save();
  // 糖棍腿
  g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath(); g.moveTo(-r * .12, r * .45); g.lineTo(-r * .14, r * 1.18); g.stroke();
  g.strokeStyle = '#f3e4c5'; g.lineWidth = r * .17;
  g.beginPath(); g.moveTo(-r * .12, r * .45); g.lineTo(-r * .14, r * 1.18); g.stroke();
  for (const side of [-1, 1]) ellipse(g, side * r * .2, r * 1.22, r * .2, r * .12, '#ffcf6e', C.ink, 2.5);
  // 糖果盘身体
  g.translate(0, Math.sin(t * 3 + e.phase) * r * .05);
  circle(g, 0, 0, r * .92, e.color, C.ink, 4.5);
  // 糖果螺旋
  g.save(); g.rotate(t * .5 + e.phase);
  g.strokeStyle = withAlpha(C.coral, .8); g.lineWidth = r * .16;
  g.beginPath();
  for (let i = 0; i < 40; i++) {
    const a = i * .32, rr = r * .08 + i * r * .017;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.stroke(); g.restore();
  g.save(); g.globalAlpha = .3; ellipse(g, -r * .3, -r * .36, r * .2, r * .1, C.white, null, 0, -.6); g.restore();
  drawCatEar(g, -r * .7, -r * .58, r * .46, -.55, '#ffcf6e', '#ffb0c7');
  drawCatEar(g, r * .7, -r * .58, r * .46, .55, '#ffcf6e', '#ffb0c7');
  // 脸
  drawBeastEye(g, -r * .3 * dir, -r * .12, r * .17, r * .2, dir, .1, wind ? 'angry' : 'normal');
  drawBeastEye(g, r * .3 * dir, -r * .12, r * .17, r * .2, dir, .1, wind ? 'angry' : 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2.4;
  g.beginPath(); g.arc(0, r * .3, r * .16, .1, Math.PI - .1); g.stroke();
  // 糖屑蓄力
  if (wind) {
    for (let i = 0; i < 5; i++) {
      const a = t * 4 + i * TAU / 5;
      drawStar(g, Math.cos(a) * r * 1.2, Math.sin(a) * r * 1.2, r * .09, r * .04, 5, C.coral, null, 0);
    }
  }
  g.restore();
}

/* 3. 棉花糖跳跳：高瘦棉花糖柱，蹲下时压扁、跳起时拉长。 */
function drawMarshmallow(g, e, t) {
  const r = e.r;
  const crouch = e.action === 'crouch';
  const leap = e.action === 'leap';
  const wind = e.action === 'wind';
  let sx = 1 + Math.sin(t * 3 + e.phase) * .04;
  let sy = 1 - Math.sin(t * 3 + e.phase) * .04;
  if (crouch) { sx = 1.18; sy = .8; }
  if (leap) { sx = .82; sy = 1.22; }
  g.save();
  g.translate(0, leap ? -r * .18 + Math.sin(t * 12) * r * .06 : 0);
  g.scale(sx, sy);
  // 棉花糖柱
  g.fillStyle = e.color; g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath();
  g.moveTo(-r * .72, r * .92);
  g.quadraticCurveTo(-r * .86, -r * .5, -r * .5, -r * .96);
  g.quadraticCurveTo(0, -r * 1.22, r * .5, -r * .96);
  g.quadraticCurveTo(r * .86, -r * .5, r * .72, r * .92);
  g.quadraticCurveTo(0, r * 1.12, -r * .72, r * .92);
  g.closePath(); g.fill(); g.stroke();
  g.save(); g.globalAlpha = .5; fillRound(g, -r * .5, -r * .5, r * .25, r * .8, r * .12, C.white); g.restore();
  drawCatEar(g, -r * .5, -r * .92, r * .5, -.5, '#ffd6ef', '#ffadc8');
  drawCatEar(g, r * .5, -r * .92, r * .5, .5, '#ffd6ef', '#ffadc8');
  // 脸
  drawBeastEye(g, -r * .3, -r * .38, r * .17, r * .2, enemyLook(e), .1, crouch ? 'angry' : 'normal');
  drawBeastEye(g, r * .3, -r * .38, r * .17, r * .2, enemyLook(e), .1, crouch ? 'angry' : 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2.3;
  g.beginPath(); g.moveTo(-r * .16, r * .05); g.quadraticCurveTo(0, r * .2, r * .16, r * .05); g.stroke();
  if (crouch) {
    g.fillStyle = withAlpha(C.coral, .55);
    ellipse(g, -r * .58, r * .05, r * .13, r * .07, withAlpha(C.coral, .55), null, 0);
    ellipse(g, r * .58, r * .05, r * .13, r * .07, withAlpha(C.coral, .55), null, 0);
  }
  // 小短手
  ellipse(g, -r * .78, r * .3, r * .16, r * .28, e.color, C.ink, 3);
  ellipse(g, r * .78, r * .3, r * .16, r * .28, e.color, C.ink, 3);
  // 跳扑拖尾
  if (leap) {
    g.globalAlpha = .4;
    for (let i = 0; i < 3; i++) ellipse(g, 0, r * .5 + i * r * .16, r * .55 - i * r * .1, r * .12, C.white, null, 0);
  }
  g.restore();
}

/* 4. 糖豆双子：两颗糖豆连在一起，一前一后蛇形游走。 */
function drawJellybean(g, e, t) {
  const r = e.r;
  const bite = e.action === 'bite';
  const wob = Math.sin(t * 6 + e.phase) * .15;
  g.save();
  // 连接糖丝
  g.strokeStyle = '#ff9bc4'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(-r * .35, r * .1); g.quadraticCurveTo(0, -r * .3 + wob * 4, r * .42, r * .1); g.stroke();
  // 大糖豆（左）
  g.save(); g.translate(-r * .5, 0); g.rotate(-.35 + wob * .4);
  ellipse(g, 0, 0, r * .72, r * .98, e.color, C.ink, 4);
  g.save(); g.globalAlpha = .45; ellipse(g, -r * .2, -r * .45, r * .2, r * .1, C.white, null, 0, -.3); g.restore();
  drawBeastEye(g, -r * .2, -r * .2, r * .18, r * .21, enemyLook(e), .1, bite ? 'angry' : 'normal');
  drawBeastEye(g, r * .2, -r * .2, r * .18, r * .21, enemyLook(e), .1, bite ? 'angry' : 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2.2;
  g.beginPath(); g.moveTo(-r * .12, r * .2); g.lineTo(r * .12, r * .2); g.stroke();
  g.restore();
  // 小糖豆（右）
  g.save(); g.translate(r * .58, r * .18); g.rotate(.45 - wob * .4);
  ellipse(g, 0, 0, r * .54, r * .76, '#ffcf6e', C.ink, 3.5);
  drawBeastEye(g, -r * .16, -r * .16, r * .13, r * .16, -enemyLook(e), .1, 'normal');
  drawBeastEye(g, r * .16, -r * .16, r * .13, r * .16, -enemyLook(e), .1, 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2;
  g.beginPath(); g.arc(0, r * .16, r * .12, .1, Math.PI - .1); g.stroke();
  g.restore();
  // 三只小脚
  for (let i = -1; i <= 1; i++) {
    g.save(); g.translate(i * r * .36, r * .95);
    ellipse(g, 0, 0, r * .14, r * .1, '#ff9bc4', C.ink, 2.5);
    g.restore();
  }
  g.restore();
}

/* 5. Boss 巨型布丁猫：梯形布丁 + 焦糖淋面 + 樱桃，靠体型和布丁轮廓区分。 */
function drawPuddingBoss(g, e, t) {
  const r = e.r;
  const enraged = e.enraged;
  const wob = Math.sin(t * 3 + e.phase) * r * .04;
  const angry = ['windBarrage', 'windCharge', 'charge'].includes(e.action);
  g.save();
  g.translate(0, wob);
  g.scale(1 + wob / r * .6, 1 - wob / r * .6);
  if (enraged) {
    g.save(); g.globalAlpha = .32 + Math.sin(t * 7) * .12;
    const aura = g.createRadialGradient(0, 0, r * .5, 0, 0, r * 1.7);
    aura.addColorStop(0, withAlpha(C.coral, .5)); aura.addColorStop(1, 'rgba(255,60,90,0)');
    g.fillStyle = aura; g.beginPath(); g.arc(0, 0, r * 1.7, 0, TAU); g.fill(); g.restore();
  }
  // 盘子
  ellipse(g, 0, r * .9, r * 1.45, r * .3, '#cfe9ff', C.ink, 5);
  // 布丁梯形
  g.fillStyle = e.color; g.strokeStyle = C.ink; g.lineWidth = 6;
  g.beginPath();
  g.moveTo(-r * 1.18, r * .8);
  g.quadraticCurveTo(-r * 1.1, -r * .3, -r * .62, -r * .96);
  g.quadraticCurveTo(0, -r * 1.1, r * .62, -r * .96);
  g.quadraticCurveTo(r * 1.1, -r * .3, r * 1.18, r * .8);
  g.quadraticCurveTo(0, r * 1.1, -r * 1.18, r * .8);
  g.closePath(); g.fill(); g.stroke();
  // 焦糖淋面
  g.fillStyle = '#c98145';
  g.beginPath();
  g.moveTo(-r * .7, -r * .92);
  g.quadraticCurveTo(0, -r * 1.05, r * .7, -r * .92);
  g.quadraticCurveTo(r * .78, -r * .58, r * .6, -r * .5);
  g.quadraticCurveTo(r * .48, -r * .32, r * .36, -r * .5);
  g.quadraticCurveTo(0, -r * .3, -r * .36, -r * .5);
  g.quadraticCurveTo(-r * .48, -r * .32, -r * .6, -r * .5);
  g.quadraticCurveTo(-r * .78, -r * .58, -r * .7, -r * .92);
  g.closePath(); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 3; g.stroke();
  // 樱桃
  circle(g, 0, -r * 1.06, r * .15, '#ff566e', C.ink, 3);
  drawCatEar(g, -r * .68, -r * .95, r * .5, -.55, e.color, '#ffe6a8');
  drawCatEar(g, r * .68, -r * .95, r * .5, .55, e.color, '#ffe6a8');
  // 脸
  drawBeastEye(g, -r * .36, -r * .35, r * .2, r * .24, enemyLook(e), .12, angry ? 'angry' : 'normal');
  drawBeastEye(g, r * .36, -r * .35, r * .2, r * .24, enemyLook(e), .12, angry ? 'angry' : 'normal');
  if (enraged) drawBeastEye(g, 0, -r * .7, r * .12, r * .14, enemyLook(e), .1, 'angry');
  g.strokeStyle = C.ink; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-r * .3, r * .18); g.quadraticCurveTo(0, r * .45, r * .3, r * .18); g.stroke();
  g.fillStyle = C.coral; ellipse(g, 0, r * .33, r * .13, r * .07, C.coral, null, 0);
  // 两根猫胡须
  g.strokeStyle = C.ink; g.lineWidth = 2;
  for (const side of [-1, 1]) for (let i = 0; i < 2; i++) {
    g.beginPath(); g.moveTo(side * r * .45, r * .1 + i * r * .12); g.lineTo(side * r * .82, r * .02 + i * r * .2); g.stroke();
  }
  // 小勺
  g.save(); g.translate(r * 1.12, r * .02); g.rotate(.35);
  g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath(); g.moveTo(0, r * .4); g.lineTo(0, -r * .3); g.stroke();
  ellipse(g, 0, -r * .42, r * .2, r * .3, C.cream, C.ink, 3);
  g.restore();
  g.restore();
}

/* 6. 齿轮鼠兵：齿轮身体 + 鼠耳长尾，滚动着冲刺。 */
function drawGearrat(g, e, t) {
  const r = e.r;
  const look = enemyLook(e);
  const charge = e.action === 'charge';
  g.save();
  if (charge) g.translate(0, Math.sin(t * 22) * r * .05);
  // 长尾巴
  g.strokeStyle = C.ink; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-r * .8, r * .2); g.quadraticCurveTo(-r * 1.5, r * .05 + Math.sin(t * 6) * r * .18, -r * 1.25, r * .65); g.stroke();
  g.strokeStyle = '#d98da8'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(-r * .8, r * .2); g.quadraticCurveTo(-r * 1.5, r * .05 + Math.sin(t * 6) * r * .18, -r * 1.25, r * .65); g.stroke();
  // 齿轮身体
  g.save(); g.rotate(t * (charge ? 8 : 2));
  drawGearShape(g, r * .86, 8, e.color, 0);
  g.restore();
  // 鼠耳
  circle(g, -r * .55, -r * .72, r * .3, '#8fa7bd', C.ink, 3.5);
  circle(g, r * .55, -r * .72, r * .3, '#8fa7bd', C.ink, 3.5);
  circle(g, -r * .55, -r * .72, r * .16, '#ffc1d6', null, 0);
  circle(g, r * .55, -r * .72, r * .16, '#ffc1d6', null, 0);
  // 脸
  drawBeastEye(g, -r * .3 * look, -r * .18, r * .17, r * .16, look, .1, charge ? 'angry' : 'normal');
  drawBeastEye(g, r * .3 * look, -r * .18, r * .17, r * .16, look, .1, charge ? 'angry' : 'normal');
  g.fillStyle = C.cream; g.strokeStyle = C.ink; g.lineWidth = 2;
  for (const side of [-1, 1]) {
    g.beginPath(); g.moveTo(side * r * .1, r * .2); g.lineTo(side * r * .17, r * .42); g.lineTo(side * r * .25, r * .2); g.closePath(); g.fill(); g.stroke();
  }
  // 胡须
  g.strokeStyle = C.ink; g.lineWidth = 1.8;
  for (const side of [-1, 1]) for (let i = 0; i < 2; i++) {
    g.beginPath(); g.moveTo(side * r * .22, r * .12 + i * r * .1); g.lineTo(side * r * .58, r * .05 + i * r * .16); g.stroke();
  }
  // 小脚
  ellipse(g, -r * .3, r * .95, r * .22, r * .14, '#6f8cab', C.ink, 3);
  ellipse(g, r * .3, r * .95, r * .22, r * .14, '#6f8cab', C.ink, 3);
  g.restore();
}

/* 7. 炮筒猫：猫头 + 背上的大炮筒，保持距离开火。 */
function drawCannoncat(g, e, t) {
  const r = e.r;
  const look = enemyLook(e);
  const wind = e.action === 'wind';
  const recoil = e.action === 'shoot' ? .25 : 0;
  g.save(); g.scale(look, 1);
  // 履带
  fillRound(g, -r * .85, r * .55, r * .9, r * .5, r * .2, '#3f5164');

  g.save(); g.translate(-recoil * r, 0);
  fillRound(g, r * .1, -r * .55, r * 1.25, r * .52, r * .16, '#54697f');

  fillRound(g, r * .95, -r * .68, r * .32, r * .72, r * .1, '#809bb3');
  strokeRound(g, r * .95, -r * .68, r * .32, r * .72, r * .1, C.ink, 3);
  if (wind) {
    g.globalAlpha = .5 + Math.sin(t * 14) * .2;
    circle(g, r * 1.15, -r * .32, r * .22, '#ffb347', null, 0);
  }
  g.restore();
  // 猫身体
  ellipse(g, -r * .22, r * .1, r * .78, r * .74, e.color, C.ink, 4);
  drawCatEar(g, -r * .72, -r * .38, r * .42, -.5, e.color, '#ffc1d6');
  drawCatEar(g, -r * .2, -r * .52, r * .42, -.15, e.color, '#ffc1d6');
  // 头盔
  g.fillStyle = '#4d637a'; g.strokeStyle = C.ink; g.lineWidth = 3;
  g.beginPath(); g.arc(-r * .22, -r * .32, r * .5, Math.PI, TAU); g.closePath(); g.fill(); g.stroke();
  // 脸
  drawBeastEye(g, -r * .5, r * .06, r * .16, r * .17, look, .1, wind ? 'angry' : 'normal');
  drawBeastEye(g, r * .02, r * .06, r * .16, r * .17, look, .1, wind ? 'angry' : 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2.2;
  g.beginPath(); g.arc(-r * .24, r * .32, r * .12, .1, Math.PI - .1); g.stroke();
  // 小爪
  ellipse(g, -r * .75, r * .55, r * .2, r * .24, e.color, C.ink, 3);
  g.restore();
}

/* 8. 铁皮胖墩：铆钉铁球 + 方肩甲 + 面罩，走得很慢但会重踏。 */
function drawIronpud(g, e, t) {
  const r = e.r;
  const stomp = e.action === 'stomp';
  const sq = stomp ? .82 : 1 + Math.sin(t * 2 + e.phase) * .02;
  g.save(); g.scale(1 / sq, sq);
  // 方形肩甲
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .95, -r * .12); g.rotate(side * .12);
    fillRound(g, -r * .3, -r * .3, r * .6, r * .6, r * .12, '#697b92');
    strokeRound(g, -r * .3, -r * .3, r * .6, r * .6, r * .12, C.ink, 4);
    g.fillStyle = '#b4c3d4';
    circle(g, -r * .14, -r * .14, r * .05, '#b4c3d4', null, 0);
    circle(g, r * .14, r * .14, r * .05, '#b4c3d4', null, 0);
    g.restore();
  }
  // 铁球身体
  circle(g, 0, r * .08, r * .92, e.color, C.ink, 5);
  // 铆钉
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + .2;
    circle(g, Math.cos(a) * r * .72, r * .08 + Math.sin(a) * r * .72, r * .05, '#5b6b7e', null, 0);
  }
  // 头盔
  g.fillStyle = '#5b6b7e'; g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath(); g.arc(0, r * .02, r * .72, Math.PI, TAU); g.closePath(); g.fill(); g.stroke();
  fillRound(g, -r * .5, -r * .24, r * 1.0, r * .2, r * .06, '#2f3d4c');
  strokeRound(g, -r * .5, -r * .24, r * 1.0, r * .2, r * .06, C.ink, 2.5);
  // 面罩里的猫眼
  const look = enemyLook(e);
  drawBeastEye(g, -r * .22, -r * .16, r * .12, r * .09, look, .05, stomp ? 'angry' : 'normal');
  drawBeastEye(g, r * .22, -r * .16, r * .12, r * .09, look, .05, stomp ? 'angry' : 'normal');
  // 猫胡须从面罩探出
  g.strokeStyle = C.ink; g.lineWidth = 1.6;
  for (const side of [-1, 1]) for (let i = 0; i < 2; i++) {
    g.beginPath(); g.moveTo(side * r * .28, r * .0 + i * r * .08); g.lineTo(side * r * .64, r * .06 + i * r * .12); g.stroke();
  }
  // 小铁手
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .92, r * .28); g.rotate(side * (stomp ? .6 : .15));
    fillRound(g, -r * .16, -r * .2, r * .32, r * .44, r * .1, '#697b92');

  // 猫耳天线
  drawCatEar(g, -r * .4, -r * .72, r * .28, -.4, '#697b92', '#ffc1d6');
  drawCatEar(g, r * .4, -r * .72, r * .28, .4, '#697b92', '#ffc1d6');
  if (stomp) {
    g.globalAlpha = .45;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU;
      circle(g, Math.cos(a) * r * 1.15, r * .9 + Math.sin(a) * r * .16, r * .12, withAlpha(C.paper, .6), null, 0);
    }
  }
  g.restore();
}

/* 9. 电钻蛛：四条金属蜘蛛腿 + 巨大锥形钻头，转速决定威胁。 */
function drawDrillspider(g, e, t) {
  const r = e.r;
  const look = enemyLook(e);
  const spin = e.action === 'rev' ? 1 : (e.action === 'drill' ? 3 : .4);
  g.save(); g.scale(look, 1);
  const legPhase = Math.sin(t * 10 + e.phase) * .2;
  // 四条腿
  g.strokeStyle = C.ink; g.lineWidth = 5; g.lineCap = 'round';
  for (const side of [-1, 1]) {
    for (let i = 0; i < 2; i++) {
      const bx = side * r * .2 + (i - .5) * r * .25;
      const kneeX = side * (r * .95 + i * r * .2);
      const kneeY = -r * .15 - i * r * .25 + legPhase * side;
      g.beginPath();
      g.moveTo(bx, r * .3);
      g.lineTo(kneeX, kneeY);
      g.lineTo(kneeX + side * r * .18, kneeY + r * .55);
      g.stroke();
    }
  }
  // 金属腹部
  ellipse(g, -r * .35, 0, r * .72, r * .52, e.color, C.ink, 4);
  for (let i = 0; i < 3; i++) circle(g, -r * .5 + i * r * .18, -r * .05, r * .07, '#4d6b7a', null, 0);
  // 钻头
  g.save(); g.translate(r * .55, 0); g.rotate(t * spin * 4);
  g.fillStyle = '#d7e8f2'; g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath();
  g.moveTo(-r * .2, -r * .32);
  g.lineTo(r * .85, 0);
  g.lineTo(-r * .2, r * .32);
  g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = '#7ddcf0'; g.lineWidth = 2.5;
  for (let i = 1; i <= 3; i++) {
    const x = -r * .12 + i * r * .2;
    g.beginPath(); g.moveTo(x, -r * .25 + i * r * .02); g.lineTo(x, r * .25 - i * r * .02); g.stroke();
  }
  if (spin > 1) { g.globalAlpha = .4; circle(g, r * .85, 0, r * .3, '#7ddcf0', null, 0); }
  g.restore();
  // 眼睛
  drawBeastEye(g, -r * .45, -r * .22, r * .16, r * .14, look, .1, spin > 1 ? 'angry' : 'normal');
  drawBeastEye(g, -r * .18, -r * .32, r * .12, r * .12, look, .1, spin > 1 ? 'angry' : 'normal');
  // 小触角
  g.strokeStyle = C.ink; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-r * .6, -r * .42); g.quadraticCurveTo(-r * .8, -r * .8, -r * .55, -r * .9); g.stroke();
  g.restore();
}

/* 10. Boss 机械猫王：高瘦机甲 + 驾驶舱猫头 + 双钳 + 天线，剪影是一座塔。 */
function drawMechking(g, e, t) {
  const r = e.r;
  const enraged = e.enraged;
  const angry = ['windMissiles', 'windBarrage', 'charge'].includes(e.action);
  const look = enemyLook(e);
  g.save();
  if (enraged) {
    g.save(); g.globalAlpha = .3 + Math.sin(t * 8) * .1;
    const aura = g.createRadialGradient(0, 0, r * .4, 0, 0, r * 1.9);
    aura.addColorStop(0, 'rgba(180,80,255,.45)'); aura.addColorStop(1, 'rgba(120,220,255,0)');
    g.fillStyle = aura; g.beginPath(); g.arc(0, 0, r * 1.9, 0, TAU); g.fill(); g.restore();
  }
  // 双腿
  fillRound(g, -r * .62, r * .55, r * .36, r * .62, r * .1, '#5a738b');

  fillRound(g, r * .26, r * .55, r * .36, r * .62, r * .1, '#5a738b');
  strokeRound(g, r * .26, r * .55, r * .36, r * .62, r * .1, C.ink, 4);
  ellipse(g, -r * .44, r * 1.15, r * .3, r * .12, '#3c4d5c', C.ink, 3);
  ellipse(g, r * .44, r * 1.15, r * .3, r * .12, '#3c4d5c', C.ink, 3);
  // 机械躯干（高矩形）
  fillRound(g, -r * .72, -r * .5, r * 1.44, r * 1.2, r * .12, e.color);
  strokeRound(g, -r * .72, -r * .5, r * 1.44, r * 1.2, r * .12, C.ink, 5);
  // 胸甲猫徽
  g.fillStyle = '#4b6377';
  fillRound(g, -r * .45, r * .12, r * .9, r * .45, r * .08, '#4b6377');
  strokeRound(g, -r * .45, r * .12, r * .9, r * .45, r * .08, C.ink, 3);
  drawPaw(g, -r * .18, r * .34, r * .17, C.gold, .9);
  g.strokeStyle = C.gold; g.lineWidth = 2;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-r * .45, r * .22 + i * r * .09); g.lineTo(r * .45, r * .22 + i * r * .09); g.stroke(); }
  // 双钳
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .92, r * .08); g.rotate(side * (angry ? -.5 : -.1));
    g.strokeStyle = C.ink; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(side * r * .38, -r * .18); g.stroke();
    g.fillStyle = '#a8c2d8';
    g.beginPath();
    g.moveTo(side * r * .38, -r * .3);
    g.lineTo(side * r * .82, -r * .1);
    g.lineTo(side * r * .45, r * .1);
    g.closePath(); g.fill();
    g.strokeStyle = C.ink; g.lineWidth = 3; g.stroke();
    g.restore();
  }
  // 驾驶舱猫头
  circle(g, 0, -r * .95, r * .48, '#a8c2d8', C.ink, 4);
  drawCatEar(g, -r * .5, -r * 1.2, r * .4, -.55, '#a8c2d8', C.lavender);
  drawCatEar(g, r * .5, -r * 1.2, r * .4, .55, '#a8c2d8', C.lavender);
  drawBeastEye(g, -r * .18, -r * .98, r * .12, r * .16, look, .12, angry ? 'angry' : 'normal');
  drawBeastEye(g, r * .18, -r * .98, r * .12, r * .16, look, .12, angry ? 'angry' : 'normal');
  g.strokeStyle = C.ink; g.lineWidth = 2;
  g.beginPath(); g.arc(0, -r * .78, r * .1, .1, Math.PI - .1); g.stroke();
  // 天线
  g.strokeStyle = C.ink; g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, -r * 1.3); g.lineTo(0, -r * 1.62); g.stroke();
  circle(g, 0, -r * 1.66, r * .09, enraged ? C.coral : C.gold, C.ink, 2);
  // 肩炮
  for (const side of [-1, 1]) {
    fillRound(g, side * r * .72 - r * .12, -r * .56, r * .24, r * .5, r * .08, '#6f8cab');
    strokeRound(g, side * r * .72 - r * .12, -r * .56, r * .24, r * .5, r * .08, C.ink, 3);
  }
  g.restore();
}

/* 11. 眼球团：一颗长着猫耳和睫毛触手的大眼球，绕圈发射视线。 */
function drawEyeball(g, e, t) {
  const r = e.r;
  const look = enemyLook(e);
  const wind = e.action === 'wind';
  g.save();
  g.translate(0, Math.sin(t * 2.2 + e.phase) * r * .08);
  // 睫毛触手
  g.strokeStyle = C.ink; g.lineWidth = 4; g.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const a = -.9 + i * .36;
    const wob = Math.sin(t * 3 + i) * r * .12;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .8, Math.sin(a) * r * .8);
    g.quadraticCurveTo(Math.cos(a) * r * 1.15 + wob, Math.sin(a) * r * 1.15, Math.cos(a) * r * 1.3 - wob, Math.sin(a) * r * 1.32);
    g.stroke();
    g.strokeStyle = e.color; g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .8, Math.sin(a) * r * .8);
    g.quadraticCurveTo(Math.cos(a) * r * 1.15 + wob, Math.sin(a) * r * 1.15, Math.cos(a) * r * 1.3 - wob, Math.sin(a) * r * 1.32);
    g.stroke();
    g.strokeStyle = C.ink; g.lineWidth = 4;
  }
  // 眼白球
  circle(g, 0, 0, r * .9, '#fff6fb', C.ink, 4.5);
  // 虹膜
  circle(g, look * r * .1, r * .02, r * .5, e.color, C.ink, 3);
  circle(g, look * r * .1, r * .02, r * .24, '#3a1d5c', null, 0);
  g.fillStyle = C.white;
  circle(g, look * r * .1 - r * .1, r * .02 - r * .12, r * .08, C.white, null, 0);
  // 猫耳
  drawCatEar(g, -r * .55, -r * .78, r * .42, -.5, e.color, '#f2d7ff');
  drawCatEar(g, r * .55, -r * .78, r * .42, .5, e.color, '#f2d7ff');
  // 小尖牙
  g.fillStyle = C.cream; g.strokeStyle = C.ink; g.lineWidth = 2;
  for (const side of [-1, 1]) {
    g.beginPath(); g.moveTo(side * r * .1, r * .7); g.lineTo(side * r * .16, r * .86); g.lineTo(side * r * .22, r * .7); g.closePath(); g.fill(); g.stroke();
  }
  if (wind) {
    g.globalAlpha = .4 + Math.sin(t * 10) * .2;
    circle(g, look * r * .1, r * .02, r * .66, null, e.color, 6);
  }
  g.restore();
}

/* 12. 触手猫：猫头 + 四条波浪触手，横扫一个扇形。 */
function drawTentaclecat(g, e, t) {
  const r = e.r;
  const look = enemyLook(e);
  const whip = e.action === 'whip';
  g.save();
  // 触手
  g.strokeStyle = C.ink; g.lineWidth = 5; g.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const side = i < 2 ? -1 : 1;
    const idx = i % 2;
    const rootX = side * (r * .35 + idx * r * .28);
    const sway = Math.sin(t * 4 + i * 1.3 + e.phase) * r * .15;
    const reach = whip ? 1.25 : 1;
    g.beginPath();
    g.moveTo(rootX, r * .35);
    g.quadraticCurveTo(rootX + side * r * .5 * reach + sway, r * .95, rootX + side * r * .25 * reach, r * 1.45 * reach);
    g.stroke();
    g.strokeStyle = e.color; g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(rootX, r * .35);
    g.quadraticCurveTo(rootX + side * r * .5 * reach + sway, r * .95, rootX + side * r * .25 * reach, r * 1.45 * reach);
    g.stroke();
    g.strokeStyle = C.ink; g.lineWidth = 5;
  }
  // 猫头身体
  circle(g, 0, -r * .18, r * .88, e.color, C.ink, 4.5);
  ellipse(g, 0, r * .12, r * .55, r * .3, '#e9d3ff', null, 0);
  drawCatEar(g, -r * .62, -r * .78, r * .5, -.5, e.color, '#f3ddff');
  drawCatEar(g, r * .62, -r * .78, r * .5, .5, e.color, '#f3ddff');
  // 三只眼（诡异感）
  drawBeastEye(g, -r * .32, -r * .32, r * .16, r * .2, look, .12, 'normal');
  drawBeastEye(g, r * .32, -r * .32, r * .16, r * .2, look, .12, 'normal');
  drawBeastEye(g, 0, -r * .62, r * .1, r * .12, look, .1, 'normal');
  // 竖嘴
  g.strokeStyle = C.ink; g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, -r * .02); g.lineTo(0, r * .32); g.stroke();
  g.fillStyle = '#ff566e'; ellipse(g, 0, r * .02, r * .11, r * .06, '#ff566e', null, 0);
  if (whip) {
    g.globalAlpha = .35;
    g.strokeStyle = C.lavender; g.lineWidth = 4;
    g.beginPath(); g.arc(0, r * .1, r * 1.35, .2, Math.PI - .2); g.stroke();
  }
  g.restore();
}

/* 13. 缺口猫：身体被一张竖直大嘴劈开，跳扑时嘴张到最大。 */
function drawMouthcat(g, e, t) {
  const r = e.r;
  const look = enemyLook(e);
  const open = e.action === 'crouch' ? .9 : (e.action === 'leap' ? 1 : .55);
  const bob = Math.sin(t * 5 + e.phase) * r * .04;
  g.save(); g.translate(0, bob);
  // 身体轮廓（左右两瓣）
  const gap = r * .24 * open;
  g.fillStyle = e.color; g.strokeStyle = C.ink; g.lineWidth = 4.5;
  g.beginPath();
  g.moveTo(-r * .92, r * .8);
  g.quadraticCurveTo(-r * 1.05, -.2 * r, -r * .55, -r * .88);
  g.lineTo(-gap, -r * .55);
  g.lineTo(-gap, r * .82);
  g.closePath(); g.fill(); g.stroke();
  g.beginPath();
  g.moveTo(r * .92, r * .8);
  g.quadraticCurveTo(r * 1.05, -.2 * r, r * .55, -r * .88);
  g.lineTo(gap, -r * .55);
  g.lineTo(gap, r * .82);
  g.closePath(); g.fill(); g.stroke();
  // 嘴内部
  g.fillStyle = '#4a1f3e';
  g.fillRect(-gap, -r * .55, gap * 2, r * 1.4);
  g.strokeStyle = C.ink; g.lineWidth = 3;
  g.strokeRect(-gap, -r * .55, gap * 2, r * 1.4);
  // 牙齿
  g.fillStyle = C.cream;
  const teeth = 5;
  for (let i = 0; i < teeth; i++) {
    const y = -r * .5 + i * (r * 1.3 / teeth);
    g.beginPath(); g.moveTo(-gap, y); g.lineTo(-gap + r * .1, y + r * .06); g.lineTo(-gap, y + r * .12); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(gap, y); g.lineTo(gap - r * .1, y + r * .06); g.lineTo(gap, y + r * .12); g.closePath(); g.fill();
  }
  // 猫耳
  drawCatEar(g, -r * .62, -r * .82, r * .46, -.5, e.color, '#e6c9ff');
  drawCatEar(g, r * .62, -r * .82, r * .46, .5, e.color, '#e6c9ff');
  // 眼睛在嘴两侧
  drawBeastEye(g, -r * .55, -r * .35, r * .15, r * .19, look, .12, 'angry');
  drawBeastEye(g, r * .55, -r * .35, r * .15, r * .19, look, .12, 'angry');
  // 小短腿
  ellipse(g, -r * .5, r * .95, r * .2, r * .12, e.color, C.ink, 3);
  ellipse(g, r * .5, r * .95, r * .2, r * .12, e.color, C.ink, 3);
  g.restore();
}

/* 14. 荧光孢子：蘑菇伞盖 + 发光孢子 + 垂落菌丝，漂浮环绕。 */
function drawSpore(g, e, t) {
  const r = e.r;
  const wind = e.action === 'wind';
  g.save();
  g.translate(0, Math.sin(t * 2.6 + e.phase) * r * .12);
  // 垂落菌丝
  g.strokeStyle = C.ink; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const x = (i - 2) * r * .28;
    const wob = Math.sin(t * 3 + i * 1.5) * r * .08;
    g.beginPath(); g.moveTo(x, r * .35); g.quadraticCurveTo(x + wob, r * .7, x - wob * 1.6, r * 1.05); g.stroke();
    g.strokeStyle = '#86f7cf'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, r * .35); g.quadraticCurveTo(x + wob, r * .7, x - wob * 1.6, r * 1.05); g.stroke();
    g.strokeStyle = C.ink; g.lineWidth = 3;
  }
  // 小脸/菌柄
  fillRound(g, -r * .34, -r * .08, r * .68, r * .62, r * .2, '#dcffe9');
  strokeRound(g, -r * .34, -r * .08, r * .68, r * .62, r * .2, C.ink, 3);
  drawBeastEye(g, -r * .15, r * .18, r * .1, r * .12, enemyLook(e), .1, wind ? 'angry' : 'normal');
  drawBeastEye(g, r * .15, r * .18, r * .1, r * .12, enemyLook(e), .1, wind ? 'angry' : 'normal');
  // 伞盖
  g.fillStyle = e.color; g.strokeStyle = C.ink; g.lineWidth = 4.5;
  g.beginPath();
  g.moveTo(-r * .95, r * .02);
  g.quadraticCurveTo(-r * .8, -r * .9, 0, -r * .98);
  g.quadraticCurveTo(r * .8, -r * .9, r * .95, r * .02);
  g.quadraticCurveTo(r * .5, r * .2, r * .2, r * .1);
  g.quadraticCurveTo(0, r * .22, -r * .2, r * .1);
  g.quadraticCurveTo(-r * .5, r * .2, -r * .95, r * .02);
  g.closePath(); g.fill(); g.stroke();
  // 斑点
  for (let i = 0; i < 4; i++) {
    const a = -.8 + i * .5;
    circle(g, Math.cos(a) * r * .55, -r * .55 + Math.sin(a) * r * .2, r * .1, '#ffffff', C.ink, 1.5);
  }
  // 发光孢子
  g.save(); g.globalAlpha = .55 + Math.sin(t * 4) * .2;
  for (let i = 0; i < 4; i++) {
    const a = t * 1.4 + i * TAU / 4;
    circle(g, Math.cos(a) * r * 1.1, -r * .6 + Math.sin(a) * r * .35, r * .055, '#b6ff8a', null, 0);
  }
  g.restore();
  g.restore();
}

/* 15. Boss 万眼猫神：中央巨眼 + 眼球触手 + 底部触须，完全不同于机械猫王。 */
function drawEyebeast(g, e, t) {
  const r = e.r;
  const enraged = e.enraged;
  const look = enemyLook(e);
  g.save();
  if (enraged) {
    g.save(); g.globalAlpha = .3 + Math.sin(t * 6) * .12;
    const aura = g.createRadialGradient(0, 0, r * .5, 0, 0, r * 2);
    aura.addColorStop(0, 'rgba(195,123,255,.5)'); aura.addColorStop(1, 'rgba(80,20,140,0)');
    g.fillStyle = aura; g.beginPath(); g.arc(0, 0, r * 2, 0, TAU); g.fill(); g.restore();
  }
  // 底部触须
  g.strokeStyle = C.ink; g.lineWidth = 6; g.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const a = .35 + i * (TAU - .7) / 6;
    const wob = Math.sin(t * 2.4 + i) * r * .15;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .5, r * .55);
    g.quadraticCurveTo(Math.cos(a) * r * 1.05 + wob, r * .95, Math.cos(a) * r * 1.15 - wob, r * 1.38);
    g.stroke();
    g.strokeStyle = e.color; g.lineWidth = 2.5;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .5, r * .55);
    g.quadraticCurveTo(Math.cos(a) * r * 1.05 + wob, r * .95, Math.cos(a) * r * 1.15 - wob, r * 1.38);
    g.stroke();
    g.strokeStyle = C.ink; g.lineWidth = 6;
  }
  // 眼球触手
  for (let i = 0; i < 5; i++) {
    const a = -2.5 + i * .55;
    const len = r * (1.05 + (i % 2) * .25);
    const ex = Math.cos(a) * len, ey = Math.sin(a) * len - r * .2;
    g.strokeStyle = C.ink; g.lineWidth = 5;
    g.beginPath(); g.moveTo(Math.cos(a) * r * .5, Math.sin(a) * r * .5 - r * .2); g.quadraticCurveTo(ex * .8, ey * .8, ex, ey); g.stroke();
    circle(g, ex, ey, r * .14, '#fff6fb', C.ink, 3);
    circle(g, ex + look * r * .04, ey, r * .08, '#3a1d5c', null, 0);
    g.fillStyle = C.white; circle(g, ex + look * r * .01, ey - r * .03, r * .025, C.white, null, 0);
  }
  // 主身体
  g.fillStyle = e.color; g.strokeStyle = C.ink; g.lineWidth = 6;
  g.beginPath();
  g.moveTo(-r * .8, r * .55);
  g.quadraticCurveTo(-r * 1.1, -r * .6, -r * .35, -r * 1.05);
  g.quadraticCurveTo(0, -r * 1.22, r * .35, -r * 1.05);
  g.quadraticCurveTo(r * 1.1, -r * .6, r * .8, r * .55);
  g.quadraticCurveTo(0, r * .95, -r * .8, r * .55);
  g.closePath(); g.fill(); g.stroke();
  // 中央巨眼
  ellipse(g, 0, -r * .12, r * .5, r * .58, '#fff6fb', C.ink, 4);
  circle(g, look * r * .08, -r * .12, r * .3, e.color, C.ink, 3);
  circle(g, look * r * .1, -r * .12, r * .14, '#1c0b30', null, 0);
  g.fillStyle = C.white; circle(g, look * r * .04, -r * .2, r * .06, C.white, null, 0);
  // 眼睑睫毛
  g.strokeStyle = C.ink; g.lineWidth = 3;
  for (let i = 0; i < 6; i++) {
    const a = Math.PI + i * Math.PI / 5;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .48, -r * .12 + Math.sin(a) * r * .56);
    g.lineTo(Math.cos(a) * r * .62, -r * .12 + Math.sin(a) * r * .72);
    g.stroke();
  }
  // 猫耳 + 小眼冠
  drawCatEar(g, -r * .75, -r * 1.02, r * .5, -.55, e.color, '#f3ddff');
  drawCatEar(g, r * .75, -r * 1.02, r * .5, .55, e.color, '#f3ddff');
  for (let i = 0; i < 3; i++) {
    const x = (i - 1) * r * .38;
    circle(g, x, -r * .98 + Math.abs(i - 1) * r * .08, r * .09, '#fff6fb', C.ink, 2);
    g.fillStyle = '#1c0b30'; circle(g, x + look * r * .02, -r * .98 + Math.abs(i - 1) * r * .08, r * .04, '#1c0b30', null, 0);
  }
  // 小嘴
  g.strokeStyle = '#2e103f'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-r * .16, r * .5); g.quadraticCurveTo(0, r * .62, r * .16, r * .5); g.stroke();
  g.restore();
}

/* 冲撞胡巴狗：耷拉狗耳 + 尖牙 + 项圈，生气时会像小炮弹。 */
function drawDoggo(g, e, t) {
  const r = e.r;
  const bounce = Math.sin(t * 9 + e.phase) * r * .045;
  const angry = e.action === 'wind' || e.action === 'charge';
  const stunned = e.action === 'stun';
  const look = player ? Math.sign(player.x - e.x) || 1 : 1;
  const rgb = e.color;
  const inner = '#ffcfc5';

  g.save(); g.translate(0, bounce);
  // 尾巴和小短腿
  g.strokeStyle = C.ink; g.lineWidth = r * .3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-r * .9, r * .35); g.quadraticCurveTo(-r * 1.35, r * .2 + Math.sin(t * 8) * r * .15, -r * 1.28, -r * .25); g.stroke();
  g.strokeStyle = rgb; g.lineWidth = r * .17;
  g.beginPath(); g.moveTo(-r * .9, r * .35); g.quadraticCurveTo(-r * 1.35, r * .2 + Math.sin(t * 8) * r * .15, -r * 1.28, -r * .25); g.stroke();
  for (const side of [-1, 1]) {
    const step = Math.sin(t * 11 + e.phase + (side > 0 ? Math.PI : 0)) * r * .08;
    g.save(); g.translate(side * r * .66, r * .78 + step);
    ellipse(g, 0, 0, r * .35, r * .22, '#b95f65', C.ink, 3.5);
    g.strokeStyle = C.cream; g.lineWidth = 1.5;
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * r * .13, -r * .08); g.lineTo(i * r * .1, r * .07); g.stroke(); }
    g.restore();
  }

  // 耳朵（扁扁的狗耳 / 猫耳混合）
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .82, -r * .46);
    g.rotate(side * (.32 + (angry ? .14 : 0)));
    g.fillStyle = '#c2606a'; g.strokeStyle = C.ink; g.lineWidth = 4;
    g.beginPath();
    g.moveTo(-r * .06, -r * .2);
    g.quadraticCurveTo(-side * r * .52, -r * .25, -side * r * .47, r * .32 + Math.sin(t * 5 + side) * r * .05);
    g.quadraticCurveTo(-side * r * .2, r * .42, r * .14, r * .18);
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = inner;
    g.beginPath(); g.quadraticCurveTo(-side * r * .3, -r * .03, -side * r * .22, r * .26); g.quadraticCurveTo(-side * r * .08, r * .28, r * .04, r * .1); g.closePath(); g.fill();
    g.restore();
  }

  // 圆身体
  ellipse(g, 0, -r * .04, r * 1.02, r * .98, rgb, C.ink, 4.5);
  ellipse(g, 0, r * .38, r * .64, r * .5, inner, null, 0);
  // 头顶呆毛
  g.strokeStyle = C.ink; g.lineWidth = 3.5;
  g.beginPath(); g.moveTo(-r * .08, -r * .95); g.quadraticCurveTo(r * .12, -r * 1.25, r * .3, -r * 1.06); g.stroke();
  g.strokeStyle = rgb; g.lineWidth = 1.8;
  g.beginPath(); g.moveTo(-r * .06, -r * .96); g.quadraticCurveTo(r * .12, -r * 1.2, r * .28, -r * 1.04); g.stroke();

  // 眼睛
  if (stunned) {
    drawBeastEye(g, -r * .34, -r * .28, r * .25, r * .24, 0, 0, 'stun', -.1);
    drawBeastEye(g, r * .34, -r * .28, r * .25, r * .24, 0, 0, 'stun', .1);
  } else {
    drawBeastEye(g, -r * .35, -r * .3, r * .26, angry ? r * .21 : r * .25, look, .12, angry ? 'angry' : 'normal', -.12);
    drawBeastEye(g, r * .35, -r * .3, r * .26, angry ? r * .21 : r * .25, look, .12, angry ? 'angry' : 'normal', .12);
  }

  // 口鼻与夸张大嘴
  ellipse(g, 0, r * .18, r * .53, r * .37, '#ffe1d6', C.ink, 3);
  ellipse(g, 0, r * .06, r * .2, r * .14, C.ink, null, 0);
  g.fillStyle = C.ink;
  g.beginPath();
  if (angry) {
    g.moveTo(-r * .4, r * .32); g.quadraticCurveTo(0, r * .12, r * .4, r * .32);
    g.quadraticCurveTo(r * .26, r * .6, 0, r * .44); g.quadraticCurveTo(-r * .26, r * .6, -r * .4, r * .32);
    g.fill();
    g.fillStyle = C.cream;
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * r * .17, r * .25); g.lineTo(i * r * .12 + r * .08, r * .4); g.lineTo(i * r * .12 - r * .08, r * .4); g.closePath(); g.fill(); }
  } else {
    g.strokeStyle = C.ink; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(-r * .24, r * .3); g.quadraticCurveTo(-r * .1, r * .46, 0, r * .31); g.quadraticCurveTo(r * .1, r * .46, r * .24, r * .3); g.stroke();
    g.fillStyle = C.coral;
    g.beginPath(); g.ellipse(0, r * .48, r * .12, r * .15, 0, 0, TAU); g.fill(); g.strokeStyle = C.ink; g.lineWidth = 2; g.stroke();
  }

  // 项圈和尖刺
  g.strokeStyle = C.ink; g.lineWidth = r * .14; g.lineCap = 'round';
  g.beginPath(); g.arc(0, -r * .07, r * .92, .54, 2.6); g.stroke();
  g.strokeStyle = '#6e4d5d'; g.lineWidth = r * .075;
  g.beginPath(); g.arc(0, -r * .07, r * .92, .54, 2.6); g.stroke();
  for (let i = -1; i <= 1; i++) {
    const a = 1.08 + i * .34;
    const px = Math.cos(a) * r * .9, py = Math.sin(a) * r * .9;
    g.save(); g.translate(px, py); g.rotate(a);
    g.fillStyle = C.gold; g.strokeStyle = C.ink; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(0, -r * .1); g.lineTo(r * .17, 0); g.lineTo(0, r * .1); g.closePath(); g.fill(); g.stroke();
    g.restore();
  }

  // 前爪
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .7, r * .35);
    ellipse(g, 0, 0, r * .27, r * .34, rgb, C.ink, 3.5);
    g.strokeStyle = C.ink; g.lineWidth = 1.5;
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * r * .1, r * .12); g.lineTo(i * r * .08, r * .25); g.stroke(); }
    g.restore();
  }
  g.restore();
}

/* 鱼骨外星喵：薄荷绿、三只眼、天线猫耳，专门丢鱼骨头。 */
function drawAlien(g, e, t) {
  const r = e.r;
  const float = Math.sin(t * 2.8 + e.phase) * r * .07;
  const angry = e.action === 'wind';
  const stunned = e.action === 'stun';
  const look = player ? Math.sign(player.x - e.x) || 1 : 1;

  g.save(); g.translate(0, float);
  // 触手尾巴
  g.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    const wob = Math.sin(t * 4 + e.phase + i) * r * .16;
    g.strokeStyle = C.ink; g.lineWidth = r * .23;
    g.beginPath(); g.moveTo(-r * .8, r * .25);
    g.quadraticCurveTo(-r * 1.35, r * .08 + wob, -r * 1.2, r * .7 - wob); g.stroke();
    g.strokeStyle = i === 0 ? '#4dbd99' : '#6bdcb9'; g.lineWidth = r * .12;
    g.beginPath(); g.moveTo(-r * .8, r * .25);
    g.quadraticCurveTo(-r * 1.35, r * .08 + wob, -r * 1.2, r * .7 - wob); g.stroke();
  }
  // 小脚
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .5, r * .82);
    ellipse(g, 0, 0, r * .3, r * .2, '#5fcea6', C.ink, 3.2);
    g.restore();
  }
  // 天线耳（猫耳 + 圆球触角）
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .68, -r * .72); g.rotate(side * -.22);
    g.strokeStyle = C.ink; g.lineWidth = r * .1;
    g.beginPath(); g.moveTo(0, r * .22); g.quadraticCurveTo(side * r * .16, -r * .3, side * r * .04, -r * .52); g.stroke();
    g.fillStyle = C.gold; circle(g, side * r * .04, -r * .52, r * .11, C.gold, C.ink, 2);
    g.restore();
    g.save(); g.translate(side * r * .6, -r * .45); g.rotate(side * -.35);
    g.fillStyle = '#59d3ab'; g.strokeStyle = C.ink; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(-r * .24, r * .04); g.quadraticCurveTo(-r * .08, -r * .4, r * .04, -r * .12); g.quadraticCurveTo(r * .22, -r * .38, r * .28, r * .06); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = C.pink;
    g.beginPath(); g.moveTo(-r * .09, -r * .03); g.quadraticCurveTo(0, -r * .28, r * .08, -r * .03); g.closePath(); g.fill();
    g.restore();
  }

  // 圆身体
  ellipse(g, 0, r * .02, r * .95, r * 1.0, e.color, C.ink, 4.5);
  ellipse(g, 0, r * .42, r * .52, r * .4, '#eaffcf', null, 0);
  g.save(); g.globalAlpha = .5; g.fillStyle = '#41b68f';
  circle(g, -r * .5, r * .43, r * .1, '#41b68f', null, 0); circle(g, r * .46, r * .56, r * .08, '#41b68f', null, 0);
  g.restore();

  // 三只外星眼
  if (stunned) {
    drawBeastEye(g, -r * .35, -r * .2, r * .24, r * .24, 0, 0, 'stun');
    drawBeastEye(g, r * .35, -r * .2, r * .24, r * .24, 0, 0, 'stun');
    drawBeastEye(g, 0, -r * .62, r * .16, r * .18, 0, 0, 'stun');
  } else {
    drawBeastEye(g, -r * .36, -r * .2, r * .25, r * .28, look, .16, angry ? 'angry' : 'normal', -.1);
    drawBeastEye(g, r * .36, -r * .2, r * .25, r * .28, look, .16, angry ? 'angry' : 'normal', .1);
    drawBeastEye(g, 0, -r * .61, r * .16, r * .2, look, .1, 'normal');
  }

  // 樱桃小嘴和腮红
  g.strokeStyle = C.ink; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(-r * .18, r * .22); g.quadraticCurveTo(-r * .08, r * .32, 0, r * .22); g.quadraticCurveTo(r * .08, r * .32, r * .18, r * .22); g.stroke();
  ellipse(g, -r * .58, r * .12, r * .12, r * .07, withAlpha(C.pink, .65), null, 0);
  ellipse(g, r * .58, r * .12, r * .12, r * .07, withAlpha(C.pink, .65), null, 0);

  // 拿着的鱼骨（蓄力时发光）
  g.save(); g.translate(r * .98, r * .18); g.rotate(-.3 + Math.sin(t * 3) * .06);
  g.strokeStyle = C.ink; g.lineWidth = 3.5;
  g.beginPath(); g.moveTo(-r * .2, r * .25); g.lineTo(r * .32, -r * .22); g.stroke();
  drawFish(g, r * .4, -r * .3, r * .34, '#eaffcf', C.ink, 2.2, -.75);
  if (angry) {
    g.globalAlpha = .35 + Math.sin(t * 14) * .18;
    circle(g, r * .4, -r * .3, r * .38, withAlpha(C.gold, .8), null, 0);
  }
  g.restore();
  // 小短手
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .83, r * .22);
    ellipse(g, 0, 0, r * .22, r * .31, e.color, C.ink, 3.2);
    g.restore();
  }
  g.restore();
}

/* 胖吞河马猫：紫色肉山，困困眼、河马鼻子、震地巨足。 */
function drawTank(g, e, t) {
  const r = e.r;

  g.strokeStyle = '#856eae'; g.lineWidth = r * .14;

  drawHeart(g, -r * 1.42, -r * .08, r * .1, C.pink, C.ink, 1.5);

  for (const side of [-1, 1]) {
    const lift = stomping ? (1 - clamp(e.actionT / .68, 0, 1)) * r * .16 : 0;

    g.beginPath(); g.moveTo(-r * .2, r * .1); g.quadraticCurveTo(0, -r * .3, r * .2, r * .1); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = C.pink;
    g.beginPath(); g.moveTo(-r * .1, r * .04); g.quadraticCurveTo(0, -r * .15, r * .1, r * .04); g.closePath(); g.fill();
    g.restore();
  }
  // 眼睛：困困半睁
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .42, -r * .32);

    g.beginPath(); g.arc(0, 0, r * .19, .16, Math.PI - .16); g.stroke();
    g.fillStyle = C.ink; circle(g, look * r * .06, r * .03, r * .075, C.ink, null, 0);
    g.restore();

  // 大鼻子 / 河马嘴
  ellipse(g, 0, r * .1, r * .76, r * .47, '#c9b3ef', C.ink, 3.5);
  ellipse(g, 0, r * .27, r * .48, r * .28, '#b39be2', null, 0);
  for (const side of [-1, 1]) {
    ellipse(g, side * r * .25, r * .02, r * .15, r * .1, C.ink, null, 0);
    ellipse(g, side * r * .25 - r * .03, r * .0, r * .06, r * .035, withAlpha(C.cream, .6), null, 0);
  }
  g.strokeStyle = C.ink; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(-r * .34, r * .4); g.quadraticCurveTo(0, r * .53, r * .34, r * .4); g.stroke();
  g.fillStyle = C.cream; g.strokeStyle = C.ink; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-r * .1, r * .42); g.lineTo(r * .1, r * .42); g.lineTo(r * .07, r * .55); g.lineTo(r * .02, r * .46); g.lineTo(-r * .03, r * .55); g.lineTo(-r * .07, r * .46); g.closePath(); g.fill(); g.stroke();
  // 腮红和小雀斑
  ellipse(g, -r * .87, r * .14, r * .17, r * .1, withAlpha(C.pink, .55), null, 0);

  for (let i = 0; i < 3; i++) {

    for (let i = 0; i < 5; i++) {
      const a = TAU * i / 5 + p;
      circle(g, Math.cos(a) * r * 1.3 * p, r * .9 + Math.sin(a) * r * .25 * p, r * .1, withAlpha(C.cream, .5), null, 0);
    }
  }
  g.restore();
}

/* 大福团子大王：戴王冠的金色糯米团猫，Boss 占位技能的视觉担当。 */
function drawBoss(g, e, t) {
  const r = e.r;
  const jiggle = Math.sin(t * 3.4 + e.phase) * r * .02;
  const enraged = e.enraged;
  const angry = ['windCharge', 'windBarrage', 'charge'].includes(e.action);
  const stunned = e.action === 'stun';
  const look = player ? Math.sign(player.x - e.x) || 1 : 1;

  g.save(); g.translate(0, jiggle);
  if (enraged) {
    g.save(); g.globalAlpha = .35 + Math.sin(t * 8) * .12;
    const aura = g.createRadialGradient(0, 0, r * .5, 0, 0, r * 1.7);
    aura.addColorStop(0, withAlpha(C.coral, .5)); aura.addColorStop(1, 'rgba(255,60,90,0)');
    g.fillStyle = aura; g.beginPath(); g.arc(0, 0, r * 1.7, 0, TAU); g.fill();
    g.restore();
  }
  // 披风
  g.fillStyle = '#7d4b74'; g.strokeStyle = C.ink; g.lineWidth = 5;
  g.beginPath();
  g.moveTo(-r * .86, -r * .28); g.quadraticCurveTo(-r * 1.35, r * .5, -r * 1.1, r * .92);
  g.lineTo(-r * .65, r * .68); g.lineTo(0, r * 1.02); g.lineTo(r * .65, r * .68);
  g.lineTo(r * 1.1, r * .92); g.quadraticCurveTo(r * 1.35, r * .5, r * .86, -r * .28);
  g.closePath(); g.fill(); g.stroke();
  // 大脚
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .5, r * .85);
    ellipse(g, 0, 0, r * .38, r * .25, '#d9a534', C.ink, 4.5);
    g.strokeStyle = C.ink; g.lineWidth = 2;
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * r * .12, -r * .05); g.lineTo(i * r * .09, r * .1); g.stroke(); }
    g.restore();
  }
  // 猫耳
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .62, -r * .94); g.rotate(side * -.22);
    g.fillStyle = '#e7a530'; g.strokeStyle = C.ink; g.lineWidth = 5;
    g.beginPath(); g.moveTo(-r * .27, r * .16); g.quadraticCurveTo(-r * .12, -r * .4, 0, -r * .47); g.quadraticCurveTo(r * .12, -r * .4, r * .27, r * .16); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = C.pink;
    g.beginPath(); g.moveTo(-r * .14, r * .08); g.quadraticCurveTo(0, -r * .24, r * .14, r * .08); g.closePath(); g.fill();
    g.restore();
  }
  // 糯米团身体
  ellipse(g, 0, 0, r * 1.07, r * 1.05, e.color, C.ink, 6);
  ellipse(g, 0, r * .42, r * .69, r * .53, '#fff1bf', null, 0);
  // 王冠
  g.save(); g.translate(0, -r * 1.03); g.rotate(-.05);
  g.fillStyle = C.gold; g.strokeStyle = C.ink; g.lineWidth = 5;
  g.beginPath();
  g.moveTo(-r * .48, r * .1); g.lineTo(-r * .55, -r * .35); g.lineTo(-r * .18, -r * .12);
  g.lineTo(0, -r * .42); g.lineTo(r * .18, -r * .12); g.lineTo(r * .55, -r * .35);
  g.lineTo(r * .48, r * .1); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = C.coral; circle(g, 0, -r * .06, r * .07, C.coral, C.ink, 2);
  g.fillStyle = C.mint; circle(g, -r * .28, -r * .04, r * .05, C.mint, C.ink, 2); circle(g, r * .28, -r * .04, r * .05, C.mint, C.ink, 2);
  g.restore();
  // 眼睛
  if (stunned) {
    drawBeastEye(g, -r * .36, -r * .26, r * .24, r * .27, 0, 0, 'stun');
    drawBeastEye(g, r * .36, -r * .26, r * .24, r * .27, 0, 0, 'stun');
  } else {
    drawBeastEye(g, -r * .36, -r * .26, r * .25, r * .3, look, .15, angry ? 'angry' : 'normal', -.1);
    drawBeastEye(g, r * .36, -r * .26, r * .25, r * .3, look, .15, angry ? 'angry' : 'normal', .1);
    if (enraged) drawBeastEye(g, 0, -r * .68, r * .13, r * .16, look, .1, 'angry');
  }
  // 眉毛 / 怒纹
  if (angry) {
    g.strokeStyle = C.coral; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-r * .68, -r * .58); g.lineTo(-r * .28, -r * .47); g.stroke();
    g.beginPath(); g.moveTo(r * .68, -r * .58); g.lineTo(r * .28, -r * .47); g.stroke();
  }
  // 血盆大口
  g.fillStyle = '#6c3148'; g.strokeStyle = C.ink; g.lineWidth = 4;
  g.beginPath();
  g.moveTo(-r * .4, r * .31);
  g.quadraticCurveTo(0, r * .06, r * .4, r * .31);
  g.quadraticCurveTo(r * .26, r * .72, 0, r * .6);
  g.quadraticCurveTo(-r * .26, r * .72, -r * .4, r * .31);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = C.cream;
  for (let i = -2; i <= 2; i++) {
    g.beginPath(); g.moveTo(i * r * .15 - r * .07, r * .3); g.lineTo(i * r * .15, r * .42); g.lineTo(i * r * .15 + r * .07, r * .3); g.closePath(); g.fill();
  }
  g.fillStyle = C.coral;
  g.beginPath(); g.ellipse(0, r * .53, r * .19, r * .09, 0, 0, TAU); g.fill();
  // 胡须
  g.strokeStyle = C.ink; g.lineWidth = 2.5;
  for (const side of [-1, 1]) {
    for (let i = 0; i < 2; i++) {
      g.beginPath(); g.moveTo(side * r * .58, r * .08 + i * r * .12); g.lineTo(side * r * .95, r * .02 + i * r * .17); g.stroke();
    }
  }
  // 胸口猫爪徽章
  g.save(); g.translate(0, r * .4); g.rotate(0);
  drawPaw(g, 0, 0, r * .24, withAlpha(C.goldDeep, .7));
  g.restore();
  // 小手与王赐鱼骨权杖
  for (const side of [-1, 1]) {
    g.save(); g.translate(side * r * .93, r * .16);
    ellipse(g, 0, 0, r * .22, r * .3, e.color, C.ink, 3.5);
    g.restore();
  }
  g.save(); g.translate(r * 1.1, -r * .04); g.rotate(.32);
  g.strokeStyle = C.ink; g.lineWidth = r * .08;
  g.beginPath(); g.moveTo(-r * .2, r * .48); g.lineTo(r * .12, -r * .38); g.stroke();
  g.strokeStyle = C.gold; g.lineWidth = r * .035;
  g.beginPath(); g.moveTo(-r * .2, r * .48); g.lineTo(r * .12, -r * .38); g.stroke();
  drawFish(g, 0, -r * .54, r * .26, C.gold, C.ink, 3, -.7);
  g.restore();
  // 发怒时的火焰小星
  if (enraged) {
    for (let i = 0; i < 5; i++) {
      const a = t * 1.2 + i * TAU / 5;
      const rr = r * 1.22 + Math.sin(t * 4 + i) * 6;
      drawStar(g, Math.cos(a) * rr, Math.sin(a) * rr * .64 - r * .2, 5, 2, 5, C.coral, null, 0, a);
    }
  }
  g.restore();
}

function drawEnemyHealthBar(g, e) {
  if (e.boss || e.dead || e.spawnTimer > 0) return;
  const show = e.hp < e.maxHp || (player && dist(player, e) < 340);
  if (!show) return;
  const w = Math.max(38, e.r * 1.8);
  const x = e.x - w / 2;
  const y = e.y - e.r - 20 - (e.ai === 'heavy' ? 5 : 0);
  fillRound(g, x - 3, y - 3, w + 6, 11, 5, withAlpha(C.ink, .55));
  fillRound(g, x, y, w, 5, 2.5, '#5a445f');
  const ratio = clamp(e.hp / e.maxHp, 0, 1);
  fillRound(g, x, y, w * ratio, 5, 2.5, ratio > .5 ? C.mint : (ratio > .25 ? C.gold : C.coral));
  if (e.hitFlash > 0) {
    g.globalAlpha = clamp(e.hitFlash / .13, 0, 1) * .35;
    fillRound(g, x, y, w, 5, 2.5, C.white);
    g.globalAlpha = 1;
  }
}

/* 敌人总入口：生成传送、受击闪白、死亡消散、晕眩星、血条。 */
function drawEnemy(g, e, t, opts = {}) {
  if (!e) return;
  if (!opts.hideUI && e.dead && e.deathTimer <= 0) return;
  const spawnP = e.spawnTimer > 0 ? clamp(1 - e.spawnTimer / (e.spawnDelay || .8), 0, 1) : 1;
  if (e.spawnTimer > 0) {
    g.save();
    const pulse = .5 + Math.sin(t * 10 + e.phase) * .25;
    g.globalAlpha = .32 + pulse * .25;
    const grad = g.createRadialGradient(e.x, e.y, 2, e.x, e.y, e.r * 1.5);
    grad.addColorStop(0, withAlpha(C.cream, .6));
    grad.addColorStop(.5, withAlpha(e.boss ? C.coral : C.mint, .35));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(e.x, e.y, e.r * 1.5, 0, TAU); g.fill();
    g.strokeStyle = withAlpha(C.ink, .7); g.lineWidth = 4;
    g.beginPath(); g.arc(e.x, e.y, e.r * (.5 + spawnP * .8), 0, TAU); g.stroke();
    for (let i = 0; i < 6; i++) {
      const a = t * 3 + i * TAU / 6;
      drawStar(g, e.x + Math.cos(a) * e.r * (1 + spawnP * .3), e.y + Math.sin(a) * e.r * .7, 4, 1.8, 5, C.cream, null, 0);
    }
    g.restore();
  }

  let alpha = 1;
  if (opts.hideUI) alpha = 1;
  else if (e.dead) alpha = clamp(e.deathTimer / .36, 0, 1);
  else if (e.spawnTimer > 0) alpha = .18 + spawnP * .82;
  g.save();
  g.globalAlpha = alpha;
  g.translate(e.x, e.y);
  if (!opts.hideUI && e.dead) {
    const p = 1 - clamp(e.deathTimer / .36, 0, 1);
    g.rotate(p * .6); g.scale(1 + p * .15, 1 - p * .55);
  } else if (e.spawnTimer > 0) {
    const s = .55 + spawnP * .45;
    g.scale(s, 1 / s);
  }

  // 地面影子（画在局部坐标）
  if (!e.dead) {
    g.save(); g.globalAlpha *= .26; g.fillStyle = C.ink;
    g.beginPath(); g.ellipse(0, e.r * .94, e.r * ((e.ai === 'heavy' || e.boss) ? 1.25 : .92), e.r * .38, 0, 0, TAU); g.fill();
    g.restore();
  }

  // §9：按敌人定义的 art key 调用各自的独立绘制函数。
  const artFn = ENEMY_ART[e.def && e.def.art];
  if (artFn) artFn(g, e, t);
  else {
    circle(g, 0, 0, e.r, e.color, C.ink, 4);
    drawBeastEye(g, -e.r * .35, -e.r * .2, e.r * .25, e.r * .25, 0, 0);
    drawBeastEye(g, e.r * .35, -e.r * .2, e.r * .25, e.r * .25, 0, 0);
  }

  // 受击白闪（叠在身体上）
  if (e.hitFlash > 0 && !e.dead) {
    g.globalAlpha *= clamp(e.hitFlash / .13, 0, 1) * .55;
    ellipse(g, 0, -e.r * .02, e.r * .94, e.r * .9, withAlpha(C.white, .9), null, 0);
    g.globalAlpha = alpha;
  }
  // 眩晕小星
  if (!e.dead && e.action === 'stun') {
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * TAU / 3;
      drawStar(g, Math.cos(a) * e.r * .7, -e.r * 1.25 + Math.sin(a) * e.r * .22, 5, 2, 5, C.gold, C.ink, 1.5, a);
    }
  }
  g.restore();

  if (!opts.hideUI) drawEnemyHealthBar(g, e);
}

/* ------------------------------------------------------------------
   06D. 世界合层 / 冲击波 / 屏幕反馈 / 准星
   ------------------------------------------------------------------ */
function drawShockwaves(g) {
  for (const sw of shockwaves) {
    const a = clamp(1 - sw.life / sw.max, 0, 1);
    const col = sw.friendly ? C.salmon : C.coral;
    g.save();
    g.globalAlpha = a * .18;
    g.fillStyle = col;
    g.beginPath(); g.arc(sw.x, sw.y, sw.radius, 0, TAU); g.fill();
    g.globalAlpha = a * .9;
    g.strokeStyle = withAlpha(C.ink, .6); g.lineWidth = 8;
    g.beginPath(); g.arc(sw.x, sw.y, sw.radius, 0, TAU); g.stroke();
    g.strokeStyle = col; g.lineWidth = 4.5;
    g.beginPath(); g.arc(sw.x, sw.y, sw.radius, 0, TAU); g.stroke();
    g.globalAlpha = a * .35;
    g.strokeStyle = C.cream; g.lineWidth = 2;
    g.beginPath(); g.arc(sw.x, sw.y, sw.radius * .82, 0, TAU); g.stroke();
    g.restore();
  }
}

function drawScene(g, t) {
  g.save();
  g.clearRect(0, 0, W, H);
  const s = Math.max(0, shake);
  const sx = s ? (Math.random() * 2 - 1) * s : 0;
  const sy = s ? (Math.random() * 2 - 1) * s * .7 : 0;
  g.translate(sx, sy);

  if (room && room.background) g.drawImage(room.background, 0, 0);
  else {
    g.fillStyle = (room && room.theme ? room.theme.bg : C.bgDeep); g.fillRect(0, 0, W, H);
  }

  if (room) drawDoor(g, t);

  // 预警画在地面/角色下方，不挡猫猫的脸。
  for (const e of enemies) drawEnemyTelegraph(g, e, t);
  drawShockwaves(g);
  for (const pk of pickups) drawPickup(g, pk, t);

  // 按脚底 y 排序，营造俯视角的前后遮挡。
  const drawables = [];
  if (room) for (const o of room.obstacles) drawables.push({ y: o.y + o.r * .72, kind: 'obstacle', obj: o });
  for (const e of enemies) {
    if (e.dead && e.deathTimer <= 0) continue;
    drawables.push({ y: e.y + e.r * .86, kind: 'enemy', obj: e });
  }
  for (const c of clones) {
    if (!c.dead && player) drawables.push({ y: c.y + player.r * .58, kind: 'clone', obj: c });
  }
  if (player) drawables.push({ y: player.y + player.r * .82, kind: 'player', obj: player });
  drawables.sort((a, b) => a.y - b.y);

  for (const d of drawables) {
    if (d.kind === 'obstacle') drawObstacle(g, d.obj);
    else if (d.kind === 'enemy') drawEnemy(g, d.obj, t);
    else if (d.kind === 'clone') drawClone(g, d.obj);
    else if (d.kind === 'player') drawPlayerSprite(g, d.obj, t, { alwaysVisible: true });
  }

  if (player && !player.dead) drawSlash(g, player, t);
  if (player && !player.dead) for (const c of clones) if (!c.dead && c.attackAnim > 0) {
    // 分身的挥爪是小小奶油弧
    g.save(); g.globalAlpha = c.attackAnim / .2 * .45;
    g.strokeStyle = C.cream; g.lineWidth = 4;
    g.beginPath(); g.arc(c.x, c.y, (player.r || 20) * .9, c.aim - .7, c.aim + .7); g.stroke();
    g.restore();
  }

  for (const pr of projectiles) drawProjectile(g, pr);
  for (const r of rings) drawRing(g, r);
  for (const pt of particles) drawParticle(g, pt);
  drawFloaters(g);

  // 冲刺速度线
  if (player && !player.dead && player.dashTimer > 0) {
    g.save();
    g.globalAlpha = .4;
    for (let i = 0; i < 8; i++) {
      const a = player.aim + Math.PI + (i - 3.5) * .16;
      const len = 40 + (i % 3) * 18;
      g.strokeStyle = i % 2 ? C.cream : C.mint; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(player.x + Math.cos(a) * 30, player.y + Math.sin(a) * 30);
      g.lineTo(player.x + Math.cos(a) * (30 + len), player.y + Math.sin(a) * (30 + len));
      g.stroke();
    }
    g.restore();
  }

  g.restore();

  // ------- 屏幕空间反馈（不随震动移动） -------
  drawScreenFx(g, t);
}

function drawScreenFx(g, t) {
  // 常态暗角
  const v = g.createRadialGradient(W / 2, H / 2, H * .32, W / 2, H / 2, W * .72);
  v.addColorStop(0, 'rgba(20,12,30,0)');
  v.addColorStop(.72, 'rgba(20,12,30,.16)');
  v.addColorStop(1, 'rgba(12,7,18,.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);

  // 低血量红边
  if (player && !player.dead && player.hp / player.maxHp < .3 && state === 'playing') {
    const a = .22 + Math.sin(t * 6) * .1;
    const rg = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .7);
    rg.addColorStop(0, 'rgba(255,50,80,0)');
    rg.addColorStop(1, `rgba(255,50,80,${Math.max(0, a)})`);
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }

  if (hitVignette > 0) {
    const a = hitVignette * .8;
    const rg = g.createRadialGradient(W / 2, H / 2, H * .2, W / 2, H / 2, W * .68);
    rg.addColorStop(0, 'rgba(255,60,90,0)');
    rg.addColorStop(1, `rgba(255,45,75,${a})`);
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }

  if (flash > 0) {
    g.save();
    g.globalAlpha = clamp(flash / .4, 0, 1) * .8;
    g.fillStyle = flashColor;
    g.fillRect(0, 0, W, H);
    g.restore();
  }
}

function drawCrosshair(g, t) {
  if (!mouse.inside && mouse.x === W / 2 && mouse.y === H / 2) return;
  if (!player || player.dead || state !== 'playing') return;
  const ready = player.attackTimer <= 0;
  const col = ready ? C.cream : withAlpha(C.cream, .35);
  g.save();
  g.translate(mouse.x, mouse.y);
  const rot = t * .8;
  g.rotate(Math.sin(rot) * .04);
  g.strokeStyle = withAlpha(C.ink, .55); g.lineWidth = 5;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    g.beginPath(); g.arc(0, 0, 15, a + .22, a + .6); g.stroke();
    g.beginPath(); g.moveTo(Math.cos(a + .78) * 18, Math.sin(a + .78) * 18); g.lineTo(Math.cos(a + .78) * 23, Math.sin(a + .78) * 23); g.stroke();
  }
  g.strokeStyle = col; g.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    g.beginPath(); g.arc(0, 0, 15, a + .22, a + .6); g.stroke();
    g.beginPath(); g.moveTo(Math.cos(a + .78) * 18, Math.sin(a + .78) * 18); g.lineTo(Math.cos(a + .78) * 23, Math.sin(a + .78) * 23); g.stroke();
  }
  drawPaw(g, 0, 0, 7, ready ? C.cream : withAlpha(C.cream, .5), ready ? .85 : .45);
  circle(g, 0, 0, 2, ready ? C.coral : withAlpha(C.coral, .5), null, 0);
  g.restore();
}

/* ------------------------------------------------------------------
   06E. 增益图标（同时用于 BUILD 栏与三选一卡片）
   ------------------------------------------------------------------ */
function drawUpgradeIcon(g, x, y, size, icon, color) {
  const s = size / 24;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = C.ink; g.fillStyle = color;
  if (icon === 'claw') {
    g.save(); g.rotate(-.35);
    drawPaw(g, 0, 1, 12, color, 1);
    g.strokeStyle = C.cream; g.lineWidth = 2.2;
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * 6 - 4, -9); g.lineTo(i * 6 + 3, 7); g.stroke(); }
    g.restore();
  } else if (icon === 'bolt') {
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.moveTo(2, -12); g.lineTo(-7, 1); g.lineTo(1, 1); g.lineTo(-3, 13); g.lineTo(10, -3); g.lineTo(2, -3); g.closePath();
    g.fillStyle = color; g.fill(); g.stroke();
    g.fillStyle = C.cream; g.beginPath(); g.moveTo(0, -8); g.lineTo(-3, 0); g.lineTo(1, 0); g.lineTo(-1, 6); g.lineTo(5, -1); g.lineTo(1, -1); g.closePath(); g.fill();
  } else if (icon === 'range') {
    g.strokeStyle = C.ink; g.lineWidth = 3;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(-2, 2, 5 + i * 5, -.9, .9); g.stroke(); }
    g.strokeStyle = color; g.lineWidth = 2;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(-2, 2, 5 + i * 5, -.9, .9); g.stroke(); }
    drawStar(g, 8, -8, 5, 2, 4, color, C.ink, 1.5);
  } else if (icon === 'boot') {
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-7, -11); g.lineTo(2, -11); g.lineTo(3, 1); g.lineTo(10, 5); g.lineTo(11, 11); g.lineTo(-9, 11); g.lineTo(-8, 0); g.closePath(); g.fillStyle = color; g.fill(); g.stroke();
    g.strokeStyle = C.cream; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-5, -8); g.lineTo(0, -8); g.stroke();
    g.beginPath(); g.moveTo(-3, 5); g.lineTo(8, 5); g.stroke();
  } else if (icon === 'heart') {
    drawHeart(g, 0, 1, 14, color, C.ink, 2.8);
    g.strokeStyle = C.cream; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-5, -4); g.quadraticCurveTo(-1, -8, 3, -5); g.stroke();
  } else if (icon === 'dash') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.moveTo(-10 + i * 7, -8); g.lineTo(-3 + i * 7, 0); g.lineTo(-10 + i * 7, 8);
      g.lineTo(-6 + i * 7, 0); g.closePath(); g.fill(); g.stroke();
    }
  } else if (icon === 'fish') {
    drawFish(g, -1, -1, 13, color, C.ink, 2.5, -.1);
    g.strokeStyle = C.cream; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-5, 1); g.lineTo(8, 1); g.stroke();
  } else if (icon === 'spin') {
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath();
    for (let i = 0; i < 40; i++) {
      const a = i * .25, r = 2 + i * .3;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.stroke();
    g.strokeStyle = color; g.lineWidth = 2;
    g.beginPath();
    for (let i = 0; i < 40; i++) {
      const a = i * .25, r = 2 + i * .3;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.stroke();
    drawStar(g, 10, -9, 5, 2, 5, color, C.ink, 1.5);
  } else if (icon === 'clone') {
    g.globalAlpha = .8;
    drawCatHead(g, -5, 2, 8, 0, 0);
    g.globalAlpha = 1;
    drawCatHead(g, 6, -2, 9, 2, 0);
  } else if (icon === 'vamp') {
    drawFish(g, 1, 2, 12, color, C.ink, 2.5, -.08);
    drawHeart(g, -4, -7, 7, C.coral, C.ink, 1.8);
    g.fillStyle = C.coral;
    g.beginPath(); g.moveTo(2, -10); g.quadraticCurveTo(8, -3, 2, 3); g.quadraticCurveTo(-3, -2, 2, -10); g.fill();
  } else if (icon === 'crit') {
    drawStar(g, 0, 0, 12, 5, 5, color, C.ink, 2.5, -.3);
    g.fillStyle = C.cream; g.beginPath(); g.moveTo(0, -4); g.lineTo(2, 0); g.lineTo(-2, 0); g.closePath(); g.fill();
  } else if (icon === 'magnet') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.8;
    g.beginPath(); g.arc(0, 0, 9, Math.PI, TAU);
    g.lineTo(9, 10); g.lineTo(4, 10); g.lineTo(4, 2); g.arc(0, 0, 4, 0, Math.PI, true);
    g.lineTo(-4, 10); g.lineTo(-9, 10); g.lineTo(-9, 0); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = C.cream; g.fillRect(-8, 4, 5, 5); g.fillRect(3, 4, 5, 5);
    drawStar(g, 11, -10, 4, 1.8, 4, C.gold, C.ink, 1.2);
  } else if (icon === 'xp') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.5;
    g.beginPath(); g.ellipse(0, 2, 11, 9, 0, 0, TAU); g.fill(); g.stroke();
    drawPaw(g, 0, 2, 8, C.cream, .9);
    drawStar(g, -11, -9, 4, 1.5, 4, C.gold, C.ink, 1.2);
    drawStar(g, 11, -8, 3, 1.2, 4, C.gold, C.ink, 1.2);
  } else if (icon === 'thorn') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.5;
    starPath(g, 0, 0, 12, 4.5, 9, 0);
    g.fill(); g.stroke();
    circle(g, 0, 0, 4, C.cream, C.ink, 1.5);
  } else if (icon === 'shield') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.8;
    g.beginPath(); g.moveTo(0, -13); g.lineTo(10, -8); g.lineTo(8, 6);
    g.quadraticCurveTo(0, 14, -8, 6); g.lineTo(-10, -8); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = C.cream; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, -8); g.lineTo(0, 7); g.moveTo(-5, -1); g.lineTo(5, -1); g.stroke();
  } else if (icon === 'flame') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(0, 13);
    g.quadraticCurveTo(-11, 5, -6, -4); g.quadraticCurveTo(-3, -9, 0, -13);
    g.quadraticCurveTo(3, -7, 6, -4); g.quadraticCurveTo(11, 5, 0, 13);
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = C.gold;
    g.beginPath(); g.moveTo(0, 9); g.quadraticCurveTo(-4, 3, 0, -3); g.quadraticCurveTo(5, 3, 0, 9); g.fill();
  } else if (icon === 'frost') {
    g.strokeStyle = C.ink; g.lineWidth = 3.2;
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 3;
      g.beginPath(); g.moveTo(-Math.cos(a) * 12, -Math.sin(a) * 12);
      g.lineTo(Math.cos(a) * 12, Math.sin(a) * 12); g.stroke();
    }
    g.strokeStyle = color; g.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 3;
      g.beginPath(); g.moveTo(-Math.cos(a) * 12, -Math.sin(a) * 12);
      g.lineTo(Math.cos(a) * 12, Math.sin(a) * 12); g.stroke();
      for (const s of [-1, 1]) {
        const bx = Math.cos(a) * 7 * s, by = Math.sin(a) * 7 * s;
        g.beginPath(); g.moveTo(bx, by);
        g.lineTo(bx + Math.cos(a + 1) * 4, by + Math.sin(a + 1) * 4);
        g.moveTo(bx, by);
        g.lineTo(bx + Math.cos(a - 1) * 4, by + Math.sin(a - 1) * 4); g.stroke();
      }
    }
  } else if (icon === 'guard') {
    g.fillStyle = color; g.strokeStyle = C.ink; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(0, -12); g.lineTo(9, -7); g.lineTo(7, 5);
    g.quadraticCurveTo(0, 12, -7, 5); g.lineTo(-9, -7); g.closePath(); g.fill(); g.stroke();
    drawUpgradeIcon(g, 0, 1, 10, 'flame', C.coral);
  } else if (icon === 'storm') {
    drawUpgradeIcon(g, -1, 1, 13, 'frost', color);
    drawUpgradeIcon(g, 1, 0, 10, 'bolt', C.gold);
  } else if (icon === 'blood') {
    drawUpgradeIcon(g, 0, 2, 11, 'spin', color);
    drawHeart(g, 5, -6, 7, C.coral, C.ink, 1.8);
  } else if (icon === 'cyclone') {
    g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath();
    for (let i = 0; i < 46; i++) {
      const a = i * .29, r = 1.5 + i * .27;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.stroke();
    g.strokeStyle = color; g.lineWidth = 2;
    g.beginPath();
    for (let i = 0; i < 46; i++) {
      const a = i * .29, r = 1.5 + i * .27;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.stroke();
    drawUpgradeIcon(g, -6, -6, 9, 'boot', C.gold);
  } else {
    drawStar(g, 0, 0, 11, 4, 5, color, C.ink, 2);
  }
  g.restore();
}

function drawStatBar(g, x, y, w, h, ratio, fill, bg = '#5a445f', label = '', labelColor = C.cream) {
  fillRound(g, x - 2, y - 2, w + 4, h + 4, h / 2 + 2, C.ink);
  fillRound(g, x, y, w, h, h / 2, bg);
  const rw = Math.max(0, Math.min(1, ratio)) * w;
  if (rw > 1) {
    fillRound(g, x, y, Math.max(h, rw), h, h / 2, fill);
    fillRound(g, x + 2, y + 2, Math.max(0, rw - 4), Math.max(1, h * .25), h * .12, withAlpha(C.white, .35));
  }
  fillRound(g, x, y, w, h, h / 2, 'rgba(255,255,255,0)');
  if (label) drawText(g, label, x + w / 2, y + h / 2, Math.min(13, h + 2), labelColor, { align: 'center', line: 2, weight: 800 });
}

function drawBuildStrip(g, t) {
  const x = 16, y = 682, w = 520, h = 30;
  fillRound(g, x + 3, y + 4, w, h, 12, withAlpha(C.ink, .38));
  fillRound(g, x, y, w, h, 12, withAlpha('#23182e', .92));
  strokeRound(g, x, y, w, h, 12, withAlpha(C.cream, .25), 2);
  drawText(g, 'BUILD', x + 14, y + 15, 13, C.gold, { line: 3, weight: 900 });
  const entries = Object.entries(run && run.upgradeStacks ? run.upgradeStacks : {});
  const owned = [];
  for (const [id, count] of entries) {
    const u = SKILL_BY_ID[id];
    if (u && count > 0) owned.push({ u, count });
  }
  if (!owned.length) {
    drawText(g, '还没有增益 · 升级时三选一，开始打造怪招猫猫', x + 74, y + 15, 11, withAlpha(C.cream, .55));
  } else {
    let ix = x + 78;
    for (let i = 0; i < owned.length && i < 8; i++) {
      const { u, count } = owned[i];
      g.save();
      g.globalAlpha = .95;
      fillRound(g, ix - 1, y + 4, 24, 22, 7, withAlpha(u.color, .2));
      strokeRound(g, ix - 1, y + 4, 24, 22, 7, withAlpha(u.color, .55), 1.5);
      drawUpgradeIcon(g, ix + 11, y + 15, 17, count >= 4 ? u.mutateIcon : u.icon, count >= 4 ? C.gold : u.color);
      g.restore();
      drawText(g, `Lv.${count}`, ix + 22, y + 8, 7, C.cream, { align: 'center', line: 2, weight: 900 });
      ix += 34;
    }
  }
  const total = owned.reduce((s, o) => s + o.count, 0);
  if (total > 0) drawText(g, `×${total}`, x + w - 14, y + 15, 11, withAlpha(C.cream, .55), { align: 'right' });
}

function drawBossHud(g, t) {
  const boss = enemies.find(e => e.boss && !e.dead);
  if (!boss) return false;
  const x = 552, y = 681, w = 480, h = 30;
  fillRound(g, x + 3, y + 4, w, h, 12, withAlpha(C.ink, .4));
  fillRound(g, x, y, w, h, 12, withAlpha('#2a1724', .94));
  strokeRound(g, x, y, w, h, 12, withAlpha(C.coral, .6), 2);
  drawText(g, boss.enraged ? `狂暴 · ${boss.name}` : boss.name, x + 12, y + 14, 12,
    boss.enraged ? C.coral : C.gold, { line: 2.5, weight: 900 });
  const bx = x + 152, bw = w - 174, bh = 10;
  fillRound(g, bx, y + 9, bw, bh, 5, C.ink);
  fillRound(g, bx + 2, y + 11, bw - 4, bh - 4, 3, '#674656');
  const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
  if (ratio > 0) fillRound(g, bx + 2, y + 11, (bw - 4) * ratio, bh - 4, 3, boss.enraged ? C.coral : C.gold);
  if (boss.hitFlash > 0) {
    g.globalAlpha = clamp(boss.hitFlash / .13, 0, 1) * .4;
    fillRound(g, bx + 2, y + 11, (bw - 4) * ratio, bh - 4, 3, C.white);
    g.globalAlpha = 1;
  }
  drawText(g, `${Math.max(0, Math.ceil(boss.hp))} / ${boss.maxHp}`, x + w - 12, y + 14, 9, withAlpha(C.cream, .65), { align: 'right' });
  return true;
}
