    g.lineTo(Math.cos(a) * r * 1.45, Math.sin(a) * r * 1.15);
    g.stroke();
  }
  for (let i = 0; i < Math.max(2, Math.round(3 * fx)); i++) {
    const a = t * .9 + i * TAU / 3;
    drawStar(g, Math.cos(a) * r * 1.35, -r * .5 + Math.sin(a) * r * .7, r * .08, r * .035, 4, aux, null, 0, a);
  }
  g.restore();
}

function v11iDrawHealT2(g, r, cat, t, o) {
  o = o || {};
  const col = C.blue, aux = C.mint, ink = C.ink;
  const fx = v11iFormFx(o);
  const lw = Math.max(1.3, r * .065);
  v11iFormBase(g, r, cat, t, o, .74);
  g.save();
  // 治愈之树（放在外侧，不盖脸）
  if (!o.headOnly && !o.overlayOnly) {
    g.strokeStyle = withAlpha(aux, .55); g.lineWidth = Math.max(2, r * .12);
    g.beginPath();
    g.moveTo(-r * 1.38, r * 1.16);
    g.quadraticCurveTo(-r * 1.18, r * .2, -r * 1.34, -r * .5);
    g.stroke();
    g.lineWidth = Math.max(1.2, r * .07);
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(-r * 1.3, -r * .2 + i * r * .22);
      g.lineTo(-r * (1.72 + i * .08), -r * (.62 + i * .2));
      g.stroke();
    }
    for (let i = 0; i < Math.max(3, Math.round(5 * fx)); i++) {
      const a = i * TAU / 5 + t * .12;
      g.fillStyle = withAlpha(aux, .22);
      g.beginPath(); g.arc(-r * 1.5 + Math.cos(a) * r * .18, -r * .86 + Math.sin(a) * r * .2, r * (.16 + i * .02), 0, TAU); g.fill();
    }
  }
  // 双光环
  v11iFormGlow(g, 0, -r * 1.3, r * .55, col, .4);
  for (let i = 0; i < 2; i++) {
    g.beginPath(); g.ellipse(0, -r * 1.3 - i * r * .1, r * (.64 - i * .12), r * (.2 - i * .04), 0, 0, TAU);
    g.strokeStyle = withAlpha(i ? aux : col, i ? .6 : .95); g.lineWidth = lw * (i ? .7 : 1.35); g.stroke();
  }
  // 展开大翼（四层羽片）
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      const span = r * (.92 + i * .3);
      v11iFormPoly(g, [
        [sx * r * .46, -r * .18], [sx * span, -r * (.9 + i * .08)],
        [sx * (span + r * .2), -r * (.06 + i * .04)], [sx * r * .6, r * .34],
      ], withAlpha(aux, .2 + i * .06), withAlpha(col, .8), lw);
    }
    for (let i = 0; i < 3; i++) {
      g.strokeStyle = withAlpha(C.white, .45); g.lineWidth = lw * .55;
      g.beginPath();
      g.moveTo(sx * r * .6, r * .02);
      g.lineTo(sx * r * (1.35 + i * .18), -r * (.3 + i * .16));
      g.stroke();
    }
  }
  // 治愈光柱
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI * .9 + i * Math.PI * .2;
    g.strokeStyle = withAlpha(aux, .32); g.lineWidth = lw * .7;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * .48, r * .95);
    g.lineTo(Math.cos(a) * r * 1.65, Math.sin(a) * r * 1.35 - r * .1);
    g.stroke();
  }
  const lights = Math.max(4, Math.round(6 * fx));
  for (let i = 0; i < lights; i++) {
    const a = -t * .8 + i * TAU / lights;
    drawStar(g, Math.cos(a) * r * 1.5, -r * .55 + Math.sin(a) * r * .95, r * .1, r * .045, i % 2 ? 4 : 5, i % 2 ? aux : C.white, null, 0, a);
  }
  g.restore();
}


const V11I_HUD_BADGE_RECTS = [];
const V11I_UPGRADE_BADGE_RECTS = [];
let V11I_SCHOOL_TOAST_PENDING = null;

function v11iSkillLv(id) {
  return run && run.upgradeStacks ? (run.upgradeStacks[id] || 0) : 0;
}

function v11iTopSchool() {
  if (!run || !run.schools) return null;
  let best = null;
  for (const def of V11_SCHOOLS) {
    const st = run.schools[def.id];
    if (!st || !st.tier) continue;
    const score = st.tier * 100 + (st.memberCount || 0);
    if (!best || score > best.score) best = { def, st, score };
  }
  return best;
}

/* 仅由两个核心技能决定阶级；members 全满只用于外观强化。 */
function v11iSchoolTier(def) {
  const minCore = Math.min(...def.core.map(id => v11iSkillLv(id)));
  if (minCore >= 4) return { tier: 2, minCore };
  if (minCore >= 1) return { tier: 1, minCore };
  return { tier: 0, minCore };
}

function v11iSchoolChangedText(changes) {
  const unlock = changes.filter(c => c.type === 'unlock').map(c => c.name);
  const second = changes.filter(c => c.type === 'second').map(c => c.name);
  const full = changes.filter(c => c.type === 'full').map(c => c.name);
  const parts = [];
  if (unlock.length) parts.push(`流派共鸣解锁 · ${unlock.join(' / ')}`);
  if (second.length) parts.push(`流派共鸣进阶 · ${second.join(' / ')}`);
  if (full.length) parts.push(`流派成员全满 · ${full.join(' / ')}（外观强化）`);
  return parts.join(' · ');
}

function v11EvalSchools(opts = {}) {
  if (!run) return { changes: [], schools: {} };
  if (!run.schools || typeof run.schools !== 'object') run.schools = {};
  const silent = !!opts.silent;
  const changes = [];
  for (const def of V11_SCHOOLS) {
    const { tier, minCore } = v11iSchoolTier(def);
    const memberCount = def.members.filter(id => v11iSkillLv(id) >= 1).length;
    const membersFull = def.members.every(id => v11iSkillLv(id) >= 4);
    if (tier <= 0) {
      if (run.schools[def.id]) delete run.schools[def.id];
      continue;
    }
    const st = run.schools[def.id] || {
      id: def.id, name: def.name, short: def.short,
      tier: 0, notified1: false, notified2: false, notifiedFull: false,
    };
    st.tier = tier;
    st.minCore = minCore;
    st.coreLevels = {};
    st.coreLevels[def.core[0]] = v11iSkillLv(def.core[0]);
    st.coreLevels[def.core[1]] = v11iSkillLv(def.core[1]);
    st.memberCount = memberCount;
    st.membersFull = membersFull;
    st.fullName = tier >= 2 ? def.secondName : def.name;
    run.schools[def.id] = st;
    if (!st.notified1) {
      st.notified1 = true;
      if (!silent) changes.push({ type: 'unlock', id: def.id, name: def.name, color: def.color });
    }
    if (tier >= 2 && !st.notified2) {
      st.notified2 = true;
      if (!silent) changes.push({ type: 'second', id: def.id, name: def.secondName, color: def.color });
    }
    if (membersFull && !st.notifiedFull) {
      st.notifiedFull = true;
      if (!silent) changes.push({ type: 'full', id: def.id, name: def.name, color: def.color });
    }
  }
  if (changes.length && !silent) {
    const text = v11iSchoolChangedText(changes);
    const color = changes.some(c => c.type === 'second') ? C.gold : C.mint;
    if (state === 'upgrade') {
      if (V11I_SCHOOL_TOAST_PENDING) {
        V11I_SCHOOL_TOAST_PENDING.text = V11I_SCHOOL_TOAST_PENDING.text + ' · ' + text;
      } else {
        V11I_SCHOOL_TOAST_PENDING = { text, color };
      }
    } else {
      showToast(text, color, 2.8);
    }
  }
  return { changes, schools: run.schools };
}

/* 一阶 +6% / 二阶 +16%；同属性叠加封顶 +24%。 */
function v11SchoolBonus() {
  const out = { attackSpeed: 0, damage: 0, range: 0, summon: 0, heal: 0 };
  if (!run || !run.schools) return out;
  for (const def of V11_SCHOOLS) {
    const st = run.schools[def.id];
    if (!st || !st.tier || !out.hasOwnProperty(def.attr)) continue;
    out[def.attr] += st.tier >= 2 ? .16 : .06;
  }
  for (const k of Object.keys(out)) out[k] = Math.min(.24, out[k]);
  return out;
}

function v11iSchoolEntries() {
  if (!run || !run.schools) return [];
  const out = [];
  for (const def of V11_SCHOOLS) {
    const st = run.schools[def.id];
    if (st && st.tier > 0) out.push({ def, st });
  }
  out.sort((a, b) => b.st.tier - a.st.tier || (b.st.memberCount || 0) - (a.st.memberCount || 0));
  return out;
}

function v11iSchoolBadgeLabel(e, long) {
  if (e.st.tier >= 2) return long ? `二阶·${e.def.secondName}` : `${e.def.short}·贰`;
  return long ? `已解锁·${e.def.short}流` : `${e.def.short}·壹`;
}

/* ---------------- 玩家猫与照片主角的共鸣光效 ---------------- */
function v11iDrawSchoolAura(g, p, t, top) {
  const r = p.r || 20;
  const color = top.def.color;
  const tier2 = top.st.tier >= 2;
  const full = !!top.st.membersFull;
  g.save();
  g.translate(p.x, p.y);
  const pulse = .22 + Math.sin(t * 3.2) * .06 + (tier2 ? .06 : 0);
  const grad = g.createRadialGradient(0, 0, r * .55, 0, 0, r * (tier2 ? 2.5 : 2.1));
  grad.addColorStop(0, withAlpha(color, pulse));
  grad.addColorStop(.55, withAlpha(color, pulse * .45));
  grad.addColorStop(1, withAlpha(color, 0));
  g.fillStyle = grad;
  g.beginPath(); g.arc(0, 0, r * (tier2 ? 2.5 : 2.1), 0, TAU); g.fill();
  g.globalAlpha = tier2 ? .9 : .65;
  g.strokeStyle = withAlpha(color, tier2 ? .95 : .75);
  g.lineWidth = tier2 ? 3 : 2.2;
  g.beginPath(); g.arc(0, 2, r * 1.32, Math.PI * .16, Math.PI * .84); g.stroke();
  if (tier2) {
    g.beginPath(); g.arc(0, 2, r * 1.5, Math.PI * .04, Math.PI * .96); g.stroke();
  }
  if (full) {
    g.globalAlpha = .55;
    g.strokeStyle = withAlpha(C.gold, .8);
    g.lineWidth = 1.6;
    g.beginPath(); g.arc(0, 2, r * 1.7, 0, TAU); g.stroke();
  }
  g.restore();
}

function v11iDrawSchoolOrbit(g, p, t, top) {
  const r = p.r || 20;
  const count = top.st.membersFull ? 8 : (top.st.tier >= 2 ? 5 : 3);
  g.save();
  g.translate(p.x, p.y);
  for (let i = 0; i < count; i++) {
    const a = t * 1.15 + i * TAU / count;
    drawStar(g, Math.cos(a) * r * 1.85, Math.sin(a) * r * 1.2 - r * .2,
      top.st.tier >= 2 ? 6.5 : 5, top.st.tier >= 2 ? 2.9 : 2.2, 5,
      top.st.tier >= 2 ? C.gold : top.def.color, withAlpha(C.ink, .4), 1.2, t);
  }
  g.restore();
}

const V11I_LEGACY_PERFORM_ATTACK_SCHOOL = performAttack;
performAttack = function () {
  if (!player) return V11I_LEGACY_PERFORM_ATTACK_SCHOOL();
  const b = v11SchoolBonus();
  const p = player;
  const oldRange = p.attackRange, oldArc = p.attackArc, oldWhirl = p.whirlRange;
  if (b.range > 0) {
    p.attackRange = oldRange * (1 + b.range);
    p.attackArc = oldArc * (1 + b.range);
    if (oldWhirl) p.whirlRange = oldWhirl * (1 + b.range);
  }
  try {
    V11I_LEGACY_PERFORM_ATTACK_SCHOOL();
  } finally {
    p.attackRange = oldRange;
    p.attackArc = oldArc;
    p.whirlRange = oldWhirl;
    if (b.attackSpeed > 0) p.attackTimer /= (1 + b.attackSpeed);
  }
};

const V11I_LEGACY_DAMAGE_ENEMY_SCHOOL = damageEnemy;
damageEnemy = function (e, rawDamage, opts = {}) {

  const b = v11SchoolBonus();
  if (!b.summon) return V11I_LEGACY_UPDATE_CLONES_SCHOOL(dt);
  const old = player.attackDamage;
  player.attackDamage = old * (1 + b.summon);
  try { V11I_LEGACY_UPDATE_CLONES_SCHOOL(dt); }
  finally { player.attackDamage = old; }
};

  if (!b.heal) return V11I_LEGACY_CLEAR_ROOM_SCHOOL();
  const old = player.roomHealBonus;
  player.roomHealBonus = old + b.heal;
  try { V11I_LEGACY_CLEAR_ROOM_SCHOOL(); }
  finally { player.roomHealBonus = old; }
};

   - 手机只做横屏：竖屏由总门控页接管；横屏一套操作布局，命中区 ≥44；DOM 设置按钮 96×48

   ================================================================== */

const V11_PROFILE = {
  mobile: false, zoom: 1, uiScale: 1, dprCap: 2.5, particleMul: 1,
  menuCompact: false, assetScale: 1, orientation: 'landscape', portrait: false,
  width: 0, height: 0, effectScale: 1,

let V11J_FORCE_MOBILE = null;

const V11J_UI = { cssW: 1280, cssH: 720, bw: 1280, bh: 720, dpr: 1, mode: 'desktop' };
const V11J_SAFE = { top: 0, right: 0, bottom: 0, left: 0 };
const V11J_CAM = {
  active: false, zoom: 1, viewW: W, viewH: H, x: 0, y: 0,
  canvasAspect: W / H, cropAspect: W / H, aspectError: 0,
};
const V11J_STATS = {
  visibleEnemies: 0, totalEnemies: 0, visibleProjectiles: 0, totalProjectiles: 0,
  visiblePickups: 0, visibleParticles: 0, offscreenW: 0, offscreenH: 0, offscreenResizes: 0,
};
const V11J_POINTER = { cssX: 0, cssY: 0, space: 'desktop' };
const V11J_STAGE = { k: 1, ox: 0, oy: 0, active: false };

const V11J_CUSTOM_STATES = ['title', 'modeSelect', 'paused', 'dead', 'gameover', 'between', 'exitConfirm', 'upgrade', 'victory', 'touchEdit'];
const V11J_BATTLE_STATES = ['playing', 'transition', 'paused', 'dead', 'gameover', 'between', 'exitConfirm'];

let V11J_OFF = null;
let V11J_OFF_CTX = null;
let V11J_GEAR = null;

/* ---------------- 1. 设备判定 / PROFILE ---------------- */
function v11jDetectMobile() {
  if (V11J_FORCE_MOBILE !== null) return !!V11J_FORCE_MOBILE;
  let coarse = false;
  try { coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches); } catch (e) { /* 忽略 */ }
  return coarse || window.innerWidth < 768;
}

/* 可视视口尺寸：移动端地址栏伸缩时 innerHeight 会偏大，visualViewport 才是真正可见区域。
   D v2 修底部被切：画布尺寸与绘制都以可视视口为准；不支持的浏览器回退 innerWidth/innerHeight。 */
function v11jVisualW() {
  try {
    const vv = window.visualViewport;
    if (vv && Number(vv.width) > 0) return Number(vv.width);
  } catch (e) { /* 忽略 */ }
  return window.innerWidth || W;
}

function v11jVisualH() {
  try {
    const vv = window.visualViewport;
    if (vv && Number(vv.height) > 0) return Number(vv.height);
  } catch (e) { /* 忽略 */ }
  return window.innerHeight || H;
}

function v11jRefreshProfile() {
  const mobile = v11jDetectMobile();
  const portrait = (window.innerHeight || H) > (window.innerWidth || W);
  Object.assign(V11_PROFILE, {
    mobile,
    zoom: mobile ? 1.35 : 1,
    uiScale: mobile ? 1.5 : 1,
    dprCap: mobile ? 2 : 2.5,
    particleMul: mobile ? .6 : 1,
    menuCompact: mobile,
    assetScale: 1,
    orientation: portrait ? 'portrait' : 'landscape',
    portrait,
    width: window.innerWidth || W,
    height: window.innerHeight || H,
  });
  return V11_PROFILE;
}
v11jRefreshProfile();

/* ---------------- 2. safe-area / PWA meta ---------------- */
function v11jInjectStyle(id, css) {
  try {
    let el = document.getElementById(id);
    if (!el) {
      el = document.createElement('style');
      el.id = id;
      (document.head || document.documentElement).appendChild(el);
    }
    el.textContent = css;
  } catch (e) { /* 忽略 */ }
}

function v11jProbeSafeArea() {
  try {
    let probe = document.getElementById('nyan-safe-probe');
    if (!probe) {
      probe = document.createElement('div');
      probe.id = 'nyan-safe-probe';
      probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
        'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);' +
        'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
      document.body.appendChild(probe);

    V11J_SAFE.top = Math.max(0, parseFloat(cs.paddingTop) || 0);
    V11J_SAFE.right = Math.max(0, parseFloat(cs.paddingRight) || 0);
    V11J_SAFE.bottom = Math.max(0, parseFloat(cs.paddingBottom) || 0);
    V11J_SAFE.left = Math.max(0, parseFloat(cs.paddingLeft) || 0);
  } catch (e) {
    V11J_SAFE.top = V11J_SAFE.right = V11J_SAFE.bottom = V11J_SAFE.left = 0;
  }
  return V11J_SAFE;
}

function v11jMeta(name, content, id) {
  try {
    let el = document.querySelector(`meta[name="${name}"]`);
    if (!el) {
      el = document.createElement('meta');
      el.name = name;
      (document.head || document.documentElement).appendChild(el);
    }
    el.content = content;
    if (id) el.id = id;
    return el;
  } catch (e) { return null; }
}

const V11J_PWA = {
  manifest: null, manifestHref: '', manifestError: '', iconData: '',
  ios: false, standalone: false, homeDismissed: false,
  homeCardVisible: false, homeCloseRect: null, homeCardRect: null,
  installedAt: 0,
};
const V11J_HOME_KEY = 'weimiaoxunmiao_homescreen_v1';

function v11jPwaIcon() {

    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, 192);
    bg.addColorStop(0, '#fff7e8'); bg.addColorStop(.6, '#ffe9cd'); bg.addColorStop(1, '#ffddc2');
    g.fillStyle = bg; g.fillRect(0, 0, 192, 192);

}

function v11jInjectPwa() {

    V11J_PWA.iconData = v11jPwaIcon();

    };

    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    V11J_PWA.manifestHref = URL.createObjectURL(blob);

    if (!link) {

    'html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}',
    '#game{touch-action:none;}',
    '#nyan-gear{touch-action:none;}',
    '@media (max-width:640px){#game{border-radius:0;box-shadow:none;}}',
    'html.pseudo-fullscreen,body.pseudo-fullscreen,#stage{background:#ffe9cd;}',

  v11jBindViewport();

/* v1.1.3 补充项：首次用户手势后尝试锁定横屏。
   Android / 安装版 PWA 生效；iOS Safari 无 screen.orientation.lock 或拒绝时静默忽略。
   只绑一次、只在手势回调里调用，绝不 preventDefault，不阻断游戏输入。 */
let v11jOrientationLockArmed = false;
function v11jArmOrientationLock() {
  if (v11jOrientationLockArmed) return;
  v11jOrientationLockArmed = true;
  if (!V11_PROFILE.mobile && !V11J_PWA.standalone) return;
  let tried = false;
  function tryLock() {
    if (tried) return;
    tried = true;
    try {
      const so = screen.orientation;
      if (so && typeof so.lock === 'function') {
        const ret = so.lock('landscape');
        if (ret && typeof ret.catch === 'function') ret.catch(() => {});
      }
    } catch (e) { /* iOS / 桌面浏览器：静默放弃 */ }
    try { window.removeEventListener('pointerdown', tryLock, true); } catch (e) { /* 忽略 */ }
    try { window.removeEventListener('touchstart', tryLock, true); } catch (e) { /* 忽略 */ }
  }
  try {
    window.addEventListener('pointerdown', tryLock, { capture: true, passive: true, once: true });
    window.addEventListener('touchstart', tryLock, { capture: true, passive: true, once: true });
  } catch (e) { /* 老浏览器：只放弃锁定，不影响游戏 */ }
}

/* ---------------- 3. 画布同步（手机铺满，桌面原路径） ---------------- */
function v11jSyncTouchCss() {
  const cfg = V11_TOUCH_CFG;
  const cssW = V11J_UI.cssW, cssH = V11J_UI.cssH;
  const S = V11J_SAFE;
  const def = V11_TOUCH_CFG_DEF;
  const customJoy = Math.abs(cfg.joyAx - def.joyAx) > .001 || Math.abs(cfg.joyAy - def.joyAy) > .001;
  const customRight = Math.abs(cfg.rightAx - def.rightAx) > .001 || Math.abs(cfg.rightAy - def.rightAy) > .001;

  // v1.1.3 补充项：手机只做横屏，触控盘固定为横屏布局（命中区 ≥44）。
  TOUCH_JOY.r = clamp(52 * cfg.joyScale, 40, 72);
  TOUCH_JOY.knob = TOUCH_JOY.r * .4;
  TOUCH_ATTACK.r = clamp(42 * cfg.rightScale, 32, 58);
  TOUCH_DASH.r = clamp(32 * cfg.rightScale, 24, 46);
  TOUCH_JOY.x = customJoy ? cfg.joyAx * cssW : S.left + 14 + TOUCH_JOY.r;
  TOUCH_JOY.y = customJoy ? cfg.joyAy * cssH : cssH - S.bottom - 14 - TOUCH_JOY.r;
  TOUCH_ATTACK.x = customRight ? cfg.rightAx * cssW : cssW - S.right - 14 - TOUCH_ATTACK.r;
  TOUCH_ATTACK.y = customRight ? cfg.rightAy * cssH : cssH - S.bottom - 14 - TOUCH_ATTACK.r;
  TOUCH_DASH.x = customRight ? TOUCH_ATTACK.x - 98 * cfg.rightScale : TOUCH_ATTACK.x;
  TOUCH_DASH.y = customRight ? TOUCH_ATTACK.y + 70 * cfg.rightScale : TOUCH_ATTACK.y - TOUCH_ATTACK.r - TOUCH_DASH.r - 12;
  // 夹进画面，命中区始终 ≥44 直径。
  TOUCH_JOY.x = clamp(TOUCH_JOY.x, S.left + TOUCH_JOY.r + 6, cssW - S.right - TOUCH_JOY.r - 6);
  TOUCH_JOY.y = clamp(TOUCH_JOY.y, S.top + 120 + TOUCH_JOY.r, cssH - S.bottom - TOUCH_JOY.r - 6);
  TOUCH_ATTACK.x = clamp(TOUCH_ATTACK.x, cssW / 2 + TOUCH_ATTACK.r, cssW - S.right - TOUCH_ATTACK.r - 6);
  TOUCH_ATTACK.y = clamp(TOUCH_ATTACK.y, S.top + 120 + TOUCH_ATTACK.r, cssH - S.bottom - TOUCH_ATTACK.r - 6);
  TOUCH_DASH.x = clamp(TOUCH_DASH.x, cssW / 2 + TOUCH_DASH.r, cssW - S.right - TOUCH_DASH.r - 6);
  TOUCH_DASH.y = clamp(TOUCH_DASH.y, S.top + 120 + TOUCH_DASH.r, cssH - S.bottom - TOUCH_DASH.r - 6);
  if (touchState.joyId === null) {
    touchState.joyX = TOUCH_JOY.x;
    touchState.joyY = TOUCH_JOY.y;
    touchState.joyBaseX = TOUCH_JOY.x;
    touchState.joyBaseY = TOUCH_JOY.y;
  }
}

function v11jEnsureOffscreen() {
  if (!V11J_OFF) {
    V11J_OFF = document.createElement('canvas');
    V11J_OFF_CTX = V11J_OFF.getContext('2d');
  }
  if (V11J_OFF.width !== canvas.width || V11J_OFF.height !== canvas.height) {
    V11J_OFF.width = canvas.width;
    V11J_OFF.height = canvas.height;
    V11J_STATS.offscreenW = V11J_OFF.width;
    V11J_STATS.offscreenH = V11J_OFF.height;
    V11J_STATS.offscreenResizes++;
  }
  V11J_STATS.offscreenW = V11J_OFF.width;
  V11J_STATS.offscreenH = V11J_OFF.height;
}

const V11J_LEGACY_SYNC_CANVAS = v11SyncCanvasSize;
v11SyncCanvasSize = function () {
  v11jRefreshProfile();
  if (!V11_PROFILE.mobile) {
    V11J_UI.mode = 'desktop';
    V11J_CAM.active = false;
    V11J_LEGACY_SYNC_CANVAS();
    v11jProbeSafeArea();
    return;
  }
  const dpr = Math.min(V11_PROFILE.dprCap, Math.max(1, window.devicePixelRatio || 1));
  const cssW = Math.max(240, v11jVisualW());
  const cssH = Math.max(160, v11jVisualH());
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.style.borderRadius = '0';
  canvas.style.boxShadow = 'none';
  canvas.style.display = 'block';
  const bw = Math.min(2560, Math.max(360, Math.round(cssW * dpr)));
  const bh = Math.max(1, Math.round(bw * cssH / cssW));
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  ctx.setTransform(bw / cssW, 0, 0, bh / cssH, 0, 0);
  ctx.imageSmoothingEnabled = true;
  V11J_UI.cssW = cssW; V11J_UI.cssH = cssH; V11J_UI.bw = bw; V11J_UI.bh = bh;
  V11J_UI.dpr = dpr; V11J_UI.mode = 'mobile';
  V11_VIEW.cssW = cssW; V11_VIEW.cssH = cssH; V11_VIEW.k = bw / cssW;
  V11_PROFILE.width = cssW; V11_PROFILE.height = cssH;
  V11_PROFILE.portrait = cssH > cssW;
  V11_PROFILE.orientation = cssH > cssW ? 'portrait' : 'landscape';
  v11jProbeSafeArea();
  v11jSyncTouchCss();
  v11jEnsureOffscreen();
  const stage = document.getElementById('stage');
  if (stage) {
    stage.style.background = '#ffe9cd';
    stage.style.position = '';
    stage.style.inset = '';
  }
  try { document.body.style.background = '#ffe9cd'; } catch (e) { /* 忽略 */ }
  v11jSyncGear();
};

/* visualViewport 监听：地址栏收起/展开、软键盘、横竖屏切换都会改可视高度。
   rAF 合并密集事件，避免每帧重设画布；只绑定一次。 */
let v11jViewportBound = false;
let v11jViewportRaf = 0;
function v11jBindViewport() {
  if (v11jViewportBound) return;
  v11jViewportBound = true;
  const queue = () => {
    if (v11jViewportRaf) return;
    const raf = window.requestAnimationFrame || function (fn) { return setTimeout(fn, 16); };
    v11jViewportRaf = raf(() => {
      v11jViewportRaf = 0;
      v11SyncCanvasSize();
      v11jSyncGear();
    });
  };
  try {
    const vv = window.visualViewport;
    if (vv && typeof vv.addEventListener === 'function') {
      vv.addEventListener('resize', queue, { passive: true });
      vv.addEventListener('scroll', queue, { passive: true });
    }
  } catch (e) { /* 忽略 */ }
  window.addEventListener('orientationchange', () => { setTimeout(queue, 120); });
}
/* ---------------- 4. 相机 / 离屏世界合成 ---------------- */
function v11jUpdateCamera() {
  const cw = Math.max(1, canvas.width);
  const ch = Math.max(1, canvas.height);
  const aspect = cw / ch;
  const zoom = Math.max(1.3, Number(V11_PROFILE.zoom) || 1.35);
  let viewH = H / zoom;
  let viewW = viewH * aspect;
  // 极宽 / 极窄屏：优先保持“裁切长宽比 = 实际画布长宽比”。
  if (viewW > W) { viewW = W; viewH = viewW / aspect; }
  if (viewH > H) { viewH = H; viewW = viewH * aspect; }
  const maxX = Math.max(0, W - viewW);
  const maxY = Math.max(0, H - viewH);
  const px = player ? player.x : W / 2;
  const py = player ? player.y : H / 2;
  V11J_CAM.canvasAspect = aspect;
  V11J_CAM.active = true;
  V11J_CAM.zoom = H / viewH;
  V11J_CAM.viewW = viewW;
  V11J_CAM.viewH = viewH;
  V11J_CAM.x = clamp(px - viewW / 2, 0, maxX);
  V11J_CAM.y = clamp(py - viewH / 2, 0, maxY);
  V11J_CAM.cropAspect = viewW / viewH;
  // 浮点换算后应严格等于画布长宽比，这里记录误差供自检。
  V11J_CAM.aspectError = Math.abs(V11J_CAM.cropAspect - aspect);
  return V11J_CAM;
}

function v11jCssToWorld(cx, cy) {
  const ui = V11J_UI, cam = V11J_CAM;
  return {
    x: cam.x + clamp(cx, 0, ui.cssW) / Math.max(1, ui.cssW) * cam.viewW,
    y: cam.y + clamp(cy, 0, ui.cssH) / Math.max(1, ui.cssH) * cam.viewH,
  };
}

function v11jWorldToCss(x, y) {
  const ui = V11J_UI, cam = V11J_CAM;
  return {
    x: (x - cam.x) / Math.max(.001, cam.viewW) * ui.cssW,
    y: (y - cam.y) / Math.max(.001, cam.viewH) * ui.cssH,
  };
}

function v11jInView(x, y, pad) {
  const cam = V11J_CAM, p = pad || 0;
  return x >= cam.x - p && x <= cam.x + cam.viewW + p &&
    y >= cam.y - p && y <= cam.y + cam.viewH + p;
}

function v11jVisibleOnly(arr, pad) {
  const out = [];
  for (const o of arr) {
    if (!o) continue;
    if (Object.prototype.hasOwnProperty.call(o, 'x') && Object.prototype.hasOwnProperty.call(o, 'y')) {
      if (!v11jInView(o.x, o.y, pad)) continue;
    }
    out.push(o);
  }
  return out;
}

function v11jDrawWorldCss(t) {
  // v1.1.3：legacy draw() 不带参数，这里回落到全局 time，避免流派光效拿到 NaN
  if (!(typeof t === 'number' && isFinite(t))) t = time;
  v11jUpdateCamera();
  v11jEnsureOffscreen();
  const off = V11J_OFF, og = V11J_OFF_CTX, cam = V11J_CAM;
  const scale = off.width / Math.max(.001, cam.viewW);
  og.setTransform(1, 0, 0, 1, 0, 0);
  og.globalAlpha = 1;
  og.globalCompositeOperation = 'source-over';
  og.clearRect(0, 0, off.width, off.height);
  og.setTransform(scale, 0, 0, scale, -cam.x * scale, -cam.y * scale);

  // 只把视口附近的实体交给 drawScene；数组原引用在 finally 里还原。
  const savedEnemies = enemies;
  const savedProjectiles = projectiles;
  const savedPickups = pickups;
  const savedClones = clones;
  const savedParticles = particles;
  const savedFloaters = floaters;
  const savedRings = rings;
  const savedShockwaves = shockwaves;
  const savedObstacles = room ? room.obstacles : null;
  const savedScreenFx = drawScreenFx;
  V11J_STATS.totalEnemies = savedEnemies.length;
  V11J_STATS.totalProjectiles = savedProjectiles.length;
  const cullPad = 280;
  drawScreenFx = function () { /* 屏幕层反馈改到 CSS 空间单独绘制 */ };
  try {
    enemies = v11jVisibleOnly(savedEnemies, cullPad);
    projectiles = v11jVisibleOnly(savedProjectiles, 90);
    pickups = v11jVisibleOnly(savedPickups, 70);
    clones = v11jVisibleOnly(savedClones, 120);
    particles = v11jVisibleOnly(savedParticles, 70);
    floaters = v11jVisibleOnly(savedFloaters, 90);
    rings = v11jVisibleOnly(savedRings, 90);
    shockwaves = v11jVisibleOnly(savedShockwaves, 90);
    if (room && savedObstacles) room.obstacles = v11jVisibleOnly(savedObstacles, cullPad);
    V11J_STATS.visibleEnemies = enemies.length;
    V11J_STATS.visibleProjectiles = projectiles.length;
    V11J_STATS.visiblePickups = pickups.length;
    V11J_STATS.visibleParticles = particles.length;
    drawScene(og, t);
  } finally {
    drawScreenFx = savedScreenFx;
    enemies = savedEnemies;
    projectiles = savedProjectiles;
    pickups = savedPickups;
    clones = savedClones;
    particles = savedParticles;
    floaters = savedFloaters;
    rings = savedRings;
    shockwaves = savedShockwaves;
    if (room) room.obstacles = savedObstacles;
  }

  const ui = V11J_UI;
  ctx.save();
  ctx.setTransform(ui.bw / ui.cssW, 0, 0, ui.bh / ui.cssH, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // 底色兜底：震屏时离屏边缘的透明像素不会露出“黑边”。
  ctx.fillStyle = '#ffe9cd';
  ctx.fillRect(0, 0, ui.cssW, ui.cssH);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, ui.cssW, ui.cssH);
  ctx.restore();
  v11jDrawScreenFxCss(t);
}

function v11jDrawScreenFxCss(t) {
  const ui = V11J_UI;
  const cx = ui.cssW / 2, cy = ui.cssH / 2;
  const minSide = Math.min(ui.cssW, ui.cssH);
  const maxSide = Math.max(ui.cssW, ui.cssH);
  const v = ctx.createRadialGradient(cx, cy, minSide * .34, cx, cy, maxSide * .78);
  v.addColorStop(0, 'rgba(20,12,30,0)');
  v.addColorStop(.72, 'rgba(20,12,30,.14)');
  v.addColorStop(1, 'rgba(12,7,18,.52)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, ui.cssW, ui.cssH);

  if (player && !player.dead && player.hp / player.maxHp < .3 && (state === 'playing' || state === 'transition')) {
    const a = .22 + Math.sin(t * 6) * .1;
    const rg = ctx.createRadialGradient(cx, cy, minSide * .3, cx, cy, maxSide * .7);
    rg.addColorStop(0, 'rgba(255,50,80,0)');
    rg.addColorStop(1, `rgba(255,50,80,${Math.max(0, a)})`);
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, ui.cssW, ui.cssH);
  }
  if (hitVignette > 0) {
    const a = hitVignette * .8;
    const rg = ctx.createRadialGradient(cx, cy, minSide * .22, cx, cy, maxSide * .7);
    rg.addColorStop(0, 'rgba(255,60,90,0)');
    rg.addColorStop(1, `rgba(255,45,75,${a})`);
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, ui.cssW, ui.cssH);
  }
  if (flash > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(flash / .4, 0, 1) * .8;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, ui.cssW, ui.cssH);
    ctx.restore();
  }
}

/* ---------------- 5. 舞台页（设置 / 图鉴 / 选关等 16:9 contain） ---------------- */
const V11J_STAGE_STATES = ['settings', 'bestiary', 'storySelect', 'changelog', 'charshop', 'saveSelect', 'story', 'ending', 'loading', 'offline'];

function v11jUsesStage(st) {
  return V11J_STAGE_STATES.includes(st);
}

function v11jRefreshStageRect() {
  const ui = V11J_UI, S = V11J_SAFE;
  // D v2：合成矩形 = 整块可视画布 - 安全区，不再额外套 16:9 子框。
  const rx = Math.max(0, S.left), ry = Math.max(0, S.top);
  const rw = Math.max(1, ui.cssW - rx - Math.max(0, S.right));
  const rh = Math.max(1, ui.cssH - ry - Math.max(0, S.bottom));
  const k = Math.min(rw / W, rh / H);
  V11J_STAGE.k = k;
  V11J_STAGE.ox = rx + (rw - W * k) / 2;
  V11J_STAGE.oy = ry + (rh - H * k) / 2;
  V11J_STAGE.rect = { x: rx, y: ry, w: rw, h: rh };
  V11J_STAGE.active = true;
  return V11J_STAGE;
}

function v11jCssToStagePoint(cssX, cssY) {
  const st = v11jRefreshStageRect();
  return {
    x: clamp((cssX - st.ox) / Math.max(.001, st.k), 0, W),
    y: clamp((cssY - st.oy) / Math.max(.001, st.k), 0, H),
  };
}

function v11jStagePointToCss(x, y) {
  const st = v11jRefreshStageRect();
  return { x: st.ox + x * st.k, y: st.oy + y * st.k };
}

function v11jDrawStagePage(t) {
  const ui = V11J_UI;
  v11jRefreshStageRect();
  ctx.save();
  ctx.setTransform(ui.bw / ui.cssW, 0, 0, ui.bh / ui.cssH, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // 可视区整块铺暖色背景：contain 缩放后的左右留白不再是黑条。
  v11jWarmBgCss(ctx, t, 'stage');
  ctx.translate(V11J_STAGE.ox, V11J_STAGE.oy);
  ctx.scale(V11J_STAGE.k, V11J_STAGE.k);
  V11J_LEGACY_DRAW(ctx, t);
  ctx.restore();
}

/* ---------------- 6. 总绘制分发 ---------------- */
function v11jBeginScreenCss() {
  const ui = V11J_UI;
  ctx.setTransform(ui.bw / ui.cssW, 0, 0, ui.bh / ui.cssH, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, ui.cssW, ui.cssH);
}

/* v1.1.3 补充项：手机竖屏门控。整屏深色底 + 居中提示，跳过所有页面绘制。 */
function v11jDrawRotateGate(g, t) {
  const ui = V11J_UI;
  ctx.setTransform(ui.bw / ui.cssW, 0, 0, ui.bh / ui.cssH, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#150e20';
  ctx.fillRect(0, 0, ui.cssW, ui.cssH);

  const cx = ui.cssW / 2, cy = ui.cssH / 2;
  const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(ui.cssW, ui.cssH) * .62);
  rg.addColorStop(0, 'rgba(255,204,77,.12)');
  rg.addColorStop(1, 'rgba(255,204,77,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, ui.cssW, ui.cssH);

  // 淡淡的猫爪 / 星星，避免整屏死黑；全部用程序化绘制（门控直接画在 ctx 上）。
  ctx.save();
  ctx.globalAlpha = .16;
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8 + t * .12;
    const rx = Math.min(ui.cssW * .34, 180);
    const ry = Math.min(ui.cssH * .34, 260);
    drawPaw(ctx, cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, 7 + (i % 3) * 2, C.gold, .8);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawText(ctx, '↻', cx, cy - Math.min(96, ui.cssH * .16), Math.max(52, Math.min(96, ui.cssW * .12)),
    C.gold, { align: 'center', weight: 900, line: 0 });
  drawText(ctx, '请横屏游玩', cx, cy + 8, Math.max(26, Math.min(38, ui.cssW * .052)),
    C.cream, { align: 'center', weight: 900, line: 6 });
  drawText(ctx, '手机端只支持横屏 · 把手机转 90° 就能开打', cx, cy + 52,
    Math.max(13, Math.min(16, ui.cssW * .024)), withAlpha(C.cream, .72),
    { align: 'center', weight: 700, line: 0 });
  drawText(ctx, '如已横屏仍不显示，请点右上角 ⋯ → 在浏览器中打开', cx, cy + 84,
    Math.max(13, Math.min(15, ui.cssW * .033)), withAlpha(C.cream, .58),
    { align: 'center', weight: 700, line: 0 });
  drawText(ctx, '此页忽略点击与触摸 · 横屏后自动恢复', cx, ui.cssH - 30,
    Math.max(13, Math.min(15, ui.cssW * .022)), withAlpha(C.cream, .5),
    { align: 'center', weight: 700, line: 0 });

  if (v11gDomGear) v11gDomGear.style.display = 'none';
}

const V11J_LEGACY_DRAW = draw;
draw = function (g, t) {
  if (v11IsPortraitMobile()) {
    v11jDrawRotateGate(g, time);
    return;
  }
  if (!V11_PROFILE.mobile) {
    V11J_LEGACY_DRAW(g, t);
    return;
  }
  v11jBeginScreenCss();
  const st = state;
  if (st === 'title') {
    v11jDrawTitleCss(ctx, time);
    v11jDrawBannerToastCss(ctx, time);
    v11jSyncGear();
    return;
  }
  if (st === 'modeSelect') {
    v11jDrawModeSelectCss(ctx, time);
    v11jDrawBannerToastCss(ctx, time);
    v11jSyncGear();
    return;
  }
  if (st === 'touchEdit') {
    v11jDrawTouchEditCss(ctx, time);
    v11jSyncGear();
    return;
  }
  if (st === 'upgrade') {
    v11jDrawUpgradeCss(ctx, time);
    v11jSyncGear();
    return;
  }
  if (st === 'victory') {
    v11jDrawVictoryCss(ctx, time);
    v11jDrawBannerToastCss(ctx, time);
    v11jSyncGear();
    return;
  }
  if (V11J_BATTLE_STATES.includes(st)) {
    v11jDrawWorldCss(t);
    if (run && player) v11jDrawHudCss(ctx, time);
    v11jDrawBannerToastCss(ctx, time);
    if (st === 'playing' || st === 'transition') v11jDrawTouchCss(ctx, time);
    if (st === 'paused') v11jDrawPauseCss(ctx, time);
    else if (st === 'dead') v11jDrawDeadCss(ctx, time);
    else if (st === 'gameover') v11jDrawGameoverCss(ctx, time);
    else if (st === 'between') v11jDrawBetweenCss(ctx, time);
    else if (st === 'exitConfirm') v11jDrawExitCss(ctx, time);
    if (transition) v11jDrawTransitionCss(ctx, time);
    v11jSyncGear();
    return;
  }
  v11jDrawStagePage(t);
  v11jSyncGear();
};
/* ---------------- 7. 手机 HUD（屏幕空间，不随相机缩放） ---------------- */
const V11J_GEAR_RECT = { x: 0, y: 0, w: 96, h: 48 };

function v11jHudLayout() {
  const ui = V11J_UI, S = V11J_SAFE;
  // v1.1.3 补充项：手机只做横屏，HUD 固定为横屏右侧数据条。
  const gear = {
    x: ui.cssW - S.right - 10 - V11J_GEAR_RECT.w,
    y: S.top + 8,
    w: V11J_GEAR_RECT.w, h: V11J_GEAR_RECT.h,
  };
  V11J_GEAR_RECT.x = gear.x; V11J_GEAR_RECT.y = gear.y;
  const cx = S.left + 10, cy = S.top + 8;
  const cardW = 330;
  const cardH = 46;
  const card = { x: cx, y: cy, w: cardW, h: cardH };
  const strip = {
    x: cx + cardW + 8, y: cy,
    w: Math.max(150, ui.cssW - (cx + cardW + 8) - S.right - 10 - V11J_GEAR_RECT.w - 10),
    h: 46,
  };
  const schoolY = strip.y + strip.h + 6;
  const buildY = schoolY + 24;
  const bossY = buildY + 30;
  return { gear, card, strip, schoolY, buildY, bossY };
}

function v11jDrawHudCss(g, t) {
  if (!run || !player) return;
  const ui = V11J_UI, S = V11J_SAFE;
  const L = v11jHudLayout();
  const th = run.theme || THEMES[0];
  g.save();
  g.globalAlpha = 1;

  // ------- 状态卡：头像 / LV / 形态 / HP / XP -------
  const c = L.card;
  fillRound(g, c.x + 3, c.y + 4, c.w, c.h, 13, 'rgba(43,32,48,.28)');
  fillRound(g, c.x, c.y, c.w, c.h, 13, V11_THEME.panel);
  strokeRound(g, c.x, c.y, c.w, c.h, 13, V11_THEME.line, 2.2);
  circle(g, c.x + 21, c.y + c.h / 2, 14, withAlpha(C.gold, .95), C.ink, 2.4);
  drawCatHead(g, c.x + 21, c.y + c.h / 2 + 1, 10.5, player.form || 0, t);
  drawText(g, `LV.${player.level}`, c.x + 40, c.y + 11, 13, C.ink, { weight: 900, line: 0 });
  const formName = (() => {
    const af = typeof v11hActiveSchoolForm === 'function' ? v11hActiveSchoolForm() : null;
    if (af) return af.name;
    if (typeof v11hCurrentCat === 'function') return v11hCurrentCat().name;
    return (FORMS[player.form || 0] || FORMS[0]).name;
  })();
  drawText(g, formName, c.x + 86, c.y + 11, 10, C.inkSoft, { weight: 800, line: 0 });
  drawText(g, `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`,
    c.x + c.w - 9, c.y + 11, 9, withAlpha(C.ink, .72), { align: 'right', weight: 800, line: 0 });

  const hpRatio = clamp(player.hp / Math.max(1, player.maxHp), 0, 1);
  const hpx = c.x + 40, hpw = c.w - 49;
  fillRound(g, hpx - 1, c.y + 20, hpw + 2, 13, 6.5, C.ink);
  fillRound(g, hpx, c.y + 21, hpw, 11, 5.5, '#684d55');
  if (hpRatio > 0) {
    fillRound(g, hpx, c.y + 21, Math.max(5, hpw * hpRatio), 11, 5.5,
      hpRatio > .5 ? '#5fd0a4' : (hpRatio > .25 ? C.gold : C.coral));
  }
  drawText(g, 'HP', hpx + 4, c.y + 26.5, 8, C.cream, { weight: 900, line: 0 });
  const xpRatio = clamp(player.xp / Math.max(1, player.xpNeed), 0, 1);
  fillRound(g, hpx, c.y + 35, hpw, 6, 3, '#55445e');
  if (xpRatio > 0) fillRound(g, hpx, c.y + 35, Math.max(3, hpw * xpRatio), 6, 3, C.lavender);

  // ------- 关卡 / 房间 / 击杀 -------
  const s = L.strip;
  fillRound(g, s.x + 2, s.y + 3, s.w, s.h, 11, 'rgba(43,32,48,.24)');
  fillRound(g, s.x, s.y, s.w, s.h, 11, V11_THEME.panelWarm);
  strokeRound(g, s.x, s.y, s.w, s.h, 11, V11_THEME.line, 2);
  drawText(g, stageLabel(run.stage, run.mode), s.x + 9, s.y + 14, 12, C.coralDeep, { weight: 900, line: 0 });
  drawText(g, `${(MODES[run.mode] || {}).name || run.mode} · ${th.name}`,
    s.x + 9, s.y + 32, 9, V11_THEME.inkSoft, { weight: 700, line: 0 });
  drawText(g, `击杀 ${formatNum(run.kills)} · 分数 ${formatNum(run.score)}`,
    s.x + s.w - 9, s.y + 14, 10, C.ink, { align: 'right', weight: 800, line: 0 });
  const roomText = `房间 ${run.roomNumber}/${run.roomsThisStage}`;
  const waveText = room ? (room.cleared ? '已清空' : `波次 ${Math.min(room.waveIndex, room.waves.length)}/${room.waves.length}`) : '';
  drawText(g, `${roomText}${waveText ? ' · ' + waveText : ''}`,
    s.x + s.w - 9, s.y + 32, 9, room && room.cleared ? C.coralDeep : V11_THEME.muted,
    { align: 'right', weight: 700, line: 0 });

  // ------- 流派共鸣徽章（最多 5 个，纯图标 + 阶数） -------
  const schools = V11_SCHOOLS.filter(def => run.schools && run.schools[def.id] && run.schools[def.id].tier);
  if (schools.length) {
    let x = s.x;
    const y = L.schoolY;
    drawText(g, '流派', x, y + 12, 9, V11_THEME.muted, { weight: 900, line: 0 });
    x += 25;
    const gap = 4;
    const each = Math.min(58, Math.max(42, Math.floor((s.w - 25 - gap * (schools.length - 1)) / schools.length)));
    for (let i = 0; i < schools.length && i < 5; i++) {
      const def = schools[i];
      const st = run.schools[def.id];
      const tier = st.tier || 1;
      fillRound(g, x, y, each, 17, 8.5, withAlpha(def.color, .18));
      strokeRound(g, x, y, each, 17, 8.5, withAlpha(def.color, tier >= 2 ? .9 : .5), tier >= 2 ? 1.8 : 1.2);
      drawText(g, `${def.short}${tier >= 2 ? '★2' : '★1'}`, x + each / 2, y + 9, 8.5,
        tier >= 2 ? C.ink : withAlpha(C.ink, .82), { align: 'center', weight: 900, line: 0 });
      x += each + gap;
    }
  }

  // ------- BUILD -------
  const b = { x: s.x, y: L.buildY, w: s.w, h: 26 };
  fillRound(g, b.x, b.y, b.w, b.h, 9, withAlpha('#2b2030', .86));
  strokeRound(g, b.x, b.y, b.w, b.h, 9, withAlpha(C.cream, .22), 1.4);
  drawText(g, 'BUILD', b.x + 9, b.y + 13, 9, C.gold, { weight: 900, line: 0 });
  const entries = Object.entries(run.upgradeStacks || {});
  const owned = [];
  for (const [id, count] of entries) {
    const u = SKILL_BY_ID[id];
    if (u && count > 0) owned.push({ u, count });
  }
  const slots = Math.max(0, Math.floor((b.w - 60) / 24));
  if (!owned.length) {
    drawText(g, '升级三选一 · 打造怪招猫猫', b.x + 58, b.y + 13, 8.5, withAlpha(C.cream, .55),
      { weight: 700, line: 0 });
  } else {
    for (let i = 0; i < owned.length && i < slots; i++) {
      const { u, count } = owned[i];
      const ix = b.x + 56 + i * 24;
      fillRound(g, ix, b.y + 4, 20, 18, 6, withAlpha(u.color, .22));
      strokeRound(g, ix, b.y + 4, 20, 18, 6, withAlpha(u.color, .55), 1.2);
      drawUpgradeIcon(g, ix + 10, b.y + 13, 14, count >= 4 ? u.mutateIcon : u.icon, count >= 4 ? C.gold : u.color);
      drawText(g, `${count}`, ix + 18, b.y + 7, 7, C.cream, { align: 'right', weight: 900, line: 0 });
    }
    if (owned.length > slots) {
      drawText(g, `+${owned.length - slots}`, b.x + b.w - 8, b.y + 13, 8, withAlpha(C.cream, .6),
        { align: 'right', weight: 800, line: 0 });
    }
  }

  // ------- BOSS 血条 -------
  const boss = enemies.find(e => e.boss && !e.dead);
  if (boss) {
    const br = { x: s.x, y: L.bossY, w: s.w, h: 26 };
    fillRound(g, br.x, br.y, br.w, br.h, 9, withAlpha('#2a1724', .94));
    strokeRound(g, br.x, br.y, br.w, br.h, 9, withAlpha(C.coral, .62), 1.8);
    drawText(g, boss.enraged ? `狂暴 · ${boss.name}` : boss.name, br.x + 9, br.y + 13, 9.5,
      boss.enraged ? C.coral : C.gold, { weight: 900, line: 0 });
    const barX = br.x + Math.min(120, br.w * .4), barW = br.w - (barX - br.x) - 58;
    fillRound(g, barX, br.y + 10, barW, 7, 3.5, C.ink);
    fillRound(g, barX + 1.5, br.y + 11.5, barW - 3, 4, 2, '#674656');
    const ratio = clamp(boss.hp / Math.max(1, boss.maxHp), 0, 1);
    if (ratio > 0) fillRound(g, barX + 1.5, br.y + 11.5, (barW - 3) * ratio, 4, 2,
      boss.enraged ? C.coral : C.gold);
    drawText(g, `${Math.max(0, Math.ceil(boss.hp))}`, br.x + br.w - 8, br.y + 13, 8,
      withAlpha(C.cream, .7), { align: 'right', weight: 800, line: 0 });
  }

  // 顶部安全区留白提示（仅刘海屏时出现一条极淡的分隔线）
  if (S.top > 0) {
    g.strokeStyle = 'rgba(43,32,48,.14)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(S.left, S.top + .5);
    g.lineTo(ui.cssW - S.right, S.top + .5);
    g.stroke();
  }
  g.restore();
}

/* ---------------- 8. 触控盘（CSS 屏幕空间） ---------------- */
function v11jDrawTouchCss(g, t) {
  if (!run || !player) return;

  const baseY = active ? touchState.joyBaseY : TOUCH_JOY.y;
  const joyR = TOUCH_JOY.r;
  g.globalAlpha = .3;
  circle(g, baseX, baseY, joyR, withAlpha('#140c1f', .5), withAlpha(C.cream, .28), 2);
  g.globalAlpha = .46;
  circle(g, baseX, baseY, joyR * .62, null, withAlpha(C.cream, .25), 1.5);
  const knobX = active ? touchState.joyX : baseX;
  const knobY = active ? touchState.joyY : baseY;
  g.globalAlpha = .62;
  circle(g, knobX, knobY, TOUCH_JOY.knob, withAlpha(C.cream, .35), withAlpha(C.ink, .5), 2);
  g.globalAlpha = .85;
  drawPaw(g, knobX, knobY, Math.max(9, joyR * .24), withAlpha(C.cream, .85));

  const atkDown = touchState.attackHeld;
  g.globalAlpha = atkDown ? .92 : .56;
  circle(g, TOUCH_ATTACK.x, TOUCH_ATTACK.y, TOUCH_ATTACK.r,
    atkDown ? withAlpha(C.coral, .58) : withAlpha('#2a1838', .72), withAlpha(C.coral, .82), 2.6);
  drawUpgradeIcon(g, TOUCH_ATTACK.x, TOUCH_ATTACK.y, 40 * (TOUCH_ATTACK.r / 58), 'claw', C.cream);
  drawText(g, '攻击', TOUCH_ATTACK.x, TOUCH_ATTACK.y + TOUCH_ATTACK.r - 11,
    Math.max(9, TOUCH_ATTACK.r * .24), C.cream, { align: 'center', weight: 900, line: 0 });

  g.globalAlpha = .6;
  circle(g, TOUCH_DASH.x, TOUCH_DASH.y, TOUCH_DASH.r, withAlpha('#2a1838', .72), withAlpha(C.mint, .82), 2.4);

function v11jDrawBannerToastCss(g, t) {
  const ui = V11J_UI, S = V11J_SAFE;
  const bannerVisible = state === 'playing' || state === 'transition' || state === 'dead' || state === 'gameover';
  if (banner && bannerVisible) {
    const b = banner;
    const total = Math.max(.01, b.duration);
    const inT = clamp(b.elapsed / .22, 0, 1);
    const outT = clamp((total - b.elapsed) / .35, 0, 1);
    const a = Math.min(easeOut(inT), outT);
    if (a > .01) {
      const w = Math.min(ui.cssW - S.left - S.right - 24, 460);
      const h = 64;
      const x = (ui.cssW - w) / 2;
      const y = S.top + 132 - (1 - easeOut(inT)) * 14;
      g.save();
      g.globalAlpha = a;
      fillRound(g, x + 3, y + 4, w, h, 14, withAlpha(C.ink, .35));
      fillRound(g, x, y, w, h, 14, V11_THEME.panel);
      strokeRound(g, x, y, w, h, 14, V11_THEME.line, 3);
      fillRound(g, x + 6, y + 6, w - 12, 7, 3.5, b.color);
      drawText(g, b.title, ui.cssW / 2, y + 28, 20, C.ink, { align: 'center', weight: 900, line: 0 });
      if (b.subtitle) drawText(g, b.subtitle, ui.cssW / 2, y + 48, 13, V11_THEME.inkSoft,
        { align: 'center', weight: 700, line: 0 });
      g.restore();
    }
  }
  if (toast) {
    const a = clamp(Math.min(1, Math.min(toast.elapsed / .18, (toast.duration - toast.elapsed) / .3)), 0, 1);
    if (a > 0) {
      g.save();
      g.globalAlpha = a;
      g.font = '700 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
      const tw = Math.min(ui.cssW - S.left - S.right - 24, Math.max(180, g.measureText(toast.text).width + 30));
      const x = (ui.cssW - tw) / 2;
      const y = ui.cssH - S.bottom - 118;
      fillRound(g, x + 2, y + 2, tw, 34, 17, withAlpha(C.ink, .3));
      fillRound(g, x, y, tw, 34, 17, withAlpha('#2b1c36', .92));
      strokeRound(g, x, y, tw, 34, 17, withAlpha(toast.color, .55), 1.5);
      drawText(g, toast.text, ui.cssW / 2, y + 18, 13, toast.color,
        { align: 'center', weight: 700, line: 0 });
      g.restore();
    }
  }
}

function v11jDrawTransitionCss(g, t) {
  if (!transition) return;
  const ui = V11J_UI;
  const p = clamp(transition.t / transition.dur, 0, 1);
  const cover = p < .5 ? easeInOut(p * 2) : easeInOut((1 - p) * 2);
  if (cover <= .001) return;
  g.save();
  g.fillStyle = withAlpha('#160e20', cover * .98);
  g.fillRect(0, 0, ui.cssW, ui.cssH);
  if (p > .32 && p < .72) {
    const af = Math.min((p - .32) / .12, (1 - p) / .12);
    g.globalAlpha = clamp(af, 0, 1) * .95;
    g.translate(ui.cssW / 2, ui.cssH / 2);
    g.strokeStyle = withAlpha(C.gold, .8);
    g.lineWidth = 3;
    g.beginPath(); g.arc(0, -10, 48, 0, TAU); g.stroke();
    drawStar(g, 0, -10, 15, 5.5, 5, C.gold, C.ink, 2, t);
    drawText(g, '喵步穿门…', 0, 58, 17, C.cream, { align: 'center', line: 4, weight: 800 });
    g.globalAlpha = 1;
  }
  g.restore();
}

const V11J_UI_RECTS = {
  title: [], mode: [], paused: [], dead: [], gameover: [], between: [],
  exit: [], victory: [], upgrade: [], touchEdit: [],
};

function v11jWarmBgCss(g, t, variant) {
  const ui = V11J_UI;
  const grad = g.createLinearGradient(0, 0, 0, ui.cssH);
  if (variant === 'mode') {
    grad.addColorStop(0, '#fff7e8');
    grad.addColorStop(.55, '#ffe6c8');
    grad.addColorStop(1, '#ffd7bd');
  } else {
    grad.addColorStop(0, '#fff7e8');
    grad.addColorStop(.52, '#ffe9cd');
    grad.addColorStop(1, '#ffddc2');
  }
  g.fillStyle = grad;
  g.fillRect(0, 0, ui.cssW, ui.cssH);

  // 大块暖色光斑
  const blobs = [
    [ui.cssW * .18, ui.cssH * .22, ui.cssW * .55, 'rgba(255,204,77,.16)'],
    [ui.cssW * .92, ui.cssH * .38, ui.cssW * .5, 'rgba(255,150,110,.12)'],
    [ui.cssW * .4, ui.cssH * .92, ui.cssW * .6, 'rgba(140,220,200,.10)'],
  ];
  for (const [x, y, r, color] of blobs) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, color);
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, ui.cssW, ui.cssH);
  }

  // 猫爪纹样
  g.save();
  g.globalAlpha = .09;
  for (let i = 0; i < 10; i++) {
    const x = ((i * 197) % Math.max(1, Math.floor(ui.cssW - 40))) + 20;
    const y = ((i * 311) % Math.max(1, Math.floor(ui.cssH - 60))) + 40;
    drawPaw(g, x, y, 8 + (i % 3) * 3, V11_THEME.ink, .7);
  }
  g.restore();

  // 小星星（呼吸）
  g.save();
  g.globalAlpha = .45;
  for (let i = 0; i < 9; i++) {
    const x = ((i * 173 + 47) % Math.max(1, Math.floor(ui.cssW - 24))) + 12;
    const y = ((i * 257 + 33) % Math.max(1, Math.floor(ui.cssH - 24))) + 12;
    drawStar(g, x, y, 3.4, 1.4, 5, withAlpha(C.gold, .7), null, 0, t * .25 + i);
  }
  g.restore();
}

function v11jModeLayout() {
  const ui = V11J_UI, S = V11J_SAFE;

  const w = Math.max(200, right - left);
  const headerY = S.top + 24;

  const gear = { x: right - 100, y: headerY, w: 100, h: 52 };
  const profileRect = { x: left, y: headerY + 72, w, h: 38 };
  const gapX = 12, gapY = 12, cols = 3;
  const cw = (w - gapX * (cols - 1)) / cols;
  const startY = profileRect.y + profileRect.h + 10;
  const rows = Math.ceil(Math.max(1, MODE_LIST.length) / cols);
  const footerY = ui.cssH - Math.max(S.bottom, 24) - 20;
  const avail = footerY - 20 - startY;
  const ch = Math.max(84, Math.min(126, Math.floor((avail - gapY * (rows - 1)) / Math.max(1, rows))));
  const cards = [];
  for (let i = 0; i < MODE_LIST.length; i++) {
    cards.push({
      x: left + (i % cols) * (cw + gapX),
      y: startY + Math.floor(i / cols) * (ch + gapY),
      w: cw, h: ch,
    });
  }
  const gridBottom = startY + rows * ch + (rows - 1) * gapY;
  return { back, gear, profile: profileRect, cards, gridBottom, footerY };

/* ---------------- 11. 覆盖层：暂停 / 死亡 / 结算 / 退出 / 通关 / 升级 ---------------- */
function v11jVeil(g, alpha) {
  g.fillStyle = `rgba(16,7,19,${alpha})`;
  g.fillRect(0, 0, V11J_UI.cssW, V11J_UI.cssH);
}

function v11jOverlayPanel(g, r, accent) {
  fillRound(g, r.x + 5, r.y + 6, r.w, r.h, 20, 'rgba(43,32,48,.34)');
  fillRound(g, r.x, r.y, r.w, r.h, 20, V11_THEME.panel);
  strokeRound(g, r.x, r.y, r.w, r.h, 20, V11_THEME.line, 3.4);
  fillRound(g, r.x + 8, r.y + 8, r.w - 16, 6, 3, accent || C.gold);
}

function v11jFitLines(g, text, maxW, size, maxLines) {
  const chars = Array.from(String(text || ''));
  const lines = [];
  let cur = '';
  g.save();
  g.font = `700 ${size}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;
  for (const ch of chars) {
    if (!cur) { cur = ch; continue; }
    if (g.measureText(cur + ch).width > maxW) {
      lines.push(cur);
      cur = ch;
      if (lines.length >= maxLines) break;
    } else {
      cur += ch;
    }
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  g.restore();
  return lines;
}

function v11jOverlayTitle(g, c, kicker, title, sub, accent, titleSize) {
  const tSize = titleSize || 32;
  drawText(g, kicker, c.x + c.w / 2, c.y + 20, 14, V11_THEME.muted, { align: 'center', weight: 900, line: 0 });
  drawText(g, title, c.x + c.w / 2, c.y + (tSize >= 46 ? 62 : 52), tSize, C.ink, { align: 'center', weight: 900, line: 0 });
  if (sub) drawText(g, sub, c.x + c.w / 2, c.y + (tSize >= 46 ? 96 : 78), 14, V11_THEME.inkSoft,
    { align: 'center', weight: 700, line: 0 });
  if (accent) fillRound(g, c.x + 10, c.y + (tSize >= 46 ? 100 : (sub ? 90 : 78)), c.w - 20, 3, 1.5, withAlpha(accent, .35));
}

function v11jPauseLayout() {

  const bh = Math.max(48, Math.min(62, Math.floor((ui.cssH - S.top - S.bottom - headerH - footerH - gap - 12) / 2)));

    ['settings', '设置', '画面 / 音量 / 操控'],

function v11jDrawUpgradeCss(g, t) {

  grad.addColorStop(1, '#3c2340');
  g.fillStyle = grad;
  g.fillRect(0, 0, ui.cssW, ui.cssH);
  g.save();
  g.translate(ui.cssW / 2, ui.cssH / 2);
  g.globalAlpha = .08;
  for (let i = 0; i < 16; i++) {
    g.fillStyle = i % 2 ? C.gold : C.coral;
    g.beginPath(); g.moveTo(0, 0);
    g.arc(0, 0, Math.max(ui.cssW, ui.cssH) * .7, i * TAU / 16, i * TAU / 16 + .12);

    fillRound(g, r.x + 6, r.y + 6, r.w - 12, 5, 2.5, accent);
    const iconR = 18;
    const iconX = r.x + 16 + iconR, iconY = r.y + 38;
    circle(g, iconX, iconY, iconR, withAlpha(accent, .2), withAlpha(accent, .7), 2);
    drawUpgradeIcon(g, iconX, iconY, iconR * 1.35, u.icon, u.color);
    const textX = iconX + iconR + 10;
    const nameSize = 19;
    drawText(g, u.name, textX, iconY + 2, nameSize, C.ink, { weight: 900, line: 0 });
    drawText(g, `Lv.${u.level} → Lv.${u.level + 1}${u.mutate ? ' · 变异' : ''}`,
      textX, iconY + 22, 14, accent, { weight: 800, line: 0 });
    const descW = r.w - (textX - r.x) - 12;
    const maxDesc = Math.max(1, Math.min(4, Math.floor((r.h - 96) / 17)));
    const descLines = v11jFitLines(g, u.desc, descW, 14, maxDesc);
    const descY = r.y + 76;
    descLines.forEach((line, li) => {
      drawText(g, line, textX, descY + li * 18, 14, C.inkSoft, { weight: 700, line: 0 });
    });
    drawText(g, `${i + 1}`, r.x + r.w - 12, r.y + r.h - 12, 14, withAlpha(C.ink, .35),
      { align: 'right', weight: 900, line: 0 });
    g.restore();
    V11J_UI_RECTS.upgrade.push({ id: 'card' + i, x: r.x, y: r.y, w: r.w, h: r.h });
  }

  const left = v11iRefreshLeft();
  const rr = L.refresh;
  const rh = mouse.space === 'css' && pointRect(mouse, rr);
  fillRound(g, rr.x, rr.y, rr.w, rr.h, 12,
    left > 0 ? (rh ? withAlpha(C.gold, .34) : withAlpha(C.gold, .16)) : withAlpha('#3a2c46', .55));
  strokeRound(g, rr.x, rr.y, rr.w, rr.h, 12,
    left > 0 ? (rh ? C.gold : withAlpha(C.gold, .62)) : withAlpha(C.cream, .22), rh ? 2.6 : 1.8);
  drawText(g, left > 0 ? `🔄 刷新候选（剩 ${left} 次）` : '🔄 刷新（已用完）',
    rr.x + rr.w / 2, rr.y + rr.h / 2, 18, left > 0 ? C.cream : withAlpha(C.cream, .45),
    { align: 'center', weight: 900, line: 0 });
  V11J_UI_RECTS.upgrade.push({ id: 'refresh', ...rr });

  const total = Object.values((run && run.upgradeStacks) || {}).reduce((s, v) => s + v, 0);
  drawText(g, `已装配 ${Object.keys((run && run.upgradeStacks) || {}).length} 种 · 共 ${total} 层增益 · 点击卡片选择`,
    ui.cssW / 2, L.footerY, 14, withAlpha(C.cream, .5), { align: 'center', weight: 700, line: 0 });
}

/* ----- 操控位置编辑 ----- */

function v11jDrawTouchEditCss(g, t) {

  // 真实触点

}
/* ---------------- 12. 输入映射（手机 CSS 空间 / 舞台页逻辑空间） ---------------- */
const V11J_LEGACY_UPDATE_POINTER = updatePointer;
const V11J_LEGACY_TOUCH_POINT = touchPoint;
const V11J_LEGACY_HANDLE_DOWN = handleDown;
const V11J_LEGACY_TOUCH_START = handleTouchStart;
const V11J_LEGACY_TOUCH_MOVE = handleTouchMove;
const V11J_LEGACY_TOUCH_END = handleTouchEnd;

function v11jClientToCss(ev) {
  const r = canvas.getBoundingClientRect();
  const x = (Number(ev.clientX) || 0) - r.left;
  const y = (Number(ev.clientY) || 0) - r.top;
  return { x: clamp(x, 0, Math.max(1, r.width)), y: clamp(y, 0, Math.max(1, r.height)) };
}

function v11jInBattle() {
  return state === 'playing' || state === 'transition' || state === 'paused' ||
    state === 'dead' || state === 'gameover' || state === 'between' || state === 'exitConfirm';
}

/* 任意逻辑点 / CSS 点 / 世界点 → 屏幕 CSS 点。 */
function v11jPointToCss(x, y, space) {
  if (space === 'logical') return v11jStagePointToCss(Number(x) || 0, Number(y) || 0);
  if (space === 'world') {
    if (V11J_CAM.active) return v11jWorldToCss(Number(x) || 0, Number(y) || 0);
    return { x: Number(x) || 0, y: Number(y) || 0 };
  }
  return { x: Number(x) || 0, y: Number(y) || 0 };
}

updatePointer = function (ev) {
  if (!V11_PROFILE.mobile) {
    V11J_LEGACY_UPDATE_POINTER(ev);
    mouse.space = 'desktop';
    V11J_POINTER.space = 'desktop';
    return;
  }
  const pt = v11jClientToCss(ev);
  V11J_POINTER.cssX = pt.x;
  V11J_POINTER.cssY = pt.y;
  V11J_POINTER.space = 'css';
  mouse.inside = pt.x >= 0 && pt.x <= V11J_UI.cssW && pt.y >= 0 && pt.y <= V11J_UI.cssH;
  if (v11jUsesStage(state)) {
    const p = v11jCssToStagePoint(pt.x, pt.y);
    mouse.x = clamp(p.x, 0, W);
    mouse.y = clamp(p.y, 0, H);
    mouse.space = 'stage';
    V11J_POINTER.space = 'stage';
    return;
  }
  // 暂停 / 结算 / 通关 / 升级等屏幕层用 CSS 坐标，保证按钮 hover 命中。
  if (V11J_CUSTOM_STATES.indexOf(state) >= 0) {
    mouse.x = pt.x;
    mouse.y = pt.y;
    mouse.space = 'css';
    return;
  }
  if (v11jInBattle()) {
    v11jUpdateCamera();
    const p = v11jCssToWorld(pt.x, pt.y);
    mouse.x = clamp(p.x, 0, W);
    mouse.y = clamp(p.y, 0, H);
    mouse.space = 'world';
    if (player && !player.dead) updateAim();
    return;
  }
  mouse.x = pt.x;
  mouse.y = pt.y;
  mouse.space = 'css';
};

touchPoint = function (ev) {
  if (!V11_PROFILE.mobile) return V11J_LEGACY_TOUCH_POINT(ev);
  return v11jClientToCss(ev);
};

function v11jSyntheticMouseEvent(ev) {
  return { button: 0, clientX: ev.clientX, clientY: ev.clientY, preventDefault() {} };
}

/* ---------------- 13. 自定义页按钮分发 ---------------- */
function v11jRectHit(rects, pt) {
  for (const r of rects) {
    if (r && pointRect(pt, r)) return r;
  }
  return null;
}

function v11jDispatchTitleTap(id) {
  if (!id) return;
  if (id === 'pwaClose') { v11jDismissHomeCard(); return; }
  if (id === 'pwaCard') {
    showToast('Safari 分享 → 添加到主屏幕 · 全屏更像游戏', C.gold, 2.6);
    sfx('click');
    return;
  }
  if (id === 'start') {
    sfx('click');
    if (!profile) {
      V11_PAGES.pendingMode = '_modes';
      v11OpenSaveSelect('start');
    } else {
      V11_PAGES.pendingMode = null;
      v11OpenModeSelect('home');
    }
    return;
  }
  if (id === 'save') { v11OpenSaveSelect('home'); return; }
  if (id === 'charshop') { v11hOpenCharShop('title'); return; }
  if (id === 'bestiary') { openBestiary(); return; }
  if (id === 'changelog') { v11OpenChangelog('title'); return; }
  if (id === 'settings') { openSettings('title'); return; }
  if (id === 'exit') {
    sfx('click');
    if (window.nyanDesktop && window.nyanDesktop.quit) {
      try { window.nyanDesktop.quit(); } catch (e) { /* 忽略 */ }
    } else {
      showToast('网页版请直接关闭标签页 · 进度已保存在本机', C.lavender, 2.8);
    }
  }
}

function v11jDispatchModeTap(id) {
  if (!id) return;
  if (id === 'back') { v11ReturnFromModeSelect(); return; }
  if (id === 'settings') {
    sfx('click');
    V11G_SETTINGS_BACK = 'modeSelect';
    openSettings('title');
    return;
  }
  if (id.indexOf('mode:') === 0) {
    const modeId = id.slice(5);
    if (!MODES[modeId]) return;
    if (!profile) {
      V11_PAGES.pendingMode = modeId;
      showToast('先选一份档案，再进入' + (MODES[modeId].name || '模式'), C.coral, 2.4);
      v11OpenSaveSelect('mode');
      return;
    }
    sfx('click');
    startModeFromHome(modeId);
    clearInput();
  }
}

function v11jDispatchCustomTap(px, py) {
  const pt = { x: px, y: py };
  const st = state;
  if (st === 'dead') return;
  if (st === 'title') {
    const r = v11jRectHit(V11J_UI_RECTS.title, pt);
    v11jDispatchTitleTap(r && r.id);
    return;
  }
  if (st === 'modeSelect') {
    const r = v11jRectHit(V11J_UI_RECTS.mode, pt);
    v11jDispatchModeTap(r && r.id);
    return;
  }
  if (st === 'paused') {
    const r = v11jRectHit(V11J_UI_RECTS.paused, pt);
    if (!r) return;
    if (r.id === 'resume') resumeGame();
    else if (r.id === 'save') persistProfile(true);
    else if (r.id === 'settings') openSettings('paused');
    else if (r.id === 'exit') openExitConfirm();
    return;
  }
  if (st === 'gameover') {
    const r = v11jRectHit(V11J_UI_RECTS.gameover, pt);
    if (!r) return;
    if (r.id === 'restart') { sfx('click'); restartCurrentStage(); clearInput(); }
    else if (r.id === 'saveLeave') { sfx('click'); exitCurrentMode(true); }
    else if (r.id === 'noSaveLeave') { sfx('click'); exitCurrentMode(false); }
    return;
  }
  if (st === 'between') {
    const r = v11jRectHit(V11J_UI_RECTS.between, pt);
    if (!r) return;
    if (r.id === 'continue') continueBetween();
    else if (r.id === 'save') persistProfile(true);
    else if (r.id === 'exit') exitCurrentMode(false);
    return;
  }
  if (st === 'exitConfirm') {
    const r = v11jRectHit(V11J_UI_RECTS.exit, pt);
    if (!r) return;
    if (r.id === 'saveExit') exitCurrentMode(true);
    else if (r.id === 'exit') exitCurrentMode(false);
    else if (r.id === 'cancel') { state = 'paused'; clearInput(); sfx('click'); }
    return;
  }
  if (st === 'victory') {
    const r = v11jRectHit(V11J_UI_RECTS.victory, pt);
    if (!r) return;
    if (r.id === 'next') v11iVictoryContinue();
    else if (r.id === 'back') v11iVictoryBack();
    return;
  }
  if (st === 'upgrade') {
    const r = v11jRectHit(V11J_UI_RECTS.upgrade, pt);
    if (!r) return;
    if (r.id === 'refresh') { v11iRefreshUpgradeCards(); return; }
    if (r.id.indexOf('card') === 0) {
      const i = Number(r.id.slice(4));
      if (i >= 0 && i < upgradeCards.length) selectUpgrade(i);
    }
    return;
  }
  if (st === 'touchEdit') {
    const r = v11jRectHit(V11J_UI_RECTS.touchEdit, pt);
    if (!r) return;
    if (r.id === 'done') { state = 'settings'; settingsDrag = null; clearInput(); sfx('click'); }
    else if (r.id === 'reset') v11ResetTouchCfg();
  }
}

/* ---------------- 14. handleDown：手机全量分发 ---------------- */
handleDown = function (ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  // v1.1.3 补充项：竖屏门控页忽略所有点击。
  if (v11IsPortraitMobile()) return;
  updatePointer(ev);
  initAudio();
  if (!V11_PROFILE.mobile) { V11J_LEGACY_HANDLE_DOWN(ev); return; }

  const st = state;
  const pt = { x: V11J_POINTER.cssX, y: V11J_POINTER.cssY };
  if (V11J_CUSTOM_STATES.indexOf(st) >= 0) {
    if (st === 'dead') return;
    v11jDispatchCustomTap(pt.x, pt.y);
    return;
  }
  if (v11jUsesStage(st)) {
    // 舞台页：沿用逻辑坐标的旧点击分发（含存档 / 设置 / 图鉴 / 剧情）。
    V11J_LEGACY_HANDLE_DOWN(ev);
    return;
  }
  if (v11jInBattle()) {
    if ((st === 'playing' || st === 'transition') && run && player) {
      if (pointRect(pt, V11J_GEAR_RECT)) { sfx('click'); openSettings('playing'); return; }
      const w = v11jCssToWorld(pt.x, pt.y);
      mouse.x = clamp(w.x, 0, W);
      mouse.y = clamp(w.y, 0, H);
      mouse.inside = true;
      mouse.space = 'world';
      if (!player.dead) {
        player.aim = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        if (st === 'playing' && clickCooldown <= 0 && player.attackTimer <= 0) performAttack();
      }
      mouse.down = true;
    }
    return;
  }
  V11J_LEGACY_HANDLE_DOWN(ev);
};

/* ---------------- 15. 触摸：CSS 空间摇杆 / 触控编辑 ---------------- */
function v11jTouchEditDrag(pt) {
  const ui = V11J_UI, cfg = V11_TOUCH_CFG;
  if (V11_TE.zone === 'joy') {
    cfg.joyAx = clamp(pt.x / Math.max(1, ui.cssW), 0, 1);
    cfg.joyAy = clamp(pt.y / Math.max(1, ui.cssH), 0, 1);
  } else {
    cfg.rightAx = clamp(pt.x / Math.max(1, ui.cssW), 0, 1);
    cfg.rightAy = clamp(pt.y / Math.max(1, ui.cssH), 0, 1);
  }
  v11ApplyTouchCfg();
}

function v11jTouchStartCss(ev) {
  const pt = v11jClientToCss(ev);
  touchState.lastTouchAt = performance.now();
  touchState.usingTouch = true;
  touchActive = true;
  initAudio();

  if (state === 'touchEdit') {
    const r = v11jRectHit(V11J_UI_RECTS.touchEdit, pt);
    if (r && r.id === 'done') { state = 'settings'; settingsDrag = null; clearInput(); sfx('click'); return; }
    if (r && r.id === 'reset') { v11ResetTouchCfg(); return; }
    const joyDist = Math.hypot(pt.x - TOUCH_JOY.x, pt.y - TOUCH_JOY.y);
    const rightDist = Math.min(
      Math.hypot(pt.x - TOUCH_ATTACK.x, pt.y - TOUCH_ATTACK.y),
      Math.hypot(pt.x - TOUCH_DASH.x, pt.y - TOUCH_DASH.y));
    if (joyDist <= TOUCH_JOY.r + 42 || pt.x < V11J_UI.cssW / 2) {
      V11_TE.zone = 'joy';
      V11_TE.dragId = ev.pointerId;
      v11jTouchEditDrag(pt);
      return;
    }
    if (rightDist <= TOUCH_ATTACK.r + 42) {
      V11_TE.zone = 'right';
      V11_TE.dragId = ev.pointerId;
      v11jTouchEditDrag(pt);
    }
    return;
  }

  if (V11J_CUSTOM_STATES.indexOf(state) >= 0 || v11jUsesStage(state) || !v11jInBattle()) {
    handleDown(v11jSyntheticMouseEvent(ev));
    return;
  }

  if (pointRect(pt, V11J_GEAR_RECT)) { sfx('click'); openSettings('playing'); return; }

  // 顶部 HUD / 安全区不当作战斗输入，防误触。
  if (pt.y < V11J_SAFE.top + 110) return;

  if (pt.x < V11J_UI.cssW / 2) {
    if (touchState.joyId === null) {
      touchState.joyId = ev.pointerId;
      touchState.joyBaseX = pt.x;
      touchState.joyBaseY = pt.y;
      updateJoystick(pt);
    }
    return;
  }
  if (touchState.attackId === null &&
      Math.hypot(pt.x - TOUCH_ATTACK.x, pt.y - TOUCH_ATTACK.y) <= TOUCH_ATTACK.r + 18) {
    touchState.attackId = ev.pointerId;
    touchState.attackHeld = true;
    return;
  }
  if (touchState.dashId === null &&
      Math.hypot(pt.x - TOUCH_DASH.x, pt.y - TOUCH_DASH.y) <= TOUCH_DASH.r + 18) {
    touchState.dashId = ev.pointerId;
    if (clickCooldown <= 0 && state === 'playing') tryDash();
    return;
  }
  v11jUpdateCamera();
  const w = v11jCssToWorld(pt.x, pt.y);
  mouse.x = clamp(w.x, 0, W);
  mouse.y = clamp(w.y, 0, H);
  mouse.inside = true;
  mouse.space = 'world';
  if (player && !player.dead) {
    player.aim = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    if (state === 'playing' && player.attackTimer <= 0) performAttack();
  }
}

handleTouchStart = function (ev) {
  ev.preventDefault();
  // v1.1.3 补充项：竖屏门控页忽略所有触摸。
  if (v11IsPortraitMobile()) return;
  if (!V11_PROFILE.mobile) { V11J_LEGACY_TOUCH_START(ev); return; }
  v11jTouchStartCss(ev);
};

handleTouchMove = function (ev) {
  if (v11IsPortraitMobile()) { ev.preventDefault(); return; }
  if (!V11_PROFILE.mobile) { V11J_LEGACY_TOUCH_MOVE(ev); return; }
  if (!touchState.usingTouch) return;
  ev.preventDefault();
  const pt = v11jClientToCss(ev);
  if (state === 'touchEdit') {
    if (V11_TE.dragId === ev.pointerId) v11jTouchEditDrag(pt);
    return;
  }
  if (state === 'settings' && settingsDrag) {
    updatePointer(ev);
    setSettingsSliderFromPointer(settingsDrag);
    return;
  }
  if (touchState.joyId === ev.pointerId) updateJoystick(pt);
};

handleTouchEnd = function (ev) {
  if (v11IsPortraitMobile()) { ev.preventDefault(); return; }
  if (!V11_PROFILE.mobile) { V11J_LEGACY_TOUCH_END(ev); return; }
  if (state === 'touchEdit') {
    ev.preventDefault();
    if (V11_TE.dragId === ev.pointerId) V11_TE.dragId = null;
    return;
  }
  settingsDrag = null;
  if (touchState.joyId === ev.pointerId) {
    touchState.joyId = null;
    touchState.vec.x = 0; touchState.vec.y = 0;
    touchState.joyX = TOUCH_JOY.x; touchState.joyY = TOUCH_JOY.y;
    touchState.joyBaseX = TOUCH_JOY.x;
    touchState.joyBaseY = TOUCH_JOY.y;
  }
  if (touchState.attackId === ev.pointerId) {
    touchState.attackId = null;
    touchState.attackHeld = false;
  }
  if (touchState.dashId === ev.pointerId) touchState.dashId = null;
};

/* ---------------- 16. 调试点击：手机默认 CSS 坐标 ---------------- */
if (window.__nyan && typeof window.__nyan.clickAt === 'function') {
  const V11J_LEGACY_CLICK_AT = window.__nyan.clickAt;
  window.__nyan.clickAt = function (x, y, space) {
    if (!V11_PROFILE.mobile) return V11J_LEGACY_CLICK_AT(x, y);
    const mode = space || 'css';
    const css = v11jPointToCss(x, y, mode);
    const r = canvas.getBoundingClientRect();
    handleDown({
      button: 0,
      clientX: r.left + css.x,
      clientY: r.top + css.y,
      preventDefault() {},
    });
    return { state, mouse: { x: mouse.x, y: mouse.y }, space: mouse.space };
  };
}
/* ---------------- 17. DOM 设置按钮（手机 96×48，贴右上安全区） ---------------- */
function v11jEnsureGear() {
  if (!V11_PROFILE.mobile) return v11gDomGear;
  try {
    if (typeof v11gEnsureGearCss === 'function') v11gEnsureGearCss();
    if (!v11gDomGear) {
      let btn = document.getElementById('nyan-gear');
      if (!btn) {
        btn = document.createElement('button');
        btn.id = 'nyan-gear';
        btn.type = 'button';
        btn.textContent = '⚙ 设置';
        btn.setAttribute('aria-label', '打开设置');
        btn.style.cssText = [
          'position:fixed', 'z-index:40', 'display:none', 'box-sizing:border-box',
          'min-width:96px', 'min-height:48px', 'padding:0 10px',
          'font:900 15px/1 "Microsoft YaHei","PingFang SC",sans-serif',
          'color:#2b2030', 'background:#fffaf0', 'border:3px solid #2b2030', 'border-radius:14px',
          'box-shadow:0 4px 0 rgba(120,84,60,.28)', 'touch-action:none', 'user-select:none',
          '-webkit-user-select:none', 'cursor:pointer',
        ].join(';');
        btn.addEventListener('pointerdown', ev => {
          ev.preventDefault();
          ev.stopPropagation();
          if (state === 'playing' || state === 'transition') openSettings('playing');
          else if (state === 'paused') openSettings('paused');
          // v1.1.3 补充项：去掉触碰高亮，按下与常态一致。
        }, { passive: false });
        document.body.appendChild(btn);
      }
      btn.style.minWidth = '96px';
      btn.style.minHeight = '48px';
      v11gDomGear = btn;
    }
    return v11gDomGear;
  } catch (e) { return null; }
}

function v11jSyncGear() {
  if (!V11_PROFILE.mobile) {
    if (v11gDomGear) v11gDomGear.style.display = 'none';
    return;
  }
  const btn = v11jEnsureGear();
  if (!btn) return;
  V11J_GEAR_RECT.x = V11J_UI.cssW - V11J_SAFE.right - 10 - V11J_GEAR_RECT.w;
  V11J_GEAR_RECT.y = V11J_SAFE.top + 8;
  const show = !v11IsPortraitMobile() &&
    (state === 'playing' || state === 'transition' || state === 'paused');
  if (!show) { btn.style.display = 'none'; return; }
  const r = canvas.getBoundingClientRect();
  const w = 96, h = 48;
  const left = clamp(r.left + V11J_UI.cssW - V11J_SAFE.right - 10 - w,
    r.left, Math.max(r.left, r.left + r.width - w));
  const top = clamp(r.top + V11J_SAFE.top + 8,
    r.top, Math.max(r.top, r.top + r.height - h));
  if (btn.style.display !== 'block') btn.style.display = 'block';
  btn.style.width = w + 'px';
  btn.style.height = h + 'px';
  btn.style.left = Math.round(left) + 'px';
  btn.style.top = Math.round(top) + 'px';
  btn.style.fontSize = '15px';
}

const V11J_LEGACY_SYNC_GEAR = v11gSyncDomGear;
v11gSyncDomGear = function () {
  if (V11_PROFILE.mobile) { v11jSyncGear(); return; }
  V11J_LEGACY_SYNC_GEAR();
};

/* ---------------- 18. 触控布局同步（手机 CSS / 桌面逻辑） ---------------- */
const V11J_LEGACY_SYNC_TOUCH_LAYOUT = v11SyncTouchLayout;
v11SyncTouchLayout = function () {
  if (V11_PROFILE.mobile) { v11jSyncTouchCss(); return; }
  V11J_LEGACY_SYNC_TOUCH_LAYOUT();
};

/* ---------------- 19. 粒子上限 / 帧率自适应（只降 effectScale） ---------------- */
const V11J_LEGACY_ADD_PARTICLE = addParticle;
addParticle = function (o) {
  if (!V11_PROFILE.mobile) { V11J_LEGACY_ADD_PARTICLE(o); return; }
  const mul = clamp((Number(V11_PROFILE.particleMul) || 1) * (Number(V11_PROFILE.effectScale) || 1), .35, 1);
  const cap = Math.max(60, Math.round(210 * mul));
  if (particles.length > cap) particles.shift();
  particles.push(Object.assign({
    life: .4, max: .4, size: 5, color: C.cream, type: 'circle',
    rot: 0, vr: 0, gravity: 0, drag: .85, alpha: 1,
  }, o));
};

const V11J_LEGACY_UPDATE = update;
const V11J_PERF = { frames: 0, total: 0, drops: 0 };
function v11jTrackPerf(dt) {
  if (!V11_PROFILE.mobile) return;
  const d = Number(dt);
  if (!Number.isFinite(d) || d <= 0 || d > .12) return;
  V11J_PERF.frames++;
  V11J_PERF.total += d;
  if (V11J_PERF.frames < 90) return;
  const avg = V11J_PERF.total / V11J_PERF.frames;
  if (avg > 1 / 45 && V11_PROFILE.effectScale > .65) {
    V11_PROFILE.effectScale = Math.max(.65, V11_PROFILE.effectScale - .1);
    V11J_PERF.drops++;
  }
  V11J_PERF.frames = 0;
  V11J_PERF.total = 0;
}
update = function (dt) {
  V11J_LEGACY_UPDATE(dt);
  v11jTrackPerf(dt);
};
/* ---------------- 20. 调试接口（T4 验收用） ---------------- */
function v11jCopy(obj) {
  try { return JSON.parse(JSON.stringify(obj)); } catch (e) { return Object.assign({}, obj); }
}

function v11jGearSnapshot() {
  if (!v11gDomGear) {
    return {
      exists: false, visible: false, w: 0, h: 0,
      css: { left: 0, top: 0, width: 0, height: 0 }, min: { w: 96, h: 48 },
    };
  }
  const r = v11gDomGear.getBoundingClientRect();
  return {
    exists: true,
    visible: v11gDomGear.style.display !== 'none',
    w: r.width, h: r.height,
    css: { left: r.left, top: r.top, width: r.width, height: r.height },
    min: { w: 96, h: 48 },
    text: v11gDomGear.textContent || '',
  };
}

try {
  const NYAN = window.__nyan;
  if (NYAN) {
    NYAN.v112 = Object.assign(NYAN.v112 || {}, {
      profile: function () {
        return v11jCopy(Object.assign({}, V11_PROFILE, {
          forceMobile: V11J_FORCE_MOBILE,
          touchActive: !!touchActive,
        }));
      },
      camera: function () {
        return {
          active: !!V11J_CAM.active,
          zoom: V11J_CAM.zoom,
          requestedZoom: V11_PROFILE.zoom,
          x: V11J_CAM.x, y: V11J_CAM.y,
          viewW: V11J_CAM.viewW, viewH: V11J_CAM.viewH,
          canvasAspect: V11J_CAM.canvasAspect,
          cropAspect: V11J_CAM.cropAspect,
          aspectError: V11J_CAM.aspectError,
          canvas: { w: canvas.width, h: canvas.height },
          stats: v11jCopy(V11J_STATS),
        };
      },
      pwa: function () {
        return {
          ios: !!V11J_PWA.ios,
          standalone: !!V11J_PWA.standalone,
          homeDismissed: !!V11J_PWA.homeDismissed,
          homeCardVisible: !!V11J_PWA.homeCardVisible,
          homeCloseRect: V11J_PWA.homeCloseRect ? v11jCopy(V11J_PWA.homeCloseRect) : null,
          homeCardRect: V11J_PWA.homeCardRect ? v11jCopy(V11J_PWA.homeCardRect) : null,
          manifestHref: V11J_PWA.manifestHref,
          manifestError: V11J_PWA.manifestError,
          manifest: V11J_PWA.manifest ? v11jCopy(V11J_PWA.manifest) : null,
          iconBytes: V11J_PWA.iconData ? V11J_PWA.iconData.length : 0,
          safe: v11jCopy(V11J_SAFE),
          displayMode: (function () {
            try { return matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser'; }
            catch (e) { return 'unknown'; }
          })(),
        };
      },
      domGear: v11jGearSnapshot,
      mobileUi: function () {
        return {
          mode: V11J_UI.mode,
          cssW: V11J_UI.cssW, cssH: V11J_UI.cssH,
          bw: V11J_UI.bw, bh: V11J_UI.bh, dpr: V11J_UI.dpr,
          canvas: { w: canvas.width, h: canvas.height },
          canvasCss: (function () {
            const r = canvas.getBoundingClientRect();
            return { left: r.left, top: r.top, width: r.width, height: r.height };
          })(),
          safe: v11jCopy(V11J_SAFE),
          portrait: !!V11_PROFILE.portrait,
          orientation: V11_PROFILE.orientation,
          state,
          custom: V11J_CUSTOM_STATES.indexOf(state) >= 0,
          stage: v11jUsesStage(state),
          battle: v11jInBattle(),
          gear: v11jGearSnapshot(),
          effectScale: V11_PROFILE.effectScale,
          particleMul: V11_PROFILE.particleMul,
        };
      },
      touchLayoutCss: function () {
        return {
          space: 'css',
          joy: { x: TOUCH_JOY.x, y: TOUCH_JOY.y, r: TOUCH_JOY.r, d: TOUCH_JOY.r * 2, knob: TOUCH_JOY.knob },
          attack: { x: TOUCH_ATTACK.x, y: TOUCH_ATTACK.y, r: TOUCH_ATTACK.r, d: TOUCH_ATTACK.r * 2 },
          dash: { x: TOUCH_DASH.x, y: TOUCH_DASH.y, r: TOUCH_DASH.r, d: TOUCH_DASH.r * 2 },
          cfg: v11jCopy(V11_TOUCH_CFG),
          minHit: 44,
          allAtLeast44: [TOUCH_JOY.r * 2, TOUCH_ATTACK.r * 2, TOUCH_DASH.r * 2].every(d => d >= 44),
        };
      },
      stageRect: function () {
        v11jRefreshStageRect();
        return {
          k: V11J_STAGE.k, ox: V11J_STAGE.ox, oy: V11J_STAGE.oy,
          w: W * V11J_STAGE.k, h: H * V11J_STAGE.k,
          canvasAspect: V11J_UI.cssW / Math.max(1, V11J_UI.cssH),
        };
      },
      rects: function () {
        const out = { gear: { x: V11J_GEAR_RECT.x, y: V11J_GEAR_RECT.y, w: V11J_GEAR_RECT.w, h: V11J_GEAR_RECT.h } };
        for (const key of Object.keys(V11J_UI_RECTS)) {
          out[key] = V11J_UI_RECTS[key].map(r => Object.assign({}, r));
        }
        return out;
      },
      /* v1.1.3 补充项：compact 页面包围盒快照，供无重叠 / 安全边距断言使用。 */
      pageRects: function () {
        const cp = arr => (Array.isArray(arr) ? arr.map(r => Object.assign({}, r)) : []);
        const home = {};
        for (const k of Object.keys(V11_HOME_RECTS)) if (V11_HOME_RECTS[k]) home[k] = Object.assign({}, V11_HOME_RECTS[k]);
        return {
          state,
          space: V11_PROFILE.mobile ? 'css' : 'stage',
          size: V11_PROFILE.mobile ? { w: V11J_UI.cssW, h: V11J_UI.cssH } : { w: W, h: H },
          home,
          settings: cp(settingsRects),
          story: cp(storyStageRects),
          mode: cp(V11_MODE_RECTS),
          save: cp(V11_SAVE_RECTS),
          changelog: cp(V11_CHANGELOG_RECTS),
          bestiary: cp(bestiaryRects),
          shop: cp(V11H_SHOP_RECTS),
          ui: Object.keys(V11J_UI_RECTS).reduce((o, k) => { o[k] = cp(V11J_UI_RECTS[k]); return o; }, {}),
        };
      },
      tap: function (x, y, space) {
        if (!window.__nyan || typeof window.__nyan.clickAt !== 'function') return { state };
        return window.__nyan.clickAt(x, y, space || 'css');
      },
      safeArea: function () { return v11jCopy(V11J_SAFE); },
      perf: function () { return v11jCopy(V11J_PERF); },
      setMobileMode: function (on) {
        V11J_FORCE_MOBILE = !!on;
        v11jRefreshProfile();
        V11_PROFILE.effectScale = 1;
        V11J_PERF.frames = 0; V11J_PERF.total = 0; V11J_PERF.drops = 0;
        v11jInjectPwa();
        v11SyncCanvasSize();
        v11jSyncGear();
        return this.profile();
      },
      setSafeArea: function (inset) {
        if (!inset || typeof inset !== 'object') return v11jCopy(V11J_SAFE);
        for (const k of ['top', 'right', 'bottom', 'left']) {
          const v = Number(inset[k]);
          V11J_SAFE[k] = Number.isFinite(v) ? Math.max(0, v) : V11J_SAFE[k];
        }
        v11jSyncTouchCss();
        v11jSyncGear();
        return v11jCopy(V11J_SAFE);
      },
    });
  }
} catch (e) { /* 调试接口失败不能影响游戏 */ }

/* ---------------- 21. 初始化：PWA meta / manifest / 设置按钮 ---------------- */
v11jInjectPwa();
if (V11_PROFILE.mobile) {
  v11jEnsureGear();
  v11jSyncGear();
  v11jSyncTouchCss();
}

/* ================= v1.1 ONLINE LAYER 注入结束 ================= */

// 启动：先进入联网加载页，拉取 config/*.json 后才进入主页。
// 断网 / file:// / 配置损坏都会停在“本游戏需要网络”页，不会进入游戏。
applyViewScale();
lastFrame = performance.now();
requestAnimationFrame(frame);
v11BootGame();

})();
</script>
