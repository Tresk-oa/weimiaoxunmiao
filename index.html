/* ------------------------------------------------------------------
   07D. 总绘制入口
   ------------------------------------------------------------------ */
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') {
    drawTitleScreen(ctx, time);
    const slotMenuHit = slotMenu && slotMenuRects.some(r => pointRect(mouse, r));
    const confirmHit = confirmAction && confirmRects.some(r => pointRect(mouse, r));
    const homeHit = homeModeRects.some(r => pointRect(mouse, r)) ||
      saveSlotRects.some(r => pointRect(mouse, r)) || pointRect(mouse, titleSettingsRect);
    canvas.style.cursor = (slotMenuHit || confirmHit || homeHit) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'storySelect') {
    drawStorySelectScreen(ctx, time);
    canvas.style.cursor = storyStageRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'bestiary') {
    drawBestiaryScreen(ctx, time);
    canvas.style.cursor = bestiaryRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'settings') {
    // 设置页只画自己，不叠战斗世界，保证任何 FPS 下都稳定。
    drawSettingsScreen(ctx, time);
    canvas.style.cursor = settingsRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    drawBannerAndToast(ctx, time);
    drawVolumePill(ctx);
    return;
  }
  if (state === 'story') {
    drawStoryScreen(ctx, time);
    if (story && story.phase === 'gate') {
      canvas.style.cursor = storyGateRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
    } else {
      canvas.style.cursor = pointRect(mouse, storySkipRect) ? 'pointer' : 'default';
    }
    drawVolumePill(ctx);
    return;
  }
  if (state === 'ending') {
    drawEndingScreen(ctx, time);
    canvas.style.cursor = 'pointer';
    drawVolumePill(ctx);
    return;
  }
  if (state === 'upgrade') {
    // §12.1：升级层独立清屏绘制 —— 不画主世界、不应用震屏，只留下静止的三选一。
    drawUpgradeScreen(ctx, time);
    canvas.style.cursor = modalHover >= 0 ? 'pointer' : 'default';
    drawVolumePill(ctx);
    return;
  }

  if (room) drawScene(ctx, time);
  else { ctx.fillStyle = C.bgDeep; ctx.fillRect(0, 0, W, H); }
  drawHUD(ctx, time);
  drawBannerAndToast(ctx, time);
  if (state === 'playing' || state === 'transition') drawTouchControls(ctx, time);

  if (state === 'between') {
    drawBetweenScreen(ctx, time);
    canvas.style.cursor = betweenRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
  } else if (state === 'exitConfirm') {
    drawExitConfirmScreen(ctx, time);
    canvas.style.cursor = exitRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
  } else if (state === 'paused') {
    drawPauseScreen(ctx, time);
    canvas.style.cursor = pauseRects.some(r => pointRect(mouse, r)) ? 'pointer' : 'default';
  } else if (state === 'dead' || state === 'gameover') {
    drawDeathScreen(ctx, time);
    canvas.style.cursor = state === 'gameover' && pointRect(mouse, gameoverRestartRect) ? 'pointer' : 'default';
  } else {
    if (state === 'playing' && mouse.inside && mouse.y > ARENA.y + 10) drawCrosshair(ctx, time);
    canvas.style.cursor = 'none';
  }

  drawTransitionOverlay(ctx, time);
  drawVolumePill(ctx);
}

/* ------------------------------------------------------------------
   08. 输入 / 主循环 / 启动
   ------------------------------------------------------------------ */
function clearInput() {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
}

function updatePointer(ev) {
  const r = canvas.getBoundingClientRect();
  const x = (ev.clientX - r.left) / Math.max(1, r.width) * W;
  const y = (ev.clientY - r.top) / Math.max(1, r.height) * H;
  mouse.x = clamp(x, 0, W);
  mouse.y = clamp(y, 0, H);
  mouse.inside = x >= 0 && x <= W && y >= 0 && y <= H;
  if (player && !player.dead) updateAim();
}

function resumeGame() {
  if (state !== 'paused') return;
  state = 'playing';
  clickCooldown = Math.max(clickCooldown, .12);
  clearInput();
}

window.addEventListener('mousemove', ev => {
  updatePointer(ev);
  if (state === 'settings' && settingsDrag) setSettingsSliderFromPointer(settingsDrag);
}, { passive: true });
window.addEventListener('mouseout', ev => {
  if (!ev.relatedTarget) { mouse.inside = false; mouse.down = false; settingsDrag = null; }
});
window.addEventListener('mouseup', () => { mouse.down = false; settingsDrag = null; });
canvas.addEventListener('contextmenu', ev => ev.preventDefault());

/* 鼠标 / 触摸共用的 UI 点击入口，避免两套点击逻辑分叉。 */
function handleDown(ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  updatePointer(ev);
  initAudio();

  if (state === 'settings') {
    const hit = settingsRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.type === 'scale') applyScaleSetting(hit.value);
      else if (hit.type === 'fps') applyFpsSetting(hit.value);
      else if (hit.type === 'mute') {
        setMuted(!settings.muted);
        showVolumePill();
        sfx('click');
      } else if (hit.type === 'master' || hit.type === 'sfx') {
        settingsDrag = hit.type;
        setSettingsSliderFromPointer(hit.type);
      } else if (hit.type === 'fullscreen') toggleFullscreen();
      else if (hit.type === 'save') saveSettingsWithNotice();
      else if (hit.type === 'bestiary') openBestiary();
      else if (hit.type === 'back') closeSettings();
    }
    return;
  }
  if (state === 'bestiary') {
    const hit = bestiaryRects.find(r => pointRect(mouse, r));
    if (hit && hit.id === 'back') closeBestiary();
    return;
  }
  if (state === 'storySelect') {
    const hit = storyStageRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'back') returnToHome();
      else startStoryStage(hit.stage);
    }
    return;
  }
  if (state === 'title') {
    // 确认弹窗优先；其次槽位菜单；最后才是主页卡片。
    if (confirmAction) {
      if (confirmRects[0] && pointRect(mouse, confirmRects[0])) {
        const act = confirmAction;
        confirmAction = null;
        act.run();
      } else if (confirmRects[1] && pointRect(mouse, confirmRects[1])) {
        confirmAction = null;
        sfx('click');
      }
      return;
    }
    if (slotMenu) {
      const hit = slotMenuRects.find(r => pointRect(mouse, r));
      if (!hit) { if (!pointRect(mouse, { x: W / 2 - 180, y: H / 2 - 138, w: 360, h: 276 })) closeSlotMenu(); return; }
      const slot = slotMenu.slot;
      if (hit.id === 'load') {
        activateProfile(slot);
        closeSlotMenu();
      } else if (hit.id === 'overwrite') {
        if (slotCache[slot]) {
          confirmAction = {
            title: `覆盖存档位 ${slot}？`, text: '当前档案会整体写入该槽位，原有进度将被替换。',
            okLabel: '覆盖写入', run: () => { overwriteProfileAt(slot); closeSlotMenu(); },
          };
        } else if (profile) {
          confirmAction = {
            title: `写入存档位 ${slot}？`, text: '空槽位将写入当前档案的完整进度。',
            okLabel: '写入', run: () => { overwriteProfileAt(slot); closeSlotMenu(); },
          };
        } else {
          showToast('请先新建一个档案', C.coral, 2.2);
        }
        sfx('click');
      } else if (hit.id === 'delete') {
        confirmAction = {
          title: `删除存档位 ${slot}？`, text: '该槽位的五个模式进度会一起删除，无法恢复。',
          okLabel: '删除档案', run: () => { deleteProfileAt(slot); closeSlotMenu(); },
        };
        sfx('click');
      } else if (hit.id === 'cancel' || hit.id === 'info') {
        closeSlotMenu();
        sfx('click');
      }
      return;
    }
    if (pointRect(mouse, titleSettingsRect)) {
      openSettings('title');
      return;
    }
    const modeHit = homeModeRects.find(r => pointRect(mouse, r));
    if (modeHit) {
      startModeFromHome(modeHit.id);
      clearInput();
      return;
    }
    const slotHit = saveSlotRects.find(r => pointRect(mouse, r));
    if (slotHit) {
      if (!slotCache[slotHit.slot]) {
        confirmAction = {
          title: `新建存档位 ${slotHit.slot}？`, text: '将创建一份包含五个模式空进度的新档案。',
          okLabel: '新建档案', run: () => { createProfileAt(slotHit.slot, false); closeSlotMenu(); },
        };
        sfx('click');
      } else {
        openSlotMenu(slotHit.slot);
      }
      return;
    }
    return;
  }
  if (state === 'story') {
    if (story && story.phase === 'gate') {
      const hit = storyGateRects.find(r => pointRect(mouse, r));
      if (hit) {
        if (hit.id === 'replay') beginStoryPlay();
        else finishStory(true);
      } else if (pointRect(mouse, storySkipRect)) {
        finishStory(true);
      }
    } else if (story) {
      if (pointRect(mouse, storySkipRect)) finishStory(true);
      else nextStoryLine();
    }
    return;
  }
  if (state === 'ending') {
    returnToHome();
    clearInput();
    return;
  }
  if (state === 'upgrade') {
    if (modalHover >= 0 && upgradeCardRects[modalHover]) selectUpgrade(modalHover);
    else {
      for (let i = 0; i < upgradeCardRects.length; i++) {
        if (pointRect(mouse, upgradeCardRects[i])) { selectUpgrade(i); break; }
      }
    }
    return;
  }
  if (state === 'between') {
    const hit = betweenRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'continue') continueBetween();
      else if (hit.id === 'save') persistProfile(true);
      else if (hit.id === 'exit') exitCurrentMode(false);
    }
    return;
  }
  if (state === 'exitConfirm') {
    const hit = exitRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'saveExit') exitCurrentMode(true);
      else if (hit.id === 'exit') exitCurrentMode(false);
      else if (hit.id === 'cancel') { state = 'paused'; clearInput(); sfx('click'); }
    }
    return;
  }
  if (state === 'paused') {
    const hit = pauseRects.find(r => pointRect(mouse, r));
    if (hit) {
      if (hit.id === 'resume') resumeGame();
      else if (hit.id === 'save') persistProfile(true);
      else if (hit.id === 'settings') openSettings('paused');
      else if (hit.id === 'exit') openExitConfirm();
    }
    return;
  }
  if (state === 'gameover') {
    if (pointRect(mouse, gameoverRestartRect)) {
      restartCurrentStage();
      clearInput();
    }
    return;
  }
  if (state === 'dead') {
    // 等待死亡演出结束；R 随时可以提前重开。
    return;
  }
  if (state !== 'playing' && state !== 'transition') return;

  // HUD 右上角音量按钮：与设置面板、[ / ]、M 共用同一个 settings.muted。
  if (pointRect(mouse, hudMuteRect)) {
    setMuted(!settings.muted);
    showVolumePill();
    sfx('click');
    return;
  }

  mouse.down = true;
  if (state === 'playing' && clickCooldown <= 0 && player && !player.dead && player.attackTimer <= 0) {
    performAttack();
  }
}

canvas.addEventListener('mousedown', ev => {
  if (performance.now() - touchState.lastTouchAt < 480) return;
  handleDown(ev);
});

/* ------------------------------------------------------------------
   08B. 触摸操作（§12）：左下摇杆 + 右下攻击 / 冲刺
   ------------------------------------------------------------------ */
const IS_TOUCH_DEVICE = (() => {
  try {
    if (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) return true;
    return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  } catch (e) { return false; }
})();
const TOUCH_JOY = { x: 152, y: 584, r: 76, knob: 30 };
const TOUCH_ATTACK = { x: 1168, y: 566, r: 58 };
const TOUCH_DASH = { x: 1044, y: 634, r: 42 };

function touchPoint(ev) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) / Math.max(1, r.width) * W,
    y: (ev.clientY - r.top) / Math.max(1, r.height) * H,
  };
}

function updateJoystick(pt) {
  let dx = pt.x - TOUCH_JOY.x, dy = pt.y - TOUCH_JOY.y;
  const max = TOUCH_JOY.r - TOUCH_JOY.knob * .4;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  touchState.joyX = TOUCH_JOY.x + dx;
  touchState.joyY = TOUCH_JOY.y + dy;
  const mag = Math.min(1, len / max);
  const nlen = Math.hypot(dx, dy);
  const norm = nlen > 0.001 ? { x: dx / nlen, y: dy / nlen } : { x: 0, y: 0 };
  touchState.vec.x = norm.x * mag;
  touchState.vec.y = norm.y * mag;
}

function releaseTouchControls() {
  touchState.joyId = null;
  touchState.attackId = null;
  touchState.dashId = null;
  touchState.attackHeld = false;
  touchState.vec.x = 0; touchState.vec.y = 0;
  touchState.joyX = TOUCH_JOY.x; touchState.joyY = TOUCH_JOY.y;
}

function handleTouchStart(ev) {
  ev.preventDefault();
  touchState.lastTouchAt = performance.now();
  touchState.usingTouch = true;
  touchActive = true;
  initAudio();
  const pt = touchPoint(ev);

  // 非战斗界面：交给共用 UI 点击逻辑。
  if (state !== 'playing' && state !== 'transition') {
    handleDown({ button: 0, clientX: ev.clientX, clientY: ev.clientY, preventDefault() {} });
    return;
  }

  // 战斗界面：摇杆 / 攻击 / 冲刺三块热区。
  if (touchState.joyId === null && Math.hypot(pt.x - TOUCH_JOY.x, pt.y - TOUCH_JOY.y) <= TOUCH_JOY.r + 22) {
    touchState.joyId = ev.pointerId;
    updateJoystick(pt);
    return;
  }
  if (touchState.attackId === null && Math.hypot(pt.x - TOUCH_ATTACK.x, pt.y - TOUCH_ATTACK.y) <= TOUCH_ATTACK.r + 18) {
    touchState.attackId = ev.pointerId;
    touchState.attackHeld = true;
    return;
  }
  if (touchState.dashId === null && Math.hypot(pt.x - TOUCH_DASH.x, pt.y - TOUCH_DASH.y) <= TOUCH_DASH.r + 18) {
    touchState.dashId = ev.pointerId;
    if (clickCooldown <= 0 && state === 'playing') tryDash();
    return;
  }
  // 点空白区域 = 朝点击方向挥爪（方便单手玩）。
  mouse.x = clamp(pt.x, 0, W); mouse.y = clamp(pt.y, 0, H); mouse.inside = true;
  if (player && !player.dead) {
    player.aim = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    if (state === 'playing' && player.attackTimer <= 0) performAttack();
  }
}

function handleTouchMove(ev) {
  if (!touchState.usingTouch) return;
  ev.preventDefault();
  if (touchState.joyId === ev.pointerId) updateJoystick(touchPoint(ev));
}

function handleTouchEnd(ev) {
  if (touchState.joyId === ev.pointerId) {
    touchState.joyId = null;
    touchState.vec.x = 0; touchState.vec.y = 0;
    touchState.joyX = TOUCH_JOY.x; touchState.joyY = TOUCH_JOY.y;
  }
  if (touchState.attackId === ev.pointerId) {
    touchState.attackId = null;
    touchState.attackHeld = false;
  }
  if (touchState.dashId === ev.pointerId) touchState.dashId = null;
}

canvas.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'touch') handleTouchStart(ev);
}, { passive: false });
canvas.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'touch') handleTouchMove(ev);
}, { passive: false });
canvas.addEventListener('pointerup', ev => {
  if (ev.pointerType === 'touch') handleTouchEnd(ev);
}, { passive: false });
canvas.addEventListener('pointercancel', ev => {
  if (ev.pointerType === 'touch') handleTouchEnd(ev);
}, { passive: false });

function drawTouchControls(g, t) {
  if (!touchState.usingTouch && !IS_TOUCH_DEVICE) return;
  if (!run || !player) return;
  g.save();
  // 摇杆底盘
  g.globalAlpha = .32;
  circle(g, TOUCH_JOY.x, TOUCH_JOY.y, TOUCH_JOY.r, withAlpha('#140c1f', .5), withAlpha(C.cream, .25), 2);
  g.globalAlpha = .5;
  circle(g, TOUCH_JOY.x, TOUCH_JOY.y, TOUCH_JOY.r * .62, null, withAlpha(C.cream, .25), 1.5);
  const knobX = touchState.joyId !== null ? touchState.joyX : TOUCH_JOY.x;
  const knobY = touchState.joyId !== null ? touchState.joyY : TOUCH_JOY.y;
  g.globalAlpha = .62;
  circle(g, knobX, knobY, TOUCH_JOY.knob, withAlpha(C.cream, .35), withAlpha(C.ink, .5), 2);
  g.globalAlpha = .85;
  drawPaw(g, knobX, knobY, 18, withAlpha(C.cream, .8));

  // 攻击按钮
  const atkDown = touchState.attackHeld;
  g.globalAlpha = atkDown ? .9 : .55;
  circle(g, TOUCH_ATTACK.x, TOUCH_ATTACK.y, TOUCH_ATTACK.r,
    atkDown ? withAlpha(C.coral, .55) : withAlpha('#2a1838', .7), withAlpha(C.coral, .8), 3);
  drawUpgradeIcon(g, TOUCH_ATTACK.x, TOUCH_ATTACK.y, 44, 'claw', C.cream);
  drawText(g, '攻击', TOUCH_ATTACK.x, TOUCH_ATTACK.y + TOUCH_ATTACK.r - 14, 12, C.cream, { align: 'center', weight: 900 });

  // 冲刺按钮
  g.globalAlpha = .6;
  circle(g, TOUCH_DASH.x, TOUCH_DASH.y, TOUCH_DASH.r, withAlpha('#2a1838', .7), withAlpha(C.mint, .8), 3);
  drawUpgradeIcon(g, TOUCH_DASH.x, TOUCH_DASH.y, 30, 'boot', C.mint);
  drawText(g, '冲刺', TOUCH_DASH.x, TOUCH_DASH.y + TOUCH_DASH.r - 12, 11, C.cream, { align: 'center', weight: 900 });
  g.restore();

  // 竖屏提示（不强制旋转）
  if (window.innerHeight > window.innerWidth) {
    fillRound(g, W / 2 - 190, 88, 380, 40, 14, withAlpha('#1b1029', .82));
    strokeRound(g, W / 2 - 190, 88, 380, 40, 14, withAlpha(C.gold, .55), 2);
    drawText(g, '建议横屏游玩 · 竖屏也能操作', W / 2, 108, 13, C.gold, { align: 'center', weight: 800 });
  }
}

if (IS_TOUCH_DEVICE) {
  // 只显示触摸控件；真正触摸后 usingTouch 才会切换瞄准逻辑，避免触屏笔记本鼠标瞄准失灵。
  touchActive = true;
}

window.addEventListener('keydown', ev => {
  const code = ev.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(code)) ev.preventDefault();

  const first = !keys[code];
  keys[code] = true;
  if (!first && ev.repeat) return;
  initAudio();

  // 主音量快捷键：任何界面都实时生效，并自动解除静音。
  if (code === 'BracketLeft' || code === 'BracketRight') {
    const delta = code === 'BracketRight' ? .05 : -.05;
    setMasterVolume(settings.masterVolume + delta, true, true);
    showVolumePill();
    sfx('click');
    return;
  }

  // 全局静音：HUD 按钮 / 设置面板 / M 键共用同一个值。
  if (code === 'KeyM') {
    setMuted(!settings.muted);
    showVolumePill();
    if (!['title', 'settings', 'story', 'ending'].includes(state)) {
      showToast(settings.muted ? '静音了 · 按 M 恢复猫叫与音效' : '音效已开启 · 喵！', settings.muted ? C.lavender : C.mint, 1.5);
    }
    return;
  }

  // §11 全屏快捷键：任何界面可用。
  if (code === 'KeyF') {
    toggleFullscreen();
    return;
  }

  if (code === 'KeyR') {
    // §5 死亡与存档分离：R 从当前关卡的检查点重开，而不是回到标题。
    if (['playing', 'paused', 'dead', 'gameover'].includes(state)) {
      restartCurrentStage();
      clearInput();
    } else if (state === 'ending') {
      returnToHome();
      clearInput();
    }
    return;
  }

  if (code === 'Escape') {
    if (state === 'settings') {
      closeSettings();
    } else if (state === 'bestiary') {
      closeBestiary();
    } else if (state === 'storySelect') {
      returnToHome();
    } else if (state === 'story') {
      finishStory(true);
    } else if (state === 'title') {
      if (confirmAction) { confirmAction = null; sfx('click'); }
      else if (slotMenu) { closeSlotMenu(); sfx('click'); }
    } else if (state === 'playing') {
      state = 'paused';
      shake = 0; flash = 0;
      clearInput();
      releaseTouchControls();
      sfx('click');
    } else if (state === 'paused') {
      resumeGame();
      sfx('click');
    } else if (state === 'between') {
      continueBetween();
    } else if (state === 'exitConfirm') {
      state = 'paused'; clearInput(); sfx('click');
    } else if (state === 'ending') {
      returnToHome();
    }
    return;
  }

  if (state === 'settings' || state === 'bestiary') return;
  if (state === 'storySelect') return;

  if (state === 'title') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      if (confirmAction) confirmAction = null;
      else if (slotMenu) closeSlotMenu();
      else startModeFromHome(MODE_LIST[0]);
      clearInput();
    } else if (code === 'KeyO') {
      openSettings('title');
    }
    return;
  }

  if (state === 'between') {
    if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') continueBetween();
    else if (code === 'KeyS') persistProfile(true);
    return;
  }
  if (state === 'exitConfirm') {
    if (code === 'KeyS') exitCurrentMode(true);
    else if (code === 'Enter' || code === 'NumpadEnter') exitCurrentMode(false);
    return;
  }

  if (state === 'story') {
    if (story && story.phase === 'gate') {
      if (code === 'Enter' || code === 'NumpadEnter') beginStoryPlay();
      else if (code === 'Space') finishStory(true);
    } else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') {
      nextStoryLine();
    }
    return;
  }

  if (state === 'ending') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      returnToHome();
      clearInput();
    }
    return;
  }

  if (state === 'paused') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      resumeGame();
      sfx('click');
    } else if (code === 'KeyO') {
      openSettings('paused');
    } else if (code === 'KeyS') {
      persistProfile(true);
    } else if (code === 'KeyE') {
      openExitConfirm();
    }
    return;
  }

  if (state === 'upgrade') {
    if (code === 'Digit1' || code === 'Numpad1') selectUpgrade(0);
    else if (code === 'Digit2' || code === 'Numpad2') selectUpgrade(1);
    else if (code === 'Digit3' || code === 'Numpad3') selectUpgrade(2);
    return;
  }

  if (state === 'dead' || state === 'gameover') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      restartCurrentStage();
      clearInput();
    }
    return;
  }

  if (state === 'playing') {
    if (code === 'Space' && clickCooldown <= 0) tryDash();
    if (code === 'KeyJ' && player && player.attackTimer <= 0) performAttack();
  }
});

window.addEventListener('keyup', ev => {
  keys[ev.code] = false;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(ev.code)) ev.preventDefault();
});

window.addEventListener('blur', () => {
  clearInput();
  mouse.inside = false;
  if (state === 'playing') state = 'paused';
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInput();
    if (state === 'playing') state = 'paused';
  }
});

function update(dt) {
  // 音量浮动提示在所有界面都独立计时，不依赖战斗状态。
  if (volumePill) {
    volumePill.t += dt;
    if (volumePill.t >= volumePill.until) volumePill = null;
  }

  if (state === 'title') {
    time += dt;
    return;
  }
  if (state === 'settings' || state === 'storySelect' || state === 'bestiary') {
    time += dt;
    return;
  }
  if (state === 'between' || state === 'exitConfirm') {
    time += dt;
    updateEffects(dt);
    return;
  }
  if (state === 'story') {
    // §12.1 / §3：剧情期间完全冻结战斗，只推进对白与演出计时。
    time += dt;
    updateStory(dt);
    return;
  }
  if (state === 'ending') {
    time += dt;
    if (ending) ending.t += dt;
    return;
  }
  if (state === 'paused' || state === 'upgrade') {
    // 障碍、敌人、UI 全部冻结；三选一卡片用自己的入场计时。
    if (state === 'upgrade') modalOpenTime += dt;
    return;
  }

  time += dt;

  if (state === 'playing') {
    updateGameplay(dt);
    updateEffects(dt);
    updateMusic(dt);
    // openUpgrade 可能在 updatePickups 内触发；此处不再推进世界。
    if (state === 'playing' && room && room.clearAnim > 0) room.clearAnim = Math.max(0, room.clearAnim - dt);
  } else if (state === 'transition') {
    updateEffects(dt);
    updateTransition(dt);
    updateMusic(dt);
  } else if (state === 'dead') {
    deathTimer += dt;
    if (player) player.deathT += dt;
    updateEffects(dt);
    updateMusic(dt);
    if (deathTimer >= 1.45) finishGameOver();
  } else if (state === 'gameover') {
    updateEffects(dt);
  }
}

function frame(now) {
  // FPS 上限：requestAnimationFrame + 帧间隔封顶，绝不无脑跑满。
  // 0 = 无限制；30/60/120 都严格按最小帧间隔跳过多余回调。
  const cap = settings.fps;
  if (cap > 0) {
    const minInterval = 1000 / cap - .6;
    if (now - lastFrame < minInterval) {
      requestAnimationFrame(frame);
      return;
    }
  }
  const raw = (now - lastFrame) / 1000;
  lastFrame = now;
  // 低帧率时限制单帧步长，避免穿墙和丢失碰撞；30FPS 时仍能完整模拟。
  const dt = clamp(raw, 0, .05);
  update(dt);
  draw();
  debugFrameCount++;
  requestAnimationFrame(frame);
}

/* 仅在 URL 带 #debug 时挂接验证接口，不影响正常游玩体验。 */
const DEBUG_MODE = /(?:^|[#&?])debug(?:[&#=]|$)/i.test(location.hash + '&' + location.search);
if (DEBUG_MODE) {
  window.__nyan = {
    version: '1.0',
    start(seed) {
      startNewRun(seed);
      return { state, seed: run && run.seedHex };
    },
    snapshot() {
      return {
        state,
        time: +time.toFixed(2),
        mode: run ? run.mode : null,
        modeName: run ? run.modeName : null,
        stageLabel: run ? stageLabel(run.stage, run.mode) : null,
        theme: run && run.theme ? run.theme.id : null,
        module: run && run.module ? run.module.id : null,
        stage: run ? run.stage : 0,
        roomNumber: run ? run.roomNumber : 0,
        roomsThisStage: run ? run.roomsThisStage : 0,
        waveIndex: room ? room.waveIndex : 0,
        waveCount: room ? room.waves.length : 0,
        cleared: !!room && room.cleared,
        doorOpen: !!room && room.doorOpen,
        level: player ? player.level : 0,
        xp: player ? +player.xp.toFixed(1) : 0,
        xpNeed: player ? player.xpNeed : 0,
        hp: player ? +player.hp.toFixed(1) : 0,
        maxHp: player ? player.maxHp : 0,
        form: player ? player.form : 0,
        pendingLevelUps: run ? run.pendingLevelUps : 0,
        enemies: enemies.filter(e => !e.dead).length,
        boss: enemies.filter(e => e.boss && !e.dead).length,
        projectiles: projectiles.length,
        pickups: pickups.length,
        kills: run ? run.kills : 0,
        score: run ? run.score : 0,
        build: run ? Object.assign({}, run.upgradeStacks) : {},
        cards: upgradeCards.map(u => u.name),
        deathTimer: +deathTimer.toFixed(2),
      };
    },
    player() { return player; },
    run() { return run; },
    room() { return room; },
    enemies() { return enemies; },
    pickups() { return pickups; },
    setMouse(x, y, down) {
      mouse.x = clamp(x, 0, W); mouse.y = clamp(y, 0, H); mouse.inside = true;
      if (typeof down === 'boolean') mouse.down = down;
      if (player) updateAim();
    },
    attack() {
      if (state !== 'playing' || !player || player.dead) return false;
      player.attackTimer = 0; performAttack(); return true;
    },
    dash() {
      if (state !== 'playing' || !player || player.dead) return false;
      return tryDash();
    },
    grantXP(amount) {
      if (!player) return 0;
      player.xp += Math.max(0, amount);
      checkLevelUp();
      return player.level;
    },
    choose(index) { selectUpgrade(index); return state; },
    grantSkill(id, level) {
      if (!player || !run || !SKILL_BY_ID[id]) return false;
      const skill = SKILL_BY_ID[id];
      const target = clamp(Math.floor(Number(level) || 1), 1, 4);
      let cur = run.upgradeStacks[id] || 0;
      while (cur < target) { cur++; applySkillLevel(skill, cur); }
      return {
        id,
        level: run.upgradeStacks[id],
        mutateIcon: run.upgradeStacks[id] >= 4 ? skill.mutateIcon : skill.icon,
        icon: skill.icon,
      };
    },
    grantRecipe(recipeId) {
      if (!run || !player) return false;
      const recipe = SKILL_RECIPES.find(r => r.id === recipeId);
      if (!recipe) return false;
      run.recipesDone[recipe.id] = true;
      const result = SKILL_BY_ID[recipe.result];
      if (result && (run.upgradeStacks[result.id] || 0) < 4) applySkillLevel(result, 1);
      return { recipe: recipe.id, result: recipe.result, level: run.upgradeStacks[recipe.result] || 0 };
    },
    previewUpgradeCards() {
      if (!run || !player) return [];
      return makeUpgradeCards().map(u => ({
        kind: u.kind, id: u.id, name: u.name, level: u.level || 0,
        maxLevel: u.maxLevel || 1, mutate: !!u.mutate,
        icon: u.kind === 'skill' && u.level >= 3 && u.skill ? u.skill.mutateIcon : u.icon,
      }));
    },
    openUpgradeNow() {
      if (!run || !player || state === 'upgrade') return state;
      run.pendingLevelUps = Math.max(1, run.pendingLevelUps || 0);
      openUpgrade();
      return state;
    },
    contentSummary() {
      const defs = Object.keys(ENEMY_DEFS).map(k => ENEMY_DEFS[k]);
      return {
        modes: MODE_LIST.slice(),
        skills: SKILLS.length,
        baseSkills: SKILLS.filter(s => !s.derived).length,
        derivedSkills: SKILLS.filter(s => s.derived).length,
        recipes: SKILL_RECIPES.length,
        saveSlots: SAVE_SLOTS,
        storyChapters: STORY_CHAPTERS.length,
        storyStageCount: STAGE_CFG.storyStageCount,
        chapters: ENEMY_MODULES.map(m => ({ id: m.id, name: m.name, mobs: m.mobs.length, boss: m.boss })),
        enemies: defs.length,
        mobs: defs.filter(d => !d.boss).length,
        bosses: defs.filter(d => d.boss).length,
        forms: FORMS.length,
        artFunctions: Object.keys(ENEMY_ART).length,
      };
    },
    startStage(modeId, stage, seed) {
      const valid = MODE_LIST.includes(modeId);
      const target = clamp(Math.floor(Number(stage) || 1), 1, 999);
      startModeStage(valid ? modeId : 'easy', target, {
        fresh: true,
        seed: seed === undefined || seed === null ? makeSeed() : Number(seed) >>> 0,
        countRun: false,
      });
      return { state, mode: run.mode, stage: run.stage, theme: run.theme.id, module: run.module.id };
    },
    bossAt(stage) {
      const target = clamp(Math.floor(Number(stage) || STAGE_CFG.bossEvery), 1, STAGE_CFG.finalStage);
      if (!run) startNewRun();
      run.stage = target;
      beginStage(target, true);
      enterRoom(run.roomsThisStage, true);
      return {
        state, stage: run.stage, theme: run.theme.id, module: run.module.id,
        bossKeys: enemies.filter(e => e.boss).map(e => e.type),
        bossNames: enemies.filter(e => e.boss).map(e => e.name),
      };
    },
    settingsSnapshot() { return Object.assign({}, settings); },
    openSettingsPanel(from) { openSettings(from || 'title'); return state; },
    closeSettingsPanel() { closeSettings(); return state; },
    setScale(v) { applyScaleSetting(v); return settings.scale; },
    setFps(v) { applyFpsSetting(v); return settings.fps; },
    setMaster(v) { setMasterVolume(v, true, true); showVolumePill(); return settings.masterVolume; },
    setSfx(v) { setSfxVolume(v, true); return settings.sfxVolume; },
    setMutedValue(v) { setMuted(v); showVolumePill(); return settings.muted; },
    frames() { return debugFrameCount; },
    resetFrames() { debugFrameCount = 0; return 0; },
    storySnapshot() {
      if (!story) return null;
      return {
        id: story.chapter.id,
        stage: story.chapter.stage,
        phase: story.phase,
        line: story.line,
        lines: story.chapter.lines.length,
        who: story.chapter.lines[story.line] && story.chapter.lines[story.line].who,
        text: story.chapter.lines[story.line] && story.chapter.lines[story.line].text,
        reveal: Math.floor(story.reveal),
        seenBefore: story.seenBefore,
        final: !!story.chapter.final,
      };
    },
    startStoryAt(stage) {
      // 调试用：确保当前处于剧情模式对应关卡，再播放该关的过场。
      const target = clamp(Math.floor(Number(stage) || 1), 1, STAGE_CFG.storyStageCount);
      if (!run || run.mode !== 'story' || run.stage !== target) {
        startModeStage('story', target, { fresh: true, countRun: false });
      }
      const chapter = storyChapterForStage(target, 'story');
      if (!chapter) return null;
      startStory(chapter, () => { state = ending ? 'ending' : (run ? 'playing' : 'title'); });
      return chapter.id;
    },
    finishStoryNow() { finishStory(true); return state; },
    advanceStory() { nextStoryLine(); return state; },
    storySeen(id) { return !!storyProgress.seen[id]; },
    setStorySeen(id, seen) {
      if (seen === false) delete storyProgress.seen[id];
      else storyProgress.seen[id] = true;
      saveStoryProgress();
      return !!storyProgress.seen[id];
    },
    clearStorySeen() { storyProgress.seen = {}; saveStoryProgress(); },
    forceStageClear(stage) {
      if (!run) startNewRun();
      const target = Math.max(1, Math.min(STAGE_CFG.finalStage, Number(stage) || 1));
      run.stage = target;
      beginStage(target, true);
      enterRoom(run.roomsThisStage, true);
      room.cleared = true; room.doorOpen = true; room.doorOpenDelay = 0;
      player.x = DOOR.x; player.y = DOOR.y + DOOR.r * .6;
      beginDoorTransition();
      return { stage: target, state };
    },
    endingScreen() {
      if (!run) startNewRun();
      startEnding();
      return state;
    },
    setForm(n) {
      const f = clamp(Number(n) || 0, 0, 2);
      if (player) {
        player.form = f;
        player.r = FORMS[f].radius;
        player.upgradeFx = .4;
      }
      return f;
    },
    hurt(amount) {
      if (!player || player.dead) return false;
      player.invuln = 0;
      hurtPlayer(amount, player.x + 30, player.y + 10);
      return !player.dead;
    },
    heal() { if (player) player.hp = player.maxHp; },
    killAll() {
      for (const e of enemies.slice()) if (!e.dead) damageEnemy(e, 999999, { noCrit: true });
    },
    finishWaves() {
      if (!room) return false;
      room.waveIndex = room.waves.length;
      for (const e of enemies.slice()) if (!e.dead) damageEnemy(e, 999999, { noCrit: true });
      return true;
    },
    enterDoor() {
      if (!room || !player) return false;
      room.cleared = true; room.doorOpen = true; room.doorOpenDelay = 0;
      player.x = DOOR.x; player.y = DOOR.y + DOOR.r * .6;
      beginDoorTransition();
      return true;
    },
    bossRoom() {
      if (!run) startNewRun();
      run.stage = STAGE_CFG.bossEvery;
      beginStage(run.stage, true);
      enterRoom(run.roomsThisStage, true);
      return { stage: run.stage, room: run.roomNumber };
    },
    die() {
      if (!player || player.dead) return false;
      player.invuln = 0;
      hurtPlayer(999999, player.x + 20, player.y);
      return state;
    },
    finishGameOver() { finishGameOver(); return state; },
    meta() { return Object.assign({}, meta); },
    storageKey: STORAGE_KEY,

    /* ---- 存档位 / 五模式验收接口 ---- */
    profileSummary() {
      const modes = {};
      if (profile) {
        for (const id of MODE_IDS) {
          const p = profile.modes[id];
          modes[id] = {
            bestStage: p.bestStage,
            clearedStage: p.clearedStage,
            unlockedStage: p.unlockedStage,
            level: p.level,
            form: p.form,
            unlocked: p.unlocked,
            seenCount: Object.keys(p.seen || {}).length,
            checkpoint: p.checkpoint ? { stage: p.checkpoint.stage, seed: p.checkpoint.seed, at: p.checkpoint.at } : null,
          };
        }
      }
      return {
        state,
        activeSlot,
        stats: profile ? Object.assign({}, profile.stats) : null,
        modes,
        slots: slotCache.slice(1).map((p, i) => p ? {
          slot: i + 1,
          updatedAt: p.updatedAt,
          storyCleared: p.stats.storyCleared,
          story: p.modes.story.clearedStage,
          easy: p.modes.easy.bestStage,
        } : null),
      };
    },
    slotRaw(slot) {
      try { return localStorage.getItem(SAVE_PREFIX + slot); } catch (e) { return null; }
    },
    createSlot(slot, overwrite) {
      const n = clamp(Math.floor(Number(slot) || 0), 1, SAVE_SLOTS);
      return createProfileAt(n, !!overwrite);
    },
    activateSlot(slot) { return activateProfile(slot, false); },
    deleteSlotAt(slot) { return deleteProfileAt(slot); },
    overwriteSlotAt(slot) { return overwriteProfileAt(slot); },
    saveNow() { return persistProfile(true); },
    clearAllSaves() {
      for (let i = 1; i <= SAVE_SLOTS; i++) {
        try { localStorage.removeItem(SAVE_PREFIX + i); } catch (e) { /* 忽略 */ }
      }
      try { localStorage.removeItem(LAST_SLOT_KEY); } catch (e) { /* 忽略 */ }
      activeSlot = 0;
      profile = null;
      meta = { kills: 0, bestStage: 0, bestScore: 0, runs: 0 };
      storyProgress = { seen: {} };
      slotCache = new Array(SAVE_SLOTS + 1).fill(null);
      slotMenu = null;
      confirmAction = null;
      return true;
    },
    setModeProgress(modeId, patch) {
      if (!profile || !profile.modes[modeId] || !patch) return false;
      const p = profile.modes[modeId];
      for (const key of ['bestStage', 'clearedStage', 'unlockedStage', 'level', 'form', 'unlocked']) {
        if (patch[key] !== undefined) p[key] = patch[key];
      }
      if (patch.storyCleared !== undefined) profile.stats.storyCleared = !!patch.storyCleared;
      syncProfileStats();
      refreshSlotCache();
      return true;
    },

    /* ---- 主页 / 模式 / 剧情入口 ---- */
    startMode(modeId) { startModeFromHome(modeId); return state; },
    openStorySelect() {
      if (!profile || !activeSlot) { showToast('请先在主页选择或新建存档位', C.coral, 2.4); return state; }
      state = 'storySelect';
      slotMenu = null;
      return state;
    },
    storyUnlocked() { return storyUnlockedStage(); },
    storyStage(stage) { startStoryStage(stage); return state; },
    storyList() { return storyStageRects.map(r => ({ ...r })); },
    storyChapters() {
      return STORY_CHAPTERS.map(c => ({ id: c.id, stage: c.stage, title: c.title, subtitle: c.subtitle, final: !!c.final }));
    },
    betweenSnapshot() { return betweenInfo ? Object.assign({}, betweenInfo) : null; },
    continueBetweenNow() { continueBetween(); return state; },
    pauseGame() { if (state === 'playing') { state = 'paused'; sfx('click'); } return state; },
    openExitConfirmNow() { openExitConfirm(); return state; },
    exitMode(saveFirst) { exitCurrentMode(!!saveFirst); return state; },
    openBestiaryScreen() { openBestiary(); return state; },
    closeBestiaryScreen() { closeBestiary(); return state; },
    settingsNotice() { return settingsNotice ? Object.assign({}, settingsNotice) : null; },
    saveSettingsNow() { saveSettingsWithNotice(); return settingsNotice ? Object.assign({}, settingsNotice) : null; },
    toggleFullscreenNow() { toggleFullscreen(); return !!document.fullscreenElement; },

    /* ---- 主页可点击区域 / 输入模拟（供无头验收使用） ---- */
    titleRects() {
      return {
        modes: homeModeRects.map(r => ({ ...r })),
        slots: saveSlotRects.map(r => ({ ...r })),
        settings: { ...titleSettingsRect },
        slotMenu: slotMenuRects.map(r => ({ ...r })),
        confirm: confirmRects.map(r => ({ ...r })),
        pause: pauseRects.map(r => ({ ...r })),
        between: betweenRects.map(r => ({ ...r })),
        exit: exitRects.map(r => ({ ...r })),
        bestiary: bestiaryRects.map(r => ({ ...r })),
        story: storyStageRects.map(r => ({ ...r })),
        settingsButtons: settingsRects.map(r => ({ ...r })),
      };
    },
    clickAt(x, y) {
      const r = canvas.getBoundingClientRect();
      const clientX = r.left + (Number(x) || 0) / W * r.width;
      const clientY = r.top + (Number(y) || 0) / H * r.height;
      handleDown({ button: 0, clientX, clientY, preventDefault() {} });
      return { state, mouse: { x: mouse.x, y: mouse.y }, slotMenu: slotMenu ? slotMenu.slot : 0, confirm: !!confirmAction };
    },
    setMousePoint(x, y) {
      mouse.x = clamp(Number(x) || 0, 0, W);
      mouse.y = clamp(Number(y) || 0, 0, H);
      mouse.inside = true;
      return { x: mouse.x, y: mouse.y };
    },
    modeMultipliers(modeId, stage) {
      return {
        hpMul: modeStatMul(modeId, 'hpMul', stage),
        dmgMul: modeStatMul(modeId, 'dmgMul', stage),
        countMul: modeStatMul(modeId, 'countMul', stage),
        dropMul: modeStatMul(modeId, 'dropMul', stage),
        mobility: (MODES[modeId] || MODES.easy).mobility,
      };
    },
  };
  console.log('[NYAN] debug interface ready:', '#debug');
}

   ================================================================== */

};

function v11Version() {
  return (V11_CONFIG.changelog && V11_CONFIG.changelog.current) ||
    V11_CONFIG.gameVersion || V11_VERSION_FALLBACK;
}

function v11CompactLayout() {
  try {
    return IS_TOUCH_DEVICE || window.innerWidth < 720 || window.innerHeight < 480;
  } catch (e) { return false; }
}

/* ---------------- 线上 JSON 加载 ---------------- */
const V11_CONFIG_FILES = ['game', 'enemies', 'skills', 'story', 'changelog'];

async function v11FetchJson(name) {
  const url = 'config/' + name + '.json';
  const res = await fetch(url, { cache: 'no-store', credentials: 'same-origin' });
  if (!res.ok) throw new Error(`${url} 拉取失败（HTTP ${res.status}）`);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error(`${url} 不是合法 JSON`); }
}

async function v11LoadRemoteConfig() {
  if (location.protocol === 'file:') {
    throw new Error('当前是 file:// 本地打开，请用 http(s) 访问');
  }
  const entries = await Promise.all(V11_CONFIG_FILES.map(async name => [name, await v11FetchJson(name)]));
  const data = Object.fromEntries(entries);
  v11ApplyConfig(data);
  return data;
}

function v11ApplyConfig(data) {
  const game = data.game || {};
  const enemies = data.enemies || {};
  const skills = data.skills || {};
  const story = data.story || {};
  const changelog = data.changelog || {};

  // ---- 数值 / 关卡 ----
  if (game.balance) Object.assign(BALANCE, game.balance);
  if (game.stageCfg) Object.assign(STAGE_CFG, game.stageCfg);
  // ---- 模式 ----
  if (game.modes) {
    for (const [id, m] of Object.entries(game.modes)) {
      if (!MODES[id]) MODES[id] = {};
      Object.assign(MODES[id], m);
    }
    const list = Array.isArray(game.modeList) ? game.modeList : Object.keys(game.modes);
    MODE_LIST.length = 0;
    for (const id of list) if (MODES[id]) MODE_LIST.push(id);
  }
  // ---- 敌人 ----
  if (enemies.defs) {
    for (const key of Object.keys(ENEMY_DEFS)) delete ENEMY_DEFS[key];
    for (const [key, def] of Object.entries(enemies.defs)) ENEMY_DEFS[key] = def;
  }
  if (Array.isArray(enemies.modules) && enemies.modules.length) {
    ENEMY_MODULES.length = 0;
    for (const m of enemies.modules) ENEMY_MODULES.push(m);
  }
  if (Array.isArray(enemies.themes) && enemies.themes.length) {
    THEMES.length = 0;
    for (const t of enemies.themes) THEMES.push(t);
  }
  // ---- 技能 / 配方 ----
  v11ApplySkillsConfig(skills);
  // ---- 剧情 ----
  if (Array.isArray(story.chapters) && story.chapters.length) {
    STORY_CHAPTERS.length = 0;
    for (const c of story.chapters) STORY_CHAPTERS.push(c);
  }
  // ---- 版本日志 ----
  if (Array.isArray(changelog.versions) && changelog.versions.length) {
    V11_CONFIG.changelog = changelog;
  }
  V11_CONFIG.gameVersion = game.version || null;
  V11_CONFIG.files = {
    game: !!data.game, enemies: !!data.enemies, skills: !!data.skills,
    story: !!data.story, changelog: !!data.changelog,
  };
  V11_CONFIG.loaded = true;
  V11_CONFIG.loading = false;
  V11_CONFIG.error = '';
  V11_CONFIG.loadedAt = Date.now();
  v11AfterConfig();
}

/* 技能配置合并：旧技能保留内联 apply，新技能用 effect 注册表驱动。
   这样 30+ 技能与 13 条配方都能从 JSON 在线扩充，不必改 HTML。 */
function v11ApplySkillsConfig(cfg) {
  if (!Array.isArray(cfg.skills) || !cfg.skills.length) return;
  const legacyById = {};
  for (const s of SKILLS) legacyById[s.id] = s;
  SKILLS.length = 0;
  for (const raw of cfg.skills) {
    const old = legacyById[raw.id];
    const merged = Object.assign({}, old || {}, raw);
    if (!merged.apply || typeof merged.apply !== 'function') merged.apply = v11SkillApply(merged.id);
    if (!merged.mutateIcon) merged.mutateIcon = merged.icon;
    SKILLS.push(merged);
  }
  for (const key of Object.keys(SKILL_BY_ID)) delete SKILL_BY_ID[key];
  for (const s of SKILLS) SKILL_BY_ID[s.id] = s;
  if (Array.isArray(cfg.recipes)) {
    SKILL_RECIPES.length = 0;
    for (const r of cfg.recipes) {
      SKILL_RECIPES.push(Object.assign({}, r, {
        icon: r.icon || 'star',
        color: r.color || C.gold,
      }));
    }
  }
}

/* 新技能默认 apply：等级本身写入 run.upgradeStacks；
   持续型效果由 updateSkillSystems 按等级实时计算，避免存档字段膨胀。 */
function v11SkillApply(id) {
  return function (p, lv) { /* 统计型/持续型技能无需写入玩家字段 */ };
}

function v11AfterConfig() {
  // 章节数、最终关卡等可能变化：把联动值同步到 UI 文案。
  MODE_TAGLINE.story = `${STAGE_CFG.storyStageCount || 30} 关 · 章节剧情 · 顺序解锁`;
  MODE_TAGLINE.infinite = '层数递增 · 越找越离谱';

  v11RegisterEnemyArt();
  v11RegisterPlayerArt();
}

/* ---------------- 启动 / 断网 ---------------- */
async function v11BootGame() {
  if (V11_CONFIG.loading) return;
  V11_CONFIG.loading = true;
  V11_CONFIG.error = '';
  state = 'loading';
  V11_PAGES.pendingMode = null;
  try {
    await v11LoadRemoteConfig();
    state = 'title';
    const hint = lastSlotHint();
    if (hint) activateProfile(hint, true);
    v11SyncCanvasSize();
    showToast(`联网配置已就绪 · ${v11Version()}`, C.mint, 2.2);
  } catch (err) {
    V11_CONFIG.loading = false;
    V11_CONFIG.error = (err && err.message) || '网络不可用';
    state = 'offline';
  }
}

function v11DrawLoadingScreen(g, t) {

  }
  g.globalAlpha = 1;
  const cx = W / 2, cy = 300;
  g.save(); g.translate(cx, cy);
  drawCatHead(g, 0, 0, 58, 0, t);
  g.strokeStyle = withAlpha(C.gold, .55); g.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const a0 = t * 2.4 + i * TAU / 3;
    g.beginPath(); g.arc(0, 0, 104, a0, a0 + 1.1); g.stroke();

  const dots = '.'.repeat(1 + Math.floor(t * 2) % 3);

/* ---------------- 主页背景（可替换图片） ---------------- */
function v11EnsureBackground() {

    img.decoding = 'async';
    img.onload = () => { V11_BG.ready = true; };
    img.onerror = () => { V11_BG.failed = true; V11_BG.ready = false; };
    img.src = 'assets/bg_main.png';
    V11_BG.img = img;

}

function v11DrawHomeBackdrop(g, t) {
  v11EnsureBackground();

  } else {
    // 程序化兜底：大猫头 + 星星 + 毛线球

    drawCatHead(g, W * .58, 318, 128, 0, t);
    for (let i = 0; i < 12; i++) {
      const a = i * 2.1 + t * .15;
      drawStar(g, 110 + (i * 157) % 1080, 50 + (i * 83) % 600, 5 + i % 4, 2, 5, i % 2 ? C.gold : C.cream, null, 0, a);

/* ---------------- 更新日志 ---------------- */
function v11ChangelogRows() {
  const data = V11_CONFIG.changelog;
  if (!data || !Array.isArray(data.versions)) return [];
  const rows = [];
  const push = (text, kind, size, indent) => rows.push({ text, kind, size, indent });
  for (let vi = 0; vi < data.versions.length; vi++) {
    const ver = data.versions[vi];
    const current = ver.version === data.current || (vi === 0 && !data.current);
    const open = current || V11_PAGES.changelogOpen === ver.version;
    push(`${ver.version}${current ? '  · 当前版本' : ''}    ${ver.date || ''}`, 'version', 18, 0);
    if (!open) {
      push('点击展开这一版的四组条目', 'hint', 10, 22);
      continue;
    }
    const groups = [
      ['新增', ver.added, C.mint],
      ['优化', ver.improved, C.gold],
      ['修复', ver.fixed, C.coral],
      ['已知问题', ver.known, C.lavender],
    ];
    for (const [label, arr, color] of groups) {
      if (!Array.isArray(arr) || !arr.length) continue;
      push(label, 'group', 12, 22);
      for (const item of arr) push('· ' + item, 'item', 11, 40, color);
    }
    push('', 'space', 6, 0);
  }
  return rows;
}

  const rows = v11ChangelogRows();

  }
  const area = { x: 56, y: 108, w: 1120, h: 560 };
  let y = 0;
  const laid = [];
  for (const row of rows) {
    if (row.kind === 'version') { y += row.size + 12; laid.push({ row, y }); y += 6; }
    else if (row.kind === 'group') { laid.push({ row, y }); y += row.size + 10; }
    else if (row.kind === 'item') { laid.push({ row, y }); y += row.size + 7; }
    else if (row.kind === 'hint') { laid.push({ row, y }); y += row.size + 6; }
    else { y += row.size; }
  }
  const totalH = y + 16;
  const maxScroll = Math.max(0, totalH - area.h);

  if (maxScroll > 0) {

  }

  g.save();
  roundRectPath(g, area.x, area.y, area.w, area.h, 14); g.clip();
  const off = -V11_PAGES.changelogScroll;
  for (const { row, y: ry } of laid) {

    if (yy < area.y - 40 || yy > area.y + area.h + 40) continue;

      drawText(g, row.text, area.x + row.indent, yy + 8, 12, C.mint, { weight: 900 });
    } else if (row.kind === 'hint') {
      drawText(g, row.text, area.x + row.indent, yy + 6, 10, withAlpha(C.cream, .45), { weight: 600 });
    } else {
      drawText(g, row.text, area.x + row.indent, yy + 6, 11, withAlpha(C.cream, .78), { weight: 600 });
    }
  }
  g.restore();
  drawText(g, '滚轮 / ↑↓ 翻页 · Esc 返回主页', W / 2, 692, 10, withAlpha(C.cream, .42), { align: 'center', weight: 700 });

const V11_BESTIARY_PAGE_SIZE = 12;
let V11_BESTIARY_PAGE = 0;
let V11_SETTINGS_HOVER = null;

/* ---------------- 画布尺寸 / DPR / 全屏 ---------------- */
function v11IsFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
    V11_FS.pseudo || V11_FS.electronFull);
}

/* 竖屏手机上画布只有约 219px 高：把右下按钮与摇杆按 1.1~1.3 倍放大，
   让“冲刺”等小按钮的触摸热区也接近 44px。横屏保持原尺寸。 */
function v11SyncTouchLayout() {
  const portrait = v11CompactLayout() && window.innerHeight > window.innerWidth;
  TOUCH_JOY.r = portrait ? 84 : 76;
  TOUCH_JOY.knob = portrait ? 32 : 30;
  TOUCH_ATTACK.x = portrait ? 1170 : 1168;
  TOUCH_ATTACK.y = portrait ? 560 : 566;
  TOUCH_ATTACK.r = portrait ? 64 : 58;
  TOUCH_DASH.x = portrait ? 1030 : 1044;
  TOUCH_DASH.y = portrait ? 640 : 634;
  TOUCH_DASH.r = portrait ? 54 : 42;
  if (touchState.joyId === null) {
    touchState.joyX = TOUCH_JOY.x;
    touchState.joyY = TOUCH_JOY.y;
  }
}

function v11SyncCanvasSize() {
  const dpr = Math.min(2.5, Math.max(1, window.devicePixelRatio || 1));
  const vw = Math.max(240, window.innerWidth || W);
  const vh = Math.max(160, window.innerHeight || H);
  let cssW, cssH;
  if (v11IsFullscreen()) {
    const fit = Math.min(vw / W, vh / H);
    cssW = Math.floor(W * fit); cssH = Math.floor(H * fit);
  } else if (V11_FS.electron && window.nyanDesktop && window.nyanDesktop.setWindowScale) {
    // Electron：窗口本身由主进程按档位缩放，画布只负责填满可用区域。
    const fit = Math.min(1, vw / W, vh / H);
    cssW = Math.floor(W * fit); cssH = Math.floor(H * fit);
    try {
      const p = window.nyanDesktop.setWindowScale(settings.scale);
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* 旧外壳没有该接口时静默 */ }
  } else {
    const baseW = W * settings.scale;
    const baseH = H * settings.scale;
    const fit = Math.min(1, vw / baseW, vh / baseH);
    cssW = Math.max(240, Math.floor(baseW * fit));
    cssH = Math.max(135, Math.floor(baseH * fit));
  }
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  // 绘制分辨率跟随 DPR，最高 2560 宽，避免手机上糊成一片。
  const bw = Math.min(2560, Math.max(640, Math.round(cssW * dpr)));
  const bh = Math.max(1, Math.round(bw * H / W));
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw; canvas.height = bh;
  }
  ctx.setTransform(bw / W, 0, 0, bh / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
  V11_VIEW.cssW = cssW; V11_VIEW.cssH = cssH; V11_VIEW.k = bw / W;
  v11SyncTouchLayout();

  const stage = document.getElementById('stage');
  if (stage) {
    if (V11_FS.pseudo) {
      stage.style.position = 'fixed';
      stage.style.inset = '0';
      stage.style.background = '#0a0710';
    } else {
      stage.style.position = '';
      stage.style.inset = '';
      stage.style.background = '';
    }
  }
}

const V11_LEGACY_APPLY_VIEW_SCALE = applyViewScale;
applyViewScale = function () { v11SyncCanvasSize(); };

function v11EnterPseudoFullscreen() {
  V11_FS.pseudo = true;
  try {
    document.documentElement.classList.add('pseudo-fullscreen');
    document.body.classList.add('pseudo-fullscreen');
  } catch (e) { /* 忽略 */ }
  v11SyncCanvasSize();
  showToast('当前环境不支持真全屏 · 已启用伪全屏（浏览器栏仍在）', C.lavender, 2.8);
}

function v11ExitPseudoFullscreen() {
  V11_FS.pseudo = false;
  try {
    document.documentElement.classList.remove('pseudo-fullscreen');
    document.body.classList.remove('pseudo-fullscreen');
  } catch (e) { /* 忽略 */ }
  v11SyncCanvasSize();
}

function v11SetFullscreen(on) {
  if (V11_FS.electron) {
    if (window.nyanDesktop && window.nyanDesktop.setFullscreen) {
      V11_FS.electronFull = !!on;
      try {
        const p = window.nyanDesktop.setFullscreen(!!on);
        if (p && p.catch) p.catch(() => { V11_FS.electronFull = !on; v11SyncCanvasSize(); });
      } catch (e) { V11_FS.electronFull = !on; }
      setTimeout(v11SyncCanvasSize, 140);
      return;
    }
    showToast('桌面壳版本过低 · 无法切换全屏', C.coral, 2.4);
    return;
  }
  if (on) {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      v11SyncCanvasSize();
      return;
    }
    if (V11_FS.pseudo) { v11SyncCanvasSize(); return; }
    V11_FS.wasFullscreen = true;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen ||
      el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) {
      try {
        const p = req.call(el, { navigationUI: 'hide' });
        if (p && p.catch) p.catch(() => v11EnterPseudoFullscreen());
      } catch (e) {
        v11EnterPseudoFullscreen();
      }
    } else {
      v11EnterPseudoFullscreen();
    }
  } else {
    V11_FS.wasFullscreen = false;
    if (document.fullscreenElement) {
      try {
        const p = document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* 忽略 */ }
    } else if (document.webkitFullscreenElement) {
      try { document.webkitExitFullscreen(); } catch (e) { /* 忽略 */ }
    } else if (V11_FS.pseudo) {
      v11ExitPseudoFullscreen();
    }
  }
  v11SyncCanvasSize();
}

const V11_FS_ONCHANGE = function () {
  const still = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!still && V11_FS.wasFullscreen) {
    V11_FS.wasFullscreen = false;
    // Esc 退出全屏：先退出全屏，再进入暂停，避免与暂停状态打架。
    if (state === 'playing') {
      state = 'paused';
      shake = 0; flash = 0;
      clearInput();
      if (typeof releaseTouchControls === 'function') releaseTouchControls();
      showToast('已退出全屏 · 游戏已暂停', C.gold, 2.2);
    }
  }
  v11SyncCanvasSize();
};
document.addEventListener('fullscreenchange', V11_FS_ONCHANGE);
document.addEventListener('webkitfullscreenchange', V11_FS_ONCHANGE);
window.addEventListener('resize', () => { v11SyncCanvasSize(); });
window.addEventListener('orientationchange', () => { setTimeout(v11SyncCanvasSize, 220); });

  bg.addColorStop(0, '#0e0a18'); bg.addColorStop(.6, '#1f1430'); bg.addColorStop(1, '#3b2141');

  drawText(g, '模型图鉴', 52, 42, 30, C.cream, { weight: 900, line: 4 });
  const cells = v11BestiaryCells();
  const mobs = Object.keys(ENEMY_DEFS).filter(k => !ENEMY_DEFS[k].boss).length;

  drawText(g, `${FORMS.length} 阶玩家形态 · ${mobs} 种小怪 · ${bosses} 个章节 Boss · 全部程序化绘制`,
    54, 74, 11, withAlpha(C.cream, .65), { weight: 700 });

  const totalPages = Math.max(1, Math.ceil(cells.length / V11_BESTIARY_PAGE_SIZE));
  V11_BESTIARY_PAGE = clamp(V11_BESTIARY_PAGE, 0, totalPages - 1);
  const page = V11_BESTIARY_PAGE;
  drawText(g, `${page + 1} / ${totalPages} 页`, 1010, 74, 12, C.gold, { align: 'right', weight: 900 });

  const back = { x: 1040, y: 32, w: 184, h: 54 };
  const bh = pointRect(mouse, back);
  fillRound(g, back.x, back.y, back.w, back.h, 13, bh ? C.mint : withAlpha(C.mint, .82));
  strokeRound(g, back.x, back.y, back.w, back.h, 13, C.ink, 2.2);
  drawText(g, '← 返回', back.x + back.w / 2, back.y + back.h / 2, 14, C.ink, { align: 'center', weight: 900 });
  bestiaryRects.push({ id: 'back', ...back });

  const cols = 4, rows = 3, cardW = 248, cardH = 156, gapX = 24, gapY = 16;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2, startY = 104;
  const slice = cells.slice(page * V11_BESTIARY_PAGE_SIZE, (page + 1) * V11_BESTIARY_PAGE_SIZE);
  for (let i = 0; i < slice.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cardW + gapX);
    const y = startY + row * (cardH + gapY);
    const cell = slice[i];
    const accent = cell.kind === 'player' ? FORMS[cell.form].trim
      : (cell.def.boss ? C.coral : (THEMES[(cell.def.chapter || 1) - 1] || THEMES[0]).accent);
    g.save();
    fillRound(g, x + 4, y + 5, cardW, cardH, 14, withAlpha(C.ink, .35));
    fillRound(g, x, y, cardW, cardH, 14, withAlpha('#251733', .95));
    strokeRound(g, x, y, cardW, cardH, 14, withAlpha(accent, .55), 1.7);
    fillRound(g, x, y, cardW, 5, 2.5, accent);
    drawText(g, cell.chapter, x + 12, y + 18, 10, withAlpha(C.cream, .6), { weight: 700 });
    drawText(g, cell.tag, x + cardW - 12, y + 18, 10, accent, { align: 'right', weight: 900 });
    g.save();
    const cx = x + cardW / 2, cy = y + 78;
    roundRectPath(g, x + 8, y + 28, cardW - 16, 92, 10); g.clip();
    if (cell.kind === 'player') {
      const fake = Object.assign({}, BESTIARY_PLAYER_DUMMY, { form: cell.form, x: cx, y: cy + 8, r: 28 });
      drawPlayerSprite(g, fake, t, { alwaysVisible: true, blinkOffset: .8 + cell.form });
    } else {
      const d = cell.def;
      const fake = {
        x: cx, y: cy + 8, r: 26, def: d, ai: d.ai, boss: !!d.boss, color: d.color,
        action: 'idle', actionT: 0, chargeAngle: 0, enraged: false, moving: false,
        spawnTimer: 0, blinkIn: 1, dead: false, t: 0, projectiles: [], hp: d.hp || 10,
      };
      const fn = ENEMY_ART[d.art];
      g.save(); g.translate(cx, cy + 8);
      if (fn) fn(g, fake, t);
      else circle(g, 0, 0, 24, d.color || C.coral, C.ink, 4);
      g.restore();
    }
    g.restore();
    drawText(g, cell.name, x + cardW / 2, y + 138, 15, C.cream, { align: 'center', weight: 900 });
    g.restore();
  }

  const prev = { x: 430, y: 636, w: 150, h: 44 };
  const next = { x: 700, y: 636, w: 150, h: 44 };
  for (const [r, label, disabled, id] of [[prev, '‹ 上一页', page <= 0, 'prev'], [next, '下一页 ›', page >= totalPages - 1, 'next']]) {
    g.save();
    if (disabled) g.globalAlpha = .4;
    const hov = !disabled && pointRect(mouse, r);
    fillRound(g, r.x, r.y, r.w, r.h, 12, hov ? C.mint : withAlpha(C.cream, .14));
    strokeRound(g, r.x, r.y, r.w, r.h, 12, C.ink, 2);
    drawText(g, label, r.x + r.w / 2, r.y + r.h / 2, 14, C.cream, { align: 'center', weight: 900 });
    g.restore();
    if (!disabled) bestiaryRects.push({ id, ...r });
  }
  drawText(g, '剪影优先：每一只都有独立轮廓与行为 · 非换色复用', W / 2, 700, 10, withAlpha(C.cream, .5), { align: 'center', weight: 700 });
}

/* ---------------- 剧情选关（30 关 6×5） ---------------- */
function v11DrawStorySelectScreen(g, t) {
  storyStageRects = [];
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#140e22'); bg.addColorStop(.55, '#2a1a3d'); bg.addColorStop(1, '#4a2c4c');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 24; i++) {
    const a = i * 1.7 + t * .1;
    g.globalAlpha = .14 + Math.sin(t + i) * .06;
    drawStar(g, 30 + ((i * 149) % 1220), 24 + ((i * 91) % 670), 3 + i % 4, 1.4, 5, i % 3 ? C.cream : C.lavender, null, 0, a);
  }
  g.globalAlpha = 1;

  drawText(g, '剧情模式 · 选关', 52, 46, 30, C.cream, { weight: 900, line: 5 });
  const mp = modeProgressFor('story');
  const cleared = mp ? (mp.clearedStage || 0) : 0;
  const total = STAGE_CFG.storyStageCount || 30;
  drawText(g, `${total} 关全部可见 · 顺序解锁 · 每 3 关一次存档提示 · 只有本模式有剧情`,
    54, 78, 12, withAlpha(C.cream, .66), { weight: 700 });
  drawText(g, `已通关 ${cleared} / ${total}`, 1000, 48, 15, C.gold, { align: 'right', weight: 900 });

  const back = { x: 1040, y: 32, w: 184, h: 54 };
  const bh = pointRect(mouse, back);
  fillRound(g, back.x, back.y, back.w, back.h, 13, bh ? C.mint : withAlpha(C.mint, .82));
  strokeRound(g, back.x, back.y, back.w, back.h, 13, C.ink, 2.2);
  drawText(g, '← 返回主页', back.x + back.w / 2, back.y + back.h / 2, 14, C.ink, { align: 'center', weight: 900 });

  const unlocked = storyUnlockedStage();
  const cols = 6, cardW = 188, cardH = 100, gapX = 14, gapY = 8;
  const totalW = cols * cardW + (cols - 1) * gapX;
  const startX = (W - totalW) / 2, startY = 104;
  for (let stage = 1; stage <= total; stage++) {
    const idx = stage - 1;
    const col = idx % cols, row = Math.floor(idx / cols);
    const x = startX + col * (cardW + gapX);
    const y = startY + row * (cardH + gapY);
    const open = stage <= unlocked;
    const done = stage <= cleared;
    const boss = stage % (STAGE_CFG.bossEvery || 3) === 0;
    const chapter = Math.floor(idx / CHAPTER_STAGES);
    const theme = THEMES[chapter] || THEMES[0];
    const accent = open ? theme.accent : withAlpha(C.cream, .25);
    const hover = open && pointRect(mouse, { x, y, w: cardW, h: cardH });
    g.save();
    fillRound(g, x + 4, y + 5, cardW, cardH, 13, withAlpha(C.ink, .35));
    fillRound(g, x, y, cardW, cardH, 13, hover ? withAlpha(theme.accent, .22) : withAlpha('#261835', .94));
    strokeRound(g, x, y, cardW, cardH, 13, hover ? theme.accent : withAlpha(accent, .55), hover ? 3 : 1.8);
    fillRound(g, x, y, cardW, 5, 2.5, accent);
    drawText(g, stageLabel(stage, 'story'), x + 12, y + 32, 24, open ? C.cream : withAlpha(C.cream, .35), { weight: 900 });
    drawText(g, theme.name, x + 12, y + 54, 9, withAlpha(C.cream, open ? .68 : .3), { weight: 700 });
    if (boss) {
      fillRound(g, x + cardW - 58, y + 14, 46, 20, 10, withAlpha(C.coral, open ? .8 : .25));
      drawText(g, 'BOSS', x + cardW - 35, y + 24, 10, open ? C.cream : withAlpha(C.cream, .4), { align: 'center', weight: 900 });
    }
    if (done) {
      drawText(g, '✓ 已通关', x + 12, y + 80, 10, C.mint, { weight: 900 });
    } else if (open) {
      drawText(g, stage === Math.max(1, cleared + 1) ? '▶ 当前关卡' : '可挑战', x + 12, y + 80, 10, accent, { weight: 900 });
    } else {
      drawText(g, '锁定', x + 12, y + 80, 10, withAlpha(C.cream, .4), { weight: 800 });
    }
    const storyAt = STORY_CHAPTERS.find(ch => ch.stage === stage);
    if (storyAt) drawText(g, '剧情', x + cardW - 12, y + 80, 9, C.lavender, { align: 'right', weight: 900 });
    g.restore();
    if (open) storyStageRects.push({ stage, x, y, w: cardW, h: cardH });
  }
  drawText(g, '点击已解锁关卡开始 · 关卡进度自动写入检查点 · Esc 返回主页',
    W / 2, 684, 10, withAlpha(C.cream, .5), { align: 'center', weight: 700 });
  storyStageRects.push({ stage: 0, id: 'back', ...back });
}

const V11_LEGACY_DRAW_STORY_SELECT = drawStorySelectScreen;
drawStorySelectScreen = v11DrawStorySelectScreen;

/* ---------------- 页面跳转辅助 ---------------- */
function v11PageCursor(rects) {
  canvas.style.cursor = rects.some(r => r && pointRect(mouse, r)) ? 'pointer' : 'default';
}

function v11OpenChangelog(from) {
  V11_PAGES.changelogReturn = from || 'title';
  V11_PAGES.changelogOpen = null;
  V11_PAGES.changelogScroll = 0;
  state = 'changelog';
  clearInput();
  sfx('click');
}

function v11CloseChangelog() {
  const back = V11_PAGES.changelogReturn;
  state = back === 'settings' ? 'settings' : 'title';
  clearInput();
  sfx('click');
}

function v11ReturnFromModeSelect() {
  state = 'title';
  clearInput();
  sfx('click');
}

/* 存档页 / 模式页的确认弹窗：旧代码只在 title 状态下处理 confirm，这里补一份。 */
function v11HandleConfirmClick() {
  if (!confirmAction) return false;
  if (confirmRects[0] && pointRect(mouse, confirmRects[0])) {
    const act = confirmAction;
    confirmAction = null;
    act.run();
  } else if (confirmRects[1] && pointRect(mouse, confirmRects[1])) {
    confirmAction = null;
    sfx('click');
  }
  return true;
}

function v11AfterProfileChosen() {
  const pending = V11_PAGES.pendingMode;
  V11_PAGES.pendingMode = null;
  if (!profile) return;
  if (pending === '_modes') { v11OpenModeSelect('home'); return; }
  if (pending === 'story') { startModeFromHome('story'); }
  else if (pending && MODES[pending]) { startModeFromHome(pending); }
  else { state = 'saveSelect'; }
  clearInput();
}

/* ---------------- 顶部分发：标题 / 模式 / 存档 / 日志 ---------------- */
const V11_LEGACY_DRAW = draw;
draw = function () {
  const st = state;
  if (st === 'loading') {
    ctx.clearRect(0, 0, W, H);
    v11DrawLoadingScreen(ctx, time);
    canvas.style.cursor = 'default';
    return;
  }
  if (st === 'offline') {
    ctx.clearRect(0, 0, W, H);
    v11DrawOfflineScreen(ctx, time);
    v11PageCursor([V11_OFFLINE_RECT.r]);
    return;
  }
  if (st === 'title') {
    ctx.clearRect(0, 0, W, H);
    v11DrawTitleScreen(ctx, time);
    v11PageCursor(Object.keys(V11_HOME_RECTS).map(k => V11_HOME_RECTS[k]));
    drawVolumePill(ctx);
    return;
  }
  if (st === 'modeSelect') {
    ctx.clearRect(0, 0, W, H);
    v11DrawModeSelectScreen(ctx, time);
    v11PageCursor(confirmAction ? confirmRects : V11_MODE_RECTS);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'saveSelect') {
    ctx.clearRect(0, 0, W, H);
    v11DrawSaveSelectScreen(ctx, time);
    v11PageCursor(confirmAction ? confirmRects : (slotMenu ? slotMenuRects : V11_SAVE_RECTS));
    return;
  }
  if (st === 'changelog') {
    ctx.clearRect(0, 0, W, H);
    v11DrawChangelogScreen(ctx, time);
    v11PageCursor(V11_CHANGELOG_RECTS);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'settings') {
    ctx.clearRect(0, 0, W, H);
    v11DrawSettingsScreen(ctx, time);
    v11PageCursor(settingsRects);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'bestiary') {
    ctx.clearRect(0, 0, W, H);
    v11DrawBestiaryScreen(ctx, time);
    v11PageCursor(bestiaryRects);
    drawVolumePill(ctx);
    return;
  }
  if (st === 'storySelect') {
    ctx.clearRect(0, 0, W, H);
    v11DrawStorySelectScreen(ctx, time);
    v11PageCursor(storyStageRects);
    drawVolumePill(ctx);
    return;
  }
  V11_LEGACY_DRAW();
};

/* ---------------- 点击分发 ---------------- */
const V11_LEGACY_HANDLE_DOWN = handleDown;
handleDown = function (ev) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  updatePointer(ev);
  initAudio();
  const st = state;

  if (st === 'offline') {
    if (V11_OFFLINE_RECT.r && pointRect(mouse, V11_OFFLINE_RECT.r)) {
      sfx('click');
      v11BootGame();
    }
    return;
  }
  if (st === 'loading') return;

  if (st === 'title') {
    if (confirmAction) {
      V11_LEGACY_HANDLE_DOWN(ev);
      return;
    }
    const hit = Object.keys(V11_HOME_RECTS).find(k => V11_HOME_RECTS[k] && pointRect(mouse, V11_HOME_RECTS[k]));
    if (!hit) return;
    if (hit === 'start') {
      sfx('click');
      if (!profile) {
        showToast('先新建或载入一份档案，再选模式', C.coral, 2.6);
        V11_PAGES.pendingMode = '_modes';
        v11OpenSaveSelect('start');
      } else {
        V11_PAGES.pendingMode = null;
        v11OpenModeSelect('home');
      }
    } else if (hit === 'save') {
      v11OpenSaveSelect('home');
    } else if (hit === 'settings') {
      openSettings('title');
    } else if (hit === 'bestiary') {
      openBestiary();
    } else if (hit === 'changelog') {
      v11OpenChangelog('title');
    } else if (hit === 'exit') {
      sfx('click');
      if (window.nyanDesktop && window.nyanDesktop.quit) {
        try { window.nyanDesktop.quit(); } catch (e) { /* 忽略 */ }
      } else {
        showToast('网页版请直接关闭标签页 · 进度已保存在本机', C.lavender, 2.8);
      }
    }
    return;
  }

  if (st === 'modeSelect') {
    if (v11HandleConfirmClick()) return;
    const hit = V11_MODE_RECTS.find(r => pointRect(mouse, r));
    if (!hit) { if (pointRect(mouse, { x: 1040, y: 32, w: 184, h: 54 })) v11ReturnFromModeSelect(); return; }
    if (hit.id === 'back') { v11ReturnFromModeSelect(); return; }
    if (!profile) {
      V11_PAGES.pendingMode = hit.id;
      showToast('先选一份档案，再进入' + (MODES[hit.id] ? MODES[hit.id].name : '模式'), C.coral, 2.4);
      v11OpenSaveSelect('mode');
      return;
    }
    sfx('click');
    startModeFromHome(hit.id === 'story' ? 'story' : hit.id);
    clearInput();
    return;
  }

  if (st === 'saveSelect') {
    if (v11HandleConfirmClick()) return;
    if (slotMenu) {
      const hit = slotMenuRects.find(r => pointRect(mouse, r));
      if (!hit) { closeSlotMenu(); return; }
      const slot = slotMenu.slot;
      if (hit.id === 'load') {
        if (activateProfile(slot)) { closeSlotMenu(); v11AfterProfileChosen(); }
      } else if (hit.id === 'overwrite') {
        if (slotCache[slot]) {
          confirmAction = {
            title: `覆盖存档位 ${slot}？`,
            text: '当前档案的全部模式进度会整体写入该槽位，原有进度将被替换。',
            okLabel: '覆盖写入',
            run: () => { if (overwriteProfileAt(slot)) { closeSlotMenu(); } },
          };
        } else if (profile) {
          confirmAction = {
            title: `新建到存档位 ${slot}？`,
            text: '空槽位会写入当前档案的完整进度。',
            okLabel: '写入',
            run: () => { if (overwriteProfileAt(slot)) { closeSlotMenu(); } },
          };
        } else {
          showToast('当前没有档案 · 请选一个已有档案载入', C.coral, 2.4);
        }
        sfx('click');
      } else if (hit.id === 'delete') {
        confirmAction = {
          title: `删除存档位 ${slot}？`,
          text: '该槽位的五个模式进度会一起删除，无法恢复。',
          okLabel: '删除档案',
          run: () => { deleteProfileAt(slot); closeSlotMenu(); },
        };
        sfx('click');
      } else {
        closeSlotMenu(); sfx('click');
      }
      return;
    }
    const hit = V11_SAVE_RECTS.find(r => pointRect(mouse, r));
    if (!hit) {
      if (pointRect(mouse, { x: 1040, y: 32, w: 184, h: 54 })) { state = 'title'; clearInput(); sfx('click'); }
      return;
    }
    if (hit.id === 'back') { state = 'title'; clearInput(); sfx('click'); return; }
    if (hit.id === 'slot') {
      if (!slotCache[hit.slot]) {
        confirmAction = {
          title: `新建存档位 ${hit.slot}？`,
          text: '将创建一份包含五个模式空进度的新档案，并立即设为当前档案。',
          okLabel: '新建档案',
          run: () => { if (createProfileAt(hit.slot, false)) v11AfterProfileChosen(); },
        };
        sfx('click');
      } else {
        openSlotMenu(hit.slot);
      }
    }
    return;
  }

  if (st === 'changelog') {
    const hit = V11_CHANGELOG_RECTS.find(r => pointRect(mouse, r));
    if (hit && hit.id === 'back') { v11CloseChangelog(); return; }
    if (hit && hit.id === 'version') {
      V11_PAGES.changelogOpen = V11_PAGES.changelogOpen === hit.version ? null : hit.version;
      sfx('click');
    }
    return;
  }

  if (st === 'settings') {
    const hit = settingsRects.find(r => pointRect(mouse, r));
    if (!hit) return;
    if (hit.type === 'changelog') { v11OpenChangelog('settings'); return; }
    if (hit.type === 'scale') applyScaleSetting(hit.value);
    else if (hit.type === 'fps') applyFpsSetting(hit.value);
    else if (hit.type === 'mute') { setMuted(!settings.muted); showVolumePill(); sfx('click'); }
    else if (hit.type === 'master' || hit.type === 'sfx') {
      settingsDrag = hit.type;
      setSettingsSliderFromPointer(hit.type);
    } else if (hit.type === 'fullscreen') toggleFullscreen();
    else if (hit.type === 'save') saveSettingsWithNotice();
    else if (hit.type === 'bestiary') openBestiary();
    else if (hit.type === 'back') closeSettings();
    return;
  }

  if (st === 'bestiary') {
    const hit = bestiaryRects.find(r => pointRect(mouse, r));
    if (!hit) return;
    if (hit.id === 'back') closeBestiary();
    else if (hit.id === 'prev') { V11_BESTIARY_PAGE = Math.max(0, V11_BESTIARY_PAGE - 1); sfx('click'); }
    else if (hit.id === 'next') { V11_BESTIARY_PAGE = V11_BESTIARY_PAGE + 1; sfx('click'); }
    return;
  }

  if (st === 'storySelect') {
    const hit = storyStageRects.find(r => pointRect(mouse, r));
    if (!hit) return;
    if (hit.id === 'back' || hit.stage === 0) { state = 'title'; clearInput(); sfx('click'); return; }
    startStoryStage(hit.stage);
    return;
  }

  V11_LEGACY_HANDLE_DOWN(ev);
};

/* ---------------- 键盘 / 滚轮（capture 优先） ---------------- */
window.addEventListener('keydown', ev => {
  const code = ev.code;
  const st = state;

  if (code === 'Escape' && v11IsFullscreen()) {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    sfx('click');
    v11SetFullscreen(false);
    if (state === 'playing') {
      state = 'paused';
      shake = 0; flash = 0;
      clearInput();
      if (typeof releaseTouchControls === 'function') releaseTouchControls();
      showToast('已退出全屏 · 游戏已暂停', C.gold, 2.2);
    }
    return;
  }

  if (st === 'loading') {
    if (['Enter', 'Space', 'Escape'].includes(code)) {
      ev.preventDefault();
      ev.stopImmediatePropagation();
    }
    return;
  }
  if (st === 'offline') {
    if (code === 'Enter' || code === 'Space') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      sfx('click');
      v11BootGame();
    }
    return;
  }
  if (st === 'changelog') {
    const step = code === 'ArrowDown' ? 60 : (code === 'ArrowUp' ? -60 : 0);
    if (step) {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      v11ScrollChangelog(step);
      return;
    }
    if (code === 'Escape') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      v11CloseChangelog();
      return;
    }
    if (code === 'Home' || code === 'End') {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      V11_PAGES.changelogScroll = code === 'Home' ? 0 : 999999;
      return;
    }
    return;
  }
  if (st === 'modeSelect' && code === 'Escape') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    v11ReturnFromModeSelect();
    return;
  }
  if (st === 'saveSelect' && code === 'Escape') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    if (confirmAction) { confirmAction = null; sfx('click'); }
    else if (slotMenu) { closeSlotMenu(); sfx('click'); }
    else { state = 'title'; clearInput(); sfx('click'); }
    return;
  }
  if (st === 'storySelect' && code === 'Escape') {
    ev.preventDefault();
    ev.stopImmediatePropagation();
    state = 'title'; clearInput(); sfx('click');

function v11NearestEnemy(x, y, maxDist) {
  let best = null, bd = maxDist === undefined ? 1e9 : maxDist;
  for (const e of enemies) {
    if (e.dead || e.spawnTimer > 0) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd * bd) { bd = Math.sqrt(d); best = e; }
  }
  return best;
}

function v11LineHit(x1, y1, x2, y2, width, damage, opts) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  let hits = 0;
  for (const e of enemies.slice()) {
    if (e.dead || e.spawnTimer > 0) continue;
    const t = clamp(((e.x - x1) * dx + (e.y - y1) * dy) / (len * len), 0, 1);
    const px = x1 + dx * t, py = y1 + dy * t;
    if (Math.hypot(e.x - px, e.y - py) <= width + e.r * .7) {
      damageEnemy(e, damage, Object.assign({ fromX: x1, fromY: y1, kb: 60, kind: 'skill' }, opts || {}));
      hits++;
    }
  }
  return hits;
}
